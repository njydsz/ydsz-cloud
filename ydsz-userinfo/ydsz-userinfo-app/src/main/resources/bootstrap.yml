# =====================================================================
#  YDSZ 用户信息中心服务 App 端 bootstrap 配置（P1-2 双入口架构）
#  --------------------------------------------------------------------
#  端口：7002（对应 Web 端 9002 的移动端）
#  职责：移动端/应用端 API（用户认证、社交登录、个人资料管理）
#  依赖：Nacos 服务发现 / 配置中心、PostgreSQL、Redis
#
#  启动方式：
#    java -jar ydsz-userinfo-app.jar --ydsz.userinfo.platform=app
# =====================================================================

server:
  port: 7002
  max-http-request-header-size: 16KB
  servlet:
    context-path: /

spring:
  application:
    name: ydsz-userinfo-app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    web-application-type: servlet
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        enabled: true
        register-enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ydsz}
        group: ${NACOS_GROUP:${spring.profiles.active}}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        metadata:
          version: 26.10.01
          port: 7002
          platform: app
        ip-type: IPv4
      config:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ydsz}
        group: ${NACOS_GROUP:${spring.profiles.active}}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yaml
        refresh-enabled: true
        shared-configs:
          - data-id: ydsz-common.yml
            group: ${spring.profiles.active}
            refresh: true
          - data-id: ydsz-userinfo-app.yml
            group: ${spring.profiles.active}
            refresh: true
