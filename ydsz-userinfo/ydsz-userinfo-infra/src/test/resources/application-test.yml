#
# 集成测试 Profile（application-test.yml）— 用户模块
#
# 由 UserInfoTestInitializer @ActiveProfiles("test") 激活。
# datasource 连接信息由 @DynamicPropertySource 从 Testcontainers 注入。

spring:
  application:
    name: ydsz-userinfo-infra-test
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: "HikariPool-UserInfoIT"
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      idle-timeout: 30000
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration

ydsz:
  jdbc:
    enabled: true
    mapper-scan-packages:
      - com.njydsz.userinfo.infra.mapper
    dynamic-datasource:
      enabled: true
    slow-sql:
      enabled: false
    sql-audit:
      enabled: false
    safe-query:
      enabled: true

logging:
  level:
    com.njydsz: INFO
    org.testcontainers: INFO
    com.github.dockerjava: WARN
    org.springframework.boot.test: INFO
