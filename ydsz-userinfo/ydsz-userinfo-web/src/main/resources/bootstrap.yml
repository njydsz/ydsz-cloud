# =====================================================================
#  YDSZ 用户信息中心服务 bootstrap 配置
#  --------------------------------------------------------------------
#  端口：9002
#  职责：用户/部门/角色/权限/菜单/岗位/公司/语言/认证/授权/OAuth2
#  依赖：Nacos 服务发现 / 配置中心、PostgreSQL、Redis
#  说明：bootstrap.yml 在 application.yml 之前加载，用于提前连接 Nacos
#
#  ⚠️ P0-3: Redis 持久化配置要求
#  Token 黑名单依赖 Redis 存储，生产环境必须开启 AOF 持久化：
#    appendonly yes
#    appendfsync everysec
#  否则 Redis 重启后黑名单数据丢失，已登出的 token 可被重新使用
# =====================================================================

server:
  # HTTP 监听端口（按构建顺序 3/10）
  port: 9002
  max-http-request-header-size: 16KB
  servlet:
    context-path: /

spring:
  application:
    name: ydsz-userinfo
  profiles:
    # 默认 dev，可通过 -Dspring.profiles.active=dev|sit|uat|prod 或 ENV SPRING_PROFILES_ACTIVE 覆盖
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    web-application-type: servlet
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      # ---------- 服务注册 ----------
      discovery:
        enabled: true
        register-enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ydsz}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        metadata:
          version: 26.09.01
          port: 9002
        ip-type: IPv4
      # ---------- 配置中心 ----------
      config:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ydsz}
        group: ${NACOS_GROUP:${spring.profiles.active}}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yaml
        refresh-enabled: true
        shared-configs:
          - data-id: ydsz-common.yaml
            group: ${spring.profiles.active}
            refresh: true
          - data-id: ydsz-userinfo.yml
            group: ${spring.profiles.active}
            refresh: true

ydsz:
  # P2-2: 安全事件自动响应（BRUTE_FORCE → 滑动窗口 → 自动 IP 封禁）
  # 登录失败时 AuthServiceImpl 发布 BRUTE_FORCE 事件 → SecurityEventAggregator 统计
  # → 同一 IP 窗口内超过阈值 → IpAccessService.block() → IpAccessFilter 拦截后续请求
  safe:
    ip-access:
      enabled: true
      mode: BLACKLIST
    auto-block:
      enabled: true
      threshold: 10
      window-seconds: 60

    # P2-3: 字段级加密（@EncryptField 试点）
    # 为 UserAccount.realName 提供 AES-256-GCM 字段级加密
    # ⚠️ P0-1: 禁止硬编码密钥。密钥通过环境变量 YDSZ_FIELD_ENC_KEY_V1 注入
    #（Nacos 加密配置或 K8s Secret），未配置时 common-safe 启动 fail-fast，防止默认密钥上线。
    field-encryption:
      enabled: true
      default-key-version: 1
      failure-strategy: THROW
      masked-value: "****"
      keys:
        1: ${YDSZ_FIELD_ENC_KEY_V1:}

  # P1-2: 多租户隔离（ydsz-common-tenant）
  # 渐进式启用：enabled=false（默认）时无任何租户逻辑；tenant_id 数据就绪后置 true 一键开启
  # ROW 级隔离：SQL 拦截器自动追加 WHERE tenant_id = ?，JWT claim tenantId / X-Tenant-Id header 双通道解析
  tenant:
    enabled: false
    mode: SINGLE
    tenant-column: tenant_id
    default-claim: tenantId
    default-header: X-Tenant-Id
    super-tenant-id: "0"
    system-tenant-id: "1"
    # 无需租户上下文的公开/内部端点（登录前无法解析 tenantId）
    anon-urls:
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /api/v1/captcha
      - /api/v1/self-service
      - /api/v1/oauth2
      - /api/internal
    # 全局基础字典表不参与租户隔离
    ignore-tables:
      - ydsz_company
      - ydsz_department
      - ydsz_post
      - ydsz_language

  # P0-6: 内部接口服务端二次校验（网关白名单之外的最后一道防线）
  # enabled=true 时 /api/internal/** 必须携带 X-Internal-Call: true 请求头
  # 各业务模块 Feign 客户端统一注入该头后即可开启（渐进式启用）
  userinfo:
    internal-call:
      enabled: false
      header-name: X-Internal-Call

  # P2-3: API 版本管理机制
  web:
    api-version:
      enabled: true
      default-version: "1"
      strategy: HEADER
      header-name: X-API-Version
      sunset-headers: true

# JSON 引擎配置（ydsz-common-json）
  json:
    enabled: true
    date-format: yyyy-MM-dd HH:mm:ss
    naming-strategy: LOWER_CAMEL_CASE
    write-nulls: false
    monitoring-enabled: true
    warmup-classes:
      - com.njydsz.userinfo.domain.vo.LoginVO
      - com.njydsz.userinfo.domain.vo.UserAccountVO

  # P0: JDBC 安全加固（ydsz-common-jdbc）
  jdbc:
    # SQL 防火墙：拦截 DDL（DROP/TRUNCATE）、无 WHERE 写操作、多语句注入、GRANT/REVOKE
    sql-firewall:
      enabled: true
      block-drop-table: true
      block-truncate: true
      block-delete-without-where: true
      block-update-without-where: true
      block-multi-statement: true
      block-permission-ops: true
    # 分页安全上限：防止 pageSize=999999 导致全表扫描 OOM
    pagination:
      max-limit: 500
    # P1: 慢 SQL 全局检测
    slow-sql:
      enabled: true
      threshold-millis: 500
      alert-threshold-millis: 2000
    # P2: SQL 审计（写操作落盘备查）
    sql-audit:
      enabled: true
      audit-select: false
      audit-insert: true
      audit-update: true
      audit-delete: true
      log-parameters: true
      max-parameter-length: 500

  # 安全告警配置
  # 安全告警系统：基于风险评分的异常行为告警，支持暴力破解/密码喷洒检测
  # 启用后自动监听安全事件并触发告警通知
  security:
    alert:
      # 告警去重时间窗口（秒），默认 300 秒（5 分钟）
      dedup-ttl-seconds: 300
      # IP 维度告警去重时间窗口（秒），默认 180 秒（3 分钟）
      ip-dedup-ttl-seconds: 180
      # 暴力破解检测阈值（同一 IP 5 分钟内失败次数），默认 10 次
      brute-force-threshold: 10
      # 密码喷洒检测阈值（同一 IP 尝试不同用户数），默认 5 个
      password-spray-threshold: 5
      aggregation:
        # 聚合分析定时任务是否启用
        enabled: true
        # 聚合分析 cron 表达式，默认每 5 分钟执行一次
        cron: "0 */5 * * * ?"
