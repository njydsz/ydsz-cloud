# =====================================================================
#  YDSZ 用户信息中心服务 bootstrap 配置
#  --------------------------------------------------------------------
#  端口：9002
#  职责：用户/部门/角色/权限/菜单/岗位/公司/语言/认证/授权/OAuth2
#  依赖：Nacos 服务发现 / 配置中心、PostgreSQL、Redis
#  说明：bootstrap.yml 在 application.yml 之前加载，用于提前连接 Nacos
# =====================================================================

server:
  # HTTP 监听端口（按构建顺序 3/10）
  port: 9002
  max-http-request-header-size: 16KB
  servlet:
    context-path: /

spring:
  application:
    name: ydsz-userinfo
  profiles:
    # 默认 dev，可通过 -Dspring.profiles.active=dev|sit|uat|prod 或 ENV SPRING_PROFILES_ACTIVE 覆盖
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    web-application-type: servlet
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      # ---------- 服务注册 ----------
      discovery:
        enabled: true
        register-enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ydsz}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        metadata:
          version: 1.0.0
          port: 9002
        ip-type: IPv4
      # ---------- 配置中心 ----------
      config:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ydsz}
        group: ${NACOS_GROUP:${spring.profiles.active}}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yaml
        refresh-enabled: true
        shared-configs:
          - data-id: ydsz-common.yaml
            group: ${spring.profiles.active}
            refresh: true
          - data-id: ydsz-userinfo.yml
            group: ${spring.profiles.active}
            refresh: true

ydsz:
  # P2-2: 安全事件自动响应（BRUTE_FORCE → 滑动窗口 → 自动 IP 封禁）
  # 登录失败时 AuthServiceImpl 发布 BRUTE_FORCE 事件 → SecurityEventAggregator 统计
  # → 同一 IP 窗口内超过阈值 → IpAccessService.block() → IpAccessFilter 拦截后续请求
  safe:
    ip-access:
      enabled: true
      mode: BLACKLIST
    auto-block:
      enabled: true
      threshold: 10
      window-seconds: 60

  # P2-3: 字段级加密（@EncryptField 试点）
  # 为 UserAccount.realName 提供 AES-256-GCM 字段级加密
  # ⚠️ 生产环境密钥应通过 Nacos 加密配置或 K8s Secret 注入，禁止硬编码
    field-encryption:
      enabled: true
      default-key-version: 1
      failure-strategy: THROW
      masked-value: "****"
      keys:
        1: "fbQujnuiM1o99Ds4mK8VqyeLgRyI25gtL8e+irNglLM="

  # P2-3: API 版本管理机制
  web:
    api-version:
      enabled: true
      default-version: "1"
      strategy: HEADER
      header-name: X-API-Version
      sunset-headers: true

# JSON 引擎配置（ydsz-common-json）
  json:
    enabled: true
    date-format: yyyy-MM-dd HH:mm:ss
    naming-strategy: LOWER_CAMEL_CASE
    write-nulls: false
    monitoring-enabled: true
    warmup-classes:
      - com.njydsz.userinfo.domain.vo.LoginVO
      - com.njydsz.userinfo.domain.entity.UserAccount

  # P0: JDBC 安全加固（ydsz-common-jdbc）
  jdbc:
    # SQL 防火墙：拦截 DDL（DROP/TRUNCATE）、无 WHERE 写操作、多语句注入、GRANT/REVOKE
    sql-firewall:
      enabled: true
      block-drop-table: true
      block-truncate: true
      block-delete-without-where: true
      block-update-without-where: true
      block-multi-statement: true
      block-permission-ops: true
    # 分页安全上限：防止 pageSize=999999 导致全表扫描 OOM
    pagination:
      max-limit: 500
    # P1: 慢 SQL 全局检测
    slow-sql:
      enabled: true
      threshold-millis: 500
      alert-threshold-millis: 2000
    # P2: SQL 审计（写操作落盘备查）
    sql-audit:
      enabled: true
      audit-select: false
      audit-insert: true
      audit-update: true
      audit-delete: true
      log-parameters: true
      max-parameter-length: 500
