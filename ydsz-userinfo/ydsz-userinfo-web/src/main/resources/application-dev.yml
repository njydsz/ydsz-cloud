# === 本地配置（绕过 Nacos） ===
spring:
  config:
    import:
      - "file:D:/Code/open/ydsz-cloud/docs/nacos-config/ydsz-common.yml"
      - "file:D:/Code/open/ydsz-cloud/docs/nacos-config/ydsz-userinfo-web.yml"
  main:
    allow-circular-references: true
    lazy-initialization: true

# 禁用 WebSocket（本地开发不需要，避免 TaskScheduler 注入冲突导致 "Heartbeat values configured but no TaskScheduler provided"）
ydsz:

datasource:
  hikari:
    connection-timeout: 5000
    maximum-pool-size: 10
logging:
  level:
    com.njydsz: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework: INFO
    root: INFO
ydsz:
  local-dev: true
  i18n:
    validate-on-startup: false
  auth:
    token:
      # 本地开发用 JWT 密钥（至少 256 bits / 32 bytes），生产环境应通过 Nacos 配置中心注入
      secret-key: devSecretKeyForLocalDevelopmentOnly1234567890abcdefghijklmnopqr
