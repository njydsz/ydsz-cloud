# === 本地配置（绕过 Nacos） ===
spring:
  config:
    import:
      - "optional:file:${YDSZ_NACOS_CONFIG_DIR:../../docs/nacos-config}/ydsz-common.yml"
      - "optional:file:${YDSZ_NACOS_CONFIG_DIR:../../docs/nacos-config}/ydsz-userinfo-web.yml"
      # 本地凭据（未入库，见 ydsz-config.local.yml.example）；占位符在此统一解析，故顺序不影响结果
      - "optional:file:${YDSZ_NACOS_CONFIG_DIR:../../docs/nacos-config}/ydsz-config.local.yml"
  main:
    allow-circular-references: true
    lazy-initialization: true

datasource:
  hikari:
    connection-timeout: 5000
    maximum-pool-size: 10
logging:
  level:
    com.njydsz: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework: INFO
    root: INFO
ydsz:
  websocket:
    enabled: false
  local-dev: true
  i18n:
    validate-on-startup: false
  auth:
    token:
      # JWT 签名密钥：与网关必须一致，统一由 YDSZ_JWT_SECRET 注入（OS 环境变量或本地未入库 override）
      # 缺失时 TokenProperties.validate() 直接阻止启动，不提供任何默认值
      secret-key: ${YDSZ_JWT_SECRET:}