# === 本地配置（绕过 Nacos） ===
spring:
  config:
    import:
      - "file:D:/Code/open/ydsz-cloud/docs/nacos-config/ydsz-common.yml"
      - "file:D:/Code/open/ydsz-cloud/docs/nacos-config/ydsz-agent-web.yml"
  main:
    allow-circular-references: true
    lazy-initialization: true

datasource:
  hikari:
    connection-timeout: 5000
    maximum-pool-size: 10
logging:
  level:
    com.njydsz: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework: INFO
    root: INFO
ydsz:
  i18n:
    validate-on-startup: false
  websocket:
    enabled: false
  agent:
    approval:
      pause-on-sensitive: false
    llm:
      timeout-seconds: 120
    a2a:
      enabled: false
  local-dev: true
