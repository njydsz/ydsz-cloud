# git-cliff 配置（Conventional Commits → CHANGELOG.md）

[changelog]
header = """
# Changelog

基于 [Conventional Commits](https://www.conventionalcommits.org) 自动生成。
"""
body = """
{% for group, commits in commits | group_by(commit.config.scope) %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}{% if commit.scope %} ({{ commit.scope }}){% endif %}
{% endfor %}
{% endfor %}
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "<!-- 新功能 -->" },
  { message = "^fix", group = "<!-- 缺陷修复 -->" },
  { message = "^perf", group = "<!-- 性能优化 -->" },
  { message = "^refactor", group = "<!-- 重构 -->" },
  { message = "^docs", group = "<!-- 文档 -->" },
  { message = "^test", group = "<!-- 测试 -->" },
  { message = "^chore", group = "<!-- 杂项 -->" },
  { message = "^build", group = "<!-- 构建 -->" },
  { message = "^ci", group = "<!-- CI/CD -->" },
  { message = "^style", group = "<!-- 代码风格 -->" },
  { body = "^$", group = "<!-- 其他 -->" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = "v0.0.1"
sort_commits = "newest"
