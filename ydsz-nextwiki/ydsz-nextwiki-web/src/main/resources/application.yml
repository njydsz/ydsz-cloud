# NextWiki 网盘知识库服务本地配置
# 公共配置（mybatis-plus / management / springdoc / datasource / redis）由 Nacos 共享配置
# ydsz-common.yaml 提供，此处仅保留服务私有配置与 override

# 本地覆盖端口，实际运行时由 bootstrap.yml 中的 server.port=9003 决定
server:
  port: 9003

spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

# NextWiki 配置（生产环境由 Nacos ydsz-nextwiki.yml 覆盖）
nextwiki:
  upload:
    max-file-size: 524288000
    allowed-types: ""
    conflict-strategy: KEEP_BOTH
    chunk-temp-dir: ${java.io.tmpdir}/nextwiki-chunk
  preview:
    libreoffice-path: ${LIBREOFFICE_PATH:soffice}
    temp-dir: ${java.io.tmpdir}/nextwiki-preview
  thumbnail:
    temp-dir: ${java.io.tmpdir}/nextwiki-thumbnail
  ai:
    llm-enabled: false
    llm-api-url: ${LLM_API_URL:}
    llm-api-key: ${LLM_API_KEY:}
  cdn:
    enabled: false
    provider: aliyun
    domain: ${CDN_DOMAIN:}
    access-key: ${CDN_ACCESS_KEY:}
    secret-key: ${CDN_SECRET_KEY:}
  virus-scan:
    enabled: false
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
  ocr:
    enabled: false
    provider: tesseract
    tesseract-path: ${TESSERACT_PATH:tesseract}
    language: chi_sim+eng
  download:
    rate-limit-per-minute: 30
    ip-rate-limit-per-minute: 100
    signed-url-expire-seconds: 3600
  wopi:
    editor-url: ${WOPI_EDITOR_URL:}
  # P1-2: Netty TCP 推送通道（协作编辑实时同步）
  tcp-push:
    enabled: false
    port: 9124

# 统一线程池配置（ydsz-common-thread）
ydsz:
  # JSON 引擎配置（ydsz-common-json）
  json:
    enabled: true
    date-format: yyyy-MM-dd HH:mm:ss
    naming-strategy: LOWER_CAMEL_CASE
    write-nulls: false
    monitoring-enabled: true
    warmup-classes:
      - com.njydsz.nextwiki.domain.vo.FileNodeVO
      - com.njydsz.nextwiki.domain.vo.ShareLinkVO
      - com.njydsz.nextwiki.server.service.ChunkUploadApplicationService
  thread:
    enabled: true
    pools:
      # P2-003: JDK 21 虚拟线程试点（nextwiki-task 改为 VIRTUAL — IO 密集型异步任务友好）
      nextwikiTask:
        type: VIRTUAL
        thread-name-prefix: nextwiki-async-
        await-termination-seconds: 60
      nextwikiSchedule:
        core-size: 2
        max-size: 4
        queue-capacity: 100
        thread-name-prefix: nextwiki-sched-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 60
        keep-alive-seconds: 60
      nextwikiBatchImport:
        core-size: 5
        max-size: 5
        queue-capacity: 200
        thread-name-prefix: nextwiki-batch-import-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 30
        keep-alive-seconds: 60

  # 慢 SQL 监控
  jdbc:
    slow-sql:
      enabled: true
      threshold-millis: 500
      alert-threshold-millis: 2000
  # P2-2: 搜索引擎 PG 索引表名（各模块独立表，避免共用默认 ydzs_wiki_search_index）
  search:
    pg:
      index-table: ydsz_nextwiki_search_index

