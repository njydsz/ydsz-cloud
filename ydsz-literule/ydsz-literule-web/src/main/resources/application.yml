# YDSZ 规则引擎服务本地配置
# 公共配置（mybatis-plus / management / springdoc / datasource / redis）由 Nacos 共享配置
# ydsz-common.yaml 提供，此处仅保留服务私有配置

# 规则引擎核心配置（生产环境由 Nacos ydsz-literule.yaml 覆盖）
ydsz:
  # JSON 引擎配置（ydsz-common-json）
  json:
    enabled: true
    date-format: yyyy-MM-dd HH:mm:ss
    naming-strategy: LOWER_CAMEL_CASE
    write-nulls: false
    monitoring-enabled: true
    use-big-decimal: true
    safe-mode: true
    warmup-classes:
      - com.njydsz.literule.domain.api.RuleDefinition
      - com.njydsz.literule.server.spi.RuleVersion
      - com.njydsz.literule.server.version.RuleVersionDiff
      - com.njydsz.literule.domain.entity.RulePack
      - com.njydsz.literule.domain.entity.RuleChainGraph
  # 统一线程池配置（common-thread）
  thread:
    enabled: true
    pools:
      ruleParallel:
        core-size: 4
        max-size: 8
        queue-capacity: 200
        thread-name-prefix: ydsz-rule-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 30
      ruleTimeout:
        core-size: 2
        max-size: 4
        queue-capacity: 100
        thread-name-prefix: ydsz-rule-timeout-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 30
      ruleChain:
        core-size: 2
        max-size: 4
        queue-capacity: 100
        thread-name-prefix: ydsz-rule-chain-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 30
      factProvider:
        core-size: 2
        max-size: 8
        queue-capacity: 200
        thread-name-prefix: ydsz-fact-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 30
      modelInput:
        core-size: 2
        max-size: 8
        queue-capacity: 200
        thread-name-prefix: ydsz-model-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 30
  literule:
    # ---------- 核心开关 ----------
    auto-register-builtin-rules: true
    hot-reload-enabled: true
    stats-enabled: true
    dry-run-enabled: true
    sandbox-enabled: true
    trace-enabled: true
    trace-queue-capacity: 5000
    trace-batch-size: 100
    trace-flush-interval-ms: 2000
    rule-timeout-ms: 0
    canary-enabled: true
    conflict-detection-enabled: true
    conflict-detection-block-on-error: true
    environment: default
    # ---------- 注解扫描基包（逗号分隔） ----------
    annotation-scan-base-packages: ""
    # ---------- 健康检查 ----------
    health-enabled: true
    # ---------- 熔断器 ----------
    circuit-breaker-error-rate: 0.5
    circuit-breaker-min-evaluations: 100
    circuit-breaker-open-state-ms: 30000
    # ---------- 多级缓存 ----------
    cache:
      enabled: true
      l1-ttl-seconds: 60
      l1-max-size: 1000
      l2-enabled: true
      l2-ttl-seconds: 300
    # ---------- 数据源 ----------
    rule-source:
      type: db
      watch-enabled: true
    # ---------- 分布式执行（默认关闭，单实例够用） ----------
    distributed:
      enabled: false
      virtual-nodes: 150
      refresh-interval-ms: 10000
      heartbeat-timeout-ms: 30000
      heartbeat-interval-ms: 5000
    # ---------- 规则+模型融合（默认关闭） ----------
    model:
      enabled: false
      timeout-ms: 100
      fallback-on-error: true
      mock-enabled: false
    # ---------- 动态事实采集（默认关闭） ----------
    fact:
      enabled: false
      timeout-ms: 200
      fallback-on-error: true
    # ---------- 高性能优化（默认关闭，按需开启） ----------
    performance:
      cache-enabled: false
      cache-ttl-seconds: 300
      cache-max-size: 10000
      parallel-enabled: false
      parallel-pool-size: 0
      parallel-threshold: 50
      slow-rule-threshold-ms: 0
    # ---------- 生命周期管理 ----------
    lifecycle:
      enabled: true
      dormant-min-evaluations: 1000
      high-error-rate-threshold: 0.30
      stale-disabled-days: 90
      low-impact-trigger-rate: 0.001
      min-sample-size: 500
    # ---------- CEP 引擎 ----------
    cep:
      enabled: true

  # P0: JDBC 安全加固（ydsz-common-jdbc）
  jdbc:
    # SQL 防火墙：拦截 DDL（DROP/TRUNCATE）、无 WHERE 写操作、多语句注入、GRANT/REVOKE
    sql-firewall:
      enabled: true
      block-drop-table: true
      block-truncate: true
      block-delete-without-where: true
      block-update-without-where: true
      block-multi-statement: true
      block-permission-ops: true
    # 分页安全上限：防止 pageSize=999999 导致全表扫描 OOM
    pagination:
      max-limit: 500
    # P1: 慢 SQL 全局检测
    slow-sql:
      enabled: true
      threshold-millis: 500
      alert-threshold-millis: 2000
    # P2: SQL 审计（写操作落盘备查）
    sql-audit:
      enabled: true
      audit-select: false
      audit-insert: true
      audit-update: true
      audit-delete: true
      log-parameters: true
      max-parameter-length: 500
