# ============================================================
# PMIS Chaos Mesh Workflow — Chaos Night 自动化调度（P2-13）
# ------------------------------------------------------------
# 使用 Chaos Mesh Workflow CRD 编排多步骤混沌实验：
#   1. 实验前：HTTP 健康检查（steady state hypothesis）
#   2. 串行执行 5 类故障注入（每步之间再次健康检查）
#   3. 实验后：最终健康检查 + 生成报告
#   4. 任一步骤健康检查失败 → 立即中止整个 Workflow
#
# 调度策略：
#   - 仅在 Staging 环境运行（生产环境永不启用）
#   - 周六 02:00 Asia/Shanghai（业务低峰期）
#   - 单次完整执行约 30 分钟
#
# 前提条件：
#   - Chaos Mesh 已安装（v2.7.0+）
#   - chaos-mesh 命名空间已创建
#   - chaos-mesh 已开启 workflow-controller（默认开启）
#
# 使用方式：
#   kubectl apply -f deploy/chaos/chaos-workflow.yaml
#   kubectl describe workflow chaos-night -n chaos-mesh
#   kubectl-chaos logs chaos-night -n chaos-mesh
# ============================================================
apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: chaos-night
  namespace: chaos-mesh
  labels:
    experiment: chaos-night
    app.kubernetes.io/part-of: ydsz-pmis
spec:
  entry: chaos-night-entry
  templates:
    # -----------------------------------------------------
    # 入口节点：调度条件 + 串行编排
    # -----------------------------------------------------
    - name: chaos-night-entry
      templateType: Serial
      children:
        - pre-check-health
        - exp-network-delay-userinfo
        - exp-pod-kill-gateway
        - exp-network-partition-workflow-project
        - exp-cpu-stress-project
        - exp-dns-error-message
        - post-check-health

    # -----------------------------------------------------
    # Steady State Hypothesis: 实验前健康检查
    # 通过 HTTP 请求验证 5 个核心服务 /actuator/health 返回 200
    # 任一失败则中止整个 Workflow
    # -----------------------------------------------------
    - name: pre-check-health
      templateType: Task
      task:
        container:
          image: curlimages/curl:8.10.1
          command:
            - sh
            - "-c"
            - |
              set -e
              echo "[Chaos Night] Pre-experiment health check..."
              for svc in gateway:9000 userinfo:9001 system:9002 project:9003 message:9004; do
                host=$(echo $svc | cut -d: -f1)
                port=$(echo $svc | cut -d: -f2)
                echo "  - Checking ${host}:${port}/actuator/health"
                curl -sf --max-time 5 "http://${host}.${host}.pmis.svc.cluster.local:${port}/actuator/health" > /dev/null \
                  || { echo "  FAIL: ${host} unhealthy, aborting chaos night"; exit 1; }
                echo "  OK: ${host} healthy"
              done
              echo "[Chaos Night] All services healthy, proceeding with experiments."

    # -----------------------------------------------------
    # 实验 1: userinfo 网络延迟（200ms ± 50ms jitter）
    # 验证 Feign 重试 + Sentinel 熔断 + 客户端超时
    # -----------------------------------------------------
    - name: exp-network-delay-userinfo
      templateType: NetworkChaos
      networkChaos:
        action: delay
        mode: all
        selector:
          namespaces:
            - pmis
          labelSelectors:
            app: ydsz-pmis-userinfo
        delay:
          latency: "200ms"
          correlation: "100"
          jitter: "50ms"
        duration: "3m"

    # -----------------------------------------------------
    # 实验 2: gateway Pod Kill（随机 1 个副本）
    # 验证 K8s 自愈 + readinessProbe + 滚动更新
    # -----------------------------------------------------
    - name: exp-pod-kill-gateway
      templateType: PodChaos
      podChaos:
        action: pod-kill
        mode: one
        selector:
          namespaces:
            - pmis
          labelSelectors:
            app: ydsz-pmis-gateway
        duration: "30s"

    # -----------------------------------------------------
    # 实验 3: workflow ↔ project 网络分区
    # 验证跨服务调用的降级路径 + Feign FallbackFactory
    # -----------------------------------------------------
    - name: exp-network-partition-workflow-project
      templateType: NetworkChaos
      networkChaos:
        action: partition
        mode: all
        direction: to
        selector:
          namespaces:
            - pmis
          labelSelectors:
            app: ydsz-pmis-workflow
        target:
          selector:
            namespaces:
              - pmis
            labelSelectors:
              app: ydsz-pmis-project
          mode: all
        duration: "2m"

    # -----------------------------------------------------
    # 实验 4: project CPU 压力（2 worker @ 80% load）
    # 验证 HPA 弹性扩容 + 资源 limit 生效
    # -----------------------------------------------------
    - name: exp-cpu-stress-project
      templateType: StressChaos
      stressChaos:
        mode: one
        selector:
          namespaces:
            - pmis
          labelSelectors:
            app: ydsz-pmis-project
        stressors:
          cpu:
            workers: 2
            load: 80
        duration: "3m"

    # -----------------------------------------------------
    # 实验 5: message 服务 DNS 错误注入
    # 验证服务发现韧性 + Nacos 客户端缓存
    # -----------------------------------------------------
    - name: exp-dns-error-message
      templateType: DNSChaos
      dnsChaos:
        action: error
        mode: all
        selector:
          namespaces:
            - pmis
          labelSelectors:
            app: ydsz-pmis-message
        duration: "90s"

    # -----------------------------------------------------
    # Steady State Hypothesis: 实验后健康检查
    # 等待 60s 让系统自愈，再验证 5 个核心服务健康
    # -----------------------------------------------------
    - name: post-check-health
      templateType: Task
      task:
        container:
          image: curlimages/curl:8.10.1
          command:
            - sh
            - "-c"
            - |
              echo "[Chaos Night] Waiting 60s for auto-healing..."
              sleep 60
              echo "[Chaos Night] Post-experiment health check..."
              failures=0
              for svc in gateway:9000 userinfo:9001 system:9002 project:9003 message:9004; do
                host=$(echo $svc | cut -d: -f1)
                port=$(echo $svc | cut -d: -f2)
                if curl -sf --max-time 5 "http://${host}.${host}.pmis.svc.cluster.local:${port}/actuator/health" > /dev/null; then
                  echo "  OK: ${host} healthy"
                else
                  echo "  FAIL: ${host} still unhealthy after 60s recovery"
                  failures=$((failures + 1))
                fi
              done
              if [ $failures -gt 0 ]; then
                echo "[Chaos Night] ${failures} service(s) failed to recover — requires manual investigation"
                exit 1
              fi
              echo "[Chaos Night] All services recovered. Experiment successful."
