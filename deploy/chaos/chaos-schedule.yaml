# ============================================================
# YDSZ Chaos Mesh Schedule — Chaos Night 定期触发（P2-13）
# ------------------------------------------------------------
# 每周六 02:00 (Asia/Shanghai) 自动触发 chaos-night Workflow,
# 业务低峰期执行约 30 分钟,验证系统韧性。
#
# 仅在 Staging/UAT 环境启用:
#   kubectl apply -f deploy/chaos/chaos-schedule.yaml
# 生产环境切勿启用!
#
# 查看执行历史:
#   kubectl describe schedule chaos-night-weekly -n chaos-mesh
# 暂停调度:
#   kubectl patch schedule chaos-night-weekly -n chaos-mesh \
#     --type merge -p '{"spec":{"concurrencyPolicy":"Forbid","historyLimit":0}}'
# 手动触发一次:
#   kubectl create job --from=cronjob/chaos-night-trigger -n chaos-mesh chaos-night-manual
# ============================================================
---
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: chaos-night-weekly
  namespace: chaos-mesh
  labels:
    experiment: chaos-night
    app.kubernetes.io/part-of: ydsz
spec:
  # 周六 02:00 (Asia/Shanghai = UTC+8, UTC 18:00 周五)
  # Cron 格式: 分 时 日 月 周
  schedule: "0 18 * * 5"
  # 历史记录保留数(避免 etcd 膨胀)
  historyLimit: 3
  # 并发策略: Forbid(上次未完成则跳过本次)
  concurrencyPolicy: Forbid
  # 调度类型: Workflow(Chaos Mesh v2.6+)
  type: Workflow
  workflow:
    entry: chaos-night-entry
    templates:
      # -----------------------------------------------------
      # 入口节点: 串行编排所有实验 + 健康检查
      # -----------------------------------------------------
      - name: chaos-night-entry
        templateType: Serial
        children:
          - pre-check-health
          - exp-network-delay-userinfo
          - exp-pod-kill-gateway
          - exp-network-partition-workflow-project
          - exp-cpu-stress-project
          - exp-dns-error-message
          - post-check-health

      # -----------------------------------------------------
      # Steady State Hypothesis: 实验前健康检查
      # -----------------------------------------------------
      - name: pre-check-health
        templateType: Task
        task:
          container:
            image: curlimages/curl:8.10.1
            command:
              - sh
              - "-c"
              - |
                set -e
                echo "[Chaos Night] Pre-experiment health check..."
                for svc in gateway:9000 userinfo:9001 system:9002 project:9003 message:9004; do
                  host=$(echo $svc | cut -d: -f1)
                  port=$(echo $svc | cut -d: -f2)
                  echo "  - Checking ${host}:${port}/actuator/health"
                  curl -sf --max-time 5 "http://${host}.${host}.ydsz.svc.cluster.local:${port}/actuator/health" > /dev/null \
                    || { echo "  FAIL: ${host} unhealthy, aborting chaos night"; exit 1; }
                  echo "  OK: ${host} healthy"
                done
                echo "[Chaos Night] All services healthy, proceeding with experiments."

      - name: exp-network-delay-userinfo
        templateType: NetworkChaos
        networkChaos:
          action: delay
          mode: all
          selector:
            namespaces: [ydsz]
            labelSelectors:
              app: ydsz-userinfo
          delay:
            latency: "200ms"
            correlation: "100"
            jitter: "50ms"
          duration: "3m"

      - name: exp-pod-kill-gateway
        templateType: PodChaos
        podChaos:
          action: pod-kill
          mode: one
          selector:
            namespaces: [ydsz]
            labelSelectors:
              app: ydsz-gateway
          duration: "30s"

      - name: exp-network-partition-workflow-project
        templateType: NetworkChaos
        networkChaos:
          action: partition
          mode: all
          direction: to
          selector:
            namespaces: [ydsz]
            labelSelectors:
              app: ydsz-workflow
          target:
            selector:
              namespaces: [ydsz]
              labelSelectors:
                app: ydsz-project
            mode: all
          duration: "2m"

      - name: exp-cpu-stress-project
        templateType: StressChaos
        stressChaos:
          mode: one
          selector:
            namespaces: [ydsz]
            labelSelectors:
              app: ydsz-project
          stressors:
            cpu:
              workers: 2
              load: 80
          duration: "3m"

      - name: exp-dns-error-message
        templateType: DNSChaos
        dnsChaos:
          action: error
          mode: all
          selector:
            namespaces: [ydsz]
            labelSelectors:
              app: ydsz-message
          duration: "90s"

      - name: post-check-health
        templateType: Task
        task:
          container:
            image: curlimages/curl:8.10.1
            command:
              - sh
              - "-c"
              - |
                echo "[Chaos Night] Waiting 60s for auto-healing..."
                sleep 60
                echo "[Chaos Night] Post-experiment health check..."
                failures=0
                for svc in gateway:9000 userinfo:9001 system:9002 project:9003 message:9004; do
                  host=$(echo $svc | cut -d: -f1)
                  port=$(echo $svc | cut -d: -f2)
                  if curl -sf --max-time 5 "http://${host}.${host}.ydsz.svc.cluster.local:${port}/actuator/health" > /dev/null; then
                    echo "  OK: ${host} healthy"
                  else
                    echo "  FAIL: ${host} still unhealthy after 60s recovery"
                    failures=$((failures + 1))
                  fi
                done
                if [ $failures -gt 0 ]; then
                  echo "[Chaos Night] ${failures} service(s) failed to recover — requires manual investigation"
                  exit 1
                fi
                echo "[Chaos Night] All services recovered. Experiment successful."

# ============================================================
# 补充: Staging 环境持续运行的轻量级实验(每 12h 一次)
# 用于日常韧性回归,不影响主 Workflow
# ============================================================
---
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: userinfo-pod-kill-periodic
  namespace: chaos-mesh
  labels:
    experiment: chaos-periodic
    app.kubernetes.io/part-of: ydsz
spec:
  # 每 12h 执行一次(07:00 + 19:00 UTC = 15:00 + 03:00 Asia/Shanghai)
  schedule: "0 7,19 * * *"
  historyLimit: 2
  concurrencyPolicy: Forbid
  type: PodChaos
  podChaos:
    action: pod-kill
    mode: one
    selector:
      namespaces: [ydsz]
      labelSelectors:
        app: ydsz-userinfo
    duration: "10s"

---
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: finance-network-delay-periodic
  namespace: chaos-mesh
  labels:
    experiment: chaos-periodic
    app.kubernetes.io/part-of: ydsz
spec:
  # 每 12h 执行一次,与 userinfo-pod-kill 错开 1h(08:00 + 20:00 UTC)
  schedule: "0 8,20 * * *"
  historyLimit: 2
  concurrencyPolicy: Forbid
  type: NetworkChaos
  networkChaos:
    action: delay
    mode: all
    selector:
      namespaces: [ydsz]
      labelSelectors:
        app: ydsz-finance
    delay:
      latency: "100ms"
      correlation: "100"
      jitter: "20ms"
    duration: "2m"

---
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: system-pod-kill-periodic
  namespace: chaos-mesh
  labels:
    experiment: chaos-periodic
    app.kubernetes.io/part-of: ydsz
spec:
  # 每 24h 执行一次(09:00 UTC = 17:00 Asia/Shanghai)
  schedule: "0 9 * * *"
  historyLimit: 1
  concurrencyPolicy: Forbid
  type: PodChaos
  podChaos:
    action: pod-kill
    mode: one
    selector:
      namespaces: [ydsz]
      labelSelectors:
        app: ydsz-system
    duration: "10s"
