{{/*
Ingress：仅 gateway / frontend 启用
*/}}
{{- if .Values.services.gateway.ingress.enabled -}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ydsz-pmis-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ydsz-pmis.labels" (dict "name" "gateway-ingress" "Release" .Release "Chart" .Chart) | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: {{ .Values.services.gateway.ingress.className }}
  {{- if .Values.services.gateway.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.services.gateway.ingress.host | quote }}
      secretName: {{ .Values.services.gateway.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.services.gateway.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ydsz-pmis-gateway
                port:
                  number: {{ .Values.services.gateway.port }}
{{- end }}

{{- if .Values.frontend.enabled }}
{{- if .Values.frontend.ingress.enabled -}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ydsz-pmis-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ydsz-pmis.labels" (dict "name" "frontend-ingress" "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  ingressClassName: {{ .Values.frontend.ingress.className }}
  {{- if .Values.frontend.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.frontend.ingress.host | quote }}
      secretName: {{ .Values.frontend.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.frontend.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ydsz-pmis-frontend
                port:
                  number: {{ .Values.frontend.port }}
{{- end }}
{{- end }}
