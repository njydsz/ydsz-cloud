{{/*
前端 Deployment + Service（可选）
*/}}
{{- if .Values.frontend.enabled -}}
{{- $frontend := .Values.frontend -}}
{{- $globalTag := .Values.global.imageTag -}}
{{- $registry := .Values.global.imageRegistry -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ydsz-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ydsz.labels" (dict "name" "frontend" "Release" .Release "Chart" .Chart) | nindent 4 }}
    app: ydsz-frontend
    tier: frontend
spec:
  replicas: {{ $frontend.replicas | default 2 }}
  selector:
    matchLabels:
      app: ydsz-frontend
  template:
    metadata:
      labels:
        {{- include "ydsz.labels" (dict "name" "frontend" "Release" .Release "Chart" .Chart) | nindent 8 }}
        app: ydsz-frontend
        tier: frontend
    spec:
      serviceAccountName: {{ include "ydsz.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "ydsz.image" (dict "registry" $registry "repository" $frontend.image.repository "name" "" "tag" ($frontend.image.tag | default $globalTag)) | trimSuffix "/" | quote }}
          imagePullPolicy: {{ $frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $frontend.port }}
              protocol: TCP
          resources:
            {{- toYaml $frontend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ $frontend.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ $frontend.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ydsz-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ydsz.labels" (dict "name" "frontend" "Release" .Release "Chart" .Chart) | nindent 4 }}
    app: ydsz-frontend
spec:
  type: ClusterIP
  selector:
    app: ydsz-frontend
  ports:
    - name: http
      port: {{ $frontend.port }}
      targetPort: {{ $frontend.port }}
      protocol: TCP
{{- end -}}
