{{/*
公共 Secret：数据库/中间件密码模板

重要安全提示:
  本模板仅作为 Helm 占位 Secret，禁止在 values.yaml 中填写真实密码。
  生产环境必须使用以下任一方案替代:

  方案 A（推荐）: Sealed Secrets
    1. 安装 sealed-secrets-controller
    2. 用 kubeseal 生成加密 SealedSecret 提交到仓库
    3. 在 Helm values 中设置 backend.secrets.useExternalSecret: true 跳过本模板

  方案 B（更安全）: External Secrets Operator + Vault/云 KMS
    1. 安装 external-secrets
    2. 配置 SecretStore 指向 Vault/AWS Secrets Manager/阿里云 KMS
    3. 创建 ExternalSecret 引用远端密钥

  当 backend.secrets.useExternalSecret=true 时本模板不渲染，
  由独立的 sealed-secret.yaml / external-secret.yaml 接管。
*/}}
{{- if not .Values.backend.secrets.useExternalSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ydsz.labels" (dict "name" "db-secret" "Release" .Release "Chart" .Chart) | nindent 4 }}
  annotations:
    ydsz.ydsz.cn/secret-source: "placeholder-only"
    ydsz.ydsz.cn/rotation-required: "every-90-days"
type: Opaque
stringData:
  {{- /* 仅 dev/sit 环境可使用占位密码；uat/prod 必须由 External Secret 注入 */}}
  POSTGRES_PASSWORD: {{ .Values.backend.secrets.postgresPassword | quote }}
  REDIS_PASSWORD: {{ .Values.backend.secrets.redisPassword | quote }}
  NACOS_PASSWORD: {{ .Values.global.nacos.password | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.backend.secrets.minioPassword | quote }}
{{- end }}
