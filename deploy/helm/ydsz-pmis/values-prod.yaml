# =============================================================================
#  YDSZ PMIS · Helm Chart PROD 环境覆盖值
# -----------------------------------------------------------------------------
#  生产环境关键差异:
#    1. 镜像 tag 固定为正式版本（非 SNAPSHOT/RC）
#    2. 多副本 + HPA + PDB
#    3. 严格资源限制
#    4. Ingress + TLS
#    5. 日志级别 INFO
# =============================================================================

global:
  imageTag: v1.3.0
  nacos:
    serverAddr: nacos-server.pmis.svc.cluster.local:8848
    namespace: pmis

backend:
  springProfile: prod
  env:
    LOGGING_LEVEL_ROOT: INFO
    LOGGING_LEVEL_COM_NJYDSZ_PMIS: INFO

  # 生产环境 HA：Pod 反亲和 + 跨可用区拓扑分布
  affinity:
    enabled: true
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          tier: backend

  # =============================================================================
  # 生产环境密码策略
  # -----------------------------------------------------------------------------
  # 生产环境禁止使用 values.yaml 中的开发占位密码。采用以下两种方案之一:
  #
  # 方案 A（推荐）: useExternalSecret=true
  #   跳过本 chart 自带的 Secret 模板（templates/secret.yaml），
  #   改由独立的 SealedSecret / ExternalSecret 创建同名 Secret。
  #   Secret 名称约定为 {Release.Name}-db-secret，
  #   需包含 stringData 键: POSTGRES_PASSWORD / REDIS_PASSWORD /
  #   NACOS_PASSWORD / MINIO_ROOT_PASSWORD。
  #
  # 方案 B（回退）: useExternalSecret=false
  #   下方占位密码必须替换为真实强密码后再部署（不推荐，无法 GitOps）。
  # =============================================================================
  secrets:
    useExternalSecret: true                # ⚠️ 生产强制：改由 ExternalSecret/SealedSecret 注入 K8s Secret
    postgresPassword: "<change-me-in-production>"   # 仅当 useExternalSecret=false 时生效，必须覆盖
    redisPassword: "<change-me-in-production>"      # 仅当 useExternalSecret=false 时生效，必须覆盖
    nacosPassword: "<change-me-in-production>"      # 仅当 useExternalSecret=false 时生效，必须覆盖
    minioPassword: "<change-me-in-production>"      # 仅当 useExternalSecret=false 时生效，必须覆盖

services:
  gateway:
    replicas: 3
    resources:
      requests: { cpu: 500m, memory: 768Mi }
      limits:   { cpu: 2000m, memory: 1536Mi }
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
      cpuUtilization: 70
    ingress:
      enabled: true
      className: nginx
      host: pmis.example.com
      tls:
        enabled: true
        secretName: pmis-tls

  system:
    replicas: 3
    resources:
      requests: { cpu: 500m, memory: 768Mi }
      limits:   { cpu: 2000m, memory: 1536Mi }
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 8
      cpuUtilization: 70

  userinfo:
    replicas: 3
    resources:
      requests: { cpu: 500m, memory: 768Mi }
      limits:   { cpu: 2000m, memory: 1536Mi }
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 8
      cpuUtilization: 70

  project:
    replicas: 4
    resources:
      requests: { cpu: 750m, memory: 1Gi }
      limits:   { cpu: 3000m, memory: 2Gi }
    hpa:
      enabled: true
      minReplicas: 4
      maxReplicas: 12
      cpuUtilization: 65

  cronjob:
    replicas: 2
    resources:
      requests: { cpu: 300m, memory: 512Mi }
      limits:   { cpu: 1000m, memory: 1Gi }

  workflow:
    replicas: 3
    resources:
      requests: { cpu: 500m, memory: 768Mi }
      limits:   { cpu: 2000m, memory: 1536Mi }
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 8
      cpuUtilization: 70

  message:
    replicas: 2
    resources:
      requests: { cpu: 500m, memory: 768Mi }
      limits:   { cpu: 2000m, memory: 1536Mi }
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      cpuUtilization: 70

  agent:
    replicas: 2
    resources:
      requests: { cpu: 1000m, memory: 1536Mi }
      limits:   { cpu: 4000m, memory: 3Gi }
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      cpuUtilization: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 1

frontend:
  enabled: true
  replicas: 3
  ingress:
    enabled: true
    className: nginx
    host: app.pmis.example.com
    tls:
      enabled: true
      secretName: pmis-frontend-tls
