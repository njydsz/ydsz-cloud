# =============================================================================
#  YDSZ PMIS · Helm Chart 全局默认值
# -----------------------------------------------------------------------------
#  用法:
#    helm install pmis deploy/helm/ydsz-pmis -n pmis
#    helm install pmis deploy/helm/ydsz-pmis -n pmis -f deploy/helm/ydsz-pmis/values-prod.yaml
#
#  与 Kustomize 的关系:
#    Helm Chart 与 deploy/k8s/ 目录的 Kustomize 互为替代方案
#    - Kustomize:  适合静态清单 + GitOps（ArgoCD/Flux）
#    - Helm Chart: 适合参数化发布 + 多环境快速切换
# =============================================================================

# -----------------------------------------------------------------------------
#  全局
# -----------------------------------------------------------------------------
global:
  imageRegistry: ""                    # 留空则用镜像名前缀 ydsz-pmis/
  imagePullSecrets: []                 # 私有仓库认证: [{ name: regcred }]
  imageTag: v1.3.0                     # 全局镜像 tag（被 services.*.tag 覆盖）
  storageClass: ""                     # 留空则用集群默认 StorageClass
  timezone: Asia/Shanghai

  # Nacos 注册中心（所有微服务共用）
  nacos:
    serverAddr: nacos-server.pmis.svc.cluster.local:8848
    namespace: pmis
    username: nacos
    password: ""                       # 留空则不设置 Nacos 密码

# -----------------------------------------------------------------------------
#  后端微服务通用配置
# -----------------------------------------------------------------------------
backend:
  image:
    repository: ydsz-pmis              # 镜像仓库前缀，最终镜像为 {repository}/{name}:{tag}
    pullPolicy: IfNotPresent

  # JVM 容器化参数
  jvmOpts: >-
    -XX:+UseContainerSupport
    -XX:MaxRAMPercentage=75.0
    -XX:InitialRAMPercentage=50.0
    -XX:+UseG1GC
    -XX:MaxGCPauseMillis=200
    -XX:+ExitOnOutOfMemoryError
    -Djava.security.egd=file:/dev/./urandom

  # Spring profile
  springProfile: dev

  # 探针配置
  probes:
    startup:
      path: /actuator/health/liveness
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30
    readiness:
      path: /actuator/health/readiness
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6
    liveness:
      path: /actuator/health/liveness
      initialDelaySeconds: 60
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 5

  # Pod 调度策略（HA：反亲和 + 拓扑分布 + 节点选择 + 容忍）
  affinity:
    enabled: false
  topologySpreadConstraints: []
  nodeSelector: {}
  tolerations: []

  # 默认资源（被 services.*.resources 覆盖）
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # 公共环境变量（注入 ConfigMap）
  env:
    LOGGING_LEVEL_ROOT: INFO
    LOGGING_LEVEL_COM_NJYDSZ_PMIS: INFO
    SERVER_TOMCAT_URI_ENCODING: UTF-8

  # 数据库 / 中间件密码（生产请用 external-secrets 替换）
  # ⚠️ 以下仅为开发占位密码，生产环境必须在 values-prod.yaml 中覆盖
  #     （推荐设置 backend.secrets.useExternalSecret: true 引用 K8s Secret）
  secrets:
    postgresPassword: pmis123              # ⚠️ 生产环境必须在 values-prod.yaml 中覆盖
    redisPassword: pmis123                 # ⚠️ 生产环境必须在 values-prod.yaml 中覆盖
    nacosPassword: nacos                   # ⚠️ 生产环境必须在 values-prod.yaml 中覆盖
    minioPassword: minioadmin              # ⚠️ 生产环境必须在 values-prod.yaml 中覆盖
    useExternalSecret: false               # true 时跳过本 chart 渲染的 Secret，改由 ExternalSecret/SealedSecret 注入

# -----------------------------------------------------------------------------
#  各微服务独立配置（覆盖 backend.* 默认值）
# -----------------------------------------------------------------------------
services:
  gateway:
    enabled: true
    name: gateway
    port: 9000
    replicas: 2
    tag: ""                            # 留空则用 global.imageTag
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits:   { cpu: 1000m, memory: 1Gi }
    # HPA（仅 prod 启用）
    hpa:
      enabled: false
      minReplicas: 2
      maxReplicas: 10
      cpuUtilization: 70
    # 网关特殊：暴露 Ingress
    ingress:
      enabled: false
      className: nginx
      host: pmis.example.com
      tls:
        enabled: false
        secretName: pmis-tls

  system:
    enabled: true
    name: system
    port: 9001
    replicas: 2
    tag: ""
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits:   { cpu: 1000m, memory: 1Gi }

  userinfo:
    enabled: true
    name: userinfo
    port: 9002
    replicas: 2
    tag: ""
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits:   { cpu: 1000m, memory: 1Gi }

  project:
    enabled: true
    name: project
    port: 9003
    replicas: 2
    tag: ""
    resources:
      requests: { cpu: 500m, memory: 768Mi }
      limits:   { cpu: 2000m, memory: 1536Mi }

  cronjob:
    enabled: true
    name: cronjob
    port: 9004
    replicas: 1
    tag: ""
    resources:
      requests: { cpu: 200m, memory: 384Mi }
      limits:   { cpu: 500m, memory: 768Mi }

  workflow:
    enabled: true
    name: workflow
    port: 9005
    replicas: 2
    tag: ""
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits:   { cpu: 1000m, memory: 1Gi }

  agent:
    enabled: true
    name: agent
    port: 9006
    replicas: 1
    tag: ""
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits:   { cpu: 1000m, memory: 1Gi }

# -----------------------------------------------------------------------------
#  前端
# -----------------------------------------------------------------------------
frontend:
  enabled: false                       # 默认不启用，需要时设为 true
  image:
    repository: ydsz-pmis/frontend
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 2
  port: 80
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 300m, memory: 256Mi }
  ingress:
    enabled: false
    className: nginx
    host: pmis.example.com
    tls:
      enabled: false
      secretName: pmis-frontend-tls

# -----------------------------------------------------------------------------
#  ServiceAccount / RBAC
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""                             # 留空则自动生成 ydsz-pmis-sa
  annotations: {}

# -----------------------------------------------------------------------------
#  PodSecurityContext（生产强制 non-root）
# -----------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -----------------------------------------------------------------------------
#  PDB（Pod Disruption Budget）
# -----------------------------------------------------------------------------
podDisruptionBudget:
  enabled: false                       # prod 启用
  minAvailable: 1

# -----------------------------------------------------------------------------
#  NetworkPolicy（生产强烈推荐）
# -----------------------------------------------------------------------------
networkPolicy:
  enabled: false
