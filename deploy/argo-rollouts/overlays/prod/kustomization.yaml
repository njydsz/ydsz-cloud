# PMIS Argo Rollouts 生产环境 overlay (kustomize)
#
# 部署:  kubectl apply -k deploy/argo-rollouts/overlays/prod
# 回滚:  kubectl delete -k deploy/argo-rollouts/overlays/prod
#
# 与 Helm chart (helm/pmis) 并存: 此 overlay 仅替换 Rollout 资源, 不影响其他资源
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pmis-prod

resources:
  - ../../base/execution-rollout.yaml
  - ../../base/analysis-templates.yaml
  - project-rollout.yaml
  - finance-rollout.yaml
  - agent-rollout.yaml

commonLabels:
  app.kubernetes.io/part-of: pmis
  app.kubernetes.io/managed-by: argo-rollouts
