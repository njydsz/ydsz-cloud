# pmis-project 微服务 Rollout 范例 (project 已合并原 execution 服务)
# 适用: 项目模块 (商机/立项/合同/变更/执行)
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: pmis-project
  namespace: pmis-prod
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: pmis-project }
  strategy:
    canary:
      steps:
        - setWeight: 5
        - pause: { duration: 10m }
        - analysis:
            templates: [{ templateName: error-rate-check }]
            args: [{ name: service-name, value: pmis-project }]
        - setWeight: 50
        - pause: { duration: 15m }
        - analysis:
            templates: [{ templateName: error-rate-check }]
            args: [{ name: service-name, value: pmis-project }]
        - setWeight: 100
      maxSurge: "25%"
      maxUnavailable: "0%"
  template:
    metadata:
      labels: { app: pmis-project }
    spec:
      containers:
        - name: project
          image: registry.ydsz-pmis.cn/ydsz/ydsz-pmis-project:latest
          ports: [{ name: http, containerPort: 9005 }]
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 300m, memory: 768Mi }
            limits:   { cpu: 1500m, memory: 3Gi }
---
apiVersion: v1
kind: Service
metadata: { name: pmis-project, namespace: pmis-prod }
spec:
  ports: [{ name: http, port: 9005, targetPort: http }]
  selector: { app: pmis-project }
