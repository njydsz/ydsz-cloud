# pmis-finance 微服务 Rollout (财务模块, 错误率阈值更严格 < 0.3%)
# 适用: 发票/付款/客户信用
# 状态: 预留模板（2026-07-03 服务合并后归入 ydsz-pmis-project）
#       当前财务能力由 ydsz-pmis-project (9003) 提供；
#       本文件作为未来独立财务服务的灰度发布参考，端口预占 9009
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: pmis-finance
  namespace: pmis-prod
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: pmis-finance }
  strategy:
    canary:
      steps:
        - setWeight: 5
        - pause: { duration: 15m }
        - analysis:
            templates: [{ templateName: error-rate-check }]
            args:
              - { name: service-name, value: pmis-finance }
              - { name: error-rate-threshold, value: "0.003" }  # 财务 0.3% 更严
        - setWeight: 25
        - pause: { duration: 20m }
        - analysis:
            templates: [{ templateName: composite-check }]   # 错误率+p99 双检
            args: [{ name: service-name, value: pmis-finance }]
        - setWeight: 100
      maxSurge: "25%"
      maxUnavailable: "0%"
  template:
    metadata:
      labels: { app: pmis-finance }
    spec:
      containers:
        - name: finance
          image: registry.ydsz-pmis.cn/ydsz/ydsz-pmis-finance:latest
          ports: [{ name: http, containerPort: 9009 }]
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 300m, memory: 768Mi }
            limits:   { cpu: 1500m, memory: 3Gi }
---
apiVersion: v1
kind: Service
metadata: { name: pmis-finance, namespace: pmis-prod }
spec:
  ports: [{ name: http, port: 9009, targetPort: http }]
  selector: { app: pmis-finance }
