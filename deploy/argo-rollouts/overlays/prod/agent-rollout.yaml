# pmis-agent 微服务 Rollout (AI 智能体, 启动慢, 拉长观察窗口)
# 适用: 风险预警/资源推荐/利润预测
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: pmis-agent
  namespace: pmis-prod
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: pmis-agent }
  strategy:
    canary:
      steps:
        - setWeight: 5
        - pause: { duration: 20m }   # agent 启动慢, 拉长
        - analysis:
            templates: [{ templateName: error-rate-check }]
            args: [{ name: service-name, value: pmis-agent }]
        - setWeight: 100
      maxSurge: "25%"
      maxUnavailable: "0%"
  template:
    metadata:
      labels: { app: pmis-agent }
    spec:
      containers:
        - name: agent
          image: registry.ydsz-pmis.cn/ydsz/ydsz-pmis-agent:latest
          ports: [{ name: http, containerPort: 9006 }]
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 60   # AI 加载模型耗时
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests: { cpu: 1000m, memory: 2Gi }
            limits:   { cpu: 4000m, memory: 8Gi }
---
apiVersion: v1
kind: Service
metadata: { name: pmis-agent, namespace: pmis-prod }
spec:
  ports: [{ name: http, port: 9006, targetPort: http }]
  selector: { app: pmis-agent }
