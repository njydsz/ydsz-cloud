# PMIS 金丝雀服务通用 Rollout 模板
#
# 使用说明:
#   1. 复制本文件为 <service>-rollout.yaml
#   2. 替换 metadata.name / spec.selector / spec.template.spec.containers.image / spec.template.metadata.labels.app
#   3. strategy.canary.steps 按需调整
#   4. kubectl apply -f <service>-rollout.yaml -n pmis-prod
#
# 关键设计:
#   - maxSurge=25% / maxUnavailable=0 (无中断金丝雀)
#   - 5%→25%→50%→100% 4 步渐进, 每步暂停 + Prometheus 错误率分析
#   - 任一步分析失败 (errorRate > 0.5%) 自动中止 + 保留 stable 版本
#   - trafficRouting 留给 Istio / Nginx Ingress, 暂用 K8s Service 双 selector
#   - 历史保留 5 个版本便于回滚
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: pmis-execution
  namespace: pmis-prod
  labels:
    app: pmis-execution
    tier: backend
spec:
  replicas: 4
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: pmis-execution
  strategy:
    canary:
      # ====== 渐进步骤: 5% → 25% → 50% → 100% ======
      steps:
        - setWeight: 5
        - pause: { duration: 10m }   # 5% 观察 10 分钟
        - analysis:
            templates:
              - templateName: error-rate-check
            args:
              - name: service-name
                value: pmis-execution
        - setWeight: 25
        - pause: { duration: 15m }
        - analysis:
            templates:
              - templateName: error-rate-check
            args:
              - name: service-name
                value: pmis-execution
        - setWeight: 50
        - pause: { duration: 15m }
        - analysis:
            templates:
              - templateName: error-rate-check
            args:
              - name: service-name
                value: pmis-execution
        - setWeight: 100
      # 失败容忍度: 1 次失败后中止 (但 stable 仍在跑)
      canaryMetadata:
        labels:
          role: canary
      stableMetadata:
        labels:
          role: stable
      # 流量路由: 暂用 K8s Service 双 selector (无 Istio 也可工作)
      # 如已接入 Istio / Nginx Ingress, 改用 trafficRouting
      maxSurge: "25%"
      maxUnavailable: "0%"
  template:
    metadata:
      labels:
        app: pmis-execution
        tier: backend
    spec:
      containers:
        - name: execution
          image: registry.ydsz-pmis.cn/ydsz/ydsz-pmis-execution:latest
          ports:
            - name: http
              containerPort: 9006
            - name: actuator
              containerPort: 9006
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: NACOS_SERVER
              value: nacos.pmis-prod.svc.cluster.local:8848
            - name: TZ
              value: Asia/Shanghai
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: actuator
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: actuator
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
---
# Service 保持稳定, 路由策略由 Rollout 控制 canary/stable pod 比例
apiVersion: v1
kind: Service
metadata:
  name: pmis-execution
  namespace: pmis-prod
  labels:
    app: pmis-execution
spec:
  ports:
    - name: http
      port: 9006
      targetPort: http
    - name: actuator
      port: 9006
      targetPort: actuator
  selector:
    app: pmis-execution   # 同时匹配 stable + canary (按副本数比例分配)
