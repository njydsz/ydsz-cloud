---
# =====================================================================
#  PMIS 基础 OS 调优 Playbook（批次 19）
# ---------------------------------------------------------------------
#  对所有应用节点执行：
#  1) 内核参数调优（net.core.somaxconn / vm.swappiness / fs.file-max）
#  2) 系统限制（ulimit 65535 / nofile / nproc）
#  3) 时区与 NTP 同步
#  4) 中文 locale 与字体
#  5) Docker 与 docker-compose 安装
#  6) 监控 agent（node_exporter）部署
#  7) 日志目录初始化（/var/log/pmis）
# =====================================================================

- name: PMIS 基础 OS 调优
  hosts: app_gateway:app_core:app_ai
  become: yes
  gather_facts: yes

  vars:
    kernel_params:
      # 高并发连接
      - { key: "net.core.somaxconn", value: "65535" }
      - { key: "net.core.netdev_max_backlog", value: "65535" }
      - { key: "net.ipv4.tcp_max_syn_backlog", value: "65535" }
      - { key: "net.ipv4.tcp_tw_reuse", value: "1" }
      - { key: "net.ipv4.tcp_fin_timeout", value: "15" }
      - { key: "net.ipv4.ip_local_port_range", value: "1024 65535" }
      # 内存策略（容器场景少 swap）
      - { key: "vm.swappiness", value: "10" }
      - { key: "vm.dirty_ratio", value: "15" }
      - { key: "vm.dirty_background_ratio", value: "5" }
      # 文件句柄
      - { key: "fs.file-max", value: "2097152" }
      - { key: "fs.nr_open", value: "1048576" }
      # 进程数
      - { key: "kernel.pid_max", value: "4194304" }
      # 透明大页（数据库场景建议关闭，应用可保留）
      - { key: "vm.transparent_hugepage", value: "never" }

    sysctl_reload: true
    install_docker: true
    install_node_exporter: true
    node_exporter_version: "1.8.0"

  tasks:
    # ---- 1. 系统更新与基础工具 ----
    - name: 更新 apt 包索引
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: 安装基础工具
      apt:
        name:
          - curl
          - wget
          - git
          - vim
          - htop
          - iotop
          - sysstat
          - net-tools
          - ca-certificates
          - gnupg
          - lsb-release
          - tzdata
          - fonts-noto-cjk
          - fontconfig
        state: present
      when: ansible_os_family == "Debian"

    # ---- 2. 时区与 locale ----
    - name: 设置时区为 Asia/Shanghai
      timezone:
        name: "{{ timezone }}"

    - name: 生成中文 locale
      locale_gen:
        name: "{{ locale }}"
        state: present

    - name: 配置 locale 默认值
      copy:
        dest: /etc/default/locale
        content: |
          LANG={{ locale }}
          LANGUAGE={{ locale }}:zh
          LC_ALL={{ locale }}
        mode: '0644'

    # ---- 3. 内核参数调优 ----
    - name: 写入 sysctl 调优参数
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        reload: "{{ sysctl_reload }}"
        sysctl_file: /etc/sysctl.d/99-pmis.conf
      loop: "{{ kernel_params }}"

    # ---- 4. ulimit 系统限制 ----
    - name: 配置 limits.conf（nofile / nproc）
      copy:
        dest: /etc/security/limits.d/99-pmis.conf
        content: |
          # PMIS 进程限制
          *       soft    nofile  65535
          *       hard    nofile  65535
          *       soft    nproc   65535
          *       hard    nproc   65535
          root    soft    nofile  65535
          root    hard    nofile  65535
        mode: '0644'

    - name: 配置 systemd limits
      copy:
        dest: /etc/systemd/system.conf.d/99-pmis-limits.conf
        content: |
          [Manager]
          DefaultLimitNOFILE=65535
          DefaultLimitNPROC=65535
        mode: '0644'
      notify: reload systemd

    # ---- 5. 关闭透明大页（数据库节点统一处理） ----
    - name: 禁用透明大页
      copy:
        dest: /etc/systemd/system/disable-transparent-huge-pages.service
        content: |
          [Unit]
          Description=Disable Transparent Huge Pages
          DefaultDependencies=no
          After=sysinit.target local-fs.target
          Before=basic.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/sh -c 'echo never > /sys/kernel/mm/transparent_hugepage/enabled'
          ExecStart=/bin/sh -c 'echo never > /sys/kernel/mm/transparent_hugepage/defrag'

          [Install]
          WantedBy=basic.target
        mode: '0644'
      notify: enable-disable-thp

    - name: 立即禁用透明大页
      shell: |
        echo never > /sys/kernel/mm/transparent_hugepage/enabled
        echo never > /sys/kernel/mm/transparent_hugepage/defrag
      changed_when: false

    # ---- 6. 安装 Docker ----
    - name: 安装 Docker（Ubuntu 22.04+）
      block:
        - name: 添加 Docker GPG key
          apt_key:
            url: https://download.docker.com/linux/ubuntu/gpg
            state: present

        - name: 添加 Docker apt 源
          apt_repository:
            repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
            state: present

        - name: 安装 docker-ce
          apt:
            name:
              - "docker-ce={{ docker_version }}*"
              - "docker-ce-cli={{ docker_version }}*"
              - containerd.io
              - docker-buildx-plugin
            state: present
            update_cache: yes

        - name: 安装 docker-compose
          get_url:
            url: "https://github.com/docker/compose/releases/download/v{{ docker_compose_version }}/docker-compose-linux-x86_64"
            dest: /usr/local/bin/docker-compose
            mode: '0755'

        - name: 启动 Docker 服务
          service:
            name: docker
            state: started
            enabled: yes

        - name: 将 deployer 加入 docker 组
          user:
            name: "{{ ansible_user }}"
            groups: docker
            append: yes
      when: install_docker

    # ---- 7. node_exporter 部署 ----
    - name: 创建 node_exporter 用户
      user:
        name: node_exporter
        system: yes
        shell: /usr/sbin/nologin
        create_home: no
      when: install_node_exporter

    - name: 下载并安装 node_exporter
      unarchive:
        src: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: /tmp
        remote_src: yes
      when: install_node_exporter

    - name: 复制 node_exporter 二进制
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: /usr/local/bin/node_exporter
        mode: '0755'
        remote_src: yes
      when: install_node_exporter

    - name: 创建 node_exporter systemd unit
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network.target

          [Service]
          User=node_exporter
          ExecStart=/usr/local/bin/node_exporter \
            --web.listen-address=:9100 \
            --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
        mode: '0644'
      when: install_node_exporter
      notify: restart node_exporter

    - name: 启动 node_exporter
      service:
        name: node_exporter
        state: started
        enabled: yes
      when: install_node_exporter

    # ---- 8. PMIS 日志目录 ----
    - name: 创建 PMIS 日志目录
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
      loop:
        - /var/log/pmis
        - /var/log/pmis/heap
        - /var/log/pmis/slow
        - /opt/pmis/conf
        - /opt/pmis/data

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes

    - name: enable-disable-thp
      systemd:
        name: disable-transparent-huge-pages
        enabled: yes
        state: started
        daemon_reload: yes

    - name: restart node_exporter
      service:
        name: node_exporter
        state: restarted
