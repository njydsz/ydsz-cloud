# ============================================================
# PMIS Argo Rollouts — Canary / Stable Service 资源（P2-11 配套）
#
# Argo Rollouts 控制器要求每个 Rollout 的 canaryService / stableService
# 指向已存在的 Service。本文件为 rollout-all-services.yaml 中 9 个服务
# 补齐 18 个 Service（每服务 1 个 -canary + 1 个 -stable）。
#
# gateway 的 canary/stable Service 已在 rollout-gateway.yaml 中定义，
# 本文件不再重复。
#
# Service 行为说明：
#   - 初始 selector 为 app: ydsz-pmis-{svc}（与原 Service 一致）
#   - Argo Rollouts 控制器会在发布过程中动态修改 selector 指向
#     pod-template-hash，实现流量切分
#   - 用户流量入口仍为 base/ 中的 ydsz-pmis-{svc} Service（不变）
#
# 使用方式：
#   kubectl apply -f deploy/k8s/rollouts/rollout-services.yaml
# ============================================================

# ============================================================
# userinfo (9001)
# ============================================================
---
apiVersion: v1
kind: Service
metadata:
  name: ydsz-pmis-userinfo-canary
  namespace: pmis
  labels:
    app: ydsz-pmis-userinfo
    tier: service
spec:
  type: ClusterIP
  selector:
    app: ydsz-pmis-userinfo
  ports:
    - name: http
      port: 9001
      targetPort: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: ydsz-pmis-userinfo-stable
  namespace: pmis
  labels:
    app: ydsz-pmis-userinfo
    tier: service
spec:
  type: ClusterIP
  selector:
    app: ydsz-pmis-userinfo
  ports:
    - name: http
      port: 9001
      targetPort: 9001

