# ============================================================
# YDSZ Argo Rollouts — AnalysisTemplates
# ------------------------------------------------------------
# 金丝雀发布期间的自动分析模板，基于 Prometheus 多维度指标
# 任一指标失败即自动回滚
#
# 使用方式:
#   kubectl apply -f deploy/k8s/rollouts/analysis-templates.yaml
# ============================================================
---
# 成功率分析：5xx 错误率 < 1%
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: ydsz
spec:
  args:
    - name: service-name
  metrics:
    - name: success-rate
      interval: 30s
      count: 10
      failureLimit: 2
      successCondition: result[0] >= 0.99
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_server_requests_seconds_count{namespace="ydsz",pod=~"{{args.service-name}}.*",status!~"5.."}[2m]))
            /
            sum(rate(http_server_requests_seconds_count{namespace="ydsz",pod=~"{{args.service-name}}.*"}[2m]))
---
# 延迟分析：P99 延迟 < 500ms
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: latency-p99
  namespace: ydsz
spec:
  args:
    - name: service-name
  metrics:
    - name: latency-p99
      interval: 30s
      count: 10
      failureLimit: 2
      successCondition: result[0] < 0.5
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local:9090
          query: |
            histogram_quantile(0.99,
              sum(rate(http_server_requests_seconds_bucket{namespace="ydsz",pod=~"{{args.service-name}}.*"}[2m]))
              by (le))
---
# 数据库连接池健康：利用率 < 80%
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: db-pool-health
  namespace: ydsz
spec:
  args:
    - name: service-name
  metrics:
    - name: db-pool-utilization
      interval: 30s
      count: 10
      failureLimit: 3
      successCondition: result[0] < 0.8
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local:9090
          query: |
            hikaricp_connections_active{namespace="ydsz",pod=~"{{args.service-name}}.*"}
            /
            hikaricp_connections_max{namespace="ydsz",pod=~"{{args.service-name}}.*"}
---
# JVM 内存健康：堆内存利用率 < 85%
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: jvm-memory
  namespace: ydsz
spec:
  args:
    - name: service-name
  metrics:
    - name: jvm-heap-utilization
      interval: 30s
      count: 10
      failureLimit: 3
      successCondition: result[0] < 0.85
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local:9090
          query: |
            jvm_memory_used_bytes{namespace="ydsz",pod=~"{{args.service-name}}.*",area="heap"}
            /
            jvm_memory_max_bytes{namespace="ydsz",pod=~"{{args.service-name}}.*",area="heap"}
