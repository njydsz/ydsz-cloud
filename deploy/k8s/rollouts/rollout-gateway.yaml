# ============================================================
# YDSZ Argo Rollouts — 通用微服务金丝雀发布模板
# ------------------------------------------------------------
# 适用于所有后端微服务（gateway/userinfo/system/project/
# message/cronjob/workflow/agent/nextwiki）
#
# 金丝雀策略: 5% → 25% → 50% → 75%（手动确认）→ 100%
# 自动回滚: 基于 4 个 AnalysisTemplate（成功率/延迟/DB池/JVM内存）
#
# 使用方式:
#   1. 替换 SERVICE_NAME / PORT / IMAGE 为实际值
#   2. kubectl apply -f deploy/k8s/rollouts/rollout-template.yaml
#   3. kubectl argo rollouts get rollout ydsz-SERVICE_NAME -n ydsz --watch
#
# 注意: 使用 Rollout 替代 Deployment 后，需删除同名 Deployment
#   kubectl delete deployment ydsz-SERVICE_NAME -n ydsz
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ydsz-gateway
  namespace: ydsz
  labels:
    app: ydsz-gateway
    tier: gateway
spec:
  replicas: 4
  strategy:
    canary:
      canaryService: ydsz-gateway-canary
      stableService: ydsz-gateway-stable
      trafficRouting:
        nginx:
          stableIngress: ydsz-gateway-ingress
      steps:
        # 第 1 步：5% 流量到新版本，观察 2 分钟
        - setWeight: 5
        - pause: { duration: 2m }
        # 第 2 步：25% 流量，观察 3 分钟
        - setWeight: 25
        - pause: { duration: 3m }
        # 第 3 步：50% 流量，观察 3 分钟
        - setWeight: 50
        - pause: { duration: 3m }
        # 第 4 步：75% 流量，手动确认后全量
        - setWeight: 75
        - pause: {}
      # 自动回滚：基于 Prometheus 多维度指标分析
      analysis:
        templates:
          - templateName: success-rate
          - templateName: latency-p99
          - templateName: db-pool-health
          - templateName: jvm-memory
        args:
          - name: service-name
            value: ydsz-gateway
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: ydsz-gateway
  template:
    metadata:
      labels:
        app: ydsz-gateway
        tier: gateway
    spec:
      containers:
        - name: gateway
          image: registry.cn-hangzhou.aliyuncs.com/ydsz/ydsz-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
---
# ============================================================
# 标准后端微服务 Rollout 模板（非 Gateway）
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ydsz-userinfo
  namespace: ydsz
  labels:
    app: ydsz-userinfo
    tier: backend
spec:
  replicas: 2
  strategy:
    canary:
      canaryService: ydsz-userinfo-canary
      stableService: ydsz-userinfo-stable
      trafficRouting:
        nginx:
          stableIngress: ydsz-userinfo-ingress
      steps:
        - setWeight: 5
        - pause: { duration: 2m }
        - setWeight: 25
        - pause: { duration: 3m }
        - setWeight: 50
        - pause: { duration: 3m }
        - setWeight: 75
        - pause: {}
      analysis:
        templates:
          - templateName: success-rate
          - templateName: latency-p99
          - templateName: db-pool-health
          - templateName: jvm-memory
        args:
          - name: service-name
            value: ydsz-userinfo
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: ydsz-userinfo
  template:
    metadata:
      labels:
        app: ydsz-userinfo
        tier: backend
    spec:
      containers:
        - name: userinfo
          image: registry.cn-hangzhou.aliyuncs.com/ydsz/ydsz-userinfo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9001
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
