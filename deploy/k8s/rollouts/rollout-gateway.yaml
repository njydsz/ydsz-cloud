# ============================================================
# PMIS Argo Rollouts — 金丝雀发布策略
#
# 本文件将标准 Deployment 替换为 Argo Rollouts，支持：
#   1. 金丝雀渐进式发布（5% → 25% → 50% → 100%）
#   2. 基于 Prometheus 错误率的自动回滚
#   3. 手动确认门槛（promotion gate）
#
# 使用方式：
#   kubectl apply -f deploy/k8s/rollouts/rollout-gateway.yaml
#   kubectl argo rollouts get rollout ydsz-pmis-gateway -n pmis --watch
#   kubectl argo rollouts promote ydsz-pmis-gateway -n pmis
#   kubectl argo rollouts abort ydsz-pmis-gateway -n pmis
#
# 前提条件：
#   - 集群已安装 Argo Rollouts controller
#   - 安装命令: kubectl apply -n argo-rollouts -f https://github.com/argoproj/argo-rollouts/releases/latest/download/install.yaml
#
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ydsz-pmis-gateway
  namespace: pmis
  labels:
    app: ydsz-pmis-gateway
    tier: gateway
spec:
  replicas: 4
  strategy:
    canary:
      # 金丝雀流量路由（通过 Nginx Ingress Canary 注解实现）
      canaryService: ydsz-pmis-gateway-canary
      stableService: ydsz-pmis-gateway-stable
      trafficRouting:
        nginx:
          stableIngress: pmis-gateway-ingress
      steps:
        # 第 1 步：5% 流量到新版本，观察 2 分钟
        - setWeight: 5
        - pause: { duration: 2m }
        # 第 2 步：25% 流量，观察 3 分钟
        - setWeight: 25
        - pause: { duration: 3m }
        # 第 3 步：50% 流量，观察 3 分钟
        - setWeight: 50
        - pause: { duration: 3m }
        # 第 4 步：手动确认门槛（如未确认则无限等待）
        - setWeight: 75
        - pause: {}  # 手动 promote: kubectl argo rollouts promote <name>
      # 自动回滚：基于 Prometheus 指标分析
      analysis:
        templates:
          - templateName: success-rate
        args:
          - name: service-name
            value: ydsz-pmis-gateway-canary
      # 最大不可用副本数
      maxUnavailable: 1
      # 最大 surge 副本数
      maxSurge: 1
  selector:
    matchLabels:
      app: ydsz-pmis-gateway
  template:
    metadata:
      labels:
        app: ydsz-pmis-gateway
        tier: gateway
    spec:
      containers:
        - name: gateway
          image: ydsz-pmis/gateway:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: pmis-common-config
          env:
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:+UseContainerSupport
                -XX:MaxRAMPercentage=75.0
                -XX:InitialRAMPercentage=50.0
                -XX:+UseG1GC
                -XX:MaxGCPauseMillis=200
                -XX:+HeapDumpOnOutOfMemoryError
                -XX:HeapDumpPath=/app/logs/heapdump
                -Dfile.encoding=UTF-8
                -Duser.timezone=Asia/Shanghai
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 20

---
# ============================================================
# Analysis Template — 基于 Prometheus 成功率自动回滚
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: pmis
spec:
  args:
    - name: service-name
  metrics:
    - name: success-rate
      # 查询过去 2 分钟内 HTTP 5xx 错误率
      # 如果错误率 > 5%，分析失败 → 自动回滚
      interval: 30s
      successCondition: result[0] < 0.05
      failureLimit: 3  # 连续 3 次失败才回滚（避免瞬时抖动）
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_server_requests_seconds_count{service_name="{{args.service-name}}", status=~"5.."}[2m]))
            /
            sum(rate(http_server_requests_seconds_count{service_name="{{args.service-name}}"}[2m]))

---
# ============================================================
# Canary Service — 金丝雀流量专用 Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: ydsz-pmis-gateway-canary
  namespace: pmis
  labels:
    app: ydsz-pmis-gateway
spec:
  type: ClusterIP
  selector:
    app: ydsz-pmis-gateway
  ports:
    - name: http
      port: 9000
      targetPort: 9000

---
# ============================================================
# Stable Service — 稳定版流量专用 Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: ydsz-pmis-gateway-stable
  namespace: pmis
  labels:
    app: ydsz-pmis-gateway
spec:
  type: ClusterIP
  selector:
    app: ydsz-pmis-gateway
  ports:
    - name: http
      port: 9000
      targetPort: 9000
