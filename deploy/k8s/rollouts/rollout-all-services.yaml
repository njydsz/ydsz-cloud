# ============================================================
# YDSZ Argo Rollouts — 全服务金丝雀发布策略（P2-1）
#
# 本文件定义除 gateway 外所有微服务的 Rollout（gateway 见 rollout-gateway.yaml）。
# 统一渐进式金丝雀发布策略：
#   - HTTP 服务：5% → 25% → 50% → 75% → 人工确认 → 100%
#   - 批处理/后台服务（cronjob/agent）：50% → 等待 → 100%
#
# AnalysisTemplate 说明：
#   AnalysisTemplate 定义在 analysis-templates.yaml（独立文件），本文件仅引用。
#   共 4 个模板：success-rate / latency-p99 / db-pool-health / jvm-memory。
#
# service-name 参数说明：
#   Prometheus 指标中的 `application` 标签由 Micrometer 通过
#   management.metrics.tags.application 注入，值为 Spring 应用名
#   （spring.application.name，如 ydsz-userinfo）。
#   因此 analysis.args.service-name 必须传 Spring 应用名，
#   而非 K8s Canary Service 名（如 ydsz-userinfo-canary）。
#
# 使用方式：
#   kubectl apply -f deploy/k8s/rollouts/
#   kubectl argo rollouts get rollout <name> -n ydsz --watch
# ============================================================

---
# ============================================================
# userinfo 服务（端口 9001）
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ydsz-userinfo
  namespace: ydsz
  labels:
    app: ydsz-userinfo
    tier: service
spec:
  replicas: 3
  strategy:
    canary:
      canaryService: ydsz-userinfo-canary
      stableService: ydsz-userinfo-stable
      trafficRouting:
        nginx:
          stableIngress: ydsz-userinfo-ingress
      steps:
        - setWeight: 5
        - pause: { duration: 2m }
        - setWeight: 25
        - pause: { duration: 3m }
        - setWeight: 50
        - pause: { duration: 3m }
        - setWeight: 75
        - pause: {}
      analysis:
        templates:
          - templateName: success-rate
          - templateName: latency-p99
          - templateName: db-pool-health
          - templateName: jvm-memory
        args:
          - name: service-name
            value: ydsz-userinfo
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: ydsz-userinfo
  template:
    metadata:
      labels:
        app: ydsz-userinfo
        tier: service
    spec:
      containers:
        - name: userinfo
          image: ydsz/userinfo:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9001
          envFrom:
            - configMapRef:
                name: ydsz-common-config
          env:
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:+UseContainerSupport
                -XX:MaxRAMPercentage=75.0
                -XX:InitialRAMPercentage=50.0
                -XX:+UseG1GC
                -XX:MaxGCPauseMillis=200
                -XX:+HeapDumpOnOutOfMemoryError
                -XX:HeapDumpPath=/app/logs/heapdump
                -Dfile.encoding=UTF-8
                -Duser.timezone=Asia/Shanghai
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9001
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9001
            initialDelaySeconds: 60
            periodSeconds: 20

