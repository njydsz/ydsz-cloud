# ============================================================
# PMIS Argo Rollouts — 全服务金丝雀发布策略（P2-1）
#
# 覆盖所有核心微服务，统一渐进式发布策略：
#   5% → 25% → 50% → 75% → 100%
# 基于 Prometheus 错误率自动回滚。
#
# 使用方式：
#   kubectl apply -f deploy/k8s/rollouts/rollout-all-services.yaml
#   kubectl argo rollouts get rollout <name> -n pmis --watch
#
# ============================================================

---
# ============================================================
# userinfo 服务
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ydsz-pmis-userinfo
  namespace: pmis
  labels:
    app: ydsz-pmis-userinfo
    tier: service
spec:
  replicas: 3
  strategy:
    canary:
      canaryService: ydsz-pmis-userinfo-canary
      stableService: ydsz-pmis-userinfo-stable
      trafficRouting:
        nginx:
          stableIngress: pmis-userinfo-ingress
      steps:
        - setWeight: 5
        - pause: { duration: 2m }
        - setWeight: 25
        - pause: { duration: 3m }
        - setWeight: 50
        - pause: { duration: 3m }
        - setWeight: 75
        - pause: {}
      analysis:
        templates:
          - templateName: success-rate
        args:
          - name: service-name
            value: ydsz-pmis-userinfo-canary
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: ydsz-pmis-userinfo
  template:
    metadata:
      labels:
        app: ydsz-pmis-userinfo
        tier: service
    spec:
      containers:
        - name: userinfo
          image: ydsz-pmis/userinfo:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9001
          envFrom:
            - configMapRef:
                name: pmis-common-config
          env:
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:+UseContainerSupport
                -XX:MaxRAMPercentage=75.0
                -XX:InitialRAMPercentage=50.0
                -XX:+UseG1GC
                -XX:MaxGCPauseMillis=200
                -XX:+HeapDumpOnOutOfMemoryError
                -XX:HeapDumpPath=/app/logs/heapdump
                -Dfile.encoding=UTF-8
                -Duser.timezone=Asia/Shanghai
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9001
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9001
            initialDelaySeconds: 60
            periodSeconds: 20

