# ============================================================
# YDSZ OPA Gatekeeper 准入控制策略
# ------------------------------------------------------------
# 对标: 阿里云容器服务 ACS / 腾讯 TKE 准入控制
#
# 策略:
#   1. 禁止以 root 用户运行容器
#   2. 禁止不设 resource limits 的 Pod
#   3. 禁止 :latest tag 镜像部署到 production
#   4. 强制 readOnlyRootFilesystem（白名单除外）
#
# 使用方式:
#   kubectl apply -f deploy/k8s/security/opa-policies.yaml
# ============================================================
---
# 策略1: 禁止以 root 用户运行容器
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: ydsz-disallow-root-user
spec:
  crd:
    spec:
      names:
        kind: YdszDisallowRootUser
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package ydsz.disallowrootuser

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not has_non_root_user(container)
          msg := sprintf("容器 %v 必须设置非 root 用户 (securityContext.runAsUser != 0)", [container.name])
        }

        has_non_root_user(container) {
          container.securityContext.runAsUser != 0
        }

        has_non_root_user(container) {
          container.securityContext.runAsNonRoot == true
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: YdszDisallowRootUser
metadata:
  name: disallow-root-user
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces: ["ydsz"]
---
# 策略2: 禁止不设 resource limits 的 Pod
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: ydsz-require-resource-limits
spec:
  crd:
    spec:
      names:
        kind: YdszRequireResourceLimits
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package ydsz.requirelimits

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not container.resources.limits.cpu
          msg := sprintf("容器 %v 必须设置 resources.limits.cpu", [container.name])
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not container.resources.limits.memory
          msg := sprintf("容器 %v 必须设置 resources.limits.memory", [container.name])
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: YdszRequireResourceLimits
metadata:
  name: require-resource-limits
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces: ["ydsz"]
---
# 策略3: 禁止 :latest tag 镜像
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: ydsz-disallow-latest-tag
spec:
  crd:
    spec:
      names:
        kind: YdszDisallowLatestTag
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package ydsz.disallowlatest

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          endswith(container.image, ":latest")
          msg := sprintf("容器 %v 禁止使用 :latest 镜像 tag", [container.name])
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: YdszDisallowLatestTag
metadata:
  name: disallow-latest-tag
spec:
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment", "Rollout"]
    namespaces: ["ydsz"]
