apiVersion: apps/v1
kind: Deployment
metadata:
  name: ydsz-pmis-cronjob
  namespace: pmis
  labels:
    app: ydsz-pmis-cronjob
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ydsz-pmis-cronjob
  template:
    metadata:
      labels:
        app: ydsz-pmis-cronjob
        tier: backend
    spec:
      # P0-7: 优雅停机宽限期，给 @PreDestroy drain 逻辑足够时间（默认 30s 不够）
      terminationGracePeriodSeconds: 60
      containers:
        - name: cronjob
          image: ydsz-pmis/cronjob:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 9005
          envFrom:
            - configMapRef:
                name: pmis-common-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # P0-7: preStop hook 给 Spring @PreDestroy 足够时间排空在执行任务
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9005
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9005
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9005
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ydsz-pmis-cronjob
  namespace: pmis
spec:
  type: ClusterIP
  selector:
    app: ydsz-pmis-cronjob
  ports:
  - name: http
    port: 9005
    targetPort: 9005
