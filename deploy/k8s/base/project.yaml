apiVersion: apps/v1
kind: Deployment
metadata:
  name: ydsz-pmis-project
  namespace: pmis
  labels:
    app: ydsz-pmis-project
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ydsz-pmis-project
  template:
    metadata:
      labels:
        app: ydsz-pmis-project
        tier: backend
    spec:
      containers:
        - name: project
          image: ydsz-pmis/project:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 9003
          envFrom:
            - configMapRef:
                name: pmis-common-config
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9003
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9003
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9003
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ydsz-pmis-project
  namespace: pmis
spec:
  type: ClusterIP
  selector:
    app: ydsz-pmis-project
  ports:
  - name: http
    port: 9003
    targetPort: 9003
