apiVersion: apps/v1
kind: Deployment
metadata:
  name: ydsz-project
  namespace: ydsz
  labels:
    app: ydsz-project
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ydsz-project
  template:
    metadata:
      labels:
        app: ydsz-project
        tier: backend
    spec:
      containers:
        - name: project
          image: ydsz/project:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9003
          envFrom:
            - configMapRef:
                name: ydsz-common-config
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9003
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9003
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ydsz-project
  namespace: ydsz
spec:
  type: ClusterIP
  selector:
    app: ydsz-project
  ports:
  - name: http
    port: 9003
    targetPort: 9003
