apiVersion: apps/v1
kind: Deployment
metadata:
  name: ydsz-pmis-gateway
  namespace: pmis
  labels:
    app: ydsz-pmis-gateway
    tier: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ydsz-pmis-gateway
  template:
    metadata:
      labels:
        app: ydsz-pmis-gateway
        tier: gateway
    spec:
      containers:
        - name: gateway
          image: ydsz-pmis/gateway:IMAGE_TAG   # 由 overlay 替换
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: pmis-common-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ydsz-pmis-gateway
  namespace: pmis
  labels:
    app: ydsz-pmis-gateway
spec:
  type: ClusterIP
  selector:
    app: ydsz-pmis-gateway
  ports:
    - name: http
      port: 9000
      targetPort: 9000
