apiVersion: apps/v1
kind: Deployment
metadata:
  name: ydsz-gateway
  namespace: pmis
  labels:
    app: ydsz-gateway
    tier: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ydsz-gateway
  template:
    metadata:
      labels:
        app: ydsz-gateway
        tier: gateway
    spec:
      containers:
        - name: gateway
          image: ydsz/gateway:IMAGE_TAG   # 由 overlay 替换
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: pmis-common-config
          # P2-7: JVM 容器感知调优（MaxRAMPercentage 替代固定 Xmx，适配不同规格节点）
          env:
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:+UseContainerSupport
                -XX:MaxRAMPercentage=75.0
                -XX:InitialRAMPercentage=50.0
                -XX:+UseG1GC
                -XX:MaxGCPauseMillis=200
                -XX:+HeapDumpOnOutOfMemoryError
                -XX:HeapDumpPath=/app/logs/heapdump
                -Dfile.encoding=UTF-8
                -Duser.timezone=Asia/Shanghai
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ydsz-gateway
  namespace: pmis
  labels:
    app: ydsz-gateway
spec:
  type: ClusterIP
  selector:
    app: ydsz-gateway
  ports:
    - name: http
      port: 9000
      targetPort: 9000
