apiVersion: apps/v1
kind: Deployment
metadata:
  name: ydsz-nextwiki
  namespace: ydsz
  labels:
    app: ydsz-nextwiki
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ydsz-nextwiki
  template:
    metadata:
      labels:
        app: ydsz-nextwiki
        tier: backend
    spec:
      containers:
        - name: nextwiki
          image: ydsz/nextwiki:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8800
          envFrom:
            - configMapRef:
                name: ydsz-common-config
            - secretRef:
                name: ydsz-db-secret
            - secretRef:
                name: ydsz-jasypt-secret
          # JVM 容器感知调优（nextwiki 文档预览/全文检索内存需求适中）
          env:
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:+UseContainerSupport
                -XX:MaxRAMPercentage=75.0
                -XX:InitialRAMPercentage=50.0
                -XX:+UseG1GC
                -XX:MaxGCPauseMillis=200
                -XX:+HeapDumpOnOutOfMemoryError
                -XX:HeapDumpPath=/app/logs/heapdump
                -Dfile.encoding=UTF-8
                -Duser.timezone=Asia/Shanghai
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8800
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8800
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ydsz-nextwiki
  namespace: ydsz
spec:
  type: ClusterIP
  selector:
    app: ydsz-nextwiki
  ports:
  - name: http
    port: 8800
    targetPort: 8800
