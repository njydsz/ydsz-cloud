apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 公共 base:包含 8 个微服务的 Deployment+Service + namespace + configmap + secret
# 通过 overlays/{dev,sit,uat,prod}/kustomization.yaml 引用本 base 做环境差异

namespace: pmis

resources:
  - namespace.yaml
  - configmap-common.yaml
  - secret-db.yaml
  - secret-jasypt.yaml
  # SkyWalking Java Agent 配置 (链路追踪)
  - skywalking-agent.yaml
  - gateway.yaml
  - userinfo.yaml
  - system.yaml
  - project.yaml
  - message.yaml
  - cronjob.yaml
  - workflow.yaml
  - agent.yaml
  # Prometheus Operator ServiceMonitor - 让 Prometheus 自动抓取 PMIS 微服务指标
  # 解决告警规则因无抓取目标而全部失效的 P0 问题
  - servicemonitor.yaml
  # P2-7: HPA 自动扩缩容 + PDB 中断预算
  - hpa-pdb.yaml

# 镜像 tag 由 overlay 覆盖(默认 latest,实际部署请改为具体版本)
images:
  - name: ydsz-pmis/gateway
    newTag: IMAGE_TAG
  - name: ydsz-pmis/userinfo
    newTag: IMAGE_TAG
  - name: ydsz-pmis/system
    newTag: IMAGE_TAG
  - name: ydsz-pmis/project
    newTag: IMAGE_TAG
  - name: ydsz-pmis/message
    newTag: IMAGE_TAG
  - name: ydsz-pmis/cronjob
    newTag: IMAGE_TAG
  - name: ydsz-pmis/workflow
    newTag: IMAGE_TAG
  - name: ydsz-pmis/agent
    newTag: IMAGE_TAG

# 公共标签
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: ydsz-pmis
      app.kubernetes.io/managed-by: kustomize
