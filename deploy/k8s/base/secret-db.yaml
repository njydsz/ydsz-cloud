# =============================================================================
# PMIS 数据库/中间件 Secret 模板
# -----------------------------------------------------------------------------
# 重要安全提示:
#   本文件仅作为占位模板，禁止提交真实密码。
#   生产环境必须使用以下任一方案替代:
#
#   方案 A（推荐）: Sealed Secrets
#     1. 安装 sealed-secrets-controller:
#        kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.27.3/controller.yaml
#     2. 生成加密 SealedSecret:
#        echo -n '<your-real-password>' | kubectl create secret generic pmis-db-secret \
#          --dry-run=client --from-file=POSTGRES_PASSWORD=/dev/stdin -o yaml | \
#          kubeseal --format yaml > deploy/k8s/base/sealed-secret-db.yaml
#     3. 用生成的 sealed-secret-db.yaml 替换本文件提交到仓库
#
#   方案 B（更安全）: External Secrets Operator + Vault/云 KMS
#     1. 安装 external-secrets: https://external-secrets.io/latest/
#     2. 配置 SecretStore 指向 Vault/AWS Secrets Manager/阿里云 KMS
#     3. 创建 ExternalSecret 引用远端密钥
#
#   方案 C（临时）: kubectl create secret 命令行注入（不入仓）
#     kubectl create secret generic pmis-db-secret \
#       --from-literal=POSTGRES_PASSWORD='<real>' \
#       --from-literal=REDIS_PASSWORD='<real>' \
#       --from-literal=NACOS_PASSWORD='<real>' \
#       --from-literal=MINIO_ROOT_PASSWORD='<real>'
#
# 审计要求:
#   - 密码至少每 90 天轮换一次
#   - 任何密钥变更需记录到审计日志
#   - 如发现密码泄露（如曾出现在 git 历史中）必须立即轮换
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: pmis-db-secret
  namespace: pmis
  labels:
    app.kubernetes.io/part-of: ydsz-pmis
  annotations:
    # 标记此 Secret 仅作占位，部署时由 Sealed Secrets / External Secrets 覆盖
    pmis.ydsz.cn/secret-source: "placeholder-only"
    pmis.ydsz.cn/rotation-required: "every-90-days"
type: Opaque
stringData:
  # 占位符 - 部署时必须由 Sealed Secrets 覆盖，禁止使用真实密码
  POSTGRES_PASSWORD: "REPLACE_VIA_SEALED_SECRETS"
  REDIS_PASSWORD: "REPLACE_VIA_SEALED_SECRETS"
  NACOS_PASSWORD: "REPLACE_VIA_SEALED_SECRETS"
  MINIO_ROOT_PASSWORD: "REPLACE_VIA_SEALED_SECRETS"
