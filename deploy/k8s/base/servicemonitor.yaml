# =============================================================================
# ServiceMonitor - 让 Prometheus Operator 自动抓取 PMIS 微服务指标
# -----------------------------------------------------------------------------
# 解决问题:
#   pmis-alerts.yml 中 12 条告警规则全部失效,根因是 Prometheus 无 ServiceMonitor
#   抓取配置,导致 up{job=~"pmis-.*"} 永远为空,所有告警无法触发。
#
# 工作机制:
#   Prometheus Operator 通过 serviceMonitorSelector 发现本 ServiceMonitor,
#   按 namespaceSelector + selector 筛选 Service,对 port: http 抓取 /actuator/prometheus。
#
# 前提条件:
#   1. 已部署 Prometheus Operator(kube-prometheus-stack helm chart)
#   2. Prometheus CRD 的 serviceMonitorSelector.matchLabels 包含 release: prometheus
#   3. PMIS 各 Service 的 port name 为 http(已确认 gateway/system/project 一致)
#   4. kustomize labels 已为所有 Service 注入 app.kubernetes.io/part-of: ydsz
#   5. 微服务 Actuator 已暴露 /actuator/prometheus(见 application.yml management.endpoints)
#
# 部署:
#   kubectl apply -k deploy/k8s/base/  (由 kustomization.yaml 自动包含)
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pmis-services
  namespace: pmis
  labels:
    app.kubernetes.io/part-of: ydsz
    app.kubernetes.io/managed-by: kustomize
    # release 标签需与 Prometheus Operator 的 serviceMonitorSelector matchLabels 一致
    # kube-prometheus-stack 默认使用 release: <helm-release-name>
    release: prometheus
spec:
  # 仅抓取 pmis 命名空间下的 Service
  namespaceSelector:
    matchNames:
      - pmis
  # 通过 kustomize 注入的公共标签筛选 PMIS 服务
  # (kustomization.yaml labels.includeSelectors: true 已为所有 Service 打此标签)
  selector:
    matchLabels:
      app.kubernetes.io/part-of: ydsz
  endpoints:
    # port name 需与 Service.ports[].name 一致(已确认 gateway/system/project 均为 http)
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
      # honor_labels 保留微服务自身暴露的 job/application 标签
      # 使 up{job=~"pmis-.*"} 能匹配到 pmis-* 服务
      honorLabels: true
      # 附加 namespace 标签,便于告警规则按 namespace 过滤
      relabelings:
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_service_name]
          targetLabel: service
