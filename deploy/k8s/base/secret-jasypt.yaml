apiVersion: v1
kind: Secret
metadata:
  name: ydsz-jasypt-secret
  labels:
    app.kubernetes.io/part-of: ydsz
type: Opaque
# 使用 stringData 避免重复 base64 编码，部署时由 external-secrets 或手动 kubectl 创建
# 生产环境通过以下方式之一注入：
# 1. kubectl create secret generic ydsz-jasypt-secret --from-literal=jasypt-encryptor-password='your-strong-password'
# 2. Sealed Secrets / External Secrets Operator
stringData:
  jasypt-encryptor-password: <change-me-in-production>
