apiVersion: v1
kind: ConfigMap
metadata:
  name: ydsz-common-config
  namespace: ydsz
  labels:
    app.kubernetes.io/part-of: ydsz
data:
  # Spring Cloud Alibaba Nacos 地址
  # 集群内部访问请把 host 替换为 Service DNS: nacos-server.ydsz.svc.cluster.local
  SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: "nacos-server.ydsz.svc.cluster.local:8848"
  SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: "nacos-server.ydsz.svc.cluster.local:8848"
  SPRING_CLOUD_NACOS_NAMESPACE: "ydsz"

  # 公共日志/编码
  SERVER_TOMCAT_URI_ENCODING: "UTF-8"
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_NJYDSZ_YDSZ: "INFO"

  # P1-4: 全链路追踪上报配置（K8s 环境默认开启，对接 SkyWalking OAP）
  # TRACING_ENDPOINT 必须与 skywalking-oap.yaml Service 暴露的 zipkin 端口(9412)一致
  # namespace=observability(K8s 部署),开发环境 docker-compose 用 monitoring
  TRACING_EXPORT_ENABLED: "true"
  TRACING_ENDPOINT: "http://skywalking-oap.observability.svc.cluster.local:9412/api/v2/spans"
  # P2-12: 环境差异化采样率
  #   dev:  1.0 (100% 全量采样，便于调试)
  #   sit:  0.5 (50% 采样)
  #   uat:  0.3 (30% 采样)
  #   prod: 0.1 (10% 采样，配合错误全量上报策略)
  TRACING_SAMPLING_PROBABILITY: "0.1"
  # P2-12: 慢链路阈值（ms），超过此值的链路必定采样上报
  TRACING_SLOW_TRACE_THRESHOLD_MS: "500"
  # P2-12: 链路数据保留天数（OAP 侧配置）
  TRACING_TTL_DAYS: "7"
