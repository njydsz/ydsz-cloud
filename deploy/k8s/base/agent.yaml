apiVersion: apps/v1
kind: Deployment
metadata:
  name: ydsz-pmis-agent
  namespace: pmis
  labels:
    app: ydsz-pmis-agent
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ydsz-pmis-agent
  template:
    metadata:
      labels:
        app: ydsz-pmis-agent
        tier: backend
    spec:
      containers:
        - name: agent
          image: ydsz-pmis/agent:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9007
          envFrom:
            - configMapRef:
                name: pmis-common-config
          # P2-7: JVM 容器感知调优（Agent 服务内存需求较大，MaxRAMPercentage=75%）
          env:
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:+UseContainerSupport
                -XX:MaxRAMPercentage=75.0
                -XX:InitialRAMPercentage=50.0
                -XX:+UseG1GC
                -XX:MaxGCPauseMillis=200
                -XX:+HeapDumpOnOutOfMemoryError
                -XX:HeapDumpPath=/app/logs/heapdump
                -Dfile.encoding=UTF-8
                -Duser.timezone=Asia/Shanghai
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9007
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9007
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ydsz-pmis-agent
  namespace: pmis
spec:
  type: ClusterIP
  selector:
    app: ydsz-pmis-agent
  ports:
  - name: http
    port: 9007
    targetPort: 9007
