# =============================================================================
# P2-7: HorizontalPodAutoscaler + PodDisruptionBudget
# -----------------------------------------------------------------------------
# 作用: 为所有微服务配置 HPA（自动扩缩容）和 PDB（自愿中断预算）
# 策略:
#   HPA: 基于 CPU(>70%) 和 内存(>80%) 双指标自动扩缩
#        min=2, max=6（保证最低可用 + 限制成本）
#   PDB: maxUnavailable=1（保证滚动更新/节点维护时至少 1 个 Pod 可用）
# JVM: 容器感知堆内存（-XX:MaxRAMPercentage=75.0），避免固定 Xmx 不适配不同规格节点
# =============================================================================

---
# Gateway HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ydsz-gateway-hpa
  namespace: ydsz
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ydsz-gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

---
# Gateway PDB
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ydsz-gateway-pdb
  namespace: ydsz
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: ydsz-gateway

