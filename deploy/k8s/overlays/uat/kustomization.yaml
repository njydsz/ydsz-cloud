apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# UAT 环境:用户验收测试,2-3 副本 + INFO 日志
# 用法:kubectl apply -k deploy/k8s/overlays/uat

namespace: ydsz-uat

resources:
  - ../../base

namePrefix: uat-

images:
  - name: ydsz/gateway
    newTag: v1.0.0-rc.2
  - name: ydsz/system
    newTag: v1.0.0-rc.2
  - name: ydsz/userinfo
    newTag: v1.0.0-rc.2
  - name: ydsz/project
    newTag: v1.0.0-rc.2
  - name: ydsz/cronjob
    newTag: v1.0.0-rc.2
  - name: ydsz/workflow
    newTag: v1.0.0-rc.2

# P2-12: UAT 环境 30% 采样
configMapGenerator:
  - name: ydsz-common-config
    behavior: merge
    literals:
      - TRACING_SAMPLING_PROBABILITY=0.3
      - TRACING_EXPORT_ENABLED=true
      - TRACING_SLOW_TRACE_THRESHOLD_MS=500

patches:
  - path: patch-replicas.yaml
