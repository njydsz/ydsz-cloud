apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# SIT 环境:系统集成测试,2 副本 + 关闭 DEBUG
# 用法:kubectl apply -k deploy/k8s/overlays/sit

namespace: pmis-sit

resources:
  - ../../base

namePrefix: sit-

images:
  - name: ydsz-pmis/gateway
    newTag: v1.3.0-rc.1
  - name: ydsz-pmis/system
    newTag: v1.3.0-rc.1
  - name: ydsz-pmis/userinfo
    newTag: v1.3.0-rc.1
  - name: ydsz-pmis/project
    newTag: v1.3.0-rc.1
  - name: ydsz-pmis/cronjob
    newTag: v1.3.0-rc.1
  - name: ydsz-pmis/workflow
    newTag: v1.3.0-rc.1
  - name: ydsz-pmis/agent
    newTag: v1.3.0-rc.1

patches:
  - path: patch-replicas.yaml
