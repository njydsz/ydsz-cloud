apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# DEV 环境:单实例 + DEBUG 日志 + 关闭资源限制
# 用法:kubectl apply -k deploy/k8s/overlays/dev

namespace: pmis-dev

resources:
  - ../../base

namePrefix: dev-

# 镜像 tag 替换(开发环境用 SNAPSHOT)
# P2-9: 补齐 message/agent/sales/finance 镜像 tag，避免残留 IMAGE_TAG 占位符
images:
  - name: ydsz-pmis/gateway
    newTag: v1.3.0-SNAPSHOT
  - name: ydsz-pmis/system
    newTag: v1.3.0-SNAPSHOT
  - name: ydsz-pmis/userinfo
    newTag: v1.3.0-SNAPSHOT
  - name: ydsz-pmis/project
    newTag: v1.3.0-SNAPSHOT
  - name: ydsz-pmis/cronjob
    newTag: v1.3.0-SNAPSHOT
  - name: ydsz-pmis/workflow
    newTag: v1.3.0-SNAPSHOT
  - name: ydsz-pmis/message
    newTag: v1.3.0-SNAPSHOT
  - name: ydsz-pmis/agent
    newTag: v1.3.0-SNAPSHOT
  - name: ydsz-pmis/sales
    newTag: v1.3.0-SNAPSHOT
  - name: ydsz-pmis/finance
    newTag: v1.3.0-SNAPSHOT

# 单实例 + DEV ConfigMap 覆盖（调试日志 + 全量采样）
patches:
  - path: patch-replicas.yaml
  - path: patch-configmap.yaml
