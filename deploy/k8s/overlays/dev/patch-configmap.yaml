# DEV 环境 ConfigMap 补丁：覆盖日志级别和追踪采样率
# Strategic merge patch：向 base pmis-common-config 追加 DEV 专属配置
# 注意：name/namespace 使用 base 原始值（namePrefix 和 namespace transformer 在 patch 之后执行）

apiVersion: v1
kind: ConfigMap
metadata:
  name: pmis-common-config
  namespace: pmis
data:
  # 调试日志：PMIS 包日志设为 DEBUG
  LOGGING_LEVEL_COM_NJYDSZ_PMIS: "DEBUG"
  LOGGING_LEVEL_ROOT: "INFO"
  # P2-12: DEV 环境全量采样 + 导出开启
  TRACING_SAMPLING_PROBABILITY: "1.0"
  TRACING_EXPORT_ENABLED: "true"
  TRACING_SLOW_TRACE_THRESHOLD_MS: "200"
