# PROD HPA:覆盖 base HPA 的 minReplicas / maxReplicas
# 保留 base 的 CPU+memory 双指标和 scaleUp/scaleDown behavior（strategic merge patch 只覆盖标量字段）
# 注意：HPA 名称必须与 base/hpa-pdb.yaml 一致（带 -hpa 后缀）
# 需要集群安装 metrics-server

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ydsz-pmis-gateway-hpa
  namespace: pmis
spec:
  minReplicas: 3
  maxReplicas: 10
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ydsz-pmis-system-hpa
  namespace: pmis
spec:
  minReplicas: 3
  maxReplicas: 8
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ydsz-pmis-userinfo-hpa
  namespace: pmis
spec:
  minReplicas: 3
  maxReplicas: 8
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ydsz-pmis-project-hpa
  namespace: pmis
spec:
  minReplicas: 4
  maxReplicas: 12
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ydsz-pmis-message-hpa
  namespace: pmis
spec:
  minReplicas: 2
  maxReplicas: 8
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ydsz-pmis-workflow-hpa
  namespace: pmis
spec:
  minReplicas: 3
  maxReplicas: 8
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ydsz-pmis-agent-hpa
  namespace: pmis
spec:
  minReplicas: 2
  maxReplicas: 6
---
