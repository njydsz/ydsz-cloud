# =============================================================================
# 生产环境 Sentry 错误监控配置（P0-5 生产环境启用）
# -----------------------------------------------------------------------------
# 通过 K8s ConfigMap 为所有微服务注入 Sentry 配置
# Sentry DSN 通过 Secret 引用，避免明文暴露
#
# 后端：环境变量 PMIS_SENTRY_* → Spring Boot relaxed binding → pmis.sentry.*
# 前端：通过 Ingress 注入 <meta name="sentry-dsn"> 或 CI/CD 构建时注入 .env
#
# 采样策略（对齐大厂标准）：
#   后端错误采样率：100%（所有异常均上报）
#   后端性能采样率：10%（避免高吞吐下 Sentry 压力过大）
#   前端错误采样率：100%
#   前端性能采样率：20%
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: pmis-common-config
  namespace: pmis
data:
  # 启用 Sentry
  PMIS_SENTRY_ENABLED: "true"
  # 环境标识
  PMIS_SENTRY_ENVIRONMENT: "prod"
  # 性能采样率（生产环境 10%，平衡可见度与成本）
  PMIS_SENTRY_TRACES_SAMPLE_RATE: "0.1"
  # 错误采样率（生产环境 100%，所有异常均上报）
  PMIS_SENTRY_SAMPLE_RATE: "1.0"
  # 发布版本（由 CD 流水线通过 IMAGE_TAG 覆盖）
  PMIS_SENTRY_RELEASE: "pmis-1.0.0"
---
# Sentry DSN 通过 Secret 注入（避免明文暴露在 ConfigMap 中）
# 包含后端 DSN 和前端 DSN（前端 DSN 在构建时通过 CI/CD 注入 .env）
apiVersion: v1
kind: Secret
metadata:
  name: pmis-sentry-secret
  namespace: pmis
type: Opaque
stringData:
  # 实际 DSN 通过 kubectl create secret 或 CI/CD 注入
  # kubectl create secret generic pmis-sentry-secret \
  #   --from-literal=PMIS_SENTRY_DSN='https://xxx@sentry.example.com/1' \
  #   --from-literal=VITE_SENTRY_DSN='https://xxx@sentry.example.com/2' \
  #   -n pmis
  PMIS_SENTRY_DSN: "REPLACE_VIA_CI_CD"
---
# 前端 Sentry DSN（构建时注入，与后端可共用同一 Project 或独立 Project）
# CI/CD 流水线中通过 sed 替换 .env.production 的 VITE_SENTRY_DSN
# 示例：sed -i "s|VITE_SENTRY_DSN=|VITE_SENTRY_DSN=$SENTRY_FRONTEND_DSN|" .env.production
