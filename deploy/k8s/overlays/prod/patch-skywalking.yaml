# =============================================================================
# SkyWalking Agent 注入补丁 (Prod)
# -----------------------------------------------------------------------------
# 为所有微服务 Deployment 添加:
#   1. init-container 下载 SkyWalking Java Agent
#   2. 共享 volume 挂载 agent 目录
#   3. JAVA_TOOL_OPTIONS 环境变量注入 -javaagent
#   4. SW_AGENT_NAME 标识服务名
# 使用 kustomize strategic merge patch 覆盖各 Deployment
# =============================================================================

# Gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ydsz-pmis-gateway
  namespace: pmis
spec:
  template:
    spec:
      initContainers:
        - name: skywalking-agent
          image: apache/skywalking-java-agent:9.4.0-java17
          command:
            - sh
            - -c
            - cp -r /skywalking/agent /skywalking/agent-shared/
          volumeMounts:
            - name: skywalking-agent
              mountPath: /skywalking/agent-shared
      containers:
        - name: gateway
          envFrom:
            - configMapRef:
                name: skywalking-agent-config
          env:
            - name: SW_AGENT_NAME
              value: "ydsz-pmis-gateway"
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/skywalking/agent/skywalking-agent.jar"
          volumeMounts:
            - name: skywalking-agent
              mountPath: /skywalking/agent
              readOnly: true
      volumes:
        - name: skywalking-agent
          emptyDir: {}

