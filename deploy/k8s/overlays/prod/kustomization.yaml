apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PROD 环境:多副本 + HPA + 严格资源限制 + PDB
# 用法:kubectl apply -k deploy/k8s/overlays/prod

namespace: pmis

resources:
  - ../../base

images:
  - name: ydsz-pmis/gateway
    newTag: v1.3.0
  - name: ydsz-pmis/system
    newTag: v1.3.0
  - name: ydsz-pmis/userinfo
    newTag: v1.3.0
  - name: ydsz-pmis/project
    newTag: v1.3.0
  - name: ydsz-pmis/cronjob
    newTag: v1.3.0
  - name: ydsz-pmis/workflow
    newTag: v1.3.0
  - name: ydsz-pmis/agent
    newTag: v1.3.0

patches:
  - path: patch-replicas.yaml
  - path: patch-resources.yaml
  - path: patch-hpa.yaml
  - path: patch-pdb.yaml
