apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PROD 环境:多副本 + HPA + 严格资源限制 + PDB + Sentry 监控
# 用法:kubectl apply -k deploy/k8s/overlays/prod

namespace: ydsz

# P0-3 修复：原文件存在重复 resources 键（第 9 行 + 第 40 行），YAML 重复键会导致
# kustomize 行为不可预期。修复：合并为单个 resources 列表。
# P2-9 修复：原 patch-sentry.yaml 同时包含 ConfigMap（与 base ydsz-common-config 重名）
#   和 Secret，放在 resources 导致 ConfigMap ID 冲突构建失败。
#   拆分为：patch-sentry.yaml（ConfigMap strategic merge patch → patches）
#          sentry-secret.yaml（Secret 独立资源 → resources）
resources:
  - ../../base
  # P1-3: 生产环境 Sentry DSN Secret（独立 Secret 资源）
  - sentry-secret.yaml
  # P0-3: 生产环境 SkyWalking 全链路追踪配置（ConfigMap 资源）
  - patch-tracing.yaml

images:
  - name: ydsz/gateway
    newTag: v1.0.0
  - name: ydsz/userinfo
    newTag: v1.0.0
  - name: ydsz/system
    newTag: v1.0.0
  - name: ydsz/project
    newTag: v1.0.0
  - name: ydsz/message
    newTag: v1.0.0
  - name: ydsz/cronjob
    newTag: v1.0.0
  - name: ydsz/workflow
    newTag: v1.0.0
  - name: ydsz/agent
    newTag: v1.0.0
  # P2-9: 补齐 sales / finance 镜像 tag，避免部署时残留字面占位符 IMAGE_TAG
  - name: ydsz/sales
    newTag: v1.0.0
  - name: ydsz/finance
    newTag: v1.0.0
  - name: ydsz/nextwiki
    newTag: v1.0.0

patches:
  - path: patch-replicas.yaml
  - path: patch-resources.yaml
  - path: patch-affinity.yaml
  - path: patch-hpa.yaml
  - path: patch-pdb.yaml
  # P2-9: Sentry ConfigMap strategic merge patch（向 ydsz-common-config 追加 YDSZ_SENTRY_* 键）
  - path: patch-sentry.yaml
  # SkyWalking Java Agent 注入 (链路追踪，strategic merge patch 修改 base 中的 Deployment)
  - path: patch-skywalking.yaml
