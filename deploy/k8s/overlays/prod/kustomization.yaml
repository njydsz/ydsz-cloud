apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PROD 环境:多副本 + HPA + 严格资源限制 + PDB + Sentry 监控
# 用法:kubectl apply -k deploy/k8s/overlays/prod

namespace: pmis

# P0-3 修复：原文件存在重复 resources 键（第 9 行 + 第 40 行），YAML 重复键会导致
# kustomize 行为不可预期。修复：合并为单个 resources 列表。
# 注意：patch-sentry.yaml 是独立 K8s 资源（ConfigMap + Secret），不是 strategic merge patch，
#       必须放在 resources 中（与 ../../base 一起），不能放进 patches。
resources:
  - ../../base
  # P1-3: 生产环境 Sentry 错误监控配置（独立 ConfigMap + Secret 资源）
  - patch-sentry.yaml
  # P0-3: 生产环境 SkyWalking 全链路追踪配置（ConfigMap 资源）
  - patch-tracing.yaml

images:
  - name: ydsz-pmis/gateway
    newTag: v1.3.0
  - name: ydsz-pmis/userinfo
    newTag: v1.3.0
  - name: ydsz-pmis/system
    newTag: v1.3.0
  - name: ydsz-pmis/project
    newTag: v1.3.0
  - name: ydsz-pmis/message
    newTag: v1.3.0
  - name: ydsz-pmis/cronjob
    newTag: v1.3.0
  - name: ydsz-pmis/workflow
    newTag: v1.3.0
  - name: ydsz-pmis/agent
    newTag: v1.3.0

patches:
  - path: patch-replicas.yaml
  - path: patch-resources.yaml
  - path: patch-affinity.yaml
  - path: patch-hpa.yaml
  - path: patch-pdb.yaml
  # SkyWalking Java Agent 注入 (链路追踪，strategic merge patch 修改 base 中的 Deployment)
  - path: patch-skywalking.yaml
