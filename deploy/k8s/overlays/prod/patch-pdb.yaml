# PROD PodDisruptionBudget:覆盖 base PDB 的中断策略
# 注意：PDB 名称必须与 base/hpa-pdb.yaml 一致（带 -pdb 后缀）
# 使用 maxUnavailable 与 base 策略一致（strategic merge patch 不会产生 minAvailable+maxUnavailable 冲突）

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ydsz-pmis-gateway-pdb
  namespace: pmis
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: ydsz-pmis-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ydsz-pmis-system-pdb
  namespace: pmis
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: ydsz-pmis-system
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ydsz-pmis-userinfo-pdb
  namespace: pmis
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: ydsz-pmis-userinfo
---
# Project 副本数 4，允许 2 个不可用（等价于原 minAvailable: 2）
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ydsz-pmis-project-pdb
  namespace: pmis
spec:
  maxUnavailable: 2
  selector:
    matchLabels:
      app: ydsz-pmis-project
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ydsz-pmis-workflow-pdb
  namespace: pmis
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: ydsz-pmis-workflow
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ydsz-pmis-message-pdb
  namespace: pmis
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: ydsz-pmis-message
---
# P2-9: 补齐 sales / finance PDB（maxUnavailable: 1，与 base 策略一致）
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ydsz-pmis-sales-pdb
  namespace: pmis
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: ydsz-pmis-sales
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ydsz-pmis-finance-pdb
  namespace: pmis
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: ydsz-pmis-finance
