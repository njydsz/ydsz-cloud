# PROD PodDisruptionBudget:覆盖 base PDB 的中断策略
# 注意：PDB 名称必须与 base/hpa-pdb.yaml 一致（带 -pdb 后缀）
# 使用 maxUnavailable 与 base 策略一致（strategic merge patch 不会产生 minAvailable+maxUnavailable 冲突）

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ydsz-gateway-pdb
  namespace: ydsz
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: ydsz-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ydsz-system-pdb
  namespace: ydsz
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: ydsz-system
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ydsz-userinfo-pdb
  namespace: ydsz
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: ydsz-userinfo
---
# Project 副本数 4，允许 2 个不可用（等价于原 minAvailable: 2）
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ydsz-project-pdb
  namespace: ydsz
spec:
  maxUnavailable: 2
  selector:
    matchLabels:
      app: ydsz-project
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ydsz-workflow-pdb
  namespace: ydsz
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: ydsz-workflow
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ydsz-message-pdb
  namespace: ydsz
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: ydsz-message
---
# P2-9: 补齐 sales / finance PDB（maxUnavailable: 1，与 base 策略一致）
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ydsz-sales-pdb
  namespace: ydsz
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: ydsz-sales
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ydsz-finance-pdb
  namespace: ydsz
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: ydsz-finance
