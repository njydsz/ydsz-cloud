# =============================================================================
# 生产环境 Sentry DSN Secret（P0-5 生产环境启用）
# -----------------------------------------------------------------------------
# 独立 K8s Secret 资源：Sentry DSN 通过 Secret 注入，避免明文暴露在 ConfigMap 中
# 包含后端 DSN 和前端 DSN（前端 DSN 在构建时通过 CI/CD 注入 .env）
#
# 创建方式（二选一）：
#   1. kubectl create secret generic ydsz-sentry-secret \
#        --from-literal=YDSZ_SENTRY_DSN='https://xxx@sentry.example.com/1' \
#        --from-literal=VITE_SENTRY_DSN='https://xxx@sentry.example.com/2' \
#        -n ydsz
#   2. 由 CD 流水线通过 kustomize secretGenerator 或 sealed-secrets 注入
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: ydsz-sentry-secret
  namespace: ydsz
type: Opaque
stringData:
  # 实际 DSN 通过 kubectl create secret 或 CI/CD 注入
  YDSZ_SENTRY_DSN: "REPLACE_VIA_CI_CD"
---
# 前端 Sentry DSN（构建时注入，与后端可共用同一 Project 或独立 Project）
# CI/CD 流水线中通过 sed 替换 .env.production 的 VITE_SENTRY_DSN
# 示例：sed -i "s|VITE_SENTRY_DSN=|VITE_SENTRY_DSN=$SENTRY_FRONTEND_DSN|" .env.production
