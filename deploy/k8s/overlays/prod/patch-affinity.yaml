# PROD HA: Pod 反亲和（跨节点） + 拓扑分布（跨可用区） + 启动探针
# 避免 Java 应用慢启动被 liveness 探针杀死；确保同一服务副本分布到不同节点/可用区
# 用法: kustomization.yaml patches 中引用

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ydsz-gateway
  namespace: pmis
spec:
  template:
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: ydsz-gateway
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ydsz-gateway
      containers:
        - name: gateway
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
---
