# PROD 资源限制:更严格的 requests/limits
# 通过 strategic merge patch 修改 base 中 7 个服务的资源规格

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ydsz-pmis-gateway
spec:
  template:
    spec:
      containers:
        - name: gateway
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: 2000m
              memory: 1.5Gi
---
