# ====================================================================
#  PMIS Prometheus 监控编排（批次 19 落地）
#  ---------------------------------------------------------------------
#  包含：
#    - Prometheus（指标采集 + 告警规则）
#    - Alertmanager（告警路由与通知，批次 21 P2-21）
#    - Grafana（可视化 4 套 dashboard）
#    - Node Exporter（主机指标，可选）
#  依赖：14 个微服务已部署并暴露 /actuator/prometheus
#  用法：docker compose -f docker-compose.monitoring.yml up -d
# ====================================================================

name: pmis-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: pmis-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks:
      - pmis-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: pmis-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-pmis@2026}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - pmis-net
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: pmis-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
    networks:
      - pmis-net

  # Alertmanager（告警路由与通知，批次 21 P2-21）
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: pmis-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped
    networks:
      - pmis-net

volumes:
  prometheus-data:
    name: pmis-prometheus-data
  grafana-data:
    name: pmis-grafana-data

networks:
  pmis-net:
    name: pmis-network
    external: true
    driver: bridge
