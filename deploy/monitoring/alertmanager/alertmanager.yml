# =============================================================================
# Alertmanager 主配置 - PMIS 告警通知中枢
# -----------------------------------------------------------------------------
# 部署:
#   挂载至容器 /etc/alertmanager/alertmanager.yml
#   docker-compose 已通过 volume 挂载本文件,无需手动操作
#
# 告警分级路由(对应 pmis-alerts.yml 中 labels.severity,值为大写 P0/P1/P2):
#   P0 - 电话语音 + 钉钉: 服务下线 / DB 连接池耗尽 / DB 连接失败
#   P1 - 钉钉: 业务指标严重异常 / 5xx 错误率激增 / JVM OOM / Full GC 频繁
#   P2 - 邮件: 性能劣化 / 资源水位 / RocketMQ 堆积
#
# 敏感配置说明:
#   Alertmanager 原生不支持 ${VAR} 占位符替换。本文件直接使用默认值,
#   生产部署通过以下任一方式覆盖:
#     1) docker-compose 启动前 envsubst 预处理生成实际配置
#        (需要 alertmanager.yml.tmpl 模板,见 deploy/scripts/render-alertmanager.sh)
#     2) 启动 alertmanager 时加 --config.expand-env 参数(v0.22+)
#        并将本文件中的占位符语法改为 ${VAR} 形式(本文件未采用此方案)
#     3) K8s 部署用 Secret + envsubst init-container 渲染
# =============================================================================
global:
  # SMTP 邮件发送配置(默认值,生产通过 envsubst 或 Secret 覆盖)
  smtp_smarthost: "smtp.qiye.aliyun.com:465"
  smtp_from: "pmis-alert@ydsz.cn"
  smtp_auth_username: "pmis-alert@ydsz.cn"
  smtp_auth_password: "CHANGE_ME"
  smtp_require_tls: false
  resolve_timeout: 5m

# =============================================================================
# 路由树: 按 severity 分级路由到不同接收器
# 分组策略: 按 alertname + job 分组,避免同类告警刷屏
# =============================================================================
route:
  # 顶层默认接收器(未匹配任何子路由时回退到钉钉)
  receiver: dingtalk-webhook
  # 按 alertname + job 分组,同一告警同一服务聚合为一条通知
  group_by: ["alertname", "job"]
  # 全局聚合窗口(子路由可覆盖)
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # ----------------------------------------------------------------------
    # P0 - 电话语音 + 钉钉(立即通知,0s group_wait 不等聚合)
    # continue: true 使告警继续匹配后续路由,实现多渠道同时通知
    # ----------------------------------------------------------------------
    - matchers:
        - severity = "P0"
      receiver: voice-phone
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 30m
      # 继续匹配后续路由,同时发送钉钉通知
      continue: true

    - matchers:
        - severity = "P0"
      receiver: dingtalk-webhook
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 30m

    # ----------------------------------------------------------------------
    # P1 - 钉钉通知(5 分钟聚合)
    # ----------------------------------------------------------------------
    - matchers:
        - severity = "P1"
      receiver: dingtalk-webhook
      group_wait: 5m
      group_interval: 10m
      repeat_interval: 2h

    # ----------------------------------------------------------------------
    # P2 - 邮件通知(30 分钟聚合)
    # ----------------------------------------------------------------------
    - matchers:
        - severity = "P2"
      receiver: email
      group_wait: 30m
      group_interval: 30m
      repeat_interval: 6h

# =============================================================================
# 抑制规则: 高级别告警触发时抑制相关的低级别告警,避免告警风暴
# =============================================================================
inhibit_rules:
  # ----------------------------------------------------------------------
  # 规则 1: 服务下线时抑制该服务的 5xx 错误率告警
  # 服务都下线了,5xx 错误率告警已无意义(实例不可达必然导致请求失败)
  # ----------------------------------------------------------------------
  - source_matchers:
      - alertname = "PmisServiceDown"
    target_matchers:
      - alertname = "PmisHighErrorRate"
    # 同一 job 才抑制,避免误抑制其他服务的告警
    equal: ["job"]

  # ----------------------------------------------------------------------
  # 规则 2: 数据库连接失败时抑制依赖数据库的告警
  # DB 连接失败会连锁导致连接池耗尽、业务指标采集停滞等,抑制避免重复通知
  # ----------------------------------------------------------------------
  - source_matchers:
      - alertname = "PmisDbConnectionFailed"
    target_matchers:
      - alertname =~ "PmisDbPoolExhausted|PmisBusinessMetricsStale|PmisHighErrorRate"
    # 同一 job 才抑制,仅抑制该服务自身的连锁告警
    equal: ["job"]

  # ----------------------------------------------------------------------
  # 规则 3: P0/P1 高级别告警抑制同类 P2 告警(同一 alertname + job)
  # ----------------------------------------------------------------------
  - source_matchers:
      - severity =~ "P0|P1"
    target_matchers:
      - severity = "P2"
    equal: ["alertname", "job"]

# =============================================================================
# 接收器定义
# 接收器 URL/邮箱地址默认值为内网占位符,生产部署通过 envsubst 或 K8s Secret 覆盖
# =============================================================================
receivers:
  # ----------------------------------------------------------------------
  # 1. voice-phone - 电话语音通知(P0 专用)
  # 通过 webhook 调用电话语音通知服务(如阿里云语音通知 / 容联云通讯)
  # ----------------------------------------------------------------------
  - name: voice-phone
    webhook_configs:
      # 默认内网占位符,生产通过 VOICE_WEBHOOK_URL 环境变量 + envsubst 覆盖
      - url: "http://voice-alert:8060/api/call"
        send_resolved: true
        max_alerts: 0

  # ----------------------------------------------------------------------
  # 2. dingtalk-webhook - 钉钉机器人通知(P0/P1)
  # 使用 dingtalk-template.tmpl 渲染钉钉 markdown 消息
  # ----------------------------------------------------------------------
  - name: dingtalk-webhook
    webhook_configs:
      # 默认内网占位符,生产通过 DINGTALK_WEBHOOK_URL 环境变量 + envsubst 覆盖
      - url: "http://dingtalk-webhook:8060/dingtalk/webhook1/send"
        send_resolved: true
        max_alerts: 0
        http_config:
          follow_redirects: true

  # ----------------------------------------------------------------------
  # 3. email - 邮件通知(P2)
  # ----------------------------------------------------------------------
  - name: email
    email_configs:
      - to: "pmis-sre@ydsz.cn"
        headers:
          Subject: '[PMIS 告警] {{ .CommonLabels.alertname }}'
        html: |
          <h3>{{ .CommonLabels.alertname }}</h3>
          <p><strong>级别:</strong> {{ .CommonLabels.severity }}</p>
          <p><strong>服务:</strong> {{ .CommonLabels.job }}</p>
          <p><strong>摘要:</strong> {{ .CommonAnnotations.summary }}</p>
          <p><strong>详情:</strong> {{ .CommonAnnotations.description }}</p>
          <p><strong>Runbook:</strong> <a href="{{ .CommonAnnotations.runbook_url }}">{{ .CommonAnnotations.runbook_url }}</a></p>
        send_resolved: true

# =============================================================================
# 模板文件引用(dingtalk-template.tmpl 同目录挂载)
# =============================================================================
templates:
  - "/etc/alertmanager/templates/*.tmpl"
