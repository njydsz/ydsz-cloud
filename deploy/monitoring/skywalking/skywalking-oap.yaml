# =============================================================================
# SkyWalking OAP + UI 部署 - PMIS 分布式链路追踪
# -----------------------------------------------------------------------------
# 部署:
#   kubectl apply -f deploy/monitoring/skywalking/skywalking-oap.yaml -n observability
#
# 架构:
#   PMIS 微服务(Brave/Zipkin exporter) → SkyWalking OAP(11800 gRPC / 12800 HTTP)
#   SkyWalking UI(8080) → OAP(12800) 查询链路数据
#
# 存储:
#   开发/测试环境用 H2(内存,重启丢失),生产环境需改 Elasticsearch
#   (修改 application.yml 中 storage.selector: ${SW_STORAGE:elasticsearch})
#
# 数据接入:
#   方式一(推荐): Spring Boot Micrometer Tracing + Zipkin exporter
#     endpoint = http://skywalking-oap:12800/api/v2/spans (Zipkin 兼容 API)
#   方式二: SkyWalking Java Agent(更全功能,需改镜像挂载 agent)
#   方式三: OTLP gRPC(本配置已开启 receiver-otel)
#     endpoint = skywalking-oap.observability.svc.cluster.local:11800
# =============================================================================
# 1. Namespace(与 Loki 共用 observability,如已存在可忽略)
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/part-of: ydsz-pmis

# =============================================================================
# 2. SkyWalking OAP application.yml ConfigMap
#    - 存储: H2(开发环境,内存模式)
#    - 接收器: zipkin(兼容 Brave) + receiver-otel(OTLP gRPC)
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: skywalking-oap-config
  namespace: observability
  labels:
    app.kubernetes.io/name: skywalking-oap
    app.kubernetes.io/part-of: ydsz-pmis
data:
  application.yml: |
    cluster:
      selector: ${SW_CLUSTER:standalone}
      standalone:

    core:
      selector: ${SW_CORE:default}
      default:
        # 服务名(混合云环境需保证唯一)
        name: SkyWalking-OAP
        # 数据落盘目录
        dataPath: /data
        # 时区
        timezone: Asia/Shanghai
        # gRPC 端口(Agent/OTLP 上报)
        gRPCPort: ${SW_GRPC_PORT:11800}
        gRPCHost: ${SW_GRPC_HOST:0.0.0.0}
        # HTTP 端口(UI 查询 + Zipkin 兼容 API)
        httpPort: ${SW_HTTP_PORT:12800}
        httpHost: ${SW_HTTP_HOST:0.0.0.0}
        # 拓扑图计算间隔
        topologyComputeInterval: ${SW_TOPOLOGY_COMPUTE_INTERVAL:5}

    storage:
      # 开发环境用 H2(内存),生产环境改 elasticsearch
      # 生产: SW_STORAGE=elasticsearch + 配置 ES 集群地址
      selector: ${SW_STORAGE:h2}
      h2:
        driver: org.h2.Driver
        url: jdbc:h2:mem:skywalking-oap-db
        user: sa
        metadataMaxSize: 750
      elasticsearch:
        namespace: ${SW_NAMESPACE:""}
        clusterNodes: ${SW_STORAGE_ES_CLUSTER_NODES:localhost:9200}
        protocol: ${SW_STORAGE_ES_HTTP_PROTOCOL:http}
        connectTimeout: ${SW_STORAGE_ES_CONNECT_TIMEOUT:500}
        socketTimeout: ${SW_STORAGE_ES_SOCKET_TIMEOUT:30000}
        user: ${SW_ES_USER:}
        password: ${SW_ES_PASSWORD:}

    # =========================================================================
    # 接收器: Zipkin 兼容 API(接收 Brave/Micrometer Zipkin exporter 上报)
    # 端点: http://skywalking-oap:12800/api/v2/spans
    # =========================================================================
    receiver-zipkin:
      selector: ${SW_RECEIVER_ZIPKIN:default}
      default:
        # 开启 Zipkin v2 API
        enabled: ${SW_RECEIVER_ZIPKIN_ENABLED:true}
        host: ${SW_RECEIVER_ZIPKIN_HOST:0.0.0.0}
        port: ${SW_RECEIVER_ZIPKIN_PORT:9412}
        contextPath: /

    # =========================================================================
    # 接收器: OTLP gRPC(接收 OpenTelemetry SDK 上报)
    # 端点: skywalking-oap.observability.svc.cluster.local:11800
    # =========================================================================
    receiver-otel:
      selector: ${SW_RECEIVER_OTEL:default}
      default:
        enabled: ${SW_RECEIVER_OTEL_ENABLED:true}
        enabledOcRules: ${SW_RECEIVER_OTEL_OC_ENABLED:false}
        # OTLP gRPC 端口(复用 OAP gRPC 11800)
        grpcPort: ${SW_RECEIVER_OTEL_GRPC_PORT:11800}

    # =========================================================================
    # 查询服务(UI 通过此接口查询链路/拓扑/指标)
    # =========================================================================
    query:
      selector: ${SW_QUERY:graphql}
      graphql:
        path: ${SW_QUERY_GRAPHQL_PATH:/graphql}

    # 告警(可选,本项目告警统一走 Prometheus + Alertmanager)
    alarm:
      selector: ${SW_ALARM:default}
      default:
        enabled: ${SW_ALARM_ENABLED:false}

    telemetry:
      selector: ${SW_TELEMETRY:none}
      none:

    configuration:
      selector: none

    exporter:
      selector: none

    health-checker:
      selector: ${SW_HEALTH_CHECKER:default}
      default:
        enabled: ${SW_HEALTH_CHECKER_ENABLED:true}

# =============================================================================
# 3. SkyWalking OAP Server Deployment
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skywalking-oap
  namespace: observability
  labels:
    app.kubernetes.io/name: skywalking-oap
    app.kubernetes.io/part-of: ydsz-pmis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skywalking-oap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skywalking-oap
    spec:
      containers:
        - name: oap
          image: apache/skywalking-oap-server:10.1.0
          imagePullPolicy: IfNotPresent
          ports:
            # gRPC(Agent / OTLP 上报)
            - name: grpc
              containerPort: 11800
            # HTTP(UI 查询 / Zipkin 兼容 API / 健康检查)
            - name: http
              containerPort: 12800
          env:
            - name: TZ
              value: Asia/Shanghai
            # 存储后端: h2(开发) / elasticsearch(生产)
            - name: SW_STORAGE
              value: h2
            # 启用 Zipkin 接收器(兼容 Micrometer Brave exporter)
            - name: SW_RECEIVER_ZIPKIN
              value: default
            # 启用 OTLP 接收器
            - name: SW_RECEIVER_OTEL
              value: default
            # JVM 内存(OAP 推荐 2GB+)
            - name: JAVA_OPTS
              value: "-Xms1g -Xmx1g -XX:MaxDirectMemorySize=512m"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 3Gi
          readinessProbe:
            tcpSocket:
              port: 12800
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 12800
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /skywalking/config/application.yml
              subPath: application.yml
              readOnly: true
            # H2 数据落盘(开发环境,重启丢失可接受)
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: skywalking-oap-config
        - name: data
          emptyDir: {}

# =============================================================================
# 4. SkyWalking OAP Service
#    - 11800 gRPC: Agent/OTLP 上报
#    - 12800 HTTP: UI 查询 + Zipkin 兼容 API(/api/v2/spans)
# =============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: skywalking-oap
  namespace: observability
  labels:
    app.kubernetes.io/name: skywalking-oap
    app.kubernetes.io/part-of: ydsz-pmis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: skywalking-oap
  ports:
    - name: grpc
      port: 11800
      targetPort: grpc
    - name: http
      port: 12800
      targetPort: http

# =============================================================================
# 5. SkyWalking UI Deployment
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skywalking-ui
  namespace: observability
  labels:
    app.kubernetes.io/name: skywalking-ui
    app.kubernetes.io/part-of: ydsz-pmis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skywalking-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skywalking-ui
    spec:
      containers:
        - name: ui
          image: apache/skywalking-ui:10.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: Asia/Shanghai
            # 指向 OAP Server 的 HTTP 查询接口
            - name: SW_OAP_ADDRESS
              value: http://skywalking-oap:12800
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30

# =============================================================================
# 6. SkyWalking UI Service(NodePort 8080,对外暴露 Web UI)
# =============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: skywalking-ui
  namespace: observability
  labels:
    app.kubernetes.io/name: skywalking-ui
    app.kubernetes.io/part-of: ydsz-pmis
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: skywalking-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
      # NodePort 端口(集群外部访问:http://<node-ip>:30080)
      nodePort: 30080
