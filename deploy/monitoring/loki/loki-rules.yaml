# =============================================================================
# Loki Ruler 告警规则 - 基于日志内容的告警（P0-4 / P2-12 同步）
# -----------------------------------------------------------------------------
# 部署:
#   - K8s: 已封装为 ConfigMap 挂载到 Loki Pod /loki/rules/（见 loki-stack.yaml
#     第 8 节 loki-rules ConfigMap）。修改本文件后需同步至 ConfigMap 并
#     kubectl rollout restart statefulset loki -n observability。
#   - Docker Compose: 直接挂载本文件至 Loki 容器 /loki/rules/ydsz-log-alerts.yaml
#
# 告警策略:
#   1. ERROR 日志突增:5 分钟内 ERROR 级别日志 > 10 条 → 告警
#   2. 服务异常:5 分钟内某服务 ERROR 日志 > 50 条 → critical
#   3. OOM / StackOverflow:匹配关键字 → 立即告警
#   4. 数据库连接异常:连接关键字 > 5 条 → 告警
#   5. P2-12 新增:服务无日志输出(可能 Pod 假死) → 告警
#
# 告警链路:
#   Loki Ruler → Alertmanager → 企业微信/钉钉/飞书 Webhook
# =============================================================================
groups:
  - name: ydsz-log-alerts
    interval: 1m
    rules:
      # ----------------------------------------------------------------------
      # 1. ERROR 日志突增告警（全集群维度）
      # 5 分钟内 ERROR 级别日志超过 10 条，触发告警
      # ----------------------------------------------------------------------
      - alert: YdszErrorLogSpike
        expr: |
          sum by (appName) (
            count_over_time(
              {namespace="ydsz", level="ERROR"}[5m]
            )
          ) > 10
        for: 2m
        labels:
          severity: warning
          category: log
        annotations:
          summary: "ERROR 日志突增: {{ $labels.appName }}"
          description: "服务 {{ $labels.appName }} 在过去 5 分钟内产生了超过 10 条 ERROR 日志，请检查日志排查问题。"

      # ----------------------------------------------------------------------
      # 2. 单服务 ERROR 日告警（严重级别）
      # 5 分钟内某服务 ERROR 日志超过 50 条 → critical
      # ----------------------------------------------------------------------
      - alert: YdszErrorLogCritical
        expr: |
          sum by (appName) (
            count_over_time(
              {namespace="ydsz", level="ERROR"}[5m]
            )
          ) > 50
        for: 1m
        labels:
          severity: critical
          category: log
        annotations:
          summary: "严重: 服务 {{ $labels.appName }} ERROR 日志暴增"
          description: "服务 {{ $labels.appName }} 在过去 5 分钟内产生了超过 50 条 ERROR 日志，可能存在严重故障，请立即排查。"

      # ----------------------------------------------------------------------
      # 3. OOM / StackOverflow 关键字检测
      # 匹配 OutOfMemoryError / StackOverflowError 关键字 → 立即告警
      # ----------------------------------------------------------------------
      - alert: YdszJvmCriticalError
        expr: |
          sum by (appName) (
            count_over_time(
              {namespace="ydsz"} |~ "(?i)(OutOfMemoryError|StackOverflowError|GC overhead limit exceeded)"
              [1m]
            )
          ) > 0
        for: 0s
        labels:
          severity: critical
          category: jvm
        annotations:
          summary: "JVM 严重错误: {{ $labels.appName }}"
          description: "服务 {{ $labels.appName }} 检测到 JVM 严重错误（OOM/StackOverflow），可能需要立即重启或扩容。"

      # ----------------------------------------------------------------------
      # 4. 数据库连接池耗尽告警
      # 匹配 connection refused / connection timeout / pool exhausted
      # ----------------------------------------------------------------------
      - alert: YdszDatabaseConnectionIssue
        expr: |
          sum by (appName) (
            count_over_time(
              {namespace="ydsz"} |~ "(?i)(connection refused|connection timeout|pool exhausted|cannot get a connection)"
              [3m]
            )
          ) > 5
        for: 2m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "数据库连接异常: {{ $labels.appName }}"
          description: "服务 {{ $labels.appName }} 检测到数据库连接异常，请检查连接池配置和数据库状态。"

      # ----------------------------------------------------------------------
      # 5. P2-12 新增:服务无日志输出(可能 Pod 假死)
      # 10 分钟内某服务无任何日志 → warning
      # ----------------------------------------------------------------------
      - alert: YdszNoLogOutput
        expr: |
          sum by (appName) (
            count_over_time(
              {namespace="ydsz"}[10m]
            )
          ) == 0
        for: 5m
        labels:
          severity: warning
          category: availability
        annotations:
          summary: "服务无日志输出: {{ $labels.appName }}"
          description: "服务 {{ $labels.appName }} 已 10 分钟无日志输出，可能 Pod 假死或流量异常，请检查健康状态。"
