# =============================================================================
# Loki Stack - K8s 日志聚合(Promtail DaemonSet + Loki StatefulSet)
# -----------------------------------------------------------------------------
# 部署:
#   kubectl apply -f deploy/monitoring/loki/loki-stack.yaml -n observability
#
# 前提:
#   1. 已存在 observability 命名空间(kubectl create ns observability)
#   2. 节点有 /var/log/pods 目录(标准 kubelet 日志路径)
#   3. 生产环境建议将 Loki 存储换为 S3/OSS,本配置使用本地 PV(开发/测试)
#
# 数据流:
#   Pod stdout → kubelet /var/log/pods/* → Promtail DaemonSet → Loki StatefulSet
#   Grafana 通过 Loki 数据源(http://loki:3100)查询日志
# =============================================================================
# 0. Namespace(如已存在可忽略)
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/part-of: ydsz-pmis

# =============================================================================
# 1. Loki 配置 ConfigMap(单节点模式,文件系统存储)
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: ydsz-pmis
data:
  loki-config.yml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage_config:
      filesystem:
        directory: /loki/data
      tsdb_shipper:
        active_index_directory: /loki/tsdb-index
        cache_location: /loki/tsdb-cache
        cache_ttl: 24h
    limits_config:
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20
      max_query_series: 5000
      max_query_parallelism: 16
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      retention_period: 720h
      allow_structured_metadata: true
    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 50
      delete_request_store: filesystem
    analytics:
      reporting_enabled: false

# =============================================================================
# 2. Loki StatefulSet(单节点,通过 volumeClaimTemplates 自动创建 PVC)
# =============================================================================
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: observability
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: ydsz-pmis
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:3.2.1
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/loki/loki-config.yml
          ports:
            - name: http-metrics
              containerPort: 3100
            - name: grpc
              containerPort: 9096
          env:
            - name: TZ
              value: Asia/Shanghai
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /ready
              port: http-metrics
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthy
              port: http-metrics
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: storage
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
  # PVC 模板:StatefulSet 自动创建 loki-storage-0(单节点)
  # 生产环境建议指定 StorageClass 并换 S3/OSS 存储
  volumeClaimTemplates:
    - metadata:
        name: storage
        labels:
          app.kubernetes.io/name: loki
          app.kubernetes.io/part-of: ydsz-pmis
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi

# =============================================================================
# 3. Loki Service(ClusterIP,Grafana/Promtail 通过 loki:3100 访问)
# =============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: observability
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: ydsz-pmis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: http-metrics
      port: 3100
      targetPort: http-metrics
    - name: grpc
      port: 9096
      targetPort: grpc

# =============================================================================
# 4. Promtail 配置 ConfigMap
#    采集 /var/log/pods/* 日志,通过 kubernetes_sd_configs 自动发现 pod
#    按 namespace=pmis 过滤,仅采集 PMIS 服务日志
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: observability
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: ydsz-pmis
data:
  promtail-config.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
      log_level: info

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push
        batchwait: 1s
        batchsize: 1048576
        backoff_min_period: 500ms
        backoff_max_period: 5m
        backoff_max_retries: 10
        timeout: 10s

    scrape_configs:
      # ------------------------------------------------------------------
      # 采集 K8s pod 日志(/var/log/pods/*,kubelet 标准输出)
      # kubernetes_sd_configs 自动发现所有 pod,按 namespace=pmis 过滤
      # ------------------------------------------------------------------
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # 仅采集 pmis 命名空间的 pod 日志
          - source_labels: [__meta_kubernetes_namespace]
            regex: pmis
            action: keep
          # 提取 namespace 作为 label
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          # 提取 pod 名作为 label
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          # 提取容器名作为 label
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          # 提取 app 标签作为 service label(便于按服务筛选)
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          # 提取 pod UID 与容器名拼接日志路径(CRI 日志格式)
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            target_label: __path__
            regex: (.+);(.+)
            replacement: /var/log/pods/$1/$2/*.log
        pipeline_stages:
          # CRI 日志格式:每行以时间戳 + stream(stdout/stderr) + flag + 日志内容
          # 示例: 2024-01-01T00:00:00.000000000Z stdout F {"message":"..."}
          - regex:
              expression: '^(?P<timestamp>\S+)\s+(?P<stream>\S+)\s+(?P<flags>\S+)\s+(?P<content>.*)$'
          - labels:
              stream:
          - timestamp:
              source: timestamp
              format: RFC3339Nano
          # 若 content 是 JSON(LogstashEncoder 输出),解析提取 traceId/level
          - match:
              selector: '{namespace="pmis"}'
              stages:
                - json:
                    expressions:
                      level: level
                      traceId: traceId
                      message: message
                      appName: appName
                    on_missing: skip
                - labels:
                    level:
                    traceId:
                    appName:
                - output:
                    source: message

# =============================================================================
# 5. Promtail DaemonSet(每个节点一个,采集本节点 pod 日志)
# =============================================================================
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: observability
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: ydsz-pmis
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: promtail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:3.2.1
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/promtail/promtail-config.yml
          ports:
            - name: http-metrics
              containerPort: 9080
          env:
            - name: TZ
              value: Asia/Shanghai
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http-metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
              readOnly: true
            # 挂载节点 pod 日志目录(只读)
            - name: pods-logs
              mountPath: /var/log/pods
              readOnly: true
            # 挂载容器日志目录(CRI 运行时)
            - name: containers-logs
              mountPath: /var/log/containers
              readOnly: true
            # 采集位置记录(避免重启重复采集)
            - name: positions
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: pods-logs
          hostPath:
            path: /var/log/pods
        - name: containers-logs
          hostPath:
            path: /var/log/containers
        - name: positions
          emptyDir: {}

# =============================================================================
# 6. Promtail ServiceAccount + ClusterRole(读取 pod 元数据)
# =============================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: observability

# =============================================================================
# 7. Promtail Service(暴露 metrics 便于监控采集器自身)
# =============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: promtail
  namespace: observability
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: ydsz-pmis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: promtail
  ports:
    - name: http-metrics
      port: 9080
      targetPort: http-metrics
