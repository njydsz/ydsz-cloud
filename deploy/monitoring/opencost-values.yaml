# ============================================================
# YDSZ 成本可观测性 — OpenCost 部署配置
# ------------------------------------------------------------
# P3-4: K8s 资源成本监控
#
# 功能:
#   - 按 namespace/pod 采集 CPU/内存/存储成本
#   - Grafana 成本仪表盘
#   - 成本告警（日均成本环比增长 > 30%）
#
# 前提条件:
#   - Prometheus 已部署
#   - K8s metrics-server 已安装
#
# 使用方式:
#   helm install opencost opencost/opencost \
#     -f deploy/monitoring/opencost-values.yaml \
#     -n monitoring
# ============================================================
---
# OpenCost Helm Chart 配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencost-values
  namespace: monitoring
data:
  values.yaml: |
    opencost:
      exporter:
        image:
          tag: "1.111.0"
        env:
          CLUSTER_ID: "ydsz-production"
          PROMETHEUS_SERVER_ENDPOINT: "http://prometheus-server.monitoring.svc.cluster.local:9090"
          DEFAULT_CPU_PRICE: "0.024"    # 每核每小时（按阿里云 ECS 通用型定价）
          DEFAULT_RAM_PRICE: "0.003"    # 每 GB 每小时
          DEFAULT_STORAGE_PRICE: "0.0003"  # 每 GB 每小时

      # UI 配置
      ui:
        enabled: true
        ingress:
          enabled: true
          host: opencost.ydsz.cn

      # Prometheus 查询配置
      prometheus:
        existingClusterName: "prometheus"
        server:
          enabled: false  # 使用现有 Prometheus

      # 成本告警
      alerts:
        # 日均成本环比增长 > 30%
        dailyCostIncreaseThreshold: 0.3
        # 月度预算超支
        monthlyBudgetThreshold: 0.9
