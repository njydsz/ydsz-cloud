---
# Agent 模块告警规则（P1-6）
# 通过 prometheus.yml 的 rule_files: /etc/prometheus/rules/*.yml 自动加载
# severity 分级：P0=立即电话，P1=钉钉/电话，P2=钉钉，P3=邮件
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pmis-agent-alerts
  namespace: monitoring
  labels:
    app: prometheus
    role: alert-rules
spec:
  groups:
    # ====================================================================
    # LLM 可用性告警
    # ====================================================================
    - name: pmis-agent-llm
      interval: 30s
      rules:
        # P0: LLM 无可用 Provider — 所有 AI 能力瘫痪
        - alert: PmisAgentNoLlmProvider
          expr: agent_llm_calls_total{status="failure",error_type="MODEL_NOT_FOUND"} == 0 and on() time() - process_start_time_seconds{job="pmis-agent"} > 120
          for: 2m
          labels:
            severity: P0
            category: ai
            team: agent
          annotations:
            summary: "Agent 服务无 LLM 调用记录"
            description: "pmis-agent 启动超过 2 分钟仍无任何 LLM 调用，可能未配置 Provider 或健康检查未通过。"
            runbook_url: "https://wiki.example.com/runbooks/agent/no-llm-provider"

        # P1: LLM 错误率 > 10% — 影响用户体验
        - alert: PmisAgentLlmErrorRateHigh
          expr: |
            sum(rate(agent_llm_calls_total{job="pmis-agent",status="failure"}[5m]))
            /
            clamp_min(sum(rate(agent_llm_calls_total{job="pmis-agent"}[5m])), 1)
            > 0.10
          for: 5m
          labels:
            severity: P1
            category: ai
            team: agent
          annotations:
            summary: "Agent LLM 调用错误率过高 ({{ $value | humanizePercentage }})"
            description: "最近 5 分钟 LLM 调用错误率超过 10%，请检查 Provider 状态、API Key 有效性、网络连通性。"
            runbook_url: "https://wiki.example.com/runbooks/agent/llm-error-rate"

        # P1: LLM 认证失败 — API Key 可能过期或错误
        - alert: PmisAgentLlmAuthFailed
          expr: rate(agent_llm_calls_total{job="pmis-agent",error_type="AUTH_FAILED"}[5m]) > 0
          for: 2m
          labels:
            severity: P1
            category: ai
            team: agent
          annotations:
            summary: "Agent LLM 认证失败"
            description: "LLM Provider 返回 401/403，API Key 可能过期或无效，请检查 ydsz.agent.llm.api-key 配置。"
            runbook_url: "https://wiki.example.com/runbooks/agent/llm-auth-failed"

        # P2: LLM 限流频繁 — 需要调整配额或增加 Fallback
        - alert: PmisAgentLlmRateLimited
          expr: rate(agent_llm_calls_total{job="pmis-agent",error_type="RATE_LIMITED"}[5m]) > 1
          for: 5m
          labels:
            severity: P2
            category: ai
            team: agent
          annotations:
            summary: "Agent LLM 频繁被限流 ({{ $value }}/s)"
            description: "LLM Provider 返回 429 限流，建议配置 Fallback Provider 或调整请求频率。"

    # ====================================================================
    # LLM 性能告警
    # ====================================================================
    - name: pmis-agent-performance
      interval: 30s
      rules:
        # P2: LLM P99 延迟 > 10s — 用户等待过久
        - alert: PmisAgentLlmLatencyHigh
          expr: |
            histogram_quantile(0.99,
              sum(rate(agent_llm_call_duration_seconds_bucket{job="pmis-agent"}[5m])) by (le, model)
            ) > 10
          for: 5m
          labels:
            severity: P2
            category: ai
            team: agent
          annotations:
            summary: "Agent LLM 调用延迟过高 (P99={{ $value }}s)"
            description: "模型 {{ $labels.model }} 的 P99 延迟超过 10 秒，影响用户体验。"

        # P2: Token 消耗异常 — 可能存在滥用或死循环
        - alert: PmisAgentTokenUsageSpike
          expr: |
            sum(rate(agent_llm_tokens_total{job="pmis-agent"}[1h])) by (type) > 1000000
          for: 10m
          labels:
            severity: P2
            category: cost
            team: agent
          annotations:
            summary: "Agent Token 消耗异常 ({{ $value }}/s)"
            description: "最近 1 小时 Token 消耗速率超过 100 万/h，可能存在对话死循环或滥用。"

    # ====================================================================
    # 安全护栏告警
    # ====================================================================
    - name: pmis-agent-guardrail
      interval: 30s
      rules:
        # P1: 护栏拒绝次数突增 — 可能遭受 Prompt 注入攻击
        - alert: PmisAgentGuardrailRejectionSpike
          expr: |
            sum(rate(agent_guardrail_rejections_total{job="pmis-agent"}[5m])) > 0.5
          for: 5m
          labels:
            severity: P1
            category: security
            team: agent
          annotations:
            summary: "Agent 安全护栏拒绝次数突增 ({{ $value }}/s)"
            description: "最近 5 分钟护栏拒绝速率超过 0.5/s，可能遭受 Prompt 注入攻击或用户输入异常。"
            runbook_url: "https://wiki.example.com/runbooks/agent/guardrail-spike"

    # ====================================================================
    # 基础设施告警
    # ====================================================================
    - name: pmis-agent-infra
      interval: 30s
      rules:
        # P1: Agent 服务下线
        - alert: PmisAgentDown
          expr: up{job="pmis-agent"} == 0
          for: 1m
          labels:
            severity: P1
            category: availability
            team: agent
          annotations:
            summary: "Agent 服务不可用"
            description: "pmis-agent 实例 {{ $labels.instance }} 已下线超过 1 分钟。"

        # P1: Redis 记忆不可用 — 对话历史无法持久化
        - alert: PmisAgentRedisMemoryDown
          expr: |
            health_status{job="pmis-agent",name="agentHealth"} == 0
            or
            health_details{job="pmis-agent",component="memoryStatus",value="REDIS_UNREACHABLE"} == 1
          for: 1m
          labels:
            severity: P1
            category: infrastructure
            team: agent
          annotations:
            summary: "Agent Redis 记忆不可用"
            description: "Redis 连接失败，对话历史无法持久化，Agent 降级为无记忆模式。"
