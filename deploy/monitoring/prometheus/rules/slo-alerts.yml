# ============================================================
# YDSZ SLO/SLI 定义 — Prometheus 告警规则
# ------------------------------------------------------------
# 对标: Google SRE 标准 — 所有服务必须有 SLO，错误预算驱动发布节奏
#
# SLO 定义:
#   可用性: 99.9% (28天窗口，5xx 占比 < 0.1%)
#   延迟P99: < 500ms (28天窗口)
#   延迟P95: < 200ms (28天窗口)
#
# 错误预算告警策略:
#   快速燃烧: 1小时内消耗 2% 预算 → Page (电话/钉钉)
#   正常燃烧: 6小时内消耗 5% 预算 → Ticket
#   预算耗尽: 28天窗口预算用尽 → 冻结发布
#
# 使用方式:
#   kubectl apply -f deploy/monitoring/prometheus/rules/slo-alerts.yml
#   或放到 Prometheus rules 目录: /etc/prometheus/rules/slo-alerts.yml
# ============================================================
groups:
  # ============================================================
  # 组1: 可用性 SLO 告警（错误预算燃烧率）
  # ============================================================
  - name: ydsz-slo-availability
    interval: 30s
    rules:
      # 快速燃烧：1小时内错误率 > 2%（消耗 2% 预算）
      - alert: SLOBurnRateFast
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{namespace="ydsz",status=~"5.."}[1h]))
            /
            sum(rate(http_server_requests_seconds_count{namespace="ydsz"}[1h]))
          ) > 0.02
        for: 5m
        labels:
          severity: critical
          slo_type: availability
          burn_rate: fast
        annotations:
          summary: "SLO 快速燃烧 — 1小时内 5xx 错误率超过 2%"
          description: "服务 {{ $labels.pod }} 在过去 1 小时内 5xx 错误率为 {{ $value | humanizePercentage }}，超过 2% 阈值（消耗 2% 错误预算）。"
          runbook: "https://wiki.ydsz.cn/sre/slo-burn-rate-runbook"

      # 正常燃烧：6小时内错误率 > 0.5%（消耗 5% 预算）
      - alert: SLOBurnRateNormal
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{namespace="ydsz",status=~"5.."}[6h]))
            /
            sum(rate(http_server_requests_seconds_count{namespace="ydsz"}[6h]))
          ) > 0.005
        for: 15m
        labels:
          severity: warning
          slo_type: availability
          burn_rate: normal
        annotations:
          summary: "SLO 正常燃烧 — 6小时内 5xx 错误率超过 0.5%"
          description: "服务在过去 6 小时内 5xx 错误率为 {{ $value | humanizePercentage }}，超过 0.5% 阈值（消耗 5% 错误预算）。"

      # 预算耗尽：28天窗口 SLO 未达标
      - alert: SLOBudgetExhausted
        expr: |
          (
            1 - (
              sum(rate(http_server_requests_seconds_count{namespace="ydsz",status!~"5.."}[28d]))
              /
              sum(rate(http_server_requests_seconds_count{namespace="ydsz"}[28d]))
            )
          ) > 0.001
        for: 1h
        labels:
          severity: critical
          slo_type: availability
          burn_rate: exhausted
        annotations:
          summary: "SLO 预算耗尽 — 28天可用性低于 99.9%"
          description: "28天窗口内可用性 SLO 未达标，错误预算已耗尽，建议冻结非紧急发布。"

  # ============================================================
  # 组2: 延迟 SLO 告警
  # ============================================================
  - name: ydsz-slo-latency
    interval: 30s
    rules:
      # P99 延迟超过 500ms
      - alert: SLOLatencyP99Exceeded
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_server_requests_seconds_bucket{namespace="ydsz"}[5m]))
            by (le, pod)
          ) > 0.5
        for: 10m
        labels:
          severity: warning
          slo_type: latency_p99
        annotations:
          summary: "SLO 延迟超标 — P99 超过 500ms"
          description: "服务 {{ $labels.pod }} 的 P99 延迟为 {{ $value }}s，超过 500ms 阈值。"

      # P95 延迟超过 200ms
      - alert: SLOLatencyP95Exceeded
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket{namespace="ydsz"}[5m]))
            by (le, pod)
          ) > 0.2
        for: 10m
        labels:
          severity: warning
          slo_type: latency_p95
        annotations:
          summary: "SLO 延迟超标 — P95 超过 200ms"
          description: "服务 {{ $labels.pod }} 的 P95 延迟为 {{ $value }}s，超过 200ms 阈值。"

  # ============================================================
  # 组3: SLO 指标记录（用于 Grafana 仪表盘）
  # ============================================================
  - name: ydsz-slo-recording
    interval: 30s
    rules:
      # 可用性 SLO（28天窗口）
      - record: ydsz:slo:availability_ratio_28d
        expr: |
          1 - (
            sum(rate(http_server_requests_seconds_count{namespace="ydsz",status=~"5.."}[28d]))
            /
            sum(rate(http_server_requests_seconds_count{namespace="ydsz"}[28d]))
          )

      # 错误预算消耗率（28天窗口）
      - record: ydsz:slo:error_budget_burn_rate_28d
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{namespace="ydsz",status=~"5.."}[28d]))
            /
            sum(rate(http_server_requests_seconds_count{namespace="ydsz"}[28d]))
          ) / 0.001

      # P99 延迟（5分钟窗口）
      - record: ydsz:slo:latency_p99_5m
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_server_requests_seconds_bucket{namespace="ydsz"}[5m]))
            by (le)
          )

      # P95 延迟（5分钟窗口）
      - record: ydsz:slo:latency_p95_5m
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket{namespace="ydsz"}[5m]))
            by (le)
          )
