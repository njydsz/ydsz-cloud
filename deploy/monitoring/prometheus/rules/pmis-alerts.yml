# =============================================================================
# PMIS 业务与系统告警规则（PrometheusRule CRD）
# -----------------------------------------------------------------------------
# 部署方式:
#   kubectl apply -f deploy/monitoring/prometheus/rules/pmis-alerts.yml -n monitoring
#
# 配套 Alertmanager:
#   需在 Alertmanager 配置 P1→电话/钉钉、P2→钉钉、P3→邮件 的路由策略
#
# 指标来源:
#   - 业务指标: PmisBusinessMetricsJob.java 每分钟采集 3 个 Gauge
#   - 系统指标: Micrometer + Prometheus Actuator 端点暴露
#   - JVM 指标: Micrometer JVM 模块自动采集
#
# 告警分级:
#   P0 - 立即电话告警: 服务不可用、数据库连接失败、磁盘满
#   P1 - 钉钉/电话告警: 业务指标严重异常、错误率激增
#   P2 - 钉钉告警: 性能指标劣化、资源水位告警
#   P3 - 邮件告警: 业务趋势告警（如 EVM 红项目增多）
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pmis-alerts
  namespace: monitoring
  labels:
    prometheus: k8s
    app.kubernetes.io/name: pmis
spec:
  groups:
    # =========================================================================
    #  1. 业务指标告警（基于 PmisBusinessMetricsJob 采集的 3 个 Gauge）
    # =========================================================================
    - name: pmis-business
      interval: 60s
      rules:
        # EVM 红色项目数 > 3（P1，项目交付风险）
        - alert: PmisEvmRedProjectsHigh
          expr: pmis_evm_red_projects_count > 3
          for: 5m
          labels:
            severity: P1
            category: business
            team: pmis-delivery
          annotations:
            summary: "EVM 红色项目数过多 ({{ $value }})"
            description: "SPI/CPI < 0.9 的项目数 {{ $value }} 超过阈值 3，存在交付超期/超支风险，请项目经理核查。"
            runbook_url: "https://wiki.ydsz.cn/pmis/runbooks/evm-red-projects"

        # Bench 闲置成本 > 50万（P2，资源闲置浪费）
        - alert: PmisBenchCostHigh
          expr: pmis_bench_total_cost > 500000
          for: 10m
          labels:
            severity: P2
            category: business
            team: pmis-resource
          annotations:
            summary: "Bench 闲置成本过高 ({{ $value }} 元)"
            description: "当前 Bench 员工月度成本合计 {{ $value }} 元，超过 50 万阈值，建议立即安排上岗或转岗。"
            runbook_url: "https://wiki.ydsz.cn/pmis/runbooks/bench-cost"

        # 可计费利用率 < 60%（P2，资源利用不足）
        - alert: PmisBillableUtilizationLow
          expr: pmis_billable_utilization_avg < 60
          for: 10m
          labels:
            severity: P2
            category: business
            team: pmis-resource
          annotations:
            summary: "可计费利用率过低 ({{ $value }}%)"
            description: "近 30 天可计费利用率均值 {{ $value }}% 低于 60% 阈值，资源利用不足，建议核查项目排期。"
            runbook_url: "https://wiki.ydsz.cn/pmis/runbooks/utilization-low"

        # 业务指标采集失败（P1，监控盲区）
        - alert: PmisBusinessMetricsStale
          expr: time() - pmis_evm_red_projects_count{job=~".*project.*"} > 300
          for: 5m
          labels:
            severity: P1
            category: monitoring
            team: pmis-sre
          annotations:
            summary: "业务指标采集停滞超过 5 分钟"
            description: "PmisBusinessMetricsJob 已超过 5 分钟未更新指标，可能因数据库异常或定时任务挂起，请检查 pmis-project 服务日志。"

        # 回款率过低（P2，现金流风险）
        - alert: PmisCollectionRateLow
          expr: pmis_collection_rate < 50
          for: 10m
          labels:
            severity: P2
            category: business
            team: pmis-finance
          annotations:
            summary: "整体回款率过低 ({{ $value }}%)"
            description: "当前回款率 {{ $value }}% 低于 50% 阈值，存在现金流风险，建议催收团队介入。"

        # 待审批积压（P2，审批效率）
        - alert: PmisPendingApprovalHigh
          expr: pmis_pending_approval_count > 100
          for: 10m
          labels:
            severity: P2
            category: business
            team: pmis-workflow
          annotations:
            summary: "待审批工单积压 ({{ $value }})"
            description: "当前待审批工单数 {{ $value }} 超过 100 阈值，审批流转可能阻塞，建议检查审批人在线状态。"

    # =========================================================================
    #  2. 服务可用性告警
    # =========================================================================
    - name: pmis-availability
      interval: 30s
      rules:
        # 服务下线（P0）
        - alert: PmisServiceDown
          expr: |
            up{job=~"pmis-.*",namespace="pmis-production"} == 0
          for: 1m
          labels:
            severity: P0
            category: availability
          annotations:
            summary: "服务 {{ $labels.job }} 实例下线"
            description: "{{ $labels.instance }} 已离线超过 1 分钟，可能影响业务，请立即排查。"

        # 5xx 错误率激增（P1，> 1% 持续 2 分钟）
        - alert: PmisHighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{job=~"pmis-.*",status=~"5.."}[2m])) by (job)
            /
            sum(rate(http_server_requests_seconds_count{job=~"pmis-.*"}[2m])) by (job)
            > 0.01
          for: 2m
          labels:
            severity: P1
            category: availability
          annotations:
            summary: "{{ $labels.job }} 5xx 错误率 > 1%"
            description: "服务 {{ $labels.job }} 5xx 错误率 {{ $value | humanizePercentage }}，超过 1% 阈值持续 2 分钟，请检查日志与依赖。"

        # 接口 P99 延迟过高（P2，> 2s 持续 5 分钟）
        - alert: PmisHighLatency
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_server_requests_seconds_bucket{job=~"pmis-.*"}[5m])) by (le, job)
            ) > 2
          for: 5m
          labels:
            severity: P2
            category: performance
          annotations:
            summary: "{{ $labels.job }} P99 延迟 > 2s"
            description: "服务 {{ $labels.job }} P99 延迟 {{ $value }}s，超过 2s 阈值持续 5 分钟，请检查慢 SQL / GC / 资源水位。"

        # 接口 QPS 突降（P2，可能流量异常）
        - alert: PmisTrafficDrop
          expr: |
            sum(rate(http_server_requests_seconds_count{job=~"pmis-.*"}[5m])) by (job)
            <
            sum(rate(http_server_requests_seconds_count{job=~"pmis-.*"}[5m] offset 1h)) by (job) * 0.3
          for: 10m
          labels:
            severity: P2
            category: availability
          annotations:
            summary: "{{ $labels.job }} 流量突降 > 70%"
            description: "当前 QPS 不足 1 小时前的 30%，可能上游故障或网关异常。"

    # =========================================================================
    #  3. JVM 与资源水位告警
    # =========================================================================
    - name: pmis-jvm
      interval: 30s
      rules:
        # JVM 内存使用率 > 90%（P1，OOM 风险）
        - alert: PmisJvmMemoryHigh
          expr: |
            (jvm_memory_used_bytes{job=~"pmis-.*",area="heap"} /
             jvm_memory_max_bytes{job=~"pmis-.*",area="heap"}) > 0.9
          for: 5m
          labels:
            severity: P1
            category: resource
          annotations:
            summary: "{{ $labels.job }} 堆内存使用率 > 90%"
            description: "实例 {{ $labels.instance }} 堆内存 {{ $value | humanizePercentage }}，存在 OOM 风险，请检查内存泄漏或扩容。"

        # JVM 线程数过多（P2，可能线程泄漏）
        - alert: PmisJvmThreadsHigh
          expr: jvm_threads_states_threads{job=~"pmis-.*"} > 500
          for: 5m
          labels:
            severity: P2
            category: resource
          annotations:
            summary: "{{ $labels.job }} 线程数 > 500"
            description: "实例 {{ $labels.instance }} JVM 线程数 {{ $value }}，可能存在线程泄漏。"

        # Full GC 频繁（P1，影响稳定性）
        - alert: PmisJvmFullGcFrequent
          expr: |
            increase(jvm_gc_pause_seconds_count{job=~"pmis-.*",action="end of major GC"}[5m]) > 3
          for: 5m
          labels:
            severity: P1
            category: resource
          annotations:
            summary: "{{ $labels.job }} 5 分钟内 Full GC > 3 次"
            description: "Full GC 频繁，影响响应延迟，请检查老年代占用与内存配置。"

    # =========================================================================
    #  4. 数据库与中间件告警
    # =========================================================================
    - name: pmis-dependencies
      interval: 30s
      rules:
        # 数据库连接池耗尽（P0，服务即将不可用）
        - alert: PmisDbPoolExhausted
          expr: |
            (hikaricp_connections_active{job=~"pmis-.*"} /
             hikaricp_connections_max{job=~"pmis-.*"}) > 0.9
          for: 1m
          labels:
            severity: P0
            category: database
          annotations:
            summary: "{{ $labels.job }} 数据库连接池使用率 > 90%"
            description: "活跃连接 {{ $value | humanizePercentage }} 即将耗尽，请立即排查慢 SQL 或扩容连接池。"

        # 数据库连接失败（P0）
        - alert: PmisDbConnectionFailed
          expr: |
            increase(hikaricp_connections_acquire_seconds_count{job=~"pmis-.*"}[1m]) > 0
            and on(job)
            hikaricp_connections_pending{job=~"pmis-.*"} > 0
          for: 1m
          labels:
            severity: P0
            category: database
          annotations:
            summary: "{{ $labels.job }} 数据库连接获取失败"
            description: "存在连接获取失败与 pending 连接，数据库可能不可达或连接池配置过小。"

        # Redis 连接失败（P1）
        - alert: PmisRedisConnectionFailed
          expr: |
            increase(lettuce_command_completion_seconds_count{job=~"pmis-.*",status="error"}[1m]) > 5
          for: 1m
          labels:
            severity: P1
            category: cache
          annotations:
            summary: "{{ $labels.job }} Redis 命令失败 > 5 次/分钟"
            description: "Redis 异常，缓存/分布式锁/限流均受影响，请检查 Redis 实例状态。"

        # RocketMQ 消息堆积（P2）
        - alert: PmisRocketMqLagHigh
          expr: |
            rocketmq_consumer_lag{job=~"pmis-.*"} > 10000
          for: 5m
          labels:
            severity: P2
            category: mq
          annotations:
            summary: "RocketMQ 消费堆积 > 10000"
            description: "Topic {{ $labels.topic }} 消费堆积 {{ $value }} 条，消费者可能宕机或处理过慢。"
