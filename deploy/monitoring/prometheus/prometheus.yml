# ====================================================================
#  PMIS Prometheus 主配置
#  ---------------------------------------------------------------------
#  使用 DNS 服务发现自动发现微服务实例，替代静态目标配置。
#  Nacos DNS 解析格式：{serviceName}.{namespace}.svc.cluster.local
#  在非 K8s 环境下使用 Docker DNS 或 Nacos DNS 集成。
# ====================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: pmis-prod
    environment: production

rule_files:
  - "rules/*.yml"

# Alertmanager 告警路由
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: prometheus

  # 主机层指标
  - job_name: 'node-exporter'
    dns_sd_configs:
      - names:
          - 'pmis-node-exporter'
        type: 'A'
        port: 9100
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'node-exporter'

  # ==================== 微服务（DNS 服务发现） ====================
  # 所有 PMIS 微服务统一通过 DNS 服务发现，扩缩容后自动纳入抓取
  - job_name: 'pmis-microservices'
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names:
          - 'pmis-gateway'
          - 'pmis-auth'
          - 'pmis-user'
          - 'pmis-notification'
          - 'pmis-workflow'
          - 'pmis-project'
          - 'pmis-execution'
          - 'pmis-agent'
          - 'pmis-config'
          - 'pmis-file'
          - 'pmis-audit'
          - 'pmis-message'
          - 'pmis-cronjob'
        type: 'A'
        port: 9000  # 基准端口，实际端口通过 relabel 映射
    relabel_configs:
      # 根据 DNS 名称设置 service 标签
      - source_labels: [__meta_dns_name]
        target_label: service
      # 根据服务名映射实际端口
      - source_labels: [__meta_dns_name]
        target_label: __address__
        regex: 'pmis-gateway'
        replacement: '${1}:9000'
      - source_labels: [__meta_dns_name]
        target_label: __address__
        regex: 'pmis-auth'
        replacement: '${1}:9001'
      - source_labels: [__meta_dns_name]
        target_label: __address__
        regex: 'pmis-user'
        replacement: '${1}:9002'
      - source_labels: [__meta_dns_name]
        target_label: __address__
        regex: 'pmis-notification'
        replacement: '${1}:9003'
      - source_labels: [__meta_dns_name]
        target_label: __address__
        regex: 'pmis-workflow'
        replacement: '${1}:9004'
      - source_labels: [__meta_dns_name]
        target_label: __address__
        regex: 'pmis-project'
        replacement: '${1}:9005'
      - source_labels: [__meta_dns_name]
        target_label: __address__
        regex: 'pmis-execution'
        replacement: '${1}:9006'
      - source_labels: [__meta_dns_name]
        target_label: __address__
        regex: 'pmis-agent'
        replacement: '${1}:9007'
      - source_labels: [__meta_dns_name]
        target_label: __address__
        regex: 'pmis-config'
        replacement: '${1}:9008'
      - source_labels: [__meta_dns_name]
        target_label: __address__
        regex: 'pmis-file'
        replacement: '${1}:9009'
      - source_labels: [__meta_dns_name]
        target_label: __address__
        regex: 'pmis-audit'
        replacement: '${1}:9010'
      - source_labels: [__meta_dns_name]
        target_label: __address__
        regex: 'pmis-message'
        replacement: '${1}:9011'
      - source_labels: [__meta_dns_name]
        target_label: __address__
        regex: 'ydsz-pmis-cronjob'
        replacement: '${1}:9012'
      # 设置 tier 标签
      - source_labels: [service]
        target_label: tier
        regex: 'pmis-gateway'
        replacement: 'gateway'
      - source_labels: [service]
        target_label: tier
        regex: 'pmis-.*'
        replacement: 'business'

  # PostgreSQL Exporter
  - job_name: 'postgres'
    dns_sd_configs:
      - names:
          - 'pmis-postgres-exporter'
        type: 'A'
        port: 9187
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'postgres'

  # Redis Exporter
  - job_name: 'redis'
    dns_sd_configs:
      - names:
          - 'pmis-redis-exporter'
        type: 'A'
        port: 9121
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'redis'
