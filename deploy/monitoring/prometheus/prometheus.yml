# =============================================================================
# Prometheus 抓取配置 - PMIS 监控
# -----------------------------------------------------------------------------
# 部署:
#   挂载至容器 /etc/prometheus/prometheus.yml
#   docker-compose 中通过 volumes 挂载
#
# 抓取目标:
#   - PMIS 微服务(通过 host.docker.internal 访问宿主机上的应用)
#   - Prometheus 自身
#   - Alertmanager / Loki(可选)
#
# 告警规则:
#   - rules/pmis-alerts.yml(业务 + 系统 + JVM + 依赖告警)
# =============================================================================
global:
  scrape_interval: 15s          # 默认抓取间隔
  evaluation_interval: 15s      # 规则评估间隔
  scrape_timeout: 10s           # 单次抓取超时
  external_labels:
    cluster: pmis-dev
    environment: dev

# =============================================================================
# 告警规则文件
# 加载 rules/ 目录下所有 .yml 规则文件，新增规则文件无需修改此配置
# =============================================================================
rule_files:
  - /etc/prometheus/rules/*.yml

# =============================================================================
# Alertmanager 告警下发目标
# =============================================================================
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# =============================================================================
# 抓取配置
# =============================================================================
scrape_configs:
  # ----------------------------------------------------------------------
  # 1. Prometheus 自监控
  # ----------------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: prometheus

  # ----------------------------------------------------------------------
  # 2. PMIS 微服务(通过 host.docker.internal 访问宿主机应用)
  #    Linux 部署需在 docker-compose 中配置 extra_hosts: host-gateway
  #    端口分配: 9000 gateway / 9001 userinfo / 9002 system / 9003 project
  #             9004 message / 9005 cronjob / 9006 workflow / 9007 agent
  # ----------------------------------------------------------------------
  - job_name: pmis-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:9000']
        labels:
          service: pmis-gateway

  - job_name: pmis-userinfo
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:9001']
        labels:
          service: pmis-userinfo

  - job_name: pmis-system
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:9002']
        labels:
          service: pmis-system

  - job_name: pmis-project
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:9003']
        labels:
          service: pmis-project

  - job_name: pmis-message
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:9004']
        labels:
          service: pmis-message

  - job_name: pmis-cronjob
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:9005']
        labels:
          service: pmis-cronjob

  - job_name: pmis-workflow
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:9006']
        labels:
          service: pmis-workflow

  # ----------------------------------------------------------------------
  # 3. 基础设施组件(可选,需组件自身开启 metrics 端点)
  # ----------------------------------------------------------------------
  - job_name: node-exporter
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          service: node-exporter

  # ----------------------------------------------------------------------
  # 4. Alertmanager 自监控
  # ----------------------------------------------------------------------
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          service: alertmanager

  # ----------------------------------------------------------------------
  # 5. Loki 自监控
  # ----------------------------------------------------------------------
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
        labels:
          service: loki
