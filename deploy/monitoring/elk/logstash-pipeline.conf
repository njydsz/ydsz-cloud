# =============================================================================
# Logstash Pipeline 配置 - YDSZ 结构化日志处理
# -----------------------------------------------------------------------------
# 部署:
#   挂载至容器 /usr/share/logstash/pipeline/ydsz.conf
#   或通过 logstash.yml 配置 pipeline.path
#
# 输入:
#   TCP 5044 - 接收 SentryLogbackLayout / ElkLogPublisher 推送的 JSON 日志
#
# 处理:
#   1. 解析 JSON
#   2. 提取时间戳、级别、traceId 等字段
#   3. 添加索引名（按日期分索引）
#
# 输出:
#   Elasticsearch - 写入 ydsz-logs-YYYY.MM.dd 索引
# =============================================================================
input {
  tcp {
    port => 5044
    codec => json_lines
    # 连接超时
    tcp_keep_alive => true
    # 最大连接数
    tcp_connection_queue_size => 256
  }
}

filter {
  # 确保 timestamp 字段存在
  if ![@timestamp] {
    date {
      match => ["timestamp", "ISO8601", "@timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # 提取级别（统一为大写）
  mutate {
    uppercase => ["level"]
  }

  # 添加索引日期
  ruby {
    code => 'event.set("index_date", event.get("@timestamp").time.strftime("%Y.%m.%d"))'
  }

  # 标记来源
  mutate {
    add_field => {
      "source" => "sentry-logback"
      "pipeline" => "ydsz-logs"
    }
  }

  # 如果有 traceId，添加追踪标记
  if [traceId] {
    mutate {
      add_field => {
        "has_trace" => "true"
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ydsz-logs-%{index_date}"
    # 模板管理
    manage_template => true
    template_name => "ydsz-logs"
    template_overwrite => true
    # 滚动索引 ILM
    ilm_enabled => true
    ilm_rollover_alias => "ydsz-logs"
    ilm_pattern => "{now/d}-000001"
    ilm_policy => "ydsz-logs-policy"
  }

  # 调试输出（生产环境可移除）
  # stdout { codec => rubydebug }
}
