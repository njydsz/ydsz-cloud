# =============================================================================
# ELK Stack docker-compose 配置 - YDSZ 日志方案一
# -----------------------------------------------------------------------------
# 启动:
#   docker-compose -f deploy/monitoring/elk/docker-compose-elk.yml up -d
#
# 组件:
#   - Elasticsearch 8.x (单节点, 开发环境)
#   - Logstash 8.x (TCP 5044 输入)
#   - Kibana 8.x (5601 端口)
#
# 注意:
#   - 生产环境请修改为集群模式
#   - Elasticsearch 需要调整 vm.max_map_count=262144
# =============================================================================
version: "3.8"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: ydsz-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=ydsz-elk
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - ydsz-monitoring
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.0
    container_name: ydsz-logstash
    volumes:
      - ./logstash-pipeline.conf:/usr/share/logstash/pipeline/ydsz.conf:ro
      - ./ydsz-index-template.json:/usr/share/logstash/config/ydsz-index-template.json:ro
    ports:
      - "5044:5044"
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - ydsz-monitoring

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: ydsz-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - KIBANA_SYSTEM_PASSWORD=changeme
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - ydsz-monitoring

volumes:
  es-data:

networks:
  ydsz-monitoring:
    external: true
    name: ydsz-monitoring
