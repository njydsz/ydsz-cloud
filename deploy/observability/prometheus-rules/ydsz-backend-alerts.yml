# =====================================================================
#  YDSZ Backend Prometheus Alert Rules
#  --------------------------------------------------------------------
#  告警规则配置 - 适用于 Kubernetes 部署环境的 PrometheusRule CRD
#  以及通过 file_sd 加载的 Prometheus 实例
#
#  告警级别:
#    - CRITICAL: 立即处理，30 分钟内未恢复则电话告警
#    - WARNING:  15 分钟内响应，工作时间处理
#    - INFO:     日常关注，汇总到日报
# =====================================================================

groups:
  # =====================================================================
  #  服务健康告警
  # =====================================================================
  - name: service-health
    rules:
      - alert: ServiceDown
        expr: up{job=~"ydsz-.*"} == 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "服务 {{ $labels.job }} 实例 {{ $labels.instance }} 宕机"
          description: >
            微服务实例 {{ $labels.job }} ({{ $labels.instance }}) 已超过 1 分钟未上报心跳。
            请立即检查 Pod 状态及日志。
          runbook_url: "https://github.com/njydsz/ydsz-pmis/blob/main/docs/runbooks/failure-handling.md"

      - alert: ServiceHighErrorRate
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{job=~"ydsz-.*", status=~"5.."}[5m])) by (job)
            /
            sum(rate(http_server_requests_seconds_count{job=~"ydsz-.*"}[5m])) by (job)
          ) > 0.01
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "服务 {{ $labels.job }} 5xx 错误率超过 1%"
          description: >
            服务 {{ $labels.job }} 在过去 5 分钟内 5xx 错误率超过 1%（当前值: {{ $value | humanizePercentage }}）。
            可能原因：下游依赖故障、数据库连接异常、OOM 等。

      - alert: ServiceHighLatency
        expr: |
          histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{job=~"ydsz-.*"}[5m])) by (job, le)) > 3
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "服务 {{ $labels.job }} P99 延迟超过 3 秒"
          description: >
            服务 {{ $labels.job }} P99 响应时间超过 3 秒（当前值: {{ $value }}s）。
            可能原因：慢 SQL、外部 API 调用超时、GC 停顿。

      - alert: ServiceHighCpuUsage
        expr: |
          100 - (avg by (instance, job) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "服务 {{ $labels.job }} CPU 使用率超过 80%"
          description: >
            实例 {{ $labels.instance }} ({{ $labels.job }}) CPU 使用率持续超过 80% 超过 10 分钟。

  # =====================================================================
  #  JVM 告警
  # =====================================================================
  - name: jvm-health
    rules:
      - alert: JvmHeapHigh
        expr: |
          (jvm_memory_used_bytes{area="heap", job=~"ydsz-.*"} 
          / jvm_memory_max_bytes{area="heap", job=~"ydsz-.*"}) > 0.85
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "JVM {{ $labels.job }} 堆内存使用率超过 85%"
          description: >
            JVM 堆内存使用率超过 85%（当前值: {{ $value | humanizePercentage }}）。
            可能原因：内存泄漏、大对象未释放、堆配置过小。

      - alert: JvmGcPauseLong
        expr: |
          rate(jvm_gc_pause_seconds_sum{job=~"ydsz-.*"}[5m]) > 0.5
        for: 3m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "JVM {{ $labels.job }} GC 停顿时间过长"
          description: >
            过去 5 分钟内 GC 停顿时间占比超过 50%，应用响应可能受影响。

  # =====================================================================
  #  数据库连接池告警
  # =====================================================================
  - name: datasource-health
    rules:
      - alert: DataSourcePoolExhausted
        expr: |
          druid_active_connections{job=~"ydsz-.*"} 
          / druid_max_active_connections{job=~"ydsz-.*"} > 0.9
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "数据库连接池接近耗尽 ({{ $labels.job }})"
          description: >
            数据库连接池使用率超过 90%（当前活跃连接: {{ $value }}）。
            可能原因：连接泄漏、慢 SQL 堆积、并发请求突增。

      - alert: DataSourceWaitHigh
        expr: |
          rate(druid_wait_millis_total{job=~"ydsz-.*"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "数据库连接获取出现等待 ({{ $labels.job }})"
          description: >
            存在获取数据库连接的等待情况，应用响应可能会受影响。

  # =====================================================================
  #  缓存告警
  # =====================================================================
  - name: cache-health
    rules:
      - alert: RedisDown
        expr: redis_up{job=~"ydsz-.*"} == 0
        for: 30s
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Redis 实例不可用"
          description: >
            Redis 实例 {{ $labels.instance }} 已宕机。网关限流、JWT 校验等依赖 Redis 的功能将降级。

      - alert: CacheHitRateLow
        expr: |
          (
            rate(cache_gets_total{result="hit", job=~"ydsz-.*"}[5m])
            /
            rate(cache_gets_total{job=~"ydsz-.*"}[5m])
          ) < 0.5
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "缓存命中率低于 50% ({{ $labels.job }})"
          description: >
            缓存命中率持续偏低，大量请求穿透到数据库。可能原因：缓存配置不当、热点 Key 缺失。

  # =====================================================================
  #  限流告警
  # =====================================================================
  - name: rate-limit
    rules:
      - alert: RateLimitTriggered
        expr: |
          sum(rate(gateway_ratelimit_triggered_total{job="ydsz-gateway"}[5m])) > 0
        for: 1m
        labels:
          severity: info
          team: backend
        annotations:
          summary: "网关限流已触发"
          description: >
            网关在过去 1 分钟内有请求被限流。维度: {{ $labels.dimension }}，路径: {{ $labels.path }}。

      - alert: RateLimitFallbackActive
        expr: gateway_ratelimit_fallback_active{job="ydsz-gateway"} == 1
        for: 30s
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "限流降级到本地兜底模式（Redis 可能宕机）"
          description: >
            Redis 不可用，限流已降级到本地兜底模式。此时多实例部署的限流精度会下降。

  # =====================================================================
  #  消息队列告警
  # =====================================================================
  - name: mq-health
    rules:
      - alert: RocketMQBacklog
        expr: |
          rocketmq_consumer_lag{job=~"ydsz-.*"} > 1000
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "RocketMQ 消息积压 ({{ $labels.consumer_group }})"
          description: >
            消费者组 {{ $labels.consumer_group }} 消息积压超过 1000 条（当前: {{ $value }}）。
            可能原因：消费者处理慢、消费者宕机、流量突增。

  # =====================================================================
  #  业务指标告警
  # =====================================================================
  - name: business-metrics
    rules:
      - alert: WorkflowInstanceStuck
        expr: |
          ydsz_workflow_instance_stuck_total{job="ydsz-workflow"} > 10
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "工作流实例卡住 ({{ $value }} 个实例)"
          description: >
            超过 10 个工作流实例处于卡住状态。可能原因：节点审批人缺失、规则执行失败。

      - alert: CronJobFailRateHigh
        expr: |
          (
            rate(ydsz_cronjob_execution_total{status="FAIL"}[30m])
            /
            rate(ydsz_cronjob_execution_total[30m])
          ) > 0.1
        for: 30m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "定时任务失败率超过 10%"
          description: >
            过去 30 分钟内定时任务失败率超过 10%，请检查任务执行日志。
