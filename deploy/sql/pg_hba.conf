# =====================================================================
#  PMIS PostgreSQL 16 客户端认证配置（批次 19）
# ---------------------------------------------------------------------
#  顺序：自上而下匹配，先匹配先生效
#  安全策略：
#  - 应用服务使用 scram-sha-256 强密码
#  - 主从复制使用 trust（内网）
#  - 本地维护使用 peer
#  - 拒绝 0.0.0.0/0 远程连接
# =====================================================================

# ---------------- 本地维护 ----------------
# postgres 用户本地登录（操作系统级认证）
local   all             postgres                                peer
local   all             pmis_app                                peer

# ---------------- 应用服务连接（10.0.1.0/24 应用网段）----------------
# 微服务连接池（HikariCP max-pool=20/服务 x 14 服务 = 280 并发）
# scram-sha-256 强密码（密码存储 pg_authid.rolpassword 加密）
host    all             pmis_app        10.0.1.0/24            scram-sha-256
host    all             pmis_app        10.0.1.0/24            scram-sha-256

# ---------------- 主从物理复制（10.0.2.0/24 数据库网段）----------------
# pg_basebackup / 流复制专用账号 pmis_repl
# 内网信任避免复制延迟
host    replication     pmis_repl       10.0.2.11/32           scram-sha-256
host    replication     pmis_repl       10.0.2.12/32           scram-sha-256

# 备库作为 primary 时允许 cascade
host    replication     pmis_repl       10.0.2.0/24            scram-sha-256

# ---------------- 监控 / 备份（10.0.4.0/24 运维网段）----------------
# pgwatch2 / prometheus / pgbackrest
host    all             pmis_monitor    10.0.4.0/24            scram-sha-256

# ---------------- 拒绝其他来源 ----------------
# 0.0.0.0/0 拒绝（默认行为）
host    all             all             0.0.0.0/0               reject

# ---------------- IPv6 默认拒绝 ----------------
host    all             all             ::0/0                   reject
