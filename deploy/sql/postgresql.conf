# =====================================================================
#  PMIS PostgreSQL 16 生产配置（批次 19 调优）
# ---------------------------------------------------------------------
#  服务器：2 x 16C64G 物理机（pg-primary + pg-replica）
#  数据量：预估 200GB，QPS 8000 读 / 2000 写
#  调优目标：P99 查询 < 200ms，写入 < 50ms
# =====================================================================

# ---------------- 连接配置 ----------------
listen_addresses = '0.0.0.0'                # 监听所有网卡
port = 5432
max_connections = 500                       # 微服务连接池 + 监控 + 备份
superuser_reserved_connections = 10         # 预留 10 个给运维
unix_socket_directories = '/var/run/postgresql'

# ---------------- 内存（64G 物理机）----------------
shared_buffers = 16GB                       # 物理内存 25%
huge_pages = try                            # 启用大页
temp_buffers = 32MB
max_prepared_transactions = 100             # 配合 Seata AT 模式
work_mem = 32MB                             # 单次排序/哈希操作
maintenance_work_mem = 2GB                  # VACUUM/INDEX
effective_cache_size = 48GB                 # OS 缓存估算
effective_io_concurrency = 200              # SSD 场景

# ---------------- 异步 / 并行 ----------------
max_worker_processes = 16                   # CPU 核数
max_parallel_workers = 16
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4
parallel_tuple_cost = 0.01
parallel_setup_cost = 100
min_parallel_table_scan_size = 8MB
min_parallel_index_scan_size = 512kB

# ---------------- 预写日志（WAL）----------------
wal_level = replica                         # 主从复制
wal_buffers = 64MB
wal_writer_delay = 200ms
wal_compression = on
wal_log_hints = on
wal_keep_size = 2GB                         # 替代 wal_keep_segments
max_wal_size = 16GB
min_wal_size = 2GB
max_wal_senders = 10                        # 物理复制槽
max_replication_slots = 10

# ---------------- 查询规划器 ----------------
random_page_cost = 1.1                      # SSD 场景
seq_page_cost = 1.0
default_statistics_target = 500             # 默认 100 → 500（更精确统计）
jit = on
jit_above_cost = 100000
jit_inline_above_cost = 500000
jit_optimize_above_cost = 500000

# ---------------- 复制（主从）----------------
hot_standby = on
hot_standby_feedback = on
wal_receiver_timeout = 60s
wal_retrieve_retry_interval = 5s
max_standby_streaming_delay = 30s
max_standby_archive_delay = 60s

# ---------------- 日志 ----------------
logging_collector = on
log_destination = 'stderr,csvlog'
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0640
log_rotation_age = 1d                       # 每天轮转
log_rotation_size = 100MB
log_min_duration_statement = 500            # 记录 > 500ms 慢 SQL
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on                         # 锁等待 > 1s 记录
log_temp_files = 0                          # 临时文件记录
log_autovacuum_min_duration = 0
log_error_verbosity = default
log_line_prefix = '%m [%p] %q%u@%d from %h '

# ---------------- 慢 SQL 输出到独立文件 ----------------
# 需配合 log_destination = csvlog + 日志收集器
# 推荐：pgBadger 每日分析

# ---------------- 自动 VACUUM ----------------
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.05       # 默认 0.2 → 0.05（更激进）
autovacuum_analyze_scale_factor = 0.025
autovacuum_vacuum_cost_delay = 10ms
autovacuum_vacuum_cost_limit = 1000

# ---------------- 客户端连接超时 ----------------
authentication_timeout = 60s
idle_in_transaction_session_timeout = 30min
statement_timeout = 60s                     # 防慢查询拖垮 DB
idle_session_timeout = 30min
tcp_keepalives_idle = 600
tcp_keepalives_interval = 30
tcp_keepalives_count = 3
lock_timeout = 30s

# ---------------- 复制槽监控（防止 WAL 堆积）----------------
# 物理复制槽 pg_basebackup/physical 备库使用
# 建议：监控 pg_replication_slot 视图
#       若 active = false 且 restart_lsn 落后过大需告警

# ---------------- 时区与 locale ----------------
timezone = 'Asia/Shanghai'
lc_messages = 'zh_CN.UTF-8'
lc_monetary = 'zh_CN.UTF-8'
lc_numeric = 'zh_CN.UTF-8'
lc_time = 'zh_CN.UTF-8'
default_text_search_config = 'pg_catalog.simple'

# ---------------- 开发者友好 ----------------
track_io_timing = on
track_activities = on
track_counts = on
track_functions = pl
update_process_title = on
shared_preload_libraries = 'pg_stat_statements,pg_hint_plan'  # SQL 审计 + 计划 hint
compute_query_id = on

# pg_stat_statements 配置（pg_stat_statements 库内）
# 需在 postgresql.conf 中设置：pg_stat_statements.max = 10000
#                              pg_stat_statements.track = top
#                              pg_stat_statements.track_utility = off
