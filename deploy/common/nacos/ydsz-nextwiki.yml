# =====================================================================
#  YDSZ · NextWiki 网盘知识库服务专属配置 (ydsz-nextwiki.yml)
#  --------------------------------------------------------------------
#  作用:   NextWiki 服务通过 spring.cloud.nacos.config.shared-configs
#          引用此 dataId,实现配置外部化与动态刷新
#  部署:   Nacos 控制台 → 配置管理 → 新建配置
#          DataId:    ydsz-nextwiki.yml
#          Group:      dev
#          配置格式:   YAML
#          导入脚本:   deploy/ubuntu/scripts/import-nacos-config.sh
# =====================================================================

server:
  port: 8800

spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  # 异步线程池配置（@Async / 预览生成 / 缩略图 / 文件事件监听）
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 100
        keep-alive: 60s
      thread-name-prefix: nextwiki-async-
    scheduling:
      pool:
        size: 2
      thread-name-prefix: nextwiki-sched-

# MyBatis-Plus（覆盖共享配置，nextwiki 使用 stdout 日志便于调试）
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# NextWiki 业务配置
nextwiki:
  # ---------- 文件上传安全 ----------
  upload:
    # 最大文件大小（字节），默认 500MB，与 spring.servlet.multipart.max-file-size 对齐
    max-file-size: 524288000
    # 允许上传的文件类型白名单（逗号分隔，为空表示不限制白名单，仅走黑名单）
    # 白名单优先于黑名单：若配置了白名单，仅白名单内文件可上传
    allowed-types: ""
    # 文件扩展名黑名单（危险文件类型，始终禁止上传）
    blocked-extensions: exe,bat,cmd,sh,com,scr,vbs,js,jar,war,class,msi
  # ---------- 文档预览 ----------
  preview:
    libreoffice-path: ${LIBREOFFICE_PATH:soffice}
    temp-dir: ${java.io.tmpdir}/nextwiki-preview
    # LibreOffice 转换超时（秒）
    convert-timeout: 120
  # ---------- 缩略图 ----------
  thumbnail:
    temp-dir: ${java.io.tmpdir}/nextwiki-thumbnail
    # 缩略图尺寸（宽x高，像素）
    width: 200
    height: 200
  # ---------- AI 摘要 ----------
  ai:
    llm-enabled: false
    llm-api-url: ${LLM_API_URL:}
    # ⚠️ 生产环境必须使用 Jasypt 加密：llm-api-key: ENC(加密后的密钥串)
    llm-api-key: ${LLM_API_KEY:}
    # TextRank 摘要最大处理字符数（超出截断，防 OOM）
    textrank-max-chars: 50000
    # 摘要句子数
    summary-sentences: 5
  # ---------- CDN ----------
  cdn:
    enabled: false
    provider: aliyun
    domain: ${CDN_DOMAIN:}
    # ⚠️ 生产环境必须使用 Jasypt 加密
    access-key: ${CDN_ACCESS_KEY:}
    secret-key: ${CDN_SECRET_KEY:}
  # ---------- 病毒扫描 ----------
  virus-scan:
    enabled: false
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    # 扫描超时（秒）
    timeout: 60
  # ---------- OCR ----------
  ocr:
    enabled: false
    provider: tesseract
    tesseract-path: ${TESSERACT_PATH:tesseract}
    language: chi_sim+eng
    # OCR 最大处理文件大小（字节），默认 10MB
    max-file-size: 10485760
  # ---------- 下载限流 ----------
  download:
    # 单用户每分钟下载次数限制
    rate-limit-per-minute: 30
    # 单 IP 每分钟下载次数限制
    ip-rate-limit-per-minute: 100
    # 签名 URL 过期时间（秒）
    signed-url-expire-seconds: 3600
  # ---------- 版本控制 ----------
  version:
    # 单文件最大保留版本数（超出自动清理旧版本）
    max-versions: 10
  # ---------- 回收站 ----------
  trash:
    # 回收站自动清理天数（天）
    retention-days: 30
    # 定时清理任务 cron 表达式（每天凌晨 2 点）
    cleanup-cron: "0 0 2 * * ?"
  # ---------- 搜索索引 ----------
  search:
    # 索引重建定时任务 cron 表达式（每周日凌晨 3 点）
    rebuild-cron: "0 0 3 ? * SUN"
    # 数据库全文搜索模式：auto（ES 不可用时降级到 PG tsvector）
    provider: auto

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
