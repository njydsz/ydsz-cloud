# =====================================================================
#  YDSZ PMIS · Nacos 共享配置 (ydsz-pmis-common.yaml)
#  --------------------------------------------------------------------
#  作用:   所有 7 个微服务都通过 spring.cloud.nacos.config.shared-configs
#          引用此 dataId,实现"一处修改全集群生效"
#  部署:   Nacos 控制台 → 配置管理 → 新建配置
#          DataId:    ydsz-pmis-common.yaml
#          Group:      dev
#          配置格式:   YAML
#          导入脚本:   deploy/ubuntu/scripts/import-nacos-config.sh
# =====================================================================

# ---------- 数据源（所有服务共用） ----------
# 安全说明: DB_PASSWORD 无默认值，必须通过环境变量/Nacos 配置注入
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?currentSchema=public&useUnicode=true&characterEncoding=utf8
    username: ${DB_USER:pmis}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j
      web-stat-filter:
        enabled: true
      # Druid 监控台：生产环境(profile=prod)必须关闭，dev 环境可开启但口令必须从环境变量注入
      stat-view-servlet:
        enabled: ${DRUID_STAT_ENABLED:false}
        url-pattern: /druid/*
        login-username: ${DRUID_STAT_USERNAME:}
        login-password: ${DRUID_STAT_PASSWORD:}
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 2000

  # ---------- Redis（所有服务共用） ----------
  # 安全说明: REDIS_PASSWORD 无默认值，必须通过环境变量注入
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DB:0}
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
          max-wait: 5s

  # ---------- Spring Cache（统一使用 Redis） ----------
  # P1-10: TTL/序列化/前缀由 PmisCacheConfig 统一接管，按 cacheName 差异化配置（防雪崩）
  # 此处仅保留 type=redis 触发 Spring Boot 自动装配 RedisConnectionFactory
  cache:
    type: redis

# ---------- MyBatis-Plus 共享配置 ----------
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------- Feign 超时与重试共享配置 ----------
# 大厂规范: 跨服务调用必须显式配置超时，避免下游慢响应拖垮上游线程池
#   - connectTimeout: TCP 连接建立超时（ms），1s 内连不上即失败
#   - readTimeout:    响应读取超时（ms），普通接口 3s，报表接口由 @FeignClient 覆盖为 10s
# Feign 默认不重试（避免幂等问题），重试由 Resilience4j 在 Aspect 层统一处理
feign:
  client:
    config:
      default:
        connect-timeout: 1000
        read-timeout: 3000
        logger-level: BASIC
      # 报表/导出/AI 等长耗时接口分组，由 @FeignClient(name="...") 匹配
      ydsz-pmis-project:
        read-timeout: 10000
      ydsz-pmis-agent:
        read-timeout: 30000
  # 关闭默认重试，统一由 Resilience4j Retry 接管
  compression:
    request:
      enabled: true
      mime-types: application/json
    response:
      enabled: true

# ---------- Spring Cloud OpenFeign + Sentinel 熔断 ----------
# 启用 Sentinel 对 Feign 的熔断降级支持
spring.cloud.openfeign:
  circuitbreaker:
    enabled: true

# ---------- Resilience4j 重试配置 ----------
# 与 Sentinel 熔断互补: Sentinel 负责熔断/限流, Resilience4j 负责重试
# 仅对网络抖动/超时重试，不对业务异常重试（避免雪崩）
resilience4j:
  retry:
    instances:
      feignRetry:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        exponential-max-wait-duration: 2s
        retry-exceptions:
          - java.util.concurrent.TimeoutException
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - com.njydsz.pmis.common.exception.BizException
          - java.lang.IllegalArgumentException
      dbRetry:
        max-attempts: 2
        wait-duration: 100ms
        retry-exceptions:
          - org.springframework.dao.OptimisticLockingFailureException
  circuitbreaker:
    instances:
      default:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

# ---------- SpringDoc / OpenAPI 共享配置 ----------
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.njydsz.pmis
  default-flat-param-object: true

# ---------- 日志共享配置 ----------
logging:
  level:
    root: ${LOG_ROOT_LEVEL:INFO}
    "[com.njydsz.pmis]": ${LOG_PMIS_LEVEL:DEBUG}
    "[org.springframework.cloud.gateway]": INFO
    "[com.alibaba.nacos]": WARN
    "[com.baomidou.mybatisplus]": INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"
