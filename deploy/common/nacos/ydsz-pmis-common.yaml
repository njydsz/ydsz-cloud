# =====================================================================
#  YDSZ PMIS · Nacos 共享配置 (ydsz-pmis-common.yaml)
#  --------------------------------------------------------------------
#  作用:   所有 7 个微服务都通过 spring.cloud.nacos.config.shared-configs
#          引用此 dataId,实现"一处修改全集群生效"
#  部署:   Nacos 控制台 → 配置管理 → 新建配置
#          DataId:    ydsz-pmis-common.yaml
#          Group:      dev
#          配置格式:   YAML
#          导入脚本:   deploy/ubuntu/scripts/import-nacos-config.sh
# =====================================================================

# ---------- 数据源（所有服务共用） ----------
# 安全说明: DB_PASSWORD 无默认值，必须通过环境变量/Nacos 配置注入
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?currentSchema=public&useUnicode=true&characterEncoding=utf8
    username: ${DB_USER:pmis}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j
      web-stat-filter:
        enabled: true
      # Druid 监控台：生产环境(profile=prod)必须关闭，dev 环境可开启但口令必须从环境变量注入
      stat-view-servlet:
        enabled: ${DRUID_STAT_ENABLED:false}
        url-pattern: /druid/*
        login-username: ${DRUID_STAT_USERNAME:}
        login-password: ${DRUID_STAT_PASSWORD:}
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 2000

  # ---------- Redis（所有服务共用） ----------
  # 安全说明: REDIS_PASSWORD 无默认值，必须通过环境变量注入
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DB:0}
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
          max-wait: 5s

  # ---------- Spring Cache（统一使用 Redis） ----------
  cache:
    type: redis
    redis:
      time-to-live: 30m
      cache-null-values: false
      key-prefix: pmis:
      use-key-prefix: true

# ---------- MyBatis-Plus 共享配置 ----------
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------- SpringDoc / OpenAPI 共享配置 ----------
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.njydsz.pmis
  default-flat-param-object: true

# ---------- 日志共享配置 ----------
logging:
  level:
    root: ${LOG_ROOT_LEVEL:INFO}
    "[com.njydsz.pmis]": ${LOG_PMIS_LEVEL:DEBUG}
    "[org.springframework.cloud.gateway]": INFO
    "[com.alibaba.nacos]": WARN
    "[com.baomidou.mybatisplus]": INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"
