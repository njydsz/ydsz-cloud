# =============================================================================
#  RocketMQ 5.x Broker 配置文件（原生部署用，与容器内一致）
# -----------------------------------------------------------------------------
#  Ubuntu:  /opt/rocketmq/conf/broker.conf
#  Windows: C:\rocketmq\conf\broker.conf
# =============================================================================

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 72
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# NameServer（多个用分号分隔）
namesrvAddr = 127.0.0.1:9876

# Broker 端口
listenPort = 10911

# Broker 真实 IP（多网卡环境必须指定）
brokerIP1 = 127.0.0.1

# 自动创建 Topic（开发/测试环境 true；生产环境必须 false，由运维通过 mqadmin 手动创建 Topic）
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 消息大小
maxMessageSize = 4194304

# 延迟消息级别（P0-D3: 显式声明，覆盖默认 18 级）
# 1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 20m 30m 1h 2h
messageDelayLevel = 1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 20m 30m 1h 2h

# 存储路径（Windows 改用反斜杠）
storePathRootDir = /opt/rocketmq/store
storePathCommitLog = /opt/rocketmq/store/commitlog
storePathConsumeQueue = /opt/rocketmq/store/consumequeue
storePathIndex = /opt/rocketmq/store/index
storeCheckpoint = /opt/rocketmq/store/checkpoint

# HA 监听端口（主从架构用）
# haListenPort = 10912

# 主从同步超时（默认 30s）
# haHousekeepingInterval = 20000

# Broker 角色：ASYNC_MASTER / SYNC_MASTER / SLAVE
# brokerRole = ASYNC_MASTER

# 刷盘：ASYNC_FLUSH / SYNC_FLUSH
# flushDiskType = ASYNC_FLUSH

# 过滤服务器地址
# filterServerNums = 0
