# =============================================================================
#  XXL-Job 2.4 Admin 配置
# -----------------------------------------------------------------------------
#  Ubuntu:  /opt/xxl-job/application.properties
#  Windows: C:\xxl-job\application.properties
#  首次启动前需手动执行 tables_xxl_job.sql 初始化数据库
#  启动:    java -jar xxl-job-admin-2.4.2.jar
# =============================================================================

# ---------- 端口 ----------
server.port=9100
server.servlet.context-path=/xxl-job-admin

# ---------- 日志 ----------
logging.config=classpath:logback.xml
logging.file.path=/data/applogs/admin/jobLog

### 数据库（与 PMIS 共用 PostgreSQL）
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/ydsz_pmis?currentSchema=public
spring.datasource.username=pmis
spring.datasource.password=${XXL_JOB_DB_PASSWORD:pmis123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.type=org.springframework.jdbc.datasource.DruidDataSource

# Druid 连接池
spring.datasource.druid.initial-size=5
spring.datasource.druid.min-idle=5
spring.datasource.druid.max-active=30
spring.datasource.druid.max-wait=60000
spring.datasource.druid.validation-query=SELECT 1
spring.datasource.druid.test-while-idle=true
spring.datasource.druid.filters=stat,slf4j

# ---------- 国际化 ----------
spring.messages.basename=i18n/messages

# ---------- MyBatis-Plus（XXL-JOB 自带） ----------
mybatis-plus.mapper-locations=classpath:mybatis-mapper/*Mapper.xml
mybatis-plus.type-aliases-package=com.xxl.job.admin.dao
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=AUTO

# ---------- 访问令牌（与 PMIS 服务的 xxl.job.accessToken 保持一致） ----------
xxl.job.accessToken=default-token

# ---------- 登录免密（默认 false，生产建议开） ----------
xxl.job.login.encrypt=false

# ---------- i18n ----------
xxl.job.i18n=en

# ---------- 报警邮箱（按需配置） ----------
# xxl.job.alarm-mail.host=smtp.example.com
# xxl.job.alarm-mail.port=25
# xxl.job.alarm-mail.username=admin@example.com
# xxl.job.alarm-mail.password=xxx
# xxl.job.alarm-mail.send-from=admin@example.com
# xxl.job.alarm-mail.send-nick=PMIS告警
# xxl.job.alarm-mail.default-cc=

### Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
