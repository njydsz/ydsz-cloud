# =============================================================================
#  Redis 8 主配置
# -----------------------------------------------------------------------------
#  Ubuntu:  /etc/redis/redis.conf
#  Windows: C:\redis\redis.conf
#  启动:    redis-server /path/to/redis.conf
#
#  ⚠️ 安全提示:
#  - redis.conf 不支持 ${ENV_VAR} 语法，下方 requirepass 为占位符
#  - 生产环境部署时必须由部署脚本（或 docker-compose command 注入）
#    将 CHANGE_ME_IN_PRODUCTION 替换为强随机密码（建议 ≥ 24 字节）
#  - 切勿将真实密码提交到版本控制
# =============================================================================

# ---------- 网络 ----------
bind 127.0.0.1 -::1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ---------- 通用 ----------
daemonize yes
supervised no
loglevel notice
databases 16

# ---------- 安全 ----------
# ⚠️ 生产环境必须替换为强随机密码（由部署脚本注入，勿提交真实值）
requirepass CHANGE_ME_IN_PRODUCTION

# ---------- 内存 ----------
maxmemory 256mb
maxmemory-policy allkeys-lru

# ---------- 持久化 ----------
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /var/lib/redis   # Windows: C:\redis\data

# ---------- AOF ----------
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# ---------- 慢查询 ----------
slowlog-log-slower-than 10000
slowlog-max-len 128

# ---------- 客户端输出缓冲 ----------
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# ---------- 主从（按需放开） ----------
# replicaof <masterip> <masterport>
# masterauth <master-password>

# ---------- 集群（按需放开） ----------
# cluster-enabled yes
# cluster-config-file nodes-6379.conf
# cluster-node-timeout 5000
