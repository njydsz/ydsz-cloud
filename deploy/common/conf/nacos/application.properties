# =============================================================================
#  Nacos 2.3.2 Standalone 模式配置
# -----------------------------------------------------------------------------
#  Ubuntu:  /opt/nacos/conf/application.properties
#  Windows: C:\nacos\conf\application.properties
#  启动:    sh startup.sh -m standalone  (Linux)
#           startup.cmd -m standalone    (Windows)
# =============================================================================

# ---------- Spring 核心 ----------
server.port=8848
server.servlet.contextPath=/nacos

# ---------- 命名空间 ----------
spring.datasource.platform=derby
nacos.standalone=true

# ---------- Derby 内置数据库 ----------
spring.datasource.druid.stat-view-servlet.enabled=true
spring.datasource.druid.stat-view-servlet.login-username=nacos
spring.datasource.druid.stat-view-servlet.login-password=nacos

# ---------- 数据目录 ----------
nacos.home=/opt/nacos/data   # Windows: C:\\nacos\\data

# ---------- 鉴权（生产必须开启）----------
# 开启鉴权后，所有配置读写、服务注册都需要 access_token
nacos.core.auth.enabled=true

# 服务端身份标识（防止伪造 server 间通信）
# 生产必须由部署脚本注入随机 key/value（不要使用默认空值）
nacos.core.auth.server.identity.key=${NACOS_IDENTITY_KEY:}
nacos.core.auth.server.identity.value=${NACOS_IDENTITY_VALUE:}

# JWT Token 签名密钥
# ⚠️ 生产环境必须配置 ≥ 32 字节的随机 Base64 字符串（通过 NACOS_AUTH_TOKEN 环境变量注入）
# 例如: NACOS_AUTH_TOKEN=$(openssl rand -base64 48)
# 留空时 Nacos 启动会拒绝鉴权请求，必须显式配置
nacos.core.auth.plugin.nacos.token.secret.key=${NACOS_AUTH_TOKEN:}

# ---------- gRPC 通信（2.x 必需）----------
nacos.remote.client.grpc.port=9848
nacos.remote.server.grpc.port=9848

# ---------- 日志 ----------
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D %a
server.tomcat.accesslog.max-days=7

# ---------- Metrics ----------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized

# ---------- 集群模式（standalone 时注释）----------
# nacos.core.member.lookup.type=file
# nacos.member.list=127.0.0.1:8848

