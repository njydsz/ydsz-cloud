# =============================================================================
#  Seata 2.5 Server 配置
# -----------------------------------------------------------------------------
#  Ubuntu:  /opt/seata/conf/application.yml
#  Windows: C:\seata\conf\application.yml
#  启动:    sh seata-server.sh
#           seata-server.bat
# =============================================================================

server:
  port: 7091
  servlet:
    session:
      timeout: 30m

spring:
  application:
    name: seata-server

logging:
  config: classpath:logback-spring.xml
  file:
    path: ${SEATA_LOG_PATH:./logs}
  level:
    org.seata: info
    io.seata: info
    org.springframework.web: warn

# ---------- 控制台账号 ----------
console:
  user:
    username: admin
    password: ${SEATA_PASSWORD:admin}

# ---------- Seata Server 配置 ----------
seata:
  config:
    type: file
    file:
      name: file.conf
  registry:
    type: file
    file:
      name: file.conf
  # 启用控制台
  enable-console: true
  # 日志输出
  log:
    enable-console-print: true
  security:
    secretKey: SeataSecretKey1234567890abcdef
    tokenValidityInMilliseconds: 1800000
    csrf:
      enable: false
    ignore:
      urls: /,/**/*.css,/**/*.js,/**/*.html,/**/*.map,/**/*.svg,/**/*.png,/**/*.ico,/**/*.gif,/**/*.jpg,/**/*.woff,/**/*.ttf,/auth/login,/error,/health,/health/**,/webjars/**

