# =============================================================================
#  Seata Server 事务日志配置（file 模式）
# -----------------------------------------------------------------------------
#  Ubuntu:  /opt/seata/conf/file.conf
#  Windows: C:\seata\conf\file.conf
# =============================================================================

transport {
  # tcp 通信端口
  type = "TCP"
  # NIO / NATIVE
  server = "NIO"
  # enable heartbeat
  heartbeat = true
  # the client batch size for sendMessage request
  serialization = "seata"
  # compressor: none / gzip / zip / sevenz / lz4 / bzip2 / zstd
  compressor = "none"
  # 负载均衡策略: random / roundrobin / leastactive / leastused
  loadBalance = "random"
  # 虚拟节点
  virtualNodelistBucketCount = 16
  enableClientBatchSendRequest = true
  # 线程池
  threadFactory {
    bossThreadPrefix = "NettyBoss"
    workerThreadPrefix = "NettyServerNIOWorker"
    bossThreadSize = 1
    workerThreadSize = 8
  }
  shutdown {
    wait = 3
  }
}

storage {
  # 存储模式: file / db / redis
  mode = "file"
  file {
    dir = "sessionStore"
    maxBranchSessionSize = 16384
    maxGlobalSessionSize = 512
    fileWriteBufferCacheSize = 16384
    sessionReloadReadSize = 100
    flushDiskMode = async
  }
  db {
    datasource = "druid"
    dbType = "postgresql"
    driverClassName = "org.postgresql.Driver"
    url = "jdbc:postgresql://127.0.0.1:5432/seata"
    user = "seata"
    password = "${DB_PASSWORD:seata123}"
    minConn = 5
    maxConn = 30
    globalTable = "global_table"
    branchTable = "branch_table"
    lockTable = "lock_table"
    queryLimit = 100
    maxWait = 5000
  }
  redis {
    host = "127.0.0.1"
    port = "6379"
    password = "${REDIS_PASSWORD:pmis123}"
    database = "1"
    minConn = 1
    maxConn = 10
    maxTotal = 100
    queryLimit = 100
  }
}

client {
  rm {
    reportSuccessEnable = false
    reportRetryCount = 5
    lockRetryInterval = 10
    lockRetryTimes = 30
    lockStrategyMode = "optimistic"
  }
  tm {
    commitRetryCount = 5
    rollbackRetryCount = 5
  }
  undo {
    dataValidation = true
    logSerialization = "jackson"
    logTable = "undo_log"
    onlyCareUpdateColumns = true
    compressData = true
    compressConfig = "7z"
    compressType = "zip"
  }
  log {
    exceptionRate = 100
  }
}

log {
  level = "info"
  enableConsole = true
  logPath = "./logs"
}

metrics {
  registry-type = "compact"
  exporters-list = ["prometheus"]
  exporter-prometheus-port = 9898
}
