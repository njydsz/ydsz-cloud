# =============================================================================
#  PostgreSQL 18 主配置（精简版）
# -----------------------------------------------------------------------------
#  使用方法:
#    Ubuntu:  sudo cp postgresql.conf /etc/postgresql/18/main/postgresql.conf
#    Windows: 复制到 C:\Program Files\PostgreSQL\18\data\postgresql.conf
#    重启:   sudo systemctl restart postgresql  (Linux)
#           pg_ctl -D "C:\Program Files\PostgreSQL\18\data" restart  (Windows)
# =============================================================================

# ---------- 连接 ----------
# 监听所有网卡（K8s/远程部署需要）
# ⚠️ 生产环境务必通过 pg_hba.conf 限制可访问的网段（如仅允许内网 CIDR），
#    避免将 5432 端口暴露到公网
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 3

# ---------- 内存（按 8GB 内存机器调） ----------
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 512MB
huge_pages = try

# ---------- WAL ----------
# WAL 归档必须启用,与 DISASTER_RECOVERY_RUNBOOK.md §3.1 保持一致
# 归档目录 /data/backups/wal-archive/ 需提前创建并授权 postgres 用户
wal_level = replica
wal_buffers = 64MB
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
archive_mode = on
# 归档命令: 幂等(test ! -f 防止覆盖) + 复制到归档目录
# 与 DISASTER_RECOVERY_RUNBOOK.md §3.1 一致,RPO<=15min
archive_command = 'test ! -f /data/backups/wal-archive/%f && cp %p /data/backups/wal-archive/%f'
archive_timeout = 900    # 15 分钟强制切换 WAL,保证 RPO<=15min

# ---------- 查询规划 ----------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# ---------- 日志 ----------
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 500   # 慢查询阈值 ms
log_line_prefix = '%t [%p]: db=%d,user=%u,app=%a '

# ---------- 时区与字符集 ----------
timezone = 'Asia/Shanghai'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.simple'

# ---------- 复制（单机先注释，主从时启用） ----------
# wal_level = replica
# max_wal_senders = 10
# hot_standby = on

# ---------- 自动 vacuum ----------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 60s

# ---------- 大对象 ----------
max_locks_per_transaction = 128
max_pred_locks_per_transaction = 128
