# =============================================================================
#  PostgreSQL 18 主配置（精简版）
# -----------------------------------------------------------------------------
#  使用方法:
#    Ubuntu:  sudo cp postgresql.conf /etc/postgresql/18/main/postgresql.conf
#    Windows: 复制到 C:\Program Files\PostgreSQL\18\data\postgresql.conf
#    重启:   sudo systemctl restart postgresql  (Linux)
#           pg_ctl -D "C:\Program Files\PostgreSQL\18\data" restart  (Windows)
# =============================================================================

# ---------- 连接 ----------
listen_addresses = 'localhost,127.0.0.1'
port = 5432
max_connections = 200
superuser_reserved_connections = 3

# ---------- 内存（按 8GB 内存机器调） ----------
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 512MB
huge_pages = try

# ---------- WAL ----------
wal_level = replica
wal_buffers = 64MB
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9
archive_mode = on
archive_command = '/bin/true'    # 简化：内网不开归档

# ---------- 查询规划 ----------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# ---------- 日志 ----------
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 500   # 慢查询阈值 ms
log_line_prefix = '%t [%p]: db=%d,user=%u,app=%a '

# ---------- 时区与字符集 ----------
timezone = 'Asia/Shanghai'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.simple'

# ---------- 复制（单机先注释，主从时启用） ----------
# wal_level = replica
# max_wal_senders = 10
# hot_standby = on

# ---------- 自动 vacuum ----------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 60s

# ---------- 大对象 ----------
max_locks_per_transaction = 128
max_pred_locks_per_transaction = 128
