# =============================================================================
#  Seata Server 注册中心配置
# -----------------------------------------------------------------------------
#  Ubuntu:  /opt/seata/conf/registry.conf
#  Windows: C:\seata\conf\registry.conf
#  本文件已默认 file 模式（无需外部注册中心）
#  如需 nacos 模式见同目录 application.yml 注释
# =============================================================================

registry {
  # file / nacos / eureka / redis / zk / consul / etcd3 / sofa
  type = "file"

  nacos {
    application = "seata-server"
    serverAddr = "127.0.0.1:8848"
    group = "SEATA_GROUP"
    namespace = "pmis"
    cluster = "default"
    username = "nacos"
    password = "nacos"
  }

  file {
    name = "file.conf"
  }
}

config {
  # file / nacos / apollo / zk / consul / etcd3
  type = "file"

  nacos {
    serverAddr = "127.0.0.1:8848"
    namespace = "pmis"
    group = "SEATA_GROUP"
    username = "nacos"
    password = "nacos"
    dataId = "seataServer.properties"
  }

  file {
    name = "file.conf"
  }
}
