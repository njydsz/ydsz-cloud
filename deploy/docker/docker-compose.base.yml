# ====================================================================
# 南京云顶 PMIS 基础环境（基础设施层）
# 包含：Nacos + PostgreSQL 18 + Redis 7 + RocketMQ + MinIO + ElasticSearch
# 用法：docker compose -f docker-compose.base.yml -p pmis up -d
# 依赖：需先执行 deploy/sql/ 下 22 个 Flyway 脚本初始化数据库
# ====================================================================

name: pmis-base

services:
  # ============ PostgreSQL 主数据库 ============
  postgres:
    image: postgres:18-alpine
    container_name: pmis-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pmis
      POSTGRES_USER: ${POSTGRES_USER:-pmis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pmis@2026}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=zh_CN.UTF-8"
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pmis} -d ${POSTGRES_DB:-pmis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pmis-net

  # ============ Redis 缓存 + 会话管理 + 分布式锁 ============
  redis:
    image: redis:7-alpine
    container_name: pmis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-pmis@2026} --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-pmis@2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pmis-net

  # ============ Nacos 注册中心 + 配置中心 ============
  nacos:
    image: nacos/nacos-server:v2.4.0
    container_name: pmis-nacos
    restart: unless-stopped
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
      SPRING_DATASOURCE_PLATFORM: derby
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-SecretKey012345678901234567890123456789012345678901234567890123456789}
      NACOS_AUTH_IDENTITY_KEY: pmis
      NACOS_AUTH_IDENTITY_VALUE: pmis
      TZ: Asia/Shanghai
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - pmis-net

  # ============ RocketMQ 异步消息（Dledger 高可用集群） ============
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.0
    container_name: pmis-rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
    networks:
      - pmis-net

  rocketmq-broker-a:
    image: apache/rocketmq:5.3.0
    container_name: pmis-rocketmq-broker-a
    restart: unless-stopped
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    command: sh mqbroker -n pmis-rocketmq-namesrv:9876 -c /opt/rocketmq/conf/dledger/broker-a.conf
    environment:
      JAVA_OPT_EXT: "-Xms1g -Xmx1g"
    volumes:
      - rocketmq-data-a:/opt/rocketmq/store
      - rocketmq-logs-a:/opt/rocketmq/logs
      - ./rocketmq/broker-a.conf:/opt/rocketmq/conf/dledger/broker-a.conf:ro
    depends_on:
      - rocketmq-namesrv
    networks:
      - pmis-net

  rocketmq-broker-b:
    image: apache/rocketmq:5.3.0
    container_name: pmis-rocketmq-broker-b
    restart: unless-stopped
    ports:
      - "10919:10909"
      - "10921:10911"
      - "10922:10912"
    command: sh mqbroker -n pmis-rocketmq-namesrv:9876 -c /opt/rocketmq/conf/dledger/broker-b.conf
    environment:
      JAVA_OPT_EXT: "-Xms1g -Xmx1g"
    volumes:
      - rocketmq-data-b:/opt/rocketmq/store
      - rocketmq-logs-b:/opt/rocketmq/logs
      - ./rocketmq/broker-b.conf:/opt/rocketmq/conf/dledger/broker-b.conf:ro
    depends_on:
      - rocketmq-namesrv
    networks:
      - pmis-net

  rocketmq-broker-c:
    image: apache/rocketmq:5.3.0
    container_name: pmis-rocketmq-broker-c
    restart: unless-stopped
    ports:
      - "10929:10909"
      - "10931:10911"
      - "10932:10912"
    command: sh mqbroker -n pmis-rocketmq-namesrv:9876 -c /opt/rocketmq/conf/dledger/broker-c.conf
    environment:
      JAVA_OPT_EXT: "-Xms1g -Xmx1g"
    volumes:
      - rocketmq-data-c:/opt/rocketmq/store
      - rocketmq-logs-c:/opt/rocketmq/logs
      - ./rocketmq/broker-c.conf:/opt/rocketmq/conf/dledger/broker-c.conf:ro
    depends_on:
      - rocketmq-namesrv
    networks:
      - pmis-net

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:1.0.0
    container_name: pmis-rocketmq-dashboard
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=pmis-rocketmq-namesrv:9876 -Xms256m -Xmx256m"
    depends_on:
      - rocketmq-namesrv
    networks:
      - pmis-net

  # ============ MinIO 对象存储（文件模块后端） ============
  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: pmis-minio
    restart: unless-stopped
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pmis-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pmis@2026}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - pmis-net

  # ============ Elasticsearch 日志/全文检索（可选） ============
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: pmis-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.transport.ssl.enabled: "true"
      xpack.security.transport.ssl.rotation_mode: "true"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required}
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
      TZ: Asia/Shanghai
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required} -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - pmis-net

volumes:
  postgres-data:
    name: pmis-postgres-data
  redis-data:
    name: pmis-redis-data
  nacos-data:
    name: pmis-nacos-data
  nacos-logs:
    name: pmis-nacos-logs
  rocketmq-data-a:
    name: pmis-rocketmq-data-a
  rocketmq-data-b:
    name: pmis-rocketmq-data-b
  rocketmq-data-c:
    name: pmis-rocketmq-data-c
  rocketmq-logs-a:
    name: pmis-rocketmq-logs-a
  rocketmq-logs-b:
    name: pmis-rocketmq-logs-b
  rocketmq-logs-c:
    name: pmis-rocketmq-logs-c
  minio-data:
    name: pmis-minio-data
  es-data:
    name: pmis-elasticsearch-data

networks:
  pmis-net:
    name: pmis-network
    driver: bridge
