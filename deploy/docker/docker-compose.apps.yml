# ====================================================================
# 南京云顶 PMIS 7 个微服务 + 周边组件编排（2026-07-03 合并后）
# ---------------------------------------------------------------------
# 7 个微服务（按启动顺序 9000 连续编排）:
#   gateway  :9000  / system   :9001 / userinfo :9002 / project  :9003
#   cronjob  :9004  / workflow :9005 / agent    :9006
# 端口分配原则: 9000 网关；9001-9006 按"基础→用户→业务→调度→流程→AI"依赖顺序
#              9007-9099 保留给未来模块（财务独立、报表引擎、BI）
# 周边组件：
#   xxl-job-admin :9100（分布式任务调度）
#   seata-server :8091（分布式事务协调器）
#   sentinel-dashboard :8719（流量控制/熔断）
# 依赖：docker-compose.base.yml 必须先 up
# 用法：docker compose -f docker-compose.apps.yml up -d
# ====================================================================

name: pmis-apps

x-microservice-common: &microservice-common
  restart: unless-stopped
  env_file:
    - .env
  environment:
    NACOS_SERVER: pmis-nacos:8848
    POSTGRES_HOST: pmis-postgres
    POSTGRES_PORT: 5432
    POSTGRES_USER: pmis
    POSTGRES_PASSWORD: pmis@2026
    REDIS_HOST: pmis-redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: pmis@2026
    ROCKETMQ_NAMESRV: pmis-rocketmq-namesrv:9876
    TZ: Asia/Shanghai
    JAVA_OPTS: >-
      -Xms2g -Xmx2g
      -XX:+UseG1GC
      -XX:NewRatio=2
      -XX:+HeapDumpOnOutOfMemoryError
      -XX:HeapDumpPath=/var/log/pmis/oom
      -Dfile.encoding=UTF-8
  volumes:
    - pmis-logs:/var/log/pmis
  networks:
    - pmis-net
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:${SERVER_PORT}/actuator/health 2>/dev/null | grep -q UP || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 60s
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    nacos:
      condition: service_healthy

services:
  # ============ 7 个微服务（按依赖顺序启动）============

  # 1) gateway - API 网关
  gateway:
    image: pmis-gateway:${IMAGE_TAG:-1.0.0}
    container_name: pmis-gateway
    <<: *microservice-common
    ports:
      - "9000:9000"
    environment:
      APP_NAME: pmis-gateway
      SERVER_PORT: 9000
    depends_on:
      - system
      - userinfo
      - project
      - workflow
      - agent
      - cronjob

  # 2) system - 文件/配置/审计/通知/消息模板（合并）
  system:
    image: pmis-system:${IMAGE_TAG:-1.0.0}
    container_name: pmis-system
    <<: *microservice-common
    ports:
      - "9001:9001"
    environment:
      APP_NAME: pmis-system
      SERVER_PORT: 9001

  # 3) userinfo - 用户/权限/认证/资源（合并）
  userinfo:
    image: pmis-userinfo:${IMAGE_TAG:-1.0.0}
    container_name: pmis-userinfo
    <<: *microservice-common
    ports:
      - "9002:9002"
    environment:
      APP_NAME: pmis-userinfo
      SERVER_PORT: 9002

  # 4) project - 项目/执行/财务/报表（合并）
  project:
    image: pmis-project:${IMAGE_TAG:-1.0.0}
    container_name: pmis-project
    <<: *microservice-common
    ports:
      - "9003:9003"
    environment:
      APP_NAME: pmis-project
      SERVER_PORT: 9003

  # 5) cronjob - 分布式任务调度
  cronjob:
    image: pmis-cronjob:${IMAGE_TAG:-1.0.0}
    container_name: pmis-cronjob
    <<: *microservice-common
    ports:
      - "9004:9004"
    environment:
      APP_NAME: pmis-cronjob
      SERVER_PORT: 9004

  # 6) workflow - 工作流
  workflow:
    image: pmis-workflow:${IMAGE_TAG:-1.0.0}
    container_name: pmis-workflow
    <<: *microservice-common
    ports:
      - "9005:9005"
    environment:
      APP_NAME: pmis-workflow
      SERVER_PORT: 9005

  # 7) agent - AI 智能体
  agent:
    image: pmis-agent:${IMAGE_TAG:-1.0.0}
    container_name: pmis-agent
    <<: *microservice-common
    ports:
      - "9006:9006"
    environment:
      APP_NAME: pmis-agent
      SERVER_PORT: 9006

  # ============ 周边组件（独立部署）============

  # xxl-job-admin 调度管理后台
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.0
    container_name: pmis-xxl-job-admin
    restart: unless-stopped
    ports:
      - "9100:8080"
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:postgresql://pmis-postgres:5432/pmis
        --spring.datasource.username=pmis
        --spring.datasource.password=pmis@2026
        --xxl.job.accessToken=pmis-xxl-token
    volumes:
      - xxljob-logs:/data/applogs/xxl-job
    networks:
      - pmis-net
    depends_on:
      postgres:
        condition: service_healthy

  # seata-server 分布式事务
  seata-server:
    image: seataio/seata-server:2.0.0
    container_name: pmis-seata-server
    restart: unless-stopped
    ports:
      - "8091:8091"
      - "7091:7091"
    environment:
      SEATA_PORT: 8091
      STORE_MODE: file
      TZ: Asia/Shanghai
    volumes:
      - seata-logs:/root/logs/seata
      - ../seata/seata-client.properties:/seata-server/resources/application.yml:ro
    networks:
      - pmis-net

  # sentinel-dashboard 流控/熔断
  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: pmis-sentinel-dashboard
    restart: unless-stopped
    ports:
      - "8719:8719"
    environment:
      JAVA_OPTS: >-
        -Dcsp.sentinel.dashboard.server=localhost:8719
        -Dproject.name=pmis
        -Xms256m -Xmx512m
    networks:
      - pmis-net

volumes:
  pmis-logs:
    name: pmis-logs
  xxljob-logs:
    name: pmis-xxljob-logs
  seata-logs:
    name: pmis-seata-logs

networks:
  pmis-net:
    name: pmis-network
    external: true
    driver: bridge
