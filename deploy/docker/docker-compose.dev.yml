# =============================================================================
#  YDSZ PMIS · 开发/测试环境基础设施编排
# -----------------------------------------------------------------------------
# 用途:    一键拉起 PMIS 后端所需的全部基础设施（7 个容器，约 3.5GB 内存）
# 依赖:    Docker 24+ / Docker Compose v2+
# 启动:    docker compose -f deploy/docker/docker-compose.dev.yml up -d
# 停止:    docker compose -f deploy/docker/docker-compose.dev.yml down
# 重置:    docker compose -f deploy/docker/docker-compose.dev.yml down -v
#
# 包含组件:
#    1. PostgreSQL 18       - 主数据库（自动初始化 126 张表）
#    2. Redis 8             - 缓存 / 会话 / 分布式锁
#    3. Nacos 2.3.2         - 服务注册 + 配置中心（standalone + 内置 derby）
#    4. MinIO               - 对象存储（文件 / 报表 / 导出）
#    5. Seata 2.5           - 分布式事务协调器（AT 模式）
#    6. RocketMQ 5.x        - 消息中间件（NameServer + Broker + Console）
#    7. XXL-Job 2.4         - 分布式任务调度（Admin）
#    8. Prometheus          - 指标采集（端口 9090）
#    9. Grafana             - 可视化面板（端口 3000,内置 PMIS 仪表盘）
#   10. Alertmanager        - 告警中枢（端口 9093,钉钉/邮件）
#   11. Loki                - 日志聚合（端口 3100,30 天保留）
#   12. Promtail            - 日志采集（抓取 /var/log/pmis/*.log）
# 全文检索：PostgreSQL tsvector（已移除 Elasticsearch，P2-19）
#
# 端口速查:
#    5432  PostgreSQL   6379  Redis         8848/9848  Nacos
#    9100  MinIO API    9101  MinIO Console  8091  Seata
#    9876  RocketMQ NS  10911 RocketMQ Broker  8080/9100  RocketMQ Console
#    9100  XXL-Job Admin
#    9090  Prometheus   3000  Grafana       9093  Alertmanager   3100  Loki
#
#  原生（无 Docker）部署: 参考 docs/INFRASTRUCTURE.md
# =============================================================================

name: pmis-dev

# =============================================================================
#  通用配置：Compose v2 的 --compatibility 行为
# =============================================================================
x-common-env: &common-env
  TZ: Asia/Shanghai

services:

  # ---------------------------------------------------------------------------
  #  1. PostgreSQL 18 - 主数据库
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: pmis-postgres
    restart: unless-stopped
    environment:
      <<: *common-env
      POSTGRES_DB: ${POSTGRES_DB:-ydsz_pmis}
      POSTGRES_USER: ${POSTGRES_USER:-pmis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pmis123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 首次启动自动建库+灌 SQL
      # docker-compose 文件位于 deploy/docker/，SQL 脚本位于 deploy/sql/
      - ../sql/V1.0.0.sql:/docker-entrypoint-initdb.d/V1.0.0.sql:ro
    networks:
      - pmis-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pmis} -d ${POSTGRES_DB:-ydsz_pmis}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  #  2. Redis 8 - 缓存 + 会话 + 分布式锁
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: pmis-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - "allkeys-lru"
      - --requirepass
      - ${REDIS_PASSWORD:-pmis123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - pmis-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-pmis123}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  #  3. Nacos 2.3.2 - 服务注册 + 配置中心
  # ---------------------------------------------------------------------------
  #  standalone 模式 + 内置 derby；如需 MySQL 持久化见 INFRASTRUCTURE.md
  # ---------------------------------------------------------------------------
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: pmis-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
      TZ: Asia/Shanghai
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "9848:9848"
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs
    networks:
      - pmis-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  #  4. MinIO - 对象存储
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: pmis-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      TZ: Asia/Shanghai
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio_data:/data
    networks:
      - pmis-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  #  4.1 MinIO 初始化 - 自动创建 pmis 桶
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: pmis-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
      (mc mb --ignore-existing local/${MINIO_BUCKET:-pmis}) &&
      mc anonymous set download local/${MINIO_BUCKET:-pmis} || true &&
      echo 'MinIO bucket [${MINIO_BUCKET:-pmis}] initialized.'
      "
    networks:
      - pmis-net
    restart: "no"

  # ---------------------------------------------------------------------------
  #  5. Seata 2.5 - 分布式事务协调器
  # ---------------------------------------------------------------------------
  #  使用内置 file 模式持久化（生产用 MySQL 持久化见 INFRASTRUCTURE.md）
  #  端口: 8091 (TCP) / 7091 (HTTP 控制台, 2.x 才有)
  # ---------------------------------------------------------------------------
  seata:
    image: apache/seata-server:2.5.0
    container_name: pmis-seata
    restart: unless-stopped
    hostname: seata
    environment:
      TZ: Asia/Shanghai
      SEATA_IP: seata
      SEATA_PORT: 8091
      # 存储模式：file（默认） / db / redis
      STORE_MODE: file
      # 控制台账号（2.5+ 才有）
      SEATA_CONSOLE_USERNAME: ${SEATA_CONSOLE_USER:admin}
      SEATA_CONSOLE_PASSWORD: ${SEATA_CONSOLE_PASSWORD:admin}
    ports:
      - "7091:7091"
      - "8091:8091"
    volumes:
      - seata_logs:/root/logs
    networks:
      - pmis-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7091/auth/login -X POST -H 'Content-Type: application/json' -d '{\"username\":\"admin\",\"password\":\"admin\"}' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  #  6. RocketMQ 5.x - 消息中间件
  # ---------------------------------------------------------------------------
  #  含 NameServer + Broker + Proxy 5.x 集成模式
  #  端口: 9876 (NameServer) / 10911 (Broker) / 8080 (Proxy/RocketMQ Console)
  # ---------------------------------------------------------------------------
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: pmis-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      TZ: Asia/Shanghai
    ports:
      - "9876:9876"
    volumes:
      - rocketmq_logs:/home/rocketmq/logs
      - rocketmq_store:/home/rocketmq/store
    networks:
      - pmis-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9876 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: pmis-rocketmq-broker
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    environment:
      TZ: Asia/Shanghai
    ports:
      - "10911:10911"
      - "10909:10909"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf:ro
      - rocketmq_logs:/home/rocketmq/logs
      - rocketmq_store:/home/rocketmq/store
    networks:
      - pmis-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 10911 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  rocketmq-console:
    image: apacherocketmq/rocketmq-console-ng:2.0.1
    container_name: pmis-rocketmq-console
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false"
    ports:
      - "${ROCKETMQ_CONSOLE_PORT:-8080}:8080"
    networks:
      - pmis-net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  #  7. XXL-Job 2.4 - 分布式任务调度（Admin）
  # ---------------------------------------------------------------------------
  #  Admin 控制台 + 默认账号 admin/123456
  #  端口: 9100（按 application.yml XXL_JOB_ADMIN_ADDRESSES 配置）
  #  数据库初始化: 首次启动自动执行 /docker-entrypoint-initdb.d/tables_xxl_job.sql
  # ---------------------------------------------------------------------------
  xxl-job:
    image: xuxueli/xxl-job-admin:2.4.2
    container_name: pmis-xxl-job
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ydsz_pmis}
        --spring.datasource.username=${POSTGRES_USER:-pmis}
        --spring.datasource.password=${POSTGRES_PASSWORD:-pmis123}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:-default-token}
    ports:
      - "${XXL_JOB_PORT:-9100}:8080"
    volumes:
      - xxl_job_logs:/data/applogs/admin/jobLog
    networks:
      - pmis-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/xxl-job-admin/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  #  注: Elasticsearch 已移除（P2-19 起改用 PostgreSQL tsvector 全文检索）
  # ---------------------------------------------------------------------------

  # ===========================================================================
  #  监控可观测性栈 (Prometheus + Grafana + Alertmanager + Loki + Promtail)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  #  8. Prometheus - 指标采集与时序存储
  # ---------------------------------------------------------------------------
  #  端口: 9090 (Web UI)
  #  配置: deploy/monitoring/prometheus/prometheus.yml
  #  规则: deploy/monitoring/prometheus/rules/pmis-alerts.yml
  #  抓取目标: PMIS 微服务 /actuator/prometheus (host.docker.internal)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: pmis-prometheus
    restart: unless-stopped
    extra_hosts:
      # Linux 下需启用 host.docker.internal 解析(Windows/Mac 内置)
      - "host.docker.internal:host-gateway"
    environment:
      <<: *common-env
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      # 主配置(抓取目标 + alertmanager + rule_files)
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # 告警规则
      - ../monitoring/prometheus/rules/pmis-alerts.yml:/etc/prometheus/rules/pmis-alerts.yml:ro
      # 持久化 tsdb 数据
      - prometheus_data:/prometheus
    command:
      # 启用时序保留(lifecycle API),数据落盘
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --web.enable-admin-api
    networks:
      - pmis-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  #  9. Grafana - 可视化面板
  # ---------------------------------------------------------------------------
  #  端口: 3000 (Web UI)
  #  默认账号: admin / admin(首次登录强制改密)
  #  数据源: Prometheus(http://prometheus:9090) + Loki(http://loki:3100)
  #  仪表盘: provisioning 自动加载 PMIS 总览/业务/工作流三个面板
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: pmis-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      <<: *common-env
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 自动加载数据源与仪表盘 provisioning
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      # 仪表盘 provisioning 配置
      - ../monitoring/grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      # 仪表盘 JSON(自动加载至 PMIS folder)
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      # 数据源 provisioning(Prometheus + Loki)
      - ../monitoring/grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      # 持久化(用户/面板修改)
      - grafana_data:/var/lib/grafana
    networks:
      - pmis-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  #  10. Alertmanager - 告警通知中枢
  # ---------------------------------------------------------------------------
  #  端口: 9093 (Web UI)
  #  配置: deploy/monitoring/alertmanager/alertmanager.yml
  #  模板: deploy/monitoring/alertmanager/dingtalk-template.tmpl
  #  通知渠道: 钉钉 webhook + 邮件 + 通用 webhook 回退
  #  告警分级: P0 立即 / P1 5min / P2 30min / P3 1h
  # ---------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:latest
    container_name: pmis-alertmanager
    restart: unless-stopped
    environment:
      <<: *common-env
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      # 主配置(路由 + 接收器 + 抑制规则)
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # 钉钉通知模板
      - ../monitoring/alertmanager/dingtalk-template.tmpl:/etc/alertmanager/templates/dingtalk-template.tmpl:ro
      # 持久化告警状态(静默/抑制)
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:9093
      - --web.listen-address=:9093
    networks:
      - pmis-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  #  11. Loki - 日志聚合时序存储
  # ---------------------------------------------------------------------------
  #  端口: 3100 (HTTP API)
  #  配置: deploy/monitoring/loki/loki-config.yml
  #  存储: 文件系统 /loki/data(开发环境)
  #  保留: 30 天
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:latest
    container_name: pmis-loki
    restart: unless-stopped
    environment:
      <<: *common-env
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ../monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command:
      - -config.file=/etc/loki/loki-config.yml
    networks:
      - pmis-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  #  12. Promtail - 日志采集客户端
  # ---------------------------------------------------------------------------
  #  采集: /var/log/pmis/*.log (PMIS 后端 logback LOGSTASH_JSON appender 输出)
  #  推送: http://loki:3100/loki/push
  #  解析: json pipeline 提取 service / level / traceId 标签
  #  说明: 挂载宿主机日志目录(Windows: D:\Code\ydsz\ydsz-pmis\logs,Mac/Linux: ./logs)
  #        通过 PMIS_LOG_DIR 环境变量配置实际路径
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:latest
    container_name: pmis-promtail
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    environment:
      <<: *common-env
    volumes:
      - ../monitoring/loki/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # 挂载宿主机日志目录(需配置 PMIS_LOG_DIR 指向实际日志路径)
      - ${PMIS_LOG_DIR:-./pmis-logs}:/var/log/pmis:ro
      # 采集 docker 容器日志(可选)
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_data:/tmp
    command:
      - -config.file=/etc/promtail/promtail-config.yml
    networks:
      - pmis-net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

# =============================================================================
#  网络与数据卷
# =============================================================================
networks:
  pmis-net:
    driver: bridge
    name: pmis-net

volumes:
  postgres_data:
    name: pmis-postgres-data
  redis_data:
    name: pmis-redis-data
  nacos_data:
    name: pmis-nacos-data
  nacos_logs:
    name: pmis-nacos-logs
  minio_data:
    name: pmis-minio-data
  seata_logs:
    name: pmis-seata-logs
  rocketmq_logs:
    name: pmis-rocketmq-logs
  rocketmq_store:
    name: pmis-rocketmq-store
  xxl_job_logs:
    name: pmis-xxl-job-logs
  # 监控可观测性栈数据卷
  prometheus_data:
    name: pmis-prometheus-data
  grafana_data:
    name: pmis-grafana-data
  alertmanager_data:
    name: pmis-alertmanager-data
  loki_data:
    name: pmis-loki-data
  promtail_data:
    name: pmis-promtail-data
