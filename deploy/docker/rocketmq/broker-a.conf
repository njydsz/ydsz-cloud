# ==================== RocketMQ Broker-A Dledger 配置 ====================
# 3 节点 Dledger 集群，自动 Leader 选举，保证高可用
# 节点 ID: n0 (broker-a) | n1 (broker-b) | n2 (broker-c)

brokerClusterName = pmis-dledger-cluster
brokerName = broker-a
brokerId = 0
namesrvAddr = pmis-rocketmq-namesrv:9876

# Dledger 高可用配置
dLegerGroup = pmis-dledger-group
dLegerPeers = n0@pmis-rocketmq-broker-a:10911;n1@pmis-rocketmq-broker-b:10911;n2@pmis-rocketmq-broker-c:10911
dLegerSelfId = n0

# 存储路径
storePathRootDir = /opt/rocketmq/store
storePathCommitLog = /opt/rocketmq/store/commitlog

# 网络配置
brokerIP1 = pmis-rocketmq-broker-a
listenPort = 10911
haListenPort = 10912

# 刷盘策略：异步刷盘
flushDiskType = ASYNC_FLUSH
# 主从同步：异步复制
brokerRole = ASYNC_MASTER
