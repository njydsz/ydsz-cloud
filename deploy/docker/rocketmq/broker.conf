# =============================================================================
#  RocketMQ Broker 配置文件
# -----------------------------------------------------------------------------
#  容器路径: /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
#  原生路径: $ROCKETMQ_HOME/conf/broker.conf
# =============================================================================

# ---------- 集群名称 ----------
brokerClusterName = DefaultCluster

# ---------- Broker 名称（主从架构用 brokerName + brokerId） ----------
brokerName = broker-a

# ---------- Broker ID: 0 = Master, >0 = Slave ----------
brokerId = 0

# ---------- 删除时间（凌晨 4 点） ----------
deleteWhen = 04

# ---------- 消息保留时间（小时） ----------
fileReservedTime = 72

# ---------- Broker 角色：ASYNC_MASTER / SYNC_MASTER / SLAVE ----------
brokerRole = ASYNC_MASTER

# ---------- 刷盘方式：ASYNC_FLUSH（异步） / SYNC_FLUSH（同步） ----------
flushDiskType = ASYNC_FLUSH

# ---------- NameServer 地址（多个用分号分隔）----------
namesrvAddr = rocketmq-namesrv:9876

# ---------- Broker 对外提供服务的端口 ----------
listenPort = 10911

# ---------- Broker IP（容器内为主机名 / 原生为真实 IP）----------
brokerIP1 = rocketmq-broker

# ---------- 是否允许 Broker 自动创建 Topic（生产建议 false）----------
autoCreateTopicEnable = true

# ---------- 是否允许 Broker 自动创建订阅组（生产建议 false）----------
autoCreateSubscriptionGroup = true

# ---------- 单条消息最大字节（默认 4MB） ----------
maxMessageSize = 4194304

# ---------- 消息存储路径 ----------
storePathRootDir = /home/rocketmq/store
storePathCommitLog = /home/rocketmq/store/commitlog
storePathConsumeQueue = /home/rocketmq/store/consumequeue
storePathIndex = /home/rocketmq/store/index

# ---------- 检查点文件路径 ----------
storeCheckpoint = /home/rocketmq/store/checkpoint

# ---------- 消息索引（true=可靠, false=高性能） ----------
messageIndexEnable = true

# ---------- 不均衡消费的 Broker 地址（可选） ----------
# brokerTopicEnable = true
