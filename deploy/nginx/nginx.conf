# =====================================================================
#  PMIS Nginx 1.25 主配置（批次 19）
# ---------------------------------------------------------------------
#  角色：
#  - HTTPS 终止（certbot 自动续期）
#  - 反向代理到 14 个微服务（按路径前缀）
#  - 限流（limit_req）
#  - Gzip 压缩
#  - WebSocket 升级
#  - 安全 Header（HSTS / CSP / X-Frame-Options）
#  - 访问日志 JSON 化（供 ELK 采集）
# =====================================================================

user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # ---- 基础 ----
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;
    client_max_body_size 100M;          # 文件上传 100M
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_names_hash_bucket_size 128;
    variables_hash_max_size 2048;

    # ---- 日志（JSON 格式供 ELK 解析）----
    log_format pmis_json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"server_name":"$server_name",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"upstream_status":"$upstream_status",'
        '"host":"$host"'
        '}';
    access_log /var/log/nginx/pmis_access.log pmis_json buffer=32k flush=5s;
    error_log /var/log/nginx/pmis_error.log warn;

    # ---- Gzip ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ---- SSL 优化 ----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 114.114.114.114 valid=300s;
    resolver_timeout 5s;

    # ---- 限流（共享内存）----
    limit_req_zone $binary_remote_addr zone=pmis_per_ip:20m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=pmis_per_ip_burst:20m rate=1000r/s burst=200 nodelay;
    limit_req_zone $http_x_forwarded_for zone=pmis_global:30m rate=10000r/s;
    limit_conn_zone $binary_remote_addr zone=pmis_conn_per_ip:20m;
    limit_conn_status 429;

    # ---- 上游微服务池 ----
    upstream pmis_gateway {
        least_conn;
        server 10.0.1.11:9000 max_fails=3 fail_timeout=30s;
        server 10.0.1.12:9000 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    upstream pmis_project_cluster {
        ip_hash;
        server 10.0.1.12:9015 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream pmis_execution_cluster {
        ip_hash;
        server 10.0.1.12:9016 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream pmis_agent_cluster {
        ip_hash;
        server 10.0.1.13:9017 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream pmis_scheduler_cluster {
        ip_hash;
        server 10.0.1.12:9022 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream pmis_audit_cluster {
        ip_hash;
        server 10.0.1.12:9020 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream pmis_notification_cluster {
        ip_hash;
        server 10.0.1.13:9013 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream pmis_workflow_cluster {
        ip_hash;
        server 10.0.1.12:9014 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream pmis_file_cluster {
        ip_hash;
        server 10.0.1.12:9019 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ---- 站点配置 ----
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
