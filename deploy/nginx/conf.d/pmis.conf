# =====================================================================
#  PMIS 主站点配置（2026-07-03 服务合并后 7 部署单元）
# ---------------------------------------------------------------------
#  端口：443 HTTPS（80 自动跳转）
#  上游：7 个微服务（按路径前缀路由）
#  端口分配: 9000 gateway / 9001 system / 9002 userinfo / 9003 project
#            9004 cronjob  / 9005 workflow / 9006 agent
# =====================================================================

# ---- HTTP -> HTTPS 强制跳转 ----
server {
    listen 80;
    listen [::]:80;
    server_name pmis.example.com _;
    server_tokens off;
    access_log off;

    # ACME challenge 不跳转
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS 主站点 ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pmis.example.com;

    # ---- SSL 证书（certbot 路径）----
    ssl_certificate /etc/letsencrypt/live/pmis.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pmis.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/pmis.example.com/chain.pem;
    ssl_dhparam /etc/nginx/dhparam.pem;

    # ---- 安全 Header ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---- 限流 ----
    limit_req zone=pmis_per_ip_burst burst=200 nodelay;
    limit_req zone=pmis_global burst=10000 nodelay;
    limit_conn pmis_conn_per_ip 50;

    # ---- 超时 ----
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering on;
    proxy_buffers 16 16k;
    proxy_buffer_size 32k;
    proxy_busy_buffers_size 64k;
    proxy_request_buffering on;

    # ---- 通用代理 Header ----
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Trace-Id $request_id;

    # ---- 路径路由：7 个微服务（2026-07-03 合并后）----
    # 1. 网关（默认入口，统一鉴权）
    location / {
        limit_req zone=pmis_per_ip burst=100 nodelay;
        proxy_pass http://pmis_gateway;
    }

    # 2. 系统基础服务（file + config + audit + notification + message）
    location /api/v1/file/ {
        client_max_body_size 500M;
        proxy_pass http://pmis_system_cluster;
    }
    location /api/v1/audit/ {
        proxy_pass http://pmis_system_cluster;
    }
    location /api/v1/notification/ {
        proxy_pass http://pmis_system_cluster;
    }
    location /api/v1/message/ {
        proxy_pass http://pmis_system_cluster;
    }
    location /api/v1/config/ {
        proxy_pass http://pmis_system_cluster;
    }

    # 3. 用户信息中心（user + auth 合并）
    location /api/v1/user/ {
        proxy_pass http://pmis_userinfo_cluster;
    }
    location /api/v1/auth/ {
        proxy_pass http://pmis_userinfo_cluster;
    }
    location /api/v1/role/ {
        proxy_pass http://pmis_userinfo_cluster;
    }
    location /api/v1/dept/ {
        proxy_pass http://pmis_userinfo_cluster;
    }
    location /api/v1/attendance/ {
        proxy_pass http://pmis_userinfo_cluster;
    }
    location /api/v1/resource/ {
        proxy_pass http://pmis_userinfo_cluster;
    }

    # 4. 项目服务（project + execution + finance 合并）
    location /api/v1/project/ {
        proxy_pass http://pmis_project_cluster;
    }
    location /api/v1/execution/ {
        proxy_pass http://pmis_project_cluster;
    }
    location /api/v1/finance/ {
        proxy_pass http://pmis_project_cluster;
    }
    location /api/v1/profit/ {
        proxy_pass http://pmis_project_cluster;
    }
    location /api/v1/cockpit/ {
        proxy_pass http://pmis_project_cluster;
    }

    # 5. 调度服务（XXL-JOB）
    location /api/v1/cronjob/ {
        proxy_pass http://pmis_cronjob_cluster;
    }
    location /api/v1/job/ {
        proxy_pass http://pmis_cronjob_cluster;
    }

    # 6. 工作流
    location /api/v1/workflow/ {
        proxy_pass http://pmis_workflow_cluster;
    }

    # 7. AI Agent
    location /api/v1/agent/ {
        proxy_pass http://pmis_agent_cluster;
    }

    # 10. 健康检查（不计入限流）
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","server":"nginx-pmis","version":"1.0.0"}';
    }

    # 11. WebSocket（实时通知/AI 推送）
    location /ws/ {
        proxy_pass http://pmis_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;     # 长连接
        proxy_send_timeout 3600s;
    }

    # 12. 静态资源（前端 build 后部署到 /var/www/pmis）
    location /static/ {
        alias /var/www/pmis/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico {
        alias /var/www/pmis/favicon.ico;
        expires 30d;
        access_log off;
    }

    # ---- 错误页 ----
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ---- 慢请求/超限日志 ----
    location ~ \.(php|jsp|cgi)$ {
        return 403;
    }
}
