# ============================================================
# 公共基础配置：pmis-common-PROD
# DataId  : pmis-common-prod.yaml
# Group   : PMIS_GROUP_PROD
# Namespace: pmis
# 环境     : 生产（线上真实数据）
# 用途     : 各微服务共享的 DB / Redis / MyBatis-Plus / Logging 配置
# ============================================================

spring:
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_NULL
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?useUnicode=true&characterEncoding=utf8&currentSchema=public
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    druid:
      # H7 修复：连接池从 80 收敛到 30，避免单服务耗尽 PG max_connections
      # 9 个微服务 × 80 = 720 连接，已逼近 PG 默认 max_connections=1000
      # 收敛后 9 × 30 = 270，给运维与突发负载留出充足余量
      initial-size: 10
      min-idle: 10
      max-active: 30
      max-wait: 60000
      validation-query: SELECT 1
      validation-timeout: 3
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # H4.3/H8.1 修复：K8s 网络下保活，避免 PG/iptables 30s 超时断连
      keep-alive: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 900000
      # H4.3/H8.2 修复：连接泄漏检测，5 分钟未关闭视为泄漏
      remove-abandoned: true
      remove-abandoned-timeout: 300
      log-abandoned: true
      connection-init-checks: true
      filters: stat,wall,slf4j
      filter:
        wall:
          enabled: true
          config:
            # H4.4 修复：wall filter 防注入规则
            select-all-column-allow: false        # 禁止 SELECT *
            delete-where-none-check: true         # 禁止无 WHERE 的 DELETE
            update-where-none-check: true         # 禁止无 WHERE 的 UPDATE
            truncate-allow: false                 # 禁止 TRUNCATE
            drop-table-allow: false               # 禁止 DROP TABLE
            alter-table-allow: false              # 禁止 ALTER TABLE（迁移走 Flyway）
        stat:
          enabled: true
          slow-sql-millis: 1000                   # 与 PG log_min_duration_statement 对齐
          log-slow-sql: true
      # H4.1 修复：监控页面默认关闭，启用时必须配置账号密码与 IP 白名单
      stat-view-servlet:
        enabled: ${DRUID_MONITOR_ENABLED:false}
        login-username: ${DRUID_USER:pmis_dba}
        login-password: ${DRUID_PASSWORD:}
        allow: ${DRUID_ALLOW_IP:127.0.0.1}
        deny: 0.0.0.0/0
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 5s
  cloud:
    openfeign:
      client:
        config:
          default:
            # C14 修复：与 dev 对齐，统一 Feign 超时
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: BASIC

# C14 修复：启用 Sentinel 熔断降级
feign:
  sentinel:
    enabled: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # H8.5 修复：内网 K8s readiness 探针需要看到具体失败组件
      # actuator 端点应通过网关或 NetworkPolicy 限制为内网访问，不暴露公网
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
  metrics:
    tags:
      env: ${spring.profiles.active}

logging:
  level:
    root: INFO
    com.njydsz.pmis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"
  file:
    name: /var/log/pmis/common

# ------------------------------------------------------------
# 轻量规则引擎（ydsz-pmis-literule）共享配置
# PROD 阶段：仅启用热加载和统计，关闭自动注册（规则以 DB 为准）与 dry-run
# ------------------------------------------------------------
pmis:
  literule:
    auto-register-builtin-rules: false
    hot-reload-enabled: true
    stats-enabled: true
    dry-run-enabled: false