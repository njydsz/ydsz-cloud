# ============================================================
# 公共基础配置：pmis-common-PROD
# DataId  : pmis-common-prod.yaml
# Group   : PMIS_GROUP_PROD
# Namespace: pmis
# 环境     : 生产（线上真实数据）
# 用途     : 各微服务共享的 DB / Redis / MyBatis-Plus / Logging 配置
# ============================================================

spring:
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_NULL
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?useUnicode=true&characterEncoding=utf8&currentSchema=public
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    druid:
      # H7 修复：连接池从 80 收敛到 30，避免单服务耗尽 PG max_connections
      # 9 个微服务 × 80 = 720 连接，已逼近 PG 默认 max_connections=1000
      # 收敛后 9 × 30 = 270，给运维与突发负载留出充足余量
      initial-size: 10
      min-idle: 10
      max-active: 30
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      filters: stat,wall,slf4j
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 5s
  cloud:
    openfeign:
      client:
        config:
          default:
            # C14 修复：与 dev 对齐，统一 Feign 超时
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: BASIC

# C14 修复：启用 Sentinel 熔断降级
feign:
  sentinel:
    enabled: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
  metrics:
    tags:
      env: ${spring.profiles.active}

logging:
  level:
    root: INFO
    com.njydsz.pmis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"
  file:
    name: /var/log/pmis/common

# ------------------------------------------------------------
# 轻量规则引擎（ydsz-pmis-literule）共享配置
# PROD 阶段：仅启用热加载和统计，关闭自动注册（规则以 DB 为准）与 dry-run
# ------------------------------------------------------------
pmis:
  literule:
    auto-register-builtin-rules: false
    hot-reload-enabled: true
    stats-enabled: true
    dry-run-enabled: false