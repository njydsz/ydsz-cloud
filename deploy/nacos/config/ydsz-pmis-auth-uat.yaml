# ============================================================
# Nacos 配置：ydsz-pmis-auth-uat
# DataId  : ydsz-pmis-auth-uat.yaml
# Group   : PMIS_GROUP_UAT
# Namespace: pmis
# 环境     : UAT（用户验收测试 / 生产仿真）
# ============================================================

server:
  port: 9001
  compression:
    enabled: true
  servlet:
    context-path: /

spring:
  application:
    name: ydsz-pmis-auth
  profiles:
    active: uat
  main:
    web-application-type: servlet
    banner-mode: log
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_NULL
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE:pmis}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:pmis}
        group: uat
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        refresh-enabled: true
        extension-configs:
          - dataId: ydsz-pmis-common-uat.yaml
            group: uat
            refresh: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?useUnicode=true&characterEncoding=utf8&currentSchema=public
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 40
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      filters: stat,wall,slf4j
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 5s
  cache:
    type: redis
    redis:
      time-to-live: 30m
      cache-null-values: false
      key-prefix: "pmis:auth:"
      use-key-prefix: true

pmis:
  jwt:
    secret: ${PMIS_JWT_SECRET}
    issuer: pmis
    access-ttl-seconds: ${PMIS_JWT_ACCESS_TTL:7200}
    refresh-ttl-seconds: ${PMIS_JWT_REFRESH_TTL:604800}
  captcha:
    enabled: true
    ttl-seconds: 300
    length: 4
  login:
    max-failures: 5
    lock-minutes: 30
    two-factor-required: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.pmis.auth.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${spring.profiles.active}

logging:
  level:
    root: INFO
    com.njydsz.pmis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"
  file:
    name: /var/log/pmis/auth
