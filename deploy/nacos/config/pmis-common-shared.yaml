# =====================================================================
#  PMIS 共享配置（通过 Nacos config shared-configs 引入）
#  ---------------------------------------------------------------------
#  所有微服务共享的 datasource / redis / mybatis-plus / springdoc / logging 配置。
#  各服务仅需在自身 application.yml 中保留 server.port / spring.application.name
#  和服务特有配置（如 pmis.jwt），公共配置通过 Nacos shared-configs 引入。
#
#  Nacos DataId: pmis-common-shared.yaml
#  Group: PMIS_GROUP_{ENV}
# =====================================================================

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?useUnicode=true&characterEncoding=utf8
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 3000ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    # H3.3 修复：显式关闭 banner，避免仅引用 shared 配置的服务启动时打印 MyBatis-Plus Banner
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: AUTO
  mapper-locations: classpath*:mapper/**/*.xml

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.njydsz.pmis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"
