# ============================================================
# Nacos 配置：ydsz-pmis-gateway-prod
# DataId  : ydsz-pmis-gateway-prod.yaml
# Group   : PMIS_GROUP_PROD
# Namespace: pmis
# 环境     : PROD（生产环境）
# 用途     : 该文件可直接导入 Nacos 配置中心
# 规范     : 互联网大厂标准 - 环境隔离 / 配置外置 / 密钥不入库 / 性能优先
# ============================================================

server:
  port: 9000
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    level: BEST_SPEED
  forward-headers-strategy: framework
  netty:
    access-log: enabled

spring:
  application:
    name: ydsz-pmis-gateway
  profiles:
    active: prod
  main:
    web-application-type: reactive
    banner-mode: off
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE:pmis}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        watch:
          enabled: true
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
        ip-delete-timeout: 30000
        fail-fast: true
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:pmis}
        group: prod
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        refresh-enabled: true
        fail-fast: true
        extension-configs:
          - dataId: ydsz-pmis-common-prod.yaml
            group: prod
            refresh: true
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "https://pmis.example.com"
            allowedMethods: GET,POST,PUT,DELETE,OPTIONS,PATCH
            allowedHeaders: "*"
            exposedHeaders:
              - Authorization
              - X-Trace-Id
              - Content-Disposition
            allowCredentials: true
            maxAge: 7200
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        - StripPrefix=1
      httpclient:
        websocket:
          max-frame-payload-length: 65536
        connect-timeout: 2000
        response-timeout: 10s
        pool:
          type: elastic
          max-idle-time: 15s
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD}
        port: ${SENTINEL_TRANSPORT_PORT:8719}
        heartbeat-interval-ms: 5000
      eager: true
      filter:
        enabled: true
      scg:
        fallback:
          mode: response
          response-status: 429
          response-body: '{"code":429,"message":"请求频率超限，请稍后再试","traceId":"${X-Trace-Id}"}'

feign:
  sentinel:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 10000
        loggerLevel: NONE
  compression:
    request:
      enabled: true
      mime-types: application/json
      min-request-size: 1024
    response:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${spring.profiles.active}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
      percentiles:
        http:
          server:
            requests: 0.5,0.75,0.9,0.95,0.99

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.njydsz.pmis: INFO
    org.springframework.cloud.gateway: WARN
    reactor.netty: ERROR
    io.netty: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"
  file:
    name: /var/log/pmis/gateway
