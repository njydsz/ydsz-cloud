# ============================================================
# Nacos 配置：ydsz-pmis-scheduler-dev
# DataId  : ydsz-pmis-scheduler-dev.yaml
# Group   : PMIS_GROUP_DEV
# Namespace: pmis
# 环境     : DEV（本地开发联调）
# ============================================================

server:
  port: 9012
  compression:
    enabled: true
  servlet:
    context-path: /

spring:
  application:
    name: ydsz-pmis-scheduler
  profiles:
    active: dev
  main:
    web-application-type: servlet
    banner-mode: console
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_NULL
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:pmis}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:pmis}
        group: dev
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        refresh-enabled: true
        extension-configs:
          - dataId: ydsz-pmis-common-dev.yaml
            group: dev
            refresh: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?useUnicode=true&characterEncoding=utf8&currentSchema=public
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 10
      max-wait: 60000
      validation-query: SELECT 1
      filters: stat,slf4j
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:pmis@2026}
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

# XXL-Job 配置
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN:http://127.0.0.1:9100/xxl-job-admin}
      access-token: ${XXL_JOB_ACCESS_TOKEN:pmis-xxl-token}
    executor:
      appname: pmis-scheduler
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      ip: ${XXL_JOB_EXECUTOR_IP:}
      port: ${XXL_JOB_EXECUTOR_PORT:9999}
      logpath: /var/log/pmis/xxl-job
      logretentiondays: 30
    access-token: ${XXL_JOB_ACCESS_TOKEN:pmis-xxl-token}

pmis:
  scheduler:
    enabled: true
    reconcile-job-cron: "0 0 2 * * ?"
    evm-snapshot-cron: "0 0 1 * * ?"
    alert-scan-cron: "0 */5 * * * ?"
    report-subscription-cron: "0 0 8 * * ?"
    billable-util-snapshot-cron: "0 30 1 * * ?"
    consistency-check-cron: "0 0 3 * * ?"

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.pmis.scheduler.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.njydsz.pmis: DEBUG
    com.xxl.job: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"
  file:
    name: /var/log/pmis/scheduler
