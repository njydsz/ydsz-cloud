# ============================================================
# 公共基础配置：pmis-common-DEV
# DataId  : pmis-common-dev.yaml
# Group   : PMIS_GROUP_DEV
# Namespace: pmis
# 环境     : 开发（本地开发联调）
# 用途     : 各微服务共享的 DB / Redis / MyBatis-Plus / Logging 配置
# ============================================================

spring:
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_NULL
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?useUnicode=true&characterEncoding=utf8&currentSchema=public
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      filters: stat,wall,slf4j
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3s

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
  metrics:
    tags:
      env: ${spring.profiles.active}

logging:
  level:
    root: INFO
    com.njydsz.pmis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"

# ------------------------------------------------------------
# 轻量规则引擎（ydsz-pmis-literule）共享配置
# 由 execution / project / agent 等消费方通过 common 配置继承
# ------------------------------------------------------------
pmis:
  literule:
    # 是否启用自动注册内置规则
    auto-register-builtin-rules: true
    # 是否启用热加载（监听 RuleConfigRefreshEvent）
    hot-reload-enabled: true
    # 是否启用执行统计（命中率/耗时）
    stats-enabled: true
    # 是否启用 dry-run 仿真（不改业务结果，仅打点）
    dry-run-enabled: true