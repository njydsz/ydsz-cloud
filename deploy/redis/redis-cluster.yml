# =====================================================================
#  PMIS Redis 7 集群 Docker Compose 编排（批次 19）
# ---------------------------------------------------------------------
#  拓扑：3 主 + 3 从 (cluster_replicas=1)
#  端口：
#  - 6379  客户端
#  - 16379 集群总线（Gossip）
#  - 9100  Redis Exporter
#  持久化：AOF + RDB 双开
#  容量：8GB / 节点（maxmemory 6GB 留 25% 给 fork）
# =====================================================================

version: "3.8"

x-redis-common: &redis-common
  image: redis:7.2.4-alpine
  restart: always
  command: >
    redis-server
    --cluster-enabled yes
    --cluster-config-file nodes.conf
    --cluster-node-timeout 5000
    --appendonly yes
    --appendfsync everysec
    --auto-aof-rewrite-min-size 64mb
    --auto-aof-rewrite-percentage 100
    --maxmemory 6gb
    --maxmemory-policy allkeys-lru
    --save "900 1"
    --save "300 10"
    --save "60 10000"
    --tcp-keepalive 60
    --timeout 0
    --tcp-backlog 511
    --databases 16
    --hz 10
    --dynamic-hz yes
    --protected-mode yes
    --requirepass ${REDIS_PASSWORD:-pmisRedis2026}
    --masterauth ${REDIS_PASSWORD:-pmisRedis2026}
    --slowlog-log-slower-than 10000
    --slowlog-max-len 128
    --latency-monitor-threshold 100
    --loglevel notice
    --io-threads 4
    --io-threads-do-reads yes
  sysctls:
    - net.core.somaxconn=65535
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  healthcheck:
    test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-pmisRedis2026}", "ping"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "100m"
      max-file: "5"

networks:
  pmis-net:
    external: true
    name: pmis-net

volumes:
  redis-1-data: {}
  redis-2-data: {}
  redis-3-data: {}
  redis-4-data: {}
  redis-5-data: {}
  redis-6-data: {}

services:
  redis-1:
    <<: *redis-common
    container_name: pmis-redis-1
    hostname: redis-1
    ports:
      - "6379:6379"
      - "16379:16379"
    volumes:
      - redis-1-data:/data
    networks:
      - pmis-net
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G

  redis-2:
    <<: *redis-common
    container_name: pmis-redis-2
    hostname: redis-2
    ports:
      - "6380:6379"
      - "16380:16379"
    volumes:
      - redis-2-data:/data
    networks:
      - pmis-net
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G

  redis-3:
    <<: *redis-common
    container_name: pmis-redis-3
    hostname: redis-3
    ports:
      - "6381:6379"
      - "16381:16379"
    volumes:
      - redis-3-data:/data
    networks:
      - pmis-net
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G

  redis-4:
    <<: *redis-common
    container_name: pmis-redis-4
    hostname: redis-4
    ports:
      - "6382:6379"
      - "16382:16379"
    volumes:
      - redis-4-data:/data
    networks:
      - pmis-net
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G

  redis-5:
    <<: *redis-common
    container_name: pmis-redis-5
    hostname: redis-5
    ports:
      - "6383:6379"
      - "16383:16379"
    volumes:
      - redis-5-data:/data
    networks:
      - pmis-net
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G

  redis-6:
    <<: *redis-common
    container_name: pmis-redis-6
    hostname: redis-6
    ports:
      - "6384:6379"
      - "16384:16379"
    volumes:
      - redis-6-data:/data
    networks:
      - pmis-net
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G

  # -------- Redis 集群初始化（一次性任务） --------
  redis-cluster-init:
    image: redis:7.2.4-alpine
    container_name: pmis-redis-cluster-init
    depends_on:
      - redis-1
      - redis-2
      - redis-3
      - redis-4
      - redis-5
      - redis-6
    networks:
      - pmis-net
    restart: "no"
    entrypoint: >
      sh -c "
        echo 'Waiting for Redis nodes...' &&
        sleep 15 &&
        echo 'yes' | redis-cli --cluster create
          redis-1:6379 redis-2:6379 redis-3:6379
          redis-4:6379 redis-5:6379 redis-6:6379
          --cluster-replicas 1
          --cluster-yes
          -a $${REDIS_PASSWORD:-pmisRedis2026} &&
        echo 'Cluster created successfully' &&
        redis-cli -h redis-1 -p 6379 -a $${REDIS_PASSWORD:-pmisRedis2026} cluster info &&
        redis-cli -h redis-1 -p 6379 -a $${REDIS_PASSWORD:-pmisRedis2026} cluster nodes
      "
    environment:
      - REDIS_PASSWORD=pmisRedis2026

  # -------- Redis Exporter（Prometheus 监控） --------
  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: pmis-redis-exporter
    restart: always
    environment:
      - REDIS_ADDR=redis://redis-1:6379
      - REDIS_PASSWORD=pmisRedis2026
    ports:
      - "9121:9121"
    networks:
      - pmis-net
    depends_on:
      - redis-1

  # -------- RedisInsight（Web UI） --------
  redisinsight:
    image: redislabs/redisinsight:2.2
    container_name: pmis-redisinsight
    restart: always
    ports:
      - "8001:8001"
    networks:
      - pmis-net
