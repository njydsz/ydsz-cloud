# PMIS 业务事务分组（Seata AT 模式）
# --------------------------------------------------------------------------
# 部署：将本文件上传到 Nacos 配置中心，data-id = seata-client.properties
# 客户端依赖：seata-spring-boot-starter 2.0.0
# --------------------------------------------------------------------------

# === 事务分组映射（client 端）===
service.vgroupMapping.pmis-tx-group=default
service.default.grouplist=127.0.0.1:8091
service.enableDegrade=false
service.disableGlobalTransaction=false

# === 客户端配置 ===
client.undo.data.validation=true
client.undo.compression.type=zip
client.undo.compression.threshold=64k
client.log.exceptionRate=100
client.tm.commit.retry.count=5
client.tm.rollback.retry.count=5
client.tm.default.global.transaction.timeout=60000

# === 日志配置 ===
log.level=info
log.exceptionRate=100
