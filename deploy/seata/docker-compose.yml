# PMIS Seata Server 部署（AT 模式）
# --------------------------------------------------------------------------
# 启动：docker-compose -f deploy/seata/docker-compose.yml up -d
# 默认端口：8091（HTTP）/ 7091（Admin）
# --------------------------------------------------------------------------

version: '3.8'

services:
  seata-server:
    image: apache/seata-server:2.0.0
    container_name: pmis-seata
    hostname: seata-server
    restart: always
    ports:
      - "8091:8091"    # HTTP 端口
      - "7091:7091"    # Admin 端口
    environment:
      - SEATA_PORT=8091
      - SEATA_IP=seata-server
      # 存储模式：file（单机）/ db（高可用，本项目推荐）
      - STORE_MODE=db
      # Nacos 注册中心
      - SEATA_CONFIG_NAME=file:/root/seata-config/registry
      - NACOS_SERVER_ADDR=127.0.0.1:8848
      - NACOS_NAMESPACE=pmis
      - NACOS_GROUP=SEATA_GROUP
    volumes:
      - ./seata-config:/root/seata-config
      - seata-logs:/root/logs/seata
    networks:
      - pmis-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7091/api/v1/server/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  seata-logs:

networks:
  pmis-net:
    external: true
    name: pmis-net
