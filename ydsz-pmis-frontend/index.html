<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="PMIS Operations Management System" />
    <!--
      Content-Security-Policy 兜底(网关层会注入更严格的 CSP 头,此 meta 仅在开发环境直连时生效)
      - script-src: unsafe-inline(Vue 模板) + unsafe-eval(开发环境 HMR) + unpkg/jsdelivr(P2-6 CDN 外置)
      - style-src: unsafe-inline(Element Plus 样式注入) + unpkg/jsdelivr(P2-6 CDN 样式)
      - connect-src: ws/wss(Vite HMR + WebSocket) + https(API)
    -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" />
    <title>PMIS</title>
    <!--
      P2-6: CDN 加载失败兜底检测
      必须在 CDN script 之前执行（inline 同步脚本），才能在捕获阶段监听到后续 CDN <script> 的加载错误。
      生产环境如发生 CDN 不可达，此处会输出错误日志，便于排查（如需自动切换本地资源可在此扩展）。
    -->
    <script>
      window.addEventListener('error', function (e) {
        var t = e.target || e.srcElement
        if (
          t &&
          t.tagName === 'SCRIPT' &&
          t.src &&
          (t.src.indexOf('unpkg.com') > -1 || t.src.indexOf('cdn.jsdelivr.net') > -1)
        ) {
          console.error('[CDN] 加载失败:', t.src, '，请检查网络连接')
        }
      }, true)
    </script>
    <!-- P2-6: 生产环境由 vite transformIndexHtml 注入 CDN <script>/<link>；开发环境留空，仍走 node_modules -->
    <!-- CDN_INJECT -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
