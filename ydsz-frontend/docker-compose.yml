version: '3.8'

services:
  # ==================== Frontend (Nginx) ====================
  ydsz-frontend:
    build:
      context: .
      dockerfile: bash/deploy/Dockerfile
    container_name: ydsz-frontend
    ports:
      - "5600:8080"
    depends_on:
      - gateway
    networks:
      - ydsz-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==================== Backend Gateway ====================
  gateway:
    image: ydsz-pmis/gateway:latest
    container_name: ydsz-gateway
    ports:
      - "9000:9000"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - ydsz-net
    restart: unless-stopped

  # ==================== Userinfo Service ====================
  userinfo:
    image: ydsz-pmis/userinfo:latest
    container_name: ydsz-userinfo
    ports:
      - "9001:9001"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - ydsz-net
    restart: unless-stopped

  # ==================== System Service ====================
  system:
    image: ydsz-pmis/system:latest
    container_name: ydsz-system
    ports:
      - "9002:9002"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - ydsz-net
    restart: unless-stopped

  # ==================== Project Service ====================
  project:
    image: ydsz-pmis/project:latest
    container_name: ydsz-project
    ports:
      - "9003:9003"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - ydsz-net
    restart: unless-stopped

  # ==================== Message Service ====================
  message:
    image: ydsz-pmis/message:latest
    container_name: ydsz-message
    ports:
      - "9004:9004"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - ydsz-net
    restart: unless-stopped

  # ==================== Cronjob Service ====================
  cronjob:
    image: ydsz-pmis/cronjob:latest
    container_name: ydsz-cronjob
    ports:
      - "9005:9005"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - ydsz-net
    restart: unless-stopped

  # ==================== Workflow Service ====================
  workflow:
    image: ydsz-pmis/workflow:latest
    container_name: ydsz-workflow
    ports:
      - "9006:9006"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - ydsz-net
    restart: unless-stopped

  # ==================== Nextwiki Service ====================
  nextwiki:
    image: ydsz-pmis/nextwiki:latest
    container_name: ydsz-nextwiki
    ports:
      - "9007:9007"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - ydsz-net
    restart: unless-stopped

  # ==================== LiteRule Service ====================
  literule:
    image: ydsz-pmis/literule:latest
    container_name: ydsz-literule
    ports:
      - "9008:9008"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - ydsz-net
    restart: unless-stopped

  # ==================== Agent Service ====================
  agent:
    image: ydsz-pmis/agent:latest
    container_name: ydsz-agent
    ports:
      - "9010:9010"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - ydsz-net
    restart: unless-stopped

networks:
  ydsz-net:
    driver: bridge
    name: ydsz-network
