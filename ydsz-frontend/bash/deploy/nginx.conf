worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  types {
    application/javascript  js mjs;
    text/css                css;
    text/html               html;
    application/json        json;
    application/wasm        wasm;
    image/svg+xml           svg;
  }

  # Logging
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rt=$request_time uct="$upstream_connect_time" '
                  'uht="$upstream_header_time" urt="$upstream_response_time"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;
  client_max_body_size 100m;

  # Gzip 压缩
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/json
             application/javascript application/xml+rss
             application/x-javascript text/javascript
             image/svg+xml application/wasm;
  gzip_disable "msie6";

  # 静态预压缩优先（构建产物 .gz/ .br）
  gzip_static on;
  brotli_static on;

  # Content-Security-Policy (report-only)
  add_header Content-Security-Policy-Report-Only
    "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https:;" always;

  # ==================== Upstream: Backend Gateway ====================
  upstream backend_gateway {
    server gateway:9000;
    keepalive 32;
  }

  # ==================== Main App ====================
  server {
    listen 8080;
    server_name _;

    # Main app — lite-kernel micro-frontend host
    location / {
      root /usr/share/nginx/html/main;
      try_files $uri $uri/ /index.html;
      index index.html;

      # SPA history fallback
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";
    }

    # ==================== API Proxy ====================
    location /api/ {
      proxy_pass http://backend_gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_connect_timeout 30s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
      proxy_buffering off;
    }

    # ==================== WebSocket Proxy ====================
    location /ws/ {
      proxy_pass http://backend_gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    # ==================== Sub-App Static Assets ====================
    # Each sub-app is served from its own directory under /usr/share/nginx/html/

    location /ydsz-userinfo-web/ {
      alias /usr/share/nginx/html/ydsz-userinfo-web/;
      try_files $uri $uri/ /ydsz-userinfo-web/index.html;
      add_header Access-Control-Allow-Origin *;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /ydsz-system-web/ {
      alias /usr/share/nginx/html/ydsz-system-web/;
      try_files $uri $uri/ /ydsz-system-web/index.html;
      add_header Access-Control-Allow-Origin *;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /ydsz-project-web/ {
      alias /usr/share/nginx/html/ydsz-project-web/;
      try_files $uri $uri/ /ydsz-project-web/index.html;
      add_header Access-Control-Allow-Origin *;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /ydsz-message-web/ {
      alias /usr/share/nginx/html/ydsz-message-web/;
      try_files $uri $uri/ /ydsz-message-web/index.html;
      add_header Access-Control-Allow-Origin *;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /ydsz-cronjob-web/ {
      alias /usr/share/nginx/html/ydsz-cronjob-web/;
      try_files $uri $uri/ /ydsz-cronjob-web/index.html;
      add_header Access-Control-Allow-Origin *;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /ydsz-workflow-web/ {
      alias /usr/share/nginx/html/ydsz-workflow-web/;
      try_files $uri $uri/ /ydsz-workflow-web/index.html;
      add_header Access-Control-Allow-Origin *;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /ydsz-nextwiki-web/ {
      alias /usr/share/nginx/html/ydsz-nextwiki-web/;
      try_files $uri $uri/ /ydsz-nextwiki-web/index.html;
      add_header Access-Control-Allow-Origin *;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /ydsz-literule-web/ {
      alias /usr/share/nginx/html/ydsz-literule-web/;
      try_files $uri $uri/ /ydsz-literule-web/index.html;
      add_header Access-Control-Allow-Origin *;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /ydsz-agent-web/ {
      alias /usr/share/nginx/html/ydsz-agent-web/;
      try_files $uri $uri/ /ydsz-agent-web/index.html;
      add_header Access-Control-Allow-Origin *;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ==================== Static Asset Caching ====================
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|wasm)$ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header Access-Control-Allow-Origin *;
    }

    # ==================== Health Check ====================
    location /health {
      access_log off;
      return 200 '{"status":"UP","app":"ydsz-frontend"}';
      add_header Content-Type application/json;
    }

    # ==================== Error Pages ====================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html/main;
    }
  }
}
