worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  types {
    application/javascript  js mjs;
    text/css                css;
    text/html               html;
    application/json        json;
    application/wasm        wasm;
    image/svg+xml           svg;
  }

  # Logging
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rt=$request_time uct="$upstream_connect_time" '
                  'uht="$upstream_header_time" urt="$upstream_response_time"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;
  client_max_body_size 100m;

  # Brotli 压缩（优先级高于 Gzip）
  brotli on;
  brotli_comp_level 6;
  brotli_min_length 1024;
  brotli_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               application/x-javascript text/javascript
               image/svg+xml application/wasm;

  # Gzip 压缩（Brotli 不支持时的降级方案）
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/json
             application/javascript application/xml+rss
             application/x-javascript text/javascript
             image/svg+xml application/wasm;
  gzip_disable "msie6";

  # 静态预压缩优先（构建产物 .gz/ .br）
  gzip_static on;
  brotli_static on;

  # ==================== Security Headers ====================
  # Content-Security-Policy (v3.4: 收紧 unsafe-eval，改用 strict-dynamic)
  # - 移除 'unsafe-eval'：ESM 模块生产构建无需 eval（开发模式由 Vite 处理）
  # - 'strict-dynamic'：信任主应用加载的带 hash 模块，允许其动态加载子模块
  # - 保留 'unsafe-inline' 仅作为 style-src 的回退（Element Plus 动态样式注入需要）
  # - importmap 外部化的 vendor 在 self 域内，不受影响
  add_header Content-Security-Policy
    "default-src 'self'; script-src 'self' 'strict-dynamic'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none';" always;

  # CSRF Protection Headers
  add_header X-CSRF-Token "" always;
  add_header X-CSRF-Header "X-Requested-With" always;

  # Clickjacking Protection
  add_header X-Frame-Options "SAMEORIGIN" always;

  # MIME Sniffing Protection
  add_header X-Content-Type-Options "nosniff" always;

  # XSS Protection (legacy browsers)
  add_header X-XSS-Protection "1; mode=block" always;

  # Referrer Policy
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Permissions Policy (Feature Policy)
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

  # HSTS (HTTP Strict Transport Security)
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # ==================== Upstream: Backend Gateway ====================
  upstream backend_gateway {
    server gateway:9000;
    keepalive 32;
  }

  # ==================== Main App ====================
  server {
    listen 8080;
    server_name _;

    # Main app — micro-kernel micro-frontend host
    location / {
      root /usr/share/nginx/html/main;
      try_files $uri $uri/ /index.html;
      index index.html;

      # SPA history fallback
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";
    }

    # ==================== API Proxy ====================
    location /api/ {
      proxy_pass http://backend_gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_connect_timeout 30s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
      proxy_buffering off;
    }

    # ==================== WebSocket Proxy ====================
    location /ws/ {
      proxy_pass http://backend_gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    # ==================== Sub-App Static Assets ====================
    # Each sub-app is served from its own directory under /usr/share/nginx/html/
    # location 片段由 bash/gen-nginx-conf.mjs 从 MICRO_APPS 自动生成，请勿手动修改。
    # 新增子应用后运行: pnpm run gen:nginx
    include /etc/nginx/nginx-sub-apps.conf;

    # ==================== Static Asset Caching ====================
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|wasm)$ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header Access-Control-Allow-Origin *;
      
      # CDN 缓存头
      add_header X-CDN-Cache "HIT";
      add_header CDN-Cache-Status "HIT";
      
      # 预压缩文件优先
      gzip_static on;
      brotli_static on;
    }
    
    # 图片资源特殊处理（更长缓存）
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp)$ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header Access-Control-Allow-Origin *;
      add_header X-CDN-Cache "HIT";
    }

    # ==================== Health Check ====================
    # 浅探针：nginx 静态返回，验证 Pod 本身存活（livenessProbe 用）
    location /health {
      access_log off;
      return 200 '{"status":"UP","app":"ydsz-frontend"}';
      add_header Content-Type application/json;
    }

    # 深探针：代理到后端网关健康检查，验证全链路连通性（readinessProbe 用）
    # 后端不可达时返回 502，K8s 不会将流量导入此 Pod，避免前端 502 级联故障
    location /health/deep {
      access_log off;
      proxy_pass http://backend_gateway/actuator/health;
      proxy_http_version 1.1;
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
      proxy_set_header Host $host;
      proxy_set_header X-Health-Check "deep";
    }

    # ==================== Error Pages ====================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html/main;
    }
  }
}
