apiVersion: apps/v1
kind: Deployment
metadata:
  name: ydsz-frontend
  labels:
    app: ydsz-frontend
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ydsz-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ydsz-frontend
        component: web
    spec:
      # E6: 跨节点反亲和，确保 Pod 分散到不同节点，提升可用性
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ydsz-frontend
      containers:
        - name: frontend
          image: registry.cn-hangzhou.aliyuncs.com/ydsz-pmis/frontend:latest
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            # E6: nginx 静态资源服务基线很低，但 brotli/gzip 压缩需要突发 CPU
            #     收窄 request→limit 间距（2-3x），使 HPA 扩缩容更可预测
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          # 启动探针：nginx 启动很快（<2s），用短间隔快速放行流量
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 2
            failureThreshold: 10
            timeoutSeconds: 2
          # 浅探针：nginx 静态返回，验证 Pod 存活
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          # 深探针：检查后端网关连通性，确保前端能真正服务
          readinessProbe:
            httpGet:
              path: /health/deep
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "nginx -s quit && sleep 5"
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ydsz-frontend
  labels:
    app: ydsz-frontend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: ydsz-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ydsz-frontend
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "ydsz-frontend"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - pmis.ydsz.cn
      secretName: ydsz-tls-secret
  rules:
    - host: pmis.ydsz.cn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ydsz-frontend
                port:
                  number: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ydsz-frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ydsz-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
