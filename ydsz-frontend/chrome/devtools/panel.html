<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:12px;color:#303133;background:#fafbfc}
  .hdr{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:linear-gradient(135deg,#409eff 0%,#1677ff 100%);color:#fff;font-weight:600;font-size:13px}
  .hdr small{font-weight:400;opacity:.8;font-size:11px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid #ebeef5;background:#fff}
  .stat{padding:10px 8px;text-align:center;border-right:1px solid #ebeef5}
  .stat:last-child{border-right:none}
  .sv{font-size:20px;font-weight:700;color:#303133}
  .sl{color:#909399;font-size:10px;margin-top:2px;text-transform:uppercase;letter-spacing:.3px}
  .sec{padding:10px 12px;border-bottom:1px solid #ebeef5;background:#fff}
  .sec+.sec{border-top:4px solid #f5f7fa}
  .st{font-weight:600;color:#606266;margin-bottom:8px;font-size:11px;display:flex;align-items:center;gap:6px}
  .st::before{content:'';width:3px;height:12px;background:#409eff;border-radius:2px}
  .ar{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f2f3f5;transition:background .12s}
  .ar:last-child{border-bottom:none}
  .ar:hover{background:#f5f7fa}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .dot.MOUNTED{background:#52c41a;box-shadow:0 0 4px #52c41a}
  .dot.LOADING{background:#faad14;animation:pulse 1s infinite}
  .dot.LOADED{background:#1677ff}
  .dot.UNMOUNTED{background:#d9d9d9}
  .dot.NOT_LOADED{background:#f0f0f0}
  .dot.ERROR{background:#ff4d4f}
  .an{flex:1;font-weight:500;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .as{font-size:11px;color:#909399;min-width:70px;text-align:center;padding:2px 4px;background:#f5f7fa;border-radius:3px}
  .sandbox{font-size:10px;color:#8c8c8c;min-width:52px;text-align:center}
  .act{padding:3px 8px;font-size:11px;cursor:pointer;border:1px solid #d9d9d9;border-radius:4px;background:#fff;transition:all .15s}
  .act:hover{border-color:#1677ff;color:#1677ff}
  .act.danger:hover{border-color:#ff4d4f;color:#ff4d4f}
  .act.primary{background:#1677ff;color:#fff;border-color:#1677ff;opacity:.9}
  .act.primary:hover{opacity:1}
  .btns{display:flex;gap:8px;padding:10px 12px;background:#fafafa;border-top:1px solid #ebeef5;position:sticky;bottom:0}
  .b{flex:1;padding:6px 12px;cursor:pointer;border:1px solid #d9d9d9;border-radius:6px;background:#fff;font-size:12px;transition:all .15s;text-align:center}
  .b:hover{border-color:#1677ff;color:#1677ff}
  .b.warn:hover{border-color:#faad14;color:#faad14}
  .b.refresh{background:#1677ff;color:#fff;border-color:#1677ff}
  .b.refresh:hover{background:#096dd9}
  .log{padding:10px 12px;font-family:'SFMono-Regular',Consolas,monospace;font-size:11px;color:#595959;max-height:180px;overflow-y:auto;background:#fafafa;border-top:4px solid #f0f0f0}
  .le{padding:3px 0;border-bottom:1px dotted #e8e8e8;display:flex;gap:8px}
  .le:last-child{border-bottom:none}
  .le .ts{color:#bfbfbf;font-size:10px;min-width:60px}
  .le.err{color:#ff4d4f}
  .le.warn{color:#faad14}
  .le.info{color:#595959}
  .empty{text-align:center;padding:32px;color:#bfbfbf;font-size:12px}
  .health-badge{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
  .health-ok{background:#f6ffed;color:#52c41a;border:1px solid #b7eb8f}
  .health-warn{background:#fffbe6;color:#faad14;border:1px solid #ffe58f}
  .health-err{background:#fff2f0;color:#ff4d4f;border:1px solid #ffccc7}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .collapsible{cursor:pointer;user-select:none}
  .collapsible::after{content:'▾';margin-left:4px;font-size:10px;transition:transform .2s}
  .collapsible.collapsed::after{transform:rotate(-90deg)}
  .log.collapsed{display:none}
</style>
</head>
<body>
<div class="hdr">
  <span>🛠 Micro Kernel Inspector</span>
  <small id="kv">连接中...</small>
</div>

<div class="stats">
  <div class="stat"><div class="sv" id="sa">—</div><div class="sl">活跃</div></div>
  <div class="stat"><div class="sv" id="kl">0</div><div class="sl">KeepAlive</div></div>
  <div class="stat"><div class="sv" id="mem">—</div><div class="sl">内存</div></div>
  <div class="stat"><div class="sv" id="na">0</div><div class="sl">已注册</div></div>
</div>

<div class="sec">
  <div class="st">子应用状态 <span id="health-badge" class="health-badge health-warn" style="margin-left:auto">等待数据</span></div>
  <div id="al"><div class="empty">等待 micro-kernel 推送首次状态...</div></div>
</div>

<div class="sec">
  <div class="st collapsible" id="log-toggle">事件日志</div>
  <div class="log" id="elog"></div>
</div>

<div class="btns">
  <button class="b refresh" id="br">刷新</button>
  <button class="b warn" id="bc">清缓存</button>
  <button class="b" id="bh">健康检查</button>
</div>

<script src="panel.js"></script>
</body>
</html>
