  - id: "YDIZ-COMMON-003"
    category: "common-reuse"
    severity: "P0"
    title: "【强制】分布式事务禁止直接使用 Seata 原生 API"
    description: |
      禁止业务代码直接 import org.apache.seata.*（Seata 原生 API 定位为基础设施，不允许业务侧编译期依赖）。
      所有 Seata 分布式事务能力必须通过 com.njydsz.common.seata.* 包提供的封装访问：
      - 标注分布式事务：使用 @YdszGlobalTransactional 注解（位于 com.njydsz.common.seata.annotation）
      - 配置事务属性：使用 ydsz.seata.* 前缀（SeataProperties）
      - 运行时健康检查：通过 ydsz-common-seata 内置 SeataHealthIndicator
      反射调用 Seata RootContext 的代码仅允许出现在 ydsz-common-seata 模块内部。
    pattern: |
      以下情形构成违规：
      1. 业务代码或 ydsz-common-{非seata} 模块中直接 import org.apache.seata.*
      2. 使用 @GlobalTransactional（Seata 原生注解）替代 @YdszGlobalTransactional
      3. 在 Feign Interceptor 中直接调用 RootContext.getXID()（应使用 FeignXidRequestInterceptor）
    fix: |
      1. 替换 @GlobalTransactional → @YdszGlobalTransactional（在 ydzs-common-seata 中定义，通过元注解桥接）
      2. 移除 org.apache.seata.* 的 import
      3. 使用 ydzs-common-seata 提供的 FeignXidRequestInterceptor / XidServletFilter
    source: "编码规范 25.1 节"

  - id: "YDIZ-COMMON-004"
    category: "common-reuse"
    severity: "P0"
    title: "本地缓存必须通过 ydsz-common-cache"
    description: "禁止业务代码直接 new Caffeine 或 Guava Cache，必须通过 YdszCache.newBuilder() 创建。"
    pattern: "直接 import com.github.benmanes.caffeine 或 com.google.common.cache"
    fix: "使用 YdszCache.newBuilder() 或 Spring Cache @Cacheable"
    source: "编码规范 20.5 节、第 18 章"

  - id: "YDIZ-COMMON-005"
    category: "common-reuse"
    severity: "P0"
    title: "Sentry/监控指标必须通过 ydsz-common-sentry"
    description: "禁止业务模块直接注入 MeterRegistry 注册指标，禁止直接继承 AbstractModuleMetrics，所有指标上报必须通过 SentryObservation.count/time/gauge。"
    pattern: "直接注入 io.micrometer.core.instrument.MeterRegistry"
    fix: "使用 SentryObservation 统一入口"
    source: "编码规范 27/28 章"

  - id: "YDIZ-COMMON-006"
    category: "common-reuse"
    severity: "P1"
