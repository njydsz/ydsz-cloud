meta:
  version: "26.09.25"
  source: "docs/云顶编码规范.md v1.0.12"
  last_synced: "2026-09-19"
  last_updated: "2026-09-25（公共模块利用率修复：新增 YDIZ-COMMON-014~017 共 4 条 P1/P2 规则，消除 7 处业务模块自实现重复代码，Excel 导出接入 cronjob / message 模块）"
  total_rules: 96
  severity_levels:
    P0: "阻断级，AI 编码绝对违反"
    P1: "严重级，AI 编码不应违反，违反需人工确认"
    P2: "建议级，AI 编码建议遵循"

rules:
  # ============================================
  # 一、文件编码规范（1 条，P0）
  # ============================================
  - id: "YDIZ-CODE-001"
    category: "encoding"
    severity: "P0"
    title: "【强制】所有源文件必须使用 UTF-8（无 BOM）编码"
    description: |
      所有项目源文件（Java、XML、YAML、properties、Markdown、Python 等）必须使用 **UTF-8 无 BOM** 编码保存。

      **为什么禁止 BOM**：
      - BOM（Byte Order Mark，字节顺序标记）是 Unicode 文件开头的特殊标记字节（EF BB BF）
      - UTF-8 是字节顺序无关的编码，BOM 在 UTF-8 中不仅无用，还会导致许多工具链解析错误
      - Java 编译器（javac）不允许源文件以 BOM 开头，若有 BOM 会报 "illegal character: \ufeff" 错误
      - Shell 脚本、PHP、Python 等解释型语言的 shebang 行（#!...）被 BOM 破坏后无法执行
      - Maven/Gradle 构建、MyBatis XML 解析、YAML 配置解析均可能因 BOM 失败

      **项目现状**：
      - .editorconfig 已配置 charset = utf-8，但 Windows 环境下部分编辑器（VS、旧版 IntelliJ 新建文件模板）仍会默认追加 BOM
      - AI 编码工具（CatPaw、WorkBuddy 等）生成新文件时必须显式指定无 BOM 编码，禁止依赖系统默认编码
      - 中文 Windows 系统默认编码为 GBK，若未显式指定 UTF-8，保存的中文注释/字符串可能被错误编码

      **修复方式**：
      - IntelliJ：Settings → Editor → File Encodings → 勾选 "Transparent native-to-ascii conversion"，确保 "Project Encoding" 和 "Default encoding for properties files" 均为 UTF-8，且 "with BOM" 相关选项不勾选
      - VS Code：默认使用 UTF-8 无 BOM，确认 "files.encoding" 设置为 "utf8" 而非 "utf8bom"
    pattern: "文件开头 3 个字节为 EF BB BF（UTF-8 BOM 标记）"
    fix: |
      1. 使用编辑器重新保存为 UTF-8 无 BOM格式（IntelliJ: File → File Encoding → UTF-8 并选择 "Remove BOM"；VS Code: 右下角点击编码 → Save with Encoding → UTF-8（无 BOM））
      2. 批量修复可用命令：find . -name "*.java" -exec sed -i '1s/^\xEF\xBB\xBF//' {} \;
      3. AI 生成新文件时必须在文件创建后立即确认编码为 UTF-8 无 BOM
    example_bad: |
      ❌ 文件开头存在 BOM（不可见，但 hexdump 可看到 EF BB BF）
      hexdump -C File.java | head -1
      00000000  ef bb bf 70 61 63 6b 61  67 65  ...（BOM 字节）
    example_good: |
      ✅ 文件开头直接是有效字符
      hexdump -C File.java | head -1
      00000000  70 61 63 6b 61 67 65 20  63 6f 6d 2e ...（无 BOM）
    source: "编码规范 §1.1 字符编码与换行符 - 【强制】"

  # ============================================
  # 二、Import 导入规范（5 条，全部 P0）
  # ============================================
  - id: "YDIZ-IMPORT-001"
    category: "import"
    severity: "P0"
    title: "【强制】禁止行内全限定类名（FQN）"
    description: |
      所有类型引用必须通过文件顶部的 import 语句声明，严禁在代码体中使用全限定类名（Fully Qualified Name）。
      适用范围：所有 JDK 标准库（java.util、java.time、java.math、java.io、java.sql、java.nio 等）和第三方库。
      特殊说明：System.getProperty("java.io.tmpdir") 中字符串字面量内部的 "java.io" 不属于 FQN 规避范围，但字段、参数、方法体中的类型必须引用 import 后的简单名。
    pattern: "代码体中出现 java.xxx.Yyy、org.xxx.Yyy、com.xxx.Yyy 等全限定名（非 import 行、非字符串常量）"
    fix: "将 FQN 拆为顶部 import + 代码体使用简单名。import 放在 java.* 组，组内按字母序排列"
    example_bad: |
      // 违规：字段声明中使用 FQN
      private java.time.LocalDateTime createdAt;

      // 违规：方法参数中使用 FQN
      void banUser(String id, java.math.BigDecimal amount) { ... }

      // 违规：方法体中使用 FQN
      entity.setReadTime(java.time.LocalDateTime.now());
    example_good: |
      import java.math.BigDecimal;
      import java.time.LocalDateTime;

      // 正确：字段、参数、方法体均使用简单名
      private LocalDateTime createdAt;
      void banUser(String id, BigDecimal amount) { ... }
      entity.setReadTime(LocalDateTime.now());
    source: "编码规范 5.1 节 - 强制 | checkstyle.xml 2.2 节 RegexpSinglelineJava FQN 检测"

  - id: "YDIZ-IMPORT-002"
    category: "import"
    severity: "P0"
    title: "禁止通配符 import"
    description: "禁止使用 import xxx.* 通配符导入，每个类型必须显式 import。"
    pattern: "import 语句中出现 .*"
    fix: "拆分为具体类型的显式 import"
    example_bad: "import org.springframework.beans.factory.*;"
    example_good: "import org.springframework.beans.factory.BeanFactory;"
    source: "编码规范 5.2 节"

  - id: "YDIZ-IMPORT-003"
    category: "import"
    severity: "P0"
    title: "禁止未使用的 import"
    description: "禁止保留未使用的 import 语句。"
    pattern: "import 的类型在代码体中未被引用"
    fix: "删除未使用的 import"
    source: "编码规范 5.5 节"

  - id: "YDIZ-IMPORT-004"
    category: "import"
    severity: "P0"
    title: "禁止直接 import 第三方 JSON 库"
    description: "业务代码禁止直接 import Jackson/Fastjson/Gson/org.json，必须统一使用 ydsz-common-json（JsonUtils）。"
    pattern: "import com.fasterxml.jackson.* 或 import com.alibaba.fastjson2.*"
    fix: "使用 com.njydsz.common.json.JsonUtils 替代"
    source: "编码规范 22.3 节、20.5 节"

  - id: "YDIZ-IMPORT-005"
    category: "import"
    severity: "P0"
    title: "禁止业务模块直接 import Netty"
    description: "禁止直接 import io.netty.*，必须通过 ydsz-common-netty 或 ydsz-common-socket 封装。"
    pattern: "import io.netty.* 且模块非 common-netty/common-socket"
    fix: "使用 ydsz-common-netty 的 AbstractNettyServer/AbstractNettyClient"
    source: "编码规范 22.3 节、23.6 节"

  # ============================================
  # 三、命名规范（4 条）
  # ============================================
  - id: "YDIZ-NAME-001"
    category: "naming"
    severity: "P0"
    title: "entity 包下禁止使用 DO 后缀"
    description: "持久化实体类不允许使用 DO 后缀，直接使用业务名称命名。"
    pattern: "entity 包下类名以 DO 结尾"
    fix: "移除 DO 后缀，通过包路径区分角色"
    example_bad: "public class UserAccountDO { ... }"
    example_good: "public class UserAccount { ... }"
    source: "编码规范 2.4 节"

  - id: "YDIZ-NAME-002"
    category: "naming"
    severity: "P0"
    title: "数据库表名必须使用 ydsz_ 前缀"
    description: "所有业务模块的数据库表名必须以 ydsz_ 为前缀（ydsz-common 模块除外）。"
    pattern: "@TableName 注解值不以 ydsz_ 开头"
    fix: "改为 ydsz_ 前缀"
    example_bad: "@TableName(\"nw_file_node\")"
    example_good: "@TableName(\"ydsz_wiki_file_node\")"
    source: "编码规范 2.5 节"

  - id: "YDIZ-NAME-003"
    category: "naming"
    severity: "P1"
    title: "禁止中文拼音混合命名"
    description: "命名必须使用英文单词，禁止中文拼音、拼音首字母缩写。"
    pattern: "变量名或方法名包含拼音（如 yongHu、getPingJia）"
    fix: "使用对应英文含义命名"
    example_bad: "String getPingJiaByName();"
    example_good: "String getCommentByName();"
    source: "编码规范 2.1 节"

  - id: "YDIZ-NAME-004"
    category: "naming"
    severity: "P1"
    title: "禁止无意义命名"
    description: "命名必须'见名知意'，禁止 a、b、tmp、data、flag 等无意义命名。"
    pattern: "单字符变量名（除循环变量 i/j/k）或 tmp/tmpVar 等"
    fix: "使用有业务含义的命名"
    example_bad: "int d; boolean flag;"
    example_good: "int elapsedDays; boolean enabled;"
    source: "编码规范 2.1 节"

  # ============================================
  # 四、OOP 规约（6 条）
  # ============================================
  - id: "YDIZ-OOP-001"
    category: "oop"
    severity: "P0"
    title: "覆盖 equals 必须同时覆盖 hashCode"
    description: "覆盖 equals 方法时，必须同时覆盖 hashCode 方法。"
    pattern: "类中定义 equals 方法但未定义 hashCode 方法"
    fix: "同时实现 hashCode 方法"
    source: "编码规范 6.2 节"

  - id: "YDIZ-OOP-002"
    category: "oop"
    severity: "P0"
    title: "包装类比较必须使用 equals"
    description: "所有整形包装类对象之间值的比较，全部使用 equals 方法，禁止使用 ==。"
    pattern: "Integer/Long/Short/Byte 等包装类使用 == 比较"
    fix: "改用 equals() 方法"
    example_bad: "if (a == b) // Integer a, b"
    example_good: "if (a.equals(b))"
    source: "编码规范 6.2 节"

  - id: "YDIZ-OOP-003"
    category: "oop"
    severity: "P0"
    title: "禁止定义为 double/float 类型，一律使用 BigDecimal"
    description: "浮点数等值判断，基本类型不能用==，禁止定义为 double/float 类型，一律使用 BigDecimal。"
    pattern: "字段或局部变量声明为 double 或 float（JSON 序列化 DTO 除外）"
    fix: "改用 BigDecimal，使用字符串构造或 BigDecimal.valueOf()"
    example_bad: "double price = 19.99;"
    example_good: "BigDecimal price = new BigDecimal(\"19.99\");"
    source: "编码规范 6.3 节、6.4 节、6.6 节"

  - id: "YDIZ-OOP-005"
    category: "oop"
    severity: "P2"
    title: "覆写方法必须添加 @Override"
    description: "覆盖父类方法或实现接口方法时必须添加 @Override 注解。"
    pattern: "方法签名与父类/接口相同但缺少 @Override"
    fix: "添加 @Override 注解"
    source: "编码规范附录 D 第 17 项"

  - id: "YDIZ-OOP-006"
    category: "oop"
    severity: "P0"
    title: "【强制】布尔字段必须带 is 前缀"
    description: |
      数据库布尔字段和 Java 布尔字段映射**必须统一使用 `is_xxx` / `isXxx` 前缀**。
      此规则同时约束 Java 字段名和数据库列名。

      **强制命名规范**：
      - 数据库列名：`is_default`、`is_active`、`is_system`、`is_public`、`is_deleted`、`is_folder`
      - Java 字段名：`isDefault`、`isActive`、`isSystem`、`isPublic`、`isDeleted`、`isFolder`
      - Getter 方法：`getIsDefault()`、`getIsActive()` 等

      **禁止的命名**：
      不带 `is` 前缀的布尔字段（如 `default`、`active`、`deleted`）

      **`@ConfigurationProperties` 豁免**：
      标注 `@ConfigurationProperties` 的配置类中，布尔字段名直接作为 YAML 属性键对外暴露，
      重命名为 `isXxx` 将导致既有 application.yml 配置键失效（破坏向后兼容）。
      此类配置类允许保留原有布尔字段名（如 `automaticTrim`、`useFastReader`、`formulaInjectionProtection`），
      但须在 Javadoc 字段注释中标注 `<!-- OOP-006-EXEMPT: @ConfigurationProperties -->`。
      非 Spring Boot 绑定场景（非 @ConfigurationProperties 的纯 POJO / VO）不予豁免。
    pattern: "private Boolean deleted; 或 private Boolean default;"
    fix: "Java 字段改为 isXxx；数据库列改为 is_xxx"
    example_bad: |
      ❌ private Boolean default;         // 缺少 is 前缀
      ❌ private Boolean deleted;         // 缺少 is 前缀
    example_good: |
      ✅ private Boolean isDefault;       // 数据库列: is_default
      ✅ private Boolean isDeleted;       // 数据库列: is_deleted
      ✅ private Boolean isActive;        // 数据库列: is_active
      ✅ private Boolean isSystem;        // 数据库列: is_system
    source: "编码规范 6.5 节"

  # ============================================
  # 五、数据库命名规范（1 条，P0）
  # ============================================
  - id: "YDIZ-DB-001"
    category: "database"
    severity: "P0"
    title: "【强制】排序字段统一命名为 sort，禁用 sort_order"
    description: |
      数据库中表示"排序序号"的字段统一命名为 `sort`，Java 实体字段也命名为 `sort`。
      **禁止使用** `sort_order`（数据库）或 `sortOrder`（Java）命名。

      **适用范围**：所有业务表中的排序字段（升序排列用的整型序号）。
    pattern: "sort_order INTEGER 或 private Integer sortOrder;"
    fix: "将 sort_order 改为 sort（数据库列），sortOrder 改为 sort（Java 字段）"
    example_bad: |
      ❌ sort_order INT NOT NULL DEFAULT 0
      ❌ @TableField(\"sort_order\") private Integer sortOrder;
    example_good: |
      ✅ sort INT NOT NULL DEFAULT 0
      ✅ @TableField(\"sort\") private Integer sort;
    source: "编码规范 6.12 节"

  # ============================================
  # 六、异常与日志（3 条）
  # ============================================
  - id: "YDIZ-LOG-001"
    category: "logging"
    severity: "P0"
    title: "禁止空 catch 块（吞异常）"
    description: "禁止仅捕获异常不做任何处理。catch 块必须记录日志或抛出自定义异常。"
    pattern: "catch (Exception e) {} 或空 catch 块（仅注释无语句）"
    fix: "添加日志记录或异常转换"
    source: "编码规范 12 章"

  - id: "YDIZ-LOG-002"
    category: "logging"
    severity: "P0"
    title: "日志必须使用占位符 {}"
    description: "日志输出必须使用 {} 占位符，禁止字符串拼接。"
    pattern: "log.info/warn/error 中使用 + 拼接字符串变量"
    fix: "改用 {} 占位符"
    example_bad: "log.info(\"用户\" + userId + \"操作失败\");"
    example_good: "log.info(\"用户{}操作失败\", userId);"
    source: "编码规范 13 章、附录 D 第 14 项"

  - id: "YDIZ-LOG-003"
    category: "logging"
    severity: "P0"
    title: "禁止 System.out/err 和 printStackTrace"
    description: "禁止使用 System.out.println / System.err.println / e.printStackTrace()。"
    pattern: "System.out.println 或 System.err.println 或 printStackTrace"
    fix: "使用日志框架 SLF4J"
    source: "编码规范附录 D 第 15/16 项"

  # ============================================
  # 七、日期时间规范（2 条，P0）
  # ============================================
  - id: "YDIZ-DATE-001"
    category: "datetime"
    severity: "P0"
    title: "禁止 SimpleDateFormat 作为共享变量"
    description: "SimpleDateFormat 非线程安全，禁止作为静态字段或实例字段。"
    pattern: "private static final SimpleDateFormat"
    fix: "使用 DateTimeFormatter（线程安全）"
    example_bad: "private static final SimpleDateFormat SDF = new SimpleDateFormat(\"yyyy-MM-dd\");"
    example_good: "private static final DateTimeFormatter FMT = DateTimeFormatter.ofPattern(\"yyyy-MM-dd\");"
    source: "编码规范 7.1 节"

  - id: "YDIZ-DATE-002"
    category: "datetime"
    severity: "P0"
    title: "使用 Java 8+ 时间 API，禁止 Date/Calendar"
    description: "日期时间操作使用 java.time.* API，避免使用 java.util.Date / Calendar。"
    pattern: "字段或局部变量使用 java.util.Date 或 Calendar"
    fix: "改用 LocalDate/LocalDateTime/Instant"
    source: "编码规范 7.2 节"

  # ============================================
  # 八、集合与数据结构规范（2 条，P1+P0）
  # ============================================
  - id: "YDIZ-COLL-001"
    category: "collection"
    severity: "P1"
    title: "集合初始化必须指定初始容量"
    description: "集合初始化时必须指定初始容量（已知大小时）。"
    pattern: "new ArrayList<>() 或 new HashMap<>() 无初始容量参数"
    fix: "指定初始容量，如 new ArrayList<>(16)"
    source: "编码规范 9.1 节"

  - id: "YDIZ-COLL-002"
    category: "collection"
    severity: "P0"
    title: "方法返回集合禁止返回 null"
    description: "方法返回集合类型时，禁止返回 null，必须返回空集合。"
    pattern: "返回 List/Map/Set 的方法存在 return null 分支"
    fix: "改用 Collections.emptyList()/emptyMap()/emptySet()"
    source: "编码规范 9.2 节"

  # ============================================
  # 九、DDD 分层架构规范（7 条，6 条 P0 + 1 条 P1）
  # ============================================
  - id: "YDIZ-DDD-001"
    category: "ddd"
    severity: "P0"
    title: "依赖方向必须单向，禁止反向依赖"
    description: "web → server → domain ← infra，依赖方向必须单向，禁止反向依赖。"
    pattern: "domain 层依赖 infra 层 或 server 层依赖其他业务模块的 infra 层"
    fix: "通过接口反转依赖，Repository 接口定义在 domain 层"
    source: "编码规范 22.1 节、34.3 节"

  - id: "YDIZ-DDD-002"
    category: "ddd"
    severity: "P0"
    title: "Repository 必须返回 VO/DTO，禁止返回 Entity（PO）"
    description: "Repository 接口禁止返回 Entity 类型，必须通过 Converter 转换为 VO/DTO 后返回。Converter 定义在 domain 层（参见 YDIZ-DDD-004），infra 层 Repository 实现通过依赖 domain 模块获取 Converter 完成转换。"
    pattern: "Repository 接口签名中返回类型为 domain/entity 包下的类"
    fix: "在 infra 层 Repository 实现中注入 domain 层的 MapStruct Converter，完成 Entity→VO 转换"
    source: "编码规范 34.2 节 §34.2.1"

  - id: "YDIZ-DDD-003"
    category: "ddd"
    severity: "P0"
    title: "server 层禁止直接使用 Mapper/QueryWrapper"
    description: "禁止在 server 层直接 import Mapper 类或使用 QueryWrapper/LambdaQueryWrapper/UpdateWrapper。"
    pattern: "server 包下 import org.mybatisplus.core.mapper 或 import com.baomidou.mybatisplus.core.conditions.query"
    fix: "数据访问逻辑封装在 Repository 实现中（infra 层）"
    source: "编码规范 34 章、附录 D 第 22/23 项"

  - id: "YDIZ-DDD-004"
    category: "ddd"
    severity: "P0"
    title: "【强制】Entity 和 Converter 必须放在 domain 层，infra 层禁止声明 MapStruct 依赖"
    description: |
      Entity（持久化实体）和 Converter（对象转换器）是领域模型的一部分，必须放在 {module}-domain 层。
      infra 层作为 domain 的实现，通过 pom 依赖 domain 模块来复用 Entity 和 Converter，**禁止**在 infra 层自行定义 MapStruct Converter 或维护 entity 包的副本。

      **infra 层 MapStruct `provided` 依赖豁免**：
      当 domain 层将 MapStruct 声明为 `provided` scope 时，该依赖**不会**传递到 infra 层。
      但 infra 层需要编译期解析 domain 层的 `@Mapper` 注解（注入 domain 层声明的 Converter 接口时需解析 `ReportingPolicy` 等枚举值），
      因此 infra 模块允许以 `provided` scope **被动声明** `org.mapstruct` 依赖。此为例外豁免，不构成违规。

      **分层放置规则**：
      - {module}-domain/entity/ — 数据库实体类（带 @TableName / @TableField 注解）
      - {module}-domain/converter/ 或 {module}-domain/model/converter/ — MapStruct 转换器接口
      - {module}-infra/ — 仅保留 Mapper 和 Repository 实现，通过依赖 domain 模块获取 Entity 和 Converter

      **为什么 Entity 放 domain**：
      - Entity 是领域模型的核心组成部分，domain 层需要直接定义业务实体
      - server 层和其他模块可以通过依赖 domain 直接引用 Entity，无需透传 infra
      - infra 作为 domain 的插件实现，不应"拥有"领域模型，只需提供持久化能力

      **为什么 Converter 放 domain**：
      - Converter 做的是 Entity↔VO/DTO 的形态转换，属于领域层内部的模型映射逻辑
      - domain 层已有 Assembler（api 层）、DTO/VO/Query，加上 Converter 形成完整的领域模型定义
      - domain 声明 MapStruct 依赖（仅编译期处理器）不违反依赖方向原则（domain↛infra，但 MapStruct 是第三方库）
    pattern: |
      以下任一情形构成违规：
      1. entity 包下类文件放在 {module}-infra 模块（应在 domain/entity/）
      2. MapStruct @Mapper Converter 接口放在 {module}-infra/converter/ 或 {module}-server/converter/（应在 domain/converter/）
      3. infra 模块 pom.xml 声明了 org.mapstruct 依赖（MapStruct 依赖应声明在 domain 模块）
    fix: |
      1. 将 Entity 类从 {module}-infra/entity/ 迁移至 {module}-domain/entity/
      2. 将 Converter 接口从 {module}-infra/converter/ 迁移至 {module}-domain/converter/ 或 domain/model/converter/
      3. 将 pom.xml 中 org.mapstruct 依赖从 infra 模块移至 domain 模块（infra 层**不允许 compile scope**）
      4. 若 infra 层因 domain 层 MapStruct 为 `provided` 导致编译期无法解析 `@Mapper` 注解：infra 可用 `provided` scope **被动声明** `org.mapstruct`（此为豁免情形，不构成违规）
      5. 更新所有 import 引用（infra/server 层通过依赖 domain 模块引用 Entity 和 Converter）
      6. infra 模块 pom.xml 确保已依赖 {module}-domain
    example_bad: |
      // ❌ Entity 错误地放在 infra 层
      // 文件：ydsz-userinfo-infra/src/main/java/com/njydsz/userinfo/infra/entity/UserAccount.java
      package com.njydsz.userinfo.infra.entity;
      @TableName("ydsz_acct_user")
      public class UserAccount { ... }

      // ❌ Converter 错误地放在 infra 层
      // 文件：ydsz-userinfo-infra/src/main/java/com/njydsz/userinfo/infra/converter/UserInfoConverter.java
      package com.njydsz.userinfo.infra.converter;
      @Mapper(componentModel = "spring")
      public interface UserInfoConverter { ... }
    example_good: |
      // ✅ Entity 放在 domain 层
      // 文件：ydsz-userinfo-domain/src/main/java/com/njydsz/userinfo/domain/entity/UserAccount.java
      package com.njydsz.userinfo.domain.entity;
      @TableName("ydsz_acpt_user")
      public class UserAccount { ... }

      // ✅ Converter 放在 domain 层
      // 文件：ydsz-userinfo-domain/src/main/java/com/njydsz/userinfo/domain/converter/UserInfoConverter.java
      package com.njydsz.userinfo.domain.converter;
      @Mapper(componentModel = "spring")
      public interface UserInfoConverter { ... }

      // ✅ Repository 在 infra 层通过依赖 domain 复用 Entity 和 Converter
      // 文件：ydsz-userinfo-infra/src/main/java/com/njydsz/userinfo/infra/repository/impl/UserRepositoryImpl.java
      package com.njydsz.userinfo.infra.repository.impl;
      import com.njydsz.userinfo.domain.entity.UserAccount;         // 来自 domain
      import com.njydsz.userinfo.domain.converter.UserInfoConverter; // 来自 domain
    source: "编码规范 34.5 节、附录 D 第 25/26 项"

  - id: "YDIZ-DDD-005"
    category: "ddd"
    severity: "P0"
    title: "【强制】api 模块禁止自建 domain/vo/dto/query 子包"
    description: |
      api 模块是纯契约层，仅定义 FeignClient 接口签名和 Assembler（VO↔DTO 转换），通过依赖 domain 模块复用 VO/DTO/Query/枚举 作为方法签名类型。
      **禁止**在 api 模块内部新建 domain/、vo/、dto/、query/ 子包（即 api 模块下不允许出现任何 DTO/Query 类文件）。
      DTO/Query 应定义在 {module}-domain 模块的 dto/、query/ 包中，api 模块通过 pom 依赖引用。
      本条为【强制】规则，违反将导致 api 模块职责污染，破坏 DDD 分层架构。
    pattern: |
      api 模块下出现以下任一情况：
      1. 新建 *.java 文件且 package 含 .vo. 或 .dto. 或 .query. 子路径
      2. api 模块内部定义 @Data / @Builder 注解的 DTO/Query 类
      3. FeignClient 接口签名中使用 api 模块自身定义的 DTO（应使用 domain 模块的 DTO）
    fix: |
      1. 将 DTO/Query 类从 api 模块迁移至 domain 模块（{module}-domain/src/main/java/.../domain/dto/ 或 domain/query/）
      2. 更新 api 模块所有 import 引用指向 domain 模块
      3. 确保 api 模块的 pom.xml 已依赖 {module}-domain
    example_bad: |
      // ❌ 违规：api 模块自建 dto 包
      // 文件：ydsz-system-api/src/main/java/com/njydsz/system/api/dto/ConfigQuery.java
      package com.njydsz.system.api.dto;
      @Data
      public class ConfigQuery { private String key; }

      // ❌ 违规：FeignClient 使用 api 模块自建的 DTO
      @FeignClient(name = "ydsz-system")
      public interface ConfigClient {
          @GetMapping("/config")
          ConfigDTO getConfig(ConfigQuery query); // ConfigQuery 来自 api 自身
      }
    example_good: |
      // ✅ 正确：DTO 定义在 domain 模块
      // 文件：ydsz-system-domain/src/main/java/com/njydsz/system/domain/dto/ConfigQuery.java
      package com.njydsz.system.domain.dto;
      @Data
      public class ConfigQuery { private String key; }

      // ✅ 正确：FeignClient 引用 domain 模块的 DTO
      @FeignClient(name = "ydsz-system")
      public interface ConfigClient {
          @GetMapping("/config")
          ConfigDTO getConfig(ConfigQuery query); // 引用自 {module}-domain
      }
    source: "编码规范 §34.3.1、§34.3.1.1 — 【强制】"

  - id: "YDIZ-DDD-006"
    category: "ddd"
    severity: "P1"
    title: "Repository 接口禁止暴露 getMapper 方法"
    description: "禁止 Repository 实现类暴露 getMapper()/getXxxMapper() 方法，防止 Mapper 泄漏到 server 层。"
    pattern: "Repository 实现类中存在 getMapper 或类似方法"
    fix: "封装具体的数据访问方法，不暴露 Mapper 引用"
    source: "编码规范附录 D 第 24 项"

  - id: "YDIZ-DDD-007"
    category: "ddd"
    severity: "P0"
    title: "【强制】全局禁用 Entity/PO 分层，仅在 domain 层定义 Entity，infra 层仅做引用"
    description: |
      全局禁止传统的 domain Entity 与 infra PO（Persistence Object，持久化对象）双包分层模式。
      传统 DDD 实践中，domain 层放置纯净的领域 Entity（不带 ORM 注解），infra 层放置带有 `@TableName`/`@TableField` 等 ORM 注解的 PO（常以 `DO` 结尾，如 `MsgLogDO`）。
      **本规范禁用此分层，统一为单包模式：Entity 仅在 `{module}-domain/entity/` 下定义，直接携带 MyBatis-Plus ORM 注解；infra 层通过 pom 依赖 domain 模块对 Entity 做引用，禁止自行维护任何持久化实体类（PO/DO/Entity）副本。**

      **核心约束**：
      1. `{module}-infra/` 下**禁止存在** `entity/`、`po/`、`do/` 包，禁止任何以 `DO`/`PO` 结尾的类文件
      2. infra 层的 Mapper 接口、Repository 实现必须直接 import `{module}-domain/entity/` 下的 Entity 类
      3. 禁止通过继承、拷贝、`BeanUtils.copyProperties` 等方式在 infra 层创建 Entity 的替身类
      4. 数据库表映射关系（`@TableName`、`@TableField`、`@TableId`）直接定义在 domain Entity 上，不拆分到 infra 层
      5. Converter（MapStruct 对象转换器）仅在 `{module}-domain/converter/` 下定义（参见 YDIZ-DDD-004），infra 层禁止自行声明或复制 Converter

      **为什么禁用 Entity/PO 分层**：
      - 减少模型重复：Entity 与 PO 字段高度重叠（>95%），维护两份类带来同步负担和隐患
      - 简化转换链路：去除 Entity↔PO Mapper 后，Repository 仅需处理 Entity↔DTO/VO 一套转换
      - domain 层"拥有"业务实体定义是 YDSZ 架构的一贯定位（参见 YDIZ-DDD-004）
      - infra 层作为 domain 的插件实现，职责仅为提供持久化能力，不应"拥有"领域模型

      **适用边界**：本规则约束 Business Entity（业务持久化实体）。与业务实体无关的纯技术类（如 `SeataUndoLog`、`FlywaySchemaHistory` 等框架内部表映射）不在此列，但若属于本业务模块的表映射，仍须遵守本规则。
    pattern: |
      以下任一情形构成违规：
      1. {module}-infra 下存在以 DO / PO 结尾的类文件（如 MsgLogDO.java、OrderPO.java）
      2. {module}-infra 下存在 entity/ 包且包含带 @TableName 注解的类
      3. Repository 实现或 Mapper 接口 import 了 infra 模块的 DO/PO 类
      4. 通过 BeanUtils.copyProperties / 手动 setter 将 domain Entity 复制到 infra 层替代类
      5. infra 层类 extends MpBaseEntity 或 extends MpBaseIdEntity（持久化实体基类不应出现在 infra 层，domain 层 Entity 才应继承 MP 基类）
      6. infra 层定义带 @Mapper(componentModel = "spring") 的 MapStruct 转换器接口
    fix: |
      1. 将 infra 层 DO/PO 类删除，所有引用点改为 import domain/entity/ 下对应 Entity
      2. 若 DO/PO 与 Entity 存在字段差异，将差异字段补充到 domain Entity
      3. Mapper 接口（infra/mapper/）的入参/返回类型全部改为 domain Entity
      4. 若 Mapper XML 中 resultType/parameterType 引用了 DO/PO 的全路径，改为 domain Entity 路径
      5. 确认 infra 模块 pom.xml 已依赖 {module}-domain
      6. 确认 Converter 仅在 domain 层定义（domain/converter/），infra 层无自建 Converter
    example_bad: |
      // ❌ 违规：infra 层维护 DO 类（Entity/PO 分层）
      // 文件：ydsz-message-infra/src/main/java/com/njydsz/message/infra/entity/MsgLogDO.java
      package com.njydsz.message.infra.entity;
      import com.baomidou.mybatisplus.annotation.TableName;
      @Data
      @TableName("ydsz_msg_log")
      public class MsgLogDO {
          private String msgTitle;
      }

      // ❌ 违规：Mapper import infra DO 类
      // 文件：ydsz-message-infra/src/main/java/com/njydsz/message/infra/mapper/MsgLogMapper.java
      package com.njydsz.message.infra.mapper;
      import com.njydsz.message.infra.entity.MsgLogDO; // ❌ 应引用 domain Entity
      public interface MsgLogMapper extends BaseMapper<MsgLogDO> { }

      // ❌ 违规：Repository 实现通过 BeanUtils 复制 domain Entity 到 infra PO
      MsgLogDO po = new MsgLogDO();
      BeanUtils.copyProperties(domainEntity, po); // ❌ 禁止的拷贝替身模式

    example_good: |
      // ✅ 正确：Entity 仅在 domain 层定义
      // 文件：ydsz-message-domain/src/main/java/com/njydsz/message/domain/entity/MsgLog.java
      package com.njydsz.message.domain.entity;
      import com.baomidou.mybatisplus.annotation.TableName;
      @Data
      @TableName("ydsz_msg_log")
      public class MsgLog {
          private String msgTitle;
      }

      // ✅ 正确：Mapper 直接引用 domain Entity
      // 文件：ydsz-message-infra/src/main/java/com/njydsz/message/infra/mapper/MsgLogMapper.java
      package com.njydsz.message.infra.mapper;
      import com.njydsz.message.domain.entity.MsgLog; // ✅ 来自 domain
      public interface MsgLogMapper extends BaseMapper<MsgLog> { }

      // ✅ 正确：Repository 实现直接使用 domain Entity
      // 文件：ydsz-message-infra/src/main/java/com/njydsz/message/infra/repository/MsgLogRepositoryImpl.java
      package com.njydsz.message.infra.repository;
      import com.njydsz.message.domain.entity.MsgLog;          // ✅ 来自 domain
      import com.njydsz.message.domain.converter.MsgConverter; // ✅ 来自 domain
      @Repository
      public class MsgLogRepositoryImpl implements MsgLogRepository {
          @Autowired private MsgLogMapper mapper;
          @Autowired private MsgConverter converter;
          @Override
          public MsgLogVO findById(String id) {
              MsgLog entity = mapper.selectById(id);           // 直接使用 domain Entity
              return converter.entityToVo(entity);
          }
      }
    source: "编码规范 §34.1、§34.5"

  # ============================================
  # 十、并发规范（3 条）
  # ============================================
  - id: "YDIZ-CONC-001"
    category: "concurrency"
    severity: "P0"
    title: "禁止业务代码自建线程池"
    description: |
      所有异步任务必须通过 ydsz-common-thread 模块统一管理，禁止业务代码直接 new ThreadPoolExecutor 或 ThreadPoolTaskExecutor。
      2026-09-23 扩展：Executors.newFixedThreadPool / newSingleThreadScheduledExecutor 等快捷工厂方法
      本质等价于直接实例化线程池，一并禁止（ArchUnit 已覆盖 java.util.concurrent.Executors 依赖检测）。
      ArchUnit 测试规则：业务模块（ydsz-*/src/main/java 下，ydsz-common-thread 自身豁免）禁止出现
      `new ThreadPoolExecutor(` 或 `new ScheduledThreadPoolExecutor(` 直接实例化，
      禁止依赖 java.util.concurrent.Executors 工厂类，
      必须通过 ThreadPoolExecutorFactory.getBean(name) 或 ExecutorUtils 获取命名线程池。
    pattern: "new ThreadPoolExecutor、new ThreadPoolTaskExecutor 或 Executors.new*（非 common-thread 模块）"
    fix: |
      通过 ydsz-common-thread 声明式获取线程池：
      `ThreadPoolExecutor executor = ThreadPoolExecutorFactory.getBean("poolName");`
      或工具式创建：`ExecutorUtils.newDaemonFixedThreadPool(n, "prefix-")` / `ExecutorUtils.newScheduledThreadPool(n, "prefix-")`，
      或配置 `ydsz.thread.pools.<name>` 属性。
    example_bad: |
      // ydsz-agent/SubAgentExecutorPool.java
      // 违规：直接 new ThreadPoolExecutor 或 Executors 快捷工厂
      private final ThreadPoolExecutor executor = new ThreadPoolExecutor(
          2, 8, 60L, TimeUnit.SECONDS, new LinkedBlockingQueue<>(1000));
      private final ScheduledExecutorService scheduler = Executors.newSingleThreadScheduledExecutor();
    example_good: |
      // 通过 ydsz-common-thread 工厂获取
      private final ThreadPoolExecutor executor =
          ThreadPoolExecutorFactory.getBean("subAgentExecutor");
      private final ScheduledExecutorService scheduler =
          ExecutorUtils.newScheduledThreadPool(1, "sse-heartbeat-");
    source: "编码规范 16.4 节"

  - id: "YDIZ-CONC-002"
    category: "concurrency"
    severity: "P0"
    title: "ThreadLocal 必须在 finally 中 remove"
    description: "使用 ThreadLocal 必须在 finally 块中调用 remove() 清理。"
    pattern: "ThreadLocal.set() 无对应 finally { threadLocal.remove() }"
    fix: "在 finally 中添加 remove() 调用"
    source: "编码规范 16.1 节"

  - id: "YDIZ-CONC-003"
    category: "concurrency"
    severity: "P1"
    title: "正则表达式必须预编译为 static final"
    description: "禁止在循环中编译正则表达式，必须预编译为 static final Pattern。"
    pattern: "方法体内 Pattern.compile 非静态字段"
    fix: "提取为 private static final Pattern"
    source: "编码规范 21.1 节"

