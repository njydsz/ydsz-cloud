  - id: "YDIZ-NETTY-001"
    category: "netty"
    severity: "P1"
    title: "TCP 推送 Handler 必须使用 AbstractJsonTcpHandler 基类"
    description: |
      禁止 TCP 推送 Handler 直接 extends {@code ChannelInboundHandlerAdapter} 并手动实现
      ByteBuf → UTF-8 → JSON 解析、空闲超时关闭、异常关闭、AUTH 认证等通用逻辑。
      必须使用 {@code com.njydsz.common.netty.handler.AbstractJsonTcpHandler} 作为基类。
    fix: "参见 YDIZ-NETTY-001 原文（已在上方 P1 规则中完整定义）"
    source: "ydsz-common-netty 全局引用分析（P0 Handler 迁移整改，26.10.01）"

  # ============================================
  # 十八（续）、Netty 会话管理规范（1 条，P2）
  # ============================================
  - id: "YDIZ-NETTY-002"
    category: "netty"
    severity: "P2"
    title: "认证后必须更新 Session bizId 激活 Session 管理"
    description: |
      TCP 连接认证成功后（AUTH_ACK 已发送），业务层应额外调用
      {@code sessionRepository.updateBizId(sessionId, userId)} 设置会话的业务标识，
      以激活 {@link com.njydsz.common.netty.session.SessionRepository} 的会话管理能力。

      **为什么要求**：
      - 未设置 bizId 的会话无法通过 {@code sessionRepository.getByBizId(userId)} 查找
      - 设置 bizId 后可以实现：多端登录管理、按用户推送、会话级属性追踪
      - 统一的会话管理有利于后期实现跨节点 Session 迁移（如从本地内存迁移到 Redis）

      **正例**（在 onAuthenticated 中添加 Session 更新逻辑）：
      ```java
      &#64;Override
      protected void onAuthenticated(ChannelHandlerContext ctx, String userId) {
          this.userId = userId;
          server.registerUser(userId, ctx.channel());
          // 激活 Session 管理
          server.getSessionRepository().find(s -> s.getChannel().equals(ctx.channel()))
              .forEach(s -> server.getSessionRepository().updateBizId(s.getSessionId(), userId));
      }
      ```

      **适用场景**：
      - 所有使用 AbstractJsonTcpHandler 且通过 AUTH 认证的业务模块
      - message-server / nextwiki-server：**强制**

    fix: |
      1. 在 onAuthenticated() 方法中，除了分组注册外，增加 sessionRepository.updateBizId 调用
      2. 使用 server.getSessionRepository().find(s -> s.getChannel().equals(channel)) 查找对应 session
      3. 调用 updateBizId(session.getSessionId(), userId) 注册 bizId
    source: "ydsz-common-netty 全局引用分析（P2 Session 能力激活整改，26.10.01）"

  # ============================================
  # 十九、文档处理规范（1 条，P0）
  # ============================================
  # YDIZ-DOCS-001: 文档上传/解析/水印场景必须通过 ydzsz-common-docs 模块，禁止直连底层三方库
  - id: "YDIZ-DOCS-001"
    category: "docs"
    severity: "P0"
    title: "文档处理必须通过 ydzsz-common-docs 统一模块"
    description: |
      业务模块涉及文档解析、格式转换、安全扫描、PII 检测、OCR 等场景时，
      必须通过 ydzsz-common-modules 的 ydzsz-common-docs 模块提供的公共能力实现，
      禁止直接 import 底层三方库（PDFBox / POI / Jsoup / Apache Tika），
      禁止在业务模块中自行实现文档解析逻辑。

      **为什么要求**：
      - common-docs 已提供 8 格式统一解析、安全扫描（Office 宏 / PDF JS / OLE2）、
        PII 检测（7 类敏感信息）、OCR 扩展接口、格式转换等完整能力
      - 直接依赖底层库会造成三方库版本碎片化、安全合规能力缺失
      - 统一模块便于集中修复安全漏洞和升级解析能力

      **必须使用 common-docs 的场景**：
      - 文档上传后的内容解析、格式检测、安全扫描
      - 文档 PII 合规检测（手机号 / 身份证 / 银行卡 / 邮箱 等敏感信息扫描）
      - 文档安全扫描（恶意宏 / PDF JS / OLE2 嵌入对象 检测）
      - 文档水印（PDF 文字水印 使用 PdfWatermarkApplier）

      **正例**（业务层委托 common-docs 解析文档）：
      ```java
      DocumentParseResult result = documentService.parseWithSecurityCheck(inputStream, fileName, null);
      if (!result.isSuccess()) {
          // 安全扫描未通过或解析失败
          return;
      }
      List<PiiFinding> piiFindings = documentService.detectPii(result.getContent());
      ```

      **适用场景**：
      - 所有涉及文件上传、文档解析的业务模块（system/userinfo/message/workflow/nextwiki 等）
      - 文档安全合规扫描场景：强制
      - 图片水印场景：应委托 ydsz-common-fle 的 ImageProcessor

    fix: |
      1. 注入 DocumentService（com.njydsz.common.docs.service.DocumentService）
      2. 用 documentService.parseWithSecurityCheck() 替代直接调用 POI / PDFBox 的解析逻辑
      3. 用 documentService.detectPii() 替代手写正则的 PII 检测
      4. 如有 PDF 水印需要，注入 PdfWatermarkApplier 接口（com.njydsz.common.docs.watermark）
    source: "ydsz-common-docs 全局引用分析（P0 文档处理规范，26.10.01）"

  # ============================================
  # SSE / WebSocket 统一规范（ydsz-common-socket 全局引用分析整改 26.10.01）
  # ============================================

  - id: "YDIZ-SOCKET-001"
    category: "socket"
    severity: "P0"
    title: "【强制】禁止业务代码直接 new SseEmitter()，必须使用 SsePushChannelFactory 创建 SSE 通道"
    description: |
      业务模块的 SSE 连接创建必须通过 com.njydsz.common.socket.push.SsePushChannelFactory 进行，
      禁止直接 new SseEmitter()。Factory 提供：(1) 共享心跳调度（避免每连接独立线程池）；
      (2) 全局限流（maxTotalConnections 可配）；(3) 统一 cleanup 回调注册。

      重构步骤：
      1. Controller / Service 层注入 SsePushChannelFactory（web 层自动配置已注册为 Bean）
      2. 调用 factory.create(timeout) 获取 SsePushChannel
      3. 通过 channel.getEmitter() 获取底层 SseEmitter 用于 Connection 回调注册
      4. 通过 channel.sendEvent(name, data) / channel.complete() / channel.completeWithError() 操作通道

      该方法返回 SseEmitter 给 Spring MVC 处理（框架要求 SSE 端点返回 SseEmitter 类型）。

      MCP over SSE 等协议场景同样适用——factory.create(0L) 创建无超时通道用于长连接保持。
    pattern: |
      以下情形构成违规：
      1. 业务代码（web 层除外）直接 import + new SseEmitter()
      2. 手写 ScheduledExecutorService 独立调度心跳
      3. 自建心跳调度器（与 SsePushChannelMvcFactory 内置调度重复）
    fix: |
      // 反例：手写心跳 + 直接 new SseEmitter
      SseEmitter emitter = new SseEmitter(timeout);
      ScheduledExecutorService scheduler = Executors.newScheduledThreadPool(2);
      scheduler.scheduleAtFixedRate(() -> emitter.send(SseEmitter.event().comment("keep-alive")), 15, 15, TimeUnit.SECONDS);

      // 正例：使用 SsePushChannelFactory
      SsePushChannel channel = ssePushChannelFactory.create(timeout);
      SseEmitter emitter = channel.getEmitter();
      // 心跳由 SsePushChannelMvcAdapter 内置调度自动处理——无需业务代码手写
    example_bad: |
      // ❌ 直接 new SseEmitter + 手写心跳调度
      SseEmitter emitter = new SseEmitter(120_000L);
      ScheduledExecutorService scheduler = Executors.newScheduledThreadPool(2);
      scheduler.scheduleAtFixedRate(() -> {
          try { emitter.send(SseEmitter.event().comment("keep-alive")); }
          catch (IOException e) { active.set(false); }
      }, 15, 15, TimeUnit.SECONDS);
    example_good: |
      // ✅ 使用 Factory 抽象
      SsePushChannel channel = ssePushChannelFactory.create(120_000L);
      SseEmitter emitter = channel.getEmitter();
      // 业务逻辑：channel.sendEvent("data", payload)
      // 完成时：channel.complete() 或 channel.completeWithError(e)
      return emitter;
    source: "ydsz-common-socket 全局引用分析（P0 SSE 通道抽象，26.10.01）"

  - id: "YDIZ-SOCKET-002"
    category: "socket"
    severity: "P1"
    title: "【建议】WebSocket 推送结果不应静默丢弃，必须检查推送返回状态"
    description: |
      RealtimePushTemplate 提供的 pushWithDeliveryResult / pushToUserWithOffline 等方法返回推送结果对象，
      业务代码应对推送失败的场景做显式处理（告警 / 降级 / 记录日志），不应静默丢弃。

      检查方法：
      1. pushToUser 后检查返回的 WebSocketDeliveryResult / WebSocketDeliveryStatus
      2. 对 DELIVERED / CACHED 视为成功；对 FAILED / OFFLINE_UNREACHABLE 触发降级逻辑
      3. 推送失败时记录 INFO 日志（含 userId + 消息类型），便于后续排查
    pattern: |
      以下情形构成违规：
      1. 调用 pushToUser 系列方法后完全不使用返回值
      2. 推送失败时无任何日志或告警
      3. 业务逻辑依赖推送成功但不做失败兜底
    fix: |
      // 反例：静默丢弃推送结果
      realtimePushTemplate.pushToUser(userId, "task_complete", payload);

      // 正例：检查推送结果 + 降级
      WebSocketDeliveryResult result = realtimePushTemplate.pushToUserWithOffline(userId, "task_complete", payload);
      if (!result.isDelivered()) {
          log.warn("[TaskService] WebSocket 推送失败，降级为离线缓存: userId={}, reason={}", userId, result.getStatus());
      }
    source: "ydsz-common-socket 全局引用分析（P1 推送可观测性，26.10.01）"

  - id: "YDIZ-SOCKET-003"
    category: "socket"
    severity: "P1"
    title: "【建议】禁止业务模块自建在线状态广播服务，必须使用 WebSocketPresenceService"
    description: |
      在线状态（Presence）广播（用户上线/下线事件推送）必须通过 ydsz-common-socket 提供的
      WebSocketPresenceService.broadcastPresence() 实现。禁止业务模块自行实现 WebSocket 主题订阅广播
      逻辑（如直接使用 SimpMessagingTemplate.convertAndSend 广播到 /topic/presence/xxx）。

      激活方式：在业务模块配置中设置 ydsz.websocket.presence.enabled=true 即可启用标准化 Presence 广播。
    pattern: |
      以下情形构成违规：
      1. 业务代码直接使用 SimpMessagingTemplate.convertAndSend("/topic/presence/" + userId, event)
      2. 自行维护在线状态 Map + 广播逻辑
      3. 通过自定义 STOMP 主题实现实时在线状态推送
    fix: |
      // 反例：手写 Presence 广播
      simpMessagingTemplate.convertAndSend("/topic/presence/" + userId, presenceEvent);

      // 正例：使用标准 Presence 服务
      webSocketPresenceService.broadcastPresence(userId, WebSocketPresenceEvent.Type.ONLINE);
    source: "ydsz-common-socket 全局引用分析（P1 Presence 服务规范，26.10.01）"

