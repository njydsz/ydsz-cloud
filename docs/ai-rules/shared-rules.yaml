    category: "common-reuse"
    severity: "P0"
    title: "Excel 必须通过 ydsz-common-excel 处理"
    description: "所有 Excel 导入导出操作必须通过 ydsz-common-excel，严禁业务模块直接使用 Apache POI API。"
