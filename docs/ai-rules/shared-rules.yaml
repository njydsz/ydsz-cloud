rules:
  # ============================================
  # 一、文件编码规范（1 条，P0）
  # ============================================
  - id: "YDIZ-CODE-001"
    category: "encoding"
    severity: "P0"
    title: "【强制】所有源文件必须使用 UTF-8（无 BOM）编码"
    description: |
      所有项目源文件（Java、XML、YAML、properties、Markdown、Python 等）必须使用 **UTF-8 无 BOM** 编码保存。

      **为什么禁止 BOM**：
      - BOM（Byte Order Mark，字节顺序标记）是 Unicode 文件开头的特殊标记字节（EF BB BF）
      - UTF-8 是字节顺序无关的编码，BOM 在 UTF-8 中不仅无用，还会导致许多工具链解析错误
      - Java 编译器（javac）不允许源文件以 BOM 开头，若有 BOM 会报 "illegal character: \ufeff" 错误
      - Shell 脚本、PHP、Python 等解释型语言的 shebang 行（#!...）被 BOM 破坏后无法执行
      - Maven/Gradle 构建、MyBatis XML 解析、YAML 配置解析均可能因 BOM 失败

      **项目现状**：
      - .editorconfig 已配置 charset = utf-8，但 Windows 环境下部分编辑器（VS、旧版 IntelliJ 新建文件模板）仍会默认追加 BOM
      - AI 编码工具（CatPaw、WorkBuddy 等）生成新文件时必须显式指定无 BOM 编码，禁止依赖系统默认编码
      - 中文 Windows 系统默认编码为 GBK，若未显式指定 UTF-8，保存的中文注释/字符串可能被错误编码

      **修复方式**：
      - IntelliJ：Settings → Editor → File Encodings → 勾选 "Transparent native-to-ascii conversion"，确保 "Project Encoding" 和 "Default encoding for properties files" 均为 UTF-8，且 "with BOM" 相关选项不勾选
      - VS Code：默认使用 UTF-8 无 BOM，确认 "files.encoding" 设置为 "utf8" 而非 "utf8bom"
    pattern: "文件开头 3 个字节为 EF BB BF（UTF-8 BOM 标记）"
    fix: |
      1. 使用编辑器重新保存为 UTF-8 无 BOM格式（IntelliJ: File → File Encoding → UTF-8 并选择 "Remove BOM"；VS Code: 右下角点击编码 → Save with Encoding → UTF-8（无 BOM））
      2. 批量修复可用命令：find . -name "*.java" -exec sed -i '1s/^\xEF\xBB\xBF//' {} \;
      3. AI 生成新文件时必须在文件创建后立即确认编码为 UTF-8 无 BOM
    example_bad: |
      ❌ 文件开头存在 BOM（不可见，但 hexdump 可看到 EF BB BF）
      hexdump -C File.java | head -1
      00000000  ef bb bf 70 61 63 6b 61  67 65  ...（BOM 字节）
    example_good: |
      ✅ 文件开头直接是有效字符
      hexdump -C File.java | head -1
      00000000  70 61 63 6b 61 67 65 20  63 6f 6d 2e ...（无 BOM）
    source: "编码规范 §1.1 字符编码与换行符 - 【强制】"

  # ============================================
  # 二、Import 导入规范（5 条，全部 P0）
  # ============================================
  - id: "YDIZ-IMPORT-001"
    category: "import"
    severity: "P0"
    title: "【强制】禁止行内全限定类名（FQN）"
    description: |
      所有类型引用必须通过文件顶部的 import 语句声明，严禁在代码体中使用全限定类名（Fully Qualified Name）。
      适用范围：所有 JDK 标准库（java.util、java.time、java.math、java.io、java.sql、java.nio 等）和第三方库。
      特殊说明：System.getProperty("java.io.tmpdir") 中字符串字面量内部的 "java.io" 不属于 FQN 规避范围，但字段、参数、方法体中的类型必须引用 import 后的简单名。
    pattern: "代码体中出现 java.xxx.Yyy、org.xxx.Yyy、com.xxx.Yyy 等全限定名（非 import 行、非字符串常量）"
    fix: "将 FQN 拆为顶部 import + 代码体使用简单名。import 放在 java.* 组，组内按字母序排列"
    example_bad: |
      // 违规：字段声明中使用 FQN
      private java.time.LocalDateTime createdAt;

      // 违规：方法参数中使用 FQN
      void banUser(String id, java.math.BigDecimal amount) { ... }

      // 违规：方法体中使用 FQN
      entity.setReadTime(java.time.LocalDateTime.now());
    example_good: |
      import java.math.BigDecimal;
      import java.time.LocalDateTime;

      // 正确：字段、参数、方法体均使用简单名
      private LocalDateTime createdAt;
      void banUser(String id, BigDecimal amount) { ... }
      entity.setReadTime(LocalDateTime.now());
    source: "编码规范 5.1 节 - 强制 | checkstyle.xml 2.2 节 RegexpSinglelineJava FQN 检测"

  - id: "YDIZ-IMPORT-002"
    category: "import"
    severity: "P0"
    title: "禁止通配符 import"
    description: "禁止使用 import xxx.* 通配符导入，每个类型必须显式 import。"
    pattern: "import 语句中出现 .*"
    fix: "拆分为具体类型的显式 import"
    example_bad: "import org.springframework.beans.factory.*;"
    example_good: "import org.springframework.beans.factory.BeanFactory;"
    source: "编码规范 5.2 节"

  - id: "YDIZ-IMPORT-003"
    category: "import"
    severity: "P0"
    title: "禁止未使用的 import"
    description: "禁止保留未使用的 import 语句。"
    pattern: "import 的类型在代码体中未被引用"
    fix: "删除未使用的 import"
    source: "编码规范 5.5 节"

  - id: "YDIZ-IMPORT-004"
    category: "import"
    severity: "P0"
    title: "禁止直接 import 第三方 JSON 库"
    description: "业务代码禁止直接 import Jackson/Fastjson/Gson/org.json，必须统一使用 ydsz-common-json（JsonUtils）。"
    pattern: "import com.fasterxml.jackson.* 或 import com.alibaba.fastjson2.*"
    fix: "使用 com.njydsz.common.json.JsonUtils 替代"
    source: "编码规范 22.3 节、20.5 节"

  - id: "YDIZ-IMPORT-005"
    category: "import"
    severity: "P0"
    title: "禁止业务模块直接 import Netty"
    description: |
      禁止直接 import io.netty.*，必须通过 ydsz-common-netty 或 ydsz-common-socket 封装。

      **豁免场景**：
      - reactor-netty / spring-webflux 的 API 签名级引用 `io.netty.channel.ChannelOption`
        （如 `HttpClient.option(ChannelOption.CONNECT_TIMEOUT_MILLIS, 5000)` — reactor-netty API
        底层依赖 Netty 原生类型，其 `option()` 方法接收 `ChannelOption<T>` 参数，
        ydsz-common-netty 的 `NettyChannelOptions` 封装类已废弃删除，无替代封装存在，
        属于"不可绕过的底层依赖"豁免情形）
    pattern: "import io\\.netty\\.(buffer|channel|handler|util)\\.(?!ChannelOption，reactor-netty-API-豁免).*"
    exception: "reactor-netty 等响应式框架 API 直接要求 io.netty.channel.ChannelOption 类型参数时豁免"
    fix: "使用 ydsz-common-netty 的 AbstractNettyServer/AbstractNettyClient"
    source: "编码规范 22.3 节、23.6 节"

  # ============================================
  # 三、命名规范（4 条）
  # ============================================
  - id: "YDIZ-NAME-001"
    category: "naming"
    severity: "P0"
    title: "entity 包下禁止使用 DO 后缀"
    description: "持久化实体类不允许使用 DO 后缀，直接使用业务名称命名。"
    pattern: "entity 包下类名以 DO 结尾"
    fix: "移除 DO 后缀，通过包路径区分角色"
    example_bad: "public class UserAccountDO { ... }"
    example_good: "public class UserAccount { ... }"
    source: "编码规范 2.4 节"

  - id: "YDIZ-NAME-002"
    category: "naming"
    severity: "P0"
    title: "数据库表名必须使用 ydsz_ 前缀"
    description: "所有业务模块的数据库表名必须以 ydsz_ 为前缀（ydsz-common 模块除外）。"
    pattern: "@TableName 注解值不以 ydsz_ 开头"
    fix: "改为 ydsz_ 前缀"
    example_bad: "@TableName(\"nw_file_node\")"
    example_good: "@TableName(\"ydsz_file_node\")"
    source: "编码规范 2.5 节"

  - id: "YDIZ-NAME-003"
    category: "naming"
    severity: "P1"
    title: "禁止中文拼音混合命名"
    description: "命名必须使用英文单词，禁止中文拼音、拼音首字母缩写。"
    pattern: "变量名或方法名包含拼音（如 yongHu、getPingJia）"
    fix: "使用对应英文含义命名"
    example_bad: "String getPingJiaByName();"
    example_good: "String getCommentByName();"
    source: "编码规范 2.1 节"

  - id: "YDIZ-NAME-004"
    category: "naming"
    severity: "P1"
    title: "禁止无意义命名"
    description: "命名必须'见名知意'，禁止 a、b、tmp、data、flag 等无意义命名。"
    pattern: "单字符变量名（除循环变量 i/j/k）或 tmp/tmpVar 等"
    fix: "使用有业务含义的命名"
    example_bad: "int d; boolean flag;"
    example_good: "int elapsedDays; boolean enabled;"
    source: "编码规范 2.1 节"

  # ============================================
  # 四、OOP 规约（6 条）
  # ============================================
  - id: "YDIZ-OOP-001"
    category: "oop"
    severity: "P0"
    title: "覆盖 equals 必须同时覆盖 hashCode"
    description: "覆盖 equals 方法时，必须同时覆盖 hashCode 方法。"
    pattern: "类中定义 equals 方法但未定义 hashCode 方法"
    fix: "同时实现 hashCode 方法"
    source: "编码规范 6.2 节"

  - id: "YDIZ-OOP-002"
    category: "oop"
    severity: "P0"
    title: "包装类比较必须使用 equals"
    description: "所有整形包装类对象之间值的比较，全部使用 equals 方法，禁止使用 ==。"
    pattern: "Integer/Long/Short/Byte 等包装类使用 == 比较"
    fix: "改用 equals() 方法"
    example_bad: "if (a == b) // Integer a, b"
    example_good: "if (a.equals(b))"
    source: "编码规范 6.2 节"

  - id: "YDIZ-OOP-003"
    category: "oop"
    severity: "P0"
    title: "禁止定义为 double/float 类型，一律使用 BigDecimal"
    description: "浮点数等值判断，基本类型不能用==，禁止定义为 double/float 类型，一律使用 BigDecimal。"
    pattern: "字段或局部变量声明为 double 或 float（JSON 序列化 DTO 除外）"
    fix: "改用 BigDecimal，使用字符串构造或 BigDecimal.valueOf()"
    example_bad: "double price = 19.99;"
    example_good: "BigDecimal price = new BigDecimal(\"19.99\");"
    source: "编码规范 6.3 节、6.4 节、6.6 节"

  - id: "YDIZ-OOP-005"
    category: "oop"
    severity: "P2"
    title: "覆写方法必须添加 @Override"
    description: "覆盖父类方法或实现接口方法时必须添加 @Override 注解。"
    pattern: "方法签名与父类/接口相同但缺少 @Override"
    fix: "添加 @Override 注解"
    source: "编码规范附录 D 第 17 项"

  - id: "YDIZ-OOP-006"
    category: "oop"
    severity: "P0"
    title: "【强制】布尔字段必须带 is 前缀"
    description: |
      数据库布尔字段和 Java 布尔字段映射**必须统一使用 `is_xxx` / `isXxx` 前缀**。
      此规则同时约束 Java 字段名和数据库列名。

      **强制命名规范**：
      - 数据库列名：`is_default`、`is_active`、`is_system`、`is_public`、`is_deleted`、`is_folder`
      - Java 字段名：`isDefault`、`isActive`、`isSystem`、`isPublic`、`isDeleted`、`isFolder`
      - Getter 方法：`getIsDefault()`、`getIsActive()` 等

      **禁止的命名**：
      不带 `is` 前缀的布尔字段（如 `default`、`active`、`deleted`）

      **`@ConfigurationProperties` 豁免**：
      标注 `@ConfigurationProperties` 的配置类中，布尔字段名直接作为 YAML 属性键对外暴露，
      重命名为 `isXxx` 将导致既有 application.yml 配置键失效（破坏向后兼容）。
      此类配置类允许保留原有布尔字段名（如 `automaticTrim`、`useFastReader`、`formulaInjectionProtection`），
      但须在 Javadoc 字段注释中标注 `<!-- OOP-006-EXEMPT: @ConfigurationProperties -->`。
      非 Spring Boot 绑定场景（非 @ConfigurationProperties 的纯 POJO / VO）不予豁免。
    pattern: "private Boolean deleted; 或 private Boolean default;"
    fix: "Java 字段改为 isXxx；数据库列改为 is_xxx"
    example_bad: |
      ❌ private Boolean default;         // 缺少 is 前缀
      ❌ private Boolean deleted;         // 缺少 is 前缀
    example_good: |
      ✅ private Boolean isDefault;       // 数据库列: is_default
      ✅ private Boolean isDeleted;       // 数据库列: is_deleted
      ✅ private Boolean isActive;        // 数据库列: is_active
      ✅ private Boolean isSystem;        // 数据库列: is_system
    source: "编码规范 6.5 节"

  # ============================================
  # 五、数据库命名规范（3 条，P0）
  # ============================================
  - id: "YDIZ-DB-002"
    category: "database"
    severity: "P0"
    title: "【强制】每张表必须包含 9 个基础字段，顺序固定"
    description: |
      **每张数据库表必须包含以下 9 个基础字段**，类型固定、顺序固定（放在主键 id 之后、CONSTRAINT 之前）：

      末尾 9 个基础字段（顺序严格固定）：
      1. `sort` — `INTEGER NOT NULL DEFAULT 0` — 排序权重
      2. `status` — `INTEGER NOT NULL DEFAULT 1` — 状态标识
      3. `revision` — `INTEGER NOT NULL DEFAULT 0` — 乐观锁版本号
      4. `tenant_id` — `VARCHAR(64) NOT NULL DEFAULT '0'` — 租户 ID（多租户隔离）
      5. `is_deleted` — `BOOLEAN NOT NULL DEFAULT FALSE` — 逻辑删除标识
      6. `created_by` — `VARCHAR(64)` — 创建人
      7. `created_at` — `TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP` — 创建时间
      8. `updated_by` — `VARCHAR(64)` — 最后更新人
      9. `updated_at` — `TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP` — 最后更新时间

      **已有业务字段与上述名称冲突时**：业务字段改名（如业务状态改为 `xxx_status`），基础字段 `status` 不可省略。

      **【强制】禁止覆盖基础字段**（YDIZ-DB-006 覆盖）：业务模块**禁止**在 Java 实体中声明同名属性覆盖基础字段，9 个字段只能来自 `MpBaseEntity` 继承。

      **MySQL 方言适配**：is_deleted → TINYINT(1)，时间 → DATETIME(3)，整数 → INT NOT NULL

      **Oracle 方言适配**：is_deleted → NUMBER(1)，时间 → DATE，VARCHAR → VARCHAR2，INTEGER → NUMBER
    pattern: "CREATE TABLE 缺少 sort/status/revision/tenant_id/is_deleted/created_by/created_at/updated_by/updated_at 中任意一个，或顺序不正确"
    fix: "按固定顺序补充缺失的基础字段；已有同名业务字段需改名"
    example_bad: |
      ❌ CREATE TABLE ydsz_xxx (id VARCHAR(64), name VARCHAR(128), is_deleted BOOLEAN);
      ❌ 字段顺序错误：sort 放在 status 之后
      ❌ Java 实体直接 extends MpBaseEntity 外再声明 private Integer sort;
    example_good: |
      ✅ CREATE TABLE ydsz_xxx (
             id VARCHAR(64) NOT NULL, name VARCHAR(128) NOT NULL,
             sort INTEGER NOT NULL DEFAULT 0, status INTEGER NOT NULL DEFAULT 1,
             revision INTEGER NOT NULL DEFAULT 0, tenant_id VARCHAR(64) NOT NULL DEFAULT '0',
             is_deleted BOOLEAN NOT NULL DEFAULT FALSE, created_by VARCHAR(64),
             created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
             updated_by VARCHAR(64), updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
             CONSTRAINT pk_xxx PRIMARY KEY (id));
      ✅ Java: public class Xxx extends MpBaseEntity<String> { ... }
    source: "编码规范 6.13 节"

  - id: "YDIZ-DB-006"
    category: "database"
    severity: "P0"
    title: "【强制】所有业务模块 Entity 必须继承 MpBaseEntity，禁止自建基类及覆盖基础字段"
    description: |
      平台基础字段清单（共 10 个，由 `ydsz-common-jdbc` 的 `MpBaseEntity` 提供）：

      | Java 字段 | DB 列 | 类型 | 说明 |
      |-----------|--------|------|------|
      | `id` | `id` | `VARCHAR`/`BIGINT` | 主键 |
      | `sort` | `sort` | `INTEGER` | 排序权重 |
      | `status` | `status` | `INTEGER/VARCHAR` | 状态标识 |
      | `revision` | `revision` | `INTEGER` | 乐观锁版本号 |
      | `tenantId` | `tenant_id` | `VARCHAR` | 租户 ID |
      | `isDeleted` | `is_deleted` | `BOOLEAN` | 逻辑删除 |
      | `createdBy` | `created_by` | `VARCHAR` | 创建人 |
      | `createdAt` | `created_at` | `TIMESTAMP` | 创建时间 |
      | `updatedBy` | `updated_by` | `VARCHAR` | 更新人 |
      | `updatedAt` | `updated_at` | `TIMESTAMP` | 更新时间 |

      **【强制规则一：必须继承 MpBaseEntity】**
      所有业务模块（agent / cronjob / message / nextwiki / system / userinfo / workflow / literule / generator 等）的 Entity 类**必须直接继承** `com.njydsz.common.jdbc.entity.MpBaseEntity`（或 `MpBaseEntity<Long>` / `MpBaseEntity<String>`），**禁止以下行为**：

      1. 不继承任何 ydsz 基类（plain POJO 作为 Entity）
      2. 自建 `AbstractXxxEntity` / `BaseXxxEntity` 绕过 `MpBaseEntity` 标准字段体系
      3. 继承 `MpBaseAuditEntity` 替代 `MpBaseEntity`（`MpBaseAuditEntity` 缺少 `tenant_id/is_deleted/status/revision` 字段，会导致 DDL 漂移）
      4. 在非 domain/entity 包下重新声明 Entity 类（如 infra 层仿制 DO/PO）

      **【强制规则二：禁止覆盖 / 重定义基础字段】**
      即使已通过 `extends MpBaseEntity` 继承了上述 10 个字段，业务实体也**禁止再次声明**以下任何属性：

      - `private Integer sort;` / `private String status;` / `private Integer revision;`
      - `private String tenantId;` / `private Boolean isDeleted;`
      - `private String createdBy;` / `private LocalDateTime createdAt;`
      - `private String updatedBy;` / `private LocalDateTime updatedAt;`

      **违反后果**：覆盖基础字段会导致 MyBatis-Plus 拦截器填充异常、乐观锁失效、SQL 拦截器租户条件错位、审计字段填充冲突。

      **实体继承决策树**：
      ```text
      [新建业务 Entity]
        │
        ├─ 需要乐观锁（高并发更新）→ extends MpBaseEntity<Long/String>
        ├─ 纯查询/低频配置表 → extends MpSimpleEntity<Long/String>
        ├─ 仅需审计字段 → extends MpBaseAuditEntity<Long/String>
        └─ 仅需主键 → extends MpBaseIdEntity<Long/String>
      ```

      > **AI 生成约束**：生成新的业务 Entity 时，必须包含 `extends MpBaseEntity<String>` 或 `extends MpBaseEntity<Long>`，且不得声明任何与上述 10 个基础字段同名的属性。
    pattern: |
      domain/entity/ 目录下：
      1. class XxxEntity 后无 extends 或 extends 非 ydsz 基类
      2. class XxxEntity extends (?!Mp(BaseEntity|SimpleEntity|BaseAuditEntity|BaseIdEntity))
      3. 在 extends MpBaseEntity 后又声明了 sort/status/revision/tenantId/isDeleted/createdAt/createdBy/updatedAt/updatedBy 中任一属性
    fix: |
      1. 将 class XxxEntity 改为 class XxxEntity extends MpBaseEntity<String>（或 MpBaseEntity<Long>）
      2. 删除实体中声明的 sort/status/revision/tenantId/isDeleted/createdAt/createdBy/updatedAt/updatedBy 同名属性
      3. 自建基类改为继承 MpBaseEntity，或在 DDL 中补齐缺失的 9 个基础字段
    example_bad: |
      ❌ // 无继承 — 缺少所有基础字段
      @TableName("ydsz_xxx")
      public class Xxx { private Long id; }

      ❌ // 自建基类绕过标准字段体系
      public abstract class AbstractXxxEntity { private Long id; }
      public class Xxx extends AbstractXxxEntity { ... }

      ❌ // 继承 MpBaseAuditEntity（缺少 tenant_id/is_deleted/status/revision）
      public class Xxx extends MpBaseAuditEntity<String> { ... }

      ❌ // 继承 MpBaseEntity 后再声明 tenant_id 覆盖基础字段
      public class Space extends MpBaseEntity<String> {
          @TableField("tenant_id")
          private String tenantId;  // ❌ 覆盖基础字段
      }

      ❌ // 继承 MpBaseEntity 后声明 sort
      @TableName("ydsz_xxx")
      public class Xxx extends MpBaseEntity<String> {
          @TableField("sort")
          private Integer sort;  // ❌ 重复声明，会冲突
      }
    example_good: |
      ✅ // 标准继承（推荐，高性能并发）
      @Data
      @EqualsAndHashCode(callSuper = true)
      @TableName("ydsz_xxx")
      public class Xxx extends MpBaseEntity<String> {
          @TableField("name")
          private String name;
      }

      ✅ // 配置表无乐观锁（纯查询场景）
      @Data
      @EqualsAndHashCode(callSuper = true)
      @TableName("ydsz_dict")
      public class Dict extends MpSimpleEntity<Long> {
          @TableField("label")
          private String label;
      }
    source: "编码规范 6.13 节 + 平台基础字段保护规范"

  - id: "YDIZ-DB-001"
    category: "database"
    severity: "P0"
    title: "【强制】排序字段统一命名为 sort，禁用 sort_order"
    description: |
      数据库中表示"排序序号"的字段统一命名为 `sort`，Java 实体字段也命名为 `sort`。
      **禁止使用** `sort_order`（数据库）或 `sortOrder`（Java）命名。

      **适用范围**：所有业务表中的排序字段（升序排列用的整型序号）。
    pattern: "sort_order INTEGER 或 private Integer sortOrder;"
    fix: "将 sort_order 改为 sort（数据库列），sortOrder 改为 sort（Java 字段）"
    example_bad: |
      ❌ sort_order INT NOT NULL DEFAULT 0
      ❌ @TableField(\"sort_order\") private Integer sortOrder;
    example_good: |
      ✅ sort INT NOT NULL DEFAULT 0
      ✅ @TableField(\"sort\") private Integer sort;
    source: "编码规范 6.12 节"

