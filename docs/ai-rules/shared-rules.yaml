    source: "编码规范 22.1 节、34.3 节"

  - id: "YDIZ-DDD-002"
    category: "ddd"
    severity: "P0"
    title: "Repository 必须返回 VO/DTO，禁止返回 Entity（PO）"
    description: "Repository 接口禁止返回 Entity 类型，必须通过 Converter 转换为 VO/DTO 后返回。Converter 定义在 domain 层（参见 YDIZ-DDD-004），infra 层 Repository 实现通过依赖 domain 模块获取 Converter 完成转换。"
    pattern: "Repository 接口签名中返回类型为 domain/entity 包下的类"
    fix: "在 infra 层 Repository 实现中注入 domain 层的 MapStruct Converter，完成 Entity→VO 转换"
    source: "编码规范 34.2 节 §34.2.1"

  - id: "YDIZ-DDD-003"
    category: "ddd"
    severity: "P0"
    title: "server 层禁止直接使用 Mapper/QueryWrapper"
    description: "禁止在 server 层直接 import Mapper 类或使用 QueryWrapper/LambdaQueryWrapper/UpdateWrapper。"
    pattern: "server 包下 import org.mybatisplus.core.mapper 或 import com.baomidou.mybatisplus.core.conditions.query"
    fix: "数据访问逻辑封装在 Repository 实现中（infra 层）"
    source: "编码规范 34 章、附录 D 第 22/23 项"

  - id: "YDIZ-DDD-004"
    category: "ddd"
    severity: "P0"
    title: "【强制】Entity 和 Converter 必须放在 domain 层，infra 层禁止声明 MapStruct 依赖"
    description: |
      Entity（持久化实体）和 Converter（对象转换器）是领域模型的一部分，必须放在 {module}-domain 层。
      infra 层作为 domain 的实现，通过 pom 依赖 domain 模块来复用 Entity 和 Converter，**禁止**在 infra 层自行定义 MapStruct Converter 或维护 entity 包的副本。

      **infra 层 MapStruct `provided` 依赖豁免**：
      当 domain 层将 MapStruct 声明为 `provided` scope 时，该依赖**不会**传递到 infra 层。
      但 infra 层需要编译期解析 domain 层的 `@Mapper` 注解（注入 domain 层声明的 Converter 接口时需解析 `ReportingPolicy` 等枚举值），
      因此 infra 模块允许以 `provided` scope **被动声明** `org.mapstruct` 依赖。此为例外豁免，不构成违规。

      **分层放置规则**：
      - {module}-domain/entity/ — 数据库实体类（带 @TableName / @TableField 注解）
      - {module}-domain/converter/ 或 {module}-domain/model/converter/ — MapStruct 转换器接口
      - {module}-infra/ — 仅保留 Mapper 和 Repository 实现，通过依赖 domain 模块获取 Entity 和 Converter

      **为什么 Entity 放 domain**：
      - Entity 是领域模型的核心组成部分，domain 层需要直接定义业务实体
      - server 层和其他模块可以通过依赖 domain 直接引用 Entity，无需透传 infra
      - infra 作为 domain 的插件实现，不应"拥有"领域模型，只需提供持久化能力

      **为什么 Converter 放 domain**：
      - Converter 做的是 Entity↔VO/DTO 的形态转换，属于领域层内部的模型映射逻辑
      - domain 层已有 Assembler（api 层）、DTO/VO/Query，加上 Converter 形成完整的领域模型定义
      - domain 声明 MapStruct 依赖（仅编译期处理器）不违反依赖方向原则（domain↛infra，但 MapStruct 是第三方库）
    pattern: |
      以下任一情形构成违规：
      1. entity 包下类文件放在 {module}-infra 模块（应在 domain/entity/）
      2. MapStruct @Mapper Converter 接口放在 {module}-infra/converter/ 或 {module}-server/converter/（应在 domain/converter/）
      3. infra 模块 pom.xml 声明了 org.mapstruct 依赖（MapStruct 依赖应声明在 domain 模块）
    fix: |
      1. 将 Entity 类从 {module}-infra/entity/ 迁移至 {module}-domain/entity/
      2. 将 Converter 接口从 {module}-infra/converter/ 迁移至 {module}-domain/converter/ 或 domain/model/converter/
      3. 将 pom.xml 中 org.mapstruct 依赖从 infra 模块移至 domain 模块（infra 层**不允许 compile scope**）
      4. 若 infra 层因 domain 层 MapStruct 为 `provided` 导致编译期无法解析 `@Mapper` 注解：infra 可用 `provided` scope **被动声明** `org.mapstruct`（此为豁免情形，不构成违规）
      5. 更新所有 import 引用（infra/server 层通过依赖 domain 模块引用 Entity 和 Converter）
      6. infra 模块 pom.xml 确保已依赖 {module}-domain
    example_bad: |
      // ❌ Entity 错误地放在 infra 层
      // 文件：ydsz-userinfo-infra/src/main/java/com/njydsz/userinfo/infra/entity/UserAccount.java
      package com.njydsz.userinfo.infra.entity;
      @TableName("ydsz_idm_account_user")
      public class UserAccount { ... }

      // ❌ Converter 错误地放在 infra 层
      // 文件：ydsz-userinfo-infra/src/main/java/com/njydsz/userinfo/infra/converter/UserInfoConverter.java
      package com.njydsz.userinfo.infra.converter;
      @Mapper(componentModel = "spring")
      public interface UserInfoConverter { ... }
    example_good: |
      // ✅ Entity 放在 domain 层
      // 文件：ydsz-userinfo-domain/src/main/java/com/njydsz/userinfo/domain/entity/UserAccount.java
      package com.njydsz.userinfo.domain.entity;
      @TableName("ydsz_acpt_user")
      public class UserAccount { ... }

      // ✅ Converter 放在 domain 层
      // 文件：ydsz-userinfo-domain/src/main/java/com/njydsz/userinfo/domain/converter/UserInfoConverter.java
      package com.njydsz.userinfo.domain.converter;
      @Mapper(componentModel = "spring")
      public interface UserInfoConverter { ... }

      // ✅ Repository 在 infra 层通过依赖 domain 复用 Entity 和 Converter
      // 文件：ydsz-userinfo-infra/src/main/java/com/njydsz/userinfo/infra/repository/impl/UserRepositoryImpl.java
      package com.njydsz.userinfo.infra.repository.impl;
      import com.njydsz.userinfo.domain.entity.UserAccount;         // 来自 domain
      import com.njydsz.userinfo.domain.converter.UserInfoConverter; // 来自 domain
    source: "编码规范 34.5 节、附录 D 第 25/26 项"

  - id: "YDIZ-DDD-005"
    category: "ddd"
    severity: "P0"
    title: "【强制】api 模块禁止自建 domain/vo/dto/query 子包"
    description: |
      api 模块是纯契约层，仅定义 FeignClient 接口签名和 Assembler（VO↔DTO 转换），通过依赖 domain 模块复用 VO/DTO/Query/枚举 作为方法签名类型。
      **禁止**在 api 模块内部新建 domain/、vo/、dto/、query/ 子包（即 api 模块下不允许出现任何 DTO/Query 类文件）。
      DTO/Query 应定义在 {module}-domain 模块的 dto/、query/ 包中，api 模块通过 pom 依赖引用。
      本条为【强制】规则，违反将导致 api 模块职责污染，破坏 DDD 分层架构。
    pattern: |
      api 模块下出现以下任一情况：
      1. 新建 *.java 文件且 package 含 .vo. 或 .dto. 或 .query. 子路径
      2. api 模块内部定义 @Data / @Builder 注解的 DTO/Query 类
      3. FeignClient 接口签名中使用 api 模块自身定义的 DTO（应使用 domain 模块的 DTO）
    fix: |
      1. 将 DTO/Query 类从 api 模块迁移至 domain 模块（{module}-domain/src/main/java/.../domain/dto/ 或 domain/query/）
      2. 更新 api 模块所有 import 引用指向 domain 模块
      3. 确保 api 模块的 pom.xml 已依赖 {module}-domain
    example_bad: |
      // ❌ 违规：api 模块自建 dto 包
      // 文件：ydsz-system-api/src/main/java/com/njydsz/system/api/dto/ConfigQuery.java
      package com.njydsz.system.api.dto;
      @Data
      public class ConfigQuery { private String key; }

      // ❌ 违规：FeignClient 使用 api 模块自建的 DTO
      @FeignClient(name = "ydsz-system")
      public interface ConfigClient {
          @GetMapping("/config")
          ConfigDTO getConfig(ConfigQuery query); // ConfigQuery 来自 api 自身
      }
    example_good: |
      // ✅ 正确：DTO 定义在 domain 模块
      // 文件：ydsz-system-domain/src/main/java/com/njydsz/system/domain/dto/ConfigQuery.java
      package com.njydsz.system.domain.dto;
      @Data
      public class ConfigQuery { private String key; }

      // ✅ 正确：FeignClient 引用 domain 模块的 DTO
      @FeignClient(name = "ydsz-system")
      public interface ConfigClient {
          @GetMapping("/config")
          ConfigDTO getConfig(ConfigQuery query); // 引用自 {module}-domain
      }
    source: "编码规范 §34.3.1、§34.3.1.1 — 【强制】"

  - id: "YDIZ-DDD-006"
    category: "ddd"
    severity: "P1"
    title: "Repository 接口禁止暴露 getMapper 方法"
    description: "禁止 Repository 实现类暴露 getMapper()/getXxxMapper() 方法，防止 Mapper 泄漏到 server 层。"
    pattern: "Repository 实现类中存在 getMapper 或类似方法"
    fix: "封装具体的数据访问方法，不暴露 Mapper 引用"
    source: "编码规范附录 D 第 24 项"

  - id: "YDIZ-DDD-007"
    category: "ddd"
    severity: "P0"
    title: "【强制】全局禁用 Entity/PO 分层，仅在 domain 层定义 Entity，infra 层仅做引用"
    description: |
      全局禁止传统的 domain Entity 与 infra PO（Persistence Object，持久化对象）双包分层模式。
      传统 DDD 实践中，domain 层放置纯净的领域 Entity（不带 ORM 注解），infra 层放置带有 `@TableName`/`@TableField` 等 ORM 注解的 PO（常以 `DO` 结尾，如 `MsgLogDO`）。
      **本规范禁用此分层，统一为单包模式：Entity 仅在 `{module}-domain/entity/` 下定义，直接携带 MyBatis-Plus ORM 注解；infra 层通过 pom 依赖 domain 模块对 Entity 做引用，禁止自行维护任何持久化实体类（PO/DO/Entity）副本。**

      **核心约束**：
      1. `{module}-infra/` 下**禁止存在** `entity/`、`po/`、`do/` 包，禁止任何以 `DO`/`PO` 结尾的类文件
      2. infra 层的 Mapper 接口、Repository 实现必须直接 import `{module}-domain/entity/` 下的 Entity 类
      3. 禁止通过继承、拷贝、`BeanUtils.copyProperties` 等方式在 infra 层创建 Entity 的替身类
      4. 数据库表映射关系（`@TableName`、`@TableField`、`@TableId`）直接定义在 domain Entity 上，不拆分到 infra 层
      5. Converter（MapStruct 对象转换器）仅在 `{module}-domain/converter/` 下定义（参见 YDIZ-DDD-004），infra 层禁止自行声明或复制 Converter

      **为什么禁用 Entity/PO 分层**：
      - 减少模型重复：Entity 与 PO 字段高度重叠（>95%），维护两份类带来同步负担和隐患
      - 简化转换链路：去除 Entity↔PO Mapper 后，Repository 仅需处理 Entity↔DTO/VO 一套转换
      - domain 层"拥有"业务实体定义是 YDSZ 架构的一贯定位（参见 YDIZ-DDD-004）
      - infra 层作为 domain 的插件实现，职责仅为提供持久化能力，不应"拥有"领域模型

      **适用边界**：本规则约束 Business Entity（业务持久化实体）。与业务实体无关的纯技术类（如 `SeataUndoLog`、`FlywaySchemaHistory` 等框架内部表映射）不在此列，但若属于本业务模块的表映射，仍须遵守本规则。
    pattern: |
      以下任一情形构成违规：
      1. {module}-infra 下存在以 DO / PO 结尾的类文件（如 MsgLogDO.java、OrderPO.java）
      2. {module}-infra 下存在 entity/ 包且包含带 @TableName 注解的类
      3. Repository 实现或 Mapper 接口 import 了 infra 模块的 DO/PO 类
      4. 通过 BeanUtils.copyProperties / 手动 setter 将 domain Entity 复制到 infra 层替代类
      5. infra 层类 extends MpBaseEntity 或 extends MpBaseIdEntity（持久化实体基类不应出现在 infra 层，domain 层 Entity 才应继承 MP 基类）
      6. infra 层定义带 @Mapper(componentModel = "spring") 的 MapStruct 转换器接口
    fix: |
      1. 将 infra 层 DO/PO 类删除，所有引用点改为 import domain/entity/ 下对应 Entity
      2. 若 DO/PO 与 Entity 存在字段差异，将差异字段补充到 domain Entity
      3. Mapper 接口（infra/mapper/）的入参/返回类型全部改为 domain Entity
      4. 若 Mapper XML 中 resultType/parameterType 引用了 DO/PO 的全路径，改为 domain Entity 路径
      5. 确认 infra 模块 pom.xml 已依赖 {module}-domain
      6. 确认 Converter 仅在 domain 层定义（domain/converter/），infra 层无自建 Converter
    example_bad: |
      // ❌ 违规：infra 层维护 DO 类（Entity/PO 分层）
      // 文件：ydsz-message-infra/src/main/java/com/njydsz/message/infra/entity/MsgLogDO.java
      package com.njydsz.message.infra.entity;
      import com.baomidou.mybatisplus.annotation.TableName;
      @Data
      @TableName("ydsz_msg_log")
      public class MsgLogDO {
          private String msgTitle;
      }

      // ❌ 违规：Mapper import infra DO 类
      // 文件：ydsz-message-infra/src/main/java/com/njydsz/message/infra/mapper/MsgLogMapper.java
      package com.njydsz.message.infra.mapper;
      import com.njydsz.message.infra.entity.MsgLogDO; // ❌ 应引用 domain Entity
      public interface MsgLogMapper extends BaseMapper<MsgLogDO> { }

      // ❌ 违规：Repository 实现通过 BeanUtils 复制 domain Entity 到 infra PO
      MsgLogDO po = new MsgLogDO();
      BeanUtils.copyProperties(domainEntity, po); // ❌ 禁止的拷贝替身模式

    example_good: |
      // ✅ 正确：Entity 仅在 domain 层定义
      // 文件：ydsz-message-domain/src/main/java/com/njydsz/message/domain/entity/MsgLog.java
      package com.njydsz.message.domain.entity;
      import com.baomidou.mybatisplus.annotation.TableName;
      @Data
      @TableName("ydsz_msg_log")
      public class MsgLog {
          private String msgTitle;
      }

      // ✅ 正确：Mapper 直接引用 domain Entity
      // 文件：ydsz-message-infra/src/main/java/com/njydsz/message/infra/mapper/MsgLogMapper.java
      package com.njydsz.message.infra.mapper;
      import com.njydsz.message.domain.entity.MsgLog; // ✅ 来自 domain
      public interface MsgLogMapper extends BaseMapper<MsgLog> { }

      // ✅ 正确：Repository 实现直接使用 domain Entity
      // 文件：ydsz-message-infra/src/main/java/com/njydsz/message/infra/repository/MsgLogRepositoryImpl.java
      package com.njydsz.message.infra.repository;
      import com.njydsz.message.domain.entity.MsgLog;          // ✅ 来自 domain
      import com.njydsz.message.domain.converter.MsgConverter; // ✅ 来自 domain
      @Repository
      public class MsgLogRepositoryImpl implements MsgLogRepository {
          @Autowired private MsgLogMapper mapper;
          @Autowired private MsgConverter converter;
          @Override
          public MsgLogVO findById(String id) {
              MsgLog entity = mapper.selectById(id);           // 直接使用 domain Entity
              return converter.entityToVo(entity);
          }
      }
    source: "编码规范 §34.1、§34.5"

  - id: "YDIZ-DDD-008"
    category: "ddd"
    severity: "P0"
    title: "【强制】所有业务层 Entity 必须直接继承 MpBaseEntity，禁止覆盖平台基础字段和自建基类"
    description: |
      **所有业务模块的持久化实体（`{module}-domain/entity/*.java`）必须直接或间接继承 `com.njydsz.common.jdbc.entity.MpBaseEntity`。**

      继承链选择：
      - `MpBaseEntity<T>` — 完整版（含 id / 审计字段 / isDeleted / status / revision / sort / tenantId），适用于绝大多数含完整审计能力的业务表
      - `MpBaseAuditEntity<T>` — 仅 id + 审计字段，不含 deleted/status/revision/tenantId，适用于无状态标记的日志/事件表
      - `MpBaseIdEntity<T>` — 仅 id 主键，适用于极简关联表或无审计需求的表
      - `MpSimpleEntity<T>` — 等同于 MpBaseEntity（完整字段的别名），推荐直接使用 MpBaseEntity

      **平台基础字段（禁止业务模块覆盖/重名）**：
      以下字段由 MpBaseEntity 及其祖先类统一维护，**子类禁止再次声明**：
      1. `id` — 主键，`@TableId(type = IdType.ASSIGN_ID)`
      2. `tenantId` — 租户标识，`@TableField("tenant_id")`
      3. `isDeleted` — 逻辑删除标记，`@TableField("is_deleted")` + `@TableLogic`
      4. `status` — 记录状态，`@TableField("status")`
      5. `revision` — 数据版本号（乐观锁），`@TableField("revision")`
      6. `sort` — 排序字段，`@TableField("sort")`
      7. `createdBy` / `createdAt` / `updatedBy` / `updatedAt` — 审计四字段

      **自建基类禁令**：
      - 禁止业务模块自建 `DomainBaseEntity`、`AbstractEntity`、`BaseEntity` 等持久化基类（脱离 ydzs-common-jdbc 体系）
      - 禁止通过 domain/infra 双层entity分层（参见 YDIZ-DDD-007）
      - Entity 直接继承 MP 基类，单包模式

      **字段覆盖豁免（需代码注释说明）**：
      1. 数据库列因历史遗留使用非标准类型（如整型 0/1 表示状态），需通过自定义 `typeHandler` 映射时：
         子类可重新声明 `@TableField(value = "status", typeHandler = XxxTypeHandler.class) private String status`，
         但必须在 Javadoc 中说明"历史遗留"原因及建议迁移方案
      2. 表使用复合业务键无独立 id 列（如 `(trace_id, step_index)`），不使用 BaseMapper，
         手写 SQL 精确控制查询列时：可声明不参与持久化的 id 字段或复用表结构映射，
         但仍须继承 MpBaseEntity 并在 Javadoc 说明"复合主键，继承字段不参与持久化"

      **为什么不许自建基类或覆盖字段**：
      - MpBaseEntity 提供统一的 id 生成策略、乐观锁、逻辑删除、租户隔离、审计自动填充
      - 自建基类会绕过这些能力，导致部分表缺失逻辑删除、审计等基础治理功能
      - 字段遮蔽（同名 private 字段）会导致子类与父类各自独立存储值，Lombok 生成的 getter/setter 返回的是子类字段值，
        而 MP 框架通过基类映射读取父类字段值，造成数据不一致（读取为 null）
    pattern: |
      以下任一情形构成违规：
      1. domain/entity/ 下的类未 extends MpBaseEntity / MpBaseAuditEntity / MpBaseIdEntity
      2. domain/entity/ 下的类 extends 了自定义的 local base entity（如 extends DomainBaseEntity）
      3. domain/entity/ 下的类声明了与 MpBaseEntity 基础字段同名的 private 字段（id/status/isDeleted/tenantId/revision/sort/createdAt/updatedAt/createdBy/updatedBy），且有自定义映射或未在 Javadoc 中标注豁免原因
      4. 业务模块自建持久化基类（如 DomainBaseEntity、AbstractBaseEntity 等含 id/audit 字段的基类）
      5. Entity 继承层级中断（如 extends 某个不带 MP 注解的中间基类导致丢失 MP 自动能力）
    fix: |
      1. 将 Entity 的父类改为 `MpBaseEntity<String>`（或根据表结构选择 MpBaseIdEntity/MpBaseAuditEntity）
      2. 删除 Entity 中重复声明的基类字段（保留业务字段）
      3. 将自建基类（DomainBaseEntity 等）删除，所有引用入口改为 extends MpBaseEntity
      4. 若 DB 列含自定义 typeHandler，保留 status 字段声明并在 Javadoc 注释豁免原因
      5. 检查是否有外部调用 `entity.setStatus(xxx)` / `entity.getStatus()` — 基类提供同样的 getter/setter，调用方无需修改
      6. 检查是否有 `this.status = xxx` 等内部引用，改为 `setStatus(xxx)` / `getStatus()`
    exemption: |
      自定义 TypeHandler 需覆盖基础字段映射时豁免（需注释说明）。
      复合主键表无独立 id 列、RF 字段不参与持久化时豁免（需注释说明）。
      ydzs-common-jdbc 框架自身（基类 impl）不在此约束内。
    example_bad: |
      // ❌ 违规：Entity 未继承 MpBaseEntity
      @Data
      @TableName("ydsz_msg_notification")
      public class MsgNotification implements Serializable {
          @TableId(value = "id", type = IdType.ASSIGN_ID)
          private String id;
          // ... 手写审计字段
      }

      // ❌ 违规：Entity 自建基类
      @Data
      public class MsgLog extends DomainBaseEntity<String> { ... }

      // ❌ 违规：子类重复声明 status 字段（字段遮蔽）
      public class Company extends MpBaseEntity<String> {
          private String name;
          private String status;  // ❌ 与基类 status 同名且 private → 遮蔽
      }
    example_good: |
      // ✅ 正确：继承 MpBaseEntity，不重名字段
      @Data
      @SuperBuilder
      @NoArgsConstructor
      @EqualsAndHashCode(callSupper = true)
      public class Company extends MpBaseEntity<String> {
          private String name;
          // status 直接使用基类继承的
      }

      // ✅ 正确：复合主键表（豁免说明）
      @Data
      @TableName("ydsz_agt_trace_step")
      public class AgentTraceStep extends MpBaseEntity<String> {
          // 该表使用 (trace_id, step_index) 复合业务键，
          // 不使用 BaseMapper，继承字段不参与持久化
      }

      // ✅ 正确：TypeHandler 豁免
      @Data
      public class UserAccount extends MpBaseEntity<String> {
          /**
           * 账号状态（DB 整型列 0/1，历史遗留，通过 IntegerStringTypeHandler 自动转换）。
           * TODO: 后续迁移为 VARCHAR 枚举值后可移除此覆盖。
           */
          @TableField(value = "status", typeHandler = IntegerStringTypeHandler.class)
          private String status;
      }
    source: "编码规范 §34.1、§34.6（新增）、架构委员会 26.10.02 决议"

  # ============================================
  # 十、并发规范（3 条）
  # ============================================
  - id: "YDIZ-CONC-001"
    category: "concurrency"
    severity: "P0"
    title: "禁止业务代码自建线程池"
    description: |
      所有异步任务必须通过 ydsz-common-thread 模块统一管理，禁止业务代码直接 new ThreadPoolExecutor 或 ThreadPoolTaskExecutor。
      2026-09-23 扩展：Executors.newFixedThreadPool / newSingleThreadScheduledExecutor 等快捷工厂方法
      本质等价于直接实例化线程池，一并禁止（ArchUnit 已覆盖 java.util.concurrent.Executors 依赖检测）。
      ArchUnit 测试规则：业务模块（ydsz-*/src/main/java 下，ydsz-common-thread 自身豁免）禁止出现
      `new ThreadPoolExecutor(` 或 `new ScheduledThreadPoolExecutor(` 直接实例化，
      禁止依赖 java.util.concurrent.Executors 工厂类，
      必须通过 ThreadPoolExecutorFactory.getBean(name) 或 ExecutorUtils 获取命名线程池。
    pattern: "new ThreadPoolExecutor、new ThreadPoolTaskExecutor 或 Executors.new*（非 common-thread 模块）"
    exemption: |
      ydsz-common-thread 模块自身（框架内部实现）豁免。
      L1 零依赖模块（ydsz-common-util）手写一次性守护线程池豁免：需带 CHECKSTYLE.OFF: RegexpSinglelineJava 注释说明。
      @Configuration @Bean 方法内创建 ThreadPoolTaskScheduler/@ManagedExecutorService 并注册到 ThreadPoolRegistry
      且通过 yml 配置（ydsz.thread.pools.*）控制参数时豁免（如 cronjob-scheduler），需带 @SuppressWarnings("YDIZ-CONC-002") 声明。
    fix: |
      通过 ydsz-common-thread 声明式获取线程池：
      `ThreadPoolExecutor executor = ThreadPoolExecutorFactory.getBean("poolName");`
      或工具式创建：`ExecutorUtils.newDaemonFixedThreadPool(n, "prefix-")` / `ExecutorUtils.newScheduledThreadPool(n, "prefix-")`，
      或配置 `ydsz.thread.pools.<name>` 属性。
    example_bad: |
      // ydsz-agent/SubAgentExecutorPool.java
      // 违规：直接 new ThreadPoolExecutor 或 Executors 快捷工厂
      private final ThreadPoolExecutor executor = new ThreadPoolExecutor(
          2, 8, 60L, TimeUnit.SECONDS, new LinkedBlockingQueue<>(1000));
      private final ScheduledExecutorService scheduler = Executors.newSingleThreadScheduledExecutor();
    example_good: |
      // 通过 ydsz-common-thread 工厂获取
      private final ThreadPoolExecutor executor =
          ThreadPoolExecutorFactory.getBean("subAgentExecutor");
      private final ScheduledExecutorService scheduler =
          ExecutorUtils.newScheduledThreadPool(1, "sse-heartbeat-");
    source: "编码规范 16.4 节"

  - id: "YDIZ-CONC-002"
    category: "concurrency"
    severity: "P0"
    title: "ThreadLocal 必须在 finally 中 remove"
    description: "使用 ThreadLocal 必须在 finally 块中调用 remove() 清理。"
    pattern: "ThreadLocal.set() 无对应 finally { threadLocal.remove() }"
    fix: "在 finally 中添加 remove() 调用"
    source: "编码规范 16.1 节"

  - id: "YDIZ-CONC-003"
    category: "concurrency"
    severity: "P1"
    title: "正则表达式必须预编译为 static final"
    description: "禁止在循环中编译正则表达式，必须预编译为 static final Pattern。"
    pattern: "方法体内 Pattern.compile 非静态字段"
    fix: "提取为 private static final Pattern"
    source: "编码规范 21.1 节"

  # ---------- ydsz-common-thread 专项（26.09.30 新增）----------

  - id: "YDIZ-CONC-004"
    category: "concurrency"
    severity: "P1"
    title: "禁止通过反射获取 Executors.newVirtualThreadPerTaskExecutor()"
    description: >
      禁止通过反射字符串方法名获取 JDK 21 的 newVirtualThreadPerTaskExecutor()，
      应使用 com.njydsz.common.thread.util.ExecutorUtils.newVirtualThreadExecutor(prefix) 替代。
      反射调用脆弱（JDK 重命名则运行期NoSuchMethodException），且 IDE 无法静态检查。
    pattern: >
      Executors.class.getMethod\(\"newVirtualThreadPerTaskExecutor\"\)\.invoke
    fix: >
      替换为 com.njydsz.common.thread.util.ExecutorUtils.newVirtualThreadExecutor("xxx-");
      （如所在模块为 L1 可选依赖 ydzs-common-thread <optional>true</optional>）
    source: "ydsz-common-thread 全局引用分析 2026-09-30"

  - id: "YDIZ-CONC-005"
    category: "concurrency"
    severity: "P2"
    title: "禁止 PassThrough Wrapper 模式的线程池注册器"
    description: >
      禁止创建全部委托 com.njydsz.common.thread.registry.ThreadPoolRegistry 的包装类
      （如只重写 register/get/contains/unregister 的中间层）。
      调用方应直接 import com.njydsz.common.thread.registry.ThreadPoolRegistry，避免中间层导致链路复杂化。

      例外：包装类如额外包含本模块特有逻辑（如拒绝计数包装、作用域限定 shutdown），
      可保留但需在 Javadoc 中明确说明特有逻辑以避免误用。
    pattern: >
      自定义类中的 register/get/contains 方法 100% 委托 ThreadPoolRegistry
    fix: >
      删除 PassThrough 包装方法；直接 import ThreadPoolRegistry。
      如特有逻辑（拒绝计数、租户隔离 Bean 装配）需保留，在类 Javadoc 中明确说明。
    source: "ydsz-common-thread 全局引用分析 2026-09-30"

