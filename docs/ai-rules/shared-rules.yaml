  # ============================================
  # COMMON-009 ~ COMMON-013: AI 红线（本次全局引用分析补充）
  # ============================================
  - id: "YDIZ-COMMON-009"
    category: "common-reuse"
    severity: "P0"
    title: "【AI 红线】Redis 操作禁止使用 RedissonClient，必须通过 ydzz-common-redis"
    description: |
      禁止业务代码直接 import org.redisson.* 注入 RedissonClient。
      所有 Redis 操作必须通过 ydzz-common-redis 封装的类型安全接口：
      - 字符串/计数器：RedisStringOps（set/get/incr/decr/expire）
      - 哈希：RedisHashOps（hSet/hGet/hDel/hGetAll）
      - 列表：RedisListOps（lPush/lRange/lRem）
      - 集合：RedisSetOps（sAdd/sMembers/sRem）
      - 有序集合：RedisZSetOps（zAdd/zRange/zRem）
      - Pub/Sub：RedisPubSubOps（publish/subscribe）
    pattern: "直接 import org.redisson.api.RedissonClient / RBucket / RAtomicLong / RMap"
    fix: "注入对应 RedisXxxOps 接口"
    source: "P0-lock：Redisson → RedisStringOps 统一迁移"

  - id: "YDIZ-COMMON-010"
    category: "common-reuse"
    severity: "P0"
    title: "【AI 红线】JSON 操作禁止使用 Jackson ObjectMapper，必须使用 YdszJson"
    description: |
      禁止业务代码中直接 new ObjectMapper() 或注入 com.fasterxml.jackson.databind.ObjectMapper。
      所有 JSON 序列化/反序列化必须通过 ydzs-common-json 的 YdszJson：
      - 对象 → JSON：YdszJson.toJson(obj)
      - JSON → 对象：YdszJson.fromJson(json, Clazz.class)
      - JSON → Map：YdszJson.parseMap(json)
      - JSON → List：YdszJson.parseArray(json, elementClazz)
    pattern: "直接 import com.fasterxml.jackson.databind.ObjectMapper 或 new ObjectMapper()"
    fix: "使用 YdszJson.toJson/fromJson/parseMap/parseArray"
    source: "P1-1 修复：Jackson → YdszJson"

  - id: "YDIZ-COMMON-011"
    category: "common-reuse"
    severity: "P0"
    title: "【AI 红线】租户 ID 禁止从 @RequestHeader 获取，必须使用 AuthContextUtils"
    description: |
      禁止 Controller 方法参数中使用 @RequestHeader("X-Tenant-Id") 手动获取租户 ID。
      所有需要租户 ID 的场景必须通过 AuthContextUtils.getTenantIdOrDefault() 获取，
      保证租户解析逻辑统一、安全、可测试。
    pattern: "@RequestHeader.*X-Tenant-Id 或 @RequestHeader.*tenant"
    fix: "String tenantId = AuthContextUtils.getTenantIdOrDefault();"
    source: "P0-2 修复：手动租户解析 → AuthContextUtils"

  - id: "YDIZ-COMMON-012"
    category: "common-reuse"
    severity: "P1"
    title: "【AI 红线】JDBC 元数据探索禁止直接调用 DatabaseMetaData，必须通过 JdbcSchemaExplorer"
    description: |
      禁止业务代码直接使用 java.sql.DatabaseMetaData / Connection.getMetaData() 获取表/列/索引元数据。
      必须通过 ydzz-common-jdbc 的 JdbcSchemaExplorer 统一探索接口。
    pattern: "直接调用 connection.getMetaData() 或 DatabaseMetaData.getColumns/getTables"
    fix: "注入 JdbcSchemaExplorer"
    source: "P2-jdbc-explorer：统一 JDBC 元数据探索"

  - id: "YDIZ-COMMON-013"
    category: "common-reuse"
    severity: "P1"
    title: "【AI 红线】配额计数器禁止直接使用 Redis INCR/DECR，必须通过 QuotaCounter"
    description: |
      禁止业务代码自行编写 Redis INCR/DECR + 本地降级逻辑实现租户用量统计。
      必须使用 ydzz-common-safe 的 QuotaCounter，该组件提供：
      - 首次 INCR 自动设 TTL
      - DECR 带下限保护（floor）
      - Redis 异常自动降级到本地 AtomicLong
      - 统一 key 前缀管理
    pattern: "自行编写 Redis INCR/DECR + try-catch + AtomicLong 降级实现租户计数"
    fix: "注入 QuotaCounter"
    source: "P2-quota：QuotaCounter 抽象下沉至 common-safe"

  # ============================================
  # 十三、安全规范（3 条，P0+P1+P1）
  # ============================================
  - id: "YDIZ-SEC-001"
    category: "security"
    severity: "P0"
    title: "禁止 SQL 字符串拼接（SQL 注入）"
    description: "禁止拼接 SQL 字符串，必须使用参数化查询（MyBatis #{}）。"
    pattern: "MyBatis XML 或注解中使用 ${} 拼接用户输入"
    fix: "改用 #{} 参数化绑定"
    source: "编码规范 19.3 节"

  - id: "YDIZ-SEC-002"
    category: "security"
    severity: "P1"
    title: "禁止日志打印敏感信息"
    description: "禁止在日志中打印密码、Token、密钥、API Key 等敏感信息。"
    pattern: "log 中出现 password/token/secret/apiKey 等敏感值"
    fix: "脱敏处理后打印或直接省略"
    source: "编码规范 13 章"

  - id: "YDIZ-SEC-003"
    category: "security"
    severity: "P1"
    title: "禁止新建签名工具类，必须使用 auth InternalHeaderSigner / DigestUtils"
    description: |
      签名/哈希操作必须使用统一的工具类，禁止在业务模块中自行实现 HMAC-SHA256 / SHA-256 签名逻辑。

      **必须使用**：
      - 内部请求头签名：`com.njydsz.common.auth.security.InternalHeaderSigner`（sign + verify，HMAC-SHA256）
      - 通用哈希/HMAC：`com.njydsz.common.util.security.DigestUtils`（sha256Hex/sha1Hex/hmacSha256Base64/constantTimeEquals 等）

      **为什么禁止自建**：
      - 项目存在至少 5 处签名实现碎片化（auth InternalHeaderSigner / web InternalSignatureFilter / safe ApiSignatureFilter / feign SignatureUtils / notify DingTalkSignUtil），密钥管理和算法选择各自为政
      - 自建签名容易出现密钥硬编码、算法不一致、缺少恒定时间比较等安全隐患

      **适用范围**：所有新增签名/验签/HMAC 场景。
      例外：第三方平台要求特定签名算法（如钉钉/企微官方 SDK）无法复用通用工具时，需在注释中说明 YDIZ-SEC-003 例外原因。
    pattern: "自行 new HmacUtils / 手写 HMAC-SHA256 拼接 / MessageDigest.getInstance(\"SHA-256\") 直接调用"
    fix: "改用 DigestUtils.hmacSha256Base64/hex 或 InternalHeaderSigner"
    source: "ydsz-common-auth 全局引用分析报告（YDIZ-SEC-003，P1，26.09.30 签名体系碎片化治理）"

  # ============================================
  # 十四、编译器警告处理规范（1 条，P0）
  # ============================================
  - id: "YDIZ-WARN-001"
    category: "warnings"
    severity: "P0"
    title: "【强制】禁止使用 @SuppressWarnings 抑制告警，应直接修复根因"
    description: |
      警告是编译器帮助发现潜在问题的机制，必须通过修复代码根因来解决，而非简单抑制。
      AI 编码时严禁生成 @SuppressWarnings 注解来'消除'告警，必须从代码层面彻底解决问题。

      **禁止抑制的情形及正确做法**：
      - unchecked 警告 → 使用泛型明确类型，改用 TypeReference、Class.cast() 等类型安全方式
      - unused 警告 → 删除未使用代码，如因框架要求保留需添加注释说明理由
      - rawtypes 警告 → 补充完整泛型参数，避免使用原始类型
      - PMD/NullAway 等工具告警 → 修复底层代码问题

      **允许保留的例外情形（需紧跟注释说明原因）**：
      1. @SuperBuilder（Lombok）场景 — Lombok 生成代码触发 unchecked 警告且无法在源码层面修复
      2. 核心基础模块为兼容旧版 API 的 deprecation 警告（需注明兼容目的和版本）
      3. 泛型擦除导致编译期无法验证的类型转换（如 Class<?> → Class<T>）
      4. 调用第三方库 API 返回原始类型（如 JSqlParser、反射 Method.invoke() 等）

      所有允许保留的 @SuppressWarnings 必须紧跟单行注释说明具体原因。
    pattern: "代码中出现 @SuppressWarnings 注解"
    example_bad: |
      // ❌ 用注解掩盖类型安全问题
      @SuppressWarnings("unchecked")
      public Map<String, Object> parseJson(String json) {
          return objectMapper.readValue(json, Map.class);
      }

      // ❌ 用注解保留无用代码
      @SuppressWarnings("unused")
      private void deprecatedMethod() { }
    example_good: |
      // ✅ 使用 TypeReference 解决类型安全问题
      public Map<String, Object> parseJson(String json) {
          return objectMapper.readValue(json, new TypeReference<Map<String, Object>>() {});
      }

      // ✅ 删除无用代码

      // ✅ @SuperBuilder 场景允许使用（例外）
      @SuppressWarnings("unchecked") // @SuperBuilder 生成的代码触发 unchecked 警告，Lombok 层面无法修复
      @Data @SuperBuilder
      public class UserAccount { private String username; }
    fix: |
      1. 识别警告根本原因
      2. 优先通过代码重构/类型精确化解决
      3. 仅当确属允许例外时保留，并添加注释说明原因
      4. CR 时重点审查所有 @SuppressWarnings
    source: "编码规范 §6.10（强制）"

