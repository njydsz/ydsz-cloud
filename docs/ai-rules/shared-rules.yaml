  # ============================================
  # 九、Domain 能力域利用率（3 条，P1×3，26.09.30 ydzs-common-domain 全局引用分析专项）
  # ============================================
  - id: "YDIZ-DOMAIN-001"
    category: "domain"
    severity: "P1"
    title: "【严重】禁止直接使用 QueryWrapper.orderByXxx(String) 字符串排序，必须使用 PageQuery.addOrder + OrderItem"
    description: |
      在 Mapper/Repository 实现层，禁止使用以下硬编码字符串排序方式：
      - QueryWrapper.orderByAsc("column")
      - QueryWrapper.orderByDesc("column")
      - QueryWrapper.orderBy(true/false, "column")
      - 直接拼接 ORDER BY 片段（wrapper.last("ORDER BY ..."))

      **为什么必须使用 OrderItem**：
      - OrderItem 是不可变值对象（column + direction + 预计算 SQL），消除字符串拼接的 SQL 注入隐患
      - PageQuery.addAscOrder/addDescOrder 已内置 SQL 注入校验（字母数字下划线+点号白名单）
      - 配合 OrderItemsInjector 统一将排序条件注入 QueryWrapper，保持 infra 层代码整洁
      - 排序逻辑外置到 Query 参数对象后，Repository 只做基础条件组装，职责更清晰

      **正确做法**：
      1. Controller/Service 层通过 PageQuery.addAscOrder("created_at") 传递排序
      2. Repository 层通过 OrderItemsInjector.apply(query, wrapper) 统一注入
      3. 禁止在 Repository 中直接调用任何 orderBy 方法

      **约束范围**：所有 ydzs-{module}-infra 层的 Repository/Mapper 实现。
      domain 层的 OrderItem 定义/SafeQueryInnerInterceptor 不受此约束。
    pattern: 'orderBy(Asc|Desc|)\(|wrapper\.last\("ORDER BY'
    fix: |
      1. 移除 infra 层所有 orderByAsc/orderByDesc 调用
      2. 在 Repository 通用基类或 AOP 切面中增加 OrderItemsInjector.apply(pageQuery, wrapper)
      3. 排序条件统一通过 PageQuery.addAscOrder/addDescOrder 从 Service 层传入
    example_bad: |
      ❌ Repository 硬编码字符串排序
      QueryWrapper<User> wrapper = new QueryWrapper<>();
      wrapper.orderByDesc("created_at");
      wrapper.orderByAsc("user_name");
      return mapper.selectPage(page, wrapper);
    example_good: |
      ✅ Service 传入排序参数 + Repository 注入器
      // Service 层
      query.addDescOrder("created_at");
      query.addAscOrder("user_name");
      return repository.findPage(query);

      // Repository 层
      QueryWrapper<User> wrapper = buildCondition(query);
      OrderItemsInjector.apply(query, wrapper);
      return mapper.selectPage(page, wrapper);
    source: "ydsz-common-domain 全局引用分析（YDIZ-DOMAIN-001，P1，26.09.30 OrderItem 排序收敛专项）"

  - id: "YDIZ-DOMAIN-002"
    category: "domain"
    severity: "P0"
    title: "【强制】树构建必须使用 TreeBuilder.buildSimple() 统一入口，禁止使用已废弃的 TreeNode 基类"
    description: |
      `TreeNode` 基类、`TreeNodeProvider` SPI、`TreeBuilder.build()` 和 `buildLazy()` 已于 26.09.30 移除。
      树构建唯一入口为 `TreeBuilder.buildSimple(flatList, idExtractor, parentIdExtractor, childrenSetter, sortExtractor)`。

      **约束**：
      - 禁止 `extends TreeNode<...>`（TreeNode 类已不存在）
      - 禁止 `new TreeBuilder<>()` 实例化（TreeBuilder 为 final 静态工具类）
      - 禁止调用 `TreeBuilder.build()` 或 `buildLazy()`（已移除）
      - 禁止实现 `TreeNodeProvider` 接口（已移除）
      - 所有树形结构统一使用 `TreeBuilder.buildSimple()` 静态方法 + 纯 POJO
    pattern: 'extends TreeNode<'
    fix: |
      使用 TreeBuilder.buildSimple(list, VO::getId, VO::getParentId, VO::setChildren, VO::getSort) 构建树。
      level/path 可在构建后由调用方自行填充（如有需要）。
    example_bad: |
      ❌ 继承已废弃的 TreeNode（编译错误）
      @Data
      public class MenuVO extends TreeNode<MenuVO, String> {
          private String menuName;
      }
    example_good: |
      ✅ 纯 POJO + buildSimple
      @Data
      public class MenuVO {
          private String id;
          private String parentId;
          private List<MenuVO> children;
          private Integer sort;
          private String menuName;
      }
      // 构建
      List<MenuVO> tree = TreeBuilder.buildSimple(list,
          MenuVO::getId, MenuVO::getParentId, MenuVO::setChildren, VO::getSort);
    source: "ydsz-common-domain 弃用代码清理（YDIZ-DOMAIN-002，P0，26.09.30 TreeNode 已删除）"

  - id: "YDIZ-DOMAIN-003"
    category: "domain"
    severity: "P1"
    title: "【严重】禁止绕过 PageQuery 直接构造 offset/limit 分页参数，深度分页治理必须主动感知"
    description: |
      ydzs-common-domain 提供完整的深度分页防护能力：
      - PageQueryRiskAssessor.assess(query) — 主动风险评估入口
      - DeepPaginationRisk.assess(offset) — 静态风险评估（SAFE/WARN/REJECT）
      - DeepPaginationException — 拒绝异常（含 i18n key + 参数）
      - SafeQueryInnerInterceptor — 拦截器被动保护

      当前全业务模块 0 处主动调用 PageQueryRiskAssessor，
      深度分页保护完全依赖 jdbc 拦截器被动触发，存在以下盲区：
      - 缓存层（Caffeine/YdszCache）无法感知深度分页风险
      - 业务层无法在 offset 接近阈值时主动降级（改用游标分页）
      - Sentry 监控缺少 deep_pagination 维度 tag，无法精准告警

      **为什么必须主动感知**：
      - 拦截器在 SQL 执行前触发，缓存层无法受益
      - 主动调用可在 Service 层 WARN 时打 Sentry 埋点，积累性能指标
      - 业务层可在 WARN 时向用户返回「建议改用游标分页」提示

      **约束范围**：所有 PageQuery 子类的分页查询方法。原生 SQL 分页同理。
    pattern: 'setOffset\(|setLimit\(|\.offset\(|\.limit\('
    fix: |
      1. 在 PageQuery.getOffset() 内置 PageQueryRiskAssessor.assess(this) 调用
      2. WARN 级别自动通过 Sentry 打 tag "deep_pagination:warn"
      3. Service 层可覆写 onDeepPaginationWarn() 实现自定义降级逻辑
      4. 禁止在业务代码中手动计算 (pageNum-1)*pageSize 作为 offset
    example_bad: |
      ❌ 手动构造分页参数
      int offset = (query.getPageNum() - 1) * query.getPageSize();
      List list = mapper.findByOffset(offset, query.getPageSize());

      ❌ 绕过 PageQuery
      Page<Object> page = new Page<>(1, 20);
      wrapper.last("LIMIT 20 OFFSET 10000");
    example_good: |
      ✅ 使用 PageQuery 标准分页
      IPage<Entity> result = mapper.selectPage(
          new Page<>(query.getPageNum(), query.getPageSize()), wrapper);
      // getOffset() 自动触发 WARN 级 Sentry 埋点

      ✅ 主动评估（Service 层）
      DeepPaginationRisk risk = PageQueryRiskAssessor.assess(query);
      if (risk == DeepPaginationRisk.WARN) {
          log.warn("接近深度分页阈值，建议改用游标分页");
      }
    source: "ydsz-common-domain 全局引用分析（YDIZ-DOMAIN-003，P1，26.09.30 深度分页主动感知专项）"

  # ============================================
  # ydsz-common-cache 全局引用分析整改（2 条，P1+P2，26.09.29）
  # ============================================
  - id: "YDIZ-COMMON-048"
    severity: "P1"
    category: "common-reuse"
    title: "【严重】缓存键必须使用 CacheKeyBuilder 构造，禁止手工拼接 \"ydsz:\" 前缀"
    description: |
      所有业务模块（ydsz-system、ydsz-userinfo、ydsz-message、ydsz-workflow、ydsz-cronjob、
      ydzs-nextwiki、ydsz-literule、ydsz-agent、ydsz-generator、ydsz-gateway）的缓存键
      （本地 YdszCache key、Redis key、Pub/Sub channel 名等）必须通过 ydzz-common-cache 提供的
      `AbstractModuleCacheKeyBuilder` 子类或 `CacheKeyBuilder.build(module, entity, id)` 构造。

      **统一键格式**：`ydsz:{tenantId}:{module}:{entity}:{id}`

      **为什么必须使用 CacheKeyBuilder**：
      - 自动注入租户隔离（multiTenant 模块自动追加 tenantId 段）
      - 禁用 `static final String KEY_PREFIX = "xxx:"` 自建常量（各模块碎片化定义导致同义键格式不统一）
      - 通过 `TenantIdResolver` SPI 解耦租户上下文获取逻辑，异步场景（MQ Consumer / @Async）空指针安全
      - 模块新增 `CacheKeyBuilder` 类后需被 ≥1 个 Spring Bean 注入并实际调用，禁止建而不用

      **已知合理例外**：
      - L1 本地缓存内部 key（`YdszCache` 实例 name 属性，仅本地 Map 标识不跨进程，可不用标准格式，但推荐统一）
      - Redis key 格式已有兼容存量数据（如 `cronjob:cache:job:`），应维持既有格式避免缓存雪崩，但需文档说明
      - 框架内部（ydzsz-common-* L1 子模块）因层级依赖约束可自建内部格式

      **修复方式**：
      1. 为未建 CacheKeyBuilder 的业务模块新建 `CacheKeyBuilder extends AbstractModuleCacheKeyBuilder` @Component 类
      2. 替换所有 `static final String XXX_KEY_PREFIX = "xxx:"` 常量为 CacheKeyBuilder 方法调用
      3. 注入 `CacheKeyBuilder` 替代直接字符串拼接
      4. grep 确认零残留硬编码前缀（`"_KEY_PREFIX\\s*=\\s*\"(ydsz:|userinfo:|message:)"`）
    pattern: '(private|public)\s+static\s+final\s+String\s+\w*KEY\w*PREFIX\s*=\s*"(ydsz:|userinfo:|message:|cronjob:|agent:|gateway:|oauth2:)'
    fix: |
      1. 为模块新建或补充 `CacheKeyBuilder extends AbstractModuleCacheKeyBuilder` @Component 类
      2. 添加对应实体/操作的缓存键构造方法（如 `public String entityName(String id) { return buildKey("entity", id); }`）
      3. 在业务类中添加 `private final CacheKeyBuilder cacheKeyBuilder;` 字段
      4. 替换所有 `XXX_KEY_PREFIX + param` 为 `cacheKeyBuilder.entityName(param)`
    example_bad: |
      ❌ 自建硬编码 key 前缀常量
      private static final String DND_KEY_PREFIX = "dnd:";
      private static final String USER_ROLES_KEY_PREFIX = "userinfo:roles:";
      // ... 调用处
      redisStringOps.set(DND_KEY_PREFIX + userId, value);
    example_good: |
      ✅ 通过 CacheKeyBuilder 统一构造
      // CacheKeyBuilder.java
      @Component("messageCacheKeyBuilder")
      public class CacheKeyBuilder extends AbstractModuleCacheKeyBuilder {
        public CacheKeyBuilder() { super("message"); }
        public String dnd(String userId) { return buildKey("dnd", userId); }
        public String userRoles(String userId) { return buildKey("roles", userId); }
      }
      // 业务类中注入并调用
      private final CacheKeyBuilder cacheKeyBuilder;
      redisStringOps.set(cacheKeyBuilder.dnd(userId), value);
    source: "ydsz-common-cache 全局引用分析整改（YDIZ-COMMON-048，P1，26.09.29 CacheKeyBuilder 全覆盖）"
    exception: "ydz-common L1 子模块内部、存量 Redis key 格式兼容场景（需文档说明）"

  - id: "YDIZ-COMMON-049"
    severity: "P2"
    category: "common-reuse"
    title: "【建议】@YdszCacheable 注解启用时必须配 YdszCacheManager，禁止自建 CacheManager"
    description: |
      业务模块使用 `@YdszCacheable` / `@YdszCacheEvict` / `@YdszCachePut` 注解驱动缓存时，
      必须同时装配 `YdszCacheAutoConfiguration`（包含 YdszCacheManager），
      确保底层缓存管理器由 ydsz-common-cache 统一管理，禁止自行实现 `CacheManager` 接口。

      **为什么建议统一管理**：
      - YdszCacheManager 注册 Micrometer 指标（命中率、未命中率、加载耗时），自建 CacheManager 监控盲区
      - YdszCacheManager 自动执行 CacheWarmer 预热逻辑，自建则无预热能力
      - CacheHealthIndicator / CacheActuator Endpoint 通过 YdszCacheManager 遍历所有 Cache 实例，自建实例不可见
      - 一致性 hash 失效、全局清空等运维操作依赖 YdszCacheManager 枚举所有缓存

      **实际数据**：当前仅 system 模块启用 @YdszCacheable 体系（6 处），workflow/nextwiki/cronjob 等模块
      皆直接操作 YdszCache API 绕过注解驱动。不建议强制迁移，但新接入缓存场景优先使用注解驱动。

      **推荐模式**：系统配置 / 字典 / 变量等 key-value 型缓存优先使用 `@YdszCacheable` + YdszCacheManager。
      对象集合缓存（如流程节点列表、LLM 响应缓存）因 value 结构复杂，可直接使用 YdszCache API。

      **修复方式**：
      1. 确认模块 pom.xml 已声明 ydzs-common-cache 依赖
      2. 在配置类添加 `@Import(YdszCacheAutoConfiguration.class)` 或确保自动装配生效
      3. 定义 CacheConstants 常量类管理缓存名（与 @Cacheable value 对齐）
      4. 在 Service 方法上添加 `@Cacheable(value = CacheConstants.XXX_CACHE, key = "@cacheKeyBuilder.method(#param)")`
    pattern: 'implements\s+CacheManager|extends\s+AbstractCacheManager'
    fix: |
      1. 删除自建 CacheManager 实现类
      2. 引入 YdszCacheAutoConfiguration 自动装配
      3. 替换手动 YdszCache.newBuilder() 调用为 @Cacheable 注解
      4. 复杂 value 场景保留 YdszCache API 直接操作
    example_bad: |
      ❌ 自建 CacheManager
      @Configuration
      public class CustomCacheConfig implements CacheManager {
          @Override
          public Cache getCache(String name) { ... }
      }
    example_good: |
      ✅ 统一 YdszCacheManager
      // 无需显式声明，YdszCacheAutoConfiguration 自动装配
      @Service
      @RequiredArgsConstructor
      public class ConfigServiceImpl {
        private final CacheKeyBuilder cacheKeyBuilder;

        @Cacheable(
            value = SystemCacheConstants.SYSTEM_CONFIG_CACHE,
            key = "@cacheKeyBuilder.configValue(#p0)")
        public String getConfigValue(String configKey) { ... }
      }
    source: "ydsz-common-cache 全局引用分析整改（YDIZ-COMMON-049，P2，26.09.29 YdszCacheManager 统一治理）"
    exception: "复杂 value 结构缓存（VO 集合、多级索引）可使用 YdszCache API 直接操作"

  # ============================================
  # 九、异常体系统一（26.09.30 新增 YDIZ-COMMON-050~052，+3 规则）
  # ============================================
  - id: "YDIZ-COMMON-050"
    severity: "P1"
    category: "common-reuse"
    title: "【强制】L1/L2 框架模块异常必须使用 InfraException，禁止直接 extends RuntimeException"
    description: |
      ydzs-common 的 L1/L2 工具模块（ydsz-common-util、ydsz-common-json、ydsz-common-excel、
      ydzs-common-safe、ydsz-common-redis、ydsz-common-file 等）定义的自定义异常，
      必须继承 `com.njydsz.common.exception.custom.InfraException`，**禁止直接 extends
      RuntimeException / Exception**。

      **为什么强制统一入口**：
      - InfraException 继承 AbstractYdszException，内置 i18n DCL 缓存、异常码、HTTP 状态码、级别、分类等完整元数据
      - 统一入口后，全局异常处理器（MvcExceptionHandler / WebFluxExceptionHandler）可通过 instanceof 精确识别
      - InfraException 默认 HTTP 500 / ERROR / SYSTEM 分类，符合框架层基础设施故障语义
      - 保留完整的异常链（initCause），不丢失原始堆栈

      **InfraException vs SysException vs BusinessException 选型**：

      | 类 | 适用场景 | HTTP 状态 | 默认分类 |
      |---|---|---|---|
      | InfraException | L1/L2 框架/工具层基础故障（缓存、JSON、加密、Redis、文件） | 500 | SYSTEM |
      | SysException | server 层系统异常（数据库、MQ、外部服务、调度） | 500 | SYSTEM |
      | BusinessException | 业务规则校验、参数校验、权限、限流 | 400/403/409/429 | BUSINESS/PERMISSION/RESOURCE |
    pattern: 'class\s+\w+Exception\s+extends\s+(?:RuntimeException|Exception)(?!\s*extends\s*InfraException)'
    fix: |
      1. 将 `extends RuntimeException` 改为 `extends InfraException`
      2. 添加 `import com.njydsz.common.exception.custom.InfraException;`
      3. 保留所有现有构造器签名（InfraException 提供 super(message) 和 super(message, cause) 兼容）
      4. L1 模块（util/json/cache/excel）因分层约束不引入 ydzs-common-exception 依赖，保持 RuntimeException 不变
    example_bad: |
      ❌ 直接 extends RuntimeException
      public class RedisOperationException extends RuntimeException {
        public RedisOperationException(String message) { super(message); }
      }
    example_good: |
      ✅ 统一继承 InfraException
      public class RedisOperationException extends InfraException {
        private static final long serialVersionUID = 1L;
        public RedisOperationException(String message, Throwable cause) {
          super(message, cause);
        }
      }
    source: "ydsz-common-exception 全局引用分析整改（YDIZ-COMMON-050，P1，26.09.30 InfraException 统一体系）"
    exception: "L1 模块（util/json/cache/excel）因分层约束可保持 RuntimeException，不需引入 ydzs-common-exception 依赖"

  - id: "YDIZ-COMMON-051"
    severity: "P1"
    category: "common-reuse"
    title: "【强制】catch 底层异常后应转换为 BusinessException/SysException/InfraException，禁止原样 rethrow RuntimeException"
    description: |
      Service 层调用外部依赖（数据库、RPC、Redis、文件系统、第三方 SDK）时，catch 的底层异常
      （SQLException、IOException、TimeoutException、RuntimeException 等）**必须转换为统一的
      AbstractYdszException 子类**后向上抛出，**禁止直接 rethrow 底层 RuntimeException**。

      **为什么禁止穿透**：
      - 底层 RuntimeException（如 NullPointerException、ClassCastException）暴露给调用方会泄露实现细节
      - 全局异常处理器对未知 RuntimeException 返回 HTTP 500 + 兜底文案，丢失业务语义
      - 转换后可携带统一的错误码（前端/调用方可按码处理）和 i18n 文案（用户可读）
      - 便于异常指标统计按业务维度聚合

      **转换规则**：
      - 数据库异常（SQLException / DataAccessException）→ `SysException.of(CoreExceptionCode.DATABASE_ERROR, cause)`
      - RPC/Feign 异常（ClientException / FeignException）→ `SysException.of(CoreExceptionCode.EXTERNAL_SERVICE_ERROR, cause)`
      - Redis 异常（RedisConnectionFailureException 等）→ `InfraException.builder().code("REDIS_ERROR").cause(cause).build()`
      - 文件 IO 异常（IOException）→ `InfraException.builder().key("storage.error").cause(cause).build()`
      - 参数校验异常（IllegalArgumentException）→ `BusinessException(ExceptionCodeEnum.PARAM_ERROR, cause)`
      - 业务规则冲突（数据已存在 / 状态非法）→ `BusinessException(ExceptionCodeEnum.DATA_CONFLICT, cause)`
    pattern: 'catch\s*\(\s*(?:Runtime|IO|SQL|DataAccess|IllegalArgument|IllegalState)Exception\s+\w+\s*\)\s*\{[^}]*throw\s+\w+\s*;'
    fix: |
      1. 定位 catch 块中直接 `throw e;` 的位置
      2. 判断异常来源（数据库/RPC/缓存/文件/参数）
      3. 选择合适的包装类型（SysException/InfraException/BusinessException）
      4. 传入 cause 保留堆栈链
      5. 使用 log.error 记录错误（带 `{}` 占位符）
    example_bad: |
      ❌ 直接 rethrow 底层异常
      try {
        redisTemplate.opsForValue().set(key, value);
      } catch (RedisException e) {
        throw e;
      }
    example_good: |
      ✅ 转换为统一的 InfraException
      try {
        redisTemplate.opsForValue().set(key, value);
      } catch (RedisException e) {
        throw InfraException.builder()
            .code("REDIS_SET_ERROR")
            .key("redis.operation.error")
            .cause(e)
            .build();
      }
    source: "exception 体系利用率专项（YDIZ-COMMON-051，P1，26.09.30 RuntimeException 穿透防护）"
    exception: "业务模块 server 层 SysException/InfraException 可直接向上抛出（全局异常处理器能正确处理）"

  - id: "YDIZ-COMMON-052"
    severity: "P2"
    category: "common-reuse"
    title: "【建议】InfraException 默认 i18n key 为 infra.error，各模块可按需覆盖"
    description: |
      使用 `InfraException` 抛出基础设施异常时，**建议**为每个异常类指定默认的 i18n 消息 key，
      确保内嵌文案在英文/中文/繁体环境下可读。

      **默认 i18n key 规范**：
      - 通用基础设施错误（未知类型）：`infra.error` = "Infrastructure error, please try again later"
      - JSON 解析失败：`json.parse.error` / `json.serialize.error`
      - 缓存操作失败：`cache.load.error` / `cache.write.error`
      - Excel 读写失败：`excel.read.error` / `excel.write.error`
      - 加解密失败：`crypto.error`
      - Redis 操作失败：`redis.operation.error`
      - 幂等服务不可用：`idempotent.unavailable`

      **为什么建议 i18n 覆盖**：
      - InfraException 默认构造函数使用 key=`infra.error` 作为兜底，能保证不返回空消息
      - 具体业务场景提供精确的 i18n key，前端可据此展示针对性文案
      - 符合 EXCEPT-002 规范（异常消息必须走 i18n key）
    pattern: 'new\s+InfraException\(\s*[^k]*\)'
    source: "exception 体系利用率专项（YDIZ-COMMON-052，P2，26.09.30 默认 key infra.error 治理）"
    exception: "仅供框架内部用户无法定位精确 key 的场景；业务模块应优先使用精确 key"

  # ============================================
  # 十三、ydsz-common-jdbc 全局引用分析专项（2 条，26.09.30）
  # ============================================
  - id: "JDIZ-JDBC-001"
    category: "jdbc"
    severity: "P1"
    title: "【严重】分页查询必须使用 PageResponses 统一包装"
    description: |
      所有业务模块的 Service 层分页查询方法必须使用
      com.njydsz.common.jdbc.support.PageResponses 进行响应包装，
      返回分页数据时禁止直接返回 IPAGE<T>、PAGE<T> 等 MP 原始类型。

      **强制用法**：
      PageResponse<T> result = PageResponses.success(page);
      return result;

      **统一响应结构**：
      PageResponses 包装后的响应包含 pageNo、pageSize、totalPages、totalCount、records
      字段，前端可据此统一处理分页逻辑。

      **为什么必须统一包装**：
      - 各模块分页响应体结构不一致（有的叫 list、有的叫 records、有的叫 items），前端拦截器难以统一处理
      - 未包装的 IPAGE 对象可能暴露内部实现细节
      - 符合 DDD 分层原则：Server 层返回业务语义明确的 VO/Response，不暴露 ORM 框架类型

      **适用范围**：所有 9 个业务模块 + generator 的 Service/Repository 层分页方法
    pattern: 'return\s+(new\s+)?(IPage|Page)<[^>]+>\s*\('
    source: "ydsz-common-jdbc 全局引用分析（JDIZ-JDBC-001，P1，26.09.30 PageResponses 仅 nextwiki 3 文件 8 调用，其余 8 模块未使用）"
    exception: "Repository 内部实现层可直接返回 IPAGE<T>，但 Service 返回前必须包装为 PageResponse<T>"

  - id: "JDIZ-JDBC-002"
    category: "jdbc"
    severity: "P1"
    title: "【严重】多租户场景必须激活数据权限拦截器"
    description: |
      所有启用多租户（ydsz.tenant.enabled=true）的业务模块的 bootstrap.yml
      必须配置 ydsz.jdbc.data-permission.enabled=true，激活 RowPermissionInnerInterceptor
      和 ColPermissionInnerInterceptor，实现行级与列级数据权限控制。
    source: "ydsz-common-jdbc 全局引用分析（JDIZ-JDBC-002，P1）"
    exception: "纯单租户模块（tenant.enabled=false）或公共只读端点无需启用"

  # ============================================
  # Feign 专项红线规则（YDIZ-FEIGN-001~005）
  # 来源：ydsz-common-feign 全局引用分析（26.10.01）
  # ============================================

  - id: "YDIZ-FEIGN-001"
    category: "feign"
    severity: "P0"
    title: "【强制】FeignClient 必须声明 fallbackFactory，禁止裸 Fallback"
    description: |
      所有 @FeignClient 接口必须配置 fallbackFactory 属性（非 fallback）。
      FallbackFactory 可获取触发降级的 cause，便于问题排查与差异返回。

      **正例**：
      @FeignClient(name = "ydsz-xxx", fallbackFactory = XxxFallbackFactory.class)

      **反例**：
      @FeignClient(name = "ydsz-xxx", fallback = XxxFallback.class)

      **为什么强制**：无法获取 cause 意味着降级时无法区分超时/熔断/网络异常，日志缺乏根因。
    pattern: '@FeignClient\s*\([^)]*fallback\s*=(?!.*fallbackFactory)'
    source: "ydsz-common-feign 全局引用分析（YDIZ-FEIGN-001，P0，26.10.01 fallbackFactory 使用率100%→强制保持）"
    exception: "无"

  - id: "YDIZ-FEIGN-002"
    category: "feign"
    severity: "P0"
    title: "【强制】禁止业务模块自建 RestTemplate/HttpClient 调用同 Nacos 注册域内的内部服务"
    description: |
      微服务之间的内部调用必须走 @FeignClient + ydsz-common-feign 体系。
      禁止使用 RestTemplate、OkHttp、JDK HttpClient 直接调用 Nacos 注册的中心内部服务，防止绕过熔断/重试/追踪/头透传等能力。

      **允许场景**：
      - 调用外部第三方服务（如阿里云、微信开放平台等）
      - ydzz-common-notify 模块中的第三方网关调用
      - Gateway 模块的 Reactor Netty HttpClient（WebFlux 专属）
      - ydzs-cronjob-server 的 ClusterMigrationClient（跨集群直连 URL 调用，不通过 Nacos 发现）

      **违规判据**：业务模块（ydsz-{module}-infra/server）直接 new RestTemplate/HttpClient 调用 ydzs-* 服务
        （Feign 可通过 Nacos 服务发现找到的）。
    pattern: 'new\s+RestTemplate\(|HttpClient\.newBuilder|OkHttpClient\s*\('
    source: "ydsz-common-feign 全局引用分析（YDIZ-FEIGN-002，P0，26.10.01 workflow HttpAgentServiceClient 已迁移至 Feign（P1-3 整改），cronjob ClusterMigrationClient 属跨集群直连例外）"
    exception: "ydsz-common-notify 第三方网关调用、xdz-gateway WebFlux Reactor HTTP 客户端、ydsz-cronjob-server 跨集群漂移 ClusterMigrationClient（直连远程集群 URL，不通过 Nacos 发现）"

  - id: "YDIZ-FEIGN-003"
    category: "feign"
    severity: "P1"
    title: "Feign HealthSnapshot 必须在 web 模块桥接到 Actuator"
    description: |
      每个业务模块的 web 层必须提供 FeignHealthIndicator，将 FeignHealthSnapshot.from(feignProperties)
      适配为 Spring Boot Actuator 的 HealthIndicator，对外暴露 Feign 模块完整健康度。

      **实现方式**：实现 HealthIndicator 接口，委托 FeignHealthSnapshot.from(feignProperties)，
      返回 Health.up/down().withDetails(snapshot.getDetails())。

      **为什么必须**：feign 模块的高级能力（熔断/隔离/限流/压缩）若无健康暴露，运维无法观测配置生效状态。
    pattern: "无一"
    source: "ydsz-common-feign 全局引用分析（YDIZ-FEIGN-003，P1，26.10.01 FeignHealthSnapshot 零消费）"
    exception: "纯后台服务（如 ydsz-generator-web 等）若无前端健康观测需求可延后"

  - id: "YDIZ-FEIGN-004"
    category: "feign"
    severity: "P1"
    title: "Feign 调用 FallbackFactory 错误消息必须走 I18n.message"
    description: |
      FallbackFactory 中返回给调用方的错误消息必须使用 I18n.message("module.xxx.unavailable") 国际化 key，
      禁止在 FallbackFactory 实现中硬编码中文/英文错误文案。

      **正例**：
      String msg = I18n.message("workflow.service.unavailable");
      return YdszResponse.error(FeignClientConstants.FEIGN_SERVICE_UNAVAILABLE, msg);

      **反例**：
      return YdszResponse.error(FeignClientConstants.FEIGN_SERVICE_UNAVAILABLE, "工作流服务不可用");

      **为什么**：FallbackFactory 可能被不同 Locale 的客户端调用，硬编码中文不满足 i18n 规则。
    pattern: 'FEIGN_SERVICE_UNAVAILABLE,\s*"[^"]*[\x{4e00}-\x{9fff}]'
    source: "ydsz-common-feign 全局引用分析（YDIZ-FEIGN-004，P1，26.10.01 8/14 FallbackFactory 中文硬编码）"
    exception: "无"

  - id: "YDIZ-FEIGN-005"
    category: "feign"
    severity: "P2"
    title: "ydsz-common-notify RestTemplate 必须使用 HttpComponentsClientHttpRequestFactory"
    description: |
      ydzz-common-notify 的 notifyRestTemplate Bean 必须使用 HttpComponentsClientHttpRequestFactory
      （Apache HttpClient 5），禁止使用 SimpleClientHttpRequestFactory（JDK HttpURLConnection 无连接池）。

      **为什么**：notifyRestTemplate 承载短信/第三方网关的高并发调用，SimpleClientHttpRequestFactory
      每次请求新建 TCP 连接，高并发下 TIME_WAIT 堆积。HikariCP 项目规范统一连接池管理。

      **配置示例**：
      HttpComponentsClientHttpRequestFactory factory = new HttpComponentsClientHttpRequestFactory();
      factory.setConnectTimeout(...);
      factory.setReadTimeout(...);
    pattern: 'SimpleClientHttpRequestFactory'
    source: "ydsz-common-feign 全局引用分析（YDIZ-FEIGN-005，P2，26.10.01 notifyRestTemplate 使用 JDK 无连接池工厂）"
    exception: "极低调用频率的内部工具 Bean（每分钟 < 1 次）"

  # ============================================
  # 十七、Sentry 监控规范（1 条，P0）
  # ============================================
  - id: "YDIZ-SENTRY-001"
    category: "sentry"
    severity: "P0"
    title: "【强制】禁止业务代码直接 import Micrometer API，必须通过 MetricsCollector SPI"
    description: |
      所有业务模块和 common 子模块的指标采集必须通过 `com.njydsz.common.sentry.spi.MetricsCollector` SPI
      或 `com.njydsz.common.sentry.adapter.SentryMetricsAdapter` 适配器上报，
      **严禁直接 import `io.micrometer.core.instrument.*`**。

      **为什么禁止直连 Micrometer**：
      - Micrometer 是底层监控抽象，直接耦合会导致指标治理碎片化（指标名不一致、前缀混乱、无统一采样/降级策略）
      - sentry 模块的 `MetricsCollector` SPI 支持可插拔底层实现（Micrometer / 内存计数 / 其他）
      - `SentryMetricsAdapter` 提供自动前缀拼接、Counter/Timer/Gauge 缓存、SentryService 集成等增强能力

      **正例**（新代码）：
      ```java
      // 方式1：直接注入 MetricsCollector（推荐新代码）
      @Component
      public class OrderMetricsCollector {
          private final MetricsCollector collector;
          public OrderMetricsCollector(MetricsCollector collector) { this.collector = collector; }

          public void incOrderCreated(String channel) {
              collector.incrementCounter("ydsz_order_created_total",
                  "订单创建总数", Map.of("channel", channel), 1.0);
          }
      }

      // 方式2：继承 SentryMetricsAdapter（兼容旧 AbstractModuleMetrics 风格）
      @Component("orderMetrics")
      public class OrderMetrics extends SentryMetricsAdapter {
          public OrderMetrics() { super("ydsz_order_"); }
          public void incOrderCreated(String channel) {
              incrementCounter("created_total", "channel", safe(channel));
          }
      }
      ```

      **反例**（违规）：
      ```java
      // 违规：直接 import Micrometer API
      import io.micrometer.core.instrument.Counter;
      import io.micrometer.core.instrument.MeterRegistry;

      @Component
      public class OrderMetrics {
          private final MeterRegistry registry;
          public void incOrderCreated() {
              Counter.builder("order.created").register(registry).increment();  // ❌ 直连 Micrometer
          }
      }
      ```

      **适用范围**：
      - 业务模块（ydsz-system/userinfo/message/workflow/cronjob/nextwiki/literule/agent/gateway/generator）：**强制**
      - common 子模块（ydsz-common-auth/cache/redis/safe/web/app/excel/thread/feign/jdbc/lock 等）：**强制**
      - ydzs-common-sentry 自身内部实现（如 MicrometerMetricsCollector）：**例外**，属于 SPI 底层实现

      **迁移路径**：现有直连代码分两批迁移：
      1. 优先迁移 auth/cache/redis/safe 四个安全关键模块（本次整改）
      2. 其余模块随功能迭代逐步迁移，新增代码**强制遵守**
    pattern: "import io\\.micrometer\\.core\\.instrument\\.(Counter|Timer|Gauge|MeterRegistry|DistributionSummary|LongTaskTimer|FunctionCounter|FunctionTimer|TimeGauge)"
    fix: |
      1. 删除 `import io.micrometer.core.instrument.*` 语句
      2. 注入 `MetricsCollector` 或修改类继承 `SentryMetricsAdapter`
      3. 将 `Counter.builder(...).register(registry)` 替换为 `collector.incrementCounter(name, desc, tags, amount)` 或 `incrementCounter(name, tags...)`
      4. 将 `Timer.builder(...).register(registry)` 替换为 `collector.recordTimer(name, desc, tags, duration)` 或 `recordTimer(...)`
      5. 将 `Gauge.builder(...).register(registry)` 替换为 `collector.setGauge(name, desc, tags, value)` 或 `gauge(...)`
    example_bad: |
      @Component
      public class AuthMetricsCollector {
          private final MeterRegistry meterRegistry;
          public AuthMetricsCollector(MeterRegistry meterRegistry) { this.meterRegistry = meterRegistry; }
          public void recordAuthSuccess(String userType, long durationNanos) {
              Counter.builder("auth.login.success").tag("user_type", userType).register(meterRegistry).increment();
          }
      }
    example_good: |
      @Component
      public class AuthMetricsCollector implements AuthMetrics {
          private final MetricsCollector collector;
          public AuthMetricsCollector(MetricsCollector collector) { this.collector = collector; }
          public void recordAuthSuccess(String userType, long durationNanos) {
              collector.incrementCounter("ydsz_auth_login_success_total",
                  "认证成功总数", Map.of("user_type", userType));
              collector.recordTimer("ydsz_auth_login_duration_ms",
                  "认证耗时", Map.of("user_type", userType), Duration.ofNanos(durationNanos) );
          }
      }
    source: "ydsz-common-sentry 全局引用分析（YDIZ-SENTRY-001，P0，26.10.01 18+ common 子模块直连 MeterRegistry）"
    exception: "ydsz-common-sentry 模块内部的 MicrometerMetricsCollector 实现（属于 SPI 底层实现）"

