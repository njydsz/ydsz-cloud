  - id: "YDIZ-COMMON-036"
    severity: "P1"
    category: "common-reuse"
    title: "【严重】获取当前登录用户信息必须使用 CurrentUser 统一模型"
    description: |
      Controller / Service 层获取当前登录用户信息时，必须使用 com.njydsz.common.core.model.CurrentUser
      统一模型，禁止从 RequestContext / SecurityContext / AuthContextUtils 多处分散取数。

      **为什么**：
      - CurrentUser 封装 userId / tenantId / roles / permissions / locale 完整维度
      - 分散取数导致同一用户信息在不同模块结构不同（有的用 loginName，有的用 username）
      - CurrentUser 与 RequestContext 集成，支持 TransmittableThreadLocal 跨线程传播

      **违反判据**：
      - 直接调用 `SecurityContextHolder.getContext().getAuthentication()` 获取用户
      - 从 HttpServletRequest Header 手动解析 Authorization 获取用户 ID
      - 注入 `AuthContextUtils` 后手动转换为用户对象
    pattern: "SecurityContextHolder\\.getContext|AuthContextUtils\\.getUserId[^D]|request\\.getHeader.*Authorization"
    fix: |
      1. Controller 方法注入 CurrentUser 参数（Spring 自动解析）或通过 RequestContext.getCurrentUser()
      2. CurrentUser 已有 userId / tenantId / roles / permissions / locale 标准字段
    example_good: |
      // Controller 层注入
      public YdszResponse<Void> create(@RequestBody XxxDto dto, CurrentUser currentUser) {
          String operatorId = currentUser.getUserId();
          String tenantId = currentUser.getTenantId();
      }
    source: "公共基础利用率提升（YDIZ-COMMON-036，P1，26.09.30 CurrentUser 统一上下文）"

  - id: "YDIZ-COMMON-037"
    severity: "P1"
    category: "common-reuse"
    title: "【严重】灰度 / 降级 / 实验开关必须使用 FeatureFlagService"
    description: |
      业务代码中实现灰度发布、功能降级、A/B 实验时，必须使用
      com.njydsz.common.core.feature.FeatureFlagService 或 ConfigDrivenFeatureFlagService，
      禁止使用硬编码布尔常量或自建简单的 Map 开关。

      **为什么**：
      - FeatureFlagService 支持热更新（Nacos/Apollo 配置中心动态推送）
      - ConfigDrivenFeatureFlagService 基于租户/用户/hash 多维度灰度
      - 硬编码开关需要重新部署才能变更，无法做到分钟级灰度切换

      **已接入模块**：agent（功能开关实验）
      **待接入模块**：cronjob（新调度算法灰度）、workflow（新节点类型灰度）、nextwiki（新存储引擎灰度）、message（新渠道灰度）

      **违反判据**：
      - `if (USE_NEW_ALGORITHM) { ... }` — 硬编码常量
      - `Map<String, Boolean> featureFlags = new HashMap<>()` — 自建开关
      - `@Value("${feature.xxx:false}") boolean isXxxEnabled` — 配置值但无法动态灰度
    pattern: "if\\s*\\(\\s*[A-Z_]*[Ff][Ee][Aa][Tt][Uu][Rr]|[A-Z_]*[Ff][Ll][Aa]\\s*\\)"
    fix: |
      1. 注入 FeatureFlagService
      2. featureFlagService.isEnabled("feature.xxx", context)
      3. 配置中心灰度规则（按 tenant / userId percentage）
    example_good: |
      // 正确：使用 FeatureFlagService
      if (featureFlagService.isEnabled("cronjob.new.scheduler", tenantContext)) {
          return newScheduler.execute(job);
      }
      return legacyScheduler.execute(job);
    source: "公共基础利用率提升（YDIZ-COMMON-037，P1，26.09.30 FeatureFlagService 灰度能力）"

  - id: "YDIZ-COMMON-038"
    severity: "P1"
    category: "common-reuse"
    title: "【严重】状态枚举必须继承 BaseStatusEnum"
    description: |
      业务模块的状态枚举（Status / State 枚举）必须继承 com.njydsz.common.domain.enums.BaseStatusEnum，
      禁止各自定义 ACTIVE/INACTIVE/ENABLED/DISABLED 魔法值。

      **为什么**：
      - BaseStatusEnum 提供统一的 code/description 接口
      - 统一状态码映射（前端可根据 code 判断状态流转）
      - 持久化层可通过 code 反序列化为枚举实例

      **现状**：当前各模块状态枚举大多自行定义，需逐步迁移至 extends BaseStatusEnum。

      **违反判据**：
      - `enum JobStatus { NORMAL, PAUSED, STOPPED }` — 未继承 BaseStatusEnum
      - 状态枚举中存在 static codeOf(String) 手动映射
    pattern: "enum\\s+\\w*(Status|State)\\s*\\{[^}]*(ACTIVE|INACTIVE|ENABLED|DISABLED)"
    fix: |
      1. 枚举改为 extends BaseStatusEnum
      2. 实现 getCode() / getDescription()
      3. 持久化改为枚举 code（而非 name）
    example_good: |
      // 正确：继承 BaseStatusEnum
      public enum MessageStatusEnum implements BaseStatusEnum {
          SUCCESS("SUCCESS", "已送达"),
          FAILED("FAILED", "发送失败");
          private final String code;
          private final String description;
      }
    source: "公共基础利用率提升（YDIZ-COMMON-038，P1，26.09.30 BaseStatusEnum 全覆盖）"

  - id: "YDIZ-COMMON-039"
    severity: "P2"
    category: "common-reuse"
    title: "【建议】批量操作结果返回必须使用 BatchBusinessException 或结构化 Result"
    description: |
      批量操作接口（批量删除 / 批量启停 / 批量导入）返回结果必须结构化，包含每条记录的成功/失败状态，
      禁止使用"一刀切"的全成功或全失败模式。

      **为什么**：
      - BatchBusinessException 支持 HTTP 207 Multi-Status
      - 前端可展示"成功 3 条，失败 2 条（原因：任务不存在）"
      - 用户可针对性重试失败条目

      **更适合的返回类型**：cronjob 现有 BatchResultDTO&lt;T&gt; 已满足需求，可继续使用结构化 DTO。

      **违反判据**：
      - `void batchDelete(List<String> ids)` — 无返回值，失败时全部回滚
      - 批量操作返回简单 `int successCount` 不含明细
    pattern: "void\\s+batch\w+\\(|int\\s+batch\w+\\("
    fix: |
      1. 返回类型改为 BatchResultDTO&lt;T&gt;
      2. 逐条处理，捕获单条异常后继续处理剩余条目
      3. 成功/失败明细列表加入 ItemResult
    source: "公共基础利用率提升（YDIZ-COMMON-039，P2，26.09.30 批量操作结构化结果）"

  - id: "YDIZ-COMMON-040"
    severity: "P1"
    category: "common-reuse"
    title: "【严重】throw 语句禁止硬编码中文，必须使用 I18n.message()"
    description: |
      所有业务模块（ydsz-agent/userinfo/message/workflow/cronjob/nextwiki/literule/system/generator/gateway）的 throw 语句
      不得直接传入中文字符串，必须通过 `I18n.message("module.scenario.key", new Object[]{params})` 翻译后传入。

      **为什么**：
      - 中文硬编码消息仅显示给中文用户，英文/en_US locale 环境下无法切换
      - 违反 i18n 全域覆盖原则（YDIZ-I18N-001~006）
      - 统一中文文案到 properties 文件便于运维/产品直接改文案而不发版

      **违反判据**：
      - `throw new SomeException("中文描述: " + var)`
      - `throw new SomeException("操作失败")`
      - 构造 BusinessException/SysException 时使用中文字符串作为 message（而不是 i18n key + I18n.message() 调用）

      **正确做法**：
      - 中文 keys 同步追加到模块 messages.properties（默认 + zh_CN + en_US 三份同步）
      - 含变量 → `I18n.message("module.error.scenario", new Object[]{var})`
      - JDK RT（IllegalStateException/IllegalArgumentException）直接 `new IllegalStateException(I18n.message("key", params))`

    # common-reuse 已使用 "YDIZ-COMMON-028~032，034~039"
    pattern: "throw\\s+new\\s+\\w*Exception\\(\"[一-鿿]"
    fix: |
      1. 确定消息所属的子模块（agent/cronjob/workflow/nextwiki/literule/userinfo/message/system/generator/gateway）
      2. 在 messages*.properties 追加 `module.scenario.key=中文文案` 和对应的 en_US 翻译
      3. throw 改写为 `throw new XxxException(I18n.message("module.scenario.key", new Object[]{var}))`
      4. 确保 Java 文件已 `import com.njydsz.common.locales.util.I18n;`
    example_good: |
      // 正确：i18n 调用 + 三语 properties 同步追加
      throw new WorkflowException(
        "workflow.validation.status_required",
        I18n.message("workflow.validation.status_required")
      );
    source: "ydsz-common 全局引用分析 v2 — 硬编码中文清零专项（YDIZ-COMMON-040，P1，26.09.28）"

  # ==================== 公共模块利用率 v2 专项（4 条：业务主键统一 + 脚本引擎收敛 + 利用率门禁 + 沉睡能力退出机制） ====================
  - id: "YDIZ-COMMON-041"
    severity: "P1"
    category: "common-reuse"
    title: "【严重】业务主键禁止使用 UUID，必须使用 SnowflakeIdGenerator"
    description: |
      禁止在业务实体 ID 生成场景中使用 `UUID.randomUUID()`（验证码 key / OAuth state / SAML requestId 等安全场景除外），
      所有业务主键 ID 必须通过 `SnowflakeIdGenerator.nextId()` 生成。

      **为什么**：
      - UUID 随机写入导致 B+树索引热点，写入性能随数据量增长急剧下降
      - SnowflakeId 单调递增，ID 直接反映创建时间，支持按 ID 范围分页
      - 64bit Long vs 128bit UUID，存储节省 50%，索引更紧凑

      **违反判据**：
      - `String id = UUID.randomUUID().toString()` 后作为 DB 实体主键写入
      - `entity.setId(UUID.randomUUID().toString())` 这类代码
      - orderId / taskId / recordId 等业务语义明确的 ID 使用 UUID

      **豁免场景（允许使用 UUID）**：
      - 验证码 key（需不可预测性防枚举）
      - OAuth2 state / nonce（安全要求）
      - SAML requestId（协议要求）
      - SSE 订阅 ID（临时标识，不入库）

      **正确做法**：
      - 实体 ID → `entity.setId(SnowflakeIdGenerator.nextId())`
      - 字符串 ID → `String id = String.valueOf(SnowflakeIdGenerator.nextId())`
      - 已存在 UUID 历史数据 → 新增字段 `snowflake_id` 双写迁移

    pattern: "UUID\\.randomUUID\\(\\)\\.toString\\(\\)"
    fix: |
      1. 确认是否为业务主键场景（参考豁免清单排除安全场景）
      2. 注入 `SnowflakeIdGenerator`（通过构造器注入或静态工具获取）
      3. 替换 `UUID.randomUUID().toString()` 为 `String.valueOf(SnowflakeIdGenerator.nextId())`
      4. 如 DB 已有 UUID 历史数据，新增 snowflake_id 字段并双写
    example_good: |
      // 正确：业务主键使用 SnowflakeIdGenerator
      trigger.setId(SnowflakeIdGenerator.nextId());
      // 或字符串形式
      String taskId = String.valueOf(SnowflakeIdGenerator.nextId());
    example_bad: |
      // 错误 1：业务主键使用 UUID
      entity.setId(UUID.randomUUID().toString());
      // 错误 2：任务 ID 使用 UUID
      String jobId = UUID.randomUUID().toString();
    source: "ydsz-common 全局引用深度分析 v2（YDIZ-COMMON-041，P1，26.09.28 业务主键统一）"

  - id: "YDIZ-COMMON-042"
    severity: "P1"
    category: "common-reuse"
    title: "【严重】脚本引擎禁止直连 GroovyClassLoader/ScriptEngine，必须通过 literule"
    description: |
      禁止业务代码直接使用 `GroovyClassLoader` / `javax.script.ScriptEngine` / `ScriptEngineManager` 执行脚本，
      复杂逻辑应通过 ydzs-literule 的 LiteExprEngine 执行。cronjob GlueJobHandler 是唯一的任务脚本执行器例外。

      **为什么**：
      - literule 提供统一的沙箱隔离（SecureASTCustomizer + 白名单 + 黑名单）
      - literule 内置监控（SentryObservation 埋点）、热加载、多引擎（Aviator/Groovy/EXPR）支持
      - 直连 GroovyClassLoader/ScriptEngine 存在沙箱逃逸、资源耗尽等安全风险
      - 两套引擎维护成本翻倍

      **违反判据**：
      - `new GroovyClassLoader(...)` 或 `new GroovyClassLoader(ClassLoader, CompilerConfiguration)`
      - `new ScriptEngineManager().getEngineByName(...)`
      - `new SecureASTCustomizer()` 自建安全沙箱（literule 已提供标准化沙箱配置）

      **唯一例外**：
      - `ydsz-cronjob/GlueJobHandler.java`：任务脚本执行器（职责为任务引擎的脚本模式，与 literule 规则决策定位不同）

      **正确做法**：
      - 复杂脚本执行 → 通过 `CronjobServiceClient` Feign 调用 literule 引擎
      - 简单脚本执行 → 通过 `LiteExprEngine` API 执行
      - cronjob 脚本任务 → 保持使用 GlueJobHandler（已明确职责边界）

    pattern: "GroovyClassLoader|ScriptEngineManager|SecureASTCustomizer"
    fix: |
      1. 评估脚本逻辑复杂度：简单表达式走 literule Feign，任务脚本走 cronjob GlueJobHandler
      2. 删除自建 GroovyClassLoader/ScriptEngine 代码
      3. 引入 `CronjobServiceClient` 或 `LiteExprEngine` API
      4. 确保 literule 侧已配置对应的规则/表达式
    example_good: |
      // 复杂表达式：通过 Feign 调用 literule
      LiteExprResult result = literuleClient.evaluate(expression, params);
    example_bad: |
      // 错误 1：自建 GroovyClassLoader
      GroovyClassLoader loader = new GroovyClassLoader(...);
      // 错误 2：自建 ScriptEngine
      ScriptEngine engine = new ScriptEngineManager().getEngineByName("nashorn");
    source: "ydsz-common 全局引用深度分析 v2（YDIZ-COMMON-042，P1，26.09.28 脚本引擎收敛）"

  - id: "YDIZ-COMMON-043"
    severity: "P2"
    category: "common-reuse"
    title: "【重要】公共能力上线后利用率须达标"
    description: |
      下沉到 ydzs-common 的能力类在发布后 30 天内须被 ≥3 个业务模块引用（通过 ArchUnit 引用扫描验证），
      否则触发利用率告警。

      **为什么**：
      - 公共能力的核心目的是"被复用"，沉睡能力增加维护成本
      - 30 天窗口期给业务方接入留足时间
      - ≥3 模块引用代表能力具有通用性，而非单模块特殊需求

      **验证方式**：
      - ArchUnit 测试：`classes().that().resideInAPackage("..common..").should().beAccessedByClassesThatResideInAPackage("..biz..")`
      - CI 集成编译前检查：`mvn compile -pl ydzs-common-check -am`
      - 30 天窗口期内豁免告警，窗口期后未达标类自动触发告警

      **豁免场景**：
      - 框架级能力（如 DataSourceAutoConfiguration）：仅 Spring 容器引用，不需业务模块直连
      - 储备型能力（如 DynamicRoutingDataSource + MybatisPlusConfiguration）：仅服务于未来多数据源等场景
      - 工具内部能力（如 DiffCalculator 内部 Bean）：仅 common 内部模块互引用

    pattern: "ArchUnit|Maven CI reference check"
    fix: |
      1. 新建 `ydsz-common-check` 模块，包含 ArchUnit 引用扫描器
      2. 为每个公共能力类添加 `@CommonCapability(modules = {"min_refs": 3, "grace_days": 30})` 注解
      3. CI 集成：`mvn verify -P common-check -pl ydzs-common-check`
      4. 未达标类自动进入评估流程（保留/降级/删除）
    example_good: |
      // 正确：YdszJson 被 10/10 业务模块引用，达标
      public class YdszJson { ... }
    example_bad: |
      // 沉睡能力在窗口期内无足够引用：
      // JsonPatch（已被删除）—— 上线 60+ 天后仅 ConfigMergeUtils 内部引用，触发告警后确认删除
    source: "ydsz-common 全局引用深度分析 v2（YDIZ-COMMON-043，P2，26.09.28 利用率门禁机制）"

  - id: "YDIZ-COMMON-044"
    severity: "P2"
    category: "common-reuse"
    title: "【重要】沉睡能力定期评估退出机制"
    description: |
      上线 90 天内零引用的能力类须进入评估流程（保留/降级/删除），避免公共模块持续积累无消费者能力。

      **为什么**：
      - 公共能力的目标是"被消费"，沉睡能力意味着代码腐烂的开始
      - 沉睡能力增加编译时间、依赖传递、维护负担
      - 定期清理可保持公共模块精简、聚焦

      **退出流程**：
      1. T+90d 零引用类自动进入候选池（通过 COMMON-043 ArchUnit 扫描识别）
      2. Owner 评估：保留（说明延期激活场景） / 降级（内联到调用方） / 删除
      3. 审批通过 → 执行清理 → 版本更新日志记录
      4. 下一轮 QBR 复盘：统计清理率、误删率、保留率

      **保留条件**（满足任一）：
      - Owner 说明明确的延期激活场景和时间线（≤6 个月）
      - 为框架级储备（如 JDBC 未来多数据源）且有明确路线图
      - 有其他模块的接入 PR 已提交但未合入

      **删除条件**：
      - 满足零引用条件（通过 ArchUnit 验证）
      - 无明确激活场景
      - 已有替代方案（如 BeanMapper → MapStruct）

    pattern: "(?s)# 沉睡能力清理日志.*"
    fix: |
      1. 建立 T+30d/T+60d/T+90d 三阶段利用率扫描（CI 集成）
      2. T+30d WARN → T+60d escalate → T+90d 进入删除候选
      3. Owner 在 7 个工作日内完成评估决策
      4. 评估结果写入版本更新日志（CHANGELOG.md）
    example_good: |
      // CHANGELOG.md
      ## [26.09.28-v2]沉睡能力清理
      - 删除 JsonPatch.java（外部零引用，RFC 6902 无业务场景）
      - 删除 BeanMapper.java（MapStruct 已替代，MapUtils 已内联）
      - 保留 DynamicRoutingDataSource（储备型：多数据源未来场景）
    source: "ydsz-common 全局引用深度分析 v2（YDIZ-COMMON-044，P2，26.09.28 沉睡能力退出机制）"

  - id: "YDIZ-COMMON-045"
    severity: "P0"
    category: "common-reuse"
    title: "【强制】禁止业务模块 throw RuntimeException，必须使用 BusinessException / SysException"
    description: |
      所有业务模块（ydsz-system、ydsz-userinfo、ydsz-message、ydsz-workflow、ydsz-cronjob、ydsz-nextwiki、ydsz-literule、ydsz-agent、ydsz-generator）中禁止直接抛出 RuntimeException。

      **为什么禁止**：
      - RuntimeException 不携带结构化错误码，前端无法根据 code 区分错误类型
      - 全局异常处理器 BaseExceptionHandler 按 BusinessException/SysException 分类处理，走不同日志级别和响应构造
      - RuntimeException 不会被 ExceptionMetrics 正确分类，影响监控指标准确性
      - 丢失 i18n key 关联，导致错误消息无法国际化

      **替换规则**：
      - 业务约束违反（参数错误、状态不允许、权限不足）→ `BusinessException.of(ModuleExceptionCode.XXX).data(...).build()`
      - 系统级故障（tracing 失败、MQ 故障、RPC 超时）→ `SysException.of(ModuleExceptionCode.XXX, cause).build()`
      - 不确定场景时用 `BusinessException.failed("error.key")` 兜底

      **例外**：ydsz-common 内部基础子模块（L1 层：json、util、cache、excel）因层级依赖约束无法引用 L3 exception 模块，允许保留 RuntimeException，但消息必须使用纯英文。

      **修复方式**：
      1. 搜索 `throw new RuntimeException` 定位所有违反点
      2. 确认异常语义（业务 vs 系统）选择 BusinessException / SysException
      3. 保留原始异常作为 cause（传入构造器参数）
      4. 添加结构化错误码（从对应模块的 ExceptionCode 枚举选择或新建）
    pattern: "throw new RuntimeException"
    fix: |
      1. 全局 grep `throw new RuntimeException` → 在业务模块中逐一替换
      2. 业务违反 → `BusinessException.of(ModuleExceptionCode.XXX).msg("...").cause(e).build()`
      3. 系统故障 → `SysException.of(ModuleExceptionCode.XXX).cause(e).build()`
      4. 修复后 grep 确认业务模块零残留
    example_bad: |
      ```java
      // ❌ 业务模块中直接抛 RuntimeException
      if (!success) {
        throw new RuntimeException("dag save failed");
      }
      ```
    example_good: |
      ```java
      // ✅ 使用 BusinessException
      if (!success) {
        throw BusinessException.of(AgentExceptionCode.DAG_SAVE_FAILED).data("workflowId", id).build();
      }
      ```
    source: "公共基础深化落地（YDIZ-COMMON-045，P0，26.09.xx RuntimeException 清零专项）"

  - id: "YDIZ-COMMON-046"
    severity: "P1"
    category: "i18n"
    title: "【强制】i18n message key 必须使用英文命名规范，禁止中文原文作为 key"
    description: |
      使用 `I18n.message(key, ...)` 或 `I18nMessages.message(key, ...)` 时，key 必须为英文命名规范（如 "module.scenario.error_key"），严禁直接使用中文文本作为 key。

      **为什么禁止**：
      - 当 `useCodeAsDefaultMessage=true` 时，中文 key 会将原文直接返回给用户，永远无法被翻译
      - properties 文件的 key 命名规范要求英文点分格式，中文 key 违反命名约定
      - 英文 key + properties 翻译才是正确的三语支持模式

      **合法示例**：
      - `I18n.message("system.config.value_type.bool_invalid")` ✅
      - `I18n.message("message.sms.phone_required", new Object[]{phone})` ✅

      **非法示例**：
      - `I18n.message("布尔值必须是 true/false")` ❌
      - `I18n.message("配置分组不能为空")` ❌

      **修复方式**：
      1. 搜索 `I18n.message("中文` 和 `I18nMessages.message("中文` 定位所有伪 i18n 调用
      2. 提取英文 key（格式 module.submodule.action_description）
      3. 追加 key 到三份 properties 文件（default/en_US/zh_CN）
      4. 调用点改引用英文 key
    pattern: `I18n\.message\(\s*"[^a-zA-Z_\.].*I18nMessages\.message\(\s*"[^a-zA-Z_\.]`
    fix: |
      1. 全局搜索定位伪 i18n 调用
      2. 创建英文 key 并追加到三份 properties 文件
      3. 替换调用点的 key 引用
      4. 验证三文件 key 一致率 ≥ 98%
    example_bad: |
      ```java
      // ❌ 中文原文作为 key
      throw new ConfigException(I18n.message("配置分组不能为空"));
      ```
    example_good: |
      ```java
      // ✅ 英文 key 引用
      throw new ConfigException(I18n.message("system.config.group_required"));
      ```
    source: "公共基础深化落地（YDIZ-COMMON-046，P1，26.09.xx 伪 i18n 清零专项）"

  - id: "YDIZ-COMMON-047"
    severity: "P1"
    category: "common-reuse"
    title: "【建议】HTTP 请求头常量必须引用 HeaderConstants，禁止硬编码字符串"
    description: |
      在 WebClient、RestTemplate、Feign 拦截器、ServerHttpRequest 构建等需要设置/获取 HTTP 请求头的场景中，必须使用 `HeaderConstants` 中定义的标准常量，禁止硬编码字符串字面量。

      **为什么建议**：
      - 避免同义头在不同模块拼写不一致（如 "X-Trace-Id" vs "X-Trace-ID"）
      - 统一升级时可在一处修改
      - 常量类包含完整 Javadoc 说明各头用途，提升可读性

      **可用常量**：HeaderConstants.AUTHORIZATION、HeaderConstants.TRACE_ID_HEADER、HeaderConstants.IDEMPOTENCY_KEY 等。

      **修复方式**：
      1. grep `"Authorization"`、`"X-Trace-Id"`、`"Idempotency-Key"`、`"X-Forwarded-For"` 等字符串
      2. 确认用于 request header 设置/获取场景
      3. 替换为 `HeaderConstants.XXX`
      4. 添加 import `com.njydsz.common.core.constant.HeaderConstants`
    pattern: `"(Authorization|X-Trace-Id|Idempotency-Key|X-Forwarded-For)"(?:\s*[,)]|\s*\))`
    fix: |
      1. 全局 grep 定位硬编码请求头字符串
      2. 替换为 `HeaderConstants.XXX`
      3. 确认 import 正确添加
    example_bad: |
      ```java
      // ❌ 硬编码字符串
      headers.set("Authorization", "Bearer " + token);
      ```
    example_good: |
      ```java
      // ✅ 使用常量
      headers.set(HeaderConstants.AUTHORIZATION, "Bearer " + token);
      ```
    source: "公共基础深化落地（YDIZ-COMMON-047，P1，26.09.xx HeaderConstants 推广专项）"

  - id: "YDIZ-COMMON-048"
    category: "common-reuse"
    severity: "P2"
    title: "【建议】网关模块必须继承 BaseExceptionHandler 或注册异常码到 ErrorCodeTable"
    description: |
      ydzs-gateway 作为请求入口层，其异常处理应接入全局统一异常体系。
      - 网关层错误码枚举必须标注 `@YdszExceptionCode(module="gateway")` 注册到 ErrorCodeTable
      - 网关异常处理器建议继承 WebFluxExceptionHandler（Spring Cloud Gateway 场景）或保留 WebExceptionHandler 实现
      - 网关发出的错误响应必须遵守 YdszResponse 结构（code/msg/data/traceId）

      **当前状态**：GatewayErrorCode 已注册 @YdszExceptionCode，GatewayExceptionHandler 采用原生 WebExceptionHandler（Spring Cloud Gateway 正确模式）。
    pattern: "GatewayErrorCode"
    fix: |
      1. 确认 GatewayErrorCode 已加 @YdszExceptionCode(module="gateway")
      2. 确认网关异常响应使用 YdszResponse / WebFluxErrorUtils 统一构造
      3. 网关错误码进入 ErrorCodeTable 后可被 Actuator 端点查询
    example_good: |
      ```java
      @YdszExceptionCode(module = "gateway", since = "26.10.01")
      public enum GatewayErrorCode {
          AUTH_FAILED("40100", "gateway.error.auth_failed");
      }
      ```
    source: "公共基础深化落地（YDIZ-COMMON-048，P2，26.09.xx gateway 异常体系合规）"

  # ============================================
  # 新增 3 条（26.09.30 五大 common 模块利用率提升专项：JDBC 清零 + SETNX 清零 + @Async 规范）
  # ============================================
  - id: "YDIZ-COMMON-049"
    category: "common-reuse"
    severity: "P1"
    title: "【严重】@Async 必须显式指定线程池，禁止使用 Spring 默认 SimpleAsyncTaskExecutor"
    description: |
      所有 Spring @Async 注解必须通过 `value` 属性显式指定 ydzz-common-thread 托管线程池 Bean 名，
      禁止省略 value（省略时退化为 SimpleAsyncTaskExecutor，每次 new Thread，无复用/无队列/无监控）。

      **为什么**：
      - SimpleAsyncTaskExecutor 每次调用创建新线程，高并发下导致线程堆积 OOM
      - ydzz-common-thread 提供声明式线程池（ydsz.thread.pools.*），含 Micrometer 指标 + 优雅关闭 + 慢任务检测
      - ThreadRegistry 自动采集所有 ThreadPoolTaskExecutor 指标，暴露 /actuator/threadpools 端点

      **配置方式**（bootstrap.yml）：
      ```yaml
      ydsz:
        thread:
          enabled: true
          pools:
            <poolName>:
              core-size: 4
              max-size: 16
              queue-capacity: 100
              reject-policy: CALLER_RUNS
      ```
      Bean 名称为 `{poolName}Executor`（如 poolName=userIo → Bean 名 userIoExecutor）。

      **违反判据**：
      - `@Async` 省略 value 属性
      - `@Async("someBean")` 引用的 Bean 不是 ThreadPoolTaskExecutor 类型
      - 在 self-maintained ThreadPool 上 @Async（绕过 ydzz-common-thread）

    pattern: "@Async\\s*$|@Async\\(\\s*\\)"
    fix: |
      1. 在 bootstrap.yml 追加 ydzz.thread.pools.\<poolName\> 配置
      2. @Async 改为 @Async("\<poolName\>Executor")
      3. 多异步方法按业务重要性配置不同池（io/cpu/batch 隔离）
    example_bad: |
      ❌ 违规：使用默认线程池
      @Async
      public void sendNotification() { ... }
    example_good: |
      ✅ 正确：显式指定托管线程池
      @Async("userIoExecutor")
      public void sendNotification() { ... }
      \# bootstrap.yml: ydzz.thread.pools.userIo.core-size=4, max-size=16
    source: "五大 common 模块利用率提升专项（YDIZ-COMMON-049，P1，26.09.30 @Async 必须指定线程池）"

  - id: "YDIZ-COMMON-050"
    category: "common-reuse"
    severity: "P1"
    title: "【严重】禁止业务代码自行实现 SETNX 分布式锁，必须使用 LockTemplate / RedisStringOps.getOrCompute"
    description: |
      防缓存穿透、防并发加载等需要分布式锁的场景，必须使用 ydzs-common-lock 的 LockTemplate 编程式 API
      或 RedisStringOps.getOrCompute() 声明式 API，禁止在业务代码中直接使用 SETNX + EXPIRE Lua
      脚本自实现分布式锁。

      **为什么**：
      - LockTemplate 提供看门狗自动续期 + Micrometer 指标采集 + fail-open/closed 降级策略
      - 自实现锁无法被 LockMetrics 监控获取次数/成功率/等待时间/续期失败等指标
      - 自实现锁缺少重入保护、释放通知器（减少空轮询）等生产级能力
      - DistributedLockAutoConfiguration 已全局注册 LockTemplate Bean，无需额外配置

      **正确做法**：
      - **防缓存穿透**：`redisStringOps.getOrCompute(key, ttl, supplier, clazz)` — 原子获取或加载
      - **显式互斥区**：`lockTemplate.execute("resource:" + id, 30, SECONDS, () -> { ... })`
      - **声明式锁**：`@YdszDistributedLock(key = "order:#{#orderId}", waitTime = 3, leaseTime = 30)`

      **违反判据**：
      - Lua 脚本中直接使用 SET key value NX EX
      - 手动 `redisTemplate.execute(luaScript, ...)` 实现锁获取
      - `if (redisTemplate.opsForValue().setIfAbsent(key, value)) { ... redisTemplate.expire(key, ttl) ... }` 两步非原子

    pattern: "setIfAbsent.*expire|SET.*NX.*EX|lua.*redis.call.*set.*nx|setIfPresent.* Lucius|SETNX"
    fix: |
      1. 确认业务场景属于"防缓存穿透"还是"互斥区"
      2. 防缓存穿透：换成 RedisStringOps.getOrCompute()
      3. 互斥区：换成 LockTemplate.execute() 或 @YdszDistributedLock
      4. 删除自实现的 SETNX Lua 脚本
    example_bad: |
      ❌ 违规：SETNX + 过期时间自实现
      String lockKey = "lock:" + id;
      boolean acquired = redisTemplate.opsForValue().setIfAbsent(lockKey, "1", 30, TimeUnit.SECONDS);
      if (acquired) {
          try { reloadFromDb(); } finally { redisTemplate.delete(lockKey); }
      }
    example_good: |
      ✅ 正确：LockTemplate 编程式锁
      lockTemplate.execute("lock:" + id, 30, TimeUnit.SECONDS, this::reloadFromDb);
    source: "五大 common 模块利用率提升专项（YDIZ-COMMON-050，P1，26.09.30 SETNX 清零 → LockTemplate）"

  - id: "YDIZ-COMMON-051"
    category: "common-reuse"
    severity: "P1"
    title: "【严重】禁止业务代码直接使用 JdbcTemplate，所有数据库访问必须走 Mapper / MybatisPlus 拦截器链"
    description: |
      业务模块（尤其 agent 向量检索、全文检索等 SQL 密集型场景）的所有数据库访问必须通过 MyBatis Mapper
      或继承 MpBaseEntity 的 Service 层实现，禁止直接注入 JdbcTemplate 执行原生 SQL。

      **为什么**：
      - MyBatisPlusInterceptor 链自动提供 SQL 防火墙 / 数据权限拦截 / 分页安全上限 / 慢 SQL 检测
      - MpBaseEntity 基类提供审计字段（createdAt/createdBy/updatedAt/updatedBy）自动填充
      - JdbcTemplate 绕过上述所有保护层，SQL 注入、全表扫描、权限越界风险全部暴露
      - 租户隔离拦截器（TenantIsolationInterceptor）仅在 MyBatis 拦截链中生效，JdbcTemplate 完全绕过

      **特殊场景（需显式注解 + 注释说明）**：
      - 向量库操作（PgVector)：使用 JdbcTemplate 时必须通过 `/* tenant_isolation */` SQL 注释标记，
        并在 SQL 中显式追加 `WHERE tenant_id = ?` 条件，确保租户隔离
      - 性能敏感的全表扫描（如 Analyze 表统计信息）：需申请豁免并加 `@SuppressWarnings("YDIZ-COMMON-051")`

      **违反判据**：
      - 直接注入 JdbcTemplate 或 NamedParameterJdbcTemplate
      - 手动拼接 SQL 字符串执行查询/更新
      - 使用 SimpleJdbcCall 调用存储过程（除非 dbo 级别的数据迁移）

    pattern: "JdbcTemplate|NamedParameterJdbcTemplate|SimpleJdbcCall"
    fix: |
      1. 创建对应实体类继承 MpBaseEntity（获得审计字段 + 乐观锁）
      2. 创建 Mapper 接口继承 BaseMapper<Entity>
      3. 替换 JdbcTemplate.query/execute 为 mapper.selectList/updateById
      4. 无法替代的向量库操作：保留 JdbcTemplate 并加 @SuppressWarnings + P0-FIX 注释说明租户隔离策略
    example_bad: |
      ❌ 违规：直接使用 JdbcTemplate
      jdbcTemplate.query("SELECT * FROM vector_store WHERE embedding <-> ? LIMIT ?",
          new Object[]{embedding, topK}, new VectorRowMapper());
    example_good: |
      ✅ 正确：走 Mapper
      VectorStore entity = new VectorStore();
      entity.setEmbedding(embedding);
      return mapper.selectList(new LambdaQueryWrapper<VectorStore>()
          .orderByAsc(VectorStore::getDistance)
          .last("LIMIT " + Math.min(topK, 500)));  // 分页安全上限
    source: "五大 common 模块利用率提升专项（YDIZ-COMMON-051，P1，26.09.30 JdbcTemplate 清零 → Mapper）"

  # ============================================
  # 十一、common-util 利用率专项（5 条，26.09.30）
  # ============================================
  # YDIZ-COMMON-052: 必须使用 ValidationUtils 进行格式校验
  - id: "YDIZ-COMMON-052"
    category: "common-reuse"
    severity: "P1"
    title: "【严重】业务校验必须使用 ValidationUtils，禁止自行编写手机号/身份证/银行卡正则"
    description: |
      所有业务校验场景（注册/登录/创建/更新等）中涉及的手机号、邮箱、身份证号、统一社会信用代码、
      车牌号、银行卡号、IPv4、十六进制颜色值格式校验，必须使用 ydsz-common-util 的
      com.njydsz.common.util.validate.ValidationUtils 工具类，禁止在业务模块中编写新的正则或校验方法。

      **为什么**：
      - ValidationUtils 内置 GB 11643-1999（身份证）、GB 32100-2015（统一社会信用代码）、
        Luhn 算法（银行卡）等国家标准校验规则
      - 手机号正则已预编译为 Pattern 静态字段，避免重复编译
      - 国家标准更新（如手机号新号段）需同步修改多处，统一入口确保不漏改
      - 自实现校验容易遗漏校验码（如身份证末位 X / 银行卡 Luhn 位）

      **违反判据**：
      - 业务代码中出现 `Pattern.compile("^1[3-9]\\d{9}$")` 等手机号正则
      - 业务代码中出现 `idCard.length() == 18` 等仅做长度判断而遗漏校验码
      - 业务代码中出现银行卡号纯长度判断（未做 Luhn 校验）

    pattern: "Pattern\\.compile.*1\\[3-9\\]|Pattern\\.compile.*@.*\\\\.|idCard\\.length\\(\\)|idCard\\.length\\(\\).*18|bankCard.*length\\(\\)"
    fix: |
      1. 替换手机号校验：`StringUtils.isPhone(str)` → `ValidationUtils.isMobilePhone(str)`
      2. 替换邮箱校验：`Pattern.compile(...email...)` → `ValidationUtils.isEmail(str)`
      3. 替换身份证校验：`idCard.length() == 18` → `ValidationUtils.isIdCard18(str)`
      4. 替换银行卡校验：长度判断 → `ValidationUtils.isBankCard(str)`（含 Luhn 校验）
    example_bad: |
      ❌ 违规：自实现手机号正则
      private static final Pattern MOBILE = Pattern.compile("^1[3-9]\\d{9}$");
      public boolean isMobile(String s) { return MOBILE.matcher(s).matches(); }
    example_good: |
      ✅ 正确：使用 ValidationUtils
      import com.njydsz.common.util.validate.ValidationUtils;
      if (!ValidationUtils.isMobilePhone(phone)) {
          throw new BusinessException(ExceptionCode.INVALID_PHONE);
      }
    source: "common-util 全局引用分析（YDIZ-COMMON-052，P1，26.09.30 ValidationUtils 零引用问题激活）"

  # YDIZ-COMMON-053: 必须使用 BeanUpdateUtil 进行 Bean 更新
  - id: "YDIZ-COMMON-053"
    category: "common-reuse"
    severity: "P1"
    title: "【严重】DTO → Entity 更新必须使用 BeanUpdateUtil.copyNonNull，禁止 BeanUtils.copyProperties 全量复制"
    description: |
      在 DTO 转入 Entity 进行数据库更新的场景（PATCH 语义的部分更新）中，必须使用
      com.njydsz.common.util.bean.BeanUpdateUtil.copyNonNull(source, target, ignoreProperties)
      替代 Spring BeanUtils.copyProperties 或 Apache BeanUtils.copyProperties。

      **为什么**：
      - BeanUtils.copyProperties 会复制源对象的所有属性（包括 null），导致目标对象已有字段被 null 覆盖
      - BeanUpdateUtil.copyNonNull 仅复制非 null 属性，保留目标对象原值
      - 配合 ignoreProperties 参数（如 "id", "tenantId", "createdAt"）可精确控制忽略字段

      **注意**：Entity → VO / DTO → Entity（创建场景，非更新）的转换推荐使用 MapStruct（编译期生成，性能最优）

      **违反判据**：
      - 在更新方法中使用 BeanUtils.copyProperties(dto, entity)
      - 在更新方法中使用 BeanCopier.create()

    pattern: "BeanUtils\\.copyProperties|\\.copyProperties\\(.*\\)|BeanCopier"
    fix: |
      1. 引入 `import com.njydsz.common.util.bean.BeanUpdateUtil;`
      2. 替换 `BeanUtils.copyProperties(dto, entity)` → `BeanUpdateUtil.copyNonNull(dto, entity, "id", "tenantId", "createdAt")`
      3. 列明不允许被覆盖的字段名作为 ignoreProperties 参数
      4. 删除 BeanUtils 的 import
    example_bad: |
      ❌ 违规：全量复制，null 字段覆盖目标
      public void updateEntity(UpdateDTO dto, Entity entity) {
          BeanUtils.copyProperties(dto, entity);  // dto 中的 null 字段会覆盖 entity
      }
    example_good: |
      ✅ 正确：仅复制非 null 字段，并忽略不可变字段
      public void updateEntity(UpdateDTO dto, Entity entity) {
          BeanUpdateUtil.copyNonNull(dto, entity, "id", "tenantId", "createdAt");
      }
    source: "common-util 全局引用分析（YDIZ-COMMON-053，P1，26.09.30 BeanUpdateUtil 零引用问题激活）"

  # YDIZ-COMMON-054: 必须使用 DigestUtils
  - id: "YDIZ-COMMON-054"
    category: "common-reuse"
    severity: "P1"
    title: "【严重】签名/摘要计算必须使用 DigestUtils，禁止业务代码直接调用 MessageDigest.getInstance"
    description: |
      所有 SHA-1/SHA-256/SHA-512 散列计算和 HMAC-SHA1/HMAC-SHA256 签名计算必须使用
      com.njydsz.common.util.security.DigestUtils 工具类（已有 md5Hex、sha256Hex、sha1Hex、
      hmacSha256Hex、hmacSha256Base64、verifySignature、constantTimeEquals 等方法），
      禁止在业务代码中直接调用 MessageDigest.getInstance() 或 Mac.getInstance()。

      **为什么**：
      - DigestUtils 内部复用共享的 MessageDigest 实例（ThreadLocal 缓冲），避免频繁分配
      - HexFormat.of().formatHex() / HexUtils.encode() 在跨模块间实现散列不兼容
      - DigestUtils.verifySignature 提供常量时间比较（防时序攻击），自实现容易遗漏
      - 密钥盐/散列 升级时统一修改 DigestUtils 即可影响全平台

      **违反判据**：
      - 业务代码中出现 `MessageDigest.getInstance("SHA-256")` 或 `Mac.getInstance("HmacSHA256")`
      - 业务代码中出现 `HexFormat.of().formatHex(hash)` 手动转 hex

      **例外（需在代码注释中说明 YDIZ-COMMON-054 例外原因）**：
      - 对象存储平台签名（AWS V4 / Aliyun OSS / 七牛 KODO）等第三方协议强制要求特定格式的签名链

    pattern: "MessageDigest\\.getInstance|Mac\\.getInstance|HexFormat\\.of\\(\\)\\.formatHex"
    fix: |
      1. 替换 SHA-256：`MessageDigest.getInstance("SHA-256")` → `DigestUtils.sha256Hex(data)`
      2. 替换 HMAC-SHA256：`Mac.getInstance("HmacSHA256")` + `Base64.getEncoder().encodeToString(...)` → `DigestUtils.hmacSha256Base64(data, secret)`
      3. 替换 SHA-1（如需保留兼容性）：`MessageDigest.getInstance("SHA-1")` → `DigestUtils.sha1Hex(data)`
      4. 签名验证：自定义常量时间比较 → `DigestUtils.verifySignature(data, secret, signature, encoding)`
      5. 替换 Hex 手动编码：`HexFormat.of().formatHex(hash)` → 使用 DigestUtils 返回 hex 的方法
    example_bad: |
      ❌ 违规：手动计算 HMAC-SHA256
      Mac mac = Mac.getInstance("HmacSHA256");
      SecretKeySpec spec = new SecretKeySpec(secret.getBytes(UTF_8), "HmacSHA256");
      mac.init(spec);
      byte[] hmac = mac.doFinal(data.getBytes(UTF_8));
      return Base64.getEncoder().encodeToString(hmac);
    example_good: |
      ✅ 正确：委托 DigestUtils
      import com.njydsz.common.util.security.DigestUtils;
      return DigestUtils.hmacSha256Base64(data, secret);
    source: "common-util 全局引用分析（YDIZ-COMMON-054，P1，26.09.30 DigestUtils 9 处直连收敛）"

  # YDIZ-COMMON-055: 必须使用 ExceptionUtils
  - id: "YDIZ-COMMON-055"
    category: "common-reuse"
    severity: "P2"
    title: "【建议】获取异常堆栈/根因必须使用 ExceptionUtils，禁止手写 StringWriter + printStackTrace"
    description: |
      所有获取异常完整堆栈字符串或根因的场景，必须使用
      com.njydsz.common.util.exception.ExceptionUtils 提供的 getStackTrace /
      getRootCause / getRootCauseMessage 方法，禁止在业务代码中手写
      `new StringWriter()` + `throwable.printStackTrace(new PrintWriter(sw))` 模式。

      **为什么**：
      - ExceptionUtils 提供一致的堆栈格式化（异常链完整渲染、防自引用死循环）
      - 避免业务代码中到处复制 `StringWriter sw = new StringWriter(); ...` 样板代码
      - getRootCause 实现了异常链自引用环检测，手写容易遗漏

      **违反判据**：
      - 业务代码中出现 `StringWriter sw = new StringWriter()` + `e.printStackTrace(new PrintWriter(sw))`
      - 业务代码中出现手写 `getCause()` 循环且未做自引用环检测

    pattern: "StringWriter.*printStackTrace|new PrintWriter.*sw\\)|printStackTrace.*PrintWriter"
    fix: |
      1. 引入 `import com.njydsz.common.util.exception.ExceptionUtils;`
      2. 替换 `new StringWriter() + printStackTrace(new PrintWriter(sw))` → `ExceptionUtils.getStackTrace(e)`
      3. 替换手写 `getCause()` 循环 → `ExceptionUtils.getRootCause(e)` 或 `ExceptionUtils.getRootCauseMessage(e)`
    example_bad: |
      ❌ 违规：手写堆栈获取
      StringWriter sw = new StringWriter();
      try (PrintWriter pw = new PrintWriter(sw)) {
          e.printStackTrace(pw);
      }
      log.error("failed: {}", sw.toString());
    example_good: |
      ✅ 正确：使用 ExceptionUtils
      import com.njydsz.common.util.exception.ExceptionUtils;
      log.error("failed: {}", ExceptionUtils.getStackTrace(e));
    source: "common-util 全局引用分析（YDIZ-COMMON-055，P2，26.09.30 ExceptionUtils 复用率提升）"

  # YDIZ-COMMON-056: 无 Resilience4j 时使用 RetryUtils
  - id: "YDIZ-COMMON-056"
    category: "common-reuse"
    severity: "P2"
    title: "【建议】无 Resilience4j 依赖时使用 RetryUtils，禁止手写 while+Thread.sleep 重试"
    description: |
      在需要容错重试的场景（网络调用、消息发送、外部 API 调用等）中，如果模块未引入 Resilience4j 依赖，
      必须使用 com.njydsz.common.util.concurrent.RetryUtils 提供的 executeWithRetry /
      executeWithBackoff 方法，禁止手写 `while (retry-- > 0) { try { ... } catch { Thread.sleep(...) } }` 模式。

      **为什么**：
      - RetryUtils 提供固定间隔 + 指数退避 + 随机抖动（对齐 Resilience4j 语义）
      - 手写重试缺少抖动，多节点同时重试时会产生"惊群效应"
      - RetryUtils 提供 maxDuration 总时长上限，防止重试无限循环
      - 统一的 RetryException 包装，异常语义清晰

      **注意**：有 Resilience4j 依赖的模块直接使用 Retry.resilience4j-retry，无需降级到 RetryUtils。

      **违反判据**：
      - 业务代码中出现 `while (retry-- > 0) { ... Thread.sleep(...) ... }` 手写重试循环
      - 业务代码中出现 `for (int i = 0; i < maxRetry; i++) { if (tryOnce()) break; Thread.sleep(...); }`

    pattern: "while.*retry.*--.*>.*0.*Thread\\.sleep|for.*int.*i.*maxRetry.*Thread\\.sleep"
    fix: |
      1. 引入 `import com.njydsz.common.util.concurrent.RetryUtils;`
      2. 简单重试场景：`RetryUtils.executeWithRetry(action, 3, Duration.ofSeconds(2))`
      3. 需指数退避：`RetryUtils.executeWithBackoff(action, RetryConfig.builder().maxRetries(5).initialDelay(Duration.ofMillis(100)).build())`
      4. 删除手写的 while/for + Thread.sleep 重试循环
    example_bad: |
      ❌ 违规：手写重试循环
      int retry = 3;
      while (retry-- > 0) {
          try { return httpClient.call(); }
          catch (Exception e) { Thread.sleep(1000); }
      }
    example_good: |
      ✅ 正确：使用 RetryUtils
      import com.njydsz.common.util.concurrent.RetryUtils;
      return RetryUtils.executeWithRetry(() -> httpClient.call(), 3, Duration.ofSeconds(2));
    source: "common-util 全局引用分析（YDIZ-COMMON-056，P2，26.09.30 RetryUtils 零引用问题激活）"

  # ============================================
  # ydzs-common-lock 全局引用分析（2 条，P0，26.09.30）
  # ============================================
  # YDIZ-COMMON-057: 编程式锁必须使用 LockTemplate
  - id: "YDIZ-COMMON-057"
    category: "lock-reuse"
    severity: "P0"
    title: "【强制】编程式分布式锁必须使用 LockTemplate，禁止自实现 try-finally 锁管理"
    description: |
      业务代码通过 LockStrategy 获取 DistributedLocker 后手动管理 tryLock + try-finally + unlock
      样板代码时，**必须**改为注入 LockTemplate 并调用 execute/executeOrDefault/executeWithProtection
      系列方法，禁止在业务 Service 中手写锁获取与释放的 try-finally 逻辑。

      **为什么必须使用 LockTemplate**：
      - LockTemplate 自动处理获取失败、执行异常、锁释放的三段式逻辑，消除样板代码
      - 统一收集 LockMetrics 指标（获取次数/成功率/等待时间）
      - 提供 executeOrDefault（获取失败返回默认值）和 executeWithProtection（防缓存穿透）等高级语义
      - 看门狗续期、释放通知、降级策略等行为在 LockTemplate 内统一实现，自实现无法保证一致性

      **违反判据**：
      - 业务代码中出现 `distributedLocker.tryLock(key, ...)` + `finally { distributedLocker.unlock(key, ...) }` 模式
      - 自行 new 一个类似 LockTemplate 的工具类包装 DistributedLocker
      - 在多个 Service 中重复实现相同的 tryLock + 业务 + unlock 三段逻辑

      **例外（需在代码注释中说明 YDIZ-COMMON-057 例外原因）**：
      - 需要非阻塞式获取锁并获取锁值（如通过锁值传递调度信息）的场景保留 DistributedLocker 直用
      - 需要异步获取锁（返回 CompletableFuture）的场景

    pattern: "discreteLocker\.tryLock.*finally.*discreteLocker\.unlock|DistributedLocker.*tryLock.*finally"
    fix: |
      1. 注入 LockTemplate（Spring 自动装配提供 Bean）
      2. 替换 try-finally 样板代码：`lockTemplate.execute(key, leaseTime, SECONDS, () -> { ... })`
      3. 需要返回值：`lockTemplate.execute(key, leaseTime, SECONDS, () -> businessMethod())`
      4. 需要默认值降级：`lockTemplate.executeOrDefault(key, leaseTime, SECONDS, () -> businessMethod(), defaultValue)`
      5. 需要防止缓存穿透：`lockTemplate.executeWithProtection(key, leaseTime, SECONDS, supplier)`
      6. 删除自实现的 try-finally 锁管理代码
    example_bad: |
      ❌ 违规：手写 try-finally 锁管理
      String lockValue = distributedLocker.tryLock(key, 30, TimeUnit.SECONDS);
      if (lockValue == null) {
          throw new BusinessException("获取锁失败");
      }
      try {
          return doBusiness(orderId);
      } finally {
          distributedLocker.unlock(key, lockValue);
      }
    example_good: |
      ✅ 正确：使用 LockTemplate 自动管理
      import com.njydsz.common.lock.core.LockTemplate;
      return lockTemplate.execute("order:" + orderId, 30, TimeUnit.SECONDS,
          () -> doBusiness(orderId));
    source: "ydsz-common-lock 全局引用分析（YDIZ-COMMON-057，P0，26.09.30 LockTemplate 零引用激活）"
    exception: "需要获取锁值传递给调度信息 / 异步获取锁（CompletableFuture）场景可保留 DistributedLocker 直用"

  # YDIZ-COMMON-058: 幂等实现必须走 common-lock 或 safe，禁止反射 Redis
  - id: "YDIZ-COMMON-058"
    category: "lock-reuse"
    severity: "P0"
    title: "【强制】幂等去重必须使用 DistributedLocker / RedisIdempotentStrategy，禁止反射操作 StringRedisTemplate"
    description: |
      所有幂等去重场景（Outbox 消费去重、消息去重、接口幂等、任务去重等）必须使用以下两种方式之一：
      1. `DistributedLocker.tryLock(key, leaseTime, SECONDS)` + `unlock(key, lockValue)` — 需续期场景
      2. `RedisIdempotentStrategy.acquire(key, ttl)` / `release(key)` — safe 模块简单幂等
      3. `StringOps.setIfAbsent(key, value, ttl)` — 一次性幂等标记（无续期需求）

      **禁止做法**：
      - 通过反射（getMethod/invoke）操作 StringRedisTemplate.opsForValue().setIfAbsent()
      - 使用 ConcurrentHashMap 存储幂等标记（集群部署下多节点无法保证幂等）
      - 通过反射调用 RedisOperations 的底层方法绕过 RedisOps 封装

      **为什么禁止反射操作 Redis**：
      - 编译期无法检查 StringRedisTemplate 方法签名变更，运行时才暴露 NoSuchMethodException
      - 绕过 StringOps（ydsz-common-redis 封装）进行 Redis 操作违反架构分层
      - ConcurrentHashMap 缓存幂等标记在集群部署下多节点无法保证幂等语义
      - 反射操作性能低于直接调用 + JIT 优化

      **违反判据**：
      - 代码中出现 `redisTemplate.getClass().getMethod("opsForValue").invoke(redisTemplate)`
      - 代码中出现反射调用 setIfAbsent / getAndSet 等 Redis 方法
      - Outbox 幂等中使用 ConcurrentHashMap 作为集群安全的幂等存储

    pattern: "getClass\(\)\.getMethod.*opsForValue|newInstance.*setIfAbsent|ConcurrentHashMap.*idempotent"
    fix: |
      1. 移除反射逻辑，直接注入 StringOps（或 RedisStringOps）
      2. 幂等获取：`stringOps.setIfAbsent(key, "1", Duration.ofSeconds(ttl))`
      3. 幂等释放：`stringOps.del(key)` 或直接依赖 TTL 过期
      4. 需要可重入 + 看门狗续期：改用 `lockTemplate.execute(key, ttl, SECONDS, () -> { ... })`
      5. 降级为 ConcurrentHashMap 的方案需移除（集群部署无意义）或添加集群级锁保护
    example_bad: |
      ❌ 违规：反射操作 StringRedisTemplate
      Object ops = redisTemplate.getClass().getMethod("opsForValue").invoke(redisTemplate);
      Object result = ops.getClass().getMethod("setIfAbsent", Object.class, Object.class,
          long.class, TimeUnit.class).invoke(ops, key, "1", 3600L, TimeUnit.SECONDS);
    example_good: |
      ✅ 正确：使用 StringOps 类型安全 API
      import com.njydsz.common.redis.StringOps;
      Boolean acquired = stringOps.setIfAbsent(key, "1", Duration.ofSeconds(ttl));
      if (Boolean.TRUE.equals(acquired)) {
          try { processMessage(event); }
          finally { stringOps.del(key); }
      }
    source: "ydsz-common-lock 全局引用分析（YDIZ-COMMON-058，P0，26.09.30 OutboxIdempotentAspect 反射 Redis 整改）"
    exception: "自定义 Redis 脚本（Lua）通过 RedisScriptExecutor 执行不在本规则限制范围"

  # ============================================
  # ydsz-common-redis 全局引用分析（2 条，P1，26.09.30）
  # ============================================
  # YDIZ-COMMON-059: 禁止业务代码直接注入 RedisTemplate
  - id: "YDIZ-COMMON-059"
    category: "redis-reuse"
    severity: "P1"
    title: "【严重】禁止业务代码直接注入 RedisTemplate / StringRedisTemplate"
    description: |
      业务模块（ydsz-{module}）的 Service、Controller、RepositoryImpl **禁止直接注入**
      `RedisTemplate` 或 `StringRedisTemplate`，必须通过 ydzs-common-redis 封装的
      `RedisStringOps` / `RedisHashOps` / `RedisCollectionOps` / `RedisRateLimiter` 等
      操作组件执行 Redis 操作。

      **为什么禁止直连**：
      - RedisStringOps 等封装提供租户 Key 前缀自动添加（多租户隔离）
      - 统一的异常降级、重试、指标采集
      - 避免各业务模块直接操作底层连接（`getConnection().info()`），导致连接管理失控
      - 通过封装层可统一升级序列化策略、Key 命名约定

      **违反判据**：
      - 业务代码 import 并注入 `org.springframework.data.redis.core.StringRedisTemplate`
      - 业务代码 import 并注入 `org.springframework.data.redis.core.RedisTemplate`
      - `ObjectProvider<StringRedisTemplate>` 用于非健康检查/非网关响应式场景

      **例外（需在代码注释中说明 YDIZ-COMMON-059 例外原因）**：
      - 响应式网关（WebFlux）场景使用 `ReactiveStringRedisOps` 或 `ReactiveStringRedisTemplate`
      - HealthIndicator 健康检查（ping 探测）
      - 框架层 ydzs-common-* 封装自身的 Bean 定义与内部实现
      - 需要执行自定义 INFO/SLOWLOG/CLUSTER 等运维命令的场景

    pattern: "import org\.springframework\.data\.redis\.core\.StringRedisTemplate|import org\.springframework\.data\.redis\.core\.RedisTemplate"
    fix: |
      1. 替换 `StringRedisTemplate` 注入为 `RedisStringOps` 注入
      2. 替换 `RedisTemplate<String, String>` 注入为对应 Ops 组件（StringOps/HashOps/CollectionOps）
      3. INFO 命令改为通过 `RedisAdvancedOps.getInfo(section)` 调用
      4. 确认模块 pom.xml 已声明 ydzs-common-redis 依赖
    example_bad: |
      ❌ 违规：业务 Service 直接注入 StringRedisTemplate
      @Service
      public class FooService {
          private final StringRedisTemplate redisTemplate;
          public void doWork() {
              redisTemplate.opsForValue().set("key", "value");
          }
      }
    example_good: |
      ✅ 正确：通过 RedisStringOps 封装操作
      @Service
      public class FooService {
          private final RedisStringOps redisOps;
          public void doWork() {
              redisOps.set("key", "value", 3600);
          }
      }
    source: "ydsz-common-redis 全局引用分析（YDIZ-COMMON-059，P1，26.09.30 业务模块直连 RedisTemplate 清零）"
    exception: "响应式网关 WebFlux / HealthIndicator 健康检查 / 框架层 ydzs-common-* 内部实现 / INFO 运维命令"

  # YDIZ-COMMON-060: 业务 Redis Key 必须通过 CacheKeyBuilder 构造
  - id: "YDIZ-COMMON-060"
    category: "redis-reuse"
    severity: "P1"
    title: "【严重】业务 Redis Key 必须通过 CacheKeyBuilder 语义化方法构造"
    description: |
      业务模块使用 Redis 时，**禁止**在 Service/RepositoryImpl 等代码中出现硬编码的
      Redis Key 前缀字符串常量（如 `"ydsz:quota:concurrent:"`、`"flow:assignee:todo_count:"`），
      必须通过本模块的 `CacheKeyBuilder` Spring Bean 提供的语义化方法构造 Key。

      **为什么必须走 CacheKeyBuilder**：
      - 集中管理 Key 前缀常量，消除各 Service 散落的魔法字符串
      - 统一 tenant 隔离格式（`ydsz:{tenantId}:module:entity:{id}` 或模块历史格式）
      - 提供语义化方法名（如 `cacheKeyBuilder.quotaConcurrent(tenantId)`），提升代码可读性
      - 后续 Key 格式变更时只需修改 CacheKeyBuilder 一处

      **违反判据**：
      - `private static final String XXX_KEY_PREFIX = "ydsz:..."` 后直接拼接 key
      - Service 方法体内 `String key = "prefix:" + id` 形式的手写拼接
      - `RedisStringOps.get/set` 参数为字面量字符串直接拼接变量（非 CacheKeyBuilder 方法）

      **各模块 CacheKeyBuilder 落地情况**（26.09.30）：
      - gateway/agent/message/nextwiki/userinfo/workflow/system/cronjob/literule 均已有 CacheKeyBuilder
      - 新增 Redis 操作的模块必须同步在 `{module}-server/cache/` 或 `{module}-infra/cache/` 下新建 CacheKeyBuilder

      **例外（需在代码注释中说明 YDIZ-COMMON-060 例外原因）**：
      - 框架层 ydzs-common-* 内部（如 RepeatSubmitTokenService）可接受直连
      - 全局共享的 Redis Key 常量（无租户维度、框架级约定）可通过专门的 RedisKeysEnum 管理

    pattern: "static final String [A-Z_]+_PREFIX\s*=\s*\"(ydsz|flow|msg|agent):"
    fix: |
      1. 在本模块 cache 包下新建或定位现有 CacheKeyBuilder
      2. 为当前业务场景添加语义化 key 方法（如 `quotaConcurrent(String tenantId)`）
      3. 注入 CacheKeyBuilder 替换手写前缀常量
      4. 删除不再需要的 `private static final String XXX_KEY_PREFIX` 常量
    example_bad: |
      ❌ 违规：手写硬编码前缀
      private static final String CONCURRENT_KEY_PREFIX = "ydsz:quota:concurrent:";
      public void checkQuota(String tenantId) {
          String key = CONCURRENT_KEY_PREFIX + tenantId;
          redisOps.incr(key, 1);
      }
    example_good: |
      ✅ 正确：通过 CacheKeyBuilder 语义化构造
      private final CacheKeyBuilder cacheKeyBuilder;
      public void checkQuota(String tenantId) {
          String key = cacheKeyBuilder.quotaConcurrent(tenantId);
          redisOps.incr(key, 1);
      }
    source: "ydsz-common-redis 全局引用分析（YDIZ-COMMON-060，P1，26.09.30 手写硬编码 key 清零）"
    exception: "框架层 ydzs-common-* 直连代码 / 全局框架级 RedisKeysEnum 常量"

  # YDIZ-COMMON-061: 文件上传必须校验真实文件类型（Magic Number）
  - id: "YDIZ-COMMON-061"
    category: "file"
    severity: "P1"
    title: "【强制】文件上传必须使用 FileTypeValidator 或 FileTypeDetector 校验真实文件类型"
    description: |
      业务模块处理用户上传文件时，仅依赖文件后缀名判断类型存在「改后缀绕过」安全风险
      （如将 .jsp/.exe 伪装成 .jpg 上传）。必须使用 ydsz-common-file 提供的
      FileTypeValidator（Spring Bean，结合后缀白名单 + Magic Number 校验）
      或 FileTypeDetector（纯检测工具，返回实际 MIME 类型）进行真实类型校验。
    pattern: "endsWith\(\"\.jpg\"\)|endsWith\(\"\.png\"\)|endsWith\(\"\.pdf\"\)|endsWith\(\"\.mp4\"\)"
    fix: |
      1. 注入 FileTypeValidator 或 FileTypeDetector（Spring 自动配置已注册为 Bean）
      2. 上传时在 sanitizeFileName/suffix 校验之后，调用 fileTypeValidator.validate()
         或 FileTypeDetector.detect(file.getInputStream()) 获取真实 MIME
      3. 拒绝 suffix 与 MIME 不匹配或 isDangerousType() 返回 true 的上传
    example_good: |
      try {
        fileTypeValidator.validate(file.getInputStream(), file.getOriginalFilename());
      } catch (IOException e) {
        throw new BusinessException(ExceptionCodeEnum.FILE_TYPE_INVALID);
      }
    source: "ydsz-common-file 全局引用分析（YDIZ-COMMON-061，P1，26.10.01 FileTypeDetector 零使用修复）"
    exception: "ydsz-common-file 框架层内部代码"


  # ============================================
  # 十二、core/domain/exception/locales 四模块利用率专项（3 条，26.09.30）
  # ============================================
  - id: "YDIZ-CORE-001"
    category: "i18n"
    severity: "P0"
    title: "【强制】所有 @SpringBootApplication 主类必须标注 @EnableYdszI18n"
    description: |
      所有 9 个业务模块（system / userinfo / message / workflow / cronjob / nextwiki /
      literule / agent / gateway）的 @SpringBootApplication 启动类必须显式标注
      @EnableYdszI18n，以激活 com.njydsz.common.locales 基础设施模块的
      i18n 能力（MessageSource、LocaleResolver、负缓存、MissingTranslationLogger）。

      **为什么必须显式标注**：
      - ydsz-common-locales 提供核心 i18n 功能（I18n.message()、I18nMessages Bean）
      - 显式标注表明该模块已接入国际化基础设施，便于代码审查时快速验证
      - 防止遗漏导致部分模块消息源与全局 MessageSource 不一致
      - 注解是纯标记类，不引入运行时副作用（LocalesAutoConfiguration 无条件初始化）

      **现状**：9 个业务模块主类已全部标注 @EnableYdszI18n（26.09.30）。
    pattern: "@SpringBootApplication.*\npublic class .*Application"
    fix: |
      1. import com.njydsz.common.locales.config.EnableYdszI18n;
      2. 在 @SpringBootApplication 同级添加 @EnableYdszI18n
      3. 已有该注解的模块无需重复添加
    example_bad: |
      ❌ 缺失 @EnableYdszI18n
      @SpringBootApplication
      @EnableYdszFeign
      public class FooApplication { ... }
    example_good: |
      ✅ 已标注
      @SpringBootApplication
      @EnableYdszFeign
      @EnableYdszI18n
      public class SystemApplication { ... }
    source: "四模块利用率提升专项（YDIZ-CORE-001，P0，26.09.30 @EnableYdszI18n 全覆盖）"

  - id: "YDIZ-CORE-002"
    category: "exception"
    severity: "P1"
    title: "【严重】禁止业务层调用 YdszExceptionBuilder 以外的方式构造带分类/级别的异常"
    description: |
      所有业务异常的抛掷必须通过 异常枚举 + 异常链式 API 完成（如 BusinessException.of(ErrorCode.X).msg(...)），
      禁止手动 new 一个完整异常并传入分类/级别标签（跳过 ExceptionCode 前缀自动推导 ExceptionCategory 与 ExceptionLevel 的自动映射路径）。

      **为什么必须走 ExceptionCode 路径**：
      - ExceptionCode 前缀自动推导 ExceptionCategory（BIZ→业务/SYS→系统/SEC→安全/RATE→限流）
      - AbstractYdszException 根据 HTTP 状态码范围自动推导 ExceptionLevel（INFO/WARN/ERROR/CRITICAL）
      - 直接手动注入 category/level 会绕过自动推导，导致异常分类元数据与实际不符
      - ErrorCodeTable 扫描器依赖此约定注册所有异常码

      **现状**：business 层 457/464 处 new BusinessException 调用已使用 ExceptionCode 枚举（26.09.30 扫描结果）。
    pattern: "手动构造 ExceptionCategory|手动 new 并注入 ExceptionLevel"
    fix: |
      1. 使用 ExceptionCode 枚举构造（自动推导 category/level）
      2. 极特殊场景需自定义分类/级别时，通过 ExceptionCodeScanner.registerEnum() 注册枚举
      3. 禁止在代码中直接调用 ExceptionCategory/ExceptionLevel 枚举值的 set 方法
    example_bad: |
      ❌ 手动注入 category/level
      throw new BusinessException(ErrorCode.USER_NOT_FOUND)
          .setCategory(ExceptionCategory.BUSINESS)
          .setLevel(ExceptionLevel.INFO);  // 绕过自动推导
    example_good: |
      ✅ 使用枚举：category/level 自动推导
      throw BusinessException.of(ErrorCode.USER_NOT_FOUND)
          .msg(I18n.message("user.not.found", new Object[]{userId}));
    source: "四模块利用率提升专项（YDIZ-CORE-002，P1，26.09.30 ExceptionCode 自动推导优先）"

  - id: "YDIZ-CORE-003"
    category: "common-reuse"
    severity: "P1"
    title: "【严重】特性开关必须通过 FeatureFlagService 统一读取，禁止直接查询 ConfigService"
    description: |
      业务模块需要读取特性开关（Feature Flag）状态时，必须通过注入或使用
      com.njydsz.common.core.feature.FeatureFlagService 接口的 isEnabled(name) /
      getFeatureFlags() 方法，禁止在 Controller / Service 中直接调用 ConfigService
      获取开关映射后自行解析。

      **为什么必须走 FeatureFlagService**：
      - FeatureFlagService 是 core 层定义的统一抽象，屏蔽底层数据来源（配置中心 / DB / 本地缓存）
      - 直接读 ConfigService 会绕过开关的 boolean 解析、null 默认值、租户隔离等统一处理逻辑
      - 后续切换开关中心（如迁移到 Apollo/Nacos/自研开关平台）时，只需修改 FeatureFlagService
        实现，业务调用方无需改动
      - FeatureFlagContext 静态门面为无注入场景（工具类/切面/枚举）提供统一入口

      **现状**：ydsz-system 的 FeatureFlagController 已改为注入 FeatureFlagService（26.09.30）。
      8 业务引擎其他模块如新增特性开关读取需求，一律通过 FeatureFlagService 访问。
    pattern: "ConfigService.*[Ff]eatureFlag|configService\.getFeatureFlags"
    fix: |
      1. 注入 FeatureFlagService 或通过 FeatureFlagContext.isEnabled(name) 静态调用
      2. 移除对 ConfigService.getFeatureFlags() 的直接引用
      3. 如需按名判定开关：featureFlagService.isEnabled(name)
      4. 如需全量映射（前端启动加载）：featureFlagService.getFeatureFlags()
    example_bad: |
      ❌ 直接读 ConfigService
      Map<String, Object> flags = configService.getFeatureFlags();
      boolean enabled = parseFlag(flags.get("some.feature"));
    example_good: |
      ✅ 通过 FeatureFlagService
      boolean enabled = featureFlagService.isEnabled("some.feature");
      // 或静态门面
      boolean enabled = FeatureFlagContext.isEnabled("some.feature");
    source: "ydsz-common-core 全局引用分析整改（YDIZ-CORE-003，P1，26.09.30 特性开关统一入口）"

  - id: "YDIZ-LOCALE-003"
    category: "i18n"
    severity: "P1"
    title: "【严重】禁止业务代码直接使用 Locale 构造/Hardcoded locale 字符串，必须使用 KnownLocaleTags"
    description: |
      业务代码中禁止使用以下方式处理语言/区域：
      - 直接 new Locale("zh", "CN") 或 Locale.CHINA 等 JDK 常量
      - 硬编码字符串 "zh_CN"、"en_US"、"zh_TW" 做 locale 比较
      - 字符串拼接生成 locale 标签（如 locale.getLanguage() + "_" + locale.getCountry()）

      **为什么必须使用 KnownLocaleTags**：
      - KnownLocaleTags 集中维护 YDSZ 体系所有受支持的 locale 标签（DEFAULT_SUPPORTED_TAGS）
      - 保证 i18n 体系内 locale 字符串一致性，避免 "zh_CN" vs "zh-CN" vs "zh_CN_#Hans" 碎片化
      - 支持标签标准化（stripLocaleSuffix / normalize），输入容错

      **约束范围**：ydsz-common 框架 i18n 基础设施内部代码（如 FlowI18nService、I18nProperties）使用 JDK Locale 属于框架实现细节，不受此规则约束。
      业务层代码（Service/Controller/Domain）涉及 locale 判断/比较时必须使用 KnownLocaleTags。
    pattern: 'new Locale\(|Locale\.(CHINA|US|UK|JAPAN|KOREAN)|getLanguage\(\)\s*\+\s*"_"'
    fix: |
      1. import com.njydsz.common.locales.util.KnownLocaleTags;
      2. 替换 Locale.CHINA → KnownLocaleTags.LOCALE_ZH_CN（如已提供）
      3. 替换 "zh_CN" 字符串 → KnownLocaleTags.TAG_ZH_CN（如已提供）
      4. 替换 locale 字符串拼接 → KnownLocaleTags.normalize(locale.toString())
    example_bad: |
      ❌ 业务代码硬编码 locale
      if ("zh_CN".equals(user.getLocaleTag())) { ... }
      Locale locale = new Locale("zh", "CN");
    example_good: |
      ✅ 使用 KnownLocaleTags
      if (KnownLocaleTags.isChinese(user.getLocaleTag())) { ... }
      Locale locale = KnownLocaleTags.defaultLocale();
    source: "四模块利用率提升专项（YDIZ-LOCALE-003，P1，26.09.30 KnownLocaleTags 不可替代）"

  # ============================================
  # 十三、ydsz-common-config 利用率专项（1 条，26.10.01）
  # ============================================
  - id: "YDIZ-CONFIG-001"
    category: "common-reuse"
    severity: "P2"
    title: "【规范】多层 JSON 配置合并必须使用 ConfigMergeUtils，禁止自行实现"
    description: |
      涉及多层 JSON 配置深度合并的场景（如 tenant-override、feature-flag、config-profile），
      必须使用 com.njydsz.common.config.hotreload.ConfigMergeUtils 的 merge() / mergeLayers()
      方法，禁止自行通过 JSONObject.putAll() / Map.putAll() / 递归遍历实现 JSON 深度合并。

      **为什么必须使用 ConfigMergeUtils**：
      - 基于 RFC 7396 JSON Merge Patch 标准语义，覆盖/删除/保留行为明确
      - 委托 YdszJson.applyMergePatch() 实现，避免重复造轮子
      - 内置异常降级逻辑（合并失败时返回 override），避免配置合并异常导致启动失败

      **适用场景**：
      - 基础配置 + 租户覆盖 → 最终生效配置
      - 默认配置 + 环境覆盖（dev/test/prod）→ 运行时配置
      - Nacos 远程配置 + 本地 override → 合并配置

      **当前状态**：工具类已储备就绪，待首个多层 JSON 配置合并场景落地。
    pattern: "JSONObject.*putAll|JsonUtils\.toJson.*putAll"
    fix: |
      1. import com.njydsz.common.config.hotreload.ConfigMergeUtils;
      2. 双配置合并：ConfigMergeUtils.merge(baseConfig, overrideConfig)
      3. 多层配置合并：Config.mergeLayers(defaults, envConfig, tenantConfig)
    example_bad: |
      ❌ 自行实现 JSON 深度合并
      JSONObject merged = new JSONObject(base);
      merged.putAll(override);  // 浅合并，嵌套对象整体替换
    example_good: |
      ✅ 使用 ConfigMergeUtils
      String merged = ConfigMergeUtils.mergeLayers(defaults, envConfig, tenantConfig);
    source: "ydsz-common-config 全局引用分析整改（YDIZ-CONFIG-001，P2，26.10.01 ConfigMergeUtils 储备能力）"
    exception: "Spring Environment 属性源优先级体系已覆盖扁平 key-value 场景；仅多层 JSON 对象深度合并适用"

  - id: "YDIZ-CONFIG-002"
    category: "common-reuse"
    severity: "P2"
    title: "【规范】手动 Jasypt 解密必须使用 ConfigCliTool，禁止直接创建 PooledPBEStringEncryptor"
    description: |
      运行时需要对 {@code ENC()} 密文做手动解密的场景（如 API 签名密钥解密、第三方回调验签密钥获取），
      必须使用 com.njydsz.common.config.cli.ConfigCliTool 的 decrypt() 方法，禁止直接创建 {@code
      PooledPBEStringEncryptor} 或使用不一致的算法参数。

      **为什么必须统一入口**：
      - ConfigCliTool 默认使用 PBEWithHMACSHA512AndAES_256 + 1000 次迭代，与项目全局 jasypt 配置对齐
      - 自行创建.encryptor 可能使用不同算法，导致密文不兼容
      - ConfigCliTool 委托 ydsz-common-config 的 ConfigProperties.Cli 子配置，确保参数一致性

      **ENC() 自动解密**：Spring 配置属性中声明为 {@code property.name=ENC(xxx)} 的值由
      jasypt-spring-boot-starter 在 PropertySource 加载时自动解密，注入到 @ConfigurationProperties
      中的值已是明文，无需手动处理。
    pattern: "new PooledPBEStringEncryptOR|StandardPBEStringEncryptor|setAlgorithm\("
    fix: |
      1. import com.njydsz.common.config.cli.ConfigCliTool;
      2. 使用 ConfigCliTool.decrypt(encryptedValue, masterPassword) 解密
      3. 不要自行创建 encryptor 实例
    example_bad: |
      ❌ 自行创建 encryptor
      PooledPBEStringEncryptor encryptor = new PooledPBEStringEncryptor();
      encryptor.setAlgorithm("PBEWithMD5AndDES");  // 不安全，且与全局配置不一致
    example_good: |
      ✅ 使用 ConfigCliTool
      String plain = ConfigCliTool.decrypt(encryptedValue, masterPassword);
    source: "ydsz-common-config 全局引用分析整改（YDIZ-CONFIG-002，P2，26.10.01 Jasypt 统一解密入口）"
    exception: "ydsz-common-config 模块内部的 ConfigCliTool.createEncryptor 方法（属于框架自身实现）"

