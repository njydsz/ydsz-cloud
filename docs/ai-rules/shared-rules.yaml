# CatPaw 和 WorkBuddy 的配置文件由此文件生成或软链引用。
#
# 规范版本：对齐《云顶编码规范》1.0.3
# 生成日期：2026-08-31
#
# 同步方式：
#   - CatPaw: .meituan-catpaw/5728405356/rules/catpaw-always.md（由本文件生成）
#   - WorkBuddy: .workbuddy/rules/workbuddy-system.md（由本文件生成）
#   - 同步脚本: data/scripts/sync-ai-rules.py

meta:
  version: "26.09.02"
  source: "docs/云顶编码规范.md v1.0.5"
  last_synced: "2026-09-02"
  last_updated: "2026-09-02（新增 YDIZ-CODE-001 文件编码规范：UTF-8 无 BOM，P0 阻断级）"
  total_rules: 47
  severity_levels:
    P0: "阻断级，AI 编码绝对禁止违反"
    P1: "严重级，AI 编码不应违反，违反需人工确认"
    P2: "建议级，AI 编码建议遵循"

rules:
  # ============================================
  # 一、文件编码规范（1 条，P0）
  # ============================================
  - id: "YDIZ-CODE-001"
    category: "encoding"
    severity: "P0"
    title: "【强制】所有源文件必须使用 UTF-8（无 BOM）编码"
    description: |
      所有项目源文件（Java、XML、YAML、properties、Markdown、Python 等）必须使用 **UTF-8 无 BOM** 编码保存。

      **为什么禁止 BOM**：
      - BOM（Byte Order Mark，字节顺序标记）是 Unicode 文件开头的特殊标记字节（EF BB BF）
      - UTF-8 是字节顺序无关的编码，BOM 在 UTF-8 中不仅无用，还会导致许多工具链解析错误
      - Java 编译器（javac）不允许源文件以 BOM 开头，若有 BOM 会报 "illegal character: \ufeff" 错误
      - Shell 脚本、PHP、Python 等解释型语言的 shebang 行（#!...）被 BOM 破坏后无法执行
      - Maven/Gradle 构建、MyBatis XML 解析、YAML 配置解析均可能因 BOM 失败

      **项目现状**：
      - .editorconfig 已配置 charset = utf-8，但 Windows 环境下部分编辑器（VS、旧版 IntelliJ 新建文件模板）仍会默认追加 BOM
      - AI 编码工具（CatPaw、WorkBuddy 等）生成新文件时必须显式指定无 BOM 编码，禁止依赖系统默认编码
      - 中文 Windows 系统默认编码为 GBK，若未显式指定 UTF-8，保存的中文注释/字符串可能被错误编码

      **修复方式**：
      - IntelliJ：Settings → Editor → File Encodings → 勾选 "Transparent native-to-ascii conversion"，确保 "Project Encoding" 和 "Default encoding for properties files" 均为 UTF-8，且 "with BOM" 相关选项不勾选
      - VS Code：默认使用 UTF-8 无 BOM，确认 "files.encoding" 设置为 "utf8" 而非 "utf8bom"
    pattern: "文件开头 3 个字节为 EF BB BF（UTF-8 BOM 标记）"
    fix: |
      1. 使用编辑器重新保存为 UTF-8 无 BOM格式（IntelliJ: File → File Encoding → UTF-8 并选择 "Remove BOM"；VS Code: 右下角点击编码 → Save with Encoding → UTF-8（无 BOM））
      2. 批量修复可用命令：find . -name "*.java" -exec sed -i '1s/^\xEF\xBB\xBF//' {} \;
      3. AI 生成新文件时必须在文件创建后立即确认编码为 UTF-8 无 BOM
    example_bad: |
      ❌ 文件开头存在 BOM（不可见，但 hexdump 可看到 EF BB BF）
      hexdump -C File.java | head -1
      00000000  ef bb bf 70 61 63 6b 61  67 65  ...（BOM 字节）
    example_good: |
      ✅ 文件开头直接是有效字符
      hexdump -C File.java | head -1
      00000000  70 61 63 6b 61 67 65 20  63 6f 6d 2e ...（无 BOM）
    source: "编码规范 §1.1 字符编码与换行符 - 【强制】"

  # ============================================
  # 二、Import 导入规范（5 条，全部 P0）
  # ============================================
  - id: "YDIZ-IMPORT-001"
    category: "import"
    severity: "P0"
    title: "【强制】禁止行内全限定类名（FQN）"
    description: |
      所有类型引用必须通过文件顶部的 import 语句声明，严禁在代码体中使用全限定类名（Fully Qualified Name）。
      适用范围：所有 JDK 标准库（java.util、java.time、java.math、java.io、java.sql、java.nio 等）和第三方库。
      特殊说明：System.getProperty("java.io.tmpdir") 中字符串字面量内部的 "java.io" 不属于 FQN 规避范围，但字段、参数、方法体中的类型必须引用 import 后的简单名。
    pattern: "代码体中出现 java.xxx.Yyy、org.xxx.Yyy、com.xxx.Yyy 等全限定名（非 import 行、非字符串常量）"
    fix: "将 FQN 拆为顶部 import + 代码体使用简单名。import 放在 java.* 组，组内按字母序排列"
    example_bad: |
      // 违规：字段声明中使用 FQN
      private java.time.LocalDateTime createdAt;

      // 违规：方法参数中使用 FQN
      void banUser(String id, java.math.BigDecimal amount) { ... }

      // 违规：方法体中使用 FQN
      entity.setReadTime(java.time.LocalDateTime.now());
    example_good: |
      import java.math.BigDecimal;
      import java.time.LocalDateTime;

      // 正确：字段、参数、方法体均使用简单名
      private LocalDateTime createdAt;
      void banUser(String id, BigDecimal amount) { ... }
      entity.setReadTime(LocalDateTime.now());
    source: "编码规范 5.1 节 - 强制 | checkstyle.xml 2.2 节 RegexpSinglelineJava FQN 检测"

  - id: "YDIZ-IMPORT-002"
    category: "import"
    severity: "P0"
    title: "禁止通配符 import"
    description: "禁止使用 import xxx.* 通配符导入，每个类型必须显式 import。"
    pattern: "import 语句中出现 .*"
    fix: "拆分为具体类型的显式 import"
    example_bad: "import org.springframework.beans.factory.*;"
    example_good: "import org.springframework.beans.factory.BeanFactory;"
    source: "编码规范 5.2 节"

  - id: "YDIZ-IMPORT-003"
    category: "import"
    severity: "P0"
    title: "禁止未使用的 import"
    description: "禁止保留未使用的 import 语句。"
    pattern: "import 的类型在代码体中未被引用"
    fix: "删除未使用的 import"
    source: "编码规范 5.5 节"

  - id: "YDIZ-IMPORT-004"
    category: "import"
    severity: "P0"
    title: "禁止直接 import 第三方 JSON 库"
    description: "业务代码禁止直接 import Jackson/Fastjson/Gson/org.json，必须统一使用 ydsz-common-json（JsonUtils）。"
    pattern: "import com.fasterxml.jackson.* 或 import com.alibaba.fastjson2.*"
    fix: "使用 com.njydsz.common.json.JsonUtils 替代"
    source: "编码规范 22.3 节、20.5 节"

  - id: "YDIZ-IMPORT-005"
    category: "import"
    severity: "P0"
    title: "禁止业务模块直接 import Netty"
    description: "禁止直接 import io.netty.*，必须通过 ydsz-common-netty 或 ydsz-common-socket 封装。"
    pattern: "import io.netty.* 且模块非 common-netty/common-socket"
    fix: "使用 ydsz-common-netty 的 AbstractNettyServer/AbstractNettyClient"
    source: "编码规范 22.3 节、23.6 节"

  # ============================================
  # 三、命名规范（4 条）
  # ============================================
  - id: "YDIZ-NAME-001"
    category: "naming"
    severity: "P0"
    title: "entity 包下禁止使用 DO 后缀"
    description: "持久化实体类不允许使用 DO 后缀，直接使用业务名称命名。"
    pattern: "entity 包下类名以 DO 结尾"
    fix: "移除 DO 后缀，通过包路径区分角色"
    example_bad: "public class UserAccountDO { ... }"
    example_good: "public class UserAccount { ... }"
    source: "编码规范 2.4 节"

  - id: "YDIZ-NAME-002"
    category: "naming"
    severity: "P0"
    title: "数据库表名必须使用 ydsz_ 前缀"
    description: "所有业务模块的数据库表名必须以 ydsz_ 为前缀（ydsz-common 模块除外）。"
    pattern: "@TableName 注解值不以 ydsz_ 开头"
    fix: "改为 ydsz_ 前缀"
    example_bad: "@TableName(\"nw_file_node\")"
    example_good: "@TableName(\"ydsz_wiki_file_node\")"
    source: "编码规范 2.5 节"

  - id: "YDIZ-NAME-003"
    category: "naming"
    severity: "P1"
    title: "禁止中文拼音混合命名"
    description: "命名必须使用英文单词，禁止中文拼音、拼音首字母缩写。"
    pattern: "变量名或方法名包含拼音（如 yongHu、getPingJia）"
    fix: "使用对应英文含义命名"
    example_bad: "String getPingJiaByName();"
    example_good: "String getCommentByName();"
    source: "编码规范 2.1 节"

  - id: "YDIZ-NAME-004"
    category: "naming"
    severity: "P1"
    title: "禁止无意义命名"
    description: "命名必须'见名知意'，禁止 a、b、tmp、data、flag 等无意义命名。"
    pattern: "单字符变量名（除循环变量 i/j/k）或 tmp/tmpVar 等"
    fix: "使用有业务含义的命名"
    example_bad: "int d; boolean flag;"
    example_good: "int elapsedDays; boolean enabled;"
    source: "编码规范 2.1 节"

  # ============================================
  # 四、OOP 规约（5 条）
  # ============================================
  - id: "YDIZ-OOP-001"
    category: "oop"
    severity: "P0"
    title: "覆盖 equals 必须同时覆盖 hashCode"
    description: "覆盖 equals 方法时，必须同时覆盖 hashCode 方法。"
    pattern: "类中定义 equals 方法但未定义 hashCode 方法"
    fix: "同时实现 hashCode 方法"
    source: "编码规范 6.2 节"

  - id: "YDIZ-OOP-002"
    category: "oop"
    severity: "P0"
    title: "包装类比较必须使用 equals"
    description: "所有整形包装类对象之间值的比较，全部使用 equals 方法，禁止使用 ==。"
    pattern: "Integer/Long/Short/Byte 等包装类使用 == 比较"
    fix: "改用 equals() 方法"
    example_bad: "if (a == b) // Integer a, b"
    example_good: "if (a.equals(b))"
    source: "编码规范 6.2 节"

  - id: "YDIZ-OOP-003"
    category: "oop"
    severity: "P0"
    title: "禁止定义为 double/float 类型，一律使用 BigDecimal"
    description: "浮点数等值判断，基本类型不能用==，禁止定义为 double/float 类型，一律使用 BigDecimal。"
    pattern: "字段或局部变量声明为 double 或 float（JSON 序列化 DTO 除外）"
    fix: "改用 BigDecimal，使用字符串构造或 BigDecimal.valueOf()"
    example_bad: "double price = 19.99;"
    example_good: "BigDecimal price = new BigDecimal(\"19.99\");"
    source: "编码规范 6.3 节、6.4 节、6.6 节"

  - id: "YDIZ-OOP-004"
    category: "oop"
    severity: "P1"
    title: "POJO 类布尔属性禁止加 is 前缀"
    description: "POJO 类中布尔类型的变量不要加 is 前缀，否则部分框架解析会引起序列化错误。"
    pattern: "private Boolean isDeleted;"
    fix: "去掉 is 前缀"
    example_bad: "private Boolean isDeleted;"
    example_good: "private Boolean deleted;"
    source: "编码规范 6.5 节"

  - id: "YDIZ-OOP-005"
    category: "oop"
    severity: "P2"
    title: "覆写方法必须添加 @Override"
    description: "覆盖父类方法或实现接口方法时必须添加 @Override 注解。"
    pattern: "方法签名与父类/接口相同但缺少 @Override"
    fix: "添加 @Override 注解"
    source: "编码规范附录 D 第 17 项"

  # ============================================
  # 五、异常与日志（3 条）
  # ============================================
  - id: "YDIZ-LOG-001"
    category: "logging"
    severity: "P0"
    title: "禁止空 catch 块（吞异常）"
    description: "禁止仅捕获异常不做任何处理。catch 块必须记录日志或抛出自定义异常。"
    pattern: "catch (Exception e) {} 或空 catch 块（仅注释无语句）"
    fix: "添加日志记录或异常转换"
    source: "编码规范 12 章"

  - id: "YDIZ-LOG-002"
    category: "logging"
    severity: "P0"
    title: "日志必须使用占位符 {}"
    description: "日志输出必须使用 {} 占位符，禁止字符串拼接。"
    pattern: "log.info/warn/error 中使用 + 拼接字符串变量"
    fix: "改用 {} 占位符"
    example_bad: "log.info(\"用户\" + userId + \"操作失败\");"
    example_good: "log.info(\"用户{}操作失败\", userId);"
    source: "编码规范 13 章、附录 D 第 14 项"

  - id: "YDIZ-LOG-003"
    category: "logging"
    severity: "P0"
    title: "禁止 System.out/err 和 printStackTrace"
    description: "禁止使用 System.out.println / System.err.println / e.printStackTrace()。"
    pattern: "System.out.println 或 System.err.println 或 printStackTrace"
    fix: "使用日志框架 SLF4J"
    source: "编码规范附录 D 第 15/16 项"

  # ============================================
  # 六、日期时间（2 条）
  # ============================================
  - id: "YDIZ-DATE-001"
    category: "datetime"
    severity: "P0"
    title: "禁止 SimpleDateFormat 作为共享变量"
    description: "SimpleDateFormat 非线程安全，禁止作为静态字段或实例字段。"
    pattern: "private static final SimpleDateFormat"
    fix: "使用 DateTimeFormatter（线程安全）"
    example_bad: "private static final SimpleDateFormat SDF = new SimpleDateFormat(\"yyyy-MM-dd\");"
    example_good: "private static final DateTimeFormatter FMT = DateTimeFormatter.ofPattern(\"yyyy-MM-dd\");"
    source: "编码规范 7.1 节"

  - id: "YDIZ-DATE-002"
    category: "datetime"
    severity: "P0"
    title: "使用 Java 8+ 时间 API，禁止 Date/Calendar"
    description: "日期时间操作使用 java.time.* API，避免使用 java.util.Date / Calendar。"
    pattern: "字段或局部变量使用 java.util.Date 或 Calendar"
    fix: "改用 LocalDate/LocalDateTime/Instant"
    source: "编码规范 7.2 节"

  # ============================================
  # 七、集合与数据结构（2 条）
  # ============================================
  - id: "YDIZ-COLL-001"
    category: "collection"
    severity: "P1"
    title: "集合初始化必须指定初始容量"
    description: "集合初始化时必须指定初始容量（已知大小时）。"
    pattern: "new ArrayList<>() 或 new HashMap<>() 无初始容量参数"
    fix: "指定初始容量，如 new ArrayList<>(16)"
    source: "编码规范 9.1 节"

  - id: "YDIZ-COLL-002"
    category: "collection"
    severity: "P0"
    title: "方法返回集合禁止返回 null"
    description: "方法返回集合类型时，禁止返回 null，必须返回空集合。"
    pattern: "返回 List/Map/Set 的方法存在 return null 分支"
    fix: "改用 Collections.emptyList()/emptyMap()/emptySet()"
    source: "编码规范 9.2 节"

  # ============================================
  # 八、DDD 分层架构（6 条，全部 P0）
  # ============================================
  - id: "YDIZ-DDD-001"
    category: "ddd"
    severity: "P0"
    title: "依赖方向必须单向，禁止反向依赖"
    description: "web → server → domain ← infra，依赖方向必须单向，禁止反向依赖。"
    pattern: "domain 层依赖 infra 层 或 server 层依赖其他业务模块的 infra 层"
    fix: "通过接口反转依赖，Repository 接口定义在 domain 层"
    source: "编码规范 22.1 节、34.3 节"

  - id: "YDIZ-DDD-002"
    category: "ddd"
    severity: "P0"
    title: "Repository 必须返回 VO/DTO，禁止返回 PO/Entity"
    description: "Repository 接口禁止返回基础设施层实体（PO），必须通过 Converter 转换为 VO/DTO 后返回。"
    pattern: "Repository 接口签名中返回类型为 entity 包下的类"
    fix: "在 infra 层通过 MapStruct Converter 转换为 VO"
    source: "编码规范 34.2 节 §34.2.1"

  - id: "YDIZ-DDD-003"
    category: "ddd"
    severity: "P0"
    title: "server 层禁止直接使用 Mapper/QueryWrapper"
    description: "禁止在 server 层直接 import Mapper 类或使用 QueryWrapper/LambdaQueryWrapper/UpdateWrapper。"
    pattern: "server 包下 import org.mybatisplus.core.mapper 或 import com.baomidou.mybatisplus.core.conditions.query"
    fix: "数据访问逻辑封装在 Repository 实现中（infra 层）"
    source: "编码规范 34 章、附录 D 第 22/23 项"

  - id: "YDIZ-DDD-004"
    category: "ddd"
    severity: "P0"
    title: "domain 层禁止声明 MapStruct 依赖"
    description: "禁止 {module}-domain 层 pom.xml 中出现 org.mapstruct 依赖，禁止 domain 包 import MapStruct 类。"
    pattern: "domain pom.xml 中 <groupId>org.mapstruct</groupId>"
    fix: "MapStruct Converter 放在 {module}-infra/converter/ 包下"
    source: "编码规范 34.5 节、附录 D 第 25/26 项"

  - id: "YDIZ-DDD-005"
    category: "ddd"
    severity: "P0"
    title: "【强制】api 模块禁止自建 domain/vo/dto/query 子包"
    description: |
      api 模块是纯契约层，仅定义 FeignClient 接口签名和 Assembler（VO↔DTO 转换），通过依赖 domain 模块复用 VO/DTO/Query/枚举 作为方法签名类型。
      **禁止**在 api 模块内部新建 domain/、vo/、dto/、query/ 子包（即 api 模块下不允许出现任何 DTO/Query 类文件）。
      DTO/Query 应定义在 {module}-domain 模块的 dto/、query/ 包中，api 模块通过 pom 依赖引用。
      本条为【强制】规则，违反将导致 api 模块职责污染，破坏 DDD 分层架构。
    pattern: |
      api 模块下出现以下任一情况：
      1. 新建 *.java 文件且 package 含 .vo. 或 .dto. 或 .query. 子路径
      2. api 模块内部定义 @Data / @Builder 注解的 DTO/Query 类
      3. FeignClient 接口签名中使用 api 模块自身定义的 DTO（应使用 domain 模块的 DTO）
    fix: |
      1. 将 DTO/Query 类从 api 模块迁移至 domain 模块（{module}-domain/src/main/java/.../domain/dto/ 或 domain/query/）
      2. 更新 api 模块所有 import 引用指向 domain 模块
      3. 确保 api 模块的 pom.xml 已依赖 {module}-domain
    example_bad: |
      // ❌ 违规：api 模块自建 dto 包
      // 文件：ydsz-system-api/src/main/java/com/njydsz/system/api/dto/ConfigQuery.java
      package com.njydsz.system.api.dto;
      @Data
      public class ConfigQuery { private String key; }

      // ❌ 违规：FeignClient 使用 api 模块自建的 DTO
      @FeignClient(name = "ydsz-system")
      public interface ConfigClient {
          @GetMapping("/config")
          ConfigDTO getConfig(ConfigQuery query); // ConfigQuery 来自 api 自身
      }
    example_good: |
      // ✅ 正确：DTO 定义在 domain 模块
      // 文件：ydsz-system-domain/src/main/java/com/njydsz/system/domain/dto/ConfigQuery.java
      package com.njydsz.system.domain.dto;
      @Data
      public class ConfigQuery { private String key; }

      // ✅ 正确：FeignClient 引用 domain 模块的 DTO
      @FeignClient(name = "ydsz-system")
      public interface ConfigClient {
          @GetMapping("/config")
          ConfigDTO getConfig(ConfigQuery query); // 引用自 {module}-domain
      }
    source: "编码规范 §34.3.1、§34.3.1.1 — 【强制】"

  - id: "YDIZ-DDD-006"
    category: "ddd"
    severity: "P1"
    title: "Repository 接口禁止暴露 getMapper 方法"
    description: "禁止 Repository 实现类暴露 getMapper()/getXxxMapper() 方法，防止 Mapper 泄漏到 server 层。"
    pattern: "Repository 实现类中存在 getMapper 或类似方法"
    fix: "封装具体的数据访问方法，不暴露 Mapper 引用"
