  - id: "YDIZ-DDD-001"
    category: "ddd"
    severity: "P0"
    title: "依赖方向必须单向，禁止反向依赖"
    description: "web → server → domain ← infra，依赖方向必须单向，禁止反向依赖。"
    pattern: "domain 层依赖 infra 层 或 server 层依赖其他业务模块的 infra 层"
