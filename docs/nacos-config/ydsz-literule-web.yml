# =====================================================================
#  YDSZ 规则引擎 — 微服务端配置（Nacos 数据中心）
#  依赖 common: auth,base,domain,exception,web,core,safe,lock,audit,feign,json,excel
# =====================================================================
ydsz:
  tenant:
    mode: SINGLE
    tenant-column: tenant_id
    default-claim: tenantId
    default-header: X-Tenant-Id
    super-tenant-id: "0"
    system-tenant-id: "1"
    anon-urls:
      - /actuator/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /favicon.ico
      - /error
    ignore-tables:
      - ydsz_company
      - ydsz_department
      - ydsz_post
      - ydsz_language

  json:
    use-big-decimal: true
    safe-mode: true
    warmup-classes:
      - com.njydsz.literule.domain.api.RuleDefinition
      - com.njydsz.literule.server.spi.RuleVersion
      - com.njydsz.literule.server.version.RuleVersionDiff
      - com.njydsz.literule.domain.entity.RulePack
      - com.njydsz.literule.domain.entity.RuleChainGraph

  thread:
    pools:
      ruleParallel:
        core-size: 4
        max-size: 8
        queue-capacity: 200
        thread-name-prefix: ydsz-rule-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 30
      ruleTimeout:
        core-size: 2
        max-size: 4
        queue-capacity: 100
        thread-name-prefix: ydsz-rule-timeout-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 30
      ruleChain:
        core-size: 2
        max-size: 4
        queue-capacity: 100
        thread-name-prefix: ydsz-rule-chain-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 30
      factProvider:
        core-size: 2
        max-size: 8
        queue-capacity: 200
        thread-name-prefix: ydsz-fact-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 30
      modelInput:
        core-size: 2
        max-size: 8
        queue-capacity: 200
        thread-name-prefix: ydzsz-model-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 30

  search:
    pg:
      index-table: ydsz_literule_search_index

  literule:
    auto-register-builtin-rules: true
    hot-reload-enabled: true
    stats-enabled: true
    dry-run-enabled: true
    sandbox-enabled: true
    trace-enabled: true
    trace-queue-capacity: 5000
    trace-batch-size: 100
    trace-flush-interval-ms: 2000
    rule-timeout-ms: 0
    canary-enabled: true
    conflict-detection-enabled: true
    conflict-detection-block-on-error: true
    environment: default
    annotation-scan-base-packages: ""
    health-enabled: true
    circuit-breaker-error-rate: 0.5
    circuit-breaker-min-evaluations: 100
    circuit-breaker-open-state-ms: 30000
    cache:
      enabled: true
      l1-ttl-seconds: 60
      l1-max-size: 1000
      l2-enabled: true
      l2-ttl-seconds: 300
    rule-source:
      type: db
      watch-enabled: true
    distributed:
      enabled: false
      virtual-nodes: 150
      refresh-interval-ms: 10000
      heartbeat-timeout-ms: 30000
      heartbeat-interval-ms: 5000
    model:
      enabled: false
      timeout-ms: 100
      fallback-on-error: true
      mock-enabled: false
    fact:
      enabled: false
      timeout-ms: 200
      fallback-on-error: true
    performance:
      cache-enabled: false
      cache-ttl-seconds: 300
      cache-max-size: 10000
      parallel-enabled: false
      parallel-pool-size: 0
      parallel-threshold: 50
      slow-rule-threshold-ms: 0
    lifecycle:
      enabled: true
      dormant-min-evaluations: 1000
      high-error-rate-threshold: 0.30
      stale-disabled-days: 90
      low-impact-trigger-rate: 0.001
      min-sample-size: 500
    cep:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"

skywalking:
  agent:
    service_name: ydzsz-literule
    collector_backend_service: ${SW_AGENT_COLLECTOR_BACKEND_SERVICES:127.0.0.1:11800}
