# =====================================================================
#  YDSZ 流程引擎 — 微服务端配置（Nacos 数据中心）
#  通过 bootstrap.yml shared-configs 引入
#  依赖 common: auth,base,feign,json,safe,util,excel,web,core,audit,lock
#  特色：MULTI 多级租户、流程引擎独有配置、Seata 分布式事务预留
# =====================================================================
spring:
  datasource:
    hikari:
      maximum-pool-size: 40
      pool-name: ydsz-hikari-workflow

ydsz:
  flow:
    enabled: true
    health-enabled: true
    publish-block-on-high-risk: true
    designer-lock-timeout-minutes: 30
    definition-cache:
      definition-cache-ttl-minutes: 60
      definition-cache-max-size: 1000

  tenant:
    enabled: true
    mode: MULTI
    super-tenant-id: "0"
    system-tenant-id: "1"
    tenant-fields:
      - column: tenant_id
        claim: tenantId
        header: X-Tenant-Id
      - column: company_id
        claim: companyId
        header: X-Company-Ids
      - column: dept_id
        claim: deptId
        header: X-Dept-Ids
        multi-value: true
    ignore-tables:
      - ydsz_tenant
      - ydsz_tenant_plan
      - ydsz_dict
      - ydsz_dict_data
    anon-urls:
      - /auth/login
      - /auth/register
      - /workflow/anonymous/**

  seata:
    enabled: false
    default-type: LOCAL
    tcc-enabled: false
    saga-enabled: false
    seata-at-enabled: false
    tcc-log-store: memory

  json:
    use-big-decimal: true
    streaming-enabled: true
    warmup-classes:
      - com.njydsz.workflow.infra.entity.FlowDefinition
      - com.njydsz.workflow.infra.entity.FlowInstance
      - com.njydsz.workflow.infra.entity.FlowNode
      - com.njydsz.workflow.infra.entity.FlowRunTask
      - com.njydsz.workflow.infra.entity.FlowHisTask
      - com.njydsz.workflow.infra.entity.FlowHisInstance
      - com.njydsz.workflow.infra.entity.FlowTemplate
      - com.njydsz.workflow.infra.entity.FlowAuditLog

  thread:
    pools:
      flowQueue:
        core-size: 2
        max-size: 8
        queue-capacity: 256
        thread-name-prefix: flow-queue-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 10
      auditExecutor:
        core-size: 2
        max-size: 4
        queue-capacity: 100
        thread-name-prefix: ydsz-flow-audit-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 15

  search:
    pg:
      index-table: ydsz_workflow_search_index

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"

skywalking:
  agent:
    service_name: ydzsz-workflow
    collector_backend_service: ${SW_AGENT_COLLECTOR_BACKEND_SERVICES:127.0.0.1:11800}
