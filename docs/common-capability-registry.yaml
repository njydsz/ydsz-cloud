# ======================================================================
# 违规举报与补充流程
# ======================================================================
violation_reporting:
  capability_missing:
    description: "能力遗漏举报"
    steps:
      - "在 ydsz-common 仓库提交 Issue，标题：[Capability-Add] <模块名> - <能力>"
      - "说明能力用途、API 入口类和所属层级"
      - "平台团队审核后合并"

  capability_violation:
    description: "能力违规举报（业务自建已有公共能力）"
    steps:
      - "在 ydsz-common 仓库提交 Issue，标题：[Capability-Violation] <业务模块> - <违规能力>"
      - "说明违规代码位置和已有公共能力模块名"
      - "平台团队评估后推动迁移或补录"

  layer_violation:
    description: "层级违规举报（L1 依赖 L3 等）"
    steps:
      - "在 ydsz-common 仓库提交 Issue，标题：[Layer-Violation] <模块A> -> <模块B>"
      - "说明违规依赖的类名和方法"
      - "平台团队评估后推动重构"

  version_update:
    description: "版本更新流程"
    steps:
      - "ydsz-common 每次发版前，模块维护者更新本注册表"
      - "新增能力需在 capabilities 列表中添加条目"
      - "废弃能力需标注 deprecated 并注明替代方案"
      - "版本号按语义化版本规则递增"

# ======================================================================
# 层级依赖规范速查
# ======================================================================
layer_rules:
  L1:
    allowed_dependencies: []
    description: "工具模块，仅依赖 JDK 和第三方库"
  L2:
    allowed_dependencies: [L1]
    description: "基础设施层，可依赖 L1"
  L3:
    allowed_dependencies: [L1, L2]
    description: "基础服务层，可依赖 L1/L2"
  L4:
    allowed_dependencies: [L1, L2, L3]
    description: "基础数据层；L4→L4 横切依赖例外（tenant→jdbc/redis/thread, lock→redis）"
  L5:
    allowed_dependencies: [L1, L2, L3, L4]
    description: "业务服务层，可依赖 L1-L4"
  L6:
    allowed_dependencies: [L1, L2, L3, L4, L5]
    description: "应用层入口，可依赖所有下层模块"
