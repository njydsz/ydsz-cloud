    since: "26.01.01"
    stability: stable
    capabilities:
      - name: RedisStringOps
        type: injectable-bean
        entry: com.njydsz.common.redis.service.ops.RedisStringOps
        usage: "String + Bitmap 操作"
      - name: RedisHashOps
        type: injectable-bean
        entry: com.njydsz.common.redis.service.ops.RedisHashOps
        usage: "Hash 操作"
      - name: RedisCollectionOps
        type: injectable-bean
        entry: com.njydsz.common.redis.service.ops.RedisCollectionOps
        usage: "Set + List + ZSet 操作"
      - name: RedisRateLimiter
        type: api
        entry: com.njydsz.common.redis.service.RedisRateLimiter
        usage: "分布式限流（固定窗口/滑动窗口/令牌桶）"
      - name: YdszCacheableAspect
        type: aop-aspect
        entry: com.njydsz.common.redis.aspect.YdszCacheableAspect
        usage: "@YdszCacheable 切面（防穿透/防击穿/防雪崩）"
      - name: RedisKeyExpireListener
        type: annotation-listener
        entry: com.njydsz.common.redis.annotation.RedisKeyExpireListener
        usage: "Key 过期事件监听（Keyspace Notifications）"

  # ---- ydsz-common-lock -------------------------------------------
