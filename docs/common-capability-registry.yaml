# ============================================================================
# ydzs-common 公共能力注册表
# ============================================================================
# 本文件记录 ydzs-common 全部子模块的核心能力、API 入口点和适用场景。
# 业务模块在实现通用能力前必须先查阅本注册表，确认无可用能力后再考虑自建。
# 规范依据：云顶编码规范 §22.5 公共能力复用规范（YDIZ-ARCH-004/005 等）
#
# 版本：1.0.0
# 更新日期：2026-09-25
# ============================================================================

_registry:
  version: "1.0.0"
  last_updated: "2026-09-25"
  total_modules: 30
  maintainer: "ydsz-platform-team"

modules:

  # ---- ydsz-common-json -------------------------------------------
  ydsz-common-json:
    layer: L1
    package: com.njydsz.common.json
    description: "零依赖 JSON 引擎与 Jackson 注解兼容层；内置 JsonPatch/JsonMergePatch"
    since: "26.01.01"
    stability: stable
    capabilities:
      - name: JsonMapper
        type: singleton
        entry: com.njydsz.common.json.YdszJson
        usage: "JsonMapper.toJson(obj) / fromJson(json, Class)"
      - name: YdszJson
        type: static-delegate
        entry: com.njydsz.common.json.YdszJson
        usage: "零 Jackson 运行时依赖，YdszJson.toJson/parse"
      - name: JsonPatch
        type: static-utility
        entry: com.njydsz.common.json.JsonPatch
        usage: "RFC 6902 JSON Patch"
      - name: JsonMergePatch
        type: static-utility
        entry: com.njydsz.common.json.JsonMergePatch
        usage: "RFC 7386 JSON Merge Patch"
    prohibited_alternatives:
      - import com.fasterxml.jackson.*
      - import com.alibaba.fastjson2.*
    related_rules:
      - YDIZ-WARN-001
