  # ---- ydsz-common-jdbc -------------------------------------------
  ydsz-common-jdbc:
    layer: L4
    package: com.njydsz.common.jdbc
    description: "MyBatis-Plus 增强；动态数据源 / 数据权限 / SQL 防火墙"
    since: "26.01.01"
    stability: stable
    capabilities:
      - name: DynamicRoutingDataSource
        type: spring-bean
        entry: com.njydsz.common.jdbc.datasource.DynamicRoutingDataSource
        usage: "运行时动态增删数据源、栈式嵌套切换"
      - name: DsAnnotationInterceptor
        type: aop-interceptor
        entry: com.njydsz.common.jdbc.aop.DsAnnotationInterceptor
        usage: "@DS 注解 AOP 拦截器（方法级优先于类级）"
      - name: RowPermissionInnerInterceptor
        type: mybatis-interceptor
        entry: com.njydsz.common.jdbc.permission.RowPermissionInnerInterceptor
        usage: "行级数据权限（SQL 解析注入 WHERE）"
      - name: ColPermissionInnerInterceptor
        type: mybatis-interceptor
        entry: com.njydsz.common.jdbc.permission.ColPermissionInnerInterceptor
        usage: "列级权限（SELECT 字段过滤）"
      - name: SqlFirewallInnerInterceptor
        type: mybatis-interceptor
        entry: com.njydsz.common.jdbc.firewall.SqlFirewallInnerInterceptor
        usage: "SQL 防火墙（DROP/TRUNCATE/无 WHERE DML/多语句）"
      - name: MybatisPlusConfiguration
        type: spring-configuration
        entry: com.njydsz.common.jdbc.config.MybatisPlusConfiguration
        usage: "MP 全局配置（乐观锁+字段填充+权限+分页+防火墙）"

