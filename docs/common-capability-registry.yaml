# ============================================================================
# ydzs-common 公共能力注册表
# ============================================================================
# 本文件记录 ydzs-common 全部子模块的核心能力、API 入口点和适用场景。
# 业务模块在实现通用能力前必须先查阅本注册表，确认无可用能力后再考虑自建。
# 规范依据：云顶编码规范 §22.5 公共能力复用规范（YDIZ-ARCH-004/005 等）
#
# 版本：1.0.0
# 更新日期：2026-09-25
# ============================================================================

_registry:
  version: "1.0.0"
  last_updated: "2026-09-25"
  total_modules: 30
  maintainer: "ydsz-platform-team"

modules:

  # ---- ydsz-common-json -------------------------------------------
  ydsz-common-json:
    layer: L1
    package: com.njydsz.common.json
    description: "零依赖 JSON 引擎与 Jackson 注解兼容层；内置 JsonPatch/JsonMergePatch"
    since: "26.01.01"
    stability: stable
    capabilities:
      - name: JsonMapper
        type: singleton
        entry: com.njydsz.common.json.YdszJson
        usage: "JsonMapper.toJson(obj) / fromJson(json, Class)"
      - name: YdszJson
        type: static-delegate
        entry: com.njydsz.common.json.YdszJson
        usage: "零 Jackson 运行时依赖，YdszJson.toJson/parse"
      - name: JsonPatch
        type: static-utility
        entry: com.njydsz.common.json.JsonPatch
        usage: "RFC 6902 JSON Patch"
      - name: JsonMergePatch
        type: static-utility
        entry: com.njydsz.common.json.JsonMergePatch
        usage: "RFC 7386 JSON Merge Patch"
    prohibited_alternatives:
      - import com.fasterxml.jackson.*
      - import com.alibaba.fastjson2.*
    related_rules:
      - YDIZ-WARN-001
  # ---- ydsz-common-util -------------------------------------------
  ydsz-common-util:
    layer: L1
    package: com.njydsz.common.util
    description: "通用工具集：雪花 ID / 国密算法 / Bean 工具 / 网络工具 / 安全工具"
    since: "26.01.01"
    stability: stable
    capabilities:
      - name: SnowflakeIdGenerator
        type: singleton
        entry: com.njydsz.common.util.id.SnowflakeIdGenerator
        usage: "雪花 ID 生成器（PodOrdinal → IpHash 策略链）"
      - name: CryptoUtils
        type: static-utility
        entry: com.njydsz.common.util.security.crypto.CryptoUtils
        usage: "国密 SM2/SM3/SM4 + AES-GCM 加解密统一入口"
      - name: BeanMapper
        type: static-utility
        entry: com.njydsz.common.util.bean.BeanMapper
        usage: "Bean 属性拷贝（不同名映射 + 空值跳过）"
      - name: DiffCalculator
        type: static-utility
        entry: com.njydsz.common.util.bean.DiffCalculator
        usage: "对象字段差异计算（审计日志场景）"
      - name: MaskUtils
        type: static-utility
        entry: com.njydsz.common.util.text.MaskUtils
        usage: "脱敏工具（手机号/身份证/银行卡/邮箱/姓名/地址）"

  # ---- ydsz-common-cache ------------------------------------------
  ydsz-common-cache:
    layer: L1
    package: com.njydsz.common.cache
    description: "高性能本地缓存框架：Window-TinyLFU/Striped 双策略 + 三防"
    since: "26.01.01"
    stability: stable
    capabilities:
      - name: YdszCache
        type: fluent-builder
        entry: com.njydsz.common.cache.YdszCache
        usage: "YdszCache.newBuilder().type(TINYLFU).maximumSize(N).build()"
      - name: CacheBuilder
        type: fluent-builder
        entry: com.njydsz.common.cache.builder.CacheBuilder
        usage: "链式配置容量、过期、loader、writer，对标 Caffeine"
      - name: CacheProtectionGuard
        type: internal-delegate
        entry: com.njydsz.common.cache.core.CacheProtectionGuard
        usage: "防穿透/防击穿/防雪崩三防守卫"
      - name: WriteThroughCache
        type: decorator
        entry: com.njydsz.common.cache.support.WriteThroughCache
        usage: "写穿透装饰器，put 时同步写入后端存储"
      - name: YdszCacheManager
        type: spring-integration
        entry: com.njydsz.common.cache.YdszCacheManager
        usage: "Spring CacheManager，支持 @Cacheable/@CacheEvict/@CachePut"

