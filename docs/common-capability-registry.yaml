        usage: "索引维护 SPI（index/bulkIndex/deleteIndex）"
      - name: SearchProvider
        type: spi
        entry: com.njydsz.common.search.provider.SearchProvider
        usage: "业务数据提供者 SPI（toIndexDocument/toSearchHit/getFilters）"
      - name: PgSearchStrategy
        type: injectable-bean
        entry: com.njydsz.common.search.strategy.impl.PgSearchStrategy
        usage: "PostgreSQL tsvector 引擎（zhparser 中文分词）"
      - name: InMemorySearchStrategy
        type: injectable-bean
        entry: com.njydsz.common.search.strategy.impl.InMemorySearchStrategy
        usage: "内存引擎（降级兜底）"
      - name: UnifiedSearchService
        type: injectable-bean
        entry: com.njydsz.common.search.service.UnifiedSearchService
        usage: "统一搜索入口（并发检索 + 熔断降级 + 结果缓存）"

  # ---- ydsz-common-sentry -----------------------------------------
  ydsz-common-sentry:
    layer: L5
    package: com.njydsz.common.sentry
    description: "统一可观测性；OpenTelemetry + SkyWalking + 双路日志 + SLA + 告警"
    since: "26.01.01"
    stability: stable
    capabilities:
      - name: MetricsCollector
        type: spi
        entry: com.njydsz.common.sentry.spi.MetricsCollector
        usage: "指标采集 SPI（Counter/Gauge/Timer/Histogram）"
      - name: LogPublisher
        type: spi
        entry: com.njydsz.common.sentry.spi.LogPublisher
        usage: "日志发布 SPI（ELK/Loki/Dual/Async/NoOp 五种）"
      - name: TraceContext
        type: spi
        entry: com.njydsz.common.sentry.spi.TraceContext
        usage: "追踪上下文 SPI（SkyWalking/OpenTelemetry/MDC）"
      - name: AlertPublisher
        type: spi
        entry: com.njydsz.common.sentry.spi.AlertPublisher
        usage: "告警发布 SPI（经 AlertConverger 收敛后发布）"
      - name: SlaMetric
        type: annotation
        entry: com.njydsz.common.sentry.sla.SlaMetric
        usage: "SLA 注解（name/thresholdMillis/slaTarget）"
      - name: CircuitBreaker
        type: spring-bean
        entry: com.njydsz.common.sentry.circuitbreaker.CircuitBreaker
        usage: "统一熔断器（Resilience4j，CAS HALF_OPEN 安全）"
  # ---- ydsz-common-base -------------------------------------------
  ydsz-common-base:
    layer: L6
    package: com.njydsz.common.base
    description: "HTTP 公共基座；CORS/I18n/安全头/TraceId/请求日志/全局响应包装"
    since: "26.01.01"
    stability: stable
    capabilities:
      - name: BaseMvcConfiguration
        type: abstract-class
        entry: com.njydsz.common.base.config.BaseMvcConfiguration
        usage: "MVC 配置抽象基类（web/app 继承）"
      - name: BaseGlobalResponseAdvice
        type: abstract-class
        entry: com.njydsz.common.base.advice.BaseGlobalResponseAdvice
        usage: "全局响应包装抽象基类（YdszResponse 自动包装）"
      - name: TraceFilter
        type: servlet-filter
        entry: com.njydsz.common.base.filter.TraceFilter
        usage: "链路追踪过滤器（traceId 生成/注入 MDC）"
      - name: SecurityHeadersFilter
        type: servlet-filter
        entry: com.njydsz.common.base.filter.SecurityHeadersFilter
        usage: "安全响应头（CSP/HSTS/X-Frame-Options 等）"
      - name: RequestContextCleanupFilter
        type: servlet-filter
        entry: com.njydsz.common.base.filter.RequestContextCleanupFilter
        usage: "请求上下文清理（finally 块清理 TTL/MDC）"
      - name: YdszHealthIndicator
        type: health-indicator
        entry: com.njydsz.common.base.health.YdszHealthIndicator
        usage: "base 模块健康指标（时区+安全头+堆内存）"

  # ---- ydsz-common-web --------------------------------------------
  ydsz-common-web:
    layer: L6
    package: com.njydsz.common.web
    description: "PC Web 端基座；base + Spring Security + WebAuthFilter + Session"
    since: "26.01.01"
    stability: stable
    capabilities:
      - name: WebMvcConfiguration
        type: spring-configuration
        entry: com.njydsz.common.web.config.WebMvcConfiguration
        usage: "MVC 配置（继承 BaseMvcConfiguration）"
      - name: WebSecurityConfiguration
        type: spring-configuration
        entry: com.njydsz.common.web.config.WebSecurityConfiguration
        usage: "Spring Security 配置（SecurityFilterChain + 401/403）"
      - name: WebAuthFilter
        type: servlet-filter
        entry: com.njydsz.common.web.security.WebAuthFilter
        usage: "Web 认证过滤器（Token → SecurityContext）"
      - name: GlobalResponseAdvice
        type: controller-advice
        entry: com.njydsz.common.web.advice.GlobalResponseAdvice
        usage: "全局响应包装（继承 BaseGlobalResponseAdvice）"
      - name: ApiVersionAutoConfiguration
        type: spring-configuration
        entry: com.njydsz.common.web.version.ApiVersionAutoConfiguration
        usage: "API 版本控制自动配置（URL 路径版本路由）"

  # ---- ydsz-common-app --------------------------------------------
  ydsz-common-app:
    layer: L6
    package: com.njydsz.common.app
    description: "移动端 App 基座；base + AppAuthFilter + @AppApi 作用域隔离"
    since: "26.01.01"
    stability: stable
    capabilities:
      - name: AppMvcConfiguration
        type: spring-configuration
        entry: com.njydsz.common.app.config.AppMvcConfiguration
        usage: "App 端 MVC 核心配置（继承 BaseMvcConfiguration）"
      - name: AppAuthFilter
        type: servlet-filter
        entry: com.njydsz.common.app.security.AppAuthFilter
        usage: "App 认证过滤器（优先 AuthenticationProvider）"
      - name: AppGlobalResponseAdvice
        type: controller-advice
        entry: com.njydsz.common.app.advice.AppGlobalResponseAdvice
        usage: "App 全局响应（@AppApi 作用域隔离）"
      - name: AppHealthIndicator
        type: health-indicator
        entry: com.njydsz.common.app.health.AppHealthIndicator
        usage: "App 模块健康指标（API 签名+指标采集状态）"
