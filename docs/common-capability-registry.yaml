      - name: RedisReentrantLock
        type: injectable-bean
        entry: com.njydsz.common.lock.impl.RedisReentrantLock
        usage: "可重入锁（默认实现）"
      - name: RedisFairLock
        type: injectable-bean
        entry: com.njydsz.common.lock.impl.RedisFairLock
        usage: "公平锁（按请求时序获取）"
      - name: IdempotentAspect
        type: aop-aspect
        entry: com.njydsz.common.lock.aop.IdempotentAspect
        usage: "@Idempotent 注解切面（Redis Lua SETNX）"
      - name: DistributedScheduledAspect
        type: aop-aspect
        entry: com.njydsz.common.lock.aop.DistributedScheduledAspect
        usage: "@DistributedScheduled 分布式定时任务注解"

