# =====================================================================
#  YDSZ API 网关服务 bootstrap 配置
#  --------------------------------------------------------------------
#  端口：9000
#  职责：统一入口、路由分发、限流/熔断、CORS、认证、日志、Sentinel
#  依赖：Nacos 服务发现 / 配置中心
#  说明：bootstrap.yml 在 application.yml 之前加载，用于提前连接 Nacos
# =====================================================================

server:
  # 网关监听端口（按构建顺序 1/7）
  port: 9000
  # P1-3: 请求头大小限制（防止大请求攻击）
  max-http-request-header-size: 16KB

spring:
  application:
    name: ydsz-gateway
  profiles:
    # 默认 dev，可通过 -Dspring.profiles.active=dev|sit|uat|prod 或 ENV SPRING_PROFILES_ACTIVE 覆盖
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      # ---------- 服务注册 ----------
      discovery:
        enabled: true
        register-enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ydsz}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        # 服务实例元数据（供其他服务做灰度路由、版本标识等使用）
        metadata:
          version: 1.0.0
          port: 9000
        # 心跳/IP 类型
        ip-type: IPv4
      # ---------- 配置中心 ----------
      config:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ydsz}
        group: ${NACOS_GROUP:${spring.profiles.active}}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        # 配置文件后缀
        file-extension: yaml
        # 开启自动刷新（@RefreshScope 注解配合使用）
        refresh-enabled: true
        # 引入共享配置：datasource / redis / mybatis-plus / springdoc / logging
        # 所有服务共享一份配置，修改一次全集群生效
        shared-configs:
          - data-id: ydsz-common.yaml
            group: ${spring.profiles.active}
            refresh: true
          # P0-3: 网关路由动态配置（Nacos 刷新后自动生效）
          - data-id: ydsz-gateway-routes.yaml
            group: ${spring.profiles.active}
            refresh: true
