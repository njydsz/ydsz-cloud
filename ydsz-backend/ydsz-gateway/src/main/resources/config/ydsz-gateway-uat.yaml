# =====================================================================
#  YDSZ · Gateway · UAT 环境配置（Nacos DataId）
#  --------------------------------------------------------------------
#  DataId:    ydsz-gateway-uat.yaml
#  Group:     uat
#  Profile:   uat
#  端口:      9000
# =====================================================================

server:
  port: 9000
  max-http-request-header-size: 16KB
  # P1-10: 响应压缩（节省 60-80% 带宽）
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024
  # P0-阶段二-8: 优雅停机（等待进行中的请求完成）
  shutdown: graceful
  # P1: 隐藏 Server 响应头，避免暴露 Reactor Netty 技术栈指纹
  netty:
    response:
      server-header: ""

spring:
  profiles: uat
  # P0-阶段二-8: 优雅停机超时（30s 内未完成则强制关闭）
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:https://uat.example.com,https://*.uat.example.com}
            allowedMethods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
            allowedHeaders: "Authorization,Content-Type,X-Requested-With,X-Access-Token,X-Trace-Id,X-Gray-Tag"
            exposedHeaders:
              - Authorization
              - X-Trace-Id
              - Content-Disposition
            allowCredentials: true
            maxAge: 3600
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        # P0-4: 请求体大小限制 10MB（防 DoS）
        - RequestSize=10485760
        # P0-阶段二-5: 网关层重试（仅对 GET 幂等请求重试，避免非幂等请求重复执行）
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,SERVICE_UNAVAILABLE
            methods: GET,OPTIONS
            backoff:
              firstBackoff: 100ms
              maxBackoff: 500ms
              factor: 2
              basedOnPreviousValue: true
      # P0-3: 连接超时 + 响应超时（防雪崩）
      httpclient:
        connect-timeout: 3000
        response-timeout: 30s
        websocket:
          max-frame-payload-length: 65536
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
        port: ${SENTINEL_TRANSPORT_PORT:8719}
      eager: true
      filter:
        enabled: true
      scg:
        fallback:
          mode: response
          response-status: 429
          response-body: '{"code":429,"message":"error.RATE_LIMIT"}'
    loadbalancer:
      configurations: gray
      nacos:
        enabled: true

feign:
  sentinel:
    enabled: true

# =====================================================================
# YDSZ · Gateway · P0 安全配置（P0-2 / P0-4 / P0-6）
# =====================================================================
ydsz:
  gateway:
    # P0-2: 内部头签名密钥（与 JWT 密钥分离）
    # UAT 环境通过 YDSZ_GATEWAY_INTERNAL_SIGN_SECRET 环境变量注入
    internal-sign-secret: ${YDSZ_GATEWAY_INTERNAL_SIGN_SECRET:${JWT_SECRET:}}
    # P0-4: WebSocket Origin 白名单
    websocket:
      allowed-origins: ${YDSZ_GATEWAY_WS_ALLOWED_ORIGINS:https://uat.example.com,https://*.uat.example.com}
    # P0-阶段二-2/3/4: Sentinel 规则配置
    sentinel:
      nacos-datasource-enabled: false
      degrade-rule-data-id: ydsz-gateway-sentinel-degrade.json
      system-rule-data-id: ydsz-gateway-sentinel-system.json
      rule-group: uat
    # P0-阶段二-6: HttpClient 连接池配置
    httpclient:
      pool:
        max-connections: 800
        pending-acquire-timeout-ms: 45000
        max-idle-time-seconds: 30
        max-life-time-seconds: 60
        eviction-interval-seconds: 60
    # P0-阶段二-7: K8s health probe 路径放行
    health-probe:
      paths:
        - /actuator/health
        - /actuator/health/liveness
        - /actuator/health/readiness
        - /actuator/info

# 日志级别（uat 环境 INFO）
logging:
  level:
    root: INFO
    "[com.njydsz]": INFO
    "[org.springframework.cloud.gateway]": INFO

# UAT 关闭文档 UI
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false
knife4j:
  production: true

management:
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: when-authorized
      # P0-阶段二-7: K8s 探针分组（liveness / readiness）
      group:
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState
            - ping
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
