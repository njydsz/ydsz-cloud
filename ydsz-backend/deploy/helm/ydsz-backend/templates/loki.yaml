{{- /*
  YDSZ · Loki 日志聚合引擎（单副本 Deployment + Service）
  启用方式：helm install ... --set loki.enabled=true
*/ -}}
{{- if .Values.loki.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ydsz-backend.fullname" . }}-loki-config
  labels:
    {{- include "ydsz-backend.labels" . | nindent 4 }}
data:
  loki-config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: {{ .Values.loki.port }}
      grpc_listen_port: 9096
      log_level: info
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: boltdb-shipper
          object_store: filesystem
          schema: v12
          index:
            prefix: index_
            period: 24h
    storage_config:
      boltdb_shipper:
        active_index_directory: /loki/boltdb-shipper-active
        cache_location: /loki/boltdb-shipper-cache
        cache_ttl: 24h
      filesystem:
        directory: /loki/chunks
    compactor:
      working_directory: /loki/boltdb-shipper-compactor
      shared_store: filesystem
    limits_config:
      retention_period: {{ .Values.loki.config.retention_period | default "168h" }}
      max_query_lookback: {{ .Values.loki.config.max_query_lookback | default "168h" }}
      reject_old_samples: true
      reject_old_samples_max_age: {{ .Values.loki.config.retention_period | default "168h" }}
    ruler:
      alertmanager_url: ""
      rule_path: /loki/rules-temp
      storage:
        type: local
        local:
          directory: /loki/rules
      ring:
        kvstore:
          store: inmemory
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ydsz-backend.fullname" . }}-loki
  labels:
    {{- include "ydsz-backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.loki.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ydsz-backend.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: loki
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ydsz-backend.fullname" . }}-loki
  labels:
    {{- include "ydsz-backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ydsz-backend.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: loki
  template:
    metadata:
      labels:
        {{- include "ydsz-backend.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: loki
    spec:
      containers:
        - name: loki
          image: "{{ .Values.loki.image.repository }}:{{ .Values.loki.image.tag }}"
          imagePullPolicy: {{ .Values.loki.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.loki.port }}
              name: http
              protocol: TCP
          args:
            - "-config.file=/etc/loki/config.yaml"
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
          resources:
            {{- toYaml .Values.loki.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: {{ include "ydsz-backend.fullname" . }}-loki-config
        - name: data
          {{- if .Values.loki.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ydsz-backend.fullname" . }}-loki
          {{- else }}
          emptyDir: {}
          {{- end }}
---
{{- if .Values.loki.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ydsz-backend.fullname" . }}-loki
  labels:
    {{- include "ydsz-backend.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.loki.persistence.storageClass }}
  storageClassName: {{ .Values.loki.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.loki.persistence.size }}
{{- end }}
{{- end }}
