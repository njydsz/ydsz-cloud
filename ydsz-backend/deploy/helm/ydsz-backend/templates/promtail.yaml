{{- /*
  YDSZ · Promtail 日志采集代理（DaemonSet）
  启用方式：helm install ... --set promtail.enabled=true

  自动采集节点上 /var/log/ydsz-*.log 并推送到 Loki。
  可与日志 emptDir hostPath 挂载日志目录（微服务同节点时）。
*/ -}}
{{- if .Values.promtail.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ydsz-backend.fullname" . }}-promtail-config
  labels:
    {{- include "ydsz-backend.labels" . | nindent 4 }}
data:
  promtail-config.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
      log_level: info
    scrape_configs:
      - job_name: ydsz-logs
        static_configs:
          - targets:
              - localhost
            labels:
              job: ydsz-logs
              __path__: {{ .Values.promtail.logPath }}
        pipeline_stages:
          {{- if eq .Values.promtail.pipeline.format "json" }}
          - json:
              expressions:
                level: level
                message: message
                logger: logger_name
                thread: thread
                trace_id: trace_id
                span_id: span_id
                service: service_name
          - labels:
              level:
              service:
          - timestamp:
              source: timestamp
              format: "2006-01-02T15:04:05.000Z07:00"
          {{- else }}
          - regex:
              expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2}\s\d{2}:\d{2}:\d{2}\.\d{3})\s+(?P<level>\w+)\s+\[(?P<service>[^\]]*),\s*(?P<trace_id>[^,]*),\s*(?P<span_id>[^\]]*)\]\s+(?P<thread>\S+)\s+(?P<logger>\S+)\s+-\s+(?P<message>.*)$'
          - labels:
              level:
              service:
          - timestamp:
              source: timestamp
              format: "2006-01-02 15:04:05.000"
          {{- end }}
          - output:
              source: message
    clients:
      - url: {{ .Values.promtail.lokiUrl }}
        batchwait: 1s
        batchsize: 102400
        backoff_config:
          min_period: 500ms
          max_period: 5m
          max_retries: 10
        external_labels:
          source: {{ include "ydsz-backend.fullname" . }}-promtail
    positions:
      filename: /tmp/positions/positions.yaml
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "ydsz-backend.fullname" . }}-promtail
  labels:
    {{- include "ydsz-backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: promtail
spec:
  selector:
    matchLabels:
      {{- include "ydsz-backend.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: promtail
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "ydsz-backend.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: promtail
    spec:
      serviceAccountName: {{ include "ydsz-backend.fullname" . }}-promtail
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: promtail
          image: "{{ .Values.promtail.image.repository }}:{{ .Values.promtail.image.tag }}"
          imagePullPolicy: {{ .Values.promtail.image.pullPolicy }}
          args:
            - "-config.file=/etc/promtail/config.yaml"
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: logs
              mountPath: /var/log
              readOnly: true
            - name: positions
              mountPath: /tmp/ports
          ports:
            - containerPort: 9080
              name: http-metrics
              protocol: TCP
          resources:
            {{- toYaml .Values.promtail.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            runAsUser: 0
            privileged: true
      volumes:
        - name: config
          configMap:
            name: {{ include "ydsz-backend.fullname" . }}-promtail-config
        - name: logs
          hostPath:
            path: /var/log
            type: Directory
        - name: positions
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ydsz-backend.fullname" . }}-promtail
  labels:
    {{- include "ydsz-backend.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ydsz-backend.fullname" . }}-promtail
  labels:
    {{- include "ydsz-backend.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ydsz-backend.fullname" . }}-promtail
  labels:
    {{- include "ydsz-backend.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ydsz-backend.fullname" . }}-promtail
subjects:
  - kind: ServiceAccount
    name: {{ include "ydsz-backend.fullname" . }}-promtail
    namespace: {{ .Release.Namespace }}
{{- end }}
