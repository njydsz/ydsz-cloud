# =============================================================================
#  YDSZ · 本地开发环境一键启动（P1-9）
# -----------------------------------------------------------------------------
#  用法：
#    docker compose -f deploy/docker-compose.dev.yml up -d     # 启动基础设施
#    docker compose -f deploy/docker-compose.dev.yml ps        # 查看状态
#    docker compose -f deploy/docker-compose.dev.yml down      # 停止（保留数据卷）
#    docker compose -f deploy/docker-compose.dev.yml down -v   # 停止并清空数据
#
#  基础设施清单：
#    PostgreSQL 17 (pgvector)  :5432   ydsz/ydsz123  ydsz 库
#    Redis 7                   :6379
#    Nacos 2.3.2               :8848/9848
#    RocketMQ 5.3.3            :9876/10909/10911  dashboard:8080
#    MinIO                     :9002/9003        minioadmin/minioadmin
#    OTel Collector + Jaeger   :4317/16686
#
#  启动后执行：./deploy/scripts/dev-start.sh 启动各微服务
# =============================================================================
version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ydsz-dev-postgres
    environment:
      POSTGRES_DB: ydsz
      POSTGRES_USER: ydsz
      POSTGRES_PASSWORD: ydsz123
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      # 首次启动自动执行 schema（按需开启，注意 V1.0.0__init.sql 需先导出真实 DDL）
      # - ../sql/:/docker-entrypoint-initdb.d/:ro
    command: ["postgres", "-c", "max_connections=600"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ydsz -d ydsz"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ydsz-dev-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: ydsz-dev-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: "SecretKey012345678901234567890123456789012345678901234567890123456789"
      NACOS_AUTH_IDENTITY_KEY: nacos
      NACOS_AUTH_IDENTITY_VALUE: nacos
    ports:
      - "8848:8848"
      - "9848:9848"   # gRPC 端口（客户端连接必需）
    volumes:
      - nacos-data:/home/nacos/data

  rocketmq:
    image: apache/rocketmq:5.3.3
    container_name: ydsz-dev-rocketmq
    environment:
      NAMESRV_ADDR: "localhost:9876"
    command: sh mqnamesrv
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.3.3
    container_name: ydsz-dev-rocketmq-broker
    depends_on:
      - rocketmq
    environment:
      NAMESRV_ADDR: "rocketmq:9876"
    command: sh mqbroker -n rocketmq:9876 --enable-proxy
    ports:
      - "10909:10909"
      - "10911:10911"
    volumes:
      - broker-data:/home/rocketmq/store

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: ydsz-dev-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9003"
    ports:
      - "9002:9000"   # API
      - "9003:9001"   # Console
    volumes:
      - minio-data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: ydsz-dev-otel
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: ydsz-dev-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

volumes:
  pg-data:
  redis-data:
  nacos-data:
  broker-data:
  minio-data:
