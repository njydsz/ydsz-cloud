# =============================================================================
#  YDSZ · 后端微服务通用 Deployment 模板
# -----------------------------------------------------------------------------
#  占位符（Go template 风格，部署前由 envsubst / sed 渲染）：
#    ${SERVICE_NAME}            K8s 资源名称（如 ydsz-gateway / ydsz-system）
#    ${MODULE_NAME}             Maven 模块名（如 ydsz-gateway，用于容器名与溯源）
#    ${IMAGE_TAG}               镜像版本标签（如 v1.3.0）
#    ${APP_PORT}                服务监听端口（如 9000）
#    ${SPRING_PROFILES_ACTIVE}  Spring profile（dev|sit|uat|prod）
#    ${NACOS_SERVER_ADDR}       Nacos 地址（如 nacos:8848）
#    ${OTEL_EXPORTER_OTLP_ENDPOINT}  OpenTelemetry OTLP 上报地址
#
#  渲染示例：
#    envsubst < deployment-template.yaml > ydsz-gateway-deployment.yaml
#
#  设计要点（对齐前端 frontend-deployment.yaml 风格）：
#    1. 副本数 3，跨节点反亲和（topologySpreadConstraints）提升可用性
#    2. 三探针：startup / liveness / readiness，路径走 Spring Boot Actuator
#    3. 优雅停机：terminationGracePeriodSeconds=60 + preStop sleep 10
#    4. 资源：request→limit 收窄至 2-4x，HPA 扩缩容更可预测
#
#  @path deploy/k8s/deployment-template.yaml
#  @author ydsz-team
#  @since 1.0.0
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${SERVICE_NAME}
  labels:
    app: ${SERVICE_NAME}
    module: ${MODULE_NAME}
    component: backend
    app.kubernetes.io/name: ${SERVICE_NAME}
    app.kubernetes.io/part-of: ydsz-pmis
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ${SERVICE_NAME}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ${SERVICE_NAME}
        module: ${MODULE_NAME}
        component: backend
        app.kubernetes.io/name: ${SERVICE_NAME}
        app.kubernetes.io/part-of: ydsz-pmis
    spec:
      # E6: 跨节点反亲和，确保 Pod 分散到不同节点，提升可用性
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ${SERVICE_NAME}
      containers:
        - name: ${MODULE_NAME}
          image: registry.example.com/ydsz/${SERVICE_NAME}:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: ${APP_PORT}
              name: http
              protocol: TCP
          env:
            - name: APP_PORT
              value: "${APP_PORT}"
            - name: SPRING_PROFILES_ACTIVE
              value: "${SPRING_PROFILES_ACTIVE}"
            - name: NACOS_SERVER_ADDR
              value: "${NACOS_SERVER_ADDR}"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "${OTEL_EXPORTER_OTLP_ENDPOINT}"
          resources:
            # JVM 启动期吃内存，request→limit 间距 2-4x，使 HPA 扩缩容更可预测
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          # 启动探针：Spring Boot 启动较慢，failureThreshold=30 给足预热时间（最长 ~5 分钟）
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          # 浅探针：验证 JVM 存活
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # 深探针：验证服务就绪（含依赖：DB / Redis / Nacos）
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "sleep 10"
      # 优雅停机：Spring Boot graceful + K8s 宽限期 60s
      # 配合 deploy/config/ydsz-common-graceful-shutdown.yaml（timeout-per-shutdown-phase: 30s）
      terminationGracePeriodSeconds: 60
