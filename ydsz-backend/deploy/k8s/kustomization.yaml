# =============================================================================
#  YDSZ · 后端微服务 Kustomize 基础配置
# -----------------------------------------------------------------------------
#  说明：
#    本目录的 *-template.yaml 含 ${SERVICE_NAME} 等占位符，无法被 kustomize
#    直接 apply。请先渲染占位符，再叠加 kustomize。
#
#  推荐用法 1（envsubst 预渲染 + kustomize 叠加）：
#    mkdir -p rendered
#    envsubst < deployment-template.yaml > rendered/deployment.yaml
#    envsubst < service-template.yaml    > rendered/service.yaml
#    envsubst < hpa-template.yaml        > rendered/hpa.yaml
#    kubectl apply -k deploy/k8s/        # 或对 rendered/ 单独 kustomize
#
#  推荐用法 2（按模块覆盖）：
#    在 deploy/k8s/overlays/<module>/ 下创建 kustomization.yaml，
#    通过 namePrefix / patches 注入模块专属配置（端口 / 副本数 / 资源）。
#
#  @path deploy/k8s/kustomization.yaml
#  @author ydsz-team
#  @since 1.0.0
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 资源清单（占位符渲染后生效）
resources:
  - deployment-template.yaml
  - service-template.yaml
  - hpa-template.yaml

# 公共标签（追加到所有资源）
commonLabels:
  app.kubernetes.io/part-of: ydsz-pmis
  app.kubernetes.io/managed-by: kustomize

# 公共注解
commonAnnotations:
  note: "Generated by kustomize. Render ${SERVICE_NAME} placeholders before apply."
