# =============================================================================
#  YDSZ · 后端微服务通用优雅停机配置
# -----------------------------------------------------------------------------
#  作为 Nacos 共享配置（ydsz-common.yaml 系列）下发，全集群生效。
#  与 K8s terminationGracePeriodSeconds=60 + preStop sleep 10 配合：
#    1. Pod 收到 SIGTERM，Service 端点摘除（preStop sleep 10 等待摘除传播）
#    2. Spring Boot 进入 graceful 停机，拒绝新请求、等待在途请求完成
#    3. timeout-per-shutdown-phase=30s 内未完成的请求被强制中断
#    4. K8s 宽限期 60s 足够覆盖 preStop(10s) + graceful(30s) + 余量
#
#  说明：Dockerfile 已用 tini 作为 PID 1，确保 SIGTERM 正确转发给 JVM。
#
#  @path deploy/config/ydsz-common-graceful-shutdown.yaml
#  @author ydsz-team
#  @since 1.0.0
# =============================================================================
server:
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
