# =====================================================================
#  共享数据源配置（Druid 连接池调优）
#  --------------------------------------------------------------------
#  通过 Nacos shared-configs 引入，所有服务共享此配置
#
#  对标：阿里数据库规范 + 美团连接池最佳实践
#    - 初始化连接数：10
#    - 最小空闲连接数：10
#    - 最大活跃连接数：50（按 10 服务 × 50 = 500 总连接评估 PG 最大连接数）
#    - 获取连接超时：5s
#    - 空闲连接回收周期：60s
#    - 慢 SQL 阈值：1s
# =====================================================================

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # ---------- 基础连接配置 ----------
      url: ${DB_URL:jdbc:postgresql://localhost:5432/ydsz_pmis?currentSchema=ydsz&stringtype=unspecified}
      username: ${DB_USERNAME:ydsz}
      password: ${DB_PASSWORD:ydsz123}
      driver-class-name: org.postgresql.Driver

      # ---------- 连接池大小 ----------
      initial-size: 10
      min-idle: 10
      max-active: 50
      max-wait: 5000

      # ---------- 连接保活 ----------
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      keep-alive: true
      keep-alive-between-time-millis: 60000

      # ---------- 连接验证 ----------
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      validation-query-timeout: 10

      # ---------- 连接泄漏检测 ----------
      remove-abandoned: true
      remove-abandoned-timeout: 300
      log-abandoned: true

      # ---------- 预处理语句池 ----------
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      share-prepared-statements: true

      # ---------- 监控过滤器 ----------
      filters: stat,wall,slf4j
      filter:
        # SQL 监控过滤器
        stat:
          enabled: true
          slow-sql-millis: 1000
          log-slow-sql: true
          merge-sql: true
          db-type: postgres

        # SQL 防火墙
        wall:
          enabled: true
          db-type: postgres
          # 禁止 DROP TABLE / DROP INDEX 等危险操作（防止误操作 + SQL 注入）
          drop-table-allow: false
          truncate-allow: false
          alter-table-allow: true
          create-table-allow: false
          # 禁止多语句执行（防止堆叠注入）
          multi-statement-allow: false

        # 日志过滤器
        slf4j:
          enabled: true
          statement-log-enabled: false
          statement-executable-sql-log-enable: true

      # ---------- Web 监控 ----------
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"

      stat-view-servlet:
        enabled: false  # 生产环境禁用，开发环境可开启
        url-pattern: /druid/*
        login-username: admin
        login-password: admin
        reset-enable: false

      # ---------- aop-patterns（监控 Spring Bean）----------
      aop-patterns: com.njydsz.*.service.*,com.njydsz.*.mapper.*
