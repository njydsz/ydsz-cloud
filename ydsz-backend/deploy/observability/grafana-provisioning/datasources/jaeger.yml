# Grafana Jaeger 数据源自动接入配置
# 用于 Trace 可视化 & 与 Loki 日志 trace_uid 联动

apiVersion: 1

datasources:
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    isDefault: false
    editable: false
    uid: jaeger
    jsonData:
      # 追踪 traces 来自 OTLP 上报
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: "service"
            value: "service"
