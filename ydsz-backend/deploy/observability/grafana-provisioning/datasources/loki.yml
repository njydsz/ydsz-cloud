# Grafana Loki 数据源自动接入配置
# 与 Prometheus 数据源并存，支持 log↔trace 串联

apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      # 派生字段：从 log line 提取的 trace_uid 字段跳转到 Jaeger
      derivedFields:
        - datasourceUid: jaeger
          name: TraceID
          matcherRegex: '"trace_id":"(\w+)"'
          url: '$${__value.raw}'
          urlDisplayLabel: 'View in Jaeger'
        - datasourceUid: tempo
          name: TraceID_Tempo
          matcherRegex: '"trace_id":"(\w+)"'
          url: '$${__value.raw}'
          urlDisplayLabel: 'View in Tempo'
      # 最大行数限制
      maxLines: 1000
