# Grafana Dashboard Provisioning（自动导入看板）

apiVersion: 1

providers:
  - name: "YDSZ Dashboards"
    orgId: 1
    folder: "YDSZ"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 60
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
