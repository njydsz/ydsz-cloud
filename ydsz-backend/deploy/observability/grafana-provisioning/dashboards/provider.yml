# Grafana Dashboard Provisioning（自动导入看板）
#
#  扫描 /etc/grafana/provisioning/dashboards 目录下的所有 JSON 文件
#  支持的面板类型：Prometheus / Loki / Jaeger
#
#  已加载看板列表：
#    - gateway-overview.json        → 网关 QPS / 错误率 / 延迟  (Prometheus)
#    - cache-stats.json             → Redis / 本地缓存命中率    (Prometheus)
#    - agent-runtime-stats.json     → Agent 线程池 & 任务队列   (Prometheus)
#    - jdbc-read-write-splitting.json → 读写分离 & 数据源健康    (Prometheus)
#    - application-logs.json        → 日志率 / 错误率 / 日志流    (Loki)

apiVersion: 1

providers:
  - name: "YDSZ Dashboards"
    orgId: 1
    folder: "YDSZ"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 60
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
