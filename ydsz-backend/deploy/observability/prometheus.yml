# Prometheus 抓取配置（YDSZ 可观测性栈）

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警规则（P1-5）
rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # OTel Collector 自身指标
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # 各微服务 Micrometer 指标（K8s 环境改为 pod 自动发现）
  - job_name: ydsz-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9000"]

  - job_name: ydsz-project
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9009"]
