# Prometheus 抓取配置（YDSZ 可观测性栈 — Kubernetes Pod 自动发现）
#
#  两种部署路径：
#    1. Prometheus Operator（推荐）: 优先使用 ServiceMonitor / PodMonitor CRD
#    2. 原生 Prometheus         : 使用 kubernetes_sd_configs 自动发现 Pod
#
#  本文件采用路径 2（k8s pod auto-discovery），Operator 集群请结合 servicemonitor-template.yaml 使用。

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警规则（P1-5）
rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # OTel Collector 自身指标
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # 基于 K8s Pod 自动发现，只抓取带 prometheus.io/scrape 注解的 Pod
  - job_name: "kubernetes-pods"
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      # ---- 过滤：只保留显式声明 prometheus.io.scrape=true 的 Pod ----
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      # ---- 抓取路径：默认 /actuator/prometheus，可被 pod annotation 覆盖 ----
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      # ---- 抓取端口：默认 8080，可被 pod annotation prometheus.io/port 覆盖 ----
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      # ---- 注入有益标签 ----
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: app
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_part_of]
        target_label: part_of
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)

  # ============================================================
  #  显式静态 job（仅作示例 / 调试用，生产环境建议通过 ServiceMonitor 管理）
  # ============================================================
  # - job_name: ydsz-gateway
  #   metrics_path: /actuator/prometheus
  #   static_configs:
  #     - targets: ["host.docker.internal:9000"]
  #
  # - job_name: ydsz-project
  #   metrics_path: /actuator/prometheus
  #   static_configs:
  #     - targets: ["host.docker.internal:9009"]
