# =============================================================================
#  YDSZ · 可观测性栈一键部署（链路追踪端到端打通 P1-4）
# -----------------------------------------------------------------------------
#  部署链路：微服务(OTel Agent) --OTLP--> otel-collector --batch--> Jaeger
#                                             \--metrics--> Prometheus
#  可视化：Jaeger（Trace 查询）+ Grafana（Dashboard/告警）
#
#  用法：
#    docker compose -f deploy/observability/docker-compose.observability.yaml up -d
#
#  访问入口：
#    Jaeger UI      http://localhost:16686
#    Grafana        http://localhost:3000   (admin/admin123)
#    Prometheus     http://localhost:9090
#    OTel Collector http://localhost:4317 (gRPC) / 4318 (HTTP)
#
#  微服务连接：应用只需设置 OTEL_EXPORTER_OTLP_ENDPOINT=http://<本机IP>:4317
# =============================================================================
version: "3.9"

services:
  # ---- Trace 后端（Jaeger 全量版） ----
  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: ydsz-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      METRICS_STORAGE_TYPE: prometheus
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC（直连 Jaeger 备选）
      - "4318:4318"     # OTLP HTTP
    restart: unless-stopped

  # ---- OpenTelemetry Collector（统一接收/批处理/路由） ----
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: ydsz-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Collector 自身 metrics
      - "8889:8889"   # Prometheus 暴露（otelcol 指标）
    depends_on:
      - jaeger
    restart: unless-stopped

  # ---- 指标后端 ----
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ydsz-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9090:9090"
    restart: unless-stopped

  # ---- 可视化大盘 ----
  grafana:
    image: grafana/grafana:11.1.0
    container_name: ydsz-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
