# =============================================================================
#  YDSZ · 可观测性栈一键部署（Metrics + Traces + Logs 三支柱完整栈）
# -----------------------------------------------------------------------------
#  部署链路：
#   Metrics  : 微服务(Micrometer) --> Prometheus --> Grafana
#   Traces   : 微服务(OTel Agent) --OTLP--> otel-collector --batch--> Jaeger
#   Logs     : 微服务(JSON log) --> Promtail --> Loki --> Grafana
#  关联能力 : Loki trace_uid 字段与 Jaeger 实现 log↔trace 串联
#
#  可视化：Jaeger（Trace 查询）+ Grafana（Dashboard/告警/Logs Explorer）
#
#  用法：
#    docker compose -f deploy/observability/docker-compose.observability.yaml up -d
#
#  访问入口：
#    Jaeger UI      http://localhost:16686
#    Grafana        http://localhost:3000   (admin/admin123)
#    Prometheus     http://localhost:9090
#    Loki           http://localhost:3100
#    OTel Collector http://localhost:4317 (gRPC) / 4318 (HTTP)
#
#  微服务连接（容器内/同 compose 网络）：
#    Metrics (Pod annotation): prometheus.io/scrape=true
#    Traces  : OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
#    Logs    : 应用输出 JSON 日志到 /var/log/ydsz-*.log
#              （Spring Boot + logback-json-classic 默认路径）
# =============================================================================
version: "3.9"

services:
  # ---- Trace 后端（Jaeger 全量版） ----
  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: ydsz-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      METRICS_STORAGE_TYPE: prometheus
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC（直连 Jaeger 备选）
      - "4318:4318"     # OTLP HTTP
    restart: unless-stopped
    networks:
      - ydsz-observability

  # ---- OpenTelemetry Collector（统一接收/批处理/路由） ----
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: ydsz-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Collector 自身 metrics
      - "8889:8889"   # Prometheus 暴露（otelcol 指标）
    depends_on:
      - jaeger
    restart: unless-stopped
    networks:
      - ydsz-observability

  # ---- 指标后端 ----
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ydsz-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - ydsz-observability

  # ---- 日志可视化大盘 ----
  grafana:
    image: grafana/grafana:11.1.0
    container_name: ydsz-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - ydsz-observability

  # ---- Loki 日志聚合引擎 ----
  loki:
    image: grafana/loki:latest
    container_name: ydsz-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yaml
    restart: unless-stopped
    networks:
      - ydsz-observability

  # ---- Promtail 日志采集代理 ----
  promtail:
    image: grafana/promtail:latest
    container_name: ydsz-promtail
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/log:/var/log:ro            # 挂载宿主机日志目录，读取 ydsz-*.log
      - promtail-positions:/tmp/positions
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - ydsz-observability

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-positions:

networks:
  ydsz-observability:
    driver: bridge
