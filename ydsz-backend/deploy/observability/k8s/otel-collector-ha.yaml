# =============================================================================
#  YDSZ · OpenTelemetry Collector HA Deployment（K8s 生产部署）
# -----------------------------------------------------------------------------
#  与 docker-compose.observability.yaml 互补：
#    - docker-compose 用于本地开发/CI
#    - 本文件用于 K8s 生产部署
#
#  高可用设计：
#    1. 2 副本 Deployment + 反亲和性（跨节点分布）
#    2. 持久化 queue（file_storage extension），Jaeger 故障时数据不丢失
#    3. Headless Service：微服务可直接 DNS 解析多个 Pod IP 做客户端负载均衡
#    4. OTEL Exporter 的 retry_on_failure + sending_queue 配置
#
#  部署方式：
#    kubectl apply -f deploy/observability/k8s/otel-collector-ha.yaml
#
#  @path deploy/observability/k8s/otel-collector-ha.yaml
#  @author ydsz-team
#  @since 1.0.0
# =============================================================================

# -----------------------------------------------------------------------------
#  ConfigMap: Collector 配置
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: ydsz-observability
  labels:
    app: otel-collector
    app.kubernetes.io/part-of: ydsz-pmis
    app.kubernetes.io/component: observability
data:
  config.yaml: |
    # ============================================================
    #  OTel Collector HA 配置（带持久化 queue + 重试）
    # ============================================================

    extensions:
      # ------ 持久化 queue 扩展（Jaeger 故障时缓冲数据） ------
      file_storage:
        directory: /var/lib/otelcol/queue
        timeout: 1s
        compaction:
          max_transaction_size: 102400  # 100KB
          on_start: true
      # ------ 健康检查扩展（K8s probe 使用） ------
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            max_recv_msg_size_mib: 16
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        send_batch_size: 8192
        send_batch_max_size: 10000
        timeout: 5s

      resourcedetection:
        detectors: [env, system]
        timeout: 2s
        override: false

      memory_limiter:
        check_interval: 2s
        limit_percentage: 80
        spike_limit_percentage: 25

    exporters:
      # === Jaeger gRPC（主后端） ===
      jaeger:
        endpoint: ydsz-jaeger-collector.ydsz-observability.svc.cluster.local:14250
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 10000
          storage: file_storage  # 使用 file_storage 扩展做持久化缓冲

      # === Collector 自身指标导出 ===
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: otelcol

    service:
      extensions: [health_check, file_storage]
      telemetry:
        logs:
          level: info
        metrics:
          address: 0.0.0.0:8888

      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [jaeger]

---
# -----------------------------------------------------------------------------
#  Headless Service: OTLP gRPC 客户端负载均衡
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: ydsz-observability
  labels:
    app: otel-collector
    app.kubernetes.io/part-of: ydsz-pmis
spec:
  clusterIP: None  # Headless：DNS 返回所有 Pod IP，让客户端 OTel SDK 做负载均衡
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: metrics
      port: 8888
      targetPort: 8888
      protocol: TCP
    - name: prom-export
      port: 8889
      targetPort: 8889
      protocol: TCP
    - name: health
      port: 13133
      targetPort: 13133
      protocol: TCP

---
# -----------------------------------------------------------------------------
#  PersistentVolumeClaim: 持久化 queue 存储
# -----------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: otel-collector-queue
  namespace: ydsz-observability
  labels:
    app: otel-collector
    app.kubernetes.io/part-of: ydsz-pmis
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd  # 需集群提供或使用默认 SC
  resources:
    requests:
      storage: 5Gi

---
# -----------------------------------------------------------------------------
#  Deployment: 高可用多副本
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: ydsz-observability
  labels:
    app: otel-collector
    app.kubernetes.io/part-of: ydsz-pmis
    app.kubernetes.io/component: observability
spec:
  replicas: 2
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
        app.kubernetes.io/part-of: ydsz-pmis
        app.kubernetes.io/component: observability
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8889"
        prometheus.io/path: "/metrics"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: otel-collector
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: otel-collector
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.110.0
          command:
            - /otelcol-contrib
            - --config=/etc/otelcol/config.yaml
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 8888
              name: metrics
            - containerPort: 8889
              name: prom-export
            - containerPort: 13133
              name: health
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: queue
              mountPath: /var/lib/otelcol/queue
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
        - name: queue
          persistentVolumeClaim:
            claimName: otel-collector-queue

---
# -----------------------------------------------------------------------------
#  Jaeger K8s 部署引用（简化版）
# -----------------------------------------------------------------------------
#  生产环境推荐使用 Jaeger Operator 或 Helm Chart 独立部署，
#  此处仅做 Service 引用示例。假设 Jaeger collector service 名为：
#    ydsz-jaeger-collector.ydsz-observability.svc.cluster.local:14250
# -----------------------------------------------------------------------------
