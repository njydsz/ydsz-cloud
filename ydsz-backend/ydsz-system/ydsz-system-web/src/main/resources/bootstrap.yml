# =====================================================================
#  YDSZ 系统管理服务 bootstrap 配置
#  --------------------------------------------------------------------
#  端口：9001
#  职责：配置/字典/审计/文件/租户配额/导出/登录审计/敏感操作
#  依赖：Nacos 服务发现 / 配置中心、PostgreSQL、Redis、MinIO
#  说明：bootstrap.yml 在 application.yml 之前加载，用于提前连接 Nacos
# =====================================================================

server:
  # HTTP 监听端口（按构建顺序 2/10）
  port: 9001
  max-http-request-header-size: 16KB
  servlet:
    context-path: /

spring:
  application:
    name: ydsz-system
  profiles:
    # 默认 dev，可通过 -Dspring.profiles.active=dev|sit|uat|prod 或 ENV SPRING_PROFILES_ACTIVE 覆盖
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    web-application-type: servlet
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      # ---------- 服务注册 ----------
      discovery:
        enabled: true
        register-enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ydsz}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        metadata:
          version: 1.0.0
          port: 9001
        ip-type: IPv4
      # ---------- 配置中心 ----------
      config:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ydsz}
        group: ${NACOS_GROUP:${spring.profiles.active}}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yaml
        refresh-enabled: true
        shared-configs:
          - data-id: ydsz-common.yaml
            group: ${spring.profiles.active}
            refresh: true
          - data-id: ydsz-system.yml
            group: ${spring.profiles.active}
            refresh: true

# JSON 引擎配置（ydsz-common-json）
ydsz:
  json:
    enabled: true
    date-format: yyyy-MM-dd HH:mm:ss
    naming-strategy: LOWER_CAMEL_CASE
    write-nulls: false
    monitoring-enabled: true
    warmup-classes:
      - com.njydsz.system.domain.vo.ConfigVO
      - com.njydsz.system.domain.entity.DictItem
