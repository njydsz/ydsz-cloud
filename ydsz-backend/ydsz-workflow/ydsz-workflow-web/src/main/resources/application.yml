# YDSZ 工作流服务本地配置
# 公共配置（mybatis-plus.configuration / global-config / management / springdoc / datasource / redis）
# 由 Nacos 共享配置 ydsz-common.yaml 提供，此处仅保留服务私有配置与 override

# MyBatis-Plus override：在默认路径基础上追加 flow 子目录
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml,classpath*:mapper/flow/**/*.xml

# P0-1: 统一线程池配置（ydsz-common-thread）
ydsz:
  thread:
    enabled: true
    pools:
      flowQueue:
        core-size: 2
        max-size: 8
        queue-capacity: 256
        thread-name-prefix: flow-queue-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 10
  # P0-2: 事务性 Outbox 事件配置
  event:
    outbox:
      enabled: true
      table-name: ydsz_outbox
      poll-interval-seconds: 5
      batch-size: 100
      max-retries: 5
      fail-on-noop: false
  # P0-2: 分布式事务配置（Seata AT 模式，默认关闭，TC 就绪后开启）
  seata:
    enabled: false
    default-type: SEATA_AT
  # P0-1: YdszJson ASM 预热（高频序列化 Bean，消除首次请求延迟尖峰）
  # P2-3: 启用流式输出（流程定义/实例列表等大 JSON 响应使用 chunked encoding）
  json:
    warmup-classes:
      - com.njydsz.workflow.domain.entity.FlowDefinition
      - com.njydsz.workflow.domain.entity.FlowInstance
      - com.njydsz.workflow.domain.entity.FlowNode
      - com.njydsz.workflow.domain.entity.FlowRunTask
      - com.njydsz.workflow.domain.entity.FlowHisTask
      - com.njydsz.workflow.domain.entity.FlowHisInstance
      - com.njydsz.workflow.domain.entity.FlowTemplate
      - com.njydsz.workflow.domain.entity.FlowAuditLog
    streaming-enabled: true

