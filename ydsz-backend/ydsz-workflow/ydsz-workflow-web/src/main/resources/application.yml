# YDSZ 工作流服务本地配置
# Nacos 配置中心覆盖以下配置（ydsz-workflow-dev.yaml / ydsz-workflow-sit.yaml / ydsz-workflow-uat.yaml）

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml,classpath*:mapper/flow/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# P0-1: 统一线程池配置（ydsz-common-thread）
ydsz:
  thread:
    enabled: true
    pools:
      flowQueue:
        core-size: 2
        max-size: 8
        queue-capacity: 256
        thread-name-prefix: flow-queue-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 10
  # P0-2: 事务性 Outbox 事件配置
  event:
    outbox:
      enabled: true
      table-name: ydsz_outbox
      poll-interval-seconds: 5
      batch-size: 100
      max-retries: 5
      fail-on-noop: false
