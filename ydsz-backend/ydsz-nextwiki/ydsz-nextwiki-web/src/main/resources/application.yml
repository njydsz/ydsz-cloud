# NextWiki 网盘知识库服务本地配置
# Nacos 配置中心覆盖以下配置（ydsz-nextwiki.yml）

server:
  port: 8800

spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# NextWiki 配置（生产环境由 Nacos ydsz-nextwiki.yml 覆盖）
nextwiki:
  upload:
    max-file-size: 524288000
    allowed-types: ""
    conflict-strategy: KEEP_BOTH
    chunk-temp-dir: ${java.io.tmpdir}/nextwiki-chunk
  preview:
    libreoffice-path: ${LIBREOFFICE_PATH:soffice}
    temp-dir: ${java.io.tmpdir}/nextwiki-preview
  thumbnail:
    temp-dir: ${java.io.tmpdir}/nextwiki-thumbnail
  ai:
    llm-enabled: false
    llm-api-url: ${LLM_API_URL:}
    llm-api-key: ${LLM_API_KEY:}
  cdn:
    enabled: false
    provider: aliyun
    domain: ${CDN_DOMAIN:}
    access-key: ${CDN_ACCESS_KEY:}
    secret-key: ${CDN_SECRET_KEY:}
  virus-scan:
    enabled: false
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
  ocr:
    enabled: false
    provider: tesseract
    tesseract-path: ${TESSERACT_PATH:tesseract}
    language: chi_sim+eng
  download:
    rate-limit-per-minute: 30
    ip-rate-limit-per-minute: 100
    signed-url-expire-seconds: 3600
  wopi:
    editor-url: ${WOPI_EDITOR_URL:}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
