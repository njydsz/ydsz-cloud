# YDSZ 项目管理服务本地配置
# Nacos 配置中心覆盖以下配置（ydsz-project.yaml）

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# P0-2: 分布式事务配置（Seata AT 模式，默认关闭，TC 就绪后开启）
ydsz:
  seata:
    enabled: false
    default-type: SEATA_AT

# Seata 客户端配置（TC 就绪后设置 seata.enabled=true 并取消注释）
# seata:
#   enabled: true
#   application-id: ${spring.application.name}
#   tx-service-group: ydsz_tx_group
#   service:
#     vgroup-mapping:
#       ydsz_tx_group: default
#     grouplist:
#       default: ${SEATA_SERVER_ADDR:127.0.0.1:8091}
#   config:
#     type: file
#   registry:
#     type: file

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
