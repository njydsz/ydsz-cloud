# =====================================================================
#  YDSZ · Project · DEV 环境配置（Nacos DataId）
#  DataId:    ydsz-project-dev.yaml
#  Group:     dev
#  端口:      9003
# =====================================================================

# MinIO 对象存储
minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9100}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  default-bucket: ${MINIO_BUCKET:ydsz}
  url-expire-seconds: 3600

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.project.domain.entity

# Seata 分布式事务（AT 模式）
# 2026-07-16: sales/finance 合并到 project 后,跨服务分布式事务降级为同进程本地事务
# SeataAutoConfiguration 通过 ydsz.seata.enabled=false 禁用,Spring 默认 DataSourceTransactionManager 接管
# 保留 seata-spring-boot-starter 依赖和配置段(注释),以便未来如需恢复跨服务事务可快速启用
ydsz:
  seata:
    enabled: false
    default-type: LOCAL

