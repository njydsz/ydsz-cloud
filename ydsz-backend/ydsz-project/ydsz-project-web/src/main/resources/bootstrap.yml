# =====================================================================
#  YDSZ 项目管理服务 bootstrap 配置
#  --------------------------------------------------------------------
#  端口：9003
#  职责：项目全生命周期管理（立项/WBS/EVM/风险/工时/采购/预算/报表/驾驶舱）
#        + 商务销售（商机/合同/合同变更/补充协议/模板）
#        + 财务会计（发票/回款/费用/收入/利润/对账/信用）
#  依赖：Nacos 服务发现 / 配置中心、PostgreSQL、Redis、Seata
# =====================================================================

server:
  port: 9003
  max-http-request-header-size: 16KB
  servlet:
    context-path: /

spring:
  application:
    name: ydsz-project
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    web-application-type: servlet
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        enabled: true
        register-enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ydsz}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        metadata:
          version: 2.0.0
          port: 9003
        ip-type: IPv4
      config:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ydsz}
        group: ${NACOS_GROUP:${spring.profiles.active}}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yaml
        refresh-enabled: true
        shared-configs:
          - data-id: ydsz-common.yaml
            group: ${spring.profiles.active}
            refresh: true
