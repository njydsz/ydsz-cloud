# =====================================================================
#  YDSZ · UserInfo · SIT 环境配置（Nacos DataId）
#  DataId:    ydsz-userinfo-sit.yaml
#  Group:     sit
#  端口:      9001
# =====================================================================

# YDSZ 业务配置（jwt 已在共享配置 ydsz-common.yaml 提供）
ydsz:
  auth:
    captcha-required: true

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml

# SIT 环境关闭文档 UI
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: true
knife4j:
  production: true

# SIT 环境 YDSZ 业务日志降为 INFO
logging:
  level:
    "[com.njydsz]": INFO
