# =====================================================================
#  YDSZ 规则引擎服务 bootstrap 配置（自研 LiteExpr 规则引擎）
#  --------------------------------------------------------------------
#  端口：9008
#  职责：规则定义 / 编排 / 评估 / 灰度 / 回放 / 审批 / CEP
#    - 7 种规则类型（Expression / DecisionTable / CrossDecisionTable
#      / DecisionTree / Scorecard / Script / Static）
#    - 规则链编排（THEN/WHEN/IF/ELIF/SWITCH/FOR/WHILE/BREAK）
#    - 灰度发布 / A-B 测试 / 自动回滚
#    - 执行回放 / 多级审批 / 规则模板市场 / 规则包市场
#    - 熔断 / 超时 / 多级缓存 / 分布式执行
#    - 规则触发联动 cronjob / workflow / 消息中心
#  依赖：Nacos 服务发现 / 配置中心、PostgreSQL、Redis、MinIO
#  说明：bootstrap.yml 在 application.yml 之前加载，用于提前连接 Nacos
# =====================================================================

server:
  # HTTP 监听端口（按构建顺序 3/10）
  port: 9008
  max-http-request-header-size: 16KB
  servlet:
    context-path: /

spring:
  application:
    name: ydsz-literule
  profiles:
    # 默认 dev，可通过 -Dspring.profiles.active=dev|sit|uat|prod 或 ENV SPRING_PROFILES_ACTIVE 覆盖
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    web-application-type: servlet
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      # ---------- 服务注册 ----------
      discovery:
        enabled: true
        register-enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ydsz}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        metadata:
          version: 1.0.0
          port: 9008
        ip-type: IPv4
      # ---------- 配置中心 ----------
      config:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ydsz}
        group: ${NACOS_GROUP:${spring.profiles.active}}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yaml
        refresh-enabled: true
        shared-configs:
          - data-id: ydsz-common.yaml
            group: ${spring.profiles.active}
            refresh: true
