# =====================================================================
#  YDSZ PMIS · Message · DEV 环境配置（Nacos DataId）
#  DataId:    ydsz-message-dev.yaml
#  Group:     dev
#  端口:      9004
# =====================================================================

server:
  port: 9004
  servlet:
    context-path: /

spring:
  profiles: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_NULL
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USER:no-reply@example.com}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

# PMIS 消息引擎配置
ydsz:
  message:
    channel-enabled:
      SMS: true
      EMAIL: true
      PUSH: true
      INAPP: true
      WEBHOOK: true
      DINGTALK: true
      WECOM: true
      WECOM_APP: true
      FEISHU: true
    default-priority: NORMAL
    aggregate-scan-interval-ms: 60000
    retry-scan-interval-ms: 30000
    # P2-5: 消息 TTL（秒），超过此时间的定时消息自动丢弃；0 表示不检查
    message-ttl-seconds: 3600
    # P2-6: 全部已读分批大小，避免长事务；0 表示不分批
    mark-all-read-batch-size: 500
    global-daily-limit: 0
    global-hourly-limit: 0
    sms:
      provider: ${PMIS_SMS_PROVIDER:mock}
      aliyun:
        access-key-id: ${PMIS_SMS_ALIYUN_AK:}
        access-key-secret: ${PMIS_SMS_ALIYUN_SK:}
        sign-name: ${PMIS_SMS_ALIYUN_SIGN:}
        endpoint: dysmsapi.aliyuncs.com
        connect-timeout: 5000
        read-timeout: 10000
    push:
      provider: ${PMIS_PUSH_PROVIDER:mock}
      getui:
        app-id: ${PMIS_PUSH_GETUI_APPID:}
        app-key: ${PMIS_PUSH_GETUI_APPKEY:}
        master-secret: ${PMIS_PUSH_GETUI_MASTER:}
        base-url: https://restapi.getui.com
        connect-timeout: 5000
        read-timeout: 10000
  webhook:
    default-url: ${PMIS_WEBHOOK_DEFAULT_URL:}
    connect-timeout: 5000
    read-timeout: 10000
  channel:
    dingtalk:
      default-token: ${PMIS_DINGTALK_TOKEN:}
      secret: ${PMIS_DINGTALK_SECRET:}
      connect-timeout: 5000
      read-timeout: 10000
    wechat-work:
      default-key: ${PMIS_WECOM_KEY:}
      connect-timeout: 5000
      read-timeout: 10000
    feishu:
      default-hook: ${PMIS_FEISHU_HOOK:}
      secret: ${PMIS_FEISHU_SECRET:}
      connect-timeout: 5000
      read-timeout: 10000
    wecom-app:
      enabled: ${PMIS_WECOM_APP_ENABLED:false}
      corp-id: ${PMIS_WECOM_APP_CORPID:}
      corp-secret: ${PMIS_WECOM_APP_CORPSECRET:}
      agent-id: ${PMIS_WECOM_APP_AGENTID:0}
      base-url: https://qyapi.weixin.qq.com
      connect-timeout: 5000
      read-timeout: 10000

# RocketMQ
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:pmis-message-producer-group}
    send-message-timeout: 5000
  consumer:
    enabled: ${ROCKETMQ_CONSUMER_ENABLED:true}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.message.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Resilience4j 限流
resilience4j:
  ratelimiter:
    instances:
      message-send:
        limit-for-period: 200
        limit-refresh-period: 1s
        timeout-duration: 0
      message-receipt:
        limit-for-period: 1000
        limit-refresh-period: 1s
        timeout-duration: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    "[com.njydsz]": DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
