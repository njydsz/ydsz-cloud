# =====================================================================
#  REMI · CronJob · SIT 环境配置（Nacos DataId）
#  DataId:    remi-cronjob-sit.yaml
#  Group:     sit
#  端口:      9006
# =====================================================================

# MinIO（SIT 环境密钥由环境变量注入）
minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9100}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  default-bucket: ${MINIO_BUCKET:remi}
  url-expire-seconds: 3600

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.remisoft.cronjob.entity

# 调度服务配置（SIT 环境精简版）
remi:
  cronjob:
    node-discovery:
      type: nacos
    failover:
      enabled: true
      scan-interval-seconds: 30
    leader:
      enabled: true
      role: remi-job-scheduler
    scanner:
      interval-ms: 5000
      batch-size: 100
    executor:
      register-on-startup: true
      heartbeat-interval-seconds: 10
      max-concurrent: 16

# SIT 环境关闭文档 UI
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: true
knife4j:
  production: true

# SIT 环境 REMI 业务日志降为 INFO
logging:
  level:
    "[com.remisoft]": INFO
