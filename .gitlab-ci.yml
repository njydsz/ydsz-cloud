# ===========================================================================
# Build 阶段
# ===========================================================================
backend:build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - changes:
        - $BACKEND_DIR/**/*
  script:
    - cd $BACKEND_DIR
    - mvn $MAVEN_CLI_OPTS -pl '!ydsz-pmis-gateway' clean install
  artifacts:
    paths:
      - $BACKEND_DIR/*/target/*.jar
    expire_in: 3 days

frontend:build:
  stage: build
  image: node:20-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - changes:
        - $FRONTEND_DIR/**/*
  before_script:
    - cd $FRONTEND_DIR
    - corepack enable
    - corepack prepare pnpm@9 --activate
  script:
    - pnpm install --frozen-lockfile
    - pnpm build:prod
    - pnpm analyze  # 输出 dist/stats.html
  artifacts:
    paths:
      - $FRONTEND_DIR/dist
    expire_in: 3 days

# Lighthouse CI 性能与无障碍检测 (批次 20 P3-1)
# 依赖 frontend:build 的产物 (dist/), 启动 preview 服务并跑 Lighthouse
frontend:lighthouse:
  stage: build
  image: node:20-alpine
  needs: ["frontend:build"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - changes:
        - $FRONTEND_DIR/**/*
  before_script:
    - cd $FRONTEND_DIR
    - corepack enable
    - corepack prepare pnpm@9 --activate
    - pnpm install --frozen-lockfile
    - apk add --no-cache chromium nss freetype harfbuzz ca-certificates ttf-dejavu
    - export CHROME_PATH=/usr/bin/chromium-browser
    - export LHCI_BUILD_CONTEXT__CURRENT_HASH=$CI_COMMIT_SHORT_SHA
  script:
    # 静态服务 dist 目录, 端口 5173 与 lighthouserc.json 中的 URL 保持一致
    - pnpm dlx serve -s dist -l 5173 &
    - sleep 4
    - pnpm dlx @lhci/cli@0.14.x autorun --config=lighthouserc.json || LHCI_EXIT=$?
    - kill %1 || true
    # 仅在 main 分支才硬性失败, MR 阶段仅警告
    - if [ -n "$LHCI_EXIT" ] && [ "$CI_COMMIT_BRANCH" = "main" ]; then exit $LHCI_EXIT; fi
  artifacts:
    when: always
    paths:
      - $FRONTEND_DIR/lhci_reports
    expire_in: 14 days
    reports:
      junit: $FRONTEND_DIR/lhci_reports/lighthouse/*.xml

# ===========================================================================
# Image 阶段 (Docker 镜像构建)
# ===========================================================================
.docker-login: &docker-login
  - echo "$DOCKER_PASSWORD" | docker login $DOCKER_REGISTRY -u "$DOCKER_USERNAME" --password-stdin

# 单个微服务构建模板
.docker-build:
  stage: image
  image: docker:24-cli
  services:
    - docker:24-dind
  before_script:
    - *docker-login
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - changes:
        - $BACKEND_DIR/$SERVICE/**/*
  script:
    - cd $BACKEND_DIR
    - docker build
        --build-arg MODULE=$SERVICE
        --tag $DOCKER_REGISTRY/$SERVICE:$IMAGE_TAG
        --tag $DOCKER_REGISTRY/$SERVICE:latest
        -f Dockerfile .
    - docker push $DOCKER_REGISTRY/$SERVICE:$IMAGE_TAG
    - docker push $DOCKER_REGISTRY/$SERVICE:latest

# 14 个微服务独立构建 (Spring Cloud Alibaba 微服务架构)
image:auth:        { extends: .docker-build, variables: { SERVICE: "ydsz-pmis-auth" } }
image:user:        { extends: .docker-build, variables: { SERVICE: "ydsz-pmis-user" } }
image:project:     { extends: .docker-build, variables: { SERVICE: "ydsz-pmis-project" } }
image:execution:   { extends: .docker-build, variables: { SERVICE: "ydsz-pmis-execution" } }
image:finance:     { extends: .docker-build, variables: { SERVICE: "ydsz-pmis-execution" } }
image:agent:       { extends: .docker-build, variables: { SERVICE: "ydsz-pmis-agent" } }
image:audit:       { extends: .docker-build, variables: { SERVICE: "ydsz-pmis-audit" } }
image:message:     { extends: .docker-build, variables: { SERVICE: "ydsz-pmis-message" } }
image:notification:{ extends: .docker-build, variables: { SERVICE: "ydsz-pmis-notification" } }
image:workflow:    { extends: .docker-build, variables: { SERVICE: "ydsz-pmis-workflow" } }
image:config:      { extends: .docker-build, variables: { SERVICE: "ydsz-pmis-config" } }
image:scheduler:   { extends: .docker-build, variables: { SERVICE: "ydsz-pmis-scheduler" } }
image:file:        { extends: .docker-build, variables: { SERVICE: "ydsz-pmis-file" } }
image:gateway:     { extends: .docker-build, variables: { SERVICE: "ydsz-pmis-gateway" } }

# 前端镜像
image:frontend:
  stage: image
  image: docker:24-cli
  services:
    - docker:24-dind
  before_script:
    - *docker-login
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - changes:
        - $FRONTEND_DIR/**/*
  script:
    - cd $FRONTEND_DIR
    - docker build
        --tag $DOCKER_REGISTRY/ydsz-pmis-frontend:$IMAGE_TAG
        --tag $DOCKER_REGISTRY/ydsz-pmis-frontend:latest
        -f Dockerfile .
    - docker push $DOCKER_REGISTRY/ydsz-pmis-frontend:$IMAGE_TAG
    - docker push $DOCKER_REGISTRY/ydsz-pmis-frontend:latest

# ===========================================================================
# Deploy 阶段
# ===========================================================================
.k8s-deploy: &k8s-deploy
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - echo "$KUBECONFIG_B64" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
    - kubectl set image
        deployment/$SERVICE
        $SERVICE=$DOCKER_REGISTRY/$SERVICE:$IMAGE_TAG
        -n $NAMESPACE
    - kubectl rollout status deployment/$SERVICE -n $NAMESPACE --timeout=300s

# Dev 环境自动部署 (main 分支)
deploy:dev:gateway:
  <<: *k8s-deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    SERVICE: "ydsz-pmis-gateway"
    NAMESPACE: "pmis-dev"
    KUBECONFIG_B64: $K8S_DEV_KUBECONFIG

deploy:dev:frontend:
  <<: *k8s-deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    SERVICE: "ydsz-pmis-frontend"
    NAMESPACE: "pmis-dev"
    KUBECONFIG_B64: $K8S_DEV_KUBECONFIG

# Staging 环境手动部署
deploy:staging:
  stage: deploy
  image: bitnami/kubectl:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  script:
    - echo "$K8S_STAGING_KUBECONFIG" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
    - kubectl apply -k deploy/k8s/staging/

# Prod 环境手动部署 + 审批
deploy:prod:
  stage: deploy
  image: bitnami/kubectl:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
  script:
    - echo "$K8S_PROD_KUBECONFIG" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
    - kubectl apply -k deploy/k8s/prod/
    - kubectl set image
        deployment/ydsz-pmis-gateway
        ydsz-pmis-gateway=$DOCKER_REGISTRY/ydsz-pmis-gateway:$IMAGE_TAG
        -n pmis-prod
  environment:
    name: production
    url: https://pmis.ydsz-pmis.cn
