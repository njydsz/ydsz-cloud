# =============================================================================
# PMIS GitLab CI/CD Pipeline (批次 20 P1-5)
#
# 设计目标:
#   1. 后端: 增量编译 + 单元测试 + 覆盖率检查 (各模块独立 stage)
#   2. 前端: 类型检查 + lint + 单测 + E2E + 构建产物归档
#   3. 镜像: 后端模块独立构建 Docker 镜像
#   4. 部署: dev 环境自动部署, staging/prod 手动触发
# =============================================================================
#
# 必要 CI/CD Variables (在 GitLab Project Settings -> CI/CD -> Variables 设置):
#   DOCKER_REGISTRY        = registry.cn-hangzhou.aliyuncs.com/ydsz
#   DOCKER_USERNAME        = <your docker username>
#   DOCKER_PASSWORD        = <your docker password> (masked, protected)
#   K8S_DEV_KUBECONFIG     = <base64 dev kubeconfig> (masked, protected)
#   K8S_STAGING_KUBECONFIG = <base64 staging kubeconfig> (masked, protected)
#   K8S_PROD_KUBECONFIG    = <base64 prod kubeconfig> (masked, protected)
#   SONAR_HOST_URL         = https://sonar.ydsz-pmis.cn
#   SONAR_TOKEN            = <sonar token>
# =============================================================================

stages:
  - lint
  - test
  - build
  - image
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dorg.slf4j.simpleLogger.showDateTime=false"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end -DskipTests"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA-$CI_COMMIT_REF_SLUG"
  BACKEND_DIR: "ydsz-pmis-backend"
  FRONTEND_DIR: "ydsz-pmis-frontend"

# 全局缓存: .m2 仓库
cache:
  key: maven-$CI_COMMIT_REF_SLUG
  paths:
    - .m2/repository
  policy: pull-push

# ===========================================================================
# Lint 阶段
# ===========================================================================
backend:lint:
  stage: lint
  image: maven:3.9-eclipse-temurin-21
  rules:
    - changes:
        - $BACKEND_DIR/**/*
  script:
    - cd $BACKEND_DIR
    - mvn $MAVEN_CLI_OPTS -pl '!ydsz-pmis-gateway' checkstyle:check -DskipTests

frontend:lint:
  stage: lint
  image: node:20-alpine
  rules:
    - changes:
        - $FRONTEND_DIR/**/*
  before_script:
    - cd $FRONTEND_DIR
    - corepack enable
    - corepack prepare pnpm@9 --activate
  script:
    - pnpm install --frozen-lockfile
    - pnpm lint:check
    - pnpm type-check

# ===========================================================================
# Test 阶段
# ===========================================================================
backend:test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - changes:
        - $BACKEND_DIR/**/*
  services:
    - name: mysql:8.0
      alias: mysql
      command: ["--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4"]
    - name: redis:7-alpine
      alias: redis
    - name: rabbitmq:3.13-management
      alias: rabbitmq
  variables:
    MYSQL_ROOT_PASSWORD: "test123"
    MYSQL_DATABASE: "pmis_test"
    SPRING_PROFILES_ACTIVE: "test"
  before_script:
    - cd $BACKEND_DIR
    - echo "等待 MySQL 就绪..."
    - for i in $(seq 1 30); do mysqladmin ping -h mysql -uroot -ptest123 && break; sleep 2; done
  script:
    - mvn test -pl '!ydsz-pmis-gateway'
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    reports:
      junit: "**/target/surefire-reports/TEST-*.xml"
      coverage_report:
        coverage_format: jacoco
        path: "ydsz-pmis-backend/**/target/site/jacoco/jacoco.xml"
    expire_in: 7 days

frontend:test:
  stage: test
  image: node:20-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - changes:
        - $FRONTEND_DIR/**/*
  before_script:
    - cd $FRONTEND_DIR
    - corepack enable
    - corepack prepare pnpm@9 --activate
  script:
    - pnpm install --frozen-lockfile
    - pnpm test -- --reporter=junit --outputFile.junit=./reports/junit.xml
  coverage: '/All files.*?([0-9]{1,3})\s*%/'
  artifacts:
    reports:
      junit: "**/reports/junit.xml"
      coverage_report:
        coverage_format: cobertura
        path: "ydsz-pmis-frontend/coverage/cobertura-coverage.xml"
    expire_in: 7 days

# SonarQube 静态分析 (可选, 如未配置可禁用)
