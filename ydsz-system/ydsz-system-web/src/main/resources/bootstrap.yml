# =====================================================================
#  YDSZ 系统管理服务 bootstrap 配置
#  --------------------------------------------------------------------
#  端口：9001
#  职责：配置/字典/审计/文件/租户配额/导出/登录审计/敏感操作
#  依赖：Nacos 服务发现 / 配置中心、PostgreSQL、Redis、MinIO
#  说明：bootstrap.yml 在 application.yml 之前加载，用于提前连接 Nacos
# =====================================================================

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  default-flat-param-object: true
  default-support-form-data: true
  writer-with-order-by-keys: true
  # 多模块场景下，可通过 urls 配置聚合（仅网关模式使用）

server:
  # HTTP 监听端口（按构建顺序 2/10）
  port: 9001
  max-http-request-header-size: 16KB
  servlet:
    context-path: /

spring:
  application:
    name: ydsz-system
  profiles:
    # 默认 dev，可通过 -Dspring.profiles.active=dev|sit|uat|prod 或 ENV SPRING_PROFILES_ACTIVE 覆盖
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    web-application-type: servlet
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      # ---------- 服务注册 ----------
      discovery:
        enabled: true
        register-enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ydsz}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        metadata:
          version: 1.0.0
          port: 9001
        ip-type: IPv4
      # ---------- 配置中心 ----------
      config:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ydsz}
        group: ${NACOS_GROUP:${spring.profiles.active}}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yaml
        refresh-enabled: true
        shared-configs:
          - data-id: ydsz-common.yaml
            group: ${spring.profiles.active}
            refresh: true
          - data-id: ydsz-system.yml
            group: ${spring.profiles.active}
            refresh: true

# JSON 引擎配置（ydsz-common-json）
ydsz:
  json:
    enabled: true
    date-format: yyyy-MM-dd HH:mm:ss
    naming-strategy: LOWER_CAMEL_CASE
    write-nulls: false
    monitoring-enabled: true
    warmup-classes:
      - com.njydsz.system.domain.vo.ConfigVO
      - com.njydsz.system.domain.entity.DictItem

  # P0: JDBC 安全加固（ydsz-common-jdbc）
  jdbc:
    # SQL 防火墙：拦截 DDL（DROP/TRUNCATE）、无 WHERE 写操作、多语句注入、GRANT/REVOKE
    sql-firewall:
      enabled: true
      block-drop-table: true
      block-truncate: true
      block-delete-without-where: true
      block-update-without-where: true
      block-multi-statement: true
      block-permission-ops: true
    # 分页安全上限：防止 pageSize=999999 导致全表扫描 OOM
    pagination:
      max-limit: 500
    # P1: 慢 SQL 全局检测
    slow-sql:
      enabled: true
      threshold-millis: 500
      alert-threshold-millis: 2000
  # P2: SQL 审计（写操作落盘备查）
  sql-audit:
    enabled: true
    audit-select: false
    audit-insert: true
    audit-update: true
    audit-delete: true
    log-parameters: true
    max-parameter-length: 500

  # P0-3: 内部 API IP 白名单（委托 ydsz-common-safe IpAccessService，支持 CIDR 网段）
  # 迁移说明：原 ydsz.system.internal-api-ip-whitelist 精确匹配已升级为此统一配置
  # 配置格式支持单个 IP（192.168.1.100）和 CIDR 网段（10.0.0.0/8）
  safe:
    ip-access:
      enabled: true
      mode: WHITELIST
      static-whitelist:
        - 10.0.0.0/8        # K8s 集群 Pod 网段
        - 172.16.0.0/12     # Docker bridge 网段
        # - 192.168.1.100   # 运维办公网单个 IP
      excludes:
        - /actuator/**
