# =====================================================================
#  YDSZ 系统管理服务 application 配置
#  --------------------------------------------------------------------
#  本文件为 SkyWalking 链路追踪 + 日志 traceId 的专用配置
#  公共配置（datasource / redis / mybatis-plus）由 Nacos ydsz-common.yaml 提供
# =====================================================================

logging:
  pattern:
    # SkyWalking traceId 支持：Agent 注入时自动填充 X{traceId}，未启用时为空
    level: "%5p [%X{traceId:-},%X{spanId:-}]"

# =====================================================================
#  Actuator 运维端点配置
# --------------------------------------------------------------------
#  暴露 health（Nacos 注册发现也依赖此端点）、info、metrics 等运维端点，
#  由 /api/system/metrics/dashboard 接口聚合后供前端仪表盘消费。
# =====================================================================
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,beans,env
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

# Sentry 监控配置
ydsz:
  sentry:
    app-name: ydzsz-system
    metrics:
      primary: micrometer
      enable-system-metrics: true

# SkyWalking 链路追踪（通过 Java Agent 方式启用，无需业务代码）
# 启动示例：java -javaagent:/path/to/skywalking-agent.jar \
#   -Dskywalking.agent.service_name=ydsz-system \
#   -Dskywalking.collector.backend_service=localhost:11800 \
#   -jar ydsz-system.jar
#
# Agent 配置优先级：-Dskywalking.xxx > agent/config/agent.config > 默认值
skywalking:
  agent:
    service_name: ${spring.application.name}
    collector_backend_service: ${SW_AGENT_COLLECTOR_BACKEND_SERVICES:127.0.0.1:11800}
