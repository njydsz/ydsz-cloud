#
# Web MVC 切片测试 Profile（application-test.yml）
#
# 由 @ActiveProfiles("test") 激活，挂载在 WebMvcTestApplication 之上。
# 禁用所有外部中间件依赖（Redis/MQ/Nacos/ES），确保测试上下文可在内存中启动。
#

spring:
  application:
    name: ydsz-system-web-mvctest
  # 排除可能干扰 MVC 切片测试的自动配置（Redis/Nacos/Feign/ES/认证/安全/审计）
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - com.alibaba.cloud.nacos.discovery.NacosDiscoveryAutoConfiguration
      - com.alibaba.cloud.nacos.config.NacosConfigAutoConfiguration
      - com.alibaba.cloud.nacos.endpoint.NacosEndpointAutoConfiguration
      - com.njydsz.common.auth.config.AuthConfiguration
      - com.njydsz.common.auth.config.AuthFilterConfiguration
      - com.njydsz.common.safe.config.SafeConfiguration
      - com.njydsz.common.safe.ratelimit.config.RateLimitAutoConfiguration
      - com.njydsz.common.safe.xss.XssAutoConfiguration
      - com.njydsz.common.safe.encrypt.FieldEncryptionAutoConfiguration
      - com.njydsz.common.audit.config.AuditConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jdbc.JdbcRepositoriesAutoConfiguration
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  # 关闭懒加载，确保测试上下文快速启动
  main:
    lazy-initialization: false
    web-application-type: servlet

# 禁用 ydsz-common 相关自动装配（测试场景无需连接 DB / Redis）
ydsz:
  jdbc:
    enabled: false
  auth:
    enabled: false
  safe:
    enabled: false

# 日志级别
logging:
  level:
    com.njydsz: WARN
    org.springframework.boot.test: INFO
    org.springframework.web: INFO
