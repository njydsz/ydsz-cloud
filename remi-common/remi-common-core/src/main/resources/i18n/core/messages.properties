# REMI Common Core - i18n Messages (Default / English)
# 此文件仅定义 Core 模块自身使用的BASE结果码。
# 业务模块错误码请在各模块的 i18n/messages.properties 中定义，避免污染 Core 模块职责边界。

# ==================== Response Messages ====================
response.success=Operation succeeded
response.error=Operation failed

# ==================== BaseResultCode (Core Module Owned) ====================
# --- Success ---
error.SUCCESS=Operation succeeded
# --- Generic Errors (A1xxxx) ---
error.BAD_REQUEST=Bad request
error.VALIDATION_FAILED=Validation failed
error.MISSING_PARAMETER=Missing required parameter
error.METHOD_NOT_ALLOWED=HTTP method not allowed
error.UNSUPPORTED_MEDIA_TYPE=Unsupported media type
error.NOT_FOUND=Resource not found
error.DUPLICATE_KEY=Resource already exists
error.BIZ_ERROR=Business rule validation failed
error.REQUEST_TIMEOUT=Request timeout
# --- Database (C104xx) ---
error.DB_DUPLICATE_KEY=Data uniqueness conflict
error.DB_CONSTRAINT_VIOLATION=Database constraint violation
error.DB_DATA_INTEGRITY=Data integrity error
error.DB_QUERY_TIMEOUT=Database query timeout
error.DB_CONNECTION_FAILED=Database connection failed
error.DB_LOCK_CONTENTION=Database lock contention
# --- Resource Conflict (A105xx) ---
error.RESOURCE_LOCKED=Resource locked
error.RESOURCE_CONFLICT=Resource conflict
# --- Request Semantics (A106xx) ---
error.INVALID_RANGE=Invalid request range
error.PAYLOAD_TOO_LARGE=Request payload too large
error.TOO_MANY_REQUESTS=Too many requests
# --- System State (B2xxxx) ---
error.SYSTEM_MAINTENANCE=System under maintenance
error.FEATURE_DISABLED=Feature disabled
error.CIRCUIT_BREAKER_OPEN=Circuit breaker is open
# --- Third Party (C105xx~C107xx) ---
error.THIRD_PARTY_SERVICE_ERROR=Third party service error
error.THIRD_PARTY_TIMEOUT=Third party service timeout
error.THIRD_PARTY_RATE_LIMITED=Third party rate limited
error.CACHE_OPERATION_FAILED=Cache operation failed
error.MQ_PUBLISH_FAILED=Message publish failed
error.MQ_CONSUME_FAILED=Message consume failed
# --- Auth (A2xxxx) ---
error.UNAUTHORIZED=Unauthorized
error.TOKEN_EXPIRED=Token expired
error.TOKEN_INVALID=Token invalid
error.FORBIDDEN=Forbidden
error.DATA_SCOPE_FORBIDDEN=Insufficient data scope permission
error.PASSWORD_WEAK=Password too weak
error.PASSWORD_EXPIRED=Password expired
error.PASSWORD_REUSED=Cannot reuse recent password
error.MFA_REQUIRED=Multi-factor authentication required
error.MFA_INVALID=Invalid multi-factor authentication code
error.ACCOUNT_LOCKED=Account locked
error.SESSION_KICKED=Session kicked by another device
# --- Unknown (C9xxxx) ---
error.UNKNOWN=Unknown error

