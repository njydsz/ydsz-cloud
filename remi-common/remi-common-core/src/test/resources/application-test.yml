# 集成测试环境配置（test profile）
#
# 数据源与 Redis 连接属性由 AbstractIntegrationTest 的 static 块通过
# System.setProperty 注入 Testcontainers 容器地址；本文件仅做最小补充。

spring:
  application:
    name: remi-common-core-test
  # 允许 Bean 定义覆盖（避免 TestApplication 与基类 Bean 冲突）
  main:
    allow-bean-definition-overriding: true
    banner-mode: off

# 日志级别
logging:
  level:
    com.remisoft.common.core.test: INFO
    org.springframework.boot.test: WARN
