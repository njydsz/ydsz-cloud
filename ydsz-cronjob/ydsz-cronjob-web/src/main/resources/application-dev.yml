# === 本地配置（绕过 Nacos） ===
spring:
  config:
    import:
      - "optional:file:${YDSZ_NACOS_CONFIG_DIR:../../docs/nacos-config}/ydsz-common.yml"
      - "optional:file:${YDSZ_NACOS_CONFIG_DIR:../../docs/nacos-config}/ydsz-cronjob-web.yml"
      # 本地凭据（未入库，见 ydsz-config.local.yml.example）占位符在此统一解析，顺序不影响结果
      - "optional:file:${YDSZ_NACOS_CONFIG_DIR:../../docs/nacos-config}/ydsz-config.local.yml"
  main:
    allow-circular-references: true
    lazy-initialization: true
  autoconfigure:
    exclude:
      - org.springframework.boot.health.autoconfigure.registry.HealthContributorRegistryAutoConfiguration

datasource:
  hikari:
    connection-timeout: 5000
    maximum-pool-size: 10
logging:
  level:
    com.njydsz: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework: INFO
    root: INFO
ydsz:
  websocket:
    enabled: false
  i18n:
    validate-on-startup: false
  sentry:
    enabled: false
  local-dev: true
  cronjob:
    leader:
      enabled: true

# P2-FIX：禁用 Spring Boot 默认 HealthContributor Bean，避免与 ydsz-common-queue/Lock/cronjob 自定义 HealthIndicator 产生歧义
# HealthContributorRegistryAutoConfiguration 会因多模块自定义 HealthIndicator 冲突导致启动失败
management:
  health:
    defaults:
      enabled: false