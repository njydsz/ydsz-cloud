# =====================================================================
#  YDSZ · CronJob · DEV 环境配置（Nacos DataId）
#  DataId:    ydsz-cronjob-dev.yaml
#  Group:     dev
#  端口:      9006
# =====================================================================

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.cronjob.entity

# 调度服务配置
ydsz:
  # DEV 开启文档（DocAutoConfiguration 开关，matchIfMissing=false）；
  # 暴露 /v3/api-docs 供前端契约链路（unified-contract.mjs / gen-contract.py）消费
  doc:
    enabled: true
  cronjob:
    node-discovery:
      type: nacos
    failover:
      enabled: true
      scan-interval-seconds: 30
      scan-node-limit: 10
      failover-task-limit: 50
    job-lock-ttl: 5m
    job-lock-ttl-min: 30s
    job-lock-ttl-max: 24h
    scheduler-pool-size: 8
    scheduler-await-termination-seconds: 30
    leader:
      enabled: true
      role: ydsz-job-scheduler
      lease-seconds: 30
      renew-interval-seconds: 10
    scanner:
      interval-ms: 5000
      batch-size: 100
      misfire-grace-minutes: 30
    executor:
      register-on-startup: true
      heartbeat-interval-seconds: 10
      offline-threshold-seconds: 30
      drain-on-shutdown: true
      drain-timeout-seconds: 60
      max-concurrent: 16
      isolation-strategy: none
      tenant-pool-size: 10
      tenant-pool-queue-capacity: 200
    timeout-monitor:
      interval-ms: 10000
    quota:
      enabled: false
      default-max-jobs: null
      default-max-concurrent: null
      default-max-daily-executions: null
    alert:
      feishu:
        enabled: false
        webhook-url: ""
      sms:
        enabled: false
        webhook-url: ""
        phone-numbers: ""
    log-retention:
      retention-days: 30
      batch-size: 1000
      cron: "0 0 3 * * ?"
  # P0-1: 统一线程池配置（ydsz-common-thread）
  # 注意：池名必须与代码 getBean("xxxExecutor") 一致（common-thread 生成 Bean 名 = 池名 + "Executor"）
  thread:
    enabled: true
    pools:
      cronjobDispatch:
        core-size: 8
        max-size: 32
        queue-capacity: 500
        thread-name-prefix: cron-dispatch-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 60
      cronjobMapReduce:
        core-size: 4
        max-size: 16
        queue-capacity: 200
        thread-name-prefix: cron-mapreduce-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 60
      cronjobRetry:
        core-size: 2
        max-size: 4
        queue-capacity: 200
        thread-name-prefix: cron-retry-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 30
      cronjobScan:
        core-size: 4
        max-size: 8
        queue-capacity: 100
        thread-name-prefix: cron-scan-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 30

# DEV 暴露 OpenAPI 端点（配合 ydsz.doc.enabled）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
