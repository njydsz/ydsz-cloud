# =====================================================================
#  YDSZ · CronJob · SIT 环境配置（Nacos DataId）
#  DataId:    ydsz-cronjob-sit.yaml
#  Group:     sit
#  端口:      9006
# =====================================================================

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.cronjob.entity

# 调度服务配置（SIT 环境精简版）
ydsz:
  cronjob:
    node-discovery:
      type: nacos
    failover:
      enabled: true
      scan-interval-seconds: 30
    leader:
      enabled: true
      role: ydsz-job-scheduler
    scanner:
      interval-ms: 5000
      batch-size: 100
    executor:
      register-on-startup: true
      heartbeat-interval-seconds: 10
      max-concurrent: 16

# SIT 环境关闭文档 UI
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: true
knife4j:
  production: true

# SIT 环境 YDSZ 业务日志降为 INFO
logging:
  level:
    "[com.njydsz]": INFO
