# YDSZ 调度服务本地配置
# 公共配置（mybatis-plus / management / springdoc / datasource / redis）由 Nacos 共享配置
# ydsz-common.yaml 提供，此处仅保留服务私有配置

# P1-2: 统一线程池配置（common-thread）
# 注：taskExecutorPool（PriorityBlockingQueue）和 retryScheduler（ScheduledExecutorService）
# 因特殊队列/调度需求保留手动创建，由 CronjobProperties 配置化
ydsz:
  # P1-14: 操作审计配置 —— 将 common-audit 的写入路由到 ydsz_job_audit_log 表（与 SysAuditLogMapper 查询同源）
  audit:
    enabled: true
    app-key: ydsz-cronjob
    record-request: false
    record-response: true # Outbox 订阅记录 responseResult（任务执行结果摘要）
    retention-days: 180 # cronjob 调度审计建议保留 180 天（排查历史执行问题）
    sharding-enabled: false
    sharding-base-table-name: ydsz_job_audit_log # 写入自建表（表结构兼容 common-audit 的 DDL）
    async:
      batch-size: 50 # Outbox 订阅者低频触发，批量阈值下调以提升实时性
      queue-capacity: 5000
      thread-core-size: 1 # 单一订阅者线程，降低资源占用
      thread-max-size: 2
      reject-policy: CALLER_RUNS
      shutdown-timeout: 15
  thread:
    enabled: true
    pools:
      cronjobMapReduce:
        core-size: 4
        max-size: 8
        queue-capacity: 200
        thread-name-prefix: ydsz-job-mapreduce-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 30
      cronjobDispatch:
        core-size: 2
        max-size: 4
        queue-capacity: 100
        thread-name-prefix: ydsz-job-dispatch-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 15
      # P2-2: auditExecutor — 任务结果队列发布异步线程（JobResultQueuePublisher.onTaskCompleted）
      # 注意：与 ydsz-common-audit 的 auditAsyncExecutor 不同，auditExecutor 专用于结果队列推送，非审计落库
      auditExecutor:
        core-size: 2
        max-size: 4
        queue-capacity: 100
        thread-name-prefix: ydsz-job-audit-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 15
  # P0-1: YdszJson ASM 预热（DAG 编解码/任务调度高频序列化 Bean）
  json:
    enabled: true
    monitoring-enabled: true
    warmup-classes:
      - com.njydsz.cronjob.domain.entity.job.Job
      - com.njydsz.cronjob.domain.entity.job.JobTask
      - com.njydsz.cronjob.domain.entity.job.JobHistory
      - com.njydsz.cronjob.domain.entity.dag.JobDag
      - com.njydsz.cronjob.domain.entity.dag.JobDagInstance

  # P0: JDBC 安全加固（ydsz-common-jdbc）
  jdbc:
    # SQL 防火墙：拦截 DDL（DROP/TRUNCATE）、无 WHERE 写操作、多语句注入、GRANT/REVOKE
    sql-firewall:
      enabled: true
      block-drop-table: true
      block-truncate: true
      block-delete-without-where: true
      block-update-without-where: true
      block-multi-statement: true
      block-permission-ops: true
    # 分页安全上限：防止 pageSize=999999 导致全表扫描 OOM
    pagination:
      max-limit: 500
    # P1: 慢 SQL 全局检测
    slow-sql:
      enabled: true
      threshold-millis: 500
      alert-threshold-millis: 2000
    # P2: SQL 审计（写操作落盘备查）
    sql-audit:
      enabled: true
      audit-select: false
      audit-insert: true
      audit-update: true
      audit-delete: true
      log-parameters: true
      max-parameter-length: 500

# P2-8: Flyway 数据库迁移配置
spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false
    validate-on-migrate: true
    clean-disabled: true

logging:
  pattern:
    # SkyWalking traceId 支持：Agent 注入时自动填充 X{traceId}，未启用时为空
    level: "%5p [%X{traceId:-},%X{spanId:-}]"

# SkyWalking 链路追踪（通过 Java Agent 方式启用，无需修改业务代码）
# 启动示例：java -javaagent:/path/to/skywalking-agent.jar \
#   -Dskywalking.agent.service_name=ydsz-cronjob \
#   -Dskywalking.collector.backend_service=localhost:11800 \
#   -jar ydsz-cronjob.jar
skywalking:
  agent:
    service_name: ${spring.application.name}
    collector_backend_service: ${SW_AGENT_COLLECTOR_BACKEND_SERVICES:127.0.0.1:11800}
