# YDSZ 调度服务本地配置
# 公共配置（mybatis-plus / management / springdoc / datasource / redis）由 Nacos 共享配置
# ydsz-common.yaml 提供，此处仅保留服务私有配置

# P1-2: 统一线程池配置（common-thread）
# 注：taskExecutorPool（PriorityBlockingQueue）和 retryScheduler（ScheduledExecutorService）
# 因特殊队列/调度需求保留手动创建，由 CronjobProperties 配置化
ydsz:
  thread:
    enabled: true
    pools:
      cronjobMapReduce:
        core-size: 4
        max-size: 8
        queue-capacity: 200
        thread-name-prefix: ydsz-job-mapreduce-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 30
      cronjobDispatch:
        core-size: 2
        max-size: 4
        queue-capacity: 100
        thread-name-prefix: ydsz-job-dispatch-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 15
  # P0-1: YdszJson ASM 预热（DAG 编解码/任务调度高频序列化 Bean）
  json:
    enabled: true
    monitoring-enabled: true
    warmup-classes:
      - com.njydsz.cronjob.domain.entity.job.Job
      - com.njydsz.cronjob.domain.entity.job.JobTask
      - com.njydsz.cronjob.domain.entity.job.JobHistory
      - com.njydsz.cronjob.domain.entity.dag.JobDag
      - com.njydsz.cronjob.domain.entity.dag.JobDagInstance

  # P0: JDBC 安全加固（ydsz-common-jdbc）
  jdbc:
    # SQL 防火墙：拦截 DDL（DROP/TRUNCATE）、无 WHERE 写操作、多语句注入、GRANT/REVOKE
    sql-firewall:
      enabled: true
      block-drop-table: true
      block-truncate: true
      block-delete-without-where: true
      block-update-without-where: true
      block-multi-statement: true
      block-permission-ops: true
    # 分页安全上限：防止 pageSize=999999 导致全表扫描 OOM
    pagination:
      max-limit: 500
    # P1: 慢 SQL 全局检测
    slow-sql:
      enabled: true
      threshold-millis: 500
      alert-threshold-millis: 2000
    # P2: SQL 审计（写操作落盘备查）
    sql-audit:
      enabled: true
      audit-select: false
      audit-insert: true
      audit-update: true
      audit-delete: true
      log-parameters: true
      max-parameter-length: 500
