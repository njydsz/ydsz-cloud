# Task state transition descriptions
workflow.transition.PENDING={0} → PENDING: task activated/resumed
workflow.transition.CLAIMED={0} → CLAIMED: task claimed
workflow.transition.COMPLETED={0} → COMPLETED: task approved
workflow.transition.REJECTED={0} → REJECTED: task rejected
workflow.transition.SKIPPED={0} → SKIPPED: task skipped
workflow.transition.CANCELLED={0} → CANCELLED: task cancelled
workflow.transition.TIMEOUT={0} → TIMEOUT: task timeout
workflow.transition.DELEGATED={0} → DELEGATED: task delegated
workflow.transition.FROZEN={0} → FROZEN: task frozen
workflow.transition.SUSPENDED={0} → SUSPENDED: task suspended
workflow.transition.DRAFT={0} → DRAFT: task draft saved
workflow.transition.no.change={0}: state unchanged
workflow.transition.unknown=Unknown state transition

