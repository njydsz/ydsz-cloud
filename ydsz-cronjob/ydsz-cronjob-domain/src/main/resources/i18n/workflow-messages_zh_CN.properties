# 任务状态流转描述
workflow.transition.PENDING={0} → PENDING: 任务激活/恢复
workflow.transition.CLAIMED={0} → CLAIMED: 任务签收
workflow.transition.COMPLETED={0} → COMPLETED: 任务通过
workflow.transition.REJECTED={0} → REJECTED: 任务驳回
workflow.transition.SKIPPED={0} → SKIPPED: 任务跳过
workflow.transition.CANCELLED={0} → CANCELLED: 任务取消
workflow.transition.TIMEOUT={0} → TIMEOUT: 任务超时
workflow.transition.DELEGATED={0} → DELEGATED: 任务委派
workflow.transition.FROZEN={0} → FROZEN: 任务冻结
workflow.transition.SUSPENDED={0} → SUSPENDED: 任务挂起
workflow.transition.DRAFT={0} → DRAFT: 任务暂存
workflow.transition.no.change={0}: 状态未变化
workflow.transition.unknown=未知状态流转

# 实例状态流转描述
workflow.instance.transition.DRAFT={0} → DRAFT: 转为草稿（暂存待审）
workflow.instance.transition.RUNNING={0} → RUNNING: 流程激活/恢复
workflow.instance.transition.SUSPENDED={0} → SUSPENDED: 流程挂起
workflow.instance.transition.COMPLETED={0} → COMPLETED: 流程完成
workflow.instance.transition.TERMINATED={0} → TERMINATED: 流程终止
workflow.instance.transition.REJECTED={0} → REJECTED: 流程驳回
workflow.instance.transition.ERROR={0} → ERROR: 流程异常
workflow.instance.transition.ROLLED_BACK={0} → ROLLED_BACK: 流程回滚
workflow.instance.transition.no.change={0}: 状态未变化
workflow.instance.transition.unknown=未知状态流转

