sonar.projectKey=ydsz-pmis
sonar.projectName=YDSZ PMIS
sonar.projectVersion=1.0.0

# Source paths
sonar.sources=ydsz-pmis-backend,ydsz-pmis-frontend/src

# Test paths
sonar.tests=ydsz-pmis-backend/src/test,ydsz-pmis-frontend/src/__tests__

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/*.xml

# Language
sonar.java.source=21

# Coverage
sonar.coverage.jacoco.xmlReportPaths=ydsz-pmis-backend/**/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=ydsz-pmis-frontend/coverage/lcov.info

# Duplication
sonar.cpd.exclusions=**/generated/**,**/dto/**,**/vo/**

# Quality Gate
sonar.qualitygate.wait=true
