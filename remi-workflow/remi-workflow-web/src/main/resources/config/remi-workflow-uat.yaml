# =====================================================================
#  REMI · Workflow · UAT 环境配置（Nacos DataId）
#  DataId:    remi-workflow-uat.yaml
#  Group:     uat
#  端口:      9005
# =====================================================================

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml,classpath*:mapper/flow/**/*.xml
  type-aliases-package: com.remisoft.workflow.entity

# UAT 环境关闭文档 UI
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: true
knife4j:
  production: true

# UAT 环境 REMI 业务日志降为 INFO
logging:
  level:
    "[com.remisoft]": INFO
