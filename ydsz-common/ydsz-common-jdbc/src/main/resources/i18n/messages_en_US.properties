# JDBC Module English Messages
jdbc.datasource.unavailable = DataSource unavailable
jdbc.datasource.route.failed = DataSource routing failed
jdbc.connection.pool.exhausted = Connection pool exhausted
jdbc.sql.parse.failed = SQL parsing failed
jdbc.sql.firewall.blocked = SQL blocked by firewall
jdbc.data.permission.denied = Insufficient data permission
jdbc.deep.pagination.blocked = Deep pagination blocked
jdbc.slave.unavailable = Slave database unavailable
jdbc.slave.latency.exceeded = Slave latency exceeds threshold
jdbc.circuit.breaker.open = Circuit breaker is open
jdbc.circuit.breaker.half.open.failed = Half-open probe failed
