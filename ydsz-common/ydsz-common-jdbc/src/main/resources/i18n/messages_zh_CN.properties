# JDBC数据访问模块中文消息
jdbc.datasource.unavailable = 数据源不可用
jdbc.datasource.route.failed = 数据源路由失败
jdbc.connection.pool.exhausted = 连接池耗尽
jdbc.sql.parse.failed = SQL解析失败
jdbc.sql.firewall.blocked = SQL被防火墙拦截
jdbc.data.permission.denied = 数据权限不足
jdbc.deep.pagination.blocked = 深度分页被阻止
jdbc.slave.unavailable = 从库不可用
jdbc.slave.latency.exceeded = 从库延迟超过阈值
jdbc.circuit.breaker.open = 熔断器打开
jdbc.circuit.breaker.half.open.failed = 半开状态探测失败
