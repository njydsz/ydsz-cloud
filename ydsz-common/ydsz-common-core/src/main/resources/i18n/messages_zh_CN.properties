# YDSZ Common Core - i18n Messages (简体中文)

# ==================== 响应消息 ====================
response.success=操作成功
response.error=操作失败

# ==================== BaseResultCode - 成功 ====================
error.SUCCESS=操作成功

# ==================== A1xxxx 通用 / B1xxxx 系统级 ====================
error.BAD_REQUEST=请求参数错误
error.VALIDATION_FAILED=参数校验失败
error.MISSING_PARAMETER=缺少参数
error.METHOD_NOT_ALLOWED=请求方法不允许
error.UNSUPPORTED_MEDIA_TYPE=不支持的媒体类型
error.NOT_FOUND=资源不存在
error.DUPLICATE_KEY=资源已存在
error.BIZ_ERROR=业务规则校验失败
error.INTERNAL_ERROR=系统内部错误
error.SERVICE_UNAVAILABLE=服务暂不可用
error.REQUEST_TIMEOUT=请求超时
error.RATE_LIMIT=请求频率超限
error.QUOTA_EXCEEDED=租户配额超限

# ==================== C1xxxx 数据库 ====================
error.DB_DUPLICATE_KEY=数据唯一性冲突
error.DB_CONSTRAINT_VIOLATION=数据约束冲突
error.DB_DATA_INTEGRITY=数据完整性错误
error.DB_QUERY_TIMEOUT=数据库查询超时
error.DB_CONNECTION_FAILED=数据库连接失败
error.DB_LOCK_CONTENTION=数据库锁冲突
error.RESOURCE_LOCKED=资源锁冲突

# ==================== A106xx 请求语义 ====================
error.INVALID_RANGE=请求范围无效
error.PAYLOAD_TOO_LARGE=请求体过大
error.TOO_MANY_REQUESTS=请求过多

# ==================== B2xxxx 系统状态 ====================
error.SYSTEM_MAINTENANCE=系统维护中
error.FEATURE_DISABLED=功能已禁用
error.CIRCUIT_BREAKER_OPEN=熔断器已开启，请稍后重试

# ==================== C1xxxx 第三方/基础设施 ====================
error.THIRD_PARTY_SERVICE_ERROR=第三方服务异常
error.THIRD_PARTY_TIMEOUT=第三方服务调用超时
error.THIRD_PARTY_RATE_LIMITED=第三方服务限流
error.CACHE_OPERATION_FAILED=缓存操作失败
error.MQ_PUBLISH_FAILED=消息发送失败
error.MQ_CONSUME_FAILED=消息消费失败

# ==================== A2xxxx 认证授权 ====================
error.UNAUTHORIZED=未登录
error.TOKEN_EXPIRED=Token 已过期
error.TOKEN_INVALID=Token 无效
error.FORBIDDEN=无权限访问
error.DATA_SCOPE_FORBIDDEN=数据权限不足
error.PASSWORD_WEAK=密码强度不足
error.PASSWORD_EXPIRED=密码已过期，请修改
error.PASSWORD_REUSED=不能使用最近使用过的密码
error.MFA_REQUIRED=需要双因素认证
error.MFA_INVALID=双因素认证码无效
error.ACCOUNT_LOCKED=账号已锁定
error.SESSION_KICKED=账号已在其他设备登录

# ==================== C9xxxx 未知 ====================
error.UNKNOWN=未知错误
