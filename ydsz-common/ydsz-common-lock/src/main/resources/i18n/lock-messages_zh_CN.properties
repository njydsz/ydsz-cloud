# 分布式锁模块中文消息
lock.error = 分布式锁操作失败
lock.acquire.timeout = 获取锁超时，请稍后重试
lock.acquire.interrupted = 获取锁被中断
lock.release.failed = 释放锁失败，锁可能已被其他线程持有
lock.renew.failed = 锁续期失败，锁可能已过期
lock.max.depth.exceeded = 超过最大锁重入深度
lock.redis.unavailable = Redis 不可用，分布式锁降级失败
lock.unknown = 未知锁错误
idempotent.reject = 请求重复提交，请稍后重试
