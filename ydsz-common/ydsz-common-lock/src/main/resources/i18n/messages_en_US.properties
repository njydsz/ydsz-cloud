# Distributed Lock Module English Messages
lock.error = Distributed lock operation failed
lock.acquire.timeout = Acquiring lock timed out, please try again later
lock.acquire.interrupted = Acquiring lock was interrupted
lock.release.failed = Releasing lock failed, lock may be held by another thread
lock.renew.failed = Lock renewal failed, lock may have expired
lock.max.depth.exceeded = Maximum lock reentrant depth exceeded
lock.redis.unavailable = Redis unavailable, distributed lock degradation failed
lock.unknown = Unknown lock error
idempotent.reject = Duplicate request rejected, please try again later
