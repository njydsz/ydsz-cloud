# ydsz-common-seata 分布式事务模块消息资源文件
module.name=分布式事务
module.description=YDSZ Seata 分布式事务集成模块，支持 AT/TCC/SAGA 模式

# ==================== 事务相关 ====================
seata.transaction.failed=分布式事务执行失败
seata.transaction.timeout=分布式事务超时，已触发回滚
seata.transaction.rollback.failed=分布式事务回滚异常
seata.transaction.commit.failed=分布式事务提交异常
seata.global.lock.acquire.failed=获取全局锁失败
seata.xid.propagation.failed=XID 跨服务传播失败
seata.xid.bind.failed=XID 绑定到 RootContext 失败

# ==================== 启动期配置校验 ====================
seata.config.proxy-mode.invalid=data-source-proxy-mode 值不合法，可选值: AT/TCC/SAGA/XA
seata.config.undo-log-serialization.invalid=undo-log.serialization 值不合法，可选值: jackson/kryo/fastjson/protobuf
seata.config.at-auto-proxy-required=AT 模式下 enable-auto-data-source-proxy 必须为 true
seata.config.xid-sign-secret-weak=xid-sign-secret 长度不足 16 位，生产环境建议增强密钥复杂度
