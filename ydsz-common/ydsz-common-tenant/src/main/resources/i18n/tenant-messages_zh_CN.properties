# ydsz-common-tenant 租户模块消息资源文件
module.name=租户服务
module.description=YDSZ 租户隔离模块，提供租户上下文管理、SQL 级隔离与租户级限流

# ==================== 租户上下文 ====================
tenant.context.required=无法获取租户上下文，已拒绝执行 SQL 以避免跨租户数据泄露。请检查 TenantContextWebFilter 是否正确注册，或使用 SystemTenantContextRunner 包装异步/定时任务
tenant.field.value.missing=无法获取租户字段 [{0}] 的值（列名={1}），已拒绝执行 SQL
tenant.header.missing=缺少租户标识 Header
tenant.insert.select.unaligned=INSERT ... SELECT 语句结构无法对齐租户字段 [{0}] 的列数（列名={1}），已拒绝执行 SQL 以防跨租户数据写入。table={2}

# ==================== 租户隔离 ====================
tenant.isolation.failed=租户数据隔离失败：{0}
tenant.datasource.route.failed=租户数据源路由失败：{0}
tenant.cache.isolation.disabled=租户缓存隔离已禁用

# ==================== 租户限流 ====================
tenant.rate.limit.exceeded=租户 API 调用配额已用尽，请稍后重试
tenant.storage.quota.exceeded=租户存储配额已用尽，请升级套餐
tenant.login.rate.exceeded=登录频率过高，请稍后重试

# ==================== 租户管理 ====================
tenant.not.found=租户不存在：{0}
tenant.disabled=租户已禁用：{0}
