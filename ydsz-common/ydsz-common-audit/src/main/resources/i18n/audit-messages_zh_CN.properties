common.audit.storage.table_required=表名不能为空
common.audit.storage.table_invalid=表名包含非法字符: {0}

# ==================== DefaultAuditQueryService ====================
common.audit.query.table_required=表名不能为空
common.audit.query.table_invalid=非法的表名: {0}，仅允许字母、数字和下划线

# ==================== SensitiveFieldMask ====================
common.audit.mask.utility_class=SensitiveFieldMask 是工具类，禁止实例化
