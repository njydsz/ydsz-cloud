common.audit.recorder.strategy_invalid=策略必须为 DISCARD_OLDEST、DISCARD_NEWEST 或 CALLER_RUNS

# ==================== JdbcAuditStorage ====================
common.audit.storage.write_failed=审计日志单条写入失败 id={0}
