# =====================================================================
#  YDSZ 代码生成器 bootstrap 配置
#  --------------------------------------------------------------------
#  端口：9009
#  职责：代码生成引擎（模板驱动 / MapStruct / MyBatis-Plus / DDL 解析）
#  依赖：Nacos 服务发现 / 配置中心、MySQL（独立库 ydsz_cloud_gen）
#  说明：bootstrap.yml 在 application.yml 之前加载，用于提前连接 Nacos
#        注意 generator 使用 MySQL 数据源（非 PostgreSQL）
# =====================================================================

server:
  # HTTP 监听端口
  port: 9009
  max-http-request-header-size: 16KB
  servlet:
    context-path: /gen

spring:
  application:
    name: ydzs-generator
  profiles:
    # 默认 dev，可通过 -Dspring.profiles.active=dev|sit|uat|prod 或 ENV SPRING_PROFILES_ACTIVE 覆盖
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    web-application-type: servlet
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      fail-fast: false
      # ---------- 服务注册 ----------
      discovery:
        enabled: false
        register-enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ydsz}
        group: ${NACOS_GROUP:${spring.profiles.active}}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        metadata:
          version: 26.10.01
          port: 9009
        ip-type: IPv4
      # ---------- 配置中心 ----------
      config:
        enabled: false
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ydsz}
        group: ${NACOS_GROUP:${spring.profiles.active}}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yaml
        refresh-enabled: true
        shared-configs:
          - data-id: ydsz-common.yml
            group: ${spring.profiles.active}
            refresh: true
          - data-id: ydzs-generator-web.yml
            group: ${spring.profiles.active}
            refresh: true
