server:
  port: 9090
  servlet:
    context-path: /gen

spring:
  application:
    name: ydzs-generator
  datasource:
    url: ${NACOS_GEN_DB_URL:jdbc:mysql://localhost:3306/ydsz_cloud_gen?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${NACOS_GEN_DB_USERNAME:}
    password: ${NACOS_GEN_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.generator.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 代码生成器自定义配置
generator:
  # 默认输出目录
  output-dir: ./generated
  # 默认作者
  default-author: ydsz-generator
  # 默认基础包
  default-package: com.njydsz
  # 模板分组
  template-group: default
  # 冲突策略: SKIP / OVERRIDE / MERGE
  conflict-strategy: SKIP
  # 表前缀（生成类名时去除）
  table-prefix: t_,tab_
  # 批量生成单表超时（分钟）
  batch-timeout-minutes: 5
  # 代码生成异步线程池
  thread-pool:
    # 核心线程数（默认 CPU 核数）
    core-size: 0
    # 最大线程数（默认 16）
    max-size: 16
    # 排队容量
    queue-capacity: 64

# 统一线程池配置（ydsz-common-thread）
ydsz:
  thread:
    pools:
      code-gen:
        core-size: 4
        max-size: 16
        queue-capacity: 64
        thread-name-prefix: code-gen-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 30

# 日志
logging:
  level:
    com.njydsz.generator: DEBUG
    com.njydsz.generator.mapper: INFO

# 审计日志配置（ydsz-common-audit 自动装配读取 ydsz.audit 前缀）
ydsz:
  audit:
    enabled: true
    app-key: ydsz-generator
    storage-type: LOCAL
    record-request: true
    record-response: false
    sensitive-params:
      - password
      - url
      - connectionString
    retention-days: 90
    async:
      batch-size: 50
      thread-core-size: 1
      thread-max-size: 2
      queue-capacity: 5000

# Spring Boot Actuator + Prometheus 端点暴露
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
