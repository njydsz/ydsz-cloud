server:
  port: 9090
  servlet:
    context-path: /gen

spring:
  application:
    name: ydzs-generator
  datasource:
    url: jdbc:mysql://localhost:3306/ydsz_cloud_gen?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.generator.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 代码生成器自定义配置
generator:
  # 默认输出目录
  output-dir: ./generated
  # 默认作者
  default-author: ydsz-generator
  # 默认基础包
  default-package: com.njydsz
  # 模板分组
  template-group: default
  # 冲突策略: SKIP / OVERRIDE / MERGE
  conflict-strategy: SKIP
  # 表前缀（生成类名时去除）
  table-prefix: t_,tab_

# 日志
logging:
  level:
    com.njydsz.generator: DEBUG
    com.njydsz.generator.mapper: INFO
