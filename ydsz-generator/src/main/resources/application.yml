# 代码生成器数据源配置
spring:
  application:
    name: ydsz-generator
  datasource:
    # 支持 mysql / postgresql / oracle
    url: jdbc:postgresql://localhost:5432/ydsz_cloud
    username: ydsz
    password: ydsz123
    driver-class-name: org.postgresql.Driver
  main:
    web-application-type: servlet

# 代码生成器配置
ydsz:
  generator:
    # 当前激活的分组名（可选，未设置时使用顶层配置）
    # active-group: dev-system

    # 分组配置（支持多模块一键切换）
    # groups:
    #   dev-system:
    #     module-name: system
    #     package-name: com.njydsz.system
    #     table-names:
    #       - ydsz_sys_tenant
    #     output-dir: "D:/Code/open/ydsz-cloud"
    #   dev-userinfo:
    #     module-name: userinfo
    #     package-name: com.njydsz.userinfo
    #     table-names:
    #       - ydsz_user_info
    #     output-dir: "D:/Code/open/ydsz-cloud"

    # 顶层配置（默认分组）
    module-name: system
    package-name: com.njydsz.system
    table-prefix: "ydsz_"
    table-names:
      - ydsz_sys_tenant
    output-dir: "D:/Code/open/ydsz-cloud"
    author: ydsz-team

    # 各层生成开关
    generate-entity: true
    generate-repository: true
    generate-service: true
    generate-controller: true
    generate-model: true
    generate-mapper: true
    generate-converter: true
    generate-feign: true

    # 文件冲突策略: skip / override / merge / prompt
    file-conflict-strategy: prompt

server:
  port: 9010

logging:
  level:
    root: INFO
    com.njydsz.generator: DEBUG
