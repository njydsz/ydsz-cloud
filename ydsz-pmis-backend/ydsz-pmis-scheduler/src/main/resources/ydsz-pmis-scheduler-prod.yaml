# ============================================================
# Nacos 配置：ydsz-pmis-scheduler-prod
# DataId  : ydsz-pmis-scheduler-prod.yaml
# Group   : PMIS_GROUP_PROD
# Namespace: pmis
# 环境     : PROD（生产环境）
# 规范     : 互联网大厂标准 - 任务分片 / 故障转移 / 错峰执行
# ============================================================

server:
  port: 9012
  compression:
    enabled: true
    level: BEST_SPEED
  servlet:
    context-path: /

spring:
  application:
    name: ydsz-pmis-scheduler
  profiles:
    active: prod
  main:
    web-application-type: servlet
    banner-mode: off
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_NULL
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE:pmis}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
        fail-fast: true
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:pmis}
        group: PROD
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        refresh-enabled: true
        fail-fast: true
        extension-configs:
          - dataId: pmis-common-prod.yaml
            group: PROD
            refresh: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?useUnicode=true&characterEncoding=utf8&currentSchema=public
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 20
      min-idle: 20
      max-active: 80
      max-wait: 30000
      validation-query: SELECT 1
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 2s
      lettuce:
        pool:
          max-active: 64
          max-idle: 32
          min-idle: 8

xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN}
      access-token: ${XXL_JOB_ACCESS_TOKEN}
    executor:
      appname: pmis-scheduler
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      ip: ${XXL_JOB_EXECUTOR_IP:}
      port: ${XXL_JOB_EXECUTOR_PORT:9999}
      logpath: /var/log/pmis/xxl-job
      logretentiondays: 90
    access-token: ${XXL_JOB_ACCESS_TOKEN}

pmis:
  scheduler:
    enabled: true
    reconcile-job-cron: "0 30 2 * * ?"
    evm-snapshot-cron: "0 30 1 * * ?"
    alert-scan-cron: "0 */5 * * * ?"
    report-subscription-cron: "0 0 8 * * ?"
    billable-util-snapshot-cron: "0 0 2 * * ?"
    consistency-check-cron: "0 0 4 * * ?"
    sharding-enabled: true
    sharding-count: 5
    fail-retry-count: 3
    timeout-seconds: 600

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.pmis.scheduler.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${spring.profiles.active}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
      percentiles:
        http:
          server:
            requests: 0.5,0.75,0.9,0.95,0.99

logging:
  level:
    root: WARN
    com.njydsz.pmis: INFO
    com.xxl.job: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"
  file:
    name: /var/log/pmis/scheduler
