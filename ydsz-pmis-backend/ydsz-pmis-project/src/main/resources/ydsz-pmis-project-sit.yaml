# ============================================================
# Nacos 配置：ydsz-pmis-project-sit
# DataId  : ydsz-pmis-project-sit.yaml
# Group   : PMIS_GROUP
# Namespace: pmis-sit
# 环境     : SIT（系统集成测试）
# ============================================================

server:
  port: 9015
  compression:
    enabled: true
  servlet:
    context-path: /

spring:
  application:
    name: ydsz-pmis-project
  profiles:
    active: sit
  main:
    web-application-type: servlet
    banner-mode: log
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_NULL
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE:pmis-sit}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:pmis-sit}
        group: PMIS_GROUP
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        refresh-enabled: true
        extension-configs:
          - dataId: pmis-common-sit.yaml
            group: PMIS_GROUP
            refresh: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?useUnicode=true&characterEncoding=utf8&currentSchema=public
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      filters: stat,wall,slf4j
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

pmis:
  project:
    contract-template-path: /var/data/pmis/contract-templates/
    upload-max-size: 50MB
    change-require-approval: true

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: pmis-tx-group
  enable-auto-data-source-proxy: true
  registry:
    type: nacos
    nacos:
      server-addr: ${NACOS_SERVER_ADDR}
      namespace: pmis
      group: SEATA_GROUP
  config:
    type: nacos
    nacos:
      server-addr: ${NACOS_SERVER_ADDR}
      namespace: pmis
      group: SEATA_GROUP
      data-id: seata-client.properties
  service:
    vgroup-mapping:
      pmis-tx-group: default
    grouplist:
      default: ${SEATA_SERVER_ADDR}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.pmis.project.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${spring.profiles.active}

logging:
  level:
    root: INFO
    com.njydsz.pmis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"
  file:
    name: /var/log/pmis/project
