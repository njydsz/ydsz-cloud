# =====================================================================
#  PMIS 项目服务（Project + Execution 合并）配置
#  --------------------------------------------------------------------
#  端口：9003
#  职责：项目全生命周期 + 执行管理
#    - 商机 / 立项 / 变更 / 合同 / 模板 / 审批
#    - WBS 任务 / 工时归集 / 成本归集 / 利润 / EVM
#    - 风险 / 预警 / 报表 / 导出 / 复盘
#    - 收付款 / 发票 / 报销 / 采购 / 客户信用
#  依赖：Nacos、PostgreSQL、Redis、MinIO（文件）、ES（日志/搜索，可选）、Seata
# =====================================================================

server:
  port: 9003

spring:
  application:
    name: ydsz-pmis-project
  profiles:
    active: dev
  main:
    web-application-type: servlet
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        file-extension: yml
        group: ${spring.profiles.active}
        namespace: ${NACOS_NAMESPACE:pmis}

  # ---------- 数据源 ----------
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?currentSchema=public
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}

  # ---------- Redis ----------
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DB:0}
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
          max-wait: 5s
    # ---------- Elasticsearch（可选，用于全文搜索、日志分析） ----------
    elasticsearch:
      uris: ${ES_URIS:http://localhost:9200}
      connection-timeout: 5s
      socket-timeout: 30s

# ---------- MinIO 对象存储（异步导出文件上传） ----------
minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9100}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  default-bucket: ${MINIO_BUCKET:pmis}
  url-expire-seconds: 3600  # 预签名 URL 1 小时过期

# ---------- MyBatis-Plus ----------
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.pmis.project.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO

# ---------- SpringDoc / Swagger ----------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ---------- 日志 ----------
logging:
  level:
    root: INFO
    "[com.njydsz.pmis]": DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"

# =====================================================================
# Seata 分布式事务（AT 模式）
# ---------------------------------------------------------------------
# 跨服务事务场景：
#   - 商机转立项（project + workflow）
#   - 工时归集（project + finance）
#   - 利润快照（project + finance + agent）
# 配套：
#   - 服务端：deploy/seata/docker-compose.yml
#   - 配置：deploy/seata/seata-client.properties
# =====================================================================
seata:
  enabled: true                              # 启用 Seata
  application-id: ${spring.application.name} # 应用 ID
  tx-service-group: pmis-tx-group            # 事务分组
  enable-auto-data-source-proxy: true        # 自动数据源代理（推荐）
  registry:
    type: nacos
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      namespace: pmis
      group: SEATA_GROUP
  config:
    type: nacos
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      namespace: pmis
      group: SEATA_GROUP
      data-id: seata-client.properties
  service:
    vgroup-mapping:
      pmis-tx-group: default                 # 事务分组映射
    grouplist:
      default: ${SEATA_SERVER_ADDR:127.0.0.1:8091}  # Seata Server 地址
