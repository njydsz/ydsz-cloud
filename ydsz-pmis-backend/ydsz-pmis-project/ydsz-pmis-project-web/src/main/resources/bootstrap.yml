# =====================================================================
#  PMIS 项目服务 bootstrap 配置（Project + Execution 合并）
#  --------------------------------------------------------------------
#  端口：9003
#  职责：项目全生命周期 + 执行管理
#    - 商机 / 立项 / 变更 / 合同 / 模板 / 审批
#    - WBS 任务 / 工时归集 / 成本归集 / 利润 / EVM
#    - 风险 / 预警 / 报表 / 导出 / 复盘
#    - 收付款 / 发票 / 报销 / 采购 / 客户信用
#  依赖：Nacos 服务发现 / 配置中心、PostgreSQL、Redis、MinIO、Seata
#  说明：bootstrap.yml 在 application.yml 之前加载，用于提前连接 Nacos
# =====================================================================

server:
  # HTTP 监听端口（按构建顺序 4/7）
  port: 9003
  max-http-request-header-size: 16KB
  servlet:
    context-path: /

spring:
  application:
    name: ydsz-pmis-project
  profiles:
    # 默认 dev，可通过 -Dspring.profiles.active=dev|sit|uat|prod 或 ENV SPRING_PROFILES_ACTIVE 覆盖
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    web-application-type: servlet
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      # ---------- 服务注册 ----------
      discovery:
        enabled: true
        register-enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:pmis}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        metadata:
          version: 1.0.0
          port: 9003
        ip-type: IPv4
      # ---------- 配置中心 ----------
      config:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:pmis}
        group: ${NACOS_GROUP:${spring.profiles.active}}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yaml
        refresh-enabled: true
        shared-configs:
          - data-id: ydsz-pmis-common.yaml
            group: ${spring.profiles.active}
            refresh: true
