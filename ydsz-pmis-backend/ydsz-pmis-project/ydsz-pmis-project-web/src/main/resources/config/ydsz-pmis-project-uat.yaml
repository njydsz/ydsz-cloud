# =====================================================================
#  YDSZ PMIS · Project · UAT 环境配置（Nacos DataId）
#  DataId:    ydsz-pmis-project-uat.yaml
#  Group:     uat
#  端口:      9003
# =====================================================================

# MinIO 对象存储（UAT 环境密钥由环境变量注入）
minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9100}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  default-bucket: ${MINIO_BUCKET:pmis}
  url-expire-seconds: 3600

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.pmis.project.domain.entity

# UAT 环境关闭文档 UI
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: true
knife4j:
  production: true

# Seata 分布式事务（AT 模式）
# 2026-07-16: sales/finance 合并到 project 后,跨服务分布式事务降级为同进程本地事务
pmis:
  seata:
    enabled: false
    default-type: LOCAL

