# ============================================================
# Nacos 配置：ydsz-pmis-execution-prod
# DataId  : ydsz-pmis-execution-prod.yaml
# Group   : PMIS_GROUP_PROD
# Namespace: pmis
# 环境     : PROD（生产环境）
# ============================================================

server:
  port: 9006
  compression:
    enabled: true
    level: BEST_SPEED
  servlet:
    context-path: /

spring:
  application:
    name: ydsz-pmis-execution
  profiles:
    active: prod
  main:
    web-application-type: servlet
    banner-mode: off
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_NULL
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE:pmis}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
        fail-fast: true
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:pmis}
        group: prod
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        refresh-enabled: true
        fail-fast: true
        extension-configs:
          - dataId: pmis-common-prod.yaml
            group: prod
            refresh: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?useUnicode=true&characterEncoding=utf8&currentSchema=public
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 30
      min-idle: 30
      max-active: 100
      max-wait: 30000
      validation-query: SELECT 1
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 30
      filters: stat,wall,slf4j
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 2s
      lettuce:
        pool:
          max-active: 100
          max-idle: 50
          min-idle: 10
  elasticsearch:
    uris: ${ES_URIS}
    connection-timeout: 2s
    socket-timeout: 15s
    username: ${ES_USERNAME}
    password: ${ES_PASSWORD}

pmis:
  execution:
    timesheet-lock-days: 5
    billable-rate-default: 1500.00
    evm:
      cpi-yellow: ${PMIS_EVM_CPI_YELLOW:0.95}
      cpi-red: ${PMIS_EVM_CPI_RED:0.85}
      spi-yellow: ${PMIS_EVM_SPI_YELLOW:0.95}
      spi-red: ${PMIS_EVM_SPI_RED:0.85}
    budget:
      yellow-pct: ${PMIS_BUDGET_YELLOW_PCT:80}
      red-pct: ${PMIS_BUDGET_RED_PCT:95}
  finance:
    rounding-mode: HALF_UP
    currency-default: CNY
    invoice-prefix: PMIS
  report:
    export-max-rows: 1000000
    async-export-enabled: true

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: pmis-tx-group
  enable-auto-data-source-proxy: true
  registry:
    type: nacos
    nacos:
      server-addr: ${NACOS_SERVER_ADDR}
      namespace: pmis
      group: SEATA_GROUP
  config:
    type: nacos
    nacos:
      server-addr: ${NACOS_SERVER_ADDR}
      namespace: pmis
      group: SEATA_GROUP
      data-id: seata-client.properties
  service:
    vgroup-mapping:
      pmis-tx-group: default
    grouplist:
      default: ${SEATA_SERVER_ADDR}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.pmis.execution.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${spring.profiles.active}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
      percentiles:
        http:
          server:
            requests: 0.5,0.75,0.9,0.95,0.99

logging:
  level:
    root: WARN
    com.njydsz.pmis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"
  file:
    name: /var/log/pmis/execution
