# ============================================================
# Nacos 配置：ydsz-pmis-execution-staging
# DataId  : ydsz-pmis-execution-staging.yaml
# Group   : PMIS_GROUP
# Namespace: pmis-staging
# 环境     : STAGING（预发环境）
# ============================================================

server:
  port: 9006
  compression:
    enabled: true
    level: BEST_SPEED
  servlet:
    context-path: /

spring:
  application:
    name: ydsz-pmis-execution
  profiles:
    active: staging
  main:
    web-application-type: servlet
    banner-mode: log
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_NULL
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE:pmis-staging}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
        fail-fast: true
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:pmis-staging}
        group: PMIS_GROUP
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        refresh-enabled: true
        fail-fast: true
        extension-configs:
          - dataId: pmis-common-staging.yaml
            group: PMIS_GROUP
            refresh: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?useUnicode=true&characterEncoding=utf8&currentSchema=public
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 40
      max-wait: 30000
      validation-query: SELECT 1
      filters: stat,wall,slf4j
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
  elasticsearch:
    uris: ${ES_URIS}
    connection-timeout: 3s
    socket-timeout: 20s
    username: ${ES_USERNAME}
    password: ${ES_PASSWORD}

pmis:
  execution:
    timesheet-lock-days: 5
    billable-rate-default: 1500.00
    evm:
      cpi-yellow: ${PMIS_EVM_CPI_YELLOW:0.95}
      cpi-red: ${PMIS_EVM_CPI_RED:0.85}
      spi-yellow: ${PMIS_EVM_SPI_YELLOW:0.95}
      spi-red: ${PMIS_EVM_SPI_RED:0.85}
    budget:
      yellow-pct: ${PMIS_BUDGET_YELLOW_PCT:80}
      red-pct: ${PMIS_BUDGET_RED_PCT:95}
  finance:
    rounding-mode: HALF_UP
    currency-default: CNY
    invoice-prefix: PMIS
  report:
    export-max-rows: 500000
    async-export-enabled: true

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: pmis-tx-group
  enable-auto-data-source-proxy: true
  registry:
    type: nacos
    nacos:
      server-addr: ${NACOS_SERVER_ADDR}
      namespace: pmis
      group: SEATA_GROUP
  config:
    type: nacos
    nacos:
      server-addr: ${NACOS_SERVER_ADDR}
      namespace: pmis
      group: SEATA_GROUP
      data-id: seata-client.properties
  service:
    vgroup-mapping:
      pmis-tx-group: default
    grouplist:
      default: ${SEATA_SERVER_ADDR}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.pmis.execution.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${spring.profiles.active}

logging:
  level:
    root: INFO
    com.njydsz.pmis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"
  file:
    name: /var/log/pmis/execution
