# ============================================================
# Nacos 配置：ydsz-pmis-user-dev
# DataId  : ydsz-pmis-user-dev.yaml
# Group   : PMIS_GROUP_DEV
# Namespace: pmis
# 环境     : DEV（本地开发联调）
# ============================================================

server:
  port: 9002
  compression:
    enabled: true
  servlet:
    context-path: /

spring:
  application:
    name: ydsz-pmis-user
  profiles:
    active: dev
  main:
    web-application-type: servlet
    banner-mode: console
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_NULL
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:pmis}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:pmis}
        group: dev
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        refresh-enabled: true
        extension-configs:
          - dataId: pmis-common-dev.yaml
            group: dev
            refresh: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?useUnicode=true&characterEncoding=utf8&currentSchema=public
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 10
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      filters: stat,slf4j
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:pmis@2026}
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
          max-wait: 5s
  cache:
    type: redis
    redis:
      time-to-live: 30m
      cache-null-values: false
      key-prefix: "pmis:user:"
      use-key-prefix: true

# PMIS 业务配置
pmis:
  password:
    min-length: 8
    complexity: MEDIUM
    expire-days: 0
    history-count: 0
  totp:
    enabled: true
    issuer: ${PMIS_TOTP_ISSUER:PMIS}
    digits: ${PMIS_TOTP_DIGITS:6}
    period: ${PMIS_TOTP_PERIOD:30}
  crypto:
    aes-key: ${PMIS_AES_KEY}
    aes-iv: ${PMIS_AES_IV}
    sm4-key: ${PMIS_SM4_KEY:}
  session:
    timeout-minutes: 60
    concurrent-limit: 5

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.pmis.user.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.njydsz.pmis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"
  file:
    name: /var/log/pmis/user
