# ============================================================
# Nacos 配置：ydsz-pmis-user-prod
# DataId  : ydsz-pmis-user-prod.yaml
# Group   : PMIS_GROUP_PROD
# Namespace: pmis
# 环境     : PROD（生产环境）
# 规范     : 互联网大厂标准 - 强密码策略 / 必开双因素 / 日志最小化
# ============================================================

server:
  port: 9002
  compression:
    enabled: true
    level: BEST_SPEED
  servlet:
    context-path: /

spring:
  application:
    name: ydsz-pmis-user
  profiles:
    active: prod
  main:
    web-application-type: servlet
    banner-mode: off
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_NULL
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE:pmis}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
        fail-fast: true
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:pmis}
        group: PMIS_GROUP_PROD
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        refresh-enabled: true
        fail-fast: true
        extension-configs:
          - dataId: pmis-common-prod.yaml
            group: PMIS_GROUP_PROD
            refresh: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?useUnicode=true&characterEncoding=utf8&currentSchema=public
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 20
      min-idle: 20
      max-active: 80
      max-wait: 30000
      validation-query: SELECT 1
      test-while-idle: true
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 2s
      lettuce:
        pool:
          max-active: 64
          max-idle: 32
          min-idle: 8
          max-wait: 2s
  cache:
    type: redis
    redis:
      time-to-live: 30m
      cache-null-values: false
      key-prefix: "pmis:user:"
      use-key-prefix: true

pmis:
  password:
    min-length: 12
    complexity: HIGH
    expire-days: 90
    history-count: 10
  totp:
    enabled: true
    issuer: ${PMIS_TOTP_ISSUER:PMIS}
    digits: ${PMIS_TOTP_DIGITS:6}
    period: ${PMIS_TOTP_PERIOD:30}
  crypto:
    aes-key: ${PMIS_AES_KEY}
    aes-iv: ${PMIS_AES_IV}
    sm4-key: ${PMIS_SM4_KEY}
  session:
    timeout-minutes: 30
    concurrent-limit: 2
    ip-binding: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.pmis.user.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${spring.profiles.active}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
      percentiles:
        http:
          server:
            requests: 0.5,0.75,0.9,0.95,0.99

logging:
  level:
    root: WARN
    com.njydsz.pmis: INFO
    org.springframework: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"
  file:
    name: /var/log/pmis/user
