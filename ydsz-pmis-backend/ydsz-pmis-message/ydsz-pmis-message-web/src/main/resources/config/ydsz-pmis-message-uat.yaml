# =====================================================================
#  YDSZ PMIS · Message · UAT 环境配置（Nacos DataId）
#  DataId:    ydsz-pmis-message-uat.yaml
#  Group:     uat
#  端口:      9004
# =====================================================================

server:
  port: 9004
  servlet:
    context-path: /

spring:
  profiles: uat
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_NULL
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USER:no-reply@example.com}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

pmis:
  message:
    channel-enabled:
      SMS: true
      EMAIL: true
      PUSH: true
      INAPP: true
      WEBHOOK: true
      DINGTALK: true
      WECOM: true
      FEISHU: true
    default-priority: NORMAL
    aggregate-scan-interval-ms: 60000
    retry-scan-interval-ms: 30000
    sms:
      provider: ${PMIS_SMS_PROVIDER:mock}
    push:
      provider: ${PMIS_PUSH_PROVIDER:mock}

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: pmis-message-producer-group
    send-message-timeout: 5000
  consumer:
    enabled: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.pmis.message.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

resilience4j:
  ratelimiter:
    instances:
      message-send:
        limit-for-period: 200
        limit-refresh-period: 1s
        timeout-duration: 0
      message-receipt:
        limit-for-period: 1000
        limit-refresh-period: 1s
        timeout-duration: 0

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: false
knife4j:
  production: true

logging:
  level:
    root: INFO
    "[com.njydsz.pmis]": INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
