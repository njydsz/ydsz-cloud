# =====================================================================
#  YDSZ PMIS · Message · SIT 环境配置（Nacos DataId）
#  DataId:    ydsz-pmis-message-sit.yaml
#  Group:     sit
#  端口:      9004
# =====================================================================

spring:
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USER:no-reply@example.com}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

# PMIS 消息引擎配置（SIT 环境使用 mock provider）
pmis:
  message:
    channel-enabled:
      SMS: true
      EMAIL: true
      PUSH: true
      INAPP: true
      WEBHOOK: true
      DINGTALK: true
      WECOM: true
      FEISHU: true
    default-priority: NORMAL
    aggregate-scan-interval-ms: 60000
    retry-scan-interval-ms: 30000
    sms:
      provider: ${PMIS_SMS_PROVIDER:mock}
    push:
      provider: ${PMIS_PUSH_PROVIDER:mock}

# RocketMQ
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: pmis-message-producer-group
    send-message-timeout: 5000
  consumer:
    enabled: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.pmis.message.entity

# Resilience4j 限流（共享配置提供 retry/circuitbreaker，此处仅保留 ratelimiter）
resilience4j:
  ratelimiter:
    instances:
      message-send:
        limit-for-period: 200
        limit-refresh-period: 1s
        timeout-duration: 0
      message-receipt:
        limit-for-period: 1000
        limit-refresh-period: 1s
        timeout-duration: 0

# SIT 环境关闭文档 UI
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: true
knife4j:
  production: true

# SIT 环境 PMIS 业务日志降为 INFO
logging:
  level:
    "[com.njydsz.pmis]": INFO
