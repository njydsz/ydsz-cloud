# ============================================================
# Nacos 配置：ydsz-pmis-message-prod
# DataId  : ydsz-pmis-message-prod.yaml
# Group   : PMIS_GROUP
# Namespace: pmis-prod
# 环境     : PROD（生产环境）
# ============================================================

server:
  port: 9011
  compression:
    enabled: true
    level: BEST_SPEED
  servlet:
    context-path: /

spring:
  application:
    name: ydsz-pmis-message
  profiles:
    active: prod
  main:
    web-application-type: servlet
    banner-mode: off
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_NULL
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE:pmis-prod}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
        fail-fast: true
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:pmis-prod}
        group: PMIS_GROUP
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        refresh-enabled: true
        fail-fast: true
        extension-configs:
          - dataId: pmis-common-prod.yaml
            group: PMIS_GROUP
            refresh: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?useUnicode=true&characterEncoding=utf8&currentSchema=public
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 20
      min-idle: 20
      max-active: 80
      max-wait: 30000
      validation-query: SELECT 1
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 2s
      lettuce:
        pool:
          max-active: 64
          max-idle: 32
          min-idle: 8
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USER}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

sms:
  provider: ${SMS_PROVIDER:aliyun}
  access-key: ${SMS_ACCESS_KEY}
  secret-key: ${SMS_SECRET_KEY}
  sign-name: ${SMS_SIGN_NAME:PMIS}
  template-id: ${SMS_TEMPLATE_ID}
  region: ${SMS_REGION:cn-hangzhou}
  endpoint: ${SMS_ENDPOINT:dysmsapi.aliyuncs.com}

pmis:
  message:
    enabled: true
    async: true
    queue-capacity: 30000
    consumer-threads: 16
    rate-limit-per-second: 1000
    template-cache-ttl: 3600
    retry-times: 5
    retry-interval: 500
    dead-letter-queue: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.pmis.message.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${spring.profiles.active}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
      percentiles:
        http:
          server:
            requests: 0.5,0.75,0.9,0.95,0.99

logging:
  level:
    root: WARN
    com.njydsz.pmis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"
  file:
    name: /var/log/pmis/message
