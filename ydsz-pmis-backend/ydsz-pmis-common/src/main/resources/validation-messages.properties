# ==========================================================================
# validation-messages.properties (默认/中文)
# 通用校验消息模板，供 MessageSource 加载与 GlobalExceptionHandler 使用
# ==========================================================================

# ---------- 非空校验 ----------
validation.notnull=不能为空
validation.notblank=不能为空
validation.notempty=不能为空

# ---------- 长度/大小校验 ----------
validation.size=长度必须在 {min} 和 {max} 之间
validation.length=长度必须在 {min} 和 {max} 之间
validation.range=取值必须在 {min} 和 {max} 之间

# ---------- 数值范围校验 ----------
validation.min=不能小于 {value}
validation.max=不能大于 {value}
validation.decimalmin=不能小于 {value}
validation.decimalmax=不能大于 {value}
validation.positive=必须为正数
validation.positiveorzero=必须为正数或零
validation.negative=必须为负数
validation.negativeorzero=必须为负数或零

# ---------- 格式校验 ----------
validation.pattern=格式不正确
validation.email=邮箱格式不正确
validation.regexp=格式不正确

# ---------- 布尔/断言校验 ----------
validation.asserttrue=必须为真
validation.assertfalse=必须为假

# ---------- 日期/时间校验 ----------
validation.past=必须是一个过去的日期
validation.pastorpresent=必须是一个过去或当前的日期
validation.future=必须是一个将来的日期
validation.futureorpresent=必须是一个将来或当前的日期

# ---------- 其他通用校验 ----------
validation.digits=数值超出范围或小数位超出限制
validation.creditscard=信用卡号不正确
validation.currency=货币不匹配
validation.duration=持续时间不合法
validation.ean=条码不正确
validation.iban=IBAN 账号不正确
validation.isbn=ISBN 号不正确
validation.mod10=校验失败
validation.mod11=校验失败
validation.scriptassert=脚本断言校验失败
validation.url=URL 格式不正确
validation.uuid=UUID 格式不正确
