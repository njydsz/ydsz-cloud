# =====================================================================
#  YDSZ PMIS · Nacos 共享配置模板 (ydsz-pmis-common.yaml)
#  --------------------------------------------------------------------
#  作用:   所有 7 个微服务都通过 spring.cloud.nacos.config.shared-configs
#          引用此 dataId，实现"一处修改全集群生效"
#
#  位置:   ydsz-pmis-common/src/main/resources/nacos-config/ydsz-pmis-common.yaml
#          保持和 common 模块同源，便于：
#            1. 业务变更时一处修改；
#            2. 单元测试 / 本地开发可复用相同配置；
#            3. 通过 deploy 脚本批量导入到 Nacos。
#
#  部署:   部署到 Nacos 控制台
#          DataId:    ydsz-pmis-common.yaml
#          Group:      dev / sit / uat / prod
#          配置格式:   YAML
#          导入脚本:   deploy/ubuntu/scripts/import-nacos-config.sh
#                      deploy/windows/scripts/import-nacos-config.bat
# =====================================================================

# ---------- 数据源（所有服务共用） ----------
# 安全说明: DB_PASSWORD 无默认值，必须通过环境变量/Nacos 配置注入
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?currentSchema=public&useUnicode=true&characterEncoding=utf8
    username: ${DB_USER:pmis}
    # ⚠️ 生产环境必须使用 Jasypt 加密：password: ENC(加密后的密码串)
    # 开发环境可使用明文/环境变量，生产通过 JASYPT_ENCRYPTOR_PASSWORD 环境变量注入主密码后自动解密
    password: ${DB_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: ${DRUID_STAT_ENABLED:false}
        url-pattern: /druid/*
        login-username: ${DRUID_STAT_USERNAME:}
        login-password: ${DRUID_STAT_PASSWORD:}
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 2000

  # ---------- 动态数据源（读写分离 P2-3） ----------
  dynamic:
    primary: master
    strict: true
    datasource:
      master:
        url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?currentSchema=public&useUnicode=true&characterEncoding=utf8
        username: ${DB_USER:pmis}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver
      slave:
        url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?currentSchema=public&useUnicode=true&characterEncoding=utf8
        username: ${DB_USER:pmis}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j

  # ---------- Redis（所有服务共用） ----------
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
          max-wait: 5s

  cache:
    type: redis

# ---------- MyBatis-Plus 共享配置 ----------
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------- Feign 超时与重试共享配置 ----------
feign:
  client:
    config:
      default:
        connect-timeout: 1000
        read-timeout: 3000
        logger-level: BASIC
      ydsz-pmis-project:
        read-timeout: 10000
      ydsz-pmis-agent:
        read-timeout: 30000
  compression:
    request:
      enabled: true
      mime-types: application/json
    response:
      enabled: true

spring.cloud.openfeign:
  circuitbreaker:
    enabled: true

# ---------- Resilience4j 重试配置 ----------
resilience4j:
  retry:
    instances:
      feignRetry:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        exponential-max-wait-duration: 2s
        retry-exceptions:
          - java.util.concurrent.TimeoutException
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - com.njydsz.pmis.common.exception.BizException
          - java.lang.IllegalArgumentException
      dbRetry:
        max-attempts: 2
        wait-duration: 100ms
        retry-exceptions:
          - org.springframework.dao.OptimisticLockingFailureException
  circuitbreaker:
    instances:
      default:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

# ---------- SpringDoc / OpenAPI 共享配置 ----------
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.njydsz.pmis
  default-flat-param-object: true

# ---------- Knife4j 增强 OpenAPI UI 共享配置 ----------
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-version: true
    enable-swagger-models: true
    document-url: https://doc.pmis.example.com
  production: ${knife4j.production:false}

# ---------- 日志共享配置 ----------
logging:
  level:
    root: ${LOG_ROOT_LEVEL:INFO}
    "[com.njydsz.pmis]": ${LOG_PMIS_LEVEL:DEBUG}
    "[org.springframework.cloud.gateway]": INFO
    "[com.alibaba.nacos]": WARN
    "[com.baomidou.mybatisplus]": INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"

# ---------- PMIS 业务密钥 ----------
pmis:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: pmis
  security:
    ip-whitelist: ""
    ip-whitelist-enabled: false
    ip-whitelist-skip-paths:
      - /health
      - /auth/login
  kms:
    provider: environment
    secrets:
      db.password: ${DB_PASSWORD:}
      redis.password: ${REDIS_PASSWORD:}
      jwt.secret: ${PMIS_JWT_SECRET:}
    vault:
      enabled: false

# ---------- Jasypt 配置加密 ----------
jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD:}
    algorithm: PBEWithHMACSHA512AndAES_256
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator
    property:
      prefix: "ENC("
      suffix: ")"
