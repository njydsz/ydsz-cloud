# ==========================================================================
# validation-messages_en_US.properties (English)
# Common validation message templates, loaded by MessageSource
# ==========================================================================

# ---------- Not-null / not-blank validation ----------
validation.notnull=must not be null
validation.notblank=must not be blank
validation.notempty=must not be empty

# ---------- Length / size validation ----------
validation.size=length must be between {min} and {max}
validation.length=length must be between {min} and {max}
validation.range=value must be between {min} and {max}

# ---------- Numeric range validation ----------
validation.min=must not be less than {value}
validation.max=must not be greater than {value}
validation.decimalmin=must not be less than {value}
validation.decimalmax=must not be greater than {value}
validation.positive=must be a positive number
validation.positiveorzero=must be a positive number or zero
validation.negative=must be a negative number
validation.negativeorzero=must be a negative number or zero

# ---------- Format validation ----------
validation.pattern=must match the expected format
validation.email=must be a valid email address
validation.regexp=must match the expected format

# ---------- Boolean / assertion validation ----------
validation.asserttrue=must be true
validation.assertfalse=must be false

# ---------- Date / time validation ----------
validation.past=must be a date in the past
validation.pastorpresent=must be a date in the past or present
validation.future=must be a date in the future
validation.futureorpresent=must be a date in the future or present

# ---------- Other common validation ----------
validation.digits=numeric value out of range or too many fractional digits
validation.creditscard=invalid credit card number
validation.currency=currency mismatch
validation.duration=invalid duration
validation.ean=invalid barcode
validation.iban=invalid IBAN account number
validation.isbn=invalid ISBN number
validation.mod10=check failed
validation.mod11=check failed
validation.scriptassert=script assertion failed
validation.url=must be a valid URL
validation.uuid=must be a valid UUID
