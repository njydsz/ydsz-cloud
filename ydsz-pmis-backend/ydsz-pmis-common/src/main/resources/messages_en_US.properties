# ==========================================================================
# messages_en_US.properties (English)
# Internationalization message resource file (English variant)
# key format: error.{ENUM_NAME} corresponds to BizErrorCode enum
# ==========================================================================

# ---------- Success ----------
error.OK=ok

# ---------- 1xxxx Generic errors ----------
error.BAD_REQUEST=Bad request
error.VALIDATION_FAILED=Parameter validation failed
error.MISSING_PARAMETER=Missing parameter
error.METHOD_NOT_ALLOWED=Request method not allowed
error.NOT_FOUND=Resource not found
error.DUPLICATE_KEY=Resource already exists
error.BIZ_ERROR=Business rule validation failed
error.INTERNAL_ERROR=Internal server error
error.SERVICE_UNAVAILABLE=Service unavailable
error.REQUEST_TIMEOUT=Request timeout
error.RATE_LIMIT=Request rate limit exceeded

# ---------- 2xxxx Authentication & Authorization ----------
error.UNAUTHORIZED=Not logged in
error.TOKEN_EXPIRED=Token has expired
error.TOKEN_INVALID=Token is invalid
error.FORBIDDEN=Access denied
error.DATA_SCOPE_FORBIDDEN=Insufficient data permission
error.PASSWORD_WEAK=Password does not meet strength requirements
error.PASSWORD_EXPIRED=Password has expired, please change it
error.PASSWORD_REUSED=Cannot reuse a recently used password
error.REAUTH_REQUIRED=This operation requires re-authentication
error.REAUTH_INVALID=Re-authentication token is invalid or expired
error.MFA_REQUIRED=Multi-factor authentication required
error.MFA_INVALID=Multi-factor authentication code is invalid
error.ACCOUNT_LOCKED=Account is locked
error.SESSION_KICKED=Account has logged in on another device

# ---------- 3xxxx User / Organization / Personnel ----------
error.USER_NOT_FOUND=User not found
error.PASSWORD_INCORRECT=Incorrect password
error.USER_DISABLED=User is disabled
error.USER_LOCKED=User is locked
error.USERNAME_DUPLICATE=Username already exists
error.DEPARTMENT_NOT_FOUND=Department not found
error.EMPLOYEE_NOT_FOUND=Employee not found

# ---------- 4xxxx Project / Contract / Opportunity ----------
error.PROJECT_NOT_FOUND=Project not found
error.PROJECT_STATUS_INVALID=Project status does not allow this operation
error.OPPORTUNITY_NOT_FOUND=Opportunity not found
error.CONTRACT_NOT_FOUND=Contract not found
error.CONTRACT_AMOUNT_EXCEED=Contract amount exceeds limit

# ---------- 5xxxx Finance / Cost / Revenue / Profit ----------
error.COST_OVERFLOW=Cost exceeds budget
error.INVOICE_EXCEED=Invoice amount exceeds limit
error.PAYMENT_NOT_FOUND=Payment record not found
error.PROFIT_NEGATIVE=Project profit is negative

# ---------- 6xxxx Resource / Timesheet / Scheduling ----------
error.RESOURCE_CONFLICT=Resource conflict
error.BENCH_OVER_LIMIT=Bench idle time exceeds limit
error.TIMESHEET_DUPLICATE=Duplicate timesheet entry
error.TIMESHEET_LOCKED=Timesheet is locked

# ---------- 7xxxx Workflow / Approval ----------
error.WORKFLOW_NOT_FOUND=Workflow not found
error.WORKFLOW_REJECT=Workflow rejected
error.WORKFLOW_NO_PERMISSION=No approval permission

# ---------- 8xxxx Report / Cockpit ----------
error.REPORT_GENERATE_FAILED=Report generation failed

# ---------- 9xxxx System ----------
error.UNKNOWN=Unknown error

# ---------- Common message templates (with placeholders) ----------
error.missing_parameter=Missing required parameter: {0}
error.unexpected=An unexpected error occurred, please try again later

# ---------- Authentication related (Gateway & global usage) ----------
error.auth.token_missing=Missing authentication token
error.auth.token_invalid=Token is invalid or expired
error.auth.token_expired=Token has expired, please log in again
error.auth.token_parse_failed=Failed to parse token
error.auth.not_access_token=Not an access token
