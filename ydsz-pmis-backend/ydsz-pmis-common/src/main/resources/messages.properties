# ==========================================================================
# messages.properties (默认/中文)
# 国际化消息资源文件
# key 格式: error.{ENUM_NAME} 对应 BizErrorCode 枚举
# ==========================================================================

# ---------- 成功 ----------
error.OK=ok

# ---------- 1xxxx 通用错误 ----------
error.BAD_REQUEST=请求参数错误
error.VALIDATION_FAILED=参数校验失败
error.MISSING_PARAMETER=缺少参数
error.METHOD_NOT_ALLOWED=请求方法不允许
error.NOT_FOUND=资源不存在
error.DUPLICATE_KEY=资源已存在
error.BIZ_ERROR=业务规则校验失败
error.INTERNAL_ERROR=系统内部错误
error.SERVICE_UNAVAILABLE=服务暂不可用
error.REQUEST_TIMEOUT=请求超时
error.RATE_LIMIT=请求频率超限

# ---------- 2xxxx 认证授权 ----------
error.UNAUTHORIZED=未登录
error.TOKEN_EXPIRED=Token 已过期
error.TOKEN_INVALID=Token 无效
error.FORBIDDEN=无权限访问
error.DATA_SCOPE_FORBIDDEN=数据权限不足
error.PASSWORD_WEAK=密码强度不足
error.PASSWORD_EXPIRED=密码已过期，请修改
error.PASSWORD_REUSED=不能使用最近使用过的密码
error.REAUTH_REQUIRED=该操作需要二次认证
error.REAUTH_INVALID=二次认证 token 无效或已过期
error.MFA_REQUIRED=需要双因素认证
error.MFA_INVALID=双因素认证码无效
error.ACCOUNT_LOCKED=账号已锁定
error.SESSION_KICKED=账号已在其他设备登录

# ---------- 3xxxx 用户/组织/人员 ----------
error.USER_NOT_FOUND=用户不存在
error.PASSWORD_INCORRECT=密码错误
error.USER_DISABLED=用户已停用
error.USER_LOCKED=用户已被锁定
error.USERNAME_DUPLICATE=用户名已存在
error.DEPARTMENT_NOT_FOUND=部门不存在
error.EMPLOYEE_NOT_FOUND=员工不存在

# ---------- 4xxxx 项目/合同/商机 ----------
error.PROJECT_NOT_FOUND=项目不存在
error.PROJECT_STATUS_INVALID=项目状态不允许该操作
error.OPPORTUNITY_NOT_FOUND=商机不存在
error.CONTRACT_NOT_FOUND=合同不存在
error.CONTRACT_AMOUNT_EXCEED=合同金额超限

# ---------- 5xxxx 财务/成本/收入/利润 ----------
error.COST_OVERFLOW=成本超预算
error.INVOICE_EXCEED=开票金额超限
error.PAYMENT_NOT_FOUND=回款记录不存在
error.PROFIT_NEGATIVE=项目利润为负

# ---------- 6xxxx 资源/工时/人员调度 ----------
error.RESOURCE_CONFLICT=资源冲突
error.BENCH_OVER_LIMIT=Bench 闲置超限
error.TIMESHEET_DUPLICATE=工时重复填报
error.TIMESHEET_LOCKED=工时已锁定

# ---------- 7xxxx 工作流/审批 ----------
error.WORKFLOW_NOT_FOUND=流程不存在
error.WORKFLOW_REJECT=流程被驳回
error.WORKFLOW_NO_PERMISSION=无审批权限

# ---------- 8xxxx 报表/驾驶舱 ----------
error.REPORT_GENERATE_FAILED=报表生成失败

# ---------- 9xxxx 系统 ----------
error.UNKNOWN=未知错误

# ---------- 通用消息模板（带占位符） ----------
error.missing_parameter=缺少必填参数: {0}
error.unexpected=系统发生异常，请稍后重试

# ---------- 认证相关（Gateway 及全局使用） ----------
error.auth.token_missing=缺少认证 Token
error.auth.token_invalid=Token 无效或已过期
error.auth.token_expired=Token 已失效,请重新登录
error.auth.token_parse_failed=Token 解析失败
error.auth.not_access_token=非访问 Token
