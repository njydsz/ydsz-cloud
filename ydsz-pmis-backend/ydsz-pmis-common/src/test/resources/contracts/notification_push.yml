# Spring Cloud Contract 契约定义（P3-16 落地）
#
# 定义 NotificationClient.pushRealtime 接口的契约。
# 验证 WebSocket 实时推送接口的请求/响应格式。

name: "notification push realtime contract"
description: "实时推送接口契约 — 验证 /notifications/push 的请求/响应格式"

request:
  method: POST
  url: /notifications/push?userId=user001&type=TASK_ASSIGNED
  body:
    title: "新任务"
    content: "您有新的审批任务"
    taskId: "task_12345"
  headers:
    Content-Type: application/json

response:
  status: 200
  body:
    code: 200
    message: "success"
    data:
      pushed: true
      channel: "websocket"
  headers:
    Content-Type: application/json
  matchers:
    body:
      - path: $.code
        type: by_equality
      - path: $.data.pushed
        type: by_equality
