# =============================================================================
# Sentry 配置 (批次 20 P2-1)
# 默认禁用, 需要在具体环境配置中开启并填入 DSN
# =============================================================================

pmis:
  sentry:
    # 总开关: 是否启用 Sentry 错误监控
    enabled: false
    # Sentry DSN (https://key@sentry.io/123)
    dsn: ""
    # 部署环境
    environment: dev
    # 发布版本 (CI_COMMIT_SHORT_SHA)
    release: 1.0.0.0
    # 性能采样率 0-1 (10% 性能事件, 100% 错误)
    traces-sample-rate: 0.1
    sample-rate: 1.0
