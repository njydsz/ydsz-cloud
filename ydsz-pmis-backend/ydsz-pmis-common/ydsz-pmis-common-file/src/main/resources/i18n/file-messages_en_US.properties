# File Storage Module - English i18n Resource
# Following ydsz-pmis-common-exception ExceptionCode i18n specification
# Format: message key = English message text (supports {0} {1} placeholder parameters)

# ========== F01 File Operation Errors ==========
file.empty = Uploaded file cannot be empty
file.suffix.not.allowed = File suffix [{0}] is not in the allowed list
file.size.exceeded = File size [{0}] exceeds the maximum limit of {1} bytes
file.name.invalid = Invalid file name, cannot contain illegal characters or be empty
file.upload.failed = File upload failed: {0}
file.delete.failed = File deletion failed: {0}
file.download.failed = File download failed: {0}
file.not.found = File not found: {0}
file.path.illegal = Illegal file path
file.path.empty = File path cannot be empty

# ========== F02 Bucket Errors ==========
bucket.create.failed = Failed to create storage bucket: {0}
bucket.not.found = Storage bucket not found: {0}

# ========== F03 Folder Errors ==========
folder.create.failed = Failed to create folder: {0}
folder.not.found = Folder not found: {0}

# ========== F04 Configuration Errors ==========
storage.config.invalid = Invalid storage configuration: {0}
storage.client.build.failed = Failed to build storage client: {0}

# ========== F05 Private URL Errors ==========
private.url.generate.failed = Failed to generate private signed URL: {0}
private.url.domain.not.configured = Access domain not configured, unable to generate private URL

# ========== F06 Range Download Errors ==========
range.download.not.supported = Current storage type does not support range download requests

# ========== F07 Chunked Upload Errors ==========
multipart.upload.failed = Chunked upload failed: {0}
multipart.upload.init.failed = Chunked upload initialization failed: {0}
multipart.upload.complete.failed = Chunked upload completion failed: {0}

# ========== General Errors ==========
unknown.error = Unknown error: {0}
