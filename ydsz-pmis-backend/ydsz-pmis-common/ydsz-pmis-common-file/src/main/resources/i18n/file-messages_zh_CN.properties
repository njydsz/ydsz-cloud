# 文件存储模块 - 中文国际化资源
# 遵循 ydsz-pmis-common-exception 的 ExceptionCode i18n 规范
# 格式：消息键 = 中文消息文本（支持 {0} {1} 占位符参数）

# ========== F01 文件操作错误 ==========
file.empty = 上传文件不能为空
file.suffix.not.allowed = 文件后缀 [{0}] 不在允许列表中
file.size.exceeded = 文件大小 [{0}] 超出最大限制 {1} 字节
file.name.invalid = 文件名无效，不能包含非法字符或为空
file.upload.failed = 文件上传失败：{0}
file.delete.failed = 文件删除失败：{0}
file.download.failed = 文件下载失败：{0}
file.not.found = 文件不存在：{0}
file.path.illegal = 文件路径非法
file.path.empty = 文件路径不能为空

# ========== F02 存储桶错误 ==========
bucket.create.failed = 创建存储桶失败：{0}
bucket.not.found = 存储桶不存在：{0}

# ========== F03 目录错误 ==========
folder.create.failed = 创建目录失败：{0}
folder.not.found = 目录不存在：{0}

# ========== F04 配置错误 ==========
storage.config.invalid = 存储配置无效：{0}
storage.client.build.failed = 构建存储客户端失败：{0}

# ========== F05 私有链接错误 ==========
private.url.generate.failed = 生成私有签名URL失败：{0}
private.url.domain.not.configured = 未配置访问域名，无法生成私有链接

# ========== F06 范围下载错误 ==========
range.download.not.supported = 当前存储类型不支持范围下载请求

# ========== F07 分片上传错误 ==========
multipart.upload.failed = 分片上传失败：{0}
multipart.upload.init.failed = 分片上传初始化失败：{0}
multipart.upload.complete.failed = 分片上传合并失败：{0}

# ========== 通用错误 ==========
unknown.error = 未知错误：{0}
