# =====================================================================
#  PMIS 工作流服务配置
#  --------------------------------------------------------------------
#  端口：9004
#  职责：自研轻量流程引擎
#    - 流程定义（PMIS-Flow XML / JSON）
#    - 流程发起 / 审批 / 驳回 / 加签 / 减签 / 转交
#    - 抄送 / 委托 / 代理 / 跳过规则
#    - 定时器 / 事件订阅 / SLA 提醒
#    - 流程审计 / 流程归档 / 灰度发布（canary）
#  依赖：Nacos、PostgreSQL、Redis
# =====================================================================

server:
  port: 9004
  servlet:
    context-path: /

spring:
  application:
    name: ydsz-pmis-workflow
  profiles:
    active: dev
  main:
    web-application-type: servlet
  # ---------- Jackson 序列化 ----------
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_NULL
  # ---------- 文件上传（流程附件）----------
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        file-extension: yml
        group: ${spring.profiles.active}
        namespace: ${NACOS_NAMESPACE:pmis}
        refresh-enabled: true
  # ---------- 数据源 ----------
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?currentSchema=public
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  # ---------- Redis ----------
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2  # 保持 2 个空闲连接（流程回调突发）

# ---------- MyBatis-Plus ----------
mybatis-plus:
  # mapper 文件位置：包含根 mapper/ 和子目录 mapper/flow/
  mapper-locations: classpath*:mapper/**/*.xml,classpath*:mapper/flow/**/*.xml
  type-aliases-package: com.njydsz.pmis.workflow.entity,com.njydsz.pmis.workflow.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------- Actuator 监控 ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always  # 流程服务需要详细健康信息（依赖 Nacos / DB / Redis）

# ---------- SpringDoc / Swagger ----------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ---------- 日志 ----------
logging:
  level:
    root: INFO
    com.njydsz.pmis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"
