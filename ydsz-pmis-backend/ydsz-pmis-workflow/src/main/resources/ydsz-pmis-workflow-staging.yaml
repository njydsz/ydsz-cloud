# ============================================================
# Nacos 配置：ydsz-pmis-workflow-staging
# DataId  : ydsz-pmis-workflow-staging.yaml
# Group   : PMIS_GROUP
# Namespace: pmis-staging
# 环境     : STAGING（预发环境）
# ============================================================

server:
  port: 9014
  compression:
    enabled: true
    level: BEST_SPEED
  servlet:
    context-path: /
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

spring:
  application:
    name: ydsz-pmis-workflow
  profiles:
    active: staging
  main:
    web-application-type: servlet
    banner-mode: log
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_NULL
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE:pmis-staging}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
        fail-fast: true
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:pmis-staging}
        group: PMIS_GROUP
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        refresh-enabled: true
        fail-fast: true
        extension-configs:
          - dataId: pmis-common-staging.yaml
            group: PMIS_GROUP
            refresh: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?useUnicode=true&characterEncoding=utf8&currentSchema=public
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 40
      max-wait: 30000
      validation-query: SELECT 1
      filters: stat,wall,slf4j
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4

pmis:
  flow:
    enabled: true
    archive-days: 1095
    timer-scan-interval: 30
    delegate-max-depth: 5
    cc-max-receivers: 100
    sla:
      reminder-enabled: true
      default-reminder-hours: 24
      escalation-hours: 48
    canary:
      enabled: true
      ratio: 0.05
      whitelist-users: "admin,pm_admin"
  bpmn:
    history-level: AUDIT
    async-executor:
      core-pool-size: 16
      max-pool-size: 64
      queue-capacity: 1000

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml,classpath*:mapper/flow/**/*.xml
  type-aliases-package: com.njydsz.pmis.workflow.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${spring.profiles.active}

logging:
  level:
    root: INFO
    com.njydsz.pmis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"
  file:
    name: /var/log/pmis/workflow
