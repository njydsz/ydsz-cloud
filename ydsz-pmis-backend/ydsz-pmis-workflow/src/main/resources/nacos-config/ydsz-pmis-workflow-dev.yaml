# =====================================================================
#  YDSZ PMIS · Workflow · DEV 环境配置（Nacos DataId）
#  DataId:    ydsz-pmis-workflow-dev.yaml
#  Group:     dev
#  端口:      9006
# =====================================================================

server:
  port: 9006
  servlet:
    context-path: /

spring:
  profiles: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_NULL
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml,classpath*:mapper/flow/**/*.xml
  type-aliases-package: com.njydsz.pmis.workflow.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    "[com.njydsz.pmis]": DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: always
