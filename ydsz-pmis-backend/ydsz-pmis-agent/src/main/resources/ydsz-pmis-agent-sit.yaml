# ============================================================
# Nacos 配置：ydsz-pmis-agent-sit
# DataId  : ydsz-pmis-agent-sit.yaml
# Group   : PMIS_GROUP_SIT
# Namespace: pmis
# 环境     : SIT（系统集成测试，启用 dashscope 真实 LLM）
# ============================================================

server:
  port: 9007
  compression:
    enabled: true
  servlet:
    context-path: /

spring:
  application:
    name: ydsz-pmis-agent
  profiles:
    active: sit
  main:
    web-application-type: servlet
    banner-mode: log
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_NULL
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE:pmis}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:pmis}
        group: SIT
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        refresh-enabled: true
        extension-configs:
          - dataId: pmis-common-sit.yaml
            group: SIT
            refresh: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?useUnicode=true&characterEncoding=utf8&currentSchema=public
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      filters: stat,wall,slf4j
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

spring.ai:
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    chat:
      options:
        model: ${OPENAI_MODEL:gpt-4o-mini}
        temperature: 0.3
  dashscope:
    api-key: ${DASHSCOPE_API_KEY}
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
    chat:
      options:
        model: ${DASHSCOPE_MODEL:qwen-plus}
        temperature: 0.3

pmis:
  agent:
    enabled: true
    llm:
      provider: ${LLM_PROVIDER:dashscope}
      timeout-millis: ${LLM_TIMEOUT_MILLIS:30000}
      max-retries: ${LLM_MAX_RETRIES:3}
      fallback-to-mock: ${LLM_FALLBACK_TO_MOCK:true}
    prompt:
      max-tokens: 4096
      temperature: 0.3
      top-p: 0.9
    rag:
      enabled: true
      top-k: 5
    orchestration:
      max-steps: 10
      timeout-seconds: 60

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.pmis.agent.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${spring.profiles.active}

logging:
  level:
    root: INFO
    com.njydsz.pmis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"
  file:
    name: /var/log/pmis/agent
