# =====================================================================
#  YDSZ PMIS · Agent · UAT 环境配置（Nacos DataId）
#  DataId:    ydsz-pmis-agent-uat.yaml
#  Group:     uat
#  端口:      9007
# =====================================================================

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.pmis.agent.entity

# AI 集成配置（UAT 环境使用 mock provider）
pmis:
  agent:
    llm:
      provider: ${LLM_PROVIDER:mock}
      timeout-millis: 10000
      max-retries: 2
      fallback-to-mock: true

# UAT 环境关闭文档 UI
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: true
knife4j:
  production: true

# UAT 环境 PMIS 业务日志降为 INFO
logging:
  level:
    "[com.njydsz.pmis]": INFO
