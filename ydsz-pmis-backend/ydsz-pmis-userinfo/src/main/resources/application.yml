# =====================================================================
#  PMIS 用户信息中心服务（User Info Center）配置
#  --------------------------------------------------------------------
#  端口：9002
#  职责：用户、角色、权限（RBAC）、登录认证、2FA、会话、考勤、请假
#        资源池、员工标签、加班、外包台账等
#  依赖：Nacos 注册/配置中心、PostgreSQL、Redis
#  共享配置：pmis-common-shared.yaml（datasource/redis/mybatis-plus/logging）
# =====================================================================

server:
  port: 9002  # HTTP 监听端口（与 gateway 鉴权、feign 调用）

spring:
  application:
    name: ydsz-pmis-userinfo  # Nacos 注册的服务名
  profiles:
    active: dev  # 激活 dev / sit / uat / prod profile
  cloud:
    nacos:
      # 服务注册
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:pmis}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
      # 配置中心（路由规则、限流阈值等动态配置）
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:pmis}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        group: ${spring.profiles.active}
        refresh-enabled: true
        file-extension: yaml
        # 引入共享配置：datasource / redis / mybatis-plus / springdoc / logging
        # 避免每个微服务重复定义，修改一次全集群生效
        shared-configs:
          - data-id: ydsz-pmis-common.yaml
            group: ${spring.profiles.active}
            refresh: true
  # ---------- 数据源 ----------
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?useUnicode=true&characterEncoding=utf8
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    type: com.alibaba.druid.pool.DruidDataSource  # 阿里 Druid 连接池（含 SQL 监控）
  # ---------- Redis ----------
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  # ---------- Spring Cache ----------
  # 由 Redisson Spring Boot Starter 自动装配 RedisCacheManager
  # 适用于：字典缓存、权限缓存、用户信息缓存（30 分钟 TTL）
  cache:
    type: redis
    redis:
      time-to-live: 30m          # 默认 30 分钟过期
      cache-null-values: false   # 不缓存 null，防止缓存击穿但允许正常 null
      key-prefix: pmis:          # Redis key 前缀，便于集群环境区分
      use-key-prefix: true

# ---------- MyBatis-Plus ----------
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true  # 数据库下划线 → 驼峰字段自动映射
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl  # SQL 走 Slf4j 输出
  global-config:
    db-config:
      # 逻辑删除：deleted=0 未删 / deleted=1 已删
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: AUTO  # 主键策略：数据库自增 BIGSERIAL
  mapper-locations: classpath*:mapper/**/*.xml  # XML 映射文件位置

# ---------- SpringDoc / Swagger ----------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ---------- PMIS 自定义业务配置 ----------
pmis:
  jwt:
    secret: ${JWT_SECRET}     # JWT 签名密钥（生产 ≥ 32 字节，从 Vault 注入）
    issuer: pmis              # JWT 签发者
  auth:
    captcha-required: ${CAPTCHA_REQUIRED:true}  # 登录是否强制图形验证码

# ---------- 日志配置 ----------
logging:
  level:
    root: INFO                            # 全局默认 INFO
    com.njydsz.pmis: DEBUG                # 业务代码 DEBUG（看 SQL 必开）
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"
    # 格式：时间 级别 [traceId] 线程 logger - 消息
    # traceId 来自 Micrometer/Sleuth，自动串联分布式调用链

# =====================================================================
# Actuator 健康检查
# =====================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: when-authorized
