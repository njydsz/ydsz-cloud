# =====================================================================
#  YDSZ PMIS · UserInfo · DEV 环境配置（Nacos DataId）
#  --------------------------------------------------------------------
#  DataId:    ydsz-pmis-userinfo-dev.yaml
#  Group:     dev
#  端口:      9001
# =====================================================================

server:
  port: 9001
  servlet:
    context-path: /
  max-http-request-header-size: 16KB

spring:
  profiles: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_NULL

# PMIS 业务配置
pmis:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: pmis
  auth:
    captcha-required: ${CAPTCHA_REQUIRED:true}

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: AUTO

# SpringDoc
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# 日志
logging:
  level:
    root: INFO
    com.njydsz.pmis: DEBUG

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: when-authorized
