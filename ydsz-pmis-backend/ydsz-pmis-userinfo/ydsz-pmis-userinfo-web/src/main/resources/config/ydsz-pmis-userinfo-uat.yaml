# =====================================================================
#  YDSZ PMIS · UserInfo · UAT 环境配置（Nacos DataId）
#  DataId:    ydsz-pmis-userinfo-uat.yaml
#  Group:     uat
#  端口:      9001
# =====================================================================

# PMIS 业务配置（jwt 已在共享配置 ydsz-pmis-common.yaml 提供）
pmis:
  auth:
    captcha-required: true

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml

# UAT 环境关闭文档 UI
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: true
knife4j:
  production: true

# UAT 环境 PMIS 业务日志降为 INFO
logging:
  level:
    "[com.njydsz.pmis]": INFO
