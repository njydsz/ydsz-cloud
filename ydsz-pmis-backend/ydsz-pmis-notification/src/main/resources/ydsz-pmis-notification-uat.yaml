# ============================================================
# Nacos 配置：ydsz-pmis-notification-uat
# DataId  : ydsz-pmis-notification-uat.yaml
# Group   : PMIS_GROUP
# Namespace: pmis-uat
# 环境     : UAT（用户验收测试 / 生产仿真）
# ============================================================

server:
  port: 9003
  compression:
    enabled: true
  servlet:
    context-path: /

spring:
  application:
    name: ydsz-pmis-notification
  profiles:
    active: uat
  main:
    web-application-type: servlet
    banner-mode: log
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_NULL
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE:pmis-uat}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:pmis-uat}
        group: PMIS_GROUP
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        refresh-enabled: true
        extension-configs:
          - dataId: pmis-common-uat.yaml
            group: PMIS_GROUP
            refresh: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?useUnicode=true&characterEncoding=utf8&currentSchema=public
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      filters: stat,wall,slf4j
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 24
          max-idle: 12
          min-idle: 4
  rocketmq:
    name-server: ${ROCKETMQ_NAMESRV}
    producer:
      group: pmis-notification-prod
      send-message-timeout: 10000
      retry-times-when-send-failed: 3
      retry-times-when-send-async-failed: 3
      max-message-size: 4194304
    consumer:
      group: pmis-notification-consumers

pmis:
  notification:
    channels:
      in-site: true
      email: true
      sms: true
      im: false
    email:
      host: ${MAIL_SMTP_HOST}
      port: ${MAIL_SMTP_PORT:465}
      username: ${MAIL_USERNAME}
      password: ${MAIL_PASSWORD}
      ssl-enabled: true
      from: ${MAIL_FROM:noreply@pmis.example.com}
    sms:
      provider: ${SMS_PROVIDER:aliyun}
      access-key: ${SMS_ACCESS_KEY}
      secret-key: ${SMS_SECRET_KEY}
      sign-name: ${SMS_SIGN_NAME:PMIS}
      template-code: ${SMS_TEMPLATE_CODE}
    retry:
      max-attempts: 5
      backoff-seconds: 60
    retention-days: 180

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.pmis.notification.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${spring.profiles.active}

logging:
  level:
    root: INFO
    com.njydsz.pmis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n"
  file:
    name: /var/log/pmis/notification
