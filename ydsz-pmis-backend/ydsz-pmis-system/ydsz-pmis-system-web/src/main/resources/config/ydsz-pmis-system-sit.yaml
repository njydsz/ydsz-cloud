# =====================================================================
#  YDSZ PMIS · System · SIT 环境配置（Nacos DataId）
#  DataId:    ydsz-pmis-system-sit.yaml
#  Group:     sit
#  端口:      9002
# =====================================================================

spring:
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 500MB

# MinIO 对象存储（SIT 环境密钥由环境变量注入）
minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9100}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  default-bucket: ${MINIO_BUCKET:pmis}
  url-expire-seconds: 3600

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.pmis.system.entity

# SIT 环境关闭文档 UI
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: true
knife4j:
  production: true

# SIT 环境 PMIS 业务日志降为 INFO
logging:
  level:
    "[com.njydsz.pmis]": INFO
