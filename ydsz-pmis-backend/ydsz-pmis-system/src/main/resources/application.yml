# =====================================================================
#  PMIS 系统服务（file + config + audit）配置
#  --------------------------------------------------------------------
#  端口：9002（按构建顺序 3/7）
#  职责：
#    - 文件管理（MinIO 对象存储）
#    - 系统配置（参数/字典/数据导出审计）
#    - 审计日志（登录审计 / 操作日志 / 数据导出审计）
#  依赖：Nacos、PostgreSQL、Redis、MinIO
#  消息通知/模板/通道已迁移至 ydsz-pmis-message 模块（端口 9004）
# =====================================================================

server:
  port: 9002
  servlet:
    context-path: /

spring:
  application:
    name: ydsz-pmis-system
  profiles:
    active: dev
  main:
    web-application-type: servlet
  # ---------- Jackson 序列化 ----------
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss          # 统一时间格式
    time-zone: GMT+8                          # 中国时区
    default-property-inclusion: NON_NULL      # 不序列化 null 字段（节省带宽）
  # ---------- 文件上传 ----------
  servlet:
    multipart:
      max-file-size: 200MB       # 单文件最大 200MB
      max-request-size: 500MB    # 整个请求最大 500MB
  cloud:
    nacos:
      # 服务注册
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:pmis}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
      # 配置中心（路由规则、限流阈值等动态配置）
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:pmis}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        group: ${spring.profiles.active}
        refresh-enabled: true
        file-extension: yaml
        # 引入共享配置：datasource / redis / mybatis-plus / springdoc / logging
        # 避免每个微服务重复定义，修改一次全集群生效
        shared-configs:
          - data-id: ydsz-pmis-common.yaml
            group: ${spring.profiles.active}
            refresh: true
  # ---------- 数据源 ----------
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?currentSchema=public
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  # ---------- Redis ----------
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 5s

# ---------- MinIO 对象存储（原 file 模块） ----------
minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9100}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  default-bucket: ${MINIO_BUCKET:pmis}
  url-expire-seconds: 3600  # 预签名 URL 1 小时过期

# ---------- MyBatis-Plus ----------
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.pmis.system.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false  # 关闭二级缓存（Redis 接管）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------- Actuator 监控 ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus  # 暴露 Prometheus 指标
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

# ---------- SpringDoc / Swagger ----------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ---------- 日志 ----------
logging:
  level:
    root: INFO
    "[com.njydsz.pmis]": DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"
