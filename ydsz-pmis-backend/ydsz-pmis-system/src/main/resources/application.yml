# =====================================================================
#  PMIS 系统服务（file + config + audit + notification + message 合并）配置
#  --------------------------------------------------------------------
#  端口：9008
#  职责：
#    - 文件管理（MinIO 对象存储）
#    - 系统配置（参数/字典/数据导出审计）
#    - 审计日志（登录审计 / 操作日志 / 数据导出审计）
#    - 消息通知（站内信 / 邮件 / WebSocket / RocketMQ）
#    - 消息模板（多通道渲染）
#  依赖：Nacos、PostgreSQL、Redis、MinIO、RocketMQ、Mail（SMTP）
# =====================================================================

server:
  port: 9008
  servlet:
    context-path: /

spring:
  application:
    name: ydsz-pmis-system
  profiles:
    active: dev
  main:
    web-application-type: servlet
  # ---------- Jackson 序列化 ----------
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss          # 统一时间格式
    time-zone: GMT+8                          # 中国时区
    default-property-inclusion: NON_NULL      # 不序列化 null 字段（节省带宽）
  # ---------- 文件上传 ----------
  servlet:
    multipart:
      max-file-size: 200MB       # 单文件最大 200MB
      max-request-size: 500MB    # 整个请求最大 500MB
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:pmis}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        file-extension: yaml
        group: ${spring.profiles.active}
        namespace: ${NACOS_NAMESPACE:pmis}
        refresh-enabled: true  # 启用配置热刷新
  # ---------- 数据源 ----------
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?currentSchema=public
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  # ---------- Redis ----------
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 5s
  # ---------- 邮件（SMTP）----------
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:465}            # SSL 端口
    username: ${MAIL_USER:no-reply@example.com}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          ssl:
            enable: true              # 启用 SSL
          auth: true                  # 需认证
          starttls:
            enable: true              # 启用 STARTTLS
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

# ---------- MinIO 对象存储（原 file 模块） ----------
minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9100}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  default-bucket: ${MINIO_BUCKET:pmis}
  url-expire-seconds: 3600  # 预签名 URL 1 小时过期

# ---------- RocketMQ（原 message 模块）----------
# 消息分类：
#   - 通知消息（站内信、邮件、企微推送）
#   - 业务事件（项目状态变更、审批结果、预警触发）
#   - 审计消息（登录、敏感操作、导出）
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:pmis-producer-group}
    send-message-timeout: 5000   # 发送超时 5s
  consumer:
    enabled: ${ROCKETMQ_CONSUMER_ENABLED:true}

# ---------- MyBatis-Plus ----------
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.pmis.system.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false  # 关闭二级缓存（Redis 接管）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------- Actuator 监控 ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus  # 暴露 Prometheus 指标

# ---------- SpringDoc / Swagger ----------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ---------- 日志 ----------
logging:
  level:
    root: INFO
    "[com.njydsz.pmis]": DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"
