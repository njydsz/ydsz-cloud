# =====================================================================
#  YDSZ PMIS · CronJob · SIT 环境配置（Nacos DataId）
#  DataId:    ydsz-pmis-cronjob-sit.yaml
#  Group:     sit
#  端口:      9005
# =====================================================================

server:
  port: 9005
  servlet:
    context-path: /

spring:
  profiles: sit

minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9100}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  default-bucket: ${MINIO_BUCKET:pmis}
  url-expire-seconds: 3600

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.pmis.cronjob.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

pmis:
  cronjob:
    node-discovery:
      type: nacos
    failover:
      enabled: true
      scan-interval-seconds: 30
    leader:
      enabled: true
      role: pmis-job-scheduler
    scanner:
      interval-ms: 5000
      batch-size: 100
    executor:
      register-on-startup: true
      heartbeat-interval-seconds: 10
      max-concurrent: 16

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: false
knife4j:
  production: true

logging:
  level:
    root: INFO
    com.njydsz.pmis: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: when-authorized
