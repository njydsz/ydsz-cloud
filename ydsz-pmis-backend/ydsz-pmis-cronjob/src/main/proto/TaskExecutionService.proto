syntax = "proto3";

package com.njydsz.pmis.cronjob.grpc;

option java_multiple_files = true;
option java_package = "com.njydsz.pmis.cronjob.grpc";
option java_outer_classname = "TaskExecutionProto";

// P1-6: gRPC 远程任务执行服务
// Leader 节点通过 gRPC 将任务派发到 Worker 节点执行
service TaskExecutionService {

  // 派发任务到 Worker 节点执行
  rpc ExecuteTask(TaskExecutionRequest) returns (TaskExecutionResponse);

  // 派发 MapReduce 子任务到 Worker 节点执行
  rpc ExecuteSubTask(SubTaskExecutionRequest) returns (SubTaskExecutionResponse);
}

// 任务执行请求
message TaskExecutionRequest {
  string job_id = 1;
  string job_key = 2;
  string job_name = 3;
  string job_group = 4;
  string handler = 5;
  string params_json = 6;
  string trigger_type = 7;
  int32 shard_index = 8;
  int32 shard_total = 9;
  string trace_id = 10;
  string tenant_id = 11;
  int32 priority = 12;
  string cluster = 13;
}

// 任务执行响应
message TaskExecutionResponse {
  // 0=成功，非0=失败
  int32 code = 1;
  string log_id = 2;
  string message = 3;
}

// MapReduce 子任务执行请求
message SubTaskExecutionRequest {
  string job_id = 1;
  string log_id = 2;
  string job_key = 3;
  string handler = 4;
  string task_name = 5;
  string task_params = 6;
  string trace_id = 7;
}

// MapReduce 子任务执行响应
message SubTaskExecutionResponse {
  // 0=成功，非0=失败
  int32 code = 1;
  bool success = 2;
  string result_json = 3;
  string error_message = 4;
  string message = 5;
}
