# =====================================================================
#  PMIS 调度服务（ydsz-pmis-cronjob）配置
#  --------------------------------------------------------------------
#  端口：9004
#  职责：自研分布式任务调度引擎（Leader 选举 + DB 行锁 + Redis 分布式锁）
#    - 报表定时生成（每日报表、订阅推送）
#    - 成本/收入/工时/利润/开票/回款 月度自动对账
#    - 预警重试补偿、巡检、SLA 计算
#    - 流程超时扫描、归档
#  依赖：Nacos、PostgreSQL、Redis、MinIO
# =====================================================================

# HTTP 监听端口（提供 actuator / 业务接口）
server:
  port: 9004

spring:
  # Nacos 注册的服务名
  application:
    name: ydsz-pmis-cronjob
  # 激活 dev / sit / uat / prod profile
  profiles:
    active: dev
  main:
    web-application-type: servlet
  cloud:
    nacos:
      # 服务注册
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:pmis}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
      # 配置中心（路由规则、限流阈值等动态配置）
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:pmis}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        group: ${spring.profiles.active}
        refresh-enabled: true
        file-extension: yaml
        # 引入共享配置：datasource / redis / mybatis-plus / springdoc / logging
        # 避免每个微服务重复定义，修改一次全集群生效
        shared-configs:
          - data-id: ydsz-pmis-common.yaml
            group: ${spring.profiles.active}
            refresh: true

  # ---------- 数据源 ----------
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:ydsz-pmis}?currentSchema=public
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}

  # ---------- Redis ----------
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DB:0}
      timeout: 3s              # 调度任务响应要快
      lettuce:
        pool:
          max-active: 8        # 调度场景并发不高
          max-idle: 4
          min-idle: 1          # 至少保留 1 个空闲连接

# ---------- MinIO 对象存储（报表文件上传） ----------
minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9100}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  default-bucket: ${MINIO_BUCKET:pmis}
  url-expire-seconds: 3600

# ---------- MyBatis-Plus ----------
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.njydsz.pmis.cronjob.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------- 日志 ----------
logging:
  level:
    root: INFO
    com.njydsz.pmis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"

# =====================================================================
# Actuator 监控
# =====================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: when-authorized

# =====================================================================
# 调度服务自研配置（P0-3 / P0-4）
# ---------------------------------------------------------------------
# - 锁 TTL 全局默认值 / 任务级上下限（防误配置）
# - 调度器线程池与优雅关闭
# =====================================================================
pmis:
  cronjob:
    # -----------------------------------------------------------------
    # P1-1: 节点发现策略配置
    # -----------------------------------------------------------------
    # nacos(Nacos服务发现, 默认) / db(心跳表)
    # - nacos: 复用 Nacos 注册能力，无需维护 pmis_job_node 心跳表
    # - db:    基于 pmis_job_node 心跳表（向后兼容，需配合 JobNodeHeartbeat + JobNodeReaper）
    node-discovery:
      type: nacos
    # -----------------------------------------------------------------
    # P1-4: 失败自动转移（FailoverScanner）配置
    # -----------------------------------------------------------------
    # 执行器节点宕机后，Leader 节点定时扫描该节点上 RUNNING 状态的任务日志，
    # 标记为 FAILED 后以 triggerType=FAILOVER 重新派发任务。
    failover:
      # 是否启用故障转移扫描
      enabled: true
      # 扫描间隔（秒）
      scan-interval-seconds: 30
      # 单批最多扫描节点数
      scan-node-limit: 10
      # 单节点最多转移任务数
      failover-task-limit: 50
    # 全局分布式锁 TTL（任务级未配置 lock_ttl_ms 时使用）
    job-lock-ttl: 5m
    # 任务级 TTL 上下限：防止误配置为过短(< 30s)或过长(> 24h)
    job-lock-ttl-min: 30s
    job-lock-ttl-max: 24h
    # 调度器线程池（push 模式下并发触发任务数）
    scheduler-pool-size: 8
    # 调度器优雅关闭等待时间
    scheduler-await-termination-seconds: 30
    # -----------------------------------------------------------------
    # P0-4: Leader 选举配置（默认启用，确保多实例下任务不重复执行）
    # -----------------------------------------------------------------
    leader:
      enabled: true
      role: pmis-job-scheduler
      lease-seconds: 30
      renew-interval-seconds: 10
    # -----------------------------------------------------------------
    # 任务扫描器配置
    # -----------------------------------------------------------------
    scanner:
      interval-ms: 5000
      batch-size: 100
      misfire-grace-minutes: 30
    # -----------------------------------------------------------------
    # 执行器配置
    # -----------------------------------------------------------------
    executor:
      register-on-startup: true
      heartbeat-interval-seconds: 10
      offline-threshold-seconds: 30
      drain-on-shutdown: true
      drain-timeout-seconds: 60
      max-concurrent: 16
      # P2-5: 线程池租户隔离策略
      # none(共享, 默认) / tenant(按租户隔离) / job_group(按分组隔离)
      isolation-strategy: none
      # 每个租户/分组独立线程池大小
      tenant-pool-size: 10
      # 每个租户/分组独立线程池队列容量
      tenant-pool-queue-capacity: 200
    # -----------------------------------------------------------------
    # 超时监控配置
    # -----------------------------------------------------------------
    timeout-monitor:
      interval-ms: 10000
    # -----------------------------------------------------------------
    # P7-2 / P7-3: 租户级配额配置
    # -----------------------------------------------------------------
    # 默认禁用；启用后在任务创建时校验任务数配额、在任务派发时校验并发数与日执行量配额。
    # 配额优先级：DB 记录(pmis_tenant_quota 表) > 下列全局默认 > null(unlimited)。
    # 配额服务异常时自动降级放行，不影响任务执行。
    quota:
      # 是否启用租户级配额检查（false=所有租户 unlimited）
      enabled: false
      # 默认任务数上限（租户未在 DB 配置时使用，null=unlimited）
      default-max-jobs: null
      # 默认并发执行上限（null=unlimited）
      default-max-concurrent: null
      # 默认日执行量上限（null=unlimited）
      default-max-daily-executions: null
    # -----------------------------------------------------------------
    # P1-5: 告警通道配置（飞书 + 短信）
    # 飞书/短信通道默认禁用，需配置 webhook-url 并设置 enabled=true 后启用
    # -----------------------------------------------------------------
    alert:
      # 飞书群机器人
      feishu:
        enabled: false
        webhook-url: ""
      # 短信通知（通过 HTTP Webhook 转发到 message-service 等短信网关）
      sms:
        enabled: false
        webhook-url: ""
        phone-numbers: ""
    # -----------------------------------------------------------------
    # P2-2: 日志归档清理配置
    # -----------------------------------------------------------------
    # 每天凌晨 3 点由 Leader 节点清理超过保留天数的日志记录（硬删除，释放磁盘空间）
    # 清理范围：pmis_job_log / pmis_job_log_content / pmis_job_slow_log /
    #           pmis_job_alert_log / pmis_job_task / pmis_job_history
    log-retention:
      # 日志保留天数（超过此天数的日志将被清理）
      retention-days: 30
      # 单批删除条数（避免大事务锁表）
      batch-size: 1000
      # 定时清理 cron 表达式（默认每天凌晨 3 点）
      cron: "0 0 3 * * ?"
