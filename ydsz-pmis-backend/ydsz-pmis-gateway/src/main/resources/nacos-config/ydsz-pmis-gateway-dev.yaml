# =====================================================================
#  YDSZ PMIS · Gateway · DEV 环境配置（Nacos DataId）
#  --------------------------------------------------------------------
#  DataId:    ydsz-pmis-gateway-dev.yaml
#  Group:     dev
#  Profile:   dev
#  端口:      9000
#  说明:      Nacos 配置中心加载此文件后等价于 application.yml，
#             配合 bootstrap.yml 完成启动。
# =====================================================================

server:
  port: 9000
  max-http-request-header-size: 16KB

spring:
  profiles: dev
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:*}
            allowedMethods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
            allowedHeaders: "Authorization,Content-Type,X-Requested-With,X-Access-Token,X-Trace-Id,X-Gray-Tag"
            exposedHeaders:
              - Authorization
              - X-Trace-Id
              - Content-Disposition
            allowCredentials: true
            maxAge: 3600
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      httpclient:
        websocket:
          max-frame-payload-length: 65536
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
        port: ${SENTINEL_TRANSPORT_PORT:8719}
      eager: true
      filter:
        enabled: true
      scg:
        fallback:
          mode: response
          response-status: 429
          response-body: '{"code":429,"message":"error.RATE_LIMIT"}'
    loadbalancer:
      configurations: gray
      nacos:
        enabled: true

feign:
  sentinel:
    enabled: true

# 日志级别（dev 环境开 DEBUG）
logging:
  level:
    root: INFO
    "[com.njydsz.pmis]": DEBUG
    "[org.springframework.cloud.gateway]": INFO

# SpringDoc / Knife4j dev 环境开启
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
knife4j:
  production: false

# Actuator 暴露端点
management:
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
