# =====================================================================
#  YDSZ · Message · DEV 环境配置（Nacos DataId）
#  DataId:    ydsz-message-dev.yaml
#  Group:     dev
#  端口:      9004
#  说明:      以下配置已迁移至 ydsz-message-common.yaml（shared-configs 加载）：
#             server.* / spring.mail.* / ydsz.json.* / ydsz.message 基础项
#             ydsz.webhook.* / ydsz.channel.* / rocketmq.* / mybatis-plus.*
#             resilience4j.* / management.*
#             本文件仅保留 DEV 环境特有配置
# =====================================================================

spring:
  profiles: dev

# YDSZ 消息引擎配置（仅保留 DEV 特有项）
ydsz:
  message:
    global-daily-limit: 0
    global-hourly-limit: 0
    sms:
      aliyun:
        access-key-id: ${YDSZ_SMS_ALIYUN_AK:}
        access-key-secret: ${YDSZ_SMS_ALIYUN_SK:}
        sign-name: ${YDSZ_SMS_ALIYUN_SIGN:}
        endpoint: dysmsapi.aliyuncs.com
        connect-timeout: 5000
        read-timeout: 10000
    push:
      getui:
        app-id: ${YDSZ_PUSH_GETUI_APPID:}
        app-key: ${YDSZ_PUSH_GETUI_APPKEY:}
        master-secret: ${YDSZ_PUSH_GETUI_MASTER:}
        base-url: https://restapi.getui.com
        connect-timeout: 5000
        read-timeout: 10000
  # P0-1: 统一线程池配置（ydsz-common-thread）
  # 参考：云顶编码规范 15.4 节
  thread:
    enabled: true
    hot-update:
      enabled: true
    pools:
      messageBatch:
        core-size: 2
        max-size: 4
        queue-capacity: 200
        thread-name-prefix: ydsz-msg-batch-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 60
        keep-alive-seconds: 60
        slow-task-threshold-ms: 5000
        task-decorator-bean-names:
          - tenantContextTaskDecorator
      # 通道级 Bulkhead 线程池
      msgEmail:
        core-size: 5
        max-size: 20
        queue-capacity: 100
        thread-name-prefix: ydsz-msg-email-
        reject-policy: CALLER_RUNS
        slow-task-threshold-ms: 8000
        task-decorator-bean-names:
          - tenantContextTaskDecorator
      msgSms:
        core-size: 10
        max-size: 30
        queue-capacity: 200
        thread-name-prefix: ydsz-msg-sms-
        reject-policy: CALLER_RUNS
        slow-task-threshold-ms: 5000
        task-decorator-bean-names:
          - tenantContextTaskDecorator
      msgDingtalk:
        core-size: 5
        max-size: 15
        queue-capacity: 100
        thread-name-prefix: ydsz-msg-dingtalk-
        reject-policy: CALLER_RUNS
        slow-task-threshold-ms: 5000
        task-decorator-bean-names:
          - tenantContextTaskDecorator
      msgWecom:
        core-size: 5
        max-size: 15
        queue-capacity: 100
        thread-name-prefix: ydsz-msg-wecom-
        reject-policy: CALLER_RUNS
        slow-task-threshold-ms: 5000
        task-decorator-bean-names:
          - tenantContextTaskDecorator
      msgWecomApp:
        core-size: 5
        max-size: 15
        queue-capacity: 100
        thread-name-prefix: ydsz-msg-wecom-app-
        reject-policy: CALLER_RUNS
        slow-task-threshold-ms: 5000
        task-decorator-bean-names:
          - tenantContextTaskDecorator
      msgFeishu:
        core-size: 5
        max-size: 15
        queue-capacity: 100
        thread-name-prefix: ydsz-msg-feishu-
        reject-policy: CALLER_RUNS
        slow-task-threshold-ms: 5000
        task-decorator-bean-names:
          - tenantContextTaskDecorator
      msgInapp:
        core-size: 3
        max-size: 10
        queue-capacity: 50
        thread-name-prefix: ydsz-msg-inapp-
        reject-policy: CALLER_RUNS
        slow-task-threshold-ms: 3000
        task-decorator-bean-names:
          - tenantContextTaskDecorator
      msgPush:
        core-size: 3
        max-size: 10
        queue-capacity: 50
        thread-name-prefix: ydsz-msg-push-
        reject-policy: CALLER_RUNS
        slow-task-threshold-ms: 3000
        task-decorator-bean-names:
          - tenantContextTaskDecorator
      msgWebhook:
        core-size: 5
        max-size: 15
        queue-capacity: 100
        thread-name-prefix: ydsz-msg-webhook-
        reject-policy: CALLER_RUNS
        slow-task-threshold-ms: 10000
        enable-detailed-metrics: true
        task-decorator-bean-names:
          - tenantContextTaskDecorator

# DEV 覆盖 common 的 rocketmq 配置（支持环境变量注入）
rocketmq:
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:ydsz-message-producer-group}
  consumer:
    enabled: ${ROCKETMQ_CONSUMER_ENABLED:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    "[com.njydsz]": DEBUG
