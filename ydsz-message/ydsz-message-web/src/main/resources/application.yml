# =====================================================================
#  YDSZ 消息通知引擎 application 配置
#  --------------------------------------------------------------------
#  本文件为 SkyWalking 链路追踪 + 日志 traceId 的专用配置
#  公共配置（datasource / redis / mybatis-plus）由 Nacos ydsz-common.yaml 提供
# =====================================================================

logging:
  pattern:
    # SkyWalking traceId 支持：Agent 注入时自动填充 X{traceId}，未启用时为空
    level: "%5p [%X{traceId:-},%X{spanId:-}]"

# SkyWalking 链路追踪（通过 Java Agent 方式启用，无需修改业务代码）
# 启动示例：java -javaagent:/path/to/skywalking-agent.jar \
#   -Dskywalking.agent.service_name=ydsz-message \
#   -Dskywalking.collector.backend_service=localhost:11800 \
#   -jar ydsz-message.jar
#
# Agent 配置优先级：-Dskywalking.xxx > agent/config/agent.config > 默认值
# P2-2: 线程池配置 — 消息批次异步处理（@Async("messageBatchExecutor")）
ydsz:
  thread:
    enabled: true
    pools:
      messageBatch:
        core-size: 4
        max-size: 8
        queue-capacity: 200
        thread-name-prefix: ydsz-msg-batch-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 30

skywalking:
  agent:
    service_name: ${spring.application.name}
    collector_backend_service: ${SW_AGENT_COLLECTOR_BACKEND_SERVICES:127.0.0.1:11800}
