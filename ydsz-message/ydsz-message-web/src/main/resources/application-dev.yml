# === 本地配置（绕过 Nacos） ===
spring:
  config:
    import:
      - "optional:file:${YDSZ_NACOS_CONFIG_DIR:../../docs/nacos-config}/ydsz-common.yml"
      - "optional:file:${YDSZ_NACOS_CONFIG_DIR:../../docs/nacos-config}/ydsz-message-web.yml"
      # 本地凭据（未入库，见 ydsz-config.local.yml.example）占位符在此统一解析，顺序不影响结果
      - "optional:file:${YDSZ_NACOS_CONFIG_DIR:../../docs/nacos-config}/ydsz-config.local.yml"
  main:
    allow-circular-references: true
    lazy-initialization: true

datasource:
  hikari:
    connection-timeout: 5000
    maximum-pool-size: 10
logging:
  level:
    com.njydsz: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework: INFO
    root: INFO
ydsz:
  i18n:
    validate-on-startup: false
  sentry:
    enabled: false
  websocket:
    enabled: false
  local-dev: true
