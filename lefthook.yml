# Lefthook Git hooks configuration
# Refer for explanation to following link:
# https://lefthook.dev/configuration/
#
# P0-5.1: 启用 Git hooks 本地校验，CI 中作为兜底

pre-commit:
  parallel: true
  jobs:
    - name: eslint
      glob: "*.{js,ts,jsx,tsx,vue}"
      run: pnpm eslint --fix {staged_files}

    - name: prettier
      glob: "*.{js,ts,jsx,tsx,vue,json,md,css,scss,less}"
      run: pnpm prettier --write {staged_files}

    - name: stylelint
      glob: "*.{css,scss,less,vue}"
      run: pnpm stylelint --fix {staged_files}

    - name: type-check
      run: pnpm check:type

    - name: backend-enforcer
      glob: "ydsz-backend/**/*.{java,xml}"
      run: cd ydsz-backend && mvn -B -q -DskipTests=true enforcer:enforce -pl . 2>&1 || echo "[backend-enforcer] 跳过：仅检查根 POM 规则"

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm commitlint --edit {1}

pre-push:
  jobs:
    - name: type-check
      run: pnpm check:type

    - name: test
      run: pnpm test:unit

    # P0-7：后端单测左移——推送前运行后端增量测试
    # 全量 mvn test 较慢但保证质量；仅当 ydsz-backend 发生变更时执行
    - name: backend-test
      run: |
        if git diff --name-only HEAD@{1} HEAD 2>/dev/null | grep -q '^ydsz-backend/'; then
          echo "🔧 检测到 ydsz-backend 变更，执行后端全量单测"
          cd ydsz-backend && mvn -B test -DskipJacoco=false
        else
          echo "⏭️  未检测到 ydsz-backend 变更，跳过后端测试"
        fi
