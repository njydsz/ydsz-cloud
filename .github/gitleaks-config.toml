# YDSZ Gitleaks 配置（P1-8）
# -----------------------------------------------------------------------------
# 作用: 自定义 gitleaks 扫描规则，在默认规则基础上增加项目特定的白名单
# 文档: https://github.com/gitleaks/gitleaks#configuration

title = "YDSZ Gitleaks Config"

[extend]
# 继承 gitleaks 内置默认规则（100+ 规则覆盖常见密钥类型）
useDefault = true

# =========================================================================
# 全局白名单：以下路径/文件不扫描
# =========================================================================
[[allowlistPaths]]
# 测试 fixture / mock 数据中的假密钥（非真实凭据）
patterns = [
    '''src/test/resources/.*''',
    '''src/test/java/.*mock.*''',
    '''__mocks__/.*''',
    '''\.env\.example''',
    '''docs/.*''',
]
# 注意: deploy/sql/ 不再整目录排除 —— 只通过下方 [[allowlist]] 的 regexes
# 精确排除种子数据 INSERT 行，DDL / 注释 / README 仍会被扫描

# =========================================================================
# 白名单：已知安全的示例值（非真实密钥）
# =========================================================================
[[allowlist]]
# 占位符
description = "允许占位符（非真实密钥）"
regexes = [
    '''<your-.*-here>''',
    '''<change-me-in-production>''',
    '''REPLACE_VIA_SEALED_SECRETS''',
    '''CHANGE_ME''',
    '''your-password-here''',
    '''example-password''',
]

[[allowlist]]
description = "允许测试用 JWT Token（mock）"
regexes = [
    '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiJ0ZXN0''',
    '''test-jwt-token-.*''',
]

[[allowlist]]
description = "允许测试用 Redis/PG 连接串（localhost）"
regexes = [
    '''redis://localhost:6379''',
    '''jdbc:postgresql://localhost:5432''',
    '''jdbc:postgresql://127\.0\.0\.1:5432''',
]

[[allowlist]]
description = "允许 SQL 种子数据中的密码哈希（bcrypt / SHA-256 等不可逆哈希，非明文密码）"
regexes = [
    # bcrypt: $2a$ / $2b$ / $2y$ + 2位cost + 22位salt + 31位hash
    '''\$2[aby]\$[0-9]{2}\$[A-Za-z0-9./]{53}''',
    # SHA-256 hex (64位十六进制)
    '''\b[0-9a-fA-F]{64}\b''',
    # Spring Security {noop}/{bcrypt}/{sha256} 前缀的编码密码
    '''\{(noop|bcrypt|sha256|pbkdf2|argon2)\}''',
]

# =========================================================================
# 自定义规则：YDSZ 项目特定密钥模式
# =========================================================================
[[rules]]
id = "ydsz-jasypt-password"
description = "Jasypt 配置加密主密码"
regex = '''jasypt\.password\s*[=:]\s*['"]?[A-Za-z0-9]{16,}['"]?'''
tags = ["ydsz", "config-encryption"]

[[rules]]
id = "ydsz-aliyun-oss-key"
description = "阿里云 OSS AccessKey Secret"
regex = '''aliyun\.oss\.access-key-secret\s*[=:]\s*['"]?[A-Za-z0-9+/=]{30,}['"]?'''
tags = ["ydsz", "cloud"]

[[rules]]
id = "ydsz-dingtalk-secret"
description = "钉钉机器人 Secret"
regex = '''dingtalk\.secret\s*[=:]\s*['"]?SEC[A-Za-z0-9]{60,}['"]?'''
tags = ["ydsz", "notification"]

[[rules]]
id = "ydsz-weak-password"
description = "弱密码检测（字母+数字组合，如 ydsz123 / Limw1020）"
regex = '''(?i)password\s*[=:]\s*['"]?[A-Za-z]{3,}[0-9]+[A-Za-z0-9]*'''
keywords = ["password", "passwd", "pwd"]
tags = ["ydsz", "weak-password", "security"]
[rules.allowlist]
description = "排除环境变量引用 ${VAR:-default}、占位符和 SQL 种子数据行"
regexes = [
    # 环境变量引用: ${VAR:-default} / ${VAR} / $VAR
    '''\$\{[^}]*\}''',
    '''\$[A-Z_][A-Z0-9_]*''',
    # 强占位符
    '''<change-me-in-production>''',
    '''<your-.*-here>''',
    # SQL 种子数据 INSERT 行（password 列出现在 VALUES 中）
    '''INSERT\s+INTO.*(?:password|passwd|pwd)''',
    # Spring Security 编码密码前缀
    '''\{(noop|bcrypt|sha256|pbkdf2|argon2)\}''',
]
