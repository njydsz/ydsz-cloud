# =============================================================================
# PMIS 前端 CI 流水线
# -----------------------------------------------------------------------------
# 作用:   对 ydsz-frontend/ 模块进行依赖安装 + Lint + 类型检查 + 构建
# 触发:   push 到 main/develop 分支 (限定 ydsz-frontend/** 路径)
#         pull_request 到 main (限定 ydsz-frontend/** 路径)
# 关联:   与 cd-deploy.yml 串行 (CI 通过 → CD 构建前端镜像)
#
# Job 编排:
#   1. lint-build         pnpm install (frozen-lockfile) → eslint → tsc + build
#                         + OpenAPI schema.d.ts 存在性 & 漂移检查（仅提醒不失败）
#
# 工具版本:  Node.js 20 · pnpm 9 · Vue 3.5 · Vite 5.4
#
# 性能:     缓存 ~/.local/share/pnpm/store (按 pnpm-lock.yaml 哈希) · 总耗时 3-6 分钟
#
# 注意:    working-directory 已统一为 ydsz-frontend，无需在每个 step 重复指定
# =============================================================================
name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'ydsz-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ydsz-frontend/**'

defaults:
  run:
    working-directory: ydsz-frontend

jobs:
  lint-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: ydsz-frontend/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:check

      - name: i18n Coverage Check (P0-2)
        # 检测 .vue 文件中未使用 t() 包裹的硬编码中文
        # P1-4: 阈值从 20% 降至 15%，逐步提升 i18n 覆盖率
        run: node scripts/check-i18n-coverage.mjs --threshold=15

      - name: Type Check & Build
        run: pnpm run build

      - name: OpenAPI Schema 漂移检测（阻断 CI）
        # ----------------------------------------------------------------
        # 方案: 静态签名哈希漂移检测
        # 原理: 扫描后端 Controller 的 @*Mapping 注解生成签名哈希,
        #       与 src/api/openapi/schema.d.ts 头部记录的签名比较。
        # 优势: 无需启动后端应用,纯静态分析,CI 环境可直接运行。
        # 失败时: 开发者需在本地启动后端后运行 pnpm openapi:gen,
        #         然后在 schema.d.ts 头部更新 @openapi-signature 哈希。
        # ----------------------------------------------------------------
        run: node scripts/check-openapi-drift.mjs
