# =============================================================================
# PMIS 前端 CI 流水线
# -----------------------------------------------------------------------------
# 作用:   对 ydsz-pmis-frontend/ 模块进行依赖安装 + Lint + 类型检查 + 构建
# 触发:   push 到 main/develop 分支 (限定 ydsz-pmis-frontend/** 路径)
#         pull_request 到 main (限定 ydsz-pmis-frontend/** 路径)
# 关联:   与 cd-deploy.yml 串行 (CI 通过 → CD 构建前端镜像)
#
# Job 编排:
#   1. lint-build         pnpm install (frozen-lockfile) → eslint → tsc + build
#                         + OpenAPI schema.d.ts 存在性 & 漂移检查（仅提醒不失败）
#   2. test               pnpm test (vitest 单元测试)
#
# 工具版本:  Node.js 20 · pnpm 9 · Vue 3.5 · Vite 5.4
#
# 性能:     缓存 ~/.local/share/pnpm/store (按 pnpm-lock.yaml 哈希) · 总耗时 3-6 分钟
#
# 注意:    working-directory 已统一为 ydsz-pmis-frontend，无需在每个 step 重复指定
# =============================================================================
name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'ydsz-pmis-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ydsz-pmis-frontend/**'

defaults:
  run:
    working-directory: ydsz-pmis-frontend

jobs:
  lint-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: ydsz-pmis-frontend/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:check

      - name: Type Check & Build
        run: pnpm run build

      - name: OpenAPI Schema 漂移检测（阻断 CI）
        # ----------------------------------------------------------------
        # 方案: 静态签名哈希漂移检测
        # 原理: 扫描后端 Controller 的 @*Mapping 注解生成签名哈希,
        #       与 src/api/openapi/schema.d.ts 头部记录的签名比较。
        # 优势: 无需启动后端应用,纯静态分析,CI 环境可直接运行。
        # 失败时: 开发者需在本地启动后端后运行 pnpm openapi:gen,
        #         然后在 schema.d.ts 头部更新 @openapi-signature 哈希。
        # ----------------------------------------------------------------
        run: node scripts/check-openapi-drift.mjs

  test:
    name: Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: ydsz-pmis-frontend/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest with Coverage
        # 覆盖率门禁（分阶段提升计划）:
        #   阶段 1（当前）: lines >= 40%, functions >= 30%, branches >= 30%
        #   阶段 2（2026-09）: lines >= 60%, functions >= 50%, branches >= 50%
        #   阶段 3（2026-12）: lines >= 80%, functions >= 70%, branches >= 70%
        # 任一阈值不达标即 CI 失败
        run: pnpm test:coverage -- --coverage.thresholds.lines=40 --coverage.thresholds.functions=30 --coverage.thresholds.branches=30

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: ydsz-pmis-frontend/coverage/
          retention-days: 7

  e2e:
    name: E2E Test (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: ydsz-pmis-frontend/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Frontend
        run: pnpm run build

      - name: Run E2E Tests
        env:
          CI: 'true'
          E2E_BASE_URL: 'http://localhost:4173'
        run: |
          # 预览服务器后台启动
          npx vite preview --port 4173 &
          PREVIEW_PID=$!
          # 等待服务器就绪
          sleep 5
          # 运行 E2E 测试（仅 Chromium）
          npx playwright test --project=chromium
          # 清理
          kill $PREVIEW_PID || true

      - name: Upload E2E Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ydsz-pmis-frontend/playwright-report/
          retention-days: 7
