# PMIS 前端 CI 流水线
# 触发条件：push 到 main/develop 分支或 PR 到 main
name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'ydsz-pmis-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ydsz-pmis-frontend/**'

defaults:
  run:
    working-directory: ydsz-pmis-frontend

jobs:
  lint-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: ydsz-pmis-frontend/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:check

      - name: Type Check & Build
        run: pnpm run build
