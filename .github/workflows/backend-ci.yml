# =============================================================================
# PMIS 后端 CI 流水线
# -----------------------------------------------------------------------------
# 作用:   对 ydsz-pmis-backend/ 模块进行构建 + 静态检查 + 安全扫描，是合并 PR
#         与 push 到 main/develop 时的质量门禁
# 触发:   push 到 main/develop 分支 (限定 ydsz-pmis-backend/** 路径)
#         pull_request 到 main (限定 ydsz-pmis-backend/** 路径)
# 关联:   与 cd-deploy.yml 串行 (CI 通过 → CD 构建镜像)
#
# Job 编排:
#   1. test               编译 + 运行全部 9 后端模块单元测试（Maven）
#   2. quality            Checkstyle + SpotBugs + SonarQube（SONAR_TOKEN 可选）
#   3. security-scan      OWASP dependency-check（CVSS ≥ 7 直接失败）
#
# 工具版本:  JDK 21 (Temurin) · Maven 3.9+ · Checkstyle/SpotBugs/OWASP 走 mvn plugin
#
# 凭据 (GitHub Secrets):
#   - SONAR_TOKEN            可选；未设置时跳过 Sonar 扫描但其它门禁仍生效
#
# 性能:     缓存 ~/.m2/repository（按 pom.xml 哈希）· 总耗时 8-12 分钟
# =============================================================================
name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'ydsz-pmis-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ydsz-pmis-backend/**'

defaults:
  run:
    working-directory: ydsz-pmis-backend

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven Verify (含编译 + 单元测试 + JaCoCo 覆盖率门禁)
        # 使用 verify 阶段以触发 jacoco-check 目标
        # 门禁规则（分阶段提升, 详见 pom.xml jacoco-check 注释）:
        #   BUNDLE  级别: LINE≥80%, BRANCH≥70%
        #   PACKAGE 级别: LINE≥75%, BRANCH≥65%（防低质包被平均掩盖）
        #   METHOD  级别: LINE≥50%（拦截完全未测试的核心方法）
        # 任一规则不达标即构建失败
        run: mvn -B -ntp verify

      - name: 幂等注解覆盖检查
        # 扫描所有写接口(@PostMapping/@PutMapping/@DeleteMapping/@PatchMapping)
        # 是否标注了 @Idempotent,未标注的输出 warning(当前不阻断 CI)
        # 后续会逐步提升为 error
        # 注意:defaults.run.working-directory 是 ydsz-pmis-backend,这里切换到
        # 仓库根目录,使脚本路径 ydsz-pmis-backend/scripts/... 与参数 ydsz-pmis-backend
        # 均相对于仓库根目录解析
        working-directory: .
        run: |
          chmod +x ydsz-pmis-backend/scripts/check-idempotent-coverage.sh
          bash ydsz-pmis-backend/scripts/check-idempotent-coverage.sh ydsz-pmis-backend

      - name: 静态扫描 DB Migration 依赖（拦截 Flyway / Liquibase）
        # 项目规范（deploy/sql/README.md §1）：不引入任何自动化 schema migration 框架
        # CI 静态扫描拦截，确保 PR 不会误引入 flyway-core / liquibase-core
        run: |
          if mvn -B -ntp dependency:tree 2>/dev/null | grep -iE 'flyway|liquibase'; then
            echo "::error::检测到 Flyway / Liquibase 依赖，违反项目规范（见 deploy/sql/README.md §1）"
            exit 1
          fi
          echo "✅ 未检测到 Flyway / Liquibase 依赖"

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            ydsz-pmis-backend/**/target/surefire-reports/*.xml
            ydsz-pmis-backend/**/target/site/jacoco/**
          retention-days: 7

  # ============================================================
  # 质量门禁（SonarQube + Checkstyle）
  # ============================================================
  quality:
    name: SonarQube & Checkstyle
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarQube 需要完整历史
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('ydsz-pmis-backend/**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Run Checkstyle
        working-directory: ydsz-pmis-backend
        run: mvn -B -ntp checkstyle:check
      - name: SpotBugs Analysis
        working-directory: ydsz-pmis-backend
        run: mvn -B -ntp spotbugs:check -DskipTests
      - name: SonarQube Scan
        working-directory: ydsz-pmis-backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            # 复用 test job 已构建的产物，不再重复 verify
            mvn -B -ntp sonar:sonar \
              -Dsonar.projectKey=ydsz-pmis-backend \
              -Dsonar.organization=ydsz \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.login=$SONAR_TOKEN
          else
            echo "SONAR_TOKEN not set, skipping SonarQube scan"
          fi

  # ============================================================
  # 安全扫描（OWASP dependency-check）
  # ============================================================
  security-scan:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('ydsz-pmis-backend/**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: OWASP Dependency Check
        working-directory: ydsz-pmis-backend
        run: |
          mvn -B -ntp org.owasp:dependency-check-maven:9.0.9:check \
            -DfailBuildOnCVSS=7 \
            -Dformats=HTML,JSON \
            -DoutputDirectory=target/dependency-check-report
      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: ydsz-pmis-backend/target/dependency-check-report/
          retention-days: 7
