# =============================================================================
# YDSZ 后端 CI 流水线
# -----------------------------------------------------------------------------
# 作用:   对 ydsz-backend/ 模块进行构建 + 静态检查 + 安全扫描，是合并 PR
#         与 push 到 main/develop 时的质量门禁
# 触发:   push 到 main/develop 分支 (限定 ydsz-backend/** 路径)
#         pull_request 到 main (限定 ydsz-backend/** 路径)
# 关联:   与 cd-deploy.yml 串行 (CI 通过 → CD 构建镜像)
#
# Job 编排:
#   1. build              编译 + 单元测试全部 9 后端模块（P0-1: 测试体系接入）
#   2. quality            Checkstyle + SpotBugs + SonarQube（SONAR_TOKEN 可选）
#   3. security-scan      OWASP dependency-check（CVSS ≥ 7 直接失败）
#
# 工具版本:  JDK 21 (Temurin) · Maven 3.9+ · Checkstyle/SpotBugs/OWASP 走 mvn plugin
#
# 凭据 (GitHub Secrets):
#   - SONAR_TOKEN            可选；未设置时跳过 Sonar 扫描但其它门禁仍生效
#
# 性能:     缓存 ~/.m2/repository（按 pom.xml 哈希）· 总耗时 8-12 分钟
# =============================================================================
name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'ydsz-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ydsz-backend/**'

defaults:
  run:
    working-directory: ydsz-backend

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven Compile + Unit Tests
        # P0-1: 编译并执行单元测试（公共模块 + 业务模块）
        # 测试失败的模块将阻断 CI
        run: mvn -B -ntp test

      - name: Spotless 格式检查
        # Google Java Format 强制代码格式统一
        # 规则：deploy/docs/architecture/coding-standards.md Section 2
        run: mvn -B -ntp spotless:check -DskipTests

      - name: ArchUnit 架构规则测试
        # P3-1: ArchUnit 编译期架构约束（R1-R28）
        # R1-R8:   DDD 分层 + 包结构规范
        # R9-R11:  Service 层规范（禁 toVO/禁 BeanUtils/Controller 注解）
        # R12-R16: 命名包约束（Converter/VO/Properties/SuppressWarnings/FeignClient）
        # R17-R19: 返回结果封装 + DTO 分包规范
        # R20-R23: 层级依赖方向 + 跨模块隔离 + Converter 方法命名
        # R24-R25: HealthIndicator/Metrics 基类继承约束
        # R26:     @Scheduled 必须使用 @DistributedScheduled 注解（集群安全）
        # R27:     HealthIndicator 不允许使用 @Component 注解（应通过 @Bean 注册）
        # R28:     禁止使用 Executors.new* 方法创建线程池（应通过 common-thread 统一管理）
        # 规则类：ydsz-common-base/src/test/.../ArchitectureRulesTest.java
        # ArchUnit 测试已在上方 mvn test 中自动执行，此处为独立确认步骤
        run: mvn -B -ntp test -pl ydsz-common/ydsz-common-base -Dtest=ArchitectureRulesTest -DfailIfNoTests=false

      - name: 行内 FQN 违规检测
        # 公司代码规范（强制）：禁止行内全限定类名（FQN）用法
        # 规则文件：.trae/rules/no-inline-fqn.md
        # 检测脚本：deploy/scripts/check-inline-fqn.sh
        # --strict 模式：有违规即 exit 1 阻断 CI
        working-directory: .
        run: |
          chmod +x deploy/scripts/check-inline-fqn.sh
          bash deploy/scripts/check-inline-fqn.sh ydsz-backend --strict

      - name: 幂等注解覆盖检查
        # 扫描所有写接口(@PostMapping/@PutMapping/@DeleteMapping/@PatchMapping)
        # 是否标注了 @Idempotent 或 @IdempotentExempt;未标注的以 ERROR 阻断 CI
        # 注意:defaults.run.working-directory 是 ydsz-backend,这里切换到
        # 仓库根目录,使脚本路径 ydsz-backend/scripts/... 与参数 ydsz-backend
        # 均相对于仓库根目录解析
        working-directory: .
        run: |
          chmod +x ydsz-backend/scripts/check-idempotent-coverage.sh
          bash ydsz-backend/scripts/check-idempotent-coverage.sh ydsz-backend

      - name: 静态扫描 DB Migration 依赖与增量脚本（拦截 Flyway / Liquibase / migration 目录）
        # 项目规范（deploy/sql/README.md §1）：不引入任何自动化 schema migration 框架，禁止增量脚本
        # CI 静态扫描拦截：
        #   1) 拦截 flyway-core / liquibase-core 依赖
        #   2) 拦截 pom.xml 中 flyway.version / liquibase.version 属性声明
        #   3) 拦截 deploy/sql/migration/ 目录及任何 V*__*.sql 增量脚本
        #   4) 拦截 src/main/resources/db/migration/ 目录
        run: |
          set -e
          # 1) 依赖扫描
          if mvn -B -ntp dependency:tree 2>/dev/null | grep -iE 'flyway|liquibase'; then
            echo "::error::检测到 Flyway / Liquibase 依赖，违反项目规范（见 deploy/sql/README.md §1）"
            exit 1
          fi
          # 2) pom 属性扫描
          if grep -rnE '<(flyway|liquibase)\.version>' ydsz-backend/ ; then
            echo "::error::检测到 pom.xml 中 flyway.version / liquibase.version 属性声明，违反项目规范"
            grep -rnE '<(flyway|liquibase)\.version>' ydsz-backend/
            exit 1
          fi
          # 3) 增量脚本目录扫描
          if find deploy/sql -type d -name 'migration' | grep -q . ; then
            echo "::error::检测到 deploy/sql/migration/ 目录，违反项目规范（增量脚本已禁止）"
            find deploy/sql -type d -name 'migration'
            exit 1
          fi
          # 检测 Flyway 命名增量脚本 V*__*.sql（双下划线）和 V1.0.1_*.sql（单下划线增量）
          if find deploy/sql -type f -name 'V*__*.sql' | grep -q . ; then
            echo "::error::检测到 V*__*.sql Flyway 命名增量脚本，违反项目规范"
            find deploy/sql -type f -name 'V*__*.sql'
            exit 1
          fi
          # 检测非 V1.0.0_*.sql 命名的版本化脚本（如 V1.0.1_*.sql / V1.1.0_*.sql 增量脚本）
          # 仅允许 V1.0.0.sql / V1.0.0_*.sql（架构优化已合并至各模块 DDL，不再使用独立增量脚本）
          if find deploy/sql -type f -name 'V[0-9]*.sql' ! -name 'V1.0.0.sql' ! -name 'V1.0.0_*' | grep -q . ; then
            echo "::error::检测到非规范 SQL 脚本（仅允许 V1.0.0.sql / V1.0.0_*.sql）"
            find deploy/sql -type f -name 'V[0-9]*.sql' ! -name 'V1.0.0.sql' ! -name 'V1.0.0_*'
            exit 1
          fi
          # 4) 业务模块 db/migration 目录扫描
          if find ydsz-backend -type d -name 'migration' -path '*/db/migration*' | grep -q . ; then
            echo "::error::检测到 src/main/resources/db/migration/ 目录，违反项目规范"
            find ydsz-backend -type d -name 'migration' -path '*/db/migration*'
            exit 1
          fi
          echo "✅ 未检测到 Flyway / Liquibase 依赖、增量脚本目录或 db/migration 目录"

  # ============================================================
  # Schema 漂移检测（无 Flyway 方案：pg_dump diff）
  # ============================================================
  schema-drift-check:
    name: Schema Drift Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Schema Drift Detection (pg_dump diff)
        working-directory: .
        run: |
          chmod +x deploy/scripts/schema-drift-check.sh
          bash deploy/scripts/schema-drift-check.sh

      - name: Upload Drift Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift-report
          path: deploy/sql/.schema-drift.diff
          retention-days: 14

  # ============================================================
  # 质量门禁（SonarQube + Checkstyle）
  # ============================================================
  quality:
    name: SonarQube & Checkstyle
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarQube 需要完整历史
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('ydsz-backend/**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Run Checkstyle
        working-directory: ydsz-backend
        run: mvn -B -ntp checkstyle:check
      - name: SpotBugs Analysis
        working-directory: ydsz-backend
        run: mvn -B -ntp spotbugs:check -DskipTests
      - name: SonarQube Scan (mandatory Quality Gate)
        working-directory: ydsz-backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN 未配置，SonarQube 质量门禁为必选项。请在 GitHub Secrets 中配置 SONAR_TOKEN。"
            exit 1
          fi
          # 复用 build job 已编译的产物，-DskipTests 避免触发 test 阶段
          mvn -B -ntp -DskipTests sonar:sonar \
            -Dsonar.projectKey=ydsz-backend \
            -Dsonar.organization=ydsz \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300
          # 如果 Quality Gate 失败，mvn 会返回非零退出码，CI 将被阻断

  # ============================================================
  # 安全扫描（OWASP dependency-check）
  # ============================================================
  security-scan:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('ydsz-backend/**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: OWASP Dependency Check
        working-directory: ydsz-backend
        # P0-4 修复：显式传 -DskipDependencyCheck=false 双保险，避免 pom 默认值变更时静默跳过
        run: |
          mvn -B -ntp org.owasp:dependency-check-maven:9.0.9:check \
            -DskipDependencyCheck=false \
            -DfailBuildOnCVSS=7 \
            -Dformats=HTML,JSON \
            -DoutputDirectory=target/dependency-check-report
      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: ydsz-backend/target/dependency-check-report/
          retention-days: 7

  # ============================================================
  # 性能基线测试（k6，仅 PR 到 main 时触发）
  # ============================================================
  performance-baseline:
    name: Performance Baseline (k6)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4

      - name: Run k6 Performance Test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: deploy/perf/k6-baseline-test.js
        env:
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
          BASE_URL: ${{ secrets.PERF_TARGET_URL || 'http://localhost:8080' }}

      - name: Upload Performance Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: |
            deploy/perf/*.json
            deploy/perf/*.html
          retention-days: 30

