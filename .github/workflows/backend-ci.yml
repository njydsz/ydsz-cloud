# PMIS 后端 CI 流水线
# 触发条件：push 到 main/develop 分支或 PR 到 main
name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'ydsz-pmis-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ydsz-pmis-backend/**'

defaults:
  run:
    working-directory: ydsz-pmis-backend

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven Build
        run: mvn -B -ntp -DskipTests package

  # ============================================================
  # 质量门禁（SonarQube + Checkstyle）
  # ============================================================
  quality:
    name: SonarQube & Checkstyle
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarQube 需要完整历史
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('ydsz-pmis-backend/**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Run Checkstyle
        working-directory: ydsz-pmis-backend
        run: mvn -B -ntp checkstyle:check
      - name: SpotBugs Analysis
        working-directory: ydsz-pmis-backend
        run: mvn -B -ntp spotbugs:check -DskipTests
      - name: SonarQube Scan
        working-directory: ydsz-pmis-backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            mvn -B -ntp verify sonar:sonar \
              -Dsonar.projectKey=ydsz-pmis-backend \
              -Dsonar.organization=ydsz \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.login=$SONAR_TOKEN
          else
            echo "SONAR_TOKEN not set, skipping SonarQube scan"
          fi

  # ============================================================
  # 安全扫描（OWASP dependency-check）
  # ============================================================
  security-scan:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('ydsz-pmis-backend/**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: OWASP Dependency Check
        working-directory: ydsz-pmis-backend
        run: |
          mvn -B -ntp org.owasp:dependency-check-maven:9.0.9:check \
            -DfailBuildOnCVSS=7 \
            -Dformats=HTML,JSON \
            -DoutputDirectory=target/dependency-check-report
      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: ydsz-pmis-backend/target/dependency-check-report/
          retention-days: 7
