# PMIS 后端 CI 流水线（P1-15）
# 触发条件：push 到 main/develop 分支或 PR 到 main
name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'ydsz-pmis-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ydsz-pmis-backend/**'

defaults:
  run:
    working-directory: ydsz-pmis-backend

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven Build & Test
        run: mvn -B -ntp -DskipITs=true -Djacoco.skip=false test

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            ydsz-pmis-backend/**/target/surefire-reports/*.xml
          retention-days: 7

      - name: Upload JaCoCo Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            ydsz-pmis-backend/**/target/site/jacoco/**
            ydsz-pmis-backend/**/target/jacoco.exec
          retention-days: 7
