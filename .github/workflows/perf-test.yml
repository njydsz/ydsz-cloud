name: Performance Test

on:
  schedule:
    - cron: '0 2 * * *'  # 每天 02:00 UTC 执行
  workflow_dispatch:
    inputs:
      thread_count:
        description: '并发线程数'
        required: false
        default: '50'
      ramp_up:
        description: 'Ramp-up 时间（秒）'
        required: false
        default: '10'

jobs:
  jmeter-test:
    runs-on: ubuntu-latest
    container:
      # 使用预装 JMeter 的 Docker 镜像，避免每次运行时下载
      image: justb4/jmeter:5.6.3
      options: --rm
    steps:
      - uses: actions/checkout@v4

      - name: Run JMeter Tests
        env:
          THREAD_COUNT: ${{ github.event.inputs.thread_count || '50' }}
          RAMP_UP: ${{ github.event.inputs.ramp_up || '10' }}
        run: |
          if [ -d deploy/perf/jmeter ]; then
            echo "开始执行 JMeter 性能测试..."
            echo "并发线程数: ${THREAD_COUNT}, Ramp-up: ${RAMP_UP}s"

            for jmx in deploy/perf/jmeter/*.jmx; do
              echo "执行: $jmx"
              jmeter -n -t "$jmx" \
                -Jthreads="${THREAD_COUNT}" \
                -Jrampup="${RAMP_UP}" \
                -l "results_$(basename $jmx .jmx).jtl" \
                -e -o "report_$(basename $jmx .jmx)" || true
            done
          else
            echo "JMeter 测试目录不存在，跳过"
          fi
        continue-on-error: true

      - name: Upload Performance Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: |
            report_*
            results_*.jtl
          retention-days: 30

  performance-gate:
    needs: jmeter-test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Performance Results
        run: |
          echo "性能测试已完成，请下载 perf-report artifact 查看详细报告。"
          echo "如需设置性能阈值门禁，可在 report_*/statistics.json 中检查 error_rate 和 p99 响应时间。"
