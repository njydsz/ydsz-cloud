name: ydsz-cloud CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

env:
  JAVA_VERSION: "21"
  MAVEN_OPTS: >-
    -Dorg.slf4j.simpleLogger.showDateTime=true
    -Djava.awt.headless=true
    -Xmx4g
    -XX:+UseG1GC

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Step 1: 检出源码（前端 + 后端仓库并排）
      - name: Checkout backend repository
        uses: actions/checkout@v4
        with:
          path: ydsz-cloud

      - name: Checkout frontend repository
        uses: actions/checkout@v4
        with:
          repository: njydsz/ydsz-micro
          path: ydsz-micro
        continue-on-error: true
        # 前端仓库为 private 或路径不同时允许跳过；前端检查步骤以继续观察模式运行

      # Step 2: 设置 Java 21 并缓存 Maven 本地仓库
      - name: Set up Java 21 (Temurin) & Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: |
            ydsz-cloud/**/pom.xml

      # Step 3: 编码规范前置校验
      - name: 编码规范前置校验（BOM / CRLF / 末尾换行）
        working-directory: ydsz-cloud
        run: python3 data/scripts/fix-file-encoding.py

      # Step 4: Checkstyle 验证
      - name: Run Checkstyle
        working-directory: ydsz-cloud
        run: mvn checkstyle:check -B

      # Step 4a: 错误码 i18n 覆盖度检查（观察模式）
      - name: 错误码 i18n 覆盖度检查
        working-directory: ydsz-cloud
        run: |
          python data/scripts/check-error-code-i18n.py \
            --backend-root ./ydsz-cloud \
            --frontend-root ./ydsz-micro \
            --verbose || echo "[CONTINUE] i18n check finished (observe mode)"

      # Step 4b: SpringDoc @Operation 覆盖率检查（观察模式）
      - name: SpringDoc @Operation 覆盖率检查
        working-directory: ydsz-cloud
        run: |
          python data/scripts/check-springdoc-coverage.py \
            --backend-root ./ydsz-cloud \
            --min-coverage 20 \
            --verbose || echo "[CONTINUE] SpringDoc check finished (observe mode)"

      # Step 5: Maven verify
      - name: Maven verify (Compile + Unit Test + Integration Test)
        working-directory: ydsz-cloud
        run: mvn verify -B
        # 26.09-29: 移除 -fae 参数，改为 fail-fast 模式，确保每个模块的测试失败都能立即阻断
        # （此前 -fae 导致中间失败被遮断，问题容易累积；覆盖率门禁上调后需更严格）

      # Step 6: 测试报告归档（surefire-reports / failsafe-reports 产物收集 — 云顶编码规范 §14.4）
      # 由 Maven Surefire 与 Failsafe 插件在 target/surefire-reports 与 target/failsafe-reports 生成的 XML 报告
      - name: 归档单元测试与集成测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          if-no-files-found: warn
          retention-days: 30

      # Step 7: JUnit 测试趋势与报告（Test Reporter — 提供可视化测试报告与失败标注）
      - name: 测试报告注解（Test Report Annotation）
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: 后端测试报告
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      # Step 8: JaCoCo 覆盖率报告归档
      - name: 归档 JaCoCo 覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ github.run_number }}
          path: |
            **/target/site/jacoco/jacoco.xml
          if-no-files-found: warn
          retention-days: 30
