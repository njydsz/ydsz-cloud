name: ydsz-cloud CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

env:
  JAVA_VERSION: "21"
  MAVEN_OPTS: >-
    -Dorg.slf4j.simpleLogger.showDateTime=true
    -Djava.awt.headless=true
    -Xmx4g
    -XX:+UseG1GC

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Step 1: 检出源码
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: 设置 Java 21 并缓存 Maven 本地仓库
      - name: Set up Java 21 (Temurin) & Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          # key 包含 Runner OS 与 pom.xml hash，确保跨版本隔离
          cache-dependency-path: |
            **/pom.xml

      # Step 3: 编码规范前置校验（云顶编码规范 1.1 节 / YDIZ-CODE-001，P0 阻断级）
      # 必须早于 Checkstyle：BOM 会使 Checkstyle 的 ANTLR 解析器抛 NoViableAltException，
      # 中断整个模块并掩盖后续模块，导致「零违规」假象。此处前置拦截并给出明确诊断。
      - name: 编码规范前置校验（BOM / CRLF / 末尾换行）
        run: python3 data/scripts/fix-file-encoding.py
        # 默认检查模式：发现问题以退出码 1 阻断。本地修复：
        #   python3 data/scripts/fix-file-encoding.py --apply

      # Step 4: Checkstyle 验证（严格执行云顶编码规范红线）
      - name: Run Checkstyle
        run: mvn checkstyle:check -B
        # 失败即构建中断（failOnViolation=true，已在 pom 中配置）

      # Step 5: Maven verify（编译 + 测试 + 打包验证 — surefire 跑单元测试 + failsafe 跑 IT 集成测试）
      - name: Maven verify (Compile + Unit Test + Integration Test)
        run: mvn verify -B
        # 26.09-29: 移除 -fae 参数，改为 fail-fast 模式，确保每个模块的测试失败都能立即阻断
        # （此前 -fae 导致中间失败被遮断，问题容易累积；覆盖率门禁上调后需更严格）

      # Step 6: 测试报告归档（surefire-reports / failsafe-reports 产物收集 — 云顶编码规范 §14.4）
      # 由 Maven Surefire 与 Failsafe 插件在 target/surefire-reports 与 target/failsafe-reports 生成的 XML 报告
      - name: 归档单元测试与集成测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          if-no-files-found: warn
          retention-days: 30

      # Step 7: JUnit 测试趋势与报告（Test Reporter — 提供可视化测试报告与失败标注）
      - name: 测试报告注解（Test Report Annotation）
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: 后端测试报告
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      # Step 8: JaCoCo 覆盖率报告归档
      - name: 归档 JaCoCo 覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ github.run_number }}
          path: |
            **/target/site/jacoco/jacoco.xml
          if-no-files-found: warn
          retention-days: 30
