# =============================================================================
# PMIS 持续部署 (CD) 流水线
# -----------------------------------------------------------------------------
# 作用:  构建并推送 8 个后端 + 1 个前端镜像到阿里云 ACR，再通过 kubectl 部署到 K8s
# 触发:  push 到 main (自动部署 staging)  /  workflow_dispatch (手动选择 staging|production)
# 镜像仓库: registry.cn-hangzhou.aliyuncs.com/ydsz
# 镜像 tag: ${{ github.sha }} (commit SHA) + latest
# 部署策略:  staging  = kubectl 滚动更新
#            production = kubectl 滚动更新 + Prometheus 5xx 错误率监控 + 自动回滚
# 构建方式:  Docker 多阶段构建（后端 Dockerfile 内完成 Maven 编译，前端 Dockerfile 内完成 pnpm build）
# 关联:   backend-ci.yml  /  frontend-ci.yml (上游)  /  deploy/k8s/  /  deploy/helm/
# 凭据 (在 GitHub Secrets 中配置):
#   - ALIYUN_REGISTRY_USERNAME / ALIYUN_REGISTRY_PASSWORD
#   - KUBE_CONFIG_STAGING / KUBE_CONFIG_PRODUCTION (base64 编码的 kubeconfig)
# =============================================================================
name: CD Deploy

on:
  workflow_run:
    workflows: ["Backend CI", "Frontend CI"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'ydsz-pmis-backend/**'
      - 'ydsz-pmis-frontend/**'
      - 'deploy/docker/**'
      - 'deploy/k8s/**'
      - 'deploy/helm/**'
      - '.github/workflows/cd-deploy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: '部署目标'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
          - rollback

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  NAMESPACE: ydsz
  IMAGE_TAG: ${{ github.sha }}
  # K8s 部署命名空间（与 deploy/k8s/base/namespace.yaml 保持一致）
  K8S_NAMESPACE: pmis

jobs:
  # ==================== 构建后端镜像（Dockerfile 多阶段构建，内含 Maven 编译） ====================
  build-backend:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        service:
          # 端口分配（2026-07-08 统一）: 9000 gateway / 9001 userinfo / 9002 system
          #                              9003 project / 9004 message / 9005 cronjob
          #                              9006 workflow / 9007 agent
          - { name: gateway,   port: 9000,  module: ydsz-pmis-gateway }
          - { name: userinfo,  port: 9001,  module: ydsz-pmis-userinfo }
          - { name: system,    port: 9002,  module: ydsz-pmis-system }
          - { name: project,   port: 9003,  module: ydsz-pmis-project }
          - { name: message,   port: 9004,  module: ydsz-pmis-message }
          - { name: cronjob,   port: 9005,  module: ydsz-pmis-cronjob }
          - { name: workflow,  port: 9006,  module: ydsz-pmis-workflow }
          - { name: agent,     port: 9007,  module: ydsz-pmis-agent }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to AliCloud Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and Push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          # context 为后端根目录，Dockerfile 内通过多阶段构建完成 Maven 编译
          context: ydsz-pmis-backend
          file: ydsz-pmis-backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/pmis-${{ matrix.service.name }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/pmis-${{ matrix.service.name }}:latest
          build-args: |
            MODULE_NAME=${{ matrix.service.module }}
            APP_PORT=${{ matrix.service.port }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/pmis-${{ matrix.service.name }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/pmis-${{ matrix.service.name }}:cache,mode=max

  # ==================== 构建前端镜像（Dockerfile 多阶段构建，内含 pnpm build） ====================
  build-frontend:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to AliCloud Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          # context 为前端根目录，Dockerfile 内通过多阶段构建完成 pnpm install + build
          context: ydsz-pmis-frontend
          file: ydsz-pmis-frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/pmis-frontend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/pmis-frontend:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/pmis-frontend:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/pmis-frontend:cache,mode=max

  # ==================== 镜像安全扫描 + SBOM + 签名 ====================
  # 阻断策略: HIGH+CRITICAL 漏洞阻断部署（可通过 .trivyignore 临时豁免）
  # SBOM 格式: CycloneDX JSON（业界标准，可对接 Dependency-Track / Anchore）
  scan-images:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, userinfo, system, project, message, cronjob, workflow, agent, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Trivy 镜像漏洞扫描
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/pmis-${{ matrix.service }}:${{ env.IMAGE_TAG }}
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'  # HIGH+CRITICAL 均阻断（对齐大厂标准）
          ignore-unfixed: true        # 忽略未修复的漏洞
          vuln-type: 'os,library'

      - name: Syft 生成 SBOM（CycloneDX）
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/pmis-${{ matrix.service }}:${{ env.IMAGE_TAG }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.service }}.cyclonedx.json

      - name: cosign 镜像签名（可选）
        # 仅当配置了 COSIGN_KEY 时执行；未配置则跳过（不阻断流水线）
        if: ${{ secrets.COSIGN_KEY != '' }}
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      - name: 使用 cosign 签名镜像
        if: ${{ secrets.COSIGN_KEY != '' }}
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "${COSIGN_KEY}" > /tmp/cosign.key
          cosign sign --yes --key /tmp/cosign.key \
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/pmis-${{ matrix.service }}:${{ env.IMAGE_TAG }}
          rm -f /tmp/cosign.key

      - name: 上传 Trivy 扫描报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.sarif
          retention-days: 30

      - name: 上传 SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cyclonedx.json
          retention-days: 90  # SBOM 保留 90 天，满足合规审计要求

      - name: 安全扫描摘要
        if: always()
        run: |
          echo "## 镜像安全扫描摘要 - pmis-${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy 漏洞扫描 | ${{ job.status == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM 生成 | ✅ 完成 |" >> $GITHUB_STEP_SUMMARY
          echo "| cosign 签名 | ${{ secrets.COSIGN_KEY != '' && '✅ 已签名' || '⚠️ 跳过（未配置密钥）' }} |" >> $GITHUB_STEP_SUMMARY

  # ==================== 部署 Staging（kubectl 滚动更新） ====================
  deploy-staging:
    needs: [build-backend, build-frontend, scan-images]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config

      - name: Deploy to Staging
        run: |
          # 更新所有微服务镜像（命名空间统一为 pmis，与 deploy/k8s/base/namespace.yaml 一致）
          # Deployment 命名遵循 deploy/k8s/base/*.yaml 的 ydsz-pmis- 前缀（P0-2 修复命名一致性）
          # Container 命名遵循 deploy/k8s/base/*.yaml 的容器名（与 service 同名，无 ydsz-pmis- 前缀）
          for svc in gateway userinfo system project message cronjob workflow agent; do
            kubectl set image deployment/ydsz-pmis-${svc} \
              ${svc}=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/pmis-${svc}:${{ env.IMAGE_TAG }} \
              -n ${{ env.K8S_NAMESPACE }}
          done
          # 更新前端镜像（前端容器名为 frontend，与后端服务命名规则一致）
          kubectl set image deployment/ydsz-pmis-frontend \
            frontend=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/pmis-frontend:${{ env.IMAGE_TAG }} \
            -n ${{ env.K8S_NAMESPACE }}

      - name: Wait for Rollout
        run: |
          for svc in gateway userinfo system project message cronjob workflow agent frontend; do
            echo "Waiting for ydsz-pmis-${svc} rollout..."
            kubectl rollout status deployment/ydsz-pmis-${svc} -n ${{ env.K8S_NAMESPACE }} --timeout=300s
          done

      - name: Smoke Test
        run: |
          chmod +x deploy/scripts/smoke-test.sh
          STAGING_URL=https://staging.pmis.ydsz.cn ./deploy/scripts/smoke-test.sh

  # ==================== 部署 Production（kubectl 滚动更新 + Prometheus 错误率自动回滚） ====================
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    environment:
      name: production
      url: https://pmis.ydsz.cn
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config

      - name: Deploy to Production (滚动更新 + 5xx 错误率监控 + 自动回滚)
        run: |
          # 错误率阈值：5 分钟窗口内 5xx 比例 > 1% 即判定失败并回滚
          ERROR_RATE_THRESHOLD=0.01
          for svc in gateway userinfo system project message cronjob workflow agent frontend; do
            echo "==> 开始滚动更新: ydsz-pmis-${svc}"

            # 更新镜像触发滚动更新（P0-2 修复：Deployment 名为 ydsz-pmis-${svc}，容器名为 ${svc}）
            kubectl set image deployment/ydsz-pmis-${svc} \
              ${svc}=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/pmis-${svc}:${{ env.IMAGE_TAG }} \
              -n ${{ env.K8S_NAMESPACE }}

            # 等待滚动更新完成（超时 10 分钟）
            echo "Waiting for ydsz-pmis-${svc} rollout..."
            if ! kubectl rollout status deployment/ydsz-pmis-${svc} -n ${{ env.K8S_NAMESPACE }} --timeout=600s; then
              echo "ERROR: ydsz-pmis-${svc} 滚动更新超时，执行回滚"
              kubectl rollout undo deployment/ydsz-pmis-${svc} -n ${{ env.K8S_NAMESPACE }}
              kubectl rollout status deployment/ydsz-pmis-${svc} -n ${{ env.K8S_NAMESPACE }} --timeout=300s
              exit 1
            fi

            # 等待 30s 让 Prometheus 采集到足够指标
            sleep 30

            # 通过 Prometheus 查询错误率（5xx / 总请求，最近 5 分钟）
            # Pod 命名遵循 <deployment>-<hash>，故正则用 ydsz-pmis-${svc}.*
            ERROR_RATE=$(curl -s "http://prometheus-server.monitoring.svc.cluster.local:9090/query" \
              --data-urlencode "query=sum(rate(http_server_requests_seconds_count{namespace=\"${{ env.K8S_NAMESPACE }}\",pod=~\"ydsz-pmis-${svc}.*\",status=~\"5..\"}[5m])) / sum(rate(http_server_requests_seconds_count{namespace=\"${{ env.K8S_NAMESPACE }}\",pod=~\"ydsz-pmis-${svc}.*\"}[5m]))" \
              | jq -r '.data.result[0].value[1] // "0"')
            echo "ydsz-pmis-${svc} 当前 5xx 错误率: ${ERROR_RATE}"

            if [ "$(echo "${ERROR_RATE} > ${ERROR_RATE_THRESHOLD}" | bc -l)" = "1" ]; then
              echo "ERROR: ydsz-pmis-${svc} 错误率 ${ERROR_RATE} 超过阈值 ${ERROR_RATE_THRESHOLD}，执行回滚！"
              kubectl rollout undo deployment/ydsz-pmis-${svc} -n ${{ env.K8S_NAMESPACE }}
              kubectl rollout status deployment/ydsz-pmis-${svc} -n ${{ env.K8S_NAMESPACE }} --timeout=300s
              exit 1
            fi

            # 检查 Pod 健康状态（Pod label app=ydsz-pmis-${svc}，与 deploy/k8s/base/*.yaml 一致）
            UNHEALTHY=$(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=ydsz-pmis-${svc} \
              --field-selector=status.phase!=Running,status.phase!=Succeeded \
              --no-headers 2>/dev/null | wc -l)
            if [ "${UNHEALTHY}" -gt "0" ]; then
              echo "ERROR: ydsz-pmis-${svc} 有 ${UNHEALTHY} 个 Pod 不健康，执行回滚！"
              kubectl rollout undo deployment/ydsz-pmis-${svc} -n ${{ env.K8S_NAMESPACE }}
              kubectl rollout status deployment/ydsz-pmis-${svc} -n ${{ env.K8S_NAMESPACE }} --timeout=300s
              exit 1
            fi

            echo "✅ ydsz-pmis-${svc} 部署成功"
          done

      - name: Production Smoke Test
        run: |
          chmod +x deploy/scripts/smoke-test.sh
          PRODUCTION_URL=https://pmis.ydsz.cn ./deploy/scripts/smoke-test.sh

      - name: Notify Deploy Success
        if: success()
        run: |
          echo "✅ Production deployment completed successfully"
          echo "Image tag: ${{ env.IMAGE_TAG }}"
          echo "Deploy time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

  # ==================== 手动回滚入口 ====================
  rollback:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'rollback'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config

      - name: Rollback Production
        run: |
          for svc in gateway userinfo system project message cronjob workflow agent frontend; do
            echo "==> 回滚 ydsz-pmis-${svc} 到上一版本"
            kubectl rollout undo deployment/ydsz-pmis-${svc} -n ${{ env.K8S_NAMESPACE }}
            kubectl rollout status deployment/ydsz-pmis-${svc} -n ${{ env.K8S_NAMESPACE }} --timeout=300s
          done
          echo "✅ 所有服务已回滚到上一版本"
