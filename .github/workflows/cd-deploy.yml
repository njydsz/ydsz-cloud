name: CD Deploy

on:
  push:
    branches: [main]
    paths:
      - 'ydsz-pmis-backend/**'
      - 'ydsz-pmis-frontend/**'
  workflow_dispatch:
    inputs:
      target:
        description: '部署目标'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Backend
        working-directory: ydsz-pmis-backend
        run: mvn -B -ntp -DskipTests package

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build Frontend
        working-directory: ydsz-pmis-frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: registry.cn-hangzhou.aliyuncs.com/ydsz/pmis
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to AliCloud Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and Push Docker Images
        if: github.ref == 'refs/heads/main'
        run: |
          for svc in gateway user auth config notification workflow file scheduler message audit project execution agent; do
            docker build -t registry.cn-hangzhou.aliyuncs.com/ydsz/pmis-${svc}:${{ github.sha }} \
              -f deploy/docker/Dockerfile.app \
              --build-arg JAR_FILE=ydsz-pmis-${svc}/target/ydsz-pmis-${svc}-*.jar \
              ydsz-pmis-backend/
            docker push registry.cn-hangzhou.aliyuncs.com/ydsz/pmis-${svc}:${{ github.sha }}
          done
          # 前端镜像
          docker build -t registry.cn-hangzhou.aliyuncs.com/ydsz/pmis-frontend:${{ github.sha }} \
            -f deploy/docker/Dockerfile.frontend \
            ydsz-pmis-frontend/
          docker push registry.cn-hangzhou.aliyuncs.com/ydsz/pmis-frontend:${{ github.sha }}

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Staging (Argo Rollouts)
        run: |
          echo "触发 Argo Rollouts 镜像更新"
          echo "kubectl argo rollouts set image execution-rollout execution=registry.cn-hangzhou.aliyuncs.com/ydsz/pmis-execution:${{ github.sha }}"
          echo "Argo Rollouts 将自动执行 5%→25%→50%→100% 灰度发布"

      - name: Post-deploy Smoke Test
        run: |
          echo "等待服务就绪后执行冒烟测试..."
          sleep 30
          # kubectl wait --for=condition=ready pods -l app=pmis-gateway --timeout=300s
          echo "冒烟测试完成"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    environment: production
    steps:
      - name: Promote to Production
        run: |
          echo "手动确认后推广到生产环境"
          echo "kubectl argo rollouts promote execution-rollout --full"
          echo "生产环境部署完成"
