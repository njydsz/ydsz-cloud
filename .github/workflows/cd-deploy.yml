# =============================================================================
# YDSZ 持续部署 (CD) 流水线
# -----------------------------------------------------------------------------
# 作用:  构建并推送 9 个后端 + 1 个前端镜像到阿里云 ACR，再部署到 K8s
# 触发:  push 到 main (自动部署 staging)  /  workflow_dispatch (手动选择 staging|production|rollback)
# 镜像仓库: registry.cn-hangzhou.aliyuncs.com/ydsz
# 镜像 tag: ${{ github.sha }} (commit SHA) + latest
# 部署策略:  staging  = kubectl 滚动更新
#            production = Argo Rollouts 金丝雀发布 (5%→25%→50%→75%→100%)
#                        + Prometheus 多维度指标自动回滚
# 构建方式:  Docker 多阶段构建（后端 Dockerfile 内完成 Maven 编译，前端 Dockerfile 内完成 pnpm build）
# 关联:   backend-ci.yml  /  frontend-ci.yml (上游)  /  deploy/k8s/
# 凭据 (在 GitHub Secrets 中配置):
#   - ALIYUN_REGISTRY_USERNAME / ALIYUN_REGISTRY_PASSWORD
#   - KUBE_CONFIG_STAGING / KUBE_CONFIG_PRODUCTION (base64 编码的 kubeconfig)
# =============================================================================
name: CD Deploy

on:
  push:
    branches: [main]
    paths:
      - 'ydsz-backend/**'
      - 'ydsz-frontend/**'
      - 'deploy/**'
      - '.github/workflows/cd-deploy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: '部署目标'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
          - rollback

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  NAMESPACE: ydsz
  IMAGE_TAG: ${{ github.sha }}
  K8S_NAMESPACE: ydsz
  # 实际存在的后端微服务列表（finance/sales 已移除 — 后端无对应模块）
  SERVICES: gateway userinfo system project message cronjob workflow agent nextwiki

jobs:
  # ==================== 构建后端镜像（Dockerfile 多阶段构建，内含 Maven 编译） ====================
  build-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          # 端口分配: 9000 gateway / 9001 userinfo / 9002 system
          #           9003 project / 9004 message / 9005 cronjob
          #           9006 workflow / 9007 agent / 8800 nextwiki
          - { name: gateway,   port: 9000,  module: ydsz-gateway }
          - { name: userinfo,  port: 9001,  module: ydsz-userinfo }
          - { name: system,    port: 9002,  module: ydsz-system }
          - { name: project,   port: 9003,  module: ydsz-project }
          - { name: message,   port: 9004,  module: ydsz-message }
          - { name: cronjob,   port: 9005,  module: ydsz-cronjob }
          - { name: workflow,  port: 9006,  module: ydsz-workflow }
          - { name: agent,     port: 9007,  module: ydsz-agent }
          - { name: nextwiki,  port: 8800,  module: ydsz-nextwiki }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to AliCloud Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and Push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ydsz-backend
          file: ydsz-backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/ydsz-${{ matrix.service.name }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/ydsz-${{ matrix.service.name }}:latest
          build-args: |
            MODULE_NAME=${{ matrix.service.module }}
            APP_PORT=${{ matrix.service.port }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/ydsz-${{ matrix.service.name }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/ydsz-${{ matrix.service.name }}:cache,mode=max

  # ==================== 构建前端镜像（Dockerfile 多阶段构建，内含 pnpm build） ====================
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to AliCloud Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ydsz-frontend
          file: ydsz-frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/ydsz-frontend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/ydsz-frontend:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/ydsz-frontend:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/ydsz-frontend:cache,mode=max

  # ==================== 镜像安全扫描 + SBOM + 签名 ====================
  # 阻断策略: HIGH+CRITICAL 漏洞阻断部署（可通过 .trivyignore 临时豁免）
  # SBOM 格式: CycloneDX JSON（业界标准，可对接 Dependency-Track / Anchore）
  scan-images:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, userinfo, system, project, message, cronjob, workflow, agent, nextwiki, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Trivy 镜像漏洞扫描
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/ydsz-${{ matrix.service }}:${{ env.IMAGE_TAG }}
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Syft 生成 SBOM（CycloneDX）
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/ydsz-${{ matrix.service }}:${{ env.IMAGE_TAG }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.service }}.cyclonedx.json

      - name: cosign 镜像签名（可选）
        if: ${{ secrets.COSIGN_KEY != '' }}
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      - name: 使用 cosign 签名镜像
        if: ${{ secrets.COSIGN_KEY != '' }}
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "${COSIGN_KEY}" > /tmp/cosign.key
          cosign sign --yes --key /tmp/cosign.key \
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/ydsz-${{ matrix.service }}:${{ env.IMAGE_TAG }}
          rm -f /tmp/cosign.key

      - name: 上传 Trivy 扫描报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.sarif
          retention-days: 30

      - name: 上传 SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cyclonedx.json
          retention-days: 90

      - name: 安全扫描摘要
        if: always()
        run: |
          echo "## 镜像安全扫描摘要 - ydsz-${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy 漏洞扫描 | ${{ job.status == 'success' && '✅ 通过' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM 生成 | ✅ 完成 |" >> $GITHUB_STEP_SUMMARY
          echo "| cosign 签名 | ${{ secrets.COSIGN_KEY != '' && '✅ 已签名' || '⚠️ 跳过（未配置密钥）' }} |" >> $GITHUB_STEP_SUMMARY

  # ==================== 部署 Staging（kubectl 滚动更新） ====================
  deploy-staging:
    needs: [build-backend, build-frontend, scan-images]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config

      - name: Deploy to Staging (kubectl rolling update)
        run: |
          # Staging 环境使用标准 kubectl 滚动更新（快速迭代）
          for svc in ${{ env.SERVICES }}; do
            echo "==> 滚动更新: ydsz-${svc}"
            kubectl set image deployment/ydsz-${svc} \
              ${svc}=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/ydsz-${svc}:${{ env.IMAGE_TAG }} \
              -n ${{ env.K8S_NAMESPACE }}
          done
          # 更新前端镜像
          kubectl set image deployment/ydsz-frontend \
            frontend=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/ydsz-frontend:${{ env.IMAGE_TAG }} \
            -n ${{ env.K8S_NAMESPACE }}

      - name: Wait for Rollout
        run: |
          for svc in ${{ env.SERVICES }} frontend; do
            echo "Waiting for ydsz-${svc} rollout..."
            kubectl rollout status deployment/ydsz-${svc} -n ${{ env.K8S_NAMESPACE }} --timeout=300s
          done

      - name: Smoke Test
        run: |
          chmod +x deploy/scripts/smoke-test.sh
          STAGING_URL=https://staging.ydsz.ydsz.cn ./deploy/scripts/smoke-test.sh

  # ==================== 部署 Production（Argo Rollouts 金丝雀发布） ====================
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    environment:
      name: production
      url: https://ydsz.ydsz.cn
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl + Argo Rollouts CLI
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
          # 安装 kubectl argo rollouts 插件
          curl -sSL -o /usr/local/bin/kubectl-argo-rollouts \
            https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-amd64
          chmod +x /usr/local/bin/kubectl-argo-rollouts

      - name: Deploy to Production (Argo Rollouts 金丝雀 5%→25%→50%→75%→100%)
        run: |
          # Production 使用 Argo Rollouts 金丝雀发布
          # 每个服务通过 Argo Rollout 资源管理，AnalysisTemplate 自动监控：
          #   - success-rate: 5xx 错误率 < 1%
          #   - latency-p99: P99 延迟 < 500ms
          #   - db-pool-health: 数据库连接池利用率 < 80%
          #   - jvm-memory: JVM 堆内存利用率 < 85%
          #
          # 金丝雀步骤（在 deploy/k8s/rollouts/rollout-*.yaml 中定义）：
          #   5%  (2min) → 25% (3min) → 50% (3min) → 75% (手动确认) → 100%
          for svc in ${{ env.SERVICES }} frontend; do
            echo "==> 金丝雀发布: ydsz-${svc}"
            # 更新 Rollout 镜像触发金丝雀发布
            kubectl argo rollouts set image rollout/ydsz-${svc} \
              ${svc}=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/ydsz-${svc}:${{ env.IMAGE_TAG }} \
              -n ${{ env.K8S_NAMESPACE }}

            # 等待金丝雀发布达到 75% 门槛（自动步骤 5%→25%→50%）
            # 超时 15 分钟后自动回滚
            if ! kubectl argo rollouts wait rollout/ydsz-${svc} \
                -n ${{ env.K8S_NAMESPACE }} \
                --timeout=900s; then
              echo "ERROR: ydsz-${svc} 金丝雀发布失败，执行回滚"
              kubectl argo rollouts abort rollout/ydsz-${svc} -n ${{ env.K8S_NAMESPACE }}
              exit 1
            fi

            echo "✅ ydsz-${svc} 金丝雀发布达到 75% 门槛，等待手动 promote"
          done

      - name: Promote to 100% (手动确认后执行)
        run: |
          # 将所有服务从 75% 提升到 100%
          for svc in ${{ env.SERVICES }} frontend; do
            echo "==> 全量发布: ydsz-${svc}"
            kubectl argo rollouts promote rollout/ydsz-${svc} \
              --full -n ${{ env.K8S_NAMESPACE }}

            if ! kubectl argo rollouts wait rollout/ydsz-${svc} \
                -n ${{ env.K8S_NAMESPACE }} \
                --timeout=300s; then
              echo "ERROR: ydsz-${svc} 全量发布失败，执行回滚"
              kubectl argo rollouts abort rollout/ydsz-${svc} -n ${{ env.K8S_NAMESPACE }}
              exit 1
            fi

            echo "✅ ydsz-${svc} 全量发布成功"
          done

      - name: Production Smoke Test
        run: |
          chmod +x deploy/scripts/smoke-test.sh
          PRODUCTION_URL=https://ydsz.ydsz.cn ./deploy/scripts/smoke-test.sh

      - name: Notify Deploy Success
        if: success()
        run: |
          echo "✅ Production deployment completed successfully"
          echo "Image tag: ${{ env.IMAGE_TAG }}"
          echo "Deploy time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Strategy: Argo Rollouts Canary (5%→25%→50%→75%→100%)"

  # ==================== 手动回滚入口 ====================
  rollback:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'rollback'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl + Argo Rollouts CLI
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
          curl -sSL -o /usr/local/bin/kubectl-argo-rollouts \
            https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-amd64
          chmod +x /usr/local/bin/kubectl-argo-rollouts

      - name: Rollback Production
        run: |
          for svc in ${{ env.SERVICES }} frontend; do
            echo "==> 回滚 ydsz-${svc} 到上一版本"
            kubectl argo rollouts abort rollout/ydsz-${svc} -n ${{ env.K8S_NAMESPACE }} 2>/dev/null || true
            kubectl argo rollouts undo rollout/ydsz-${svc} -n ${{ env.K8S_NAMESPACE }}
          done
          echo "✅ 所有服务已回滚到上一版本"
