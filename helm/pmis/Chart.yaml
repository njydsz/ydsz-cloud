# =============================================================================
# PMIS 全栈 Helm Chart (批次 20 P1-6)
# -----------------------------------------------------------------------------
# 作用:  部署 14 个 Spring Cloud 微服务 + 1 个前端 + 配套 ConfigMap/Secret
# 适用:  阿里云 ACK / 任何 K8s 1.24+ 集群
# 镜像:  registry.cn-hangzhou.aliyuncs.com/ydsz  (华东1)
# -----------------------------------------------------------------------------
# 目录结构:
#   pmis/
#   ├── Chart.yaml           # 本文件，Chart 元数据
#   ├── values.yaml          # 默认配置（开发环境）
#   ├── values-prod.yaml     # 生产环境覆盖
#   └── templates/           # K8s 资源模板
#       ├── _helpers.tpl     # 通用模板片段（labels、names）
#       ├── _microservice.tpl # 14 个微服务共用的 Deployment 模板
#       ├── configmap.yaml   # 非敏感配置（nacos/redis/minio 等）
#       ├── secret.yaml      # 敏感凭据（db/redis/jwt/minio）
#       ├── microservices.yaml # 14 个 Service 资源
#       ├── frontend.yaml    # 前端 Deployment + Service + Ingress
#       ├── hpa.yaml         # 自动扩缩容（按服务）
#       ├── pdb.yaml         # PodDisruptionBudget（按服务）
#       ├── canary-virtualservice.yaml # Argo Rollouts 灰度发布
#       └── servicemonitor.yaml # Prometheus Operator 抓取配置
# -----------------------------------------------------------------------------
# 用法:
#   helm install pmis ./helm/pmis \
#     --namespace pmis --create-namespace \
#     --set global.imageRegistry=registry.cn-hangzhou.aliyuncs.com/ydsz \
#     --set global.imageTag=latest \
#     --values values-dev.yaml
#
# 升级:
#   helm upgrade pmis ./helm/pmis --reuse-values \
#     --set global.imageTag=v1.0.1
#
# 回滚:
#   helm history pmis -n pmis
#   helm rollback pmis 3 -n pmis
# =============================================================================

apiVersion: v2
name: pmis
description: 南京云顶 PMIS 运营管理系统 - 全栈 Helm Chart
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - pmis
  - spring-cloud
  - microservice
home: https://ydsz-pmis.cn
sources:
  - https://github.com/ydsz-pmis/ydsz-pmis
maintainers:
  - name: PMIS Team
    email: ops@ydsz-pmis.cn

# 一次性安装整个应用
dependencies: []
