# =============================================================================
# PMIS 生产环境 Values 覆盖 (阿里云 ACK)
# -----------------------------------------------------------------------------
# 覆盖范围:
#   - 镜像 tag 固定为 v1.0.0（生产禁止 latest）
#   - 拉取策略: Always（生产环境镜像必须实时拉取校验）
#   - Nacos 指向 prod 命名空间
#   - 微服务副本数提升、HPA 上限提升、PDB 必填
#   - 前端 Ingress 启用 TLS，对外域名 pmis.ydsz-pmis.cn
#   - 资源限制上调至 500m~2000m CPU / 1Gi~2Gi Memory
#
# 用法:
#   helm install pmis ./helm/pmis \
#     --namespace pmis-prod --create-namespace \
#     -f values.yaml -f values-prod.yaml
# =============================================================================

global:
  imageRegistry: registry.cn-hangzhou.aliyuncs.com/ydsz
  imageTag: v1.0.0
  imagePullPolicy: Always
  storageClass: alicloud-disk-ssd

imageCredentials:
  enabled: true

spring:
  profiles: prod
  nacos:
    serverAddr: nacos.pmis-prod.svc.cluster.local:8848
    namespace: pmis-prod

# 生产环境扩容
# 端口分配（2026-07-03 修订）：9000 网关；9001 system；9002 userinfo；9003 project
#                        9004 cronjob；9005 workflow；9006 agent
microservices:
  gateway:     { enabled: true, port: 9000, replicas: 3, jvmOpts: "-Xms1g -Xmx2g -XX:+UseG1GC", hpa: { minReplicas: 3, maxReplicas: 8, targetCPU: 65, targetMemory: 75 }, pdb: { minAvailable: 2 } }
  system:      { enabled: true, port: 9001, replicas: 2, jvmOpts: "-Xms512m -Xmx1g -XX:+UseG1GC", hpa: { minReplicas: 2, maxReplicas: 5, targetCPU: 70, targetMemory: 80 }, pdb: { minAvailable: 1 } }
  userinfo:    { enabled: true, port: 9002, replicas: 2, jvmOpts: "-Xms512m -Xmx1g -XX:+UseG1GC", hpa: { minReplicas: 2, maxReplicas: 5, targetCPU: 70, targetMemory: 80 }, pdb: { minAvailable: 1 } }
  project:     { enabled: true, port: 9003, replicas: 5, jvmOpts: "-Xms1g -Xmx2g -XX:+UseG1GC", hpa: { minReplicas: 5, maxReplicas: 12, targetCPU: 65, targetMemory: 75 }, pdb: { minAvailable: 3 } }
  cronjob:     { enabled: true, port: 9004, replicas: 1, jvmOpts: "-Xms256m -Xmx512m -XX:+UseG1GC" }
  workflow:    { enabled: true, port: 9005, replicas: 2, jvmOpts: "-Xms512m -Xmx1g -XX:+UseG1GC", hpa: { minReplicas: 2, maxReplicas: 5, targetCPU: 70, targetMemory: 80 }, pdb: { minAvailable: 1 } }
  agent:       { enabled: true, port: 9006, replicas: 3, jvmOpts: "-Xms512m -Xmx1g -XX:+UseG1GC", hpa: { minReplicas: 3, maxReplicas: 6, targetCPU: 70, targetMemory: 80 }, pdb: { minAvailable: 2 } }

frontend:
  enabled: true
  replicas: 3
  image: ydsz-pmis-frontend
  ingress:
    enabled: true
    host: pmis.ydsz-pmis.cn
    tls: true

# 生产级资源限制
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi

# =============================================================================
# 敏感凭据覆盖 (生产环境必须替换)
# -----------------------------------------------------------------------------
# 重要：生产环境密钥不得硬编码在 values 文件中！
#   方式 1（推荐）：通过 Sealed Secrets / External Secrets Operator 注入
#   方式 2（临时）：helm install --set db.password=xxx --set redis.password=xxx
#   方式 3（CI/CD）：在 GitLab CI Variables 中设置后通过 --set 引用
# 以下占位符覆盖 dev 的弱口令 (changeme)，部署前必须替换为真实强密钥
# =============================================================================
db:
  user: pmis
  password: "REPLACE_VIA_HELM_SET_OR_EXTERNAL_SECRET"

redis:
  password: "REPLACE_VIA_HELM_SET_OR_EXTERNAL_SECRET"

jwt:
  secret: "REPLACE_VIA_HELM_SET_OR_EXTERNAL_SECRET_MIN_32_CHARS"

minio:
  accessKey: "REPLACE_VIA_HELM_SET_OR_EXTERNAL_SECRET"
  secretKey: "REPLACE_VIA_HELM_SET_OR_EXTERNAL_SECRET"

spring:
  nacos:
    password: "REPLACE_VIA_HELM_SET_OR_EXTERNAL_SECRET"

imageCredentials:
  username: "REPLACE_VIA_HELM_SET"
  password: "REPLACE_VIA_HELM_SET_OR_EXTERNAL_SECRET"
