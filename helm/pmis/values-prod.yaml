# PMIS 运营管理系统 - 阿里云 ACK 部署配置
# 适用于生产环境

global:
  imageRegistry: registry.cn-hangzhou.aliyuncs.com/ydsz
  imageTag: v1.0.0
  imagePullPolicy: Always
  storageClass: alicloud-disk-ssd

imageCredentials:
  enabled: true

spring:
  profiles: prod
  nacos:
    serverAddr: nacos.pmis-prod.svc.cluster.local:8848
    namespace: pmis-prod

# 生产环境扩容
microservices:
  gateway:     { enabled: true, port: 9000, replicas: 3, jvmOpts: "-Xms1g -Xmx2g -XX:+UseG1GC", hpa: { minReplicas: 3, maxReplicas: 8, targetCPU: 65, targetMemory: 75 }, pdb: { minAvailable: 2 } }
  auth:        { enabled: true, port: 9001, replicas: 3, jvmOpts: "-Xms512m -Xmx1g -XX:+UseG1GC", hpa: { minReplicas: 3, maxReplicas: 6, targetCPU: 70, targetMemory: 80 }, pdb: { minAvailable: 2 } }
  user:        { enabled: true, port: 9002, replicas: 2, jvmOpts: "-Xms512m -Xmx1g -XX:+UseG1GC", hpa: { minReplicas: 2, maxReplicas: 5, targetCPU: 70, targetMemory: 80 }, pdb: { minAvailable: 1 } }
  notification:{ enabled: true, port: 9003, replicas: 2, jvmOpts: "-Xms512m -Xmx1g -XX:+UseG1GC", hpa: { minReplicas: 2, maxReplicas: 4, targetCPU: 70, targetMemory: 80 }, pdb: { minAvailable: 1 } }
  workflow:    { enabled: true, port: 9004, replicas: 2, jvmOpts: "-Xms512m -Xmx1g -XX:+UseG1GC", hpa: { minReplicas: 2, maxReplicas: 5, targetCPU: 70, targetMemory: 80 }, pdb: { minAvailable: 1 } }
  project:     { enabled: true, port: 9005, replicas: 3, jvmOpts: "-Xms512m -Xmx1g -XX:+UseG1GC", hpa: { minReplicas: 3, maxReplicas: 6, targetCPU: 70, targetMemory: 80 }, pdb: { minAvailable: 2 } }
  execution:   { enabled: true, port: 9006, replicas: 5, jvmOpts: "-Xms1g -Xmx2g -XX:+UseG1GC", hpa: { minReplicas: 5, maxReplicas: 12, targetCPU: 65, targetMemory: 75 }, pdb: { minAvailable: 3 } }
  agent:       { enabled: true, port: 9007, replicas: 3, jvmOpts: "-Xms512m -Xmx1g -XX:+UseG1GC", hpa: { minReplicas: 3, maxReplicas: 6, targetCPU: 70, targetMemory: 80 }, pdb: { minAvailable: 2 } }
  config:      { enabled: true, port: 9008, replicas: 1, jvmOpts: "-Xms256m -Xmx512m -XX:+UseG1GC" }
  file:        { enabled: true, port: 9009, replicas: 2, jvmOpts: "-Xms512m -Xmx1g -XX:+UseG1GC", hpa: { minReplicas: 2, maxReplicas: 4, targetCPU: 70, targetMemory: 80 }, pdb: { minAvailable: 1 } }
  audit:       { enabled: true, port: 9010, replicas: 2, jvmOpts: "-Xms512m -Xmx1g -XX:+UseG1GC", hpa: { minReplicas: 2, maxReplicas: 4, targetCPU: 70, targetMemory: 80 }, pdb: { minAvailable: 1 } }
  message:     { enabled: true, port: 9011, replicas: 2, jvmOpts: "-Xms512m -Xmx1g -XX:+UseG1GC", hpa: { minReplicas: 2, maxReplicas: 4, targetCPU: 70, targetMemory: 80 }, pdb: { minAvailable: 1 } }
  scheduler:   { enabled: true, port: 9012, replicas: 1, jvmOpts: "-Xms256m -Xmx512m -XX:+UseG1GC" }

frontend:
  enabled: true
  replicas: 3
  image: ydsz-pmis-frontend
  ingress:
    enabled: true
    host: pmis.ydsz-pmis.cn
    tls: true

# 生产级资源限制
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi
