apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pmis.fullname" . }}-config
  labels:
    {{- include "pmis.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.spring.profiles | default "prod" | quote }}
  NACOS_SERVER_ADDR: {{ .Values.nacos.serverAddr | default "nacos:8848" | quote }}
  NACOS_NAMESPACE: {{ .Values.nacos.namespace | default "public" | quote }}
  REDIS_HOST: {{ .Values.redis.host | default "redis" | quote }}
  REDIS_PORT: {{ .Values.redis.port | default "6379" | quote }}
  MINIO_ENDPOINT: {{ .Values.minio.endpoint | default "http://minio:9000" | quote }}
  MINIO_BUCKET: {{ .Values.minio.bucket | default "pmis" | quote }}
