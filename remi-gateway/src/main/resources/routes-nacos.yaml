# =====================================================================
#  REMI API 网关路由配置 — Nacos 动态配置模板
#  --------------------------------------------------------------------
#  将此文件内容上传到 Nacos 配置中心：
#    Data ID: remi-gateway-routes.yaml
#    Group:   ${spring.profiles.active}
#    类型:     YAML
#
#  Gateway bootstrap.yml 已配置 shared-configs 引入此文件，
#  修改后自动刷新（@RefreshScope + RouteDefinitionRepository）。
#
#  P0-3: 从 RouteConfig.java 硬编码迁移为 Nacos 动态配置
# =====================================================================
spring:
  cloud:
    gateway:
      # 路由规则（Nacos 动态刷新）
      routes:
        # ===== 基础服务 =====
        # 用户信息中心服务
        - id: remi-userinfo
          uri: lb://remi-userinfo
          predicates:
            - Path=/api/v1/auth/**,/api/v1/user/**,/api/v1/company/**,/api/v1/dept/**,/api/v1/menu/**,/api/v1/post/**,/api/v1/role/**,/api/v1/language/**,/api/v1/oauth2/**,/api/v1/userinfo/**,/api/internal/**,/feign/**

        # 项目业务服务
        - id: remi-project
          uri: lb://remi-project
          predicates:
            - Path=/api/v1/project/**

        # 工作流服务
        - id: remi-workflow
          uri: lb://remi-workflow
          predicates:
            - Path=/api/v1/workflow/**

        # 系统基础服务
        - id: remi-system
          uri: lb://remi-system
          predicates:
            - Path=/api/v1/config/**,/api/v1/dict/**,/api/v1/app/**,/api/v1/variable/**,/api/v1/system/**,/api/v1/search/**

        # 消息中心服务
        - id: remi-message
          uri: lb://remi-message
          predicates:
            - Path=/api/v1/message/**

        # 定时任务服务
        - id: remi-cronjob
          uri: lb://remi-cronjob
          predicates:
            - Path=/api/v1/cronjob/**

        # 规则引擎服务
        - id: remi-literule
          uri: lb://remi-literule
          predicates:
            - Path=/api/v1/literule/**

        # AI Agent 服务
        - id: remi-agent
          uri: lb://remi-agent
          predicates:
            - Path=/api/v1/agent/**

        # 网盘知识库服务
        - id: remi-nextwiki
          uri: lb://remi-nextwiki
          predicates:
            - Path=/api/v1/nextwiki/**

      # 服务发现自动路由（备用，优先使用上面的显式路由）
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
