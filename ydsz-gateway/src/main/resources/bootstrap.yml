# =====================================================================
#  YDSZ API 网关服务 bootstrap 配置
#  --------------------------------------------------------------------
#  端口：9000
#  职责：统一入口、路由分发、限流熔断、CORS、认证、日志
#  依赖：Nacos 服务发现 / 配置中心
#  说明：bootstrap.yml 在 application.yml 之前加载，用于提前连接 Nacos
# =====================================================================

server:
  # 网关监听端口（按构建顺序 1/10）
  port: 9000
  # P1-3: 请求头大小限制（防止大请求攻击）
  max-http-request-header-size: 16KB

spring:
  application:
    name: ydsz-gateway
  profiles:
    # 默认 dev，可通过 -Dspring.profiles.active=dev|sit|uat|prod 或 ENV SPRING_PROFILES_ACTIVE 覆盖
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    # P3-7: 移除 allow-bean-definition-overriding，避免 Bean 覆盖掩盖配置错误
    # 如有 Bean 命名冲突，应通过 @Primary 或显式命名解决
    allow-bean-definition-overriding: false
  cloud:
    nacos:
      # ---------- 服务注册 ----------
      discovery:
        enabled: true
        register-enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ydsz}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        # 服务实例元数据（供其他服务做灰度路由、版本标识等使用）
        metadata:
          version: 1.0.0
          port: 9000
        # 心跳/IP 类型
        ip-type: IPv4
      # ---------- 配置中心 ----------
      config:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ydsz}
        group: ${NACOS_GROUP:${spring.profiles.active}}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        # 配置文件后缀
        file-extension: yaml
        # 开启自动刷新（@RefreshScope 注解配合使用）
        refresh-enabled: true
        # 引入共享配置：datasource / redis / mybatis-plus / springdoc / logging
        # 所有服务共享一份配置，修改一次全集群生效
        shared-configs:
          - data-id: ydsz-common.yaml
            group: ${spring.profiles.active}
            refresh: true
          # P0-A1: 网关路由不再通过 shared-configs 引入 yaml 路由文件，
          #        统一由 NacosRouteDefinitionRepository 从 gateway-routes.json（JSON 数组格式）加载，
          #        避免双路由源竞争。路由模板见 src/main/resources/routes-nacos.yaml。

# P1-1: Nacos 路由配置变更监听器托管线程池（ydsz-common-thread 统一管理，替代原自建 ThreadPoolExecutor）
# 对应 Bean 名称: nacosRouteListenerExecutor（默认 beanNamePrefix 为空，命名规则为 key + "Executor"）
ydsz:
  thread:
    pools:
      nacosRouteListener:
        core-size: 1
        max-size: 1
        queue-capacity: 1024
        thread-name-prefix: nacos-route-listener-
        reject-policy: CALLER_RUNS
