# =====================================================================
#  YDSZ API 网关服务 bootstrap 配置
#  --------------------------------------------------------------------
#  端口：9000（与 docs/nacos-config/ydsz-gateway.yml、前端 nginx/vite 代理目标一致；
#        服务模块占 9001–9009，网关占 9000，见 check-gateway-routes.py R7）
#  职责：统一入口、路由分发、限流熔断、CORS、认证、日志
#  依赖：Nacos 服务发现 / 配置中心
#  说明：bootstrap.yml 在 application.yml 之前加载，用于提前连接 Nacos
# =====================================================================

server:
  # 网关监听端口（按构建顺序 1/10）
  port: 9000
  # P1-3: 请求头大小限制（防止大请求攻击）
  max-http-request-header-size: 16KB

spring:
  application:
    name: ydsz-gateway
  profiles:
    # 默认 dev，可通过 -Dspring.profiles.active=dev|sit|uat|prod 或 ENV SPRING_PROFILES_ACTIVE 覆盖
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    # P3-7: 移除 allow-bean-definition-overriding，避免 Bean 覆盖掩盖配置错误
    # 如有 Bean 命名冲突，应通过 @Primary 或显式命名解决
    allow-bean-definition-overriding: false
  cloud:
    nacos:
      fail-fast: false
      # ---------- 服务注册 ----------
      discovery:
        enabled: false
        register-enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ydsz}
        group: ${NACOS_GROUP:${spring.profiles.active}}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        # 服务实例元数据（供其他服务做灰度路由、版本标识等使用）
        metadata:
          version: 26.10.01
          port: 9000
        # 心跳/IP 类型
        ip-type: IPv4
      # ---------- 配置中心 ----------
      config:
        enabled: false
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ydsz}
        group: ${NACOS_GROUP:${spring.profiles.active}}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        # 配置文件后缀
        file-extension: yaml
        # 开启自动刷新（@RefreshScope 注解配合使用）
        refresh-enabled: true
        # 引入共享配置：datasource / redis / mybatis-plus / springdoc / logging
        # 所有服务共享一份配置，修改一次全集群生效
        #
        # 注意：以上 shared-configs 仅当 config.enabled=true 时才会被拉取。
        # 本地开发默认 enabled=false（无 Nacos），此时本文件与
        # src/main/resources/config/ydsz-gateway-*.yaml 均不生效，
        # 实际生效配置来自 application.yml 与 spring.config.import。
        shared-configs:
          - data-id: ydsz-common.yml
            group: ${spring.profiles.active}
            refresh: true
          # P1-3: 网关跨环境共享配置（过滤器开关 / 限流 / IP 控制 / 连接池 / 健康探针等）
          - data-id: ydsz-gateway.yml
            group: ${spring.profiles.active}
            refresh: true
          # P0-A1: 路由定义的唯一人工维护源是
          #        src/main/resources/routes-nacos.yaml（JSON 数组清单）：
          #          - 静态路由：由 data/scripts/gen-gateway-routes.py 从清单生成
          #            application.yml 的 GENERATED ROUTES 区块（默认生效）
          #          - 动态路由：显式开启 ydsz.gateway.dynamic-routes.enabled=true 且
          #            spring.cloud.nacos.config.enabled=true 时，由
          #            NacosRouteDefinitionRepository 从 DataId gateway-routes.json 加载，
          #            并覆盖同 id 的静态路由
          #        两条链路同源，禁止再引入第二份手工路由清单；
          #        spring.cloud.gateway.server.webflux.discovery.locator.enabled 必须保持 false，
          #        否则服务名会自动生成路由，等于第三个路由来源。
          #        一致性由 data/scripts/check-gateway-routes.py 在 CI 阻断。
