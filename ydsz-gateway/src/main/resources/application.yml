# =====================================================================
#  YDSZ API 网关服务 application 配置
#  --------------------------------------------------------------------
#  本文件为 SkyWalking 链路追踪 + 日志 traceId 的专用配置
#  公共配置（datasource / redis / mybatis-plus）由 Nacos ydsz-common.yaml 提供
# =====================================================================

spring:
  main:
    # 允许循环引用（DistributedLockAutoConfiguration 内部存在自引用）
    allow-circular-references: true
  autoconfigure:
    exclude:
      # 线程池 / 文档 / Sentry / WebMVC 自动配置（网关为 WebFlux reactive 栈）
      - com.njydsz.common.thread.config.ThreadPoolAutoConfiguration
      - com.njydsz.common.base.config.DocAutoConfiguration
      - com.njydsz.common.base.config.DocSecurityConfiguration
      - com.njydsz.common.base.config.YdszAutoConfiguration
      - com.njydsz.common.sentry.config.SentryAutoConfiguration
      - com.njydsz.common.web.config.WebAutoConfiguration
      - com.njydsz.common.web.config.WebMvcObserverAutoConfiguration
      - com.njydsz.common.web.config.TenantWebAutoConfiguration
      # Redis 自动配置（网关手动创建 Lettuce ConnectionFactory 以避免 Jedis/Lettuce 冲突）
      - com.njydsz.common.redis.config.RedisConfiguration
      - com.njydsz.common.redis.config.ReactiveRedisAutoConfiguration
      - com.njydsz.common.redis.metrics.RedisMetricsConfiguration
      # 分布式锁自动配置（ObjectProvider 自引用循环，且网关不使用分布式锁）
      - com.njydsz.common.lock.config.DistributedLockAutoConfiguration
      - com.njydsz.common.lock.metrics.LockMetricsConfiguration
      # JDBC 自动配置（网关不依赖数据库，排除避免 DataSource 初始化失败）
      - com.njydsz.common.jdbc.datasource.DynamicDataSourceAutoConfiguration
      - com.njydsz.common.jdbc.config.MybatisPlusConfiguration
      - com.njydsz.common.jdbc.config.MultiDataSourcePoolCustomizer
      - com.njydsz.common.jdbc.config.SqlTraceAutoConfiguration
      - com.njydsz.common.jdbc.config.SafeQueryAutoConfiguration
      - com.njydsz.common.jdbc.config.JdbcMetricsAutoConfiguration
      - com.njydsz.common.jdbc.actuator.JdbcHealthIndicator
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcClientAutoConfiguration
      - org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.health.DataSourceHealthContributorAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.liquibase.LiquibaseAutoConfiguration
      - org.springframework.boot.autoconfigure.transaction.TransactionAutoConfiguration
      # 审计自动配置（依赖 DataSource，网关无数据库）
      - com.njydsz.common.audit.config.AuditAutoConfiguration
      # 字段加密（网关无敏感字段加密需求，且需要密钥配置）
      - com.njydsz.common.safe.encrypt.FieldEncryptionAutoConfiguration
      # 异常文档端点自动配置（依赖 Servlet 异常体系，WebFlux 不适用）
      - com.njydsz.common.exception.config.YdszExceptionActuatorAutoConfiguration
      - com.njydsz.common.exception.handler.YdszExceptionHandlerAutoConfiguration
      # OpenAPI / Knife4j（仅 Servlet 业务服务需要）
      - com.njydsz.common.base.config.OpenApiAutoConfiguration
      - com.njydsz.common.base.config.Knife4jAutoConfiguration

logging:
  pattern:
    # SkyWalking traceId 支持：Agent 注入时自动填充 X{traceId}，未启用时为空
    level: "%5p [%X{traceId:-},%X{spanId:-}]"

# ---------------------------------------------------------------------
#  API 弃用警告系统（P3-7 增强）
# ---------------------------------------------------------------------
#  当请求路径匹配 ydsz.gateway.deprecation.apis 中的配置时，在响应中
#  注入 Deprecation / Sunset / Link / X-API-Deprecation-Message 系列头。
#
#  配置示例：
#    ydsz:
#      gateway:
#        deprecation:
#          enabled: true
#          apis:
#            - path: /api/message/send
#              since: "v1"
#              replacement: "v2"
#              removalDate: "2026-12-31"
#              message: "请使用 /api/message/send（Header: X-Api-Version: v2）替代"
# ---------------------------------------------------------------------
ydsz:
  auth:
    token:
      secret-key: "ydsz-cloud-local-dev-secret-key-20261009-at-least-32-bytes-long"
      access-token-expire-seconds: 7200
      refresh-token-expire-seconds: 604800
      issuer: "ydsz-cloud"
  gateway:
    deprecation:
      enabled: true
      apis: []
    cache-control:
      enabled: true
      default-max-age-seconds: 60
  i18n:
    # 启用元数据 REST API（/api/internal/i18n/languages）前端可动态获取可用语言列表
    metadata-api-enabled: true
    # 网关不维护完整 i18n key 集（各业务模块各自维护），关闭启动期校验
    validate-on-startup: false

# =====================================================================
#  Actuator 运维端点配置
# --------------------------------------------------------------------
#  暴露 cache-metrics 端点（ydsz-common-cache 提供 /actuator/cache-metrics 指标查询）
#  要求 classpath 存在 ydzs-common-cache + ydzs-common-domain 自动配置激活
# =====================================================================
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,beans,env,cache-metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# SkyWalking 链路追踪（通过 Java Agent 方式启用，无需修改业务代码）
# 启动示例：java -javaagent:/path/to/skywalking-agent.jar \
#   -Dskywalking.agent.service_name=ydsz-gateway \
#   -Dskywalking.collector.backend_service=localhost:11800 \
#   -jar ydsz-gateway.jar
#
# Agent 配置优先级：-Dskywalking.xxx > agent/config/agent.config > 默认值
# 以下为可选的 Spring 属性占位（实际由 agent.config 控制）
skywalking:
  agent:
    service_name: ${spring.application.name}
    collector_backend_service: ${SW_AGENT_COLLECTOR_BACKEND_SERVICES:127.0.0.1:11800}
  plugin:
    toolikt:
      # 禁用不需要的 toolit-kit 插件（如有冲突时取消注释）
      # activate: false
