# =====================================================================
#  YDSZ API 网关路由清单 — 唯一手工维护的路由事实源
#  --------------------------------------------------------------------
#  本文件是网关路由的单一来源（single source of truth），同时服务两个消费方：
#
#  1. Nacos 配置中心（生产/集成环境的动态路由）
#     Data ID: gateway-routes.json（内容 = 本文件下方的 JSON 数组本体）
#     Group:   ${spring.profiles.active}（dev/sit/uat/prod）
#     类型:     JSON
#     加载方:   NacosRouteDefinitionRepository（需 ydsz.gateway.dynamic-routes.enabled=true
#              且 spring.cloud.nacos.config.enabled=true，两者默认关闭）
#
#  2. application.yml 的静态路由（本地/单机环境，无需 Nacos）
#     由 data/scripts/gen-gateway-routes.py 依据本文件生成，禁止手工编辑；
#     lb://service 会被改写为 http://localhost:PORT，端口取自
#     docs/nacos-config/ydsz-<service>-web.yml 的 server.port。
#     CI（.github/workflows/ci.yml）执行 gen-gateway-routes.py --check，
#     两处不一致即红。
#
#  为什么只留一份：RouteDefinitionRepository 与 spring.cloud.gateway...routes
#  会被 CompositeRouteDefinitionLocator 合并，同 id 后加载者覆盖先加载者。
#  两份清单各自演化时，路由归属（哪个前缀进哪个服务）就会漂移 ——
#  /api/permission/**、/api/internal/** 都漂移过，表现为生产 404 或错服务命中。
#
#  新增/修改路由前必读：
#  - YDIZ-API-001：/api 是网关层命名空间，业务 Controller 的 @RequestMapping
#    禁止含 /api 段；网关以 StripPrefix=1 剥离 /api。因此 /api/x/** 路由必须带
#    StripPrefix，而不带 /api 的外链路由（SAML ACS / SCIM / OIDC 发现文档）必须不带。
#  - P0-A2：API 版本由请求头 X-Api-Version 协商，路径中不出现版本段，
#    因此本清单不含 /api/v1/**（前端若写 /api/v1/... 会在网关直接 404，
#    check-gateway-routes.py 会拦）。
#  - 前缀归属必须与 Controller 的实际 @RequestMapping 一致，
#    由 data/scripts/check-gateway-routes.py 逐模块校验（漏配前缀即红）。
#
#  字段说明（每项为一个 RouteDefinition）：
#   id / uri / predicates（name + args）/ filters / order / metadata
# =====================================================================

[
  {
    "id": "ydsz-system-audit",
    "uri": "lb://ydsz-system",
    "predicates": [
      { "name": "Path", "args": { "pattern": "/api/admin/audit/**" } }
    ],
    "filters": [
      { "name": "StripPrefix", "args": { "parts": "1" } }
    ],
    "order": -4
  },
  {
