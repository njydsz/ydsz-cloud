# =====================================================================
#  YDSZ API 网关路由配置 — Nacos 动态路由模板（JSON 数组格式）
#  --------------------------------------------------------------------
#  将此 JSON 内容上传到 Nacos 配置中心：
#    Data ID: gateway-routes.json
#    Group:   ${spring.profiles.active}（dev/sit/uat/prod）
#    类型:     JSON
#
#  P0-A1: 网关路由的唯一配置入口为 NacosRouteDefinitionRepository，
#         从上述 DataId 加载 JSON 数组格式的路由定义，修改后秒级生效、无需重启网关。
#         禁止再通过 shared-configs 引入 ydsz-gateway-routes.yaml（已移除，避免双源竞争）。
#
#  P2-适配: 按后端服务最新 Controller 暴露的路径整理路由前缀，
#         与 ydsz-micro 前端调用保持一致。
#
#  P0-A2: API 版本通过请求头 X-Api-Version 协商，路径中不再包含版本段。
#         版本优先级: Header > Query > Default，默认 v1。
#
#  路由配置格式（每项为 RouteDefinition）：
#   {
#     "id":        路由唯一标识（与 lb:// 服务名保持一致）
#     "uri":       目标地址，lb://serviceId 走服务发现，http(s):// 走直连
#     "predicates": 路由断言（Path / Method / Header / Query 等）
#     "filters":   网关过滤器（可选）
#     "order":     匹配优先级（越小越优先，默认 0）
#   }
# =====================================================================

[
  {
    "id": "ydsz-system-audit",
    "uri": "lb://ydsz-system",
    "predicates": [
      {
        "name": "Path",
        "args": { "pattern": "/api/admin/audit/**" }
      }
    ],
    "order": -1
  },
  {
    "id": "ydsz-system-internal",
    "uri": "lb://ydsz-system",
    "predicates": [
      {
        "name": "Path",
        "args": { "pattern": "/api/internal/config/get,/api/internal/dict/item,/api/internal/dict/list,/api/internal/app/validate" }
      }
    ],
    "order": -2
  },
  {
    "id": "ydsz-userinfo",
    "uri": "lb://ydsz-userinfo",
    "predicates": [
      {
        "name": "Path",
        "args": {
          "pattern": "/api/auth/**,/api/user/**,/api/company/**,/api/dept/**,/api/menu/**,/api/post/**,/api/role/**,/api/language/**,/api/oauth2/**,/api/userinfo/**,/api/profile/**,/api/captcha/**,/api/self-service/**,/api/webauthn/**,/api/sso/**,/api/auth-policy/**,/api/devices/**,/api/social-client-config/**,/api/saml-idp-config/**,/api/admin/**,/saml/**,/cas/**,/scim/**,/.well-known/**,/api/internal/**"
        }
      }
    ],
    "order": 0
  },
  {
    "id": "ydsz-workflow",
    "uri": "lb://ydsz-workflow",
    "predicates": [
      {
        "name": "Path",
        "args": { "pattern": "/api/workflow/**" }
      }
    ],
    "order": 0
  },
  {
    "id": "ydsz-system",
    "uri": "lb://ydsz-system",
    "predicates": [
      {
        "name": "Path",
        "args": {
          "pattern": "/api/config/**,/api/dict/**,/api/app/**,/api/variable/**,/api/system/**,/api/tenant/**,/api/tenant-plan/**"
        }
      }
    ],
    "order": 0
  },
  {
    "id": "ydsz-message",
    "uri": "lb://ydsz-message",
    "predicates": [
      {
        "name": "Path",
        "args": { "pattern": "/api/message/**" }
      }
    ],
    "metadata": {
      "response-timeout": 300000
    },
    "order": 0
  },
  {
    "id": "ydsz-cronjob",
    "uri": "lb://ydsz-cronjob",
    "predicates": [
      {
        "name": "Path",
        "args": { "pattern": "/api/cronjob/**,/cronjob/*.html" }
      }
    ],
    "order": 0
  },
  {
    "id": "ydsz-literule",
    "uri": "lb://ydsz-literule",
    "predicates": [
      {
        "name": "Path",
        "args": { "pattern": "/api/literule/**" }
      }
    ],
    "order": 0
  },
  {
    "id": "ydsz-agent",
    "uri": "lb://ydsz-agent",
    "predicates": [
      {
        "name": "Path",
        "args": { "pattern": "/api/agent/**" }
      }
    ],
    "metadata": {
      "response-timeout": 120000
    },
    "order": 0
  },
  {
    "id": "ydsz-nextwiki",
    "uri": "lb://ydsz-nextwiki",
    "predicates": [
      {
        "name": "Path",
        "args": { "pattern": "/api/nextwiki/**" }
      }
    ],
    "order": 0
  }
]