# ==================== CORS ====================
gateway.cors.wildcard_origin_blocked=CORS 安全违规：allowCredentials=true 时禁止使用通配符 Origin (*)，必须在 ydsz.gateway.cors.allowed-origin 中配置单一可信来源
gateway.cors.origin_required=CORS 安全违规：allowCredentials=true 时 allowed-origin 不能为空，必须配置单一可信来源

# ==================== IP Access Control ====================
gateway.ip_control.invalid_failmode=IP 访问控制配置非法：blacklistFailMode 必须为 fail-open 或 fail-closed，当前值={0}
