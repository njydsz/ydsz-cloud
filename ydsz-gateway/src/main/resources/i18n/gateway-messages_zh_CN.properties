# ==================== CORS ====================
gateway.cors.wildcard_origin_blocked=CORS 安全违规：allowCredentials=true 时禁止裸通配符 Origin (*)（http://localhost:* 这类带 scheme 的端口通配不在禁止范围），请在 ydsz.gateway.cors.allowed-origin 中配置可信来源
gateway.cors.origin_required=CORS 安全违规：ydsz.gateway.cors.allowed-origin 未解析出任何有效来源（该键支持逗号分隔多值，如 http://localhost:5600,https://ydsz.example.com），CORS 过滤器拒绝带空来源启动

# ==================== IP Access Control ====================
gateway.ip_control.invalid_failmode=IP 访问控制配置非法：blacklistFailMode 必须为 fail-open 或 fail-closed，当前值={0}
