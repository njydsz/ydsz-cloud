# ==================== CORS ====================
gateway.cors.wildcard_origin_blocked=CORS security violation: bare wildcard Origin (*) is not allowed when allowCredentials=true (scheme-scoped port wildcards such as http://localhost:* remain allowed). Configure trusted origins in ydsz.gateway.cors.allowed-origin
gateway.cors.origin_required=CORS security violation: ydsz.gateway.cors.allowed-origin resolved to no usable origin (the key accepts comma-separated values, e.g. http://localhost:5600,https://ydsz.example.com); refusing to start with an empty origin list

# ==================== IP Access Control ====================
gateway.ip_control.invalid_failmode=IP access control configuration invalid: blacklistFailMode must be fail-open or fail-closed, current value={0}
