# =====================================================================
#  YDSZ · Gateway · DEV 环境配置（Nacos DataId）
#  --------------------------------------------------------------------
#  DataId:    ydsz-gateway-dev.yaml
#  Group:     dev
#  Profile:   dev
#  端口:      9000
#  说明:      跨环境共享配置见 ydsz-gateway-common.yaml（shared-configs 引入），
#              本文件仅保留环境特有配置。
# =====================================================================

server:
  port: 9000
  max-http-request-header-size: 16KB
  # P1-10: 响应压缩（节省 60-80% 带宽）
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024
  # P0-阶段二-8: 优雅停机（等待进行中的请求完成）
  shutdown: graceful
  # P1: 隐藏 Server 响应头，避免暴露 Reactor Netty 技术栈指纹
  netty:
    response:
      server-header: ""

spring:
  profiles: dev
  # P0-阶段二-8: 优雅停机超时（30s 内未完成则强制关闭）
  lifecycle:
    timeout-per-shutdown-phase: 30s

# =====================================================================
# YDSZ · Gateway · DEV 环境特有配置
# =====================================================================
ydsz:
  # DEV 开启文档（DocAutoConfiguration 开关，matchIfMissing=false）；
  # 缺失该键时 springdoc/knife4j 配置整体不加载
  doc:
    enabled: true
  # JSON 引擎配置（ydsz-common-json）
  json:
    enabled: true
    date-format: yyyy-MM-dd HH:mm:ss
    naming-strategy: LOWER_CAMEL_CASE
    write-nulls: false
    monitoring-enabled: true
    streaming-enabled: true
    warmup-classes:
      - com.njydsz.common.core.response.YdszResponse
      - org.springframework.cloud.gateway.route.RouteDefinition
  gateway:
    # P0-2: 内部头签名密钥（dev 环境回退到 JWT 密钥，生产环境必须通过环境变量注入）
    internal-sign-secret: ${YDSZ_GATEWAY_INTERNAL_SIGN_SECRET:${JWT_SECRET:}}
    # P2-1: CORS 单一可信来源（dev 环境允许本地开发服务器）
    cors:
      allowed-origin: ${YDSZ_GATEWAY_CORS_ALLOWED_ORIGIN:http://localhost:5173}
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
      allowed-headers: "*"
      exposed-headers: X-Trace-Id,X-Request-Id,X-RateLimit-Limit,X-RateLimit-Remaining,X-RateLimit-Reset,X-RateLimit-Reset-Time,Retry-After,X-Gray-Hit,X-API-Version
      allow-credentials: true
      max-age-seconds: 3600
      enabled: true
    # P0-4: WebSocket Origin 白名单（dev 环境不校验 Origin）
    websocket:
      allowed-origins: ${YDSZ_GATEWAY_WS_ALLOWED_ORIGINS:}
      max-connections-per-user: 5
      max-connections-per-ip: 20
      counter-ttl-seconds: 3600
    # P0-阶段二-6: HttpClient 连接池配置（dev 环境默认 500）
    httpclient:
      pool:
        max-connections: 500

# Sentinel 集成（dev 环境配置，生产环境通过 Nacos 覆盖）
spring.cloud.sentinel:
  enabled: true
  # 饥饿加载（启动时即连接 Sentinel Dashboard，避免首请求漏控）
  eager: true
  # Sentinel Dashboard 地址
  transport:
    port: 8719
    dashboard: ${SENTINEL_DASHBOARD_ADDR:127.0.0.1:8858}
  # 规则持久化：从 Nacos 加载流控/熔断/系统规则
  datasource:
    ds-flow:
      nacos:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ydsz}
        data-id: ${spring.application.name}-sentinel-flow-rules
        group-id: SENTINEL_GROUP
        data-type: json
        rule-type: flow
    ds-degrade:
      nacos:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ydsz}
        data-id: ${spring.application.name}-sentinel-degrade-rules
        group-id: SENTINEL_GROUP
        data-type: json
        rule-type: degrade
  # 日志配置
  log:
    dir: ${LOG_PATH:./logs}/sentinel
    switch-pid: true
  # 指标配置（与 Prometheus 集成）
  metric:
    file-single-size: 52428800
    file-total-count: 6

# Sentinel 流控网关参数（自定义扩展，非 Spring Cloud Alibaba 标准配置）
ydsz:
  sentinel:
    gateway:
      enabled: true
      # 系统保护开关
      system-protection:
        enabled: true
        # 系统最大负载阈值（-1 表示自动检测）
        highest-system-load: -1.0
        # 入口总 QPS 阈值（超过后拒绝所有请求）
        max-qps: 5000
        # CPU 使用率阈值（百分比，超过后触发系统保护）
        highest-cpu-usage: 80.0
      # 降级响应时间（ms）
      fallback-timeout: 3000

# 日志级别（dev 环境开 DEBUG）
logging:
  level:
    root: INFO
    "[com.njydsz]": DEBUG
    "[org.springframework.cloud.gateway]": INFO
    "[com.alibaba.csp.sentinel]": INFO

# SpringDoc / Knife4j dev 环境开启（开关见上方 ydsz.doc.enabled）
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
knife4j:
  production: false

# Actuator 暴露端点
management:
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: when-authorized
      group:
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState
            - ping
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
