# =====================================================================
#  YDSZ · Gateway · DEV 环境配置（Nacos DataId）
#  --------------------------------------------------------------------
#  DataId:    ydsz-gateway-dev.yaml
#  Group:     dev
#  Profile:   dev
#  端口:      9000
#  说明:      Nacos 配置中心加载此文件后等价于 application.yml，
#             配合 bootstrap.yml 完成启动。
# =====================================================================

server:
  port: 9000
  max-http-request-header-size: 16KB
  # P1-10: 响应压缩（节省 60-80% 带宽）
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024
  # P0-阶段二-8: 优雅停机（等待进行中的请求完成）
  shutdown: graceful
  # P1: 隐藏 Server 响应头，避免暴露 Reactor Netty 技术栈指纹
  netty:
    response:
      server-header: ""

spring:
  profiles: dev
  # P0-阶段二-8: 优雅停机超时（30s 内未完成则强制关闭）
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:*}
            allowedMethods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
            allowedHeaders: "Authorization,Content-Type,X-Requested-With,X-Access-Token,X-Trace-Id,X-Gray-Tag"
            exposedHeaders:
              - Authorization
              - X-Trace-Id
              - Content-Disposition
            allowCredentials: true
            maxAge: 3600
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        # P0-4: 请求体大小限制 10MB（防 DoS）
        - RequestSize=10485760
        # P0-阶段二-5: 网关层重试（仅对 GET 幂等请求重试，避免非幂等请求重复执行）
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,SERVICE_UNAVAILABLE
            methods: GET,OPTIONS
            backoff:
              firstBackoff: 100ms
              maxBackoff: 500ms
              factor: 2
              basedOnPreviousValue: true
      # P0-3: 连接超时 + 响应超时（防雪崩）
      httpclient:
        connect-timeout: 3000
        response-timeout: 30s
        websocket:
          max-frame-payload-length: 65536
    loadbalancer:
      configurations: gray
      nacos:
        enabled: true

# =====================================================================
# YDSZ · Gateway · P0 安全配置（P0-2 / P0-4 / P0-6）
# =====================================================================
ydsz:
  # JSON 引擎配置（ydsz-common-json）
  json:
    enabled: true
    date-format: yyyy-MM-dd HH:mm:ss
    naming-strategy: LOWER_CAMEL_CASE
    write-nulls: false
    monitoring-enabled: true
    streaming-enabled: true
    warmup-classes:
      - com.njydsz.common.core.response.BaseResponse
      - org.springframework.cloud.gateway.route.RouteDefinition
  gateway:
    # P0-2: 内部头签名密钥（与 JWT 密钥分离，避免单密钥泄漏导致整体信任链破裂）
    # ⚠️ 生产环境必须通过 YDSZ_GATEWAY_INTERNAL_SIGN_SECRET 环境变量注入强随机密钥（≥32 字节）
    # 开发环境如未配置，自动回退到 ydsz.jwt.secret（仅用于本地调试）
    internal-sign-secret: ${YDSZ_GATEWAY_INTERNAL_SIGN_SECRET:${JWT_SECRET:}}
    # P0-4: WebSocket Origin 白名单（防跨域 WebSocket 劫持）
    # 逗号分隔，支持通配符（如 https://*.ydsz.example.com）
    # dev 环境为空表示不校验 Origin；prod 环境必须配置可信域
    websocket:
      allowed-origins: ${YDSZ_GATEWAY_WS_ALLOWED_ORIGINS:}
    # P2-2: 响应缓存 + 审计日志
    filter:
      response-cache: true    # GET 响应缓存（Redis，默认 TTL 60s）
      audit-log: true         # 安全审计日志
      rate-limit: true        # 令牌桶限流
      gray-loadbalancer: true # 灰度路由
      w3c-trace: true         # W3C Trace Context
      ip-blacklist: true      # IP 黑名单
      ip-whitelist: false     # IP 白名单
      auth: true              # JWT 鉴权
      api-key: false          # API Key 认证
      websocket-auth: true    # WebSocket 鉴权
      payload-validation: true # 请求体校验
      api-version: true       # API 版本头
    # P2-1: 插件系统（Groovy 热脚本）
    plugin:
      enabled: false           # 默认关闭，需手动启用
      watch-path: ./plugins    # 插件目录
      reload-interval: 5000    # 扫描间隔（毫秒）
    # P0-阶段二-6: HttpClient 连接池配置
    httpclient:
      pool:
        max-connections: 500
        pending-acquire-timeout-ms: 45000
        max-idle-time-seconds: 30
        max-life-time-seconds: 60
        eviction-interval-seconds: 60
    # P0-阶段二-7: K8s health probe 路径放行
    health-probe:
      paths:
        - /actuator/health
        - /actuator/health/liveness
        - /actuator/health/readiness
        - /actuator/info
    # P1-3: API Key 认证配置（外部系统接入）
    api-key:
      enabled: ${YDSZ_GATEWAY_API_KEY_ENABLED:false}
      keys: ${YDSZ_GATEWAY_API_KEYS:}
      protected-paths: /api/project/**,/api/workflow/**
    # P1-8: 请求体安全校验配置
    payload-validation:
      enabled: true
      max-body-size-mb: 10
      max-json-depth: 50
      strict-content-type: true

# 日志级别（dev 环境开 DEBUG）
logging:
  level:
    root: INFO
    "[com.njydsz]": DEBUG
    "[org.springframework.cloud.gateway]": INFO

# SpringDoc / Knife4j dev 环境开启
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
knife4j:
  production: false

# Actuator 暴露端点
management:
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: when-authorized
      # P0-阶段二-7: K8s 探针分组（liveness / readiness）
      group:
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState
            - ping
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
