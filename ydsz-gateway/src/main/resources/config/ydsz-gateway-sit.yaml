# =====================================================================
#  YDSZ · Gateway · SIT 环境配置（Nacos DataId）
#  --------------------------------------------------------------------
#  DataId:    ydsz-gateway-sit.yaml
#  Group:     sit
#  Profile:   sit
#  端口:      9000
# =====================================================================

server:
  port: 9000
  max-http-request-header-size: 16KB
  # P1-10: 响应压缩（节省 60-80% 带宽）
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024
  # P0-阶段二-8: 优雅停机（等待进行中的请求完成）
  shutdown: graceful
  # P1: 隐藏 Server 响应头，避免暴露 Reactor Netty 技术栈指纹
  netty:
    response:
      server-header: ""

spring:
  profiles: sit
  # P0-阶段二-8: 优雅停机超时（30s 内未完成则强制关闭）
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      # P2-1 安全修复：globalcors 已移除，CORS 改由 ydsz.gateway.cors.allowed-origin 单一可信来源控制
      # 避免 CorsWebFilter 与 globalcors 双重注册导致行为不确定
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        # P0-4: 请求体大小限制 10MB（防 DoS）
        - RequestSize=10485760
        # P0-阶段二-5: 网关层重试（仅对 GET 幂等请求重试，避免非幂等请求重复执行）
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,SERVICE_UNAVAILABLE
            methods: GET,OPTIONS
            backoff:
              firstBackoff: 100ms
              maxBackoff: 500ms
              factor: 2
              basedOnPreviousValue: true
      # P0-3: 连接超时 + 响应超时（防雪崩）
      httpclient:
        connect-timeout: 3000
        response-timeout: 30s
        websocket:
          max-frame-payload-length: 65536
    loadbalancer:
      configurations: gray
      nacos:
        enabled: true

# =====================================================================
# YDSZ · Gateway · P0 安全配置（P0-2 / P0-4 / P0-6）
# =====================================================================
ydsz:
  gateway:
    # P0-2: 内部头签名密钥（与 JWT 密钥分离）
    # SIT 环境通过 YDSZ_GATEWAY_INTERNAL_SIGN_SECRET 环境变量注入
    internal-sign-secret: ${YDSZ_GATEWAY_INTERNAL_SIGN_SECRET:${JWT_SECRET:}}
    # P2-1: CORS 单一可信来源（与凭据模式互斥校验）
    cors:
      allowed-origin: ${YDSZ_GATEWAY_CORS_ALLOWED_ORIGIN:https://sit.example.com}
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
      allowed-headers: Authorization,Content-Type,X-Requested-With,X-Trace-Id,X-Gray-Tag
      exposed-headers: X-Trace-Id,Content-Disposition
      allow-credentials: true
      max-age-seconds: 3600
      enabled: true
    # P0-4: WebSocket Origin 白名单
    websocket:
      allowed-origins: ${YDSZ_GATEWAY_WS_ALLOWED_ORIGINS:https://sit.example.com}
    # P0-阶段二-6: HttpClient 连接池配置
    httpclient:
      pool:
        max-connections: 500
        pending-acquire-timeout-ms: 45000
        max-idle-time-seconds: 30
        max-life-time-seconds: 60
        eviction-interval-seconds: 60
    # P0-阶段二-7: K8s health probe 路径放行
    health-probe:
      paths:
        - /actuator/health
        - /actuator/health/liveness
        - /actuator/health/readiness
        - /actuator/info

# 日志级别（sit 环境 INFO）
logging:
  level:
    root: INFO
    "[com.njydsz]": INFO
    "[org.springframework.cloud.gateway]": INFO

# SIT 关闭 Knife4j 文档 UI（防止外泄）
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false
knife4j:
  production: true

management:
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: when-authorized
      # P0-阶段二-7: K8s 探针分组（liveness / readiness）
      group:
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState
            - ping
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
