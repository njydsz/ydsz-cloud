# =====================================================================
#  YDSZ · Gateway · SIT 环境配置（Nacos DataId）
#  --------------------------------------------------------------------
#  DataId:    ydsz-gateway-sit.yaml
#  Group:     sit
#  Profile:   sit
#  端口:      9000
#  说明:      跨环境共享配置见 ydsz-gateway-common.yaml（shared-configs 引入），
#              本文件仅保留环境特有配置。
# =====================================================================

server:
  port: 9000
  max-http-request-header-size: 16KB
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024
  shutdown: graceful
  netty:
    response:
      server-header: ""

spring:
  profiles: sit
  lifecycle:
    timeout-per-shutdown-phase: 30s

# =====================================================================
# YDSZ · Gateway · SIT 环境特有配置
# =====================================================================
ydsz:
  auth:
    token:
      # JWT 签名密钥仅由环境变量注入（与 ydsz-userinfo 一致），缺失时启动失败
      secret-key: ${YDSZ_JWT_SECRET:}
  gateway:
    # 内部头签名密钥：禁止回退到 JWT 密钥（密钥用途需域分离）
    internal-sign-secret: ${YDSZ_GATEWAY_INTERNAL_SIGN_SECRET:}
    cors:
      allowed-origin: ${YDSZ_GATEWAY_CORS_ALLOWED_ORIGIN:https://sit.example.com}
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
      allowed-headers: Authorization,Content-Type,X-Requested-With,X-Trace-Id,X-Gray-Tag
      exposed-headers: X-Trace-Id,Content-Disposition
      allow-credentials: true
      max-age-seconds: 3600
      enabled: true
    websocket:
      allowed-origins: ${YDSZ_GATEWAY_WS_ALLOWED_ORIGINS:https://sit.example.com}
    httpclient:
      pool:
        max-connections: 500

# 日志级别（sit 环境 INFO）
logging:
  level:
    root: INFO
    "[com.njydsz]": INFO
    "[org.springframework.cloud.gateway]": INFO

# SIT 关闭 Knife4j 文档 UI（防止外泄）
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false
knife4j:
  production: true

# P0-S3：/actuator/** 不经网关鉴权过滤器；gateway 端点可改写路由定义（SCG SpEL RCE 家族
# 入口，如 CVE-2022-22947），共享环境一律关闭，路由变更走 Nacos gateway-routes.json。
management:
  endpoint:
    gateway:
      enabled: false
    health:
      # always 会外泄数据库类型/校验语句、磁盘路径、PID、堆内存指纹
      show-details: ${YDSZ_HEALTH_SHOW_DETAILS:when-authorized}
      group:
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState
            - ping
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
