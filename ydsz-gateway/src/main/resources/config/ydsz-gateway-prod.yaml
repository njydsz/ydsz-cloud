# =====================================================================
#  YDSZ · Gateway · PROD 环境配置（Nacos DataId）
#  --------------------------------------------------------------------
#  DataId:    ydsz-gateway-prod.yaml
#  Group:     prod
#  Profile:   prod
#  端口:      9000 (HTTPS)
#  说明:      跨环境共享配置见 ydsz-gateway-common.yaml（shared-configs 引入），
#              本文件仅保留环境特有配置。
# =====================================================================

server:
  port: 9000
  max-http-request-header-size: 16KB
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024
  shutdown: graceful
  # P0-阶段二-9: 仅 HTTPS 通信（生产环境强制 TLS）
  ssl:
    enabled: ${SSL_ENABLED:true}
    key-store: ${SSL_KEYSTORE_PATH:classpath:keystore/ydsz-gateway.p12}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:}
    key-store-type: PKCS12
    key-alias: ${SSL_KEY_ALIAS:ydsz-gateway}
    enabled-protocols: TLSv1.2,TLSv1.3
    ciphers: TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256,ECDHE-RSA-AES256-GCM-SHA384,ECDHE-RSA-AES128-GCM-SHA256
  netty:
    response:
      server-header: ""
    connection-timeout: 5s

spring:
  profiles: prod
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    gateway:
      # PROD 关闭自动服务发现路由（仅使用 Nacos 显式路由）
      discovery:
        locator:
          enabled: false

# =====================================================================
# YDSZ · Gateway · PROD 环境特有配置
# =====================================================================
ydsz:
  gateway:
    # P0-2: 内部头签名密钥（生产环境必须通过环境变量注入强随机密钥）
    internal-sign-secret: ${YDSZ_GATEWAY_INTERNAL_SIGN_SECRET:}
    # P2-1: CORS 单一可信来源（生产环境禁止通配符）
    cors:
      allowed-origin: ${YDSZ_GATEWAY_CORS_ALLOWED_ORIGIN:https://ydsz.example.com}
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
      allowed-headers: Authorization,Content-Type,X-Requested-With,X-Trace-Id,X-Gray-Tag
      exposed-headers: X-Trace-Id,Content-Disposition
      allow-credentials: true
      max-age-seconds: 3600
      enabled: true
    # P0-4: WebSocket Origin 白名单（生产环境必须配置）
    websocket:
      allowed-origins: ${YDSZ_GATEWAY_WS_ALLOWED_ORIGINS:https://ydsz.example.com}
    # P0-阶段二-6: HttpClient 连接池配置（prod 1000）
    httpclient:
      pool:
        max-connections: 1000

# 日志级别（prod 环境仅 INFO/WARN/ERROR）
logging:
  level:
    root: WARN
    "[com.njydsz]": INFO
    "[org.springframework.cloud.gateway]": WARN

# 生产环境关闭 Knife4j 文档 UI（防止接口泄露）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
knife4j:
  production: true

management:
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: when-authorized
      group:
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState
            - ping
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
