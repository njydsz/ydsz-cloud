# =====================================================================
#  YDSZ 工作流服务 bootstrap 配置
#  --------------------------------------------------------------------
#  端口：9005
#  职责：自研轻量流程引擎
#    - 流程定义（YDSZ-Flow XML / JSON）
#    - 流程发起 / 审批 / 驳回 / 加签 / 减签 / 转交
#    - 抄送 / 委托 / 代理 / 跳过规则
#    - 定时器 / 事件订阅 / SLA 提醒
#    - 流程审计 / 流程归档 / 灰度发布（canary）
#  依赖：Nacos 服务发现 / 配置中心、PostgreSQL、Redis
#  说明：bootstrap.yml 在 application.yml 之前加载，用于提前连接 Nacos
#  平台约束：仅适配 PC Web 端，不支持移动端 / 独立 H5（详见根 README 7.4）
# =====================================================================

server:
  # HTTP 监听端口（按构建顺序 6/10）
  port: 9005
  max-http-request-header-size: 16KB
  servlet:
    context-path: /

spring:
  application:
    name: ydsz-workflow
  profiles:
    # 默认 dev，可通过 -Dspring.profiles.active=dev|sit|uat|prod 或 ENV SPRING_PROFILES_ACTIVE 覆盖
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    web-application-type: servlet
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      # ---------- 服务注册 ----------
      discovery:
        enabled: true
        register-enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ydsz}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        metadata:
          version: 1.0.0
          port: 9005
        ip-type: IPv4
      # ---------- 配置中心 ----------
      config:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ydsz}
        group: ${NACOS_GROUP:${spring.profiles.active}}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yaml
        refresh-enabled: true
        shared-configs:
          - data-id: ydsz-common.yaml
            group: ${spring.profiles.active}
            refresh: true

# P0: JDBC 安全加固（ydsz-common-jdbc）
ydsz:
  jdbc:
    # SQL 防火墙：拦截 DDL（DROP/TRUNCATE）、无 WHERE 写操作、多语句注入、GRANT/REVOKE
    sql-firewall:
      enabled: true
      block-drop-table: true
      block-truncate: true
      block-delete-without-where: true
      block-update-without-where: true
      block-multi-statement: true
      block-permission-ops: true
    # 分页安全上限：防止 pageSize=999999 导致全表扫描 OOM
    pagination:
      max-limit: 500
    # P1: 慢 SQL 全局检测
    slow-sql:
      enabled: true
      threshold-millis: 500
      alert-threshold-millis: 2000
    # P2: SQL 审计（写操作落盘备查）
    sql-audit:
      enabled: true
      audit-select: false
      audit-insert: true
      audit-update: true
      audit-delete: true
      log-parameters: true
      max-parameter-length: 500
