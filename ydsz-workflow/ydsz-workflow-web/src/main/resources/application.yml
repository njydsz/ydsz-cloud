# YDSZ 工作流服务本地配置
# 公共配置（mybatis-plus.configuration / global-config / management / springdoc / datasource / redis）
# 由 Nacos 共享配置 ydsz-common.yaml 提供，此处仅保留服务私有配置与 override

# MyBatis-Plus override：在默认路径基础上追加 flow 子目录
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml,classpath*:mapper/flow/**/*.xml

# P0-1: 统一线程池配置（ydsz-common-thread）
ydsz:
  # P1-1: 多租户 MULTI 模式试点（集团+公司+部门三级隔离）
  tenant:
    enabled: true
    mode: MULTI
    super-tenant-id: "0"
    system-tenant-id: "0"
    tenant-fields:
      - column: tenant_id
        claim: tenantId
        header: X-Tenant-Id
      - column: company_id
        claim: companyId
        header: X-Company-Ids
      - column: dept_id
        claim: deptId
        header: X-Dept-Ids
        multi-value: true
    ignore-tables: [ydsz_tenant, ydsz_tenant_plan, ydsz_dict, ydsz_dict_data]
    anon-urls: [/auth/login, /auth/register, /workflow/anonymous/**]
  thread:
    enabled: true
    pools:
      flowQueue:
        core-size: 2
        max-size: 8
        queue-capacity: 256
        thread-name-prefix: flow-queue-
        reject-policy: CALLER_RUNS
        await-termination-seconds: 10
  # P1-1: 分布式事务配置（当前未启用，TC 地址未配置时禁用，避免运行时降级 LOCAL 模式的反模式）
  # 如需启用，请配置 seata.enabled=true 并提供完整的 TC 客户端配置（vgroup-mapping / grouplist）
  seata:
    enabled: false
    default-type: LOCAL
    tcc-enabled: false
    saga-enabled: false
    seata-at-enabled: false
    tcc-log-store: memory
  # P0-1: YdszJson ASM 预热（高频序列化 Bean，消除首次请求延迟尖峰）
  # P2-3: 启用流式输出（流程定义/实例列表等大 JSON 响应使用 chunked encoding）
  json:
    # P1-1: 流程条件表达式涉及金额数值比较，必须开启 BigDecimal 精度模式
    use-big-decimal: true
    # P0-1: YdszJson ASM 预热（高频序列化 Bean，消除首次请求延迟尖峰）
    # 注意：实体类位于 com.njydsz.workflow.infra.entity 包下，使用 DO 后缀
    warmup-classes:
      - com.njydsz.workflow.infra.entity.FlowDefinitionDO
      - com.njydsz.workflow.infra.entity.FlowInstanceDO
      - com.njydsz.workflow.infra.entity.FlowNodeDO
      - com.njydsz.workflow.infra.entity.FlowRunTaskDO
      - com.njydsz.workflow.infra.entity.FlowHisTaskDO
      - com.njydsz.workflow.infra.entity.FlowHisInstanceDO
      - com.njydsz.workflow.infra.entity.FlowTemplateDO
      - com.njydsz.workflow.infra.entity.FlowAuditLogDO
    streaming-enabled: true

  # P0: JDBC 安全加固（ydsz-common-jdbc）
  jdbc:
    # SQL 防火墙：拦截 DDL（DROP/TRUNCATE）、无 WHERE 写操作、多语句注入、GRANT/REVOKE
    sql-firewall:
      enabled: true
      block-drop-table: true
      block-truncate: true
      block-delete-without-where: true
      block-update-without-where: true
      block-multi-statement: true
      block-permission-ops: true
    # 分页安全上限：防止 pageSize=999999 导致全表扫描 OOM
    pagination:
      max-limit: 500
    # P1: 慢 SQL 全局检测
    slow-sql:
      enabled: true
      threshold-millis: 500
      alert-threshold-millis: 2000
    # P2: SQL 审计（写操作落盘备查）
    sql-audit:
      enabled: true
      audit-select: false
      audit-insert: true
      audit-update: true
      audit-delete: true
      log-parameters: true
      max-parameter-length: 500

